<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>添加任务 · todo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; background: linear-gradient(180deg, #F8FAFC 0%, #E8EDF3 100%); color: #0F172A; height: 100vh; overflow: hidden; }
    /* status bar removed */
    .sheet { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.1); }
    .cat-chip { padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; background: rgba(255,255,255,0.7); color: #4B5563; display: flex; align-items: center; gap: 6px; transition: all 0.2s; cursor: pointer; }
    .cat-chip.active { background: #0F172A; color: white; }
    .cat-chip .dot { width: 8px; height: 8px; border-radius: 50%; }
    .row { background: rgba(255, 255, 255, 0.75); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    input[type="text"], input[type="time"] { background: transparent; outline: none; border: none; font-size: 15px; color: #0F172A; flex: 1; }
    input::placeholder { color: #9CA3AF; }
  </style>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink: '#0F172A', brand: '#84A98C' } } } }
  </script>
<script src="refresh.js"></script>
</head>
<body>
  <!-- Dimmed background -->
  <div class="absolute inset-0 bg-ink/30" style="backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);"></div>

  <!-- Sheet -->
  <div class="absolute bottom-0 left-0 right-0 sheet rounded-t-[32px] pt-2 pb-8 px-5" style="height: 88vh; display: flex; flex-direction: column;">
    <div class="flex justify-center pt-1.5 pb-3 shrink-0">
      <div class="w-10 h-1 rounded-full bg-gray-300"></div>
    </div>

    <div class="flex items-center justify-between mb-4 shrink-0">
      <button onclick="cancel()" class="text-[14px] text-gray-500 font-medium">取消</button>
      <h2 class="text-[15px] font-semibold">新建任务</h2>
      <button onclick="save()" id="saveBtn" class="text-[14px] text-gray-300 font-semibold">保存</button>
    </div>

    <!-- Title input -->
    <div class="row shrink-0">
      <i class="fas fa-pen text-gray-400 text-sm"></i>
      <input type="text" id="titleInput" placeholder="想做什么？" maxlength="50" autofocus>
    </div>

    <!-- Quick chips -->
    <div class="mt-3 flex gap-2 overflow-x-auto pb-1 shrink-0">
      <button class="cat-chip" data-quick="晨间冥想 10 分钟"><i class="fas fa-spa text-plum-400" style="color:#9D8189"></i>冥想</button>
      <button class="cat-chip" data-quick="喝一杯水"><i class="fas fa-droplet" style="color:#B5C7E8"></i>喝水</button>
      <button class="cat-chip" data-quick="阅读 30 分钟"><i class="fas fa-book" style="color:#D4A574"></i>阅读</button>
      <button class="cat-chip" data-quick="散步 30 分钟"><i class="fas fa-person-walking" style="color:#84A98C"></i>散步</button>
      <button class="cat-chip" data-quick="回复邮件"><i class="fas fa-envelope" style="color:#9CA3AF"></i>邮件</button>
    </div>

    <div class="mt-4 space-y-2.5 overflow-y-auto flex-1 pb-2">
      <div class="row">
        <i class="far fa-clock text-gray-500 text-sm"></i>
        <span class="text-[13px] text-gray-500">时间（可选）</span>
        <input type="time" id="timeInput" class="ml-auto text-right">
      </div>

      <div class="row flex-col items-stretch gap-2.5">
        <div class="flex items-center gap-2.5">
          <i class="fas fa-tag text-gray-500 text-sm"></i>
          <span class="text-[13px] text-gray-500">分类</span>
        </div>
        <div class="flex flex-wrap gap-2" id="catChips">
          <button class="cat-chip" data-cat="work"><span class="dot" style="background:#84A98C"></span>工作</button>
          <button class="cat-chip" data-cat="life"><span class="dot" style="background:#D4A574"></span>生活</button>
          <button class="cat-chip" data-cat="health"><span class="dot" style="background:#B5C7E8"></span>健康</button>
          <button class="cat-chip" data-cat="study"><span class="dot" style="background:#9D8189"></span>学习</button>
          <button class="cat-chip" data-cat="other"><span class="dot" style="background:#9CA3AF"></span>其他</button>
        </div>
      </div>
    </div>

    <button onclick="save()" id="saveBtnBottom" class="w-full bg-ink text-white py-4 rounded-2xl font-semibold text-[15px] active:scale-95 transition-transform shadow-lg mt-3 shrink-0 opacity-50 pointer-events-none">添加到今日</button>
  </div>

  <script>
    let category = 'other';
    const STORAGE_KEY = 'todo_tasks_v1';

    function loadTasks() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    function saveTasks(t) { localStorage.setItem(STORAGE_KEY, JSON.stringify(t)); }

    // Wire up category chips
    document.querySelectorAll('#catChips .cat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#catChips .cat-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        category = chip.dataset.cat;
      });
    });

    // Quick suggestions
    document.querySelectorAll('[data-quick]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('titleInput').value = btn.dataset.quick;
        updateSaveState();
      });
    });

    function updateSaveState() {
      const hasTitle = document.getElementById('titleInput').value.trim().length > 0;
      const btn = document.getElementById('saveBtnBottom');
      const topBtn = document.getElementById('saveBtn');
      if (hasTitle) {
        btn.classList.remove('opacity-50', 'pointer-events-none');
        topBtn.classList.remove('text-gray-300');
        topBtn.classList.add('text-ink');
      } else {
        btn.classList.add('opacity-50', 'pointer-events-none');
        topBtn.classList.add('text-gray-300');
        topBtn.classList.remove('text-ink');
      }
    }
    document.getElementById('titleInput').addEventListener('input', updateSaveState);

    function cancel() { window.location.href = 'home.html'; }
    function save() {
      const title = document.getElementById('titleInput').value.trim();
      if (!title) return;
      const time = document.getElementById('timeInput').value || null;
      const tasks = loadTasks();
      tasks.push({
        id: 't-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        title, time, category, createdAt: Date.now()
      });
      saveTasks(tasks);
      window.location.href = 'home.html';
    }
  </script>
</body>
</html>
