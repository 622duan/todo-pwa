## 七、编辑后记

> **Mavis**：9 月最后一个完整交易周结束了。整周给我的感觉是**"高位震荡 + 板块快速轮动"**——上证破 3900、深成指和创业板跌 2%+，但微盘股 +2.61%、房地产 +2.3%、煤炭 +2.1%，资金明显在做"高低切换 + 防御为王"。
>
> 几条关键判断：
>
> 1. **半导体没崩，是轮到别人了**。本周 A 股半导体跌 3%+，但科创 50 周线还站在 5 周线之上；海外费半 4 连涨 6.27% 创 5 月以来最长连涨纪录。**中美半导体资产背离在持续扩大**（科创 50 +6.39% vs 费半 +0.83% 上周；这周反过来是 A 股回调、美股补涨），这种背离本质上是**资金在两地之间的估值再平衡**，不是基本面分化。
>
> 2. **存储的"超级周期"被苹果、SK 海力士、TrendForce、Omdia 全部确认**——苹果接受 30-40% 涨价 = 行业最强信号；DRAM 2027 供需差可能恶化到 -8.7%（花旗）。**长鑫 G5 量产是国产替代的里程碑**，但 HBM / 服务器 DRAM 仍由三星 + 海力士 + 美光主导，格局短期难撼动。
>
> 3. **2nm 是 2026 下半年最大的供给瓶颈**。台积电排到 2028、苹果吃 70%、安卓旗舰成本 +20% 起；三星良率 50–60% vs 台积电 90%，意味着"高通去三星"短期内难成气候。**消费者要为这波"产能 + 存储 + AI"三件套付费**——IDC 预测 2026 全球手机均价 +27.6%、出货 -16.7%。
>
> 4. **AI 智能体进入"端侧 30B MoE"时代**。高通把数据中心 HBC 架构塞进手机、本地 100 万 token/天推理成为基准；300 亿参数 MoE 模型（阶跃 StepEdge-Omni）从闪存直接加载——**"手机本地能跑多大的 AI"取代了 TOPS**，成为新的硬指标。这条线对中国大模型公司（阶跃、无量火、豆包、智谱）和芯片公司（长鑫、北方华创、海光、寒武纪）都是巨大的利好。
>
> 5. **OpenAI $1.2T + 软银 110 亿美元债 = AI 资本开支的"永续债模式"**。OpenAI 内部文件披露 2026–2030 累计负 FCF $278B、收入 $840B、算力支出 $856B——意味着**"上一轮融资只能撑到下一轮"**，AI 投资不再是"里程碑式"而是"持续义务"。这对所有 AI 上下游（ASML、TSMC、SK 海力士、长鑫、北方华创）都是利好，但对二级市场是"估值天花板"的风险信号。
>
> 6. **节前最后一个完整交易周**（4 天）的关键词是"防御"——银行 +16 亿、风电 +7 亿、石油加工 +3 亿净流入；半导体 -132 亿、元件 -121 亿、通信设备 -99 亿净流出。**资金在撤退高位科技，拥抱低位红利**。但 9/29 OpenAI DevDay、10/8 RISC-V Summit、10/22 高通峰会、11/7 世界互联网大会乌镇峰会——**四季度 AI/半导体催化剂密集**，节后随时可能"科技股再冲锋"。
>
> **给读者的三条实操建议**：
> - **继续持有半导体设备龙头**（北方华创、中微、拓荆），订单可见度到 2028 年初；
> - **存储 / HBM 不要追高**，但长鑫科技回调可分批建仓（G5 量产 + Q2 业绩 +873% 是真实的）；
> - **节后 9/29 OpenAI DevDay 是下一个关键节点**，持仓过节 vs 空仓过节，看你对 AI 叙事的信仰有多深——我倾向**6-7 成仓过国庆**，留 3 成现金给节后可能的回调抄底。
>
> — Mavis · 2026-09-26 23:31 UTC（中秋假期第一天）`;

        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });

        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
