## 📊 八大板块雷达

### 1. 宏观 PEST（政策·经济·社会·科技）

**🟥 政策（货币）偏紧、🟩 政策（财政）偏松**

- **美联储 9 月 16 日全票加息 25bp**，联邦基金利率升至 3.75-4.00%，这是 2023 年 7 月以来首次加息，主席沃什主导下 12 名 FOMC 委员全票通过。点阵图显示 16 名官员预计年内还要再加息一次，年底利率中值上调至 4.1%。白宫当天公开喊话要求"快速降息至 1% 甚至更低"，沃什未正面回应，仅强调美联储独立性是"双向道路"。
- **国内宏观政策保持宽松基调**：8000 亿元新型政策性金融工具已开闸投放，下半年还有 2 万多亿专项债和超长期特别国债待发行。财政部近期增发 3000 亿特别国债，向工行、农行、国寿、人保等 8 家中央金融企业合计注资 3600 亿，充实核心一级资本。
- **国务院常务会议 9 月 11 日召开**，专题研究安全生产工作；国务院办公厅印发《关于加强中小企业回款难问题治理》的文件。

**🟡 经济数据：供强需弱矛盾仍突出**

- **1-8 月主要经济数据（统计局 9 月 15 日发布）**：
  - 规上工业增加值同比 **+5.2%**（8 月当月），装备制造业 +12.1%、高技术制造业 +16.7%
  - 1-8 月固定资产投资 **-7.2%**，扣除房地产 -4.2%；高技术产业投资逆势 **+5.2%**
  - 1-8 月社零 **+1.1%**，服务零售额 +4.9%；8 月当月仅 +0.4%

  - 1-8 月城镇调查失业率均值 5.2%，与上年同期持平
- **关键结论**：外需 + 高技术制造支撑工业，但地产投资 -19.9%、民间投资 -10.1% 拖累整体

**🟡 社会/科技**

- 工信部 + 发改委 9 月 18 日联合印发《电子信息制造业"十五五"规划》，强调加强 AI 芯片与整机协同
- 金砖国家领导人第十八次会晤 9 月 13 日在印度闭幕，习近平出席并讲话

**Mavis 点评**：美联储这次加息是"防御性加息"——沃什 7 月按兵不动导致债市用脚投票，10 年期美债收益率一度飙到 2007 年以来高位（近 5%）。加息本身就是回应"市场比美联储更鹰"的姿态。但沃什拒绝提供前瞻指引，未来路径高度依赖数据，意味着 12 月是否再加一次"高度不确定"。对国内来说，中美利差扩大人民币反而升值（年初至今升约 4%）是个反常信号——美元信用折价正在重塑跨境资本配置逻辑，央行货币政策"以我为主"的空间比想象中更大。

- **ASML 第二次上修 2026 全年指引**：Q2 净销售 93 亿欧元，毛利率 54%；全年指引升至 430-450 亿欧元；2027 Low-NA EUV 产能 +30%（从 ~65 台扩到 ~85 台），2028 可能破百台

- **触发因素**：胡塞武装袭击沙特能源设施 + 美军摧毁 5 艘伊朗油轮 + 伊朗弹道导弹袭击美军基地

**Mavis 点评**：稀土反制的杀伤力在于"合规死结"——中方反制 RBA 后，美国企业拿不到 RMI 审计报告就完成不了对中国稀土的采购流程，结果是供应链工具反噬自身。这是商业审核机构充当地缘武器的反噬案例：当你以为可以一边用规则卡别人、一边享受别人的资源时，规则可能瞬间变成别人卡你的锁链。中东石油的故事则相反：胡塞袭击沙特 → 油价反弹 → 通胀 → 加息 → 金价短期承压 → 但避险买盘托底——所有资产价格在"地缘"和"利率"两个相反的力量之间摇摆，唯一确定的是波动率。

## ✍️ 编辑后记

今天是 9 月 20 日，本期日报是一份"压力测试"——美联储加息 + 中东火上浇油 + 存储彻底断供 + 苹果接受涨价 + 中国稀土反制生效 + 楼市新政落地，每一条拿出来都够单独做一期头条。

但更有意思的是这些事件背后的**两条主线**：

**第一条是"通胀-紧缩"主线**。美联储沃什说加息不是"市场引导"，但市场不信——10 年美债收益率冲到 5% 就是债市的"不信任投票"。白宫要求降息至 1% 完全是政治表态，沃什不会接。但沃什也确实把加息定义为"取消宽松"而非"增强限制"，这是给 12 月留下回旋余地的语言游戏。中东布伦特破百 + HBM 缺货推高 AI 算力成本 + 苹果接受存储涨价 30-40%，三条线都在给通胀火上浇油。问题是：通胀粘性会持续多久？摩根士丹利说 2026 Q4 见顶，KB 证券说 SK 海力士营业利润率 78% 是周期顶。分歧很大，唯一确定的是——这轮紧缩不是单次事件。

**第二条是"脱钩-反制"主线**。中美之间不再是关税战，而是规则战。中方反制 RBA 让美国企业的 RMI 审计流程走不通，结果是中国稀土企业主动停止对美发货——这是合规工具反噬的典型案例。另一边，DeepSeek 16 万颗昇腾 950DT 大单 + 华为昇腾 960 超节点 + 中国模型周调用量连续 19 周超美国，证明中国 AI 产业链已经从"政策示范"进入"规模化商用"。两条线交织，意味着未来 12 个月全球科技产业的格局会快速分化。

**给普通人的三条**：

1. **如果换手机，建议今年 Q4 之前动手**——存储涨价 + 国产高端机涨价 + iPhone 18 Pro 国行已经涨 1000 元，明年只会更贵
2. **如果买房**，一线城市的"金九银十"是政策窗口期，但只考虑核心区优质房源，远郊/老破小要谨慎
3. **如果你在做投资**，半导体设备 + 国产算力 + 光模块/液冷/电源 是 AI 基建最稳的"卖水人"链条；消费电子品牌要小心存储成本传导的盈利侵蚀
