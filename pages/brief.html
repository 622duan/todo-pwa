🟡 9 月 PPI 冲到 5.0% 不是需求复苏，是**成本推动**——原油、有色、煤炭三条线贡献了 5.42pct 的上拉，而生活资料出厂价还在跌 0.1%，汽车制造业出厂价 -2.0%。CPI 0.9% 里，存储设备 +46.7% 贡献的其实是"AI 通胀"，不是消费需求回暖。所以这是**上游强、终端弱**的典型剪刀差形态：工业企业利润被上游吃掉（汽车业营收 +2.9% 但利润 -16.0%），中下游现金流在恶化。四季度 PPI 大概率继续上行到 5.5% 附近（申万赵伟），但这个数字越高，中游制造业越难受——**它是一个坏消息伪装成好消息的读数**。

📌 另一个被忽略的数：前三季固投 **-7.2%**、房地产开发投资 **-20.6%**，而 GDP 还有 4.6%。这说明增长几乎全部来自出口（+18.8%）和工业（+5.3%），投资端在塌。这解释了为什么"六张网"和 8000 亿新型政策性金融工具必须加码——投资已经是唯一的短板。

**Mavis 点评：**
🔴 这里有一个**极其罕见的信号**：合约价在涨、现货价在跌。512Gb TLC 晶圆现货从 3 月峰值 $23.00 跌到 10 月的 $18.83（**-18.1%**），连续三周下跌，模块厂库存高企、砍价却换不来需求。而 TrendForce 同时预测 Q4 合约价还要涨 15%~20%。**合约价反映的是厂商对 CSP 谈判的结果，现货价反映的是真实边际供需**——现货先跌，说明这轮涨价的燃料是"恐慌性备货"而不是终端消耗。9 月江波龙净利环比回落 36%~49% 已经在提示同一件事：**当低价库存耗尽，模组厂的库存红利就变成成本压力**。

📌 结构性判断：NAND 的资本开支出现了**明确的分裂**——三大厂的 DRAM/HBM 预算全部上调（+11%/+17%/+23%），而三星和 SK 海力士明确**削减或限制 NAND 投资**。这意味着 2027 年新增闪存产能严重不足，**这轮涨价的持续性比市场想象的强**。但价格强不等于所有环节强：模组厂赚的是库存时间差，原厂赚的是产能稀缺。**买原厂（美光/海力士/长鑫），别买模组。**

🟡 稀土/镓/锗的双轨价不是"套利机会"，是**合规成本**。境外镝氧化物是国内 5 倍、铽 4 倍、镓 4 倍以上、锗 4 倍以上——**这个价差就是西方军工和半导体的原料成本上升**。中国不出口管制，欧美也拿不到合规产能：美国航空航天工业协会自己承认 2028 年前没有合规产能，MP Materials 靠国防部 $110/kg 保底价才敢扩产。这套结构在 2027-01-01 DFARS 生效后会进一步固化。

📌 但 10-12 越南草案是个**信号意义大于短期影响**的事件：越南 17 种矿产设深加工门槛，直接把锡价当日推高 6000 元。越南在全球锡钨供给里不是绝对主导，但它在做的是**所有资源国都在做的事——把原矿留在本土，把加工利润留在本土**。这意味着中游冶炼分离的"海外低成本原矿"模式要重估。

🔴 真正的风险点：**厄尔尼诺 11 月到 2027 年 2 月达峰**。它同时影响三件事——锌精矿运输受阻（TC 已 -$115~-150 的纪录低位，再断供冶炼厂直接减产）、印尼镍 HPAL 投产受阻、空调制冷需求压制用铜。而 10 月 PPI 已经把煤炭开采 +35.3%、有色冶炼 +21.4% 传导进国内了。**四季度如果厄尔尼诺超预期，5% 的 PPI 还能再往上走一截，而中游制造业会被彻底压死。**

**Mavis 点评选：**
📌 **最有洞见的一个：宇树 G1 的"全球最畅销"和它 73.6% 收入来自高校科研，是同一句话。** 王兴兴在 10-22 物理 AI 大会上说 G1 累计下线 1~2 万台、全球最畅销；但招股书里写着人形机器人收入 73.6% 来自高校和科研机构，行业应用不足 10%（且其中还有水分）。海外租赁商用 G1 去生日派对跳舞、展会当吉祥物，一天租金 3000 美元。**"畅销"证明了产能和性价比，"不干活"证明了场景缺口。**这个板块真正的观察指标不是出货量，是**工业应用收入占比**——什么时候这个数字从 10% 变成 30%，才是从"秀场"到"工场"。

📌 **第二个：机器人板块已经出现物理 AI 与传统机器人的撕裂。** 10-23 宇树科技 20CM 涨停，但同一天"空间智能第一股"群核科技——10-19 解禁 35 名股东合计 15.99 亿股（占总股本 **92.64%**），管理层被迫自愿延长禁售 12 个月，10-20/21 两日仍累计跌超 35%，较 4 月最高 48.5 港元已跌去超九成。**这不是基本面分化，是拥挤度分化。**中信证券说机器人主题"已具备启动条件"，理由是流动性、估值、政策、技术、链主"大都符合过去七轮机器人上涨行情特征"——**这个理由本身就是危险信号：它讲的是形态，不是产业。**

### 8.2 风险提示

### 8.4 编辑后记（v6）

**信号一：存储现货价已经跌了，但合约价还在涨——这是过去六年第一次出现这种组合，它比任何一份看多报告都更值得警惕。**

512Gb TLC 晶圆现货从 3 月峰值 $23.00 跌到 10 月的 $18.83（**-18.1%**），且是连续三周下跌，TrendForce 的原话是"模块厂面临需求疲软和库存高企，降价也没换来额外需求"。同一时间，TrendForce 却预测 Q4 NAND 合约价还要涨 15%~20%。**合约价反映的是厂商对 CSP 谈判的结果，现货价反映的是真实边际供需——现货先跌三个月，合约价跟着跌只是时间问题。**这不是"周期见顶"这么笼统的话，验证条件是明确的：**11 月上旬 TrendForce 现货周报若跌破 $18，江波龙、佰维存储的库存就从利润变跌价。**真实风险是：江波龙 Q3 单季净利已经环比 -36%~-49%，如果 Q4 现货继续走弱，Q4 环比可能比 Q3 更难看，而这个数字会在 11 月底的三季报里被市场重新翻出来。

**信号二：设备订单锁到 2027 年，但瓶颈在零部件——市场在买设备整机，其实该买的是卡脖子那一层。**

北方华创前三季新签 **550~570 亿元、同比 +60%**，全年上修至 800 亿，订单排到 2027 下半年；但 Q3 收入只增长 8%~16%。**44 个百分点的缺口是今天全篇最反常的数**——它不是需求问题，是交付问题，中信里昂 10-14 明确说"上游零部件紧缺拖累交付，Q4 到 2027 年才改善"。**而零部件厂商正在赚这笔钱**：富创精密 Q3 净利预增 220%~300%、联讯仪器收入预增超 11 倍。**所以"国产替代"这条线里最被低估的不是设备整机，是零部件——因为它是瓶颈，而瓶颈有定价权。**可验证的判断：11 月底北方华创三季报，如果单季收入增速从 8% 跳到 30% 以上，说明交付在通；如果跳不上去、反而毛利率下滑超 2pct，说明零部件涨价已经吃进整机毛利，设备股会先于基本面下跌。

**信号三：10 月 1 日的国补购房贴息，边界比市场以为的窄得多，但它同时打开了一条没人看的线。**

总价 ≤150 万、面积 ≤120㎡、贷款本金 ≤100 万、年化 1%、最长 5 年——**这四个数字把红利锁死在强二线和三四线的刚需盘**，一线城市核心段（比如深圳南山、上海内环）基本吃不到。所以 10 月的楼市数据会出现一个**极其分裂的读数**：核心城市高端盘继续平淡，刚需盘成交放大，**中间地带的"不上不下"房源最难卖**。可验证的判断：10 月底各城网签数据会验证这一点（对照 9 月北京 15756 套、上海连续 7 个月破 2.3 万套的基数）。

但更值得看的是另一条被忽略的线：**9-20 新版《住房公积金管理条例》落地后，沈阳 10-09 把装修提取上限从 10 万提到 20 万、物业费提取从 2000/3000 元提到 1 万元/年。**公积金正在从"买房首付工具"变成"全生命周期居住消费账户"。**这是对家居建材、物业服务、二手房翻新链的直接利好，而它不在任何一份"楼市新政"的标题里。**真实风险：这条线在 40 多个城市里执行尺度不一，落地节奏可能远慢于预期——验证点是 12 月 1 日沈阳新规生效后的首月提取数据。

**信号四（关于节奏）：10 月 26 日的 MLF 缩量 2000 亿，**不是**收紧，是换锚——但换锚完成前，波动会加大。**

10 月 MLF 续作 7000 亿 vs 到期 9000 亿，净回笼 2000 亿；而买断式逆回购净投放 4000 亿，中期流动性连续第 4 个月净投放 2000 亿。**表面缩量、实际中性，这是"总量宽松退出、精准调剂接力"的第一次完整演练。**关键背景是潘功胜 10-19 宣布"研究择机把公开市场主要操作品种的期限切换为隔夜"——DR001 已回落 1.26%、DR007 约 1.3179%，均低于 7 天政策利率 1.4%。**换锚不是降息**（隔夜与 7 天的利差是正常期限溢价），但它意味着**未来每一次流动性波动都会来得更快、更短、更难对冲**。可验证的判断：**10-26 MLF 中标利率公布 + 10-28 FOMC 决议**。若 10-26 MLF 利率不变、10-28 不加息，人民币在 6.6696（2022 年 7 月以来最强）的位置会继续压制出口企业汇兑收益——这对出海占比高的制造业公司是实打实的报表变量。
