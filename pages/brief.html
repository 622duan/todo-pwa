## 📊 板块 3：宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面：美联储鹰派加息 + 国内 LPR 维稳预期

**美联储 9.17 加息 25bp 至 3.75-4.00%**（美联储 FOMC 9.16-17 会议）：12-0 全票通过，结束 2023.7 以来降息周期；2026 年 PCE 通胀预期 3.7%（上调 0.1pct）、GDP 增长预期 2.3%（上调 0.1pct）、失业率 4.1%（下调 0.2pct）；点阵图 18 名官员中 16 人预期 2026 年底前再加息 1 次至 4.00-4.25%。新任主席沃什（Kevin Warsh，2026 年 5 月接任鲍威尔）强调"通胀过高且持续时间过长"、"12-0 投票显示对抗通胀的决心"。10 年期美债收益率维持 5.012%、30 年期 5.357%、美元指数 100.3、2 年期升至 4.73%（最贴近政策利率）。特朗普公开呼吁"降到 1% 以下"，但未直接攻击沃什。

**9.20 LPR 报价（维持不变概率极大）**（Reuters 9.18 调查 21 家机构 100% 预期）：1Y LPR 维持 3.00%、5Y 维持 3.50%，**连续 16 个月不变**。背景：① 7 天逆回购锚定 1.40% 自 2025.5 未动；② 商业银行净息差 1.41% 历史最低（逼近国际 1.8% 安全线）；③ 中美利差倒挂创新高（10Y 美债 vs 中国国债），汇率压力上升。央行近期开展 5000 亿元 6 个月买断式逆回购等量续作，传递"流动性托底而非宽松"信号。

**8.28 房贷新政持续落地**：① 上海下调外环外二套首付至 15%；② 公积金贷款额度翻倍（北京 120→240 万、叠加最高 340 万）；③ 广发证券称北上深"长达 16 年的限购强约束彻底退出历史舞台"；④ 1-8 月二手房网签面积 5.5 亿㎡ 同比 +10.6%，**首次超越新房销售面积**（国家统计局 9.15 首次公布该指标）。

**📌 Mavis 点评**：美联储 9.17 加息是"预防式加息"——趁经济还有韧性（GDP 2.3%、失业 4.1%），先按住通胀预期（油价 100 美元 + 关税 + AI 投资三重推升）。但**沃什拒绝给前瞻指引**，市场只能用点阵图猜——这种"模糊性"反而给金银留了逆势空间（金价已破 4400 美元/盎司）。对中国：LPR 不动但银行以"补息+贴息+消费券"间接让利；二手房价"存量时代"正式确立，未来政策传导重点从"卖新房"切到"促置换"。

### 3.2 货币与流动性：国内中性偏松 vs 海外紧缩

- **央行操作**：9.15 等量续作 5000 亿 6 个月买断式逆回购（到期 2027.3.15）；7 天逆回购 1.40% 锁定；9.19 MLF 等量续作预期
- **银行间利率**：DR001 1.48%（税期走升）、DR014 跨季快速上升
- **9 月专项债发行**：政府债融资节奏温和，财政托底为主
- **存量房贷**：8.28 新政允许合同偏离一定幅度时主动协商；建行 8.30 起 30 年→40 年可申请（100 万贷款月供从 4216→3581 元，降幅 15%）
- **9 月社融**（9.14 已发布 8 月数据）：M2 同比 +8.6%，新增人民币贷款 9000 亿，社融存量 +8.2%
- **港币联系汇率**：香港金管局贴现窗利率随美联储上调 25bp 至 3.75%

**📌 Mavis 点评**：中美的货币政策周期完全"反向"——美联储收紧、中国"按兵不动"。但因为汇率压力 + 银行息差压力 + 中美利差倒挂，**中国央行今年降息空间被锁死**。Q4 真正的看点是"9.1 起每月公布的全国新发放房贷利率均值"——这把尺子会触发一波存量房贷协商潮，间接给银行净息差"开闸放水"。

### 3.3 经济数据：9 月 PMI 回升 + 工业生产超预期

**9 月制造业 PMI 49.8%**（国家统计局 9.30 / 香港日报）：环比 +0.4pct，升至近月高点，仍低于 50% 临界点。生产指数 51.9%（+1.1pct，近 6 月新高）、新订单 49.7%（+0.2pct）、采购量 51.6%、生产经营活动预期 54.1%（+0.4pct，连续 3 月回升）。大型企业 PMI 51.0%（持续扩张）、中型 48.8%（-0.1pct）、小型 48.2%（+1.6pct，亮点）。三大重点行业：装备制造业 51.9%、高技术制造业 51.6%、消费品 50.6%（均高于总体）。

**9 月规模以上工业增加值 5.2%**（国家统计局 9.15，超预期 4.8%，前值 4.5%）：环比 +0.7pct，"resilient manufacturing"信号。上游采掘业 +17.8%、购进价格指数 56.6%、出厂价格重回 50.4% 扩张区间。

**8 月 70 城房价**（国家统计局 9.15）：一线新房环比由平转涨 +0.1%（上海 +0.4%、深圳 +0.2%、北京 -0.2%）；二线 -0.1%（持平）、三线 -0.2%（收窄 0.1pct）；70 城新房环比上涨 15 城（最多上海/无锡 +0.4%）。一线二手房 +0.1%（上海 +0.3%）、二线 -0.3%、三线 -0.3%。**8 月一线新房已连续 7 个月环比正增长**。

**8 月经济数据其他亮点**：① 1-8 月规上工业增加值 +5.3%；② 1-8 月社零 +2.5%（服务零售 +4.9%）；③ 1-8 月新建商品房销售面积 -12.1%；④ 1-8 月房地产开发投资 -10.5%（降幅持续收窄）；⑤ 8 月新建商品房待售面积 -1.1%（连续 6 月下降）；⑥ 上半年内需对经济增长贡献率超 80%。

**📌 Mavis 点评**：9 月 PMI 是"季节性修复+政策托底+外需回暖"三重共振——生产指数创近 6 月新高 + 大型企业持续扩张 + 小型企业大幅回升（+1.6pct），印证"反内卷+六张网+设备更新"的边际效果。但**9 月制造业 PMI 已连续 5-6 个月在临界点下方徘徊**，付凌晖解释为"部分地方极端天气多发 + 部分行业进入生产淡季"。10 月 PMI 是否能站上 50%（看高频的钢铁/水泥/汽车排产）是 Q4 真正看点。

### 8.4 编辑后记

**Mavis 点评 · 本周 3 大看点**：

**① 美联储"预防式加息"vs 中国"按兵不动"——全球资本流动再次倒挂**。沃什 12-0 加息 25bp 是 2023.7 以来首次，明确告诉市场"通胀失控是头号风险，宁可早加也不晚加"。点阵图释放年内再加息 1 次信号，意味着 2027 年底前也不会降息。但 10Y 美债 5.012% 创近年新高、10Y 中国国债利差倒挂创新深——这给中国 LPR 留下"两难"：降息会加大汇率压力，不降息则银行净息差继续承压。Q4 真正破局点不是 LPR，而是 8.28 房贷新政的"间接让利"——9.1 起每月公布的"全国新发放房贷利率均值"会成为购房者议价尺子。

**② 昇腾 960 路线图提前 + NPO 技术 = 中国 AI 算力的"系统级反超"宣告**。9.17 全联接大会是本周最炸裂的产业事件：960DT 提前 3 季度（2027Q1）、960 超节点首个采用 NPO（5500 个 Hi-ONE 替代 4.8 万颗 800G 光模块）、Atlas 960 单超节点 4096 颗 NPU、MFU 比传统集群高 2.75 倍——**这不是"追赶英伟达"，是"用系统工程重构 AI 算力"**。但要清醒：训练主战场（万卡/十万卡长稳训练、MoE 超大模型）仍被英伟达 H/B 系列主导，昇腾主战场在推理+政务+运营商+私域。2026-2027 是"训练替代"能否落地的关键窗口。

**③ "存储国产化"从概念变业绩 + 长江存储 NAND 跻身全球第三**。长鑫 DRAM 全球份额从 4% 翻倍到 10%（第四）、长江存储 NAND 14%（第三）；中韩技术差距 NAND 1 年 / DRAM 2 年 / HBM 3 年，比"5 年"判断大幅收窄。**苹果已在测试长鑫 DRAM 用于中国市场 iPhone/Mac**——这是国产存储链最重要的"客户验证"信号。但长鑫 HBM3 良率仍卡 25%（三星/SK 海力士 90%+），TSV 瓶颈是关键。9-12 月看 HBM3 良率能否从 25% 爬到 50%。

**风格倾向**："稳投资 + 促消费 + 强算力"三主线继续；半导体设备 / 光模块 / 华为产业链 / 算力国产替代 / 国产存储链是 Q4 弹性所在；新能源车关注 9-10 月"金九银十"渗透率能否守住 70%；地产看一线新房 vs 二三线分化 + 二手存量市场放量。

**一句话总结本周**：美联储"防通胀"、中国"防失速"、华为"防缺算"——三个全球最大经济体的核心叙事都进入"风险防控模式"，但**风险源头都是同一件事：算力即国力**。

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
