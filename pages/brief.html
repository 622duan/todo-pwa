## 一、宏观 PEST（政治/经济/社会/技术）

### 🟢 央行下半年工作会议：继续"适度宽松"，新增"适时调整"
8 月 1 日，央行召开 2026 年下半年工作会议，部署 8 项重点：
- **货币政策**：综合运用并适时调整工具，保持流动性充裕，"降准降息仍是储备工具"
- **数据**：6 月末社融存量同比 **+7.4%**，M2 同比 **+8.0%**（罗志恒口径为 8.3%）
- **科技金融**：债券市场"科技板"累计发行 **超 2.8 万亿元**
- **风险**：融资平台化债取得显著成效，两项支持资本市场货币政策工具继续发挥作用
- **人民币**：下半年预计双向波动，区间 **6.7-7.0**，全年"先升后稳"

**Mavis 点评**：央行定调比 7/30 政治局会议更细——"适时调整"=相机抉择，工具箱没合上，等数据。人民币下半年不会大升，配合美联储降息预期，内外息差收敛逻辑成立。

### 🟡 7 月 PMI 转弱：49.2% 重回收缩区间
- 国家统计局 7/31 数据：制造业 PMI **49.2%**（-1.1pcts），结束此前连续 4 个月 ≥ 50% 的势头
- 非制造业 PMI 同步回落，综合 PMI 产出指数环比下行
- 财通证券解读：企业被动累库，6 月需求修复未能延续
- 东方证券：K 型收敛仍需政策加速落地，汛期是扰动因素之一

**Mavis 点评**：7 月是传统淡季 + 高基数 + 汛期三重压制，但 K 型分化是真实信号——高端制造、新质生产力景气度仍高，中下游/中小企业才是真痛点。政治局会议"加力提效"就是冲着这个。

### 🟢 730 政治局会议：财政货币从"精准有效"升级为"发力提效"
- 7/30 会议：财政政策"更加积极"，货币政策"适度宽松"
- 房地产罕见简化表述："稳定房地产市场"（纳入"安全屏障"框架）
- 国信 AI 量化打分：总量工具"蓄而未发"，结构政策"杠铃式发力"
- 联合资信：相比 4 月会议首次提出"加力"，定调升级

**Mavis 点评**：8 月大概率看到准财政工具（专项债 + 政策性金融工具）扩量。地产表述越短，决心越大——保交楼 + 收储二手房路径明确。

## 二、半导体产业链

### 1. 设备：海外交期延长 1.5-2x，国产替代黄金窗口

- **海外五大设备巨头（ASML/AMAT/LAM/TEL/KLA）主流设备交期拉长至 1.5-2x**：常规 6 个月交期设备，当前等待周期接近 1 年，部分机型超 1 年
- **蔡司 SMT 启用德国新基地**，2027 年 EUV 产能提升 30%；High-NA EUV 投影系统单台 4 万零件、12 吨、单面镜制造数月
- **ASML 2023-2025 采购蔡司光学件**：33.3 亿 → 39.5 亿 → 44.1 亿欧元
- **台积电 2026 资本开支上调至 600-640 亿美元**（+80 亿，+15%）
- **美光上调美国建厂长期投资至 2500 亿美元**
- SEMI：2026 全球半导体设备 **1659 亿美元**（+23.2%），2028 年 **2295 亿美元**
- 中信证券：2028 中国半导体设备市场 **接近 1000 亿美元**
- 7/27 长鑫科技登陆科创板（详见"设计/制造"部分）

**Mavis 点评**：海外设备产能饱和+长交期+长订单，是国产设备有史以来最舒服的窗口期。三星、SK 海力士因交期问题"被迫"接受国产验证，订单从"试"到"量"。

### 2. 制造：台积电+三星+SK海力士+中芯国际 capex 全线上修

- **台积电 2nm 持续扩产**，同步中国台湾本土 + 美国亚利桑那新建产能
- **三星 + SK 海力士围绕 HBM3E/下一代 HBM 加速扩产**
- **美光同步提升先进存储投资强度**
- **英特尔 18A 制程 + 全球 Fab 重构** 计划乐观
- 中芯国际/华虹国产成熟制程持续扩产，设备采购需求扩大

**Mavis 点评**：四家同步 capex 扩张是 2017-2018 后首次出现，意味着 fab 端的"军备竞赛"已经从 AI 龙头传导到上游制造。

### 3. 设计/制造：长鑫科技科创板首日 +465.82%

- 7/27 上市，募资 **579 亿元**（约 86 亿美元）= 亚洲今年最大 IPO
- 收盘价对应市值 **3.28 万亿元**（≈ 2 个贵州茅台），登顶 A 股总市值
- 单日成交 **超 1400 亿元**，A 股史上首只单日破千亿
- 长鑫做 DDR4/DDR5 传统 DRAM；HBM 受美出口管制短期内难以突破
- 闪迪同日盘中跌 14.6%，一个月累跌 **47%**，市值蒸发 **1700 亿美元**；SK 海力士 ADR 跌 10%，美光跌 7%
- 长鑫背后 VC/PE 阵容豪华：阿里 76 亿投资

**Mavis 点评**：长鑫上市不是技术突破，是资本定价权博弈的胜利。但要冷静——HBM 才是 AI 真正稀缺品，长鑫主战场 DDR4/DDR5 全球占比仍小，闪迪/SK 海力士短线回调更像是高位获利了结。

### 4. 存储芯片：超级周期进入"涨价洪流"阶段

#### 现货端（DRAMeXchange 8/1）
| 品种 | 现货价 | 同比 |
|------|--------|------|
| 16Gb DDR5 | **51 美元** | **+733%** |
| 16Gb DDR4 | **85.2 美元** | **+896%** |
| 8Gb DDR4 | 42.1 美元 | +722% |
| 1Tb NAND 晶圆 | 26.4 美元（+3% WoW） | +415% |

#### 合约端
- 7 月 DRAM 合约价环比 **+10%**，季度涨幅 30-50%
- 64GB DDR5 模组 **1480 美元**（创历史新高），DDR4 模组 1300 美元
- 服务器 DRAM 单台 AI 需求是普通 8-10x
- 客户端 SSD 自 2025 年底价格 **翻倍**

#### 长协（美银美林 8/1 调研）
- 三星 60-70% 存储销售通过 LTA 完成
- LTA 条款："限制跌幅、不限涨幅"——单季降幅 ≤ 5%，涨幅可达 10-20%+
- 5 年滚动模式绑定大客户（英伟达/苹果/谷歌/Meta/微软）

#### 产能真相
- 三大原厂 **80% 以上先进产能** 转向 HBM + 高端 DDR5
- 三星计划 **2026 年 6 月前停产 MLC NAND**
- 美光停售消费级 DRAM
- 三星 2026 HBM 晶圆月产能提升 50% → **25 万片**
- 中国长鑫吃的是三巨头让出来的"通用 DRAM"空间——"接盘式崛起"

**Mavis 点评**：这轮存储不是普通周期，是 AI 虹吸制造的**结构性缺口**，至少延续到 2027H2。三大原厂"集体躺赚"模式下，国内模组厂和手机厂的阵痛期至少还有 18 个月。

### 5. 手机：小米第三轮涨价，iPhone 18 Pro 物料 +300 美元

#### 全行业涨价潮（8/2 起）
- **小米**：REDMI Turbo 5/K90/小米 17 全线涨 300-500 元，今年第三轮
- **iQOO 15**：标准版涨 400-1000 元，顶配 16+1TB 累计涨 1500 元
- **一加 15 系列**：全系统涨 1100 元
- **OPPO/荣耀**：折叠屏 + 大存储旗舰调价全部跨过千元门槛
- 央视财经：暑期主流厂商新机普涨 300-1000 元

#### 涨价驱动（卢伟冰口径）
- 同规格内存同比 **+4 倍**；12+512GB 存储成本 +1500 元；16+1TB 涨幅更猛
- 内存涨价至少延续到 **2027 年底，甚至 2028 年**

#### iPhone 18 供应链情报
- 2nm A20 Pro 芯片（台积电 WMCM 封装）首发，单代工业务 **220 亿美元+**
- 折叠屏 iPhone 备货 **1000 万部**（郭明錤口径 700-800 万部）
- 全年 iPhone 18 系列目标 **9500 万部**（vs iPhone 17 提升 12%）
- iPhone 18 Pro 物料成本 **+300 美元**，起售价 9999 元，Pro Max 11000 元
- 蓝思科技、立讯精密、舜宇光学、长盈精密、宁德时代、欣旺达深度参与

#### SoC 出货（Counterpoint H1 数据）
- 2026 H1 全球智能手机 SoC 出货 **-15%**，全年预计 **-14%**
- 联发科 32% / 高通 22% / 苹果 19% / 紫光展锐 13% / 三星 8%
- AI 端侧 SoC（支持生成式 AI）出货 **+24%**
- 入门级 SoC 预计全年 **-30%+**

**Mavis 点评**：手机市场进入"K 型撕裂"——AI 端侧 SoC 涨、4G 入门款崩；存储成本已超过 SoC 成为 BOM 第一大成本项。苹果定价权 + 自研基带是最大看点，2026 下半年是它独享的"AI 手机换机红利"窗口。

### 6. 港股科技 / 中概

- 蔚来 + 小米 + 美团等纳入恒生指数样本调整
- 智元机器人借壳传闻终结，正式冲刺港股（营收 30 万→10 亿/3 年）
- 长鑫科技科创板上市引爆半导体估值体系

### 2. 基建：核电 + 特高压双线加码

**Mavis 点评**：稀土和锂短期都是"供给端放松 + 需求端观望"的偏弱格局，但磁材开工率回升和锂盐去库会托底，8 月震荡偏弱是基准情景。

## 四、6 大圈子八卦

1. **【长鑫】** 科创板首日 +465% 市值超工行，闪迪一个月腰斩。背后 VC/PE 阵容豪华（阿里 76 亿）。但别忘了 HBM 才是真正的高地，长鑫主战场是通用 DRAM。
2. **【苹果】** 折叠屏 iPhone 备货从 700-800 万部上调到 **1000 万部**，单价 9999-11000 元。库克 8/1 在 Q3 财报会上首次承认"百年一遇的涨价洪流"，并预警 9 月财季 iPhone/iPad/Mac 都有产能限制。
3. **【英伟达】** 2Q26 财报下周，Vera Rubin 平台已交付；但 SemiAnalysis 此前指出机架级别 Kyber NVL144 延期一年。AMD Venice 处理器叫板 Helios 机架级 AI 系统，微软成大客户。NVDA 毛利率 75% vs AMD 50%，差距源于三层结构：CUDA 生态 + NVLink + InfiniBand。
4. **【高通】** Q3 财季营收 **99.5 亿美元**（-4% YoY），手机业务单季 -20%，**9/1 全线涨价**。汽车业务单季 +61% 创纪录。苹果自研基带替代超预期，但中国手机厂商贡献的收入已经触底。
5. **【三星】** LTA 比例扩到 60-70%，主厂 + 后段产线集中到华城园区（年增产能 15%），目标保住苹果/英伟达。Galaxy Z Fold8 在印度 72 小时破 27 万单。
6. **【特朗普 + 伊朗】** 8/1 突然宣布取消打击伊朗，3 日谈判；伊朗外长虽同意卡塔尔+美国方案，但军方强调"霍尔木兹海峡不会恢复冲突前状态"。油价暗盘 -6%，黄金回到 4046 美元/盎司。OPEC+ 9 月名义增产 18.8 万桶/日。

## 七、Mavis 编辑后记

**Mavis 点评（总结）**：

今天的最强信号是**"地缘风险偏好回暖"**——特朗普 8/1 突然取消打击伊朗，油价 -6%、黄金 +1%、美债收益率下行。这是 7 月下旬开始的"100 美元油价 → 90 美元 → 80 美元"行情的延续，AI 链短期也跟着"加息预期缓解"喘息。

回到中国主线：
- **半导体** 是 8 月最确定的 alpha 来源——海外设备交期 + 国产替代 + 长鑫 IPO 共同重塑定价权
- **地产** 已经分裂成"两个市场"——核心区豪宅抢地王 vs 三四线收储存量
- **存储涨价** 正在从上游传导到每个 C 端用户的口袋（小米涨 500、iPhone 涨 1000）
- **猪周期底部** 基本确认，但 8 月中下旬才能确认右侧

**风险点**：
- 中东地缘再次反复（伊朗军方表态不一致）
- AI 链 7 月底开始的"中金类比 2000 年四轮回撤"是否在重演？
- 国内 7 月 PMI 转弱 vs 政治局"加力提效"的政策时滞

**Mavis 行动建议**：
