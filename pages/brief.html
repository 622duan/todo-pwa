## 板块 3：📊 宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面
- 🟥 **9.20 起《住房公积金管理条例》修订正式施行**（国务院令第 844 号，2026-08-19 公布，9-20 实施）。提取情形由 6 项扩到 9 项，新增"装修自住住房""支付自住住房物业费""国务院批准的其他住房消费情形"兜底条款；租房提取取消"房租超家庭工资收入规定比例"门槛；缴存记录全国互信互认、贷款审批由 15 日缩到 10 日。
- 🟥 **六部门联合印发《坚持农业农村优先发展、完善乡村振兴投入机制实施方案》**（农业农村部 + 国家发改委 + 财政部 + 央行 + 金融监管总局等），到 2030 年基本建立"政府资金优先保障 + 债券支农 + 信贷倾斜 + 保险 + 民间投资 + 盘活资源资产"六位一体投入机制。
- 🟥 **五部门《关于推动生态环境领域科技创新多元化投入的指导意见》**（生态环境部 + 科技部 + 央行 + 国资委 + 金融监管总局，9-7 印发），围绕"4+3+2"九项举措，财政+金融+社会资源三路并进。
- 9 月起新规：出境入境管理新规 9-15 施行、AI 智能客服"已读乱回"经营者担责国家标准 9-1 起实施、人民币流通新规禁止买卖等。
- 工信部 9-3 启动**人工智能中小企业创业支持计划**（2026-2028），三年培育 1 万家以上 AI 科创中小企业，建设 10 个科技企业孵化器 + 10 个国家中小企业公共服务示范平台。

### 3.2 货币财政
- 上半年央行口径社融、M2 数据未出 8 月最新值，市场关注 9 月中下旬 MLF 续作窗口。

    // Init
    function init() {
      renderBrief(DEFAULT_BRIEF);
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
