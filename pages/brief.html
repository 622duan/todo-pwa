## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**① 国务院常务会议（2026-10-16，李强主持）** —— [人民日报](http://cpc.people.com.cn/BIG5/n1/2026/1017/c64094-40816438.html)

三大议题，其中"人工智能+"进展汇报是核心：

| 议题 | 关键表述 |
|------|----------|
| **"人工智能+"行动** | 从产业体系完备、应用场景丰富、工程化能力强实际出发；**促进算电协同**；增加高质量数据供给；以实体经济为重点强化供需衔接 |
| **价格法修正草案** | 依法依规治理**低价无序竞争**；健全行业成本调查、**制止低价倾销**配套规则；持续规范**平台经济价格竞争** |
| 教师法修订草案 | 减轻教师非教育教学任务负担，提请全国人大常委会审议 |

会议还决定修改 14 部行政法规部分条款、废止 4 部（含港口间海上旅客运输赔偿责任限额规定）。

**② 商务部 + 科技部公告 2026 年第 48 号（2026-10-16）** —— [商务部官网](https://www.mofcom.gov.cn/zwgk/zcfb/art/2026/art_0a31a3c9ac404f7a9b0e917ce3412997.html)

拟修订《中国禁止出口限制出口技术目录》，涉及 **3 领域 40 项技术**：

| 领域 | 项数 | 具体内容 | 便利措施 |
|------|------|----------|----------|
| 人工智能 | **23 项** | 大模型、智能体、算力集群、信息处理 | 开源技术**不纳入**；境外自建算力中心、赴境外流片、联合研发适用**自动许可** |
| 生物医药 | **5 项** | 细胞/基因治疗、小核酸药、病原微生物 | 不涉所有权转让的对外授权**不纳入**；靶点发现技术适用自动许可 |
| 光伏 | **12 项** | 多晶硅/硅片/电池制造（**单线产能≥3 万吨/年**的多晶硅工程技术） | 未达管控指标的仍可自由出口 |

- **拟禁止出口 14 项**（AI 驱动的恶意代码生成变异、自有 IP 细胞基因治疗工艺平台、钙钛矿及叠层电池组件生产技术等）
- **拟限制出口 26 项**（AI 辅助漏洞挖掘、通用型细胞基因治疗新靶点发现验证等）
- **同步启动出口前登记管理**：自 10.16 起至正式修订实施前，出口 40 项技术须在商务部业务系统统一平台登记
- **征求意见期：2026-10-16 至 2026-11-15**

商务部明确表态：企业**利用限制类大模型对外提供 API 调用、APP/网页交互、SaaS 应用、本地端侧轻量化部署，不属于大模型技术出口管理范围**；限制类技术海外本地化部署**属于**管理范围。

**③ 央行：LPR 连续 17 个月不变，但"定价锚"要换（2026-10-20）** —— [中国经济网](https://www.ce.cn/xwzx/gnsz/gdxw/202610/t20261020_3264967.shtml)

| 项目 | 2026-10-20 报价 | 变化 |
|------|-----------------|------|
| 1 年期 LPR | **3.00%** | 持平 |
| 5 年期以上 LPR | **3.50%** | 持平 |

潘功胜 10 月 19 日金融街论坛宣布三个方向：
1. **优化短端利率调控机制**
2. **推动贷款利率定价基准改革** —— 从单一参考 LPR 向多元化转型，财务力强的企业可自主选择 **DR001** 或 LPR 作为浮动利率基准；LPR 继续服务小企业和个人贷款
3. **退出存贷款基准利率**

配套：央行 10 月 21 日至 11 月 2 日开展**隔夜逆回购操作**，每日不超 1 万亿元（工作日天数明显加长）；拟设立非银机构大额赎回流动性支持工具。

**④ 发改委：加快印发扩大内需战略实施方案（2026-10-20）**

将及时出台实施增量政策；正在研究制定**扩大内需战略实施方案（2026-2030 年）**；合理提高公共服务支出占财政支出比重；加强新型政策性金融工具对民间投资支持；优化算力设施布局。

**⑤ 其他部委动态**

| 部门 | 时间 | 内容 |
|------|------|------|
| 工信部 | 10.21 | "十五五"期间建设一批**专精特新赋能中心**；印发《加快构建工业和信息化领域碳排放双控工作体系实施方案（2026-2030）》 |
| 工信部等 4 部门 | 10 月中 | 组织 **30 余家**重点车企座谈，加强创新设计和研发测试验证，抵制非理性竞争 |
| 工信部 | 10 月 | 智驾"小蓝灯"国标落地：改为**蓝绿色**，仅 **L3 及以上**车辆可用 |
| 生态环境部 | 10.21 | "十五五"实施应对气候变化**一揽子重大工程**；2030 年前建国家级零碳工厂和零碳算力设施 **500 个**左右 |
| 国家能源局 | 10.21 | 印发《关于推动煤电与新能源融合发展的实施意见》，明确"十五五"末融合场景模式成熟应用 |
| 商务部 | 10.19 | 优化调整无人机相关物项出口管制措施，**11 月 18 日**起实施 |
| 商务部 | 10.19 | 回应美方制裁 5 家中国企业、禁止采购 DeepSeek：强烈不满、坚决反对 |

**Mavis 点评**：今天政策面最值得盯的不是"AI+"口号，而是**价格法修正草案 + 出口管制目录扩围**这两件事。价格法要打的是"低价倾销"，这直接指向过去几年平台与制造业的低价内卷；出口管制则明确了"开源不管、海外部署要管"的边界——这两条合起来，其实是在给中国 AI 和新能源产业**划合规护栏 + 定价权护栏**。对投资而言，治理低价无序竞争利好头部集中度提升。

**⚠️ 冷静看待的三点（必须写清楚）：**

1. **汇丰（10.14）明确泼冷水**：JEDEC 标准尚未建立，需与 CPU 厂商长期验证；因美国出口管制被迫用 **14-15nm DUV** 实现 12-13nm 技术，需额外多重曝光，**工艺步骤理论上增加 30-50%**；量产良率是"monumental hurdle"。
2. **市场共识的初期良率估计**：业内专家估计即便年底推出，**初期良率可能不到 10%**。行业 HBM3 试产初期良率仅 25%，成熟量产线约 80%。

| **摩根士丹利** | 🟥 **DRAM 合约价同比增速大概率在 2026 Q4 见顶**；板块股价通常在盈利峰值前 **4-8 个月**提前见顶；高景气阶段板块远期 PE 仅 3-4 倍，是"典型周期顶部估值陷阱" |
| 摩根士丹利 | 2027 下半年全球新增存储产能集中释放，消费级 NAND 或面临价格回落 |
| **集邦（TrendForce）** | 2027 年供应持续吃紧，HBM ASP 涨幅上调至 **121%**；SK 海力士直言 **2027 年将是存储行业史上供应最紧张的一年** |
| **高盛** | 2026 年全球 DRAM/NAND/HBM 供需缺口分别达 **4.9%/4.2%/5.1%**，均为 **2011 年以来最高** |
| **汇丰** | Q4 商品 DRAM 涨至高个位数；HBM 2027 年 Blended ASP 同比 **+65%** |
| **ARK（木头姐）** | 存储芯片已进入买入区间，涨价过快 + 电子销量下滑已部分反映在股价 |
| **美银 Hartnett** | 卖出信号结束 ≠ 买点已到，两大前提"目前均未实现" |

**Mavis 点评**：存储这一轮最深刻的变化不是价格，是**产业链权力结构的反转**。看两组对照：一是存储占 400 美元机型 BOM 从 33% 飙到 **64%**，超过了主处理器——**一个"配角"变成了"主角"**；二是三星单季利润 **+782.5%**、突破 100 万亿韩元，而中国手机出货 **-22%**。利润全部流向了原厂。至于 4F²，我的判断是：**架构意义大于短期业绩意义**。DUV 多重曝光带来的 30-50% 工艺步骤增加，会把良率难题放大到极致，年底样品能出 ≠ 明年能放量。

## 6. ✏️ 五、编辑后记

### 6.1 总论：今天的市场在交易两条完全相反的线

**第一条是"涨价线"**：存储涨、手机跌、原厂赚、终端亏。这是过去三个月全球科技产业链最清晰的利润再分配。截至 Q3，存储占 400 美元以下手机 BOM 的比例已从 33% 冲到 64%，超过主处理器成为最贵元器件。三星单季营业利润突破 100 万亿韩元（同比 +782.5%），是韩国企业史无前例的第一次。同一天，中国手机出货 -22%，创有统计以来最大单季跌幅。**这不是一个周期，这是产业链权力结构的重排。**

**第二条是"国产替代线"**：长鑫份额一年从 4% 到 10%、4F² 架构年底商用、北方华创 850 亿订单排到 2027 Q3、中芯产能利用率 93.7%、设备国产化率从 25% 冲到 35-40%。这条路的主线是清晰的，但节奏经常被市场误读——**10 月 13 日三星 -7.39%、SK 海力士 -10.09% 的暴跌，本质是市场把"架构发布"直接换算成了"产能威胁"，这个换算在 2027 年之前都不成立。**

两条线今天同时在跑，所以盘面才这么拧巴：沪指 3713（-0.60%）、创业板 -1.62%，但元件板块净流入 19.68 亿元；科创综指微跌 0.08%，澜起科技同日大涨 6%。

### 6.2 Mavis 的六条独立判断

**① 4F² 是"架构意义大于业绩意义"，年底样品 ≠ 明年放量。**
市场为这条消息付了三星 -7.39%、SK 海力士 -10.09% 的代价，但技术现实是：JEDEC 标准尚未建立、DUV 多重曝光导致工艺步骤增加 **30-50%**、业内专家估计初期良率**不到 10%**（行业成熟量产线约 80%）。架构创新本身是真实的、有意义的，但它解决的是"位元密度"问题，不是"总产能"问题。**2027 年之前，它不会改变供需曲线。**

**② 手机行业的"保利润"转型，短期利空估值、长期利好行业健康。**
小米砍低价线（出货 -30%）、OPPO 整合三品牌、vivo 收缩双市场——过去"抢份额宁愿亏本"的游戏玩不下去了。CR5 从 72% 升到 **74%**，头部集中度创历史新高。真正的问题是：存储什么时候松？机构口径高度一致——**至少到 2027 上半年**。这意味着手机行业还要熬三个季度。

**③ 大摩说的"股价提前盈利峰值 4-8 个月见顶"，是最值得重视的风险提示。**
中芯 Q2 净利 **+2.62 倍**、华虹 **+3.86 倍**、兆易 H1 **+1091%**、澜起 Q3 **+153%**——这些数字已经不是"改善"，是"爆发"。摩根士丹利同时指出，高景气阶段板块远期 PE 只有 3-4 倍，"看似估值低位，实则是典型的周期顶部估值陷阱"。**业绩越好，越要警惕这个组合。**

**④ PPI +5.0% 对 CPI +0.9% 的剪刀差，是今年最被低估的宏观风险。**
生产资料 +6.5%、采掘 +25.4%，生活资料 -0.1%。上游在涨，下游不敢涨（社零仅 +1.1%、限额以上商品零售 **-2.5%**）。这意味着中游制造利润被两头挤死。**最直接的证据就是宁德时代：Q3 营收 +58.58%，净利只有 +14.54%**——毛利率大幅下滑，10 月 21 日单日暴跌 12.03%，A+H 合计蒸发 **1,461 亿元**。

**⑤ 政策端真正的杀招在"价格法修正草案"，不在"AI+"。**
治理低价无序竞争、制止低价倾销、规范平台经济价格竞争——这三条如果落地，是给过去五年低价内卷画句号。**受益方是头部集中度提升的制造业与平台龙头**，受损方是依赖价格战的中小厂。同时出口管制目录把 AI/生物医药/光伏 40 项技术纳管，配合"开源不管、海外部署要管"的清晰边界，中国在给 AI 产业**划合规护栏**。

**⑥ 设备是确定性最高、也最容易被误读的一环。**
北方华创 850 亿在手订单、中微 180 亿，都已把 2027 上半年的收入锁死。但两个陷阱：一是"合同负债"是预收款不等于利润；二是"国产化率 35-40%"掩盖了 **ESC（静电吸盘）、MFC（质量流量控制器）仍在日美手里**的真相——**整机国产不等于零部件自主**，这是这条链上最容易误读的一句话。

### 6.4 风险提示

1. 🔴 **美联储加息风险（最高优先级）**。CME 显示 12 月累计加息 25bp 概率 **77.8%**、加息 50bp 概率 **15.8%**。若 10 月 23 日非农超预期，全球风险资产（包括 A 股科技与美股 AI 链）将面临重定价。**这是唯一能一票否决所有多头逻辑的变量。**
2. 🟥 **存储周期见顶风险**。摩根士丹利判断 DRAM 合约价同比增速大概率 Q4 见顶；2027 下半年全球新增产能集中释放，消费级 NAND 可能回落。若 Q4 实际涨幅低于 10%，存储设计企业毛利率改善逻辑直接落空。
3. 🟥 **中概/科技股估值陷阱**。半导体板块历史最大回撤可超 **70%**。费城半导体指数 10 月 16 日已创**连续第 8 个交易日下跌**（追平 2006 年以来最长连跌）。
4. 🟡 **消费端"价格幻觉"**。通讯器材零售额 +18.1% 与手机出货 -22% 并存，说明零售额被涨价绑架。一旦涨价停止（存储价格见顶），零售额会断崖式回落，**通讯器材类零售增速可能从 +18% 快速转负**。
5. 🟡 **地缘风险**。美伊谈判反复、以色列进入最高战备（第三轮大规模战争概率被估至 90%）、法德 10 年期利差升破 **153 个基点**（法国主权信用风险发酵，趋势跟踪基金已将 CAC 做空至最大限度）。
6. 🟡 **AI 资本泡沫**。原央行行长周小川 10 月 20 日警示：巨额资金流向 AI 及基础设施，一旦部分失败可能引发金融动荡。Anthropic 上半年净亏 **807 亿美元**、未来十年算力承诺支出超 **5,180 亿美元**——这是全行业最脆弱的账。
7. 🟡 **订单履约风险**。市场存在大额订单"签而不履"的先例；光通信领域技术路线仍有争议。
8. 🟡 **碳酸锂链政策风险**。2027 年电池出口退税取消 + 消费税升至 4% + 新能源车出口退税降至 9% 三个政策叠加，可能造成 2027 年国内销量明显回落。
