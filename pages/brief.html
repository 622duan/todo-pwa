## 八、Mavis 编辑后记

这一周如果只用一句话总结:**信用在重估,实物在变贵,科技在疯狂**。

- **信用重估**:美国债务 40 万亿、30 年期 5.337% 创 19 年新高,黄金 +14% 创 1999 来最强单月,比特币 5 月来首破 8 万,**三者同涨是教科书里没有的"四重信号"**。桥水达利欧喊话"10-15% 配黄金"是对这场重定价最直接的注解。

- **实物变贵**:铜(LME 14090 美元/吨, 美国铜关税预期)、锂(15.1 万/吨, 储能高景气)、原油(布伦特 94.4, 中东局势观望)、黄金(4700 美元)——**全球大宗齐齐走强,是供给端紧张+对法币贬值预期**。

- **科技疯狂**:ASML €93 亿 + 全年指引 €430-450 亿(5 个月内 365→440 亿 +20%)、应用材料 $91 亿、长江存储 Q1 净利 334 亿(超长鑫)、中芯国际 $30.06 亿首破 30 亿、**拓荆 +1324% / 中微 +300% / 兆易 +1091%**——"卖铲人"业绩兑现的戴维斯双击在中国半导体设备链同步发生。

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
