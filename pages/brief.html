### 二、半导体产业链

#### 2.1 设备：ASML & 应用材料双爆表

**ASML**（10/14 财报）
- 🟥 Q3 净销售 **117 亿欧元**（QoQ +25%，YoY +55%），**创历史单季新高**
- 毛利率 57.5%，净利润 50 亿欧元
- 2026 全年净销售指引 **440-450 亿欧元**（+36% YoY）
- Q4 指引 142-152 亿欧元，毛利率 57%
- **客户订单已排到 2030 年**，部分接洽 2029-2030 年订单
- 2026 年交付约 65 台 EUV 系统（+50% YoY）
- 正在研究 2028 年产能进一步扩张方案

**应用材料 AMAT**（8/13 公布 Q3 FY26，截至 7/26）
- 🟥 Q3 营收 **91.2 亿美元**（YoY +25%），**连续 13 季毛利率同比扩张**
- Non-GAAP EPS $3.50（YoY +41%）
- 半导体系统部门 70.4 亿，DRAM 26% 占比上升

- Q4 指引 102.5 亿（±5），Non-GAAP EPS $4.02（±0.20）

- 🟥 Q3 营收 **NT$1.49 万亿（≈$46.7B）**，YoY +50%，QoQ +17%
- 毛利率 66.4%，净利润 NT$7630.6 亿（YoY +69%），**创历史新高**
- 连续 6 季净利刷新纪录，连续 11 季正增长
- Q4 营收指引同比 +58%（美元计 +41%）
- 2026 资本支出上调至 **$60-64B**（原 $52-56B）
- 客户排队：英伟达、AMD、苹果、AWS、Google、Meta、OpenAI
- 客户想拿更多产能，分析师称"未来 12-18 个月算力需求继续以当前速度攀升，TSMC 产能紧张或冲击 AI 行业扩张能力"
- 2nm 良率符合预期，宝山 Fab 20 + 高雄 Fab 22 月产合计 10 万片
- 中科 1.4nm 4 座新厂开建，P1 明年 4 月投产，P2 明年 10 月投产

**Q2 全球晶圆代工市占**（TrendForce）
- TSMC **72.5%**（Q1 72.3%，进一步拉大差距）
- 三星 5.9%（Q1 6.5%，差距扩到 66.6pct）
- 中芯 5.4%（Q2 营收首破 30 亿美元，QoQ +20%）

- Q2 营收 $30.06 亿（QoQ +20%，YoY +36.1%）

**消费端传导**

**Mavis 点评**：存储这轮不是周期品，是 AI 时代的"水电气"——基础设施级确定性溢价。三星单季营业利润首破 100 万亿韩元是个标志性事件。但**消费端涨价已经在反噬**——OPPOS 7 月拒绝接受三星 Q3 报价，未来 6 个月要看手机厂商的"涨价转嫁能力"对存储厂商话语权的反扑。

**Mavis 点评**：政策端"组合拳"已经出完，10/1 落地后看 4 季度销售数据能不能撬动"金九银十"。但**新房改 + 现房销售意味着供应收缩**，对房企是利好（去库存 + 现房溢价）但对购房者是观望情绪加重。真正的破局要看货币端——LPR 还会再降。

**🔥 圈子 4：手机圈 — "国产五款加起来不到苹果一半"**
iPhone 18 Pro 一家占旗舰市场 72.7%，**周销 112.8 万台**恐怖。**最大赢家：荣耀**——Magic 9 是唯一同比正增长的国产旗舰（W40 拿下安卓第一 14%）。**最大输家：小米**——同比降 5 位，市场份额从去年同期的第一跌到 10.99%。华为 Mate 90 表现中规中矩，不如 Mate 80。

**🔥 圈子 5：财经八卦 — "三季度批量基金坐过山车"**

资金正从"超跌修复"转向"业绩验证"——**前期股价透支 + 纯主题炒作**的品种注意回避。机构共识：科技为进攻 + 红利/制造出海/医药为均衡。

**🔥 圈子 6：宏观/政策圈 — "房贷贴息 10 天已落地"**
10/1 起的首套房贷贴息政策，**有购房者利率降至 2%**（100 万贷款 5 年省 5 万利息）。叠加北/上/广/汉"8·28"新政（现房销售 + 封顶预售 + 资金监管），**政策端组合拳齐了**。下一步看货币端 LPR 还能再降多少。
