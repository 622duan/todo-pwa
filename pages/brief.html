## 板块 3：📊 宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面

**《能源保供中长期合同管理办法(试行)》落地（发改委，12/1 施行）**
- 三条原则：民生优先兜牢用能底线、有效市场与有为政府相结合、统筹发展和安全防范供应风险
- 产业含义：这是今年煤电、储能的"制度性订单"——中长期合同从"能签多少签多少"变成"必须签"，直接锁定火电利用小时数、储能配建比例、大宗煤价格中枢
- 观察点：12/1 前后的省级实施方案落地情况，以及第一批长协签约量

**上海《新一代智能制造行动方案》（市经信委，10/27）**
- 到 2028 年智能制造系统集成产业规模达 **1000 亿元**
- 首次明确"物理 AI 装备"：推动智能装备升级为"装备智能体"，研制具备自主感知与决策能力的机器人、工业母机、检测装备
- 意义：地方产业文件开始承接英伟达 GTC 柏林提出的"物理 AI"概念，机器人从"补贴"变成"技术路线"

**国开行 3650 亿元政策性金融工具投放完成（10/27）**
- 全部用于补充项目资本金，涉及项目总投资 **5.5 万亿元**
- 这是今年稳投资的最后一块拼图，钱已出表，四季度形成实物工作量
- 影响的链条：基建施工 → 工程机械 → 建材（水泥/玻璃/铜管）→ 地方城投

**其他政策**
- 商务部：前 9 月批发零售业增加值 11.1 万亿元、+4.4%，占 GDP 10.4%
- 北京市发改委：累计带动以旧换新销售额超 **1400 亿元**
- 河南：2026 年消费品以旧换新地方自主品类补贴，按最终售价 **15%** 补贴、每件不超 1500 元
- 上海：推动 **10% 以上**优质工业企业实现工业互联网安全分类分级管理
- 工信部：到 2030 年建设国家级零碳工厂和零碳算力设施 **500 个左右**
- 央行：设立债市非银大额赎回互换便利（BNSF），维护债券市场稳定
- 欧盟：拟对华化工、家具、机械采取贸易措施，或明年一季度推出（外交部回应"希望避免滥用贸易救济工具"）

**Mavis 点评**：今天最反常也最重要的一个数据组合是——**债券在涨、股票在跌、货币在净投放**。10140 亿单日净投放 + 国债期货收红 + 银行理财创新高 + 私募创新高，说明**钱没有离开市场，它只是换了个方向**。股票跌的是"筹码"（公募减仓 9801 亿），不是"钱"（理财+私募+ETF 全在增）。这个错位意味着：**如果公募减仓在 11 月中旬前出清，市场的边际买盘会自动回来**。这和去年 9 月、24 年 9 月的两次"筹码出清"是同一个结构。

- 利润总额 **60337.4 亿元**，同比 **+15.5%**

- 电子行业利润 **+1.0 倍**，拉动全部规上工业利润增长 **9.6 个百分点**
- 细分：电子专用材料制造 **+2.2 倍**、半导体分立器件制造 **+51.7%**、光电子器件制造 **+69.8%**、电子电路制造 **+62.5%**
- 高技术制造业利润 **+52.0%**，高于全部规上工业 **36.5 个百分点**，占规上工业利润比重 **25.5%**（同比 +6.2pct）
- 算力与数据中心带动：光纤制造 **+5.7 倍**、光缆制造 **+1.1 倍**

**其他**
- 1—9 月金融监管总局：银行业金融机构总资产 **494.35 万亿元**（+6.1%）
- 前三季度全国锂电池出口货值超 **800 亿元**、同比 **+30%**，出口 200 多个国家和地区
- 家电以旧换新累计超 **10099 万台**，数码智能产品购新超 **12060 万件**
- 截至 9 月底风电+太阳能累计装机 **20.1 亿千瓦**（光伏 13.1 亿、风电 7 亿）
- 前三季度电力交易电量 **58536 亿千瓦时**、+18.9%
- 前三季度社会物流总额等：暂无新数据

**Mavis 点评**：工业利润 **+15.5%** 这个数字要和昨天的 A 股对照着看——**基本面的钱在涨，股价在跌**。更关键的是结构：电子行业 +1.0 倍拉动整体 9.6 个百分点，意味着**如果没有电子，其他行业是负贡献**。这不是"经济全面复苏"，是"AI 产业链单极拉动"。这个结构在政策上的含义是：刺激内需的边际效用会越来越低，因为钱已经在电子里了。

**Mavis 点评**：农业这一段的核心是**"母减肉不减"的效率对冲**。能繁母猪 -6.5%、9 月再 -0.86%，但 PSY 从 2020 年的 19.9 头升到 **23.4 头**——数量去化被效率提升几乎完全对冲。所以 2026 年出栏量还要创 7.39 亿头的新纪录。这意味着**猪周期反转的时间点要往后推**：研报已经从"2027 上半年"改成"2027H2 才可能明显收紧"。而厄尔尼诺的成本冲击（玉米 +15%、豆粕 +10%）是**双向的**——它加速低效产能退出（利多反转），也抬高龙头成本（利空利润）。真正的信号是那三线同跌的价格：仔猪 -44.3% 说明**养殖户已经不为下一轮周期备货了**，这是最硬的底部证据。

### 8.4 编辑后记

**Mavis 点评**：

今天这份日报有一个很少见的特点：**基本面和股价在讲两个完全相反的故事，而两个故事都是真的**。

一边是数字：台积电 CoWoS 报价上调 10%–20%、设备交期从 3–6 个月拉到 6–8 个月；希捷毛利率从 40.1% 跳到 57.8%；沪电股份 Q3 净利 +160.77%、南亚新材 +1296%、金安国纪 +1031%；1—9 月电子行业利润 +1.0 倍拉动整体 9.6 个百分点；费半隔夜 +3.6%。订单是真的，涨价是真的，报表是真的。

另一边是筹码：沪指收在全天最低 3648.30，科创 50 -4.81%，全市场超 4900 只下跌，两市成交缩到 1.46 万亿（比周一少 1479 亿），红利指数是唯一红盘 +1.09%。公募三季报显示股票持仓比 Q2 末少了 **9801 亿元**、降幅 11.09%，中际旭创一家公司就被减了 913 亿，同时药明康德、腾讯、茅台新进前十、兆易创新和海光跌出前十。**钱在从算力硬件挪向医药+平台+消费，仓位在从小票高估值往大盘红利撤。**

这两件事怎么统一？答案是：**今天减掉的是"拥挤度溢价"，不是"产业景气度"**。10/27 的盘面结构把这件事写得非常清楚——上证 50 只跌 0.80%、中证 1000 跌 3.07%，大盘小盘差 2.3 个百分点，**这不是系统性风险，是仓位再平衡**。而公募持仓 11.09% 的降幅小于沪深 300 的 12.49% 跌幅，说明**主动减仓并不激进，主要是被动缩水**。真正的变化在结构：中际旭创一只票的减仓 913 亿，就把"算力硬件"这一格的筹码掏空了一大块。

所以我今天最想给的三条判断，都必须写成**可验证的形式**：

**第一条：11 月中旬是这一轮的决胜点，两个指标同时落地。** 一个是公募 Q4 持仓（是否继续减，减谁）；另一个是长鑫/长存的 Q4 出货价（决定存储涨价周期是真是假）。**如果 11 月中旬公募持仓止跌回升、同时存储原厂出货价不松动，那么 10/27 这根阴线就是"筹码出清的最后一次下杀"，后面是估值修复。如果只有其中一个兑现，反弹就是脉冲。**

**第二条：3,600 是有含义的数字，不是整数关口。** 摩根士丹利指出国家队（已披露股东名单里中国国新、中国诚通新进/增仓 10 余家公司）正在进场，历史上 1–2 个月内可见明显触底反弹；接的位置大概就在 3,600 附近，下面是 10/23 深 V 的 3574。**破 3574 是新一轮探底，守住 3600 就有承接**。这比任何技术指标都实在，因为它是真金白银的持仓。

**第三条：今天不是抄底日，是观察日。** 昨天说"别在高开时买"是对的，今天补一句"**也别在低开时恐慌**"——外围给了充分的高开理由（费半 +3.6%、CoWoS 涨价、微软谷歌盘后财报），但 10/27 的教训是"高开越多，出货越方便"。真正要看的三件事：**高开幅度 20 点以内算健康、40 点以上要提防；3,600 有没有人接；量能 1.6 万亿是分水岭，站不上就还是存量博弈。**

**另外三件容易被忽略但很关键的事**：

其一，**2/10 美债利差收窄到 25.36BP，2 年期反涨 1.27BP**——短端比长端更鹰，市场已经在给 12 月加息定价。这意味着**美联储 10/28 的结果不重要，措辞才重要**。若沃什的发布会让 12 月概率从 79% 明显下移，那是今年最贵的一根阳线；反之 10Y 破 5% 会把成长股的估值锚再断一次。

其二，**"渠道 SSD 全面降价"和"希捷毛利率 +17.7pct"是本周最值得追的分歧**。同一天、同一份报告里，一个说景气，一个说降价。两种解释并存——渠道去库存，或者原厂压货给渠道。**只有原厂 Q4 出货价能分辨**。这个分歧不解决，任何基于"存储超级周期"的估值都缺一块地基。

其三，**机器人圈的研报分裂不是噪声，是两个不同时间尺度的账**。摩根大通把宇树 2027 年 12 月目标价从 300 上调到 995（3.3 倍），摩根士丹利却说部署时间线整体后移一年、72% 采购方要求单价 <10 万元、46% 到 2028 年底只装 1–10 台。**判断哪边对，检验点只有一句话：2027 年人形机器人整机售价能不能跌破 10 万元**。跌破了，摩根大通对；没跌破，995 就是纸面数字。而所有追高者（凡拓数创 10 月涨 122%、上半年亏 7725 万元）都在为一个尚未被验证的价格曲线付钱。

**今日提醒**：明天 10/29 腾讯全球数字生态大会（深圳）+ 佐力转债申购 + 钶锐锶申购；后天 10/30 官方 PMI + 美国 CPI + 日本央行决议 + 欧元区 CPI，**10/30 是本周信息密度最高的一天**。如果 10 月官方 PMI 回到 50 上方、而社零增速仍在 1% 附近的量级，那么"制造强、消费弱"的剪刀差在 Q4 还会继续——**政策的抓手就只剩财政和贴息，股市的定价会进一步向"高股息 + 出口"倾斜**，成长股需要等 11 月中旬的专项债实物工作量数据来翻身。

    // Init
    function init() {
      renderBrief(DEFAULT_BRIEF);
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
