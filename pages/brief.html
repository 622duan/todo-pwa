### 二、半导体产业链 · 设计涨 / 设备跌 + 长存 IPO 解读

**🟢 国产存储：长江存储 IPO 深度解读**
- 21 世纪经济报道：长存控股 Q1 营收 470.42 亿 / 归母净利 333.79 亿；**按销售金额和出货量均位列全球第三**。
- Q1 NAND Flash 毛利率 78.73% / 综合毛利率 76.77%（AI 周期高景气）。
- 2023-2025 三年复合增长率 **83.60%**；2024 年扭亏为盈（67.71 亿）→ 2025 年净利 142.11 亿。
- 报告期累计研发支出 159.53 亿；研发人员 4796 人；获授权发明专利 5611 项。
- **2025 年长存营收 631.85 亿 > 闪迪 627.60 亿**；与铠侠 753.43 亿相差不足两成。
- 长存 Xtacking 4.0 架构：与三星 232 层 NAND 无技术代差；专利交叉授权国内唯一。
- **国内消费级 NAND 需求只能覆盖约半数**；企业级缺口更大 → 上市募资扩产是必然。
- 拟募资 330 亿元（**科创板开板以来最高**）投向：量产线技术升级 + 存储器研发平台。

**🟢 芯片设计：AI 算力 + 国产替代双驱动**
- **小米发布玄戒 O3 系列三款自研芯片**（3nm 制程）—— 标志国内消费电子品牌核心芯片自研重大突破。
- 佰维存储 H1 营收接近 **3 倍增长**；MCU 芯片涨价周期开启，**国内 MCU 企业出货量超 50 亿颗**。
- 寒武纪 Q1 归母净利同比 +185.04%；设计板块 26Q1 营收 699.38 亿（+79.37%）/ 归母净利 173.56 亿（+517.74%）。
- 范式智能 10 亿采购昇腾 950：H1 API 收入 4.64 亿（**+860.8%**），Token 调用量 +620%，在手订单 70 亿。
- 华为 H1 营收 4678.19 亿（+9.55%）/ 归母净利 234.27 亿；研发投入 1213.82 亿（+25.2%），占营收 **25.94%（历史新高）**。

**🟠 半导体设备：长存 IPO 利好兑现后回调**
- 长存 IPO 招股书挂网，但**拓荆科技、中微公司盘中跌幅居前**——设备股前期涨幅大，利好兑现后获利了结。
- 全球资本开支预期大幅上调：高盛 2026-2028 WFE 预测 1500/2180/2810 亿美元；SEMI 2026 全球设备销售 1439 亿美元（+23.1%），2028 达 2000 亿美元。
- 海外设备交期 6 个月→**12-24 个月**；KLA / TEL 涨价传导；二手设备受限倒逼国产化。

**🟡 存储涨价周期**
- TrendForce：2026 Q1 NAND 合约价环比 +55-60%，Q2 扩大至 +70-75%。
- 韩国 8 月半导体出口 **+209% YoY**（创历史新高）至 466.5 亿美元。
- 三星公布下一代路线图：HBM5 性能为 HBM4E 的 2 倍，**基础芯片制程升至 2nm**，2028 量产；zHBM 目标性能为 HBM4E 的 8 倍，2029 后推出。
- 三星存储部门将 2031 年前约 70% 产能分配给长约（英伟达/微软/谷歌）。

**Mavis 点评**：今天半导体板块**结构性割裂**的核心是"短期业绩确定性" vs "中长期成长空间"——设计端（小米玄戒、寒武纪、佰维存储）有 H1 业绩兑现，设备端（拓荆、中微）前期涨幅大、长存 IPO 利好已 price in。但**这不改变半导体大年逻辑**——设计 26Q1 净利 +517% + 范式 10 亿采购昇腾 + 寒武纪 +185% 是"硬数字"，比"长存 IPO"这种远期催化更硬。

        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
