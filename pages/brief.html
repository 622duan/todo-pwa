## 📡 板块 1｜宏观 PEST

**🟢 政策：央行加量续作 2000 亿**
- 8.5 央行开展 **5000 亿元买断式逆回购**（3 个月期），本月 3000 亿到期，**净投放 2000 亿元**，连续第二个月加量续作，规模与上月持平。
- 8.4 公告：央行 7 月 MLF 净投放 1000 亿、SLF -10 亿、国债净买入 500 亿（vs 6 月 100 亿）、其他结构性工具净投放 1744 亿。
- **8.5 人民币中间价 6.7889（+28bp）**，上调 28 基点；8.5 在岸人民币盘中 **升破 6.7455**，创 2023 年 2 月以来新高。
- 招联董希淼：央行三季度降准可能性大于降息；东方金诚王青：中期流动性操作工具有望持续加量续作，短期降准可能性较小。
- 8.1 央行下半年工作会议：继续实施"适度宽松"货币政策，发挥好两项支持资本市场货币政策工具作用。
- 央行上海总部 8.4 召开下半年工作会议，推动债券市场"科技板"在上海持续见效。

**🟡 经济：7 月金融数据前瞻——社融、M2 平稳**
- 7 月制造业 PMI 49.2%（前值 50.3%）、非制造业 49.0%，供需双缩。
- 上半年规上工业企业利润 +18.7%，电子行业是核心拉动；广东 GDP +4.5%，固投 -11.4%。
- 7 月中国物流业景气指数 50.4%，总体保持扩张。
- 上半年服务进出口 37797.5 亿元，同比 +8.3%，知识密集型服务出口占比过半。

**🟡 外部：美联储 9 月加息概率从 68% 腰斩到 58%**
- 8.5 晚美国 7 月 **ADP 就业仅增 4.4 万人**（预期 6.5 万），前值下修至 9.5 万人，招聘动能显著放缓。

## 💡 板块 2｜半导体产业链

**🟢 设备：SEMI 数据 + 中微出海双击**

- 中微 H1 业绩预告：营收 66.91 亿元（+34.89%），**归母净利 27-29 亿元（+282.48%~+310.81%）**；扣非净利 10-12 亿（+85.61%~+122.73%）；研发投入 20.42 亿（+36.89%），占营收 30.52%。

- 中船特气接受机构调研：六氟化钨作为存储芯片关键耗材，AI 驱动 + HBM 快速发展，下游资本支出持续扩大。
- 长鑫 LPDDR6 研发接近量产，国产算力生态加速形成。
- 8.4 SK 海力士 + 闪迪联合发布 **HBF（高带宽闪存）首套标准**，定位 HBM 与 SSD 之间，AI 推理场景新层级。

- 工业富联午后涨停，**市值 1.31 万亿元**；PCB 板块掀涨停潮，万集科技、智动力、天禄科技 20cm 涨停。

**🟠 光模块：被美国禁令误伤后强势收复**

**Mavis 点评**：半导体今天是**全市场最硬的"主升浪"**。SEMI 数据 + 三星 SK 评估中微 + 中微业绩爆量 + 苹果测试长鑫，**四个独立信源同时验证同一个结论**。最值得高看的是"中微设备被韩国 IDM 评估"这件事的战略意义——以前国产设备"国产替代"是内循环叙事，现在是**正式进入韩国 IDM 的供应商池**，哪怕最后没有成单，也意味着 A 股设备公司的估值锚从"国产化率"切换到"全球份额"。光模块利空被市场消化是另一个有意思的信号——情绪底已经过，现在所有利空都成了抄底机会。

## ✍️ 编辑后记

**Mavis 点评**：今天的日报核心是"**美联储转向 + 半导体全链爆发 + 人民币破位**"的三重共振。8.5 沪指 +1.47%、科创 50 +4.78%、成交 2.66 万亿，半导体设备、HBM、PCB、工业富联（中际旭创 675 亿天量）全面爆发，**这不是反弹，是 7 月极致分化之后的修复性暴力续涨**。但要清醒：

1. **半导体要看"非农脸色"**：今天板块涨这么猛，跟 ADP 爆冷直接相关——美联储 9 月不加息预期升温，全球流动性宽松提前定价。但 8.7 非农是真正的大考，**如果非农 < 7 万，9 月不加息 + Q4 降息预期会同时点燃黄金 + A 股科技股**；如果 > 10 万，9 月加息概率可能从 58% 反弹到 70%+，那今天的反弹就要打折。

2. **存储/光模块要看"美国禁令脸色"**：中际旭创 675 亿天量、新易盛 -5.71% 是市场对"美国 FCC 拟禁止进口中国光模块"的真实反应——**不是恐慌，是分歧**。早盘跌 10% 被买回、午后商务部"进一步反制"表态加码，说明资金把利空当抄底机会。但这个板块接下来 1-2 周波动会很大，**HBF 标准发布（SK+闪迪 8.4）+ LPDDR6 量产进度（长鑫）+ 苹果测试长鑫**才是核心跟踪点。
