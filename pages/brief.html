## 一、宏观 PEST（Politics/Economy/Society/Technology）

### 🟥 P · 政策：北京楼市 7 箭齐发 + 政治局"稳定房地产"定调

- **8 月 7 日晚**：北京住建委、规自委、住房公积金管理中心联合印发《关于进一步优化调整本市房地产政策的通知》，**8 月 8 日起施行 7 项措施**——①非京籍五环内购房社保/个税从 2 年降至 1 年（全市统一 1 年）；②**父母赠与子女住房不再核验购房资格**；③公积金贷款最高 120 万元（单缴存人首套）/240 万元（夫妻双方首套），**叠加 4 项上浮条件后夫妻最高 340 万元**（多孩 +40 万、绿色建筑 +40 万、城六区外 +20 万、叠加 100 万封顶）；④"带押过户"扩围；⑤装修提取公积金每户最高 25 万元（每 10 年一次）；⑥优化贷款额度与缴存年限挂钩（单人 20 万/年、双方 40 万/年，**5 年 1 个月即满额**，比原 7 年 1 个月提前 2 年）；⑦公积金贷款套数认定优化（已结清再次申请）。
- **7 月 30 日中央政治局会议**：将"稳定房地产市场"**纳入"切实筑牢安全屏障"框架**（"安全屏障"提法首现），并强调实施好一揽子化债方案、深化资本市场投融资综合改革；房地产 GDP 占比 11.1%（上半年），地位仍举足轻重。
- **2026 年 1-7 月（截至 7/29）**：全国房地产相关政策出台 680+ 条（同比频次明显增加），超半数为公积金优化；中指研究院预测"上海二手房连续 4 月环比上涨、深圳 6 月转涨"显示核心城市企稳。
- **8 月 7 日**：北京链家研究院院长高原"公积金额度翻倍机制是双缴双用、不透支存贷循环"；上海易居严跃进"从社保缴纳门槛看，北京此次调整意味着限购在社保年限维度上实质性松绑，**信号意义强**"；中指陈文静"短期北京新房、二手成交有望好转，**政策效果将逐步显现**"；58 安居客张波"叠加金九银十传统周期，预计三季度北京二手房、新房成交会出现脉冲式上行"。
- **网信办 8 月 5-6 日**：对美国涉华消极措施反制（暂停 CCC 在美跟踪检查、应用 DNA 等 6 家美实体列入反制清单）；**8 月 6 日对派拓公司 Palo Alto Networks 在华销售启动网络安全审查**。

**Mavis 点评**：**北京 7 箭齐发 = 政治局"稳楼市"在一线城市的第一个落地**。这次最值得划重点的不是"非京籍 5 年变 1 年"（上海年初已落地），而是**公积金夫妻双方首套最高 340 万元 + 5 年 1 个月满额**——这是把"鼓励改善型需求"翻译成"具体每月少还多少钱、能省多少利息"的政策落地。**Mavis 预测：8 月底前上海/深圳大概率跟进小修小补，9 月新房+二手成交数据是真正成色验证窗口**。中央把房地产放进"安全屏障"框架是 2018 年以来措辞最强的一次，**"安全" = 不允许出问题**，意味着后续政策密度只增不减。
