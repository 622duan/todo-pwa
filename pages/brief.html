## 📊 8 大板块深度

### 一、宏观 PEST（地缘 + 央行 + 财政）

**【P 政治】美伊直接军事冲突，霍尔木兹海峡成全球能源命门**

9 月 1 日美中央司令部对伊朗伊斯兰革命卫队目标发动打击（防空阵地、雷达、海上资产、布雷能力、通信站），特朗普称"规模庞大且威力强劲"，威胁若伊朗报复将遭更猛烈打击。伊朗随即反击，宣布针对美国基地和利益发射导弹和无人机。**两艘超级油轮在霍尔木兹海峡相继遭不明物体击中**，伊朗议长卡利巴夫表示"霍尔木兹完全由伊朗军方控制"，并警告船只通航量远不及战前。

**【E 经济】全球债市大溃败，主权债收益率创 2008 以来新高**

- **美国 10Y**：4.796%（2025 年 1 月以来新高）｜**2Y**：4.398%｜**30Y**：5.273%（今年收盘破 5% 已 55 天）
- **日本 10Y**：**30 年来首破 3%**｜**30Y**：4.18% 历史高位
- **英国 30Y**：1998 年以来最高｜**德/澳 10Y**：2011 年以来新高
- **欧元区 8 月 CPI 3.3%**（2023 年 9 月以来最高），欧央行下周加息 25bp 板上钉钉
- **沃什鹰派 + 巴尔**："通胀不充分降温应果断加息"，市场对美联储 9 月加息预期升至 **58%**

**【S 社会】上海合作组织"比什凯克宣言"重申谴责对伊朗军事打击**

习近平出席"上合组织+"会议，倡议"上合力量驱动亚欧繁荣"+"上合智慧推动全球南方发展壮大"+"上合行动引领全球治理改革"；宣言反对单边强制措施，重申扩大本币结算份额路线图。

**【T 技术】9 月 8-11 日旧金山科技大会五大辩题**

高盛报告梳理：①AI 算力需求 ②半导体设备周期 ③存储供需 ④模拟芯片复苏 ⑤EDA AI 商业化。判断 WFE 上行周期至少延续至 2028 年；Agentic AI 到 2030 年为 EDA 行业带来 370 亿美元/年增量。

**Mavis 点评**：今天市场最核心的不是油价涨 5%，而是**全球主权债同步抛售**——美 10Y、日 10Y、英 30Y、德 10Y、欧元区 CPI 同时创新高。这不是单一国家现象，而是**财政可持续 + AI 通胀 + 人口结构** 三重压力同时显化。沃什"增长化债"叙事其实承认了一个事实：靠降息压不住债务，只能靠增长。但增长又要靠 AI，AI 又要烧钱，**这是一个通胀自我强化的循环**。对中国而言，9 月是观察外部冲击传导的关键窗口——汇率 6.72 已是软着陆区间，但如果 9 月 15-16 日美联储真加息，人民币可能再承压。

### 二、半导体产业链（设备 / 制造 / 设计 / 存储 / 手机）

**【设计】英伟达：Q2 营收 962 亿美元（+106% YoY），Q3 指引 1080 亿美元（±2%）**

- 连续 4 个季度加速增长，单季每天收入超 10 亿美元

- 与 AWS 扩大合作，2027-2028 年**额外部署 200 万颗 GPU**（Blackwell Ultra / Rubin / Rubin Ultra）
- 重启 **Rubin CPX** 项目（168GB HBM4，专攻预填充与 KV Cache），2027 年初量产

**Mavis 点评**：今天的半导体新闻密度极高，但**真正改变产业格局的只有两条**：①台积电 A16 Q4 量产 + A14 良率 90%，意味着 2nm 时代台积电独大格局彻底锁定（英特尔 14A 量产要到 2028、三星 1.4nm 到 2029）；②**长鑫 H1 净利 +3428%** 不是财务数字奇迹，而是中国存储从"备胎"变"主胎"的里程碑。HBM 未来 5 年带宽 +34 倍、晶体管 +48 倍，意味着每瓦算力成本还有 30 倍下降空间——这是支撑英伟达 FY28 +70% 营收指引的最底层逻辑。手机端华为登顶不是新闻，**真正值得警惕的是大盘连续 5 季度同比下滑**——存量竞争已经吃掉换机周期，2027 年换机潮能否启动，决定了 OPPO/vivo/小米的生死。

    // Init
    function init() {
      renderBrief(DEFAULT_BRIEF);
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
