**🟥 北京 9.5 商业贷款最长延至 40 年**：北京市 9.5 出台房地产优化调整政策，商业贷款最长年限放宽至 40 年（此前 30 年）+ 提高公积金贷款额度。9.20 起全国《住房公积金管理条例》修订实施（提取范围 6→9 项）。

### 8.4 编辑后记（v6 关键改动 · 3 个非显然信号）

**信号 1：美光 300 亿自由现金流 + 苹果"反向广告" + 字节 296 亿贷款 + 挪威砍 800 亿美债 = 同一件事**

把这 4 件事放一起看——**AI 算力时代的"流动性贴现"已经发生质变**。美光 Q3 自由现金流 300+ 亿美元 = 史上两个季度总和，公司要 100% 返还股东（主要是回购），这背后是 **SCA（战略客户协议）40%→50% 业务占比**——客户预付、锁定产能、付全价。**美光在电话会上说"Apple 从未公开承诺为组件付全价，我们这是开门做生意"**——这是 AI 内存从"卖产品"变成"卖长期合同"的最硬证据。**字节 296 亿美元贷款**是中国 AI 基建的同量级融资；**挪威主权基金拟砍 800 亿美元美债**是传统避险资产配置者第一次大规模撤离美债。**这 4 件事的本质是：AI 算力从"卖产品"变成"卖未来承诺"，传统资产配置者从"美债 + 美元"开始"用脚投票"**。**可验证判断**：1）美光 Q4 财报 SCA 占比能否突破 50%；2）三星 / SK 海力士 10 月 OCP 大会发布 SCA 进展；3）挪威主权基金 Q3 美债持仓报告；4）字节 Q3 财报 AI 资本开支占比。**风险点**：SCA 模式类似"长债"再融资，若 AI 需求增速放缓，2027-2028 产能扩张可能变成"高价位扩产 + 中价位投产"的吞噬利润陷阱；挪威主权基金若真砍 800 亿美元美债，10Y 美债收益率可能突破 5%。

**信号 2：北京 40 年商贷 + 上海 8 月二手 2.07 万套 + 8.28 封顶才能预售 + 9.20 公积金 9 项提取 = 同一件事**

把这 4 件事放一起看——**这是 2002 年预售制以来最大一次"销售-信贷-公积金"三联政策组合**。北京 40 年商贷（此前 30 年）让月供从 1.5 万降到 1.2 万，对应购房门槛下降 20%；上海连续 9 月破 2 万套 + "沪八条" 8.21 落地后中介带看 +4.7% 是市场反应；8.28 住建部"封顶才能预售 + 推行现房销售 + 交房即交证"是从制度层面封堵"烂尾楼"风险；9.20 公积金条例修订（提取范围 6→9 项）是国务院级政策。**这 4 件事的逻辑链**：货币端（DR007 比政策利率低 13bp，9 月降准降息难出）→ 财政端（公积金 9 项提取 + 购房贴息 + 商贷 40 年商业银行让利）→ 制度端（封顶才能预售 + 现房销售）**同时发力**。**可验证判断**：1）9 月最后一周 30 大中城市新房成交同比（社科院预测 +8%）；2）北京 9 月二手房网签量能否突破 1.5 万套（8 月 3104 套/周是新政前水平）；3）四季度是否还有更多二三线城市跟进"封顶才能预售"；4）房企现金流压力测试（高杠杆民营房企违约风险）。**风险点**：补贴总额普遍 2-5 亿元相对年成交规模有限，"用完即止"可能造成 9-10 月需求集中释放后 11-12 月断崖式回落；封顶才能预售对中小房企现金流是"最后一根稻草"——2026 H2 可能出现新一轮房企违约潮。

**信号 3：IFA 2026 中国厂商 1000+ + 932 家大陆 + 机器人专馆 + 宇树 32.4% 全球 + 特斯拉 Optimus V3 试产 + 鸿海 8 月营收 +51.98% = 同一件事**

把这 6 件事放一起看——**中国在"物理 AI / 具身智能"赛道已经从"参与者"变成"定义者"**。IFA 2026 历来是欧洲主场，**932 家中国大陆企业 + 1000+ 中国厂商** = 创历史纪录 + 占展商约半数，**IFA Next 首次专设机器人创新馆**——欧洲人第一次被中国机器人在自家主场包围。**宇树占全球人形机器人出货 32.4%** 是绝对龙头；**小米 CyberOne 在 EV 工厂螺母拧紧 98% 成功率** 是"工厂买单"的硬证据；**特斯拉 Optimus V3 试产 + 弗里蒙特线改造 + V2.5 公开 + V3 仍隐身** = 特斯拉用"延期发布"避免被中国对手逐帧模仿；**鸿海 8 月营收 +51.98%** 是英伟达 AI 服务器代工的"风向标"数据。**这 6 件事的本质是：物理 AI / 具身智能从"机器人比赛"变成"工厂产线标配"**。**可验证判断**：1）IFA 2026 现场签单量（看中国机器人企业能否拿到欧洲订单）；2）特斯拉 Optimus V3 完整发布时间（10-11 月最可能）；3）宇树 / 智元 / 优必选 2026 Q4-2027 Q1 交付数据（不是订单数据）；4）小米 CyberOne 工厂大规模商用时点；5）鸿海 Q3 / Q4 AI 服务器代工业务占比。**风险点**：工厂市场和家庭市场分化（家庭买单时机未到）——大多数中国机器人企业订单来自工厂，C 端家庭机器人还在 demo 阶段；Optimus V3 量产时间表从 2027 H2 推到 2028 的概率上升；欧盟可能对中国机器人加征关税（跟新能源汽车类似的剧本）。

        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
