## 📊 板块 3：宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面：算力网 + 公积金 + FOMC 加息

**9.16 美联储 FOMC 决议**（北京时间 9.17 凌晨）—— **3 年来首次加息 25bp 至 3.75-4%**，12-0 全票通过。点阵图显示 18 位 FOMC 委员中 **16 位** 预计 2026 年底前再加息 1 次（即 4-4.25%）。主席 Kevin Warsh（5 月上任）拒绝具体前瞻指引，强调 "通胀过高已为时太久"。10Y 美债收益率上行 2bp 至 **5.012%**，30Y 5.357%；美元指数 +0.6% 至 100.3；美股转跌。

**9.11 国务院常务会议**：部署"算力网"建设，明确 **"8+10+3"算力空间布局**（8 大国家算力枢纽 + 10 个国家算力集群 + 3 个算电协同发展区域）。9.12 中国算力大会（河北廊坊）同步开幕，中国移动发布 **AI 可信计算（AITC）**。

**9.20 公积金条例大修施行**——1999 年颁布以来第三次也是最大一次修订，**20 项修改**：提取情形 6→9（新增装修/物业/国务院批准其他），贷款审批 15→10 日，灵活就业可自愿缴存（覆盖 2 亿+ 人群），存贷利率上收至国务院。

### 3.2 货币与流动性

- **8 月金融数据**（央行 9.14 发布）：
  - 🟥 M2 余额 356.81 万亿元，同比 **+7.5%**（前值 7.7%）
  - 社融存量 464.8 万亿元，存量同比 +7.4%
  - 人民币贷款余额 278.63 万亿元，同比 +5.0%
  - 8 月企业新发放贷款加权平均利率 **略低于 3%**，比去年同期低约 0.2pct
  - "五篇大文章"领域贷款增量占比已升至 70%+
- **9.14-9.17 央行隔夜逆回购**：每日不超 6000 亿
- **8 月末外汇储备**：3.438 万亿美元（央行公布）
- **8 月末黄金储备**：7673 万盎司（约 2386.6 吨），**连续 22 个月扩大**，8 月增 65 万盎司（≈20 吨）

**8 月 PPI 涨价结构**（国家统计局 9.9 解读）：煤炭开采 +26.6%、有色冶炼 +20.8%、油气开采 +10.5%、计算机通信电子设备 **+5.3%**；移动电话机 +11.0%、平板电脑 +21.5%、计算机 +19.6%、黄金饰品 +33.6%。

**📌 Mavis 点评**：美联储这次加息，和 2023 年那波是反着来的——上轮是抗需求过热，这轮是抗油价/地缘驱动的供给侧通胀。所以叫 **"防御性加息"**（程实/工银国际）而不是新紧缩周期。但 **点阵图 12 月还要再加 1 次到 4-4.25%** 比市场预期更鹰——这是为什么美股、黄金周三都震荡。国内这边，CPI 升 0.8% 看着亮眼，但拆开看是能源 + 黄金饰品贡献（油价 9.10 暴涨会在 10 月数据里兑现），核心通胀其实还在 1.0% 趴着。**对国内政策的影响有限**——9.21 LPR 大概率还是不动。

        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);

      }
