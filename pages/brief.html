## 板块 3：📊 宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面（国常会提效 + 财政四季度加力 + 央行结构性工具齐发）

**国常会 9.28 部署"宏观政策发力提效"**：李强主持召开国务院常务会议，研究宏观政策发力提效、促进有效投资有关工作。会议强调加大宏观政策逆周期调节力度，"存量政策要进一步增强实施效能、推出一批务实管用的增量政策"，明确加快专项债发行使用、用好地方政府债务结存限额（理论盘活空间约 4 万亿元，2026 年有望下达约 6000 亿元）、"增加科技创新和技术改造、支农支小等再贷款额度"、"研究出台稳定房地产市场、促进就业增收等政策措施"。首席经济学家普遍认为，四季度 GDP 同比将在 4.7% 左右，全年 GDP 4.6-4.7%。

**居民购房贷款贴息 10.1 全国落地**（中央财政首次对商业性个人住房贷款贴息）：财政部、人民银行、金融监管总局 9.29 联合印发《关于实施居民购房贷款贴息政策的通知》（财金〔2026〕95 号），自 10.1 起实施、暂定 1 年。对符合条件的首套住房商业性个人住房贷款给予年化 1 个百分点、期限最长 5 年、单户贴息贷款规模上限 100 万元的财政贴息；新房、二手房均纳入覆盖；首套住房建筑面积不超过 120 平方米、价格不超过 150 万元。以 100 万贷款 3.0% 利率为例，符合条件则实际按 2.0% 付息，5 年最多省近 5 万元利息。国庆假期首三天广东工行已受理贴息贷款超 1 亿元。

**央行结构性工具齐发（PSL 降价 + 再贷款扩容）**：9.29 央行将一年期抵押补充贷款利率由 1.75% 下调至 1.50%，并将"六张网"建设纳入抵押补充贷款支持领域；科技创新和技术改造再贷款增加 2000 亿元至 1.4 万亿元、支持比例提高至 100%；支农支小再贷款增加 5000 亿元。

**10.8 央行公开市场操作**：开展 6060 亿元隔夜逆回购对冲 12145 亿元逆回购到期，单日净回笼 6085 亿元；7 天逆回购操作量为零。DR001 加权平均利率 1.3756%、DR007 1.39%，短端小幅上行 1-2BP。10.8 当天财政部发行 2026 年中央金融机构注资特别国债（一期）5 年期固定利率附息债，竞争性招标面值总额 1500 亿元。

## 板块 4：🏭 半导体产业链（设备/制造/设计/存储/手机）

### 4.1 设备（国产化加速 · CTS 报告 343 台 DUV + 美国 Match 法案 + 设备自给率 21%）

**CTS 智库最新报告：中国持有 343 台浸没式 DUV，ASML 占 270 台**：截至 2026 年初，中国晶圆厂通过管制缺口取得约 343 台浸没式 DUV（深紫外光刻机），其中约 270 台为 ASML NXT:1980i（占比 79%）。2024 年中国花 130 亿美元采购 90 台 NXT:1980i，2025 年再增购 89 台。CTS 预测：若中国每年维持引进 90 台 NXT:1980i，至 2035 年年产 NVIDIA H100 等级 AI 芯片可达 4.34 亿颗；若自 2027 年起全面切斷新机进口，同等级产能将降至约 1.53 亿颗。CTS 因此呼吁美方对"浸没式 DUV + 低温蚀刻"实施全面封锁。

**Bernstein 估算：中国晶圆制造设备自给率 2024 年 16%→2025 年 21%**：干法蚀刻 +37%（本地化率 31%）、沉积 +67%（本地化率 27%）、光刻仍主要靠 ASML + 上海微电子 + 上海宇亮盛联合推进。

**Match 法案（4 月众议院外委会通过）**：要求荷兰、日本等盟国 150 天内扩大对华设备限制，范围由 EUV 延伸至先进 DUV 与部分蚀刻、量测设备。Triolo（DGA-Albright Stonebridge Group）指出，Match 法案对 ASML 的真正威胁不是中国国产机突破，而是切断 ASML 工程师对华服务——若 Match 法案迫使 ASML 撤出中国晶圆厂维护人员，中国浸没式 DUV 国产化将获得巨大推动力。

**中国国产 DUV 生产进展**（7 月以来）：今年生产约 5 台（首批供中芯/华虹/长鑫）、2027 年约 20 台。GAA-Albright Stonebridge Group 合伙人 Paul Triolo 强调：制造一台机器与让它"全年无休 24×7 稳定运行"是两件完全不同的事；之前关于中国浸没式 DUV 进展的报道已被多次证伪，目前尚不清楚最新声明的有效性。

**北方华创、中微、盛美、拓荆、华海清科、中科飞测**：在蚀刻、沉积、清洗、量测等大多设备领域已部分进入产线；三星、SK 海力士因美方限制在合资厂采购先进设备，开始评估采用中微等中国设备——"替代"从"非光刻"向更广设备圈扩散。

**ASML 营收结构变化**：中国一度占其营收约 41%，随管制收紧，公司预期 2026 年中国占比降至约 20%。

**Mavis 点评**：今日 A 股/港股科技股集体回调的核心矛盾非常清晰——AI 资本故事在两条线上同时遇阻：（1）OpenAI 营收预期差 $200 亿直接击碎"AI 收入=真需求"的乐观预期；（2）摩根士丹利 10.1 FCC 报告虽然全篇都是"potential/could"，但市场对 3.2T 时代中国光芯片被卡脖子的恐惧一触即发。这两条线在 10.8 上午叠加，造成光芯片板块 -20% 跌停潮。但要清醒看到：（a）FCC 政策针对的是 3.2T（2028 才开始爬坡），当前 800G/1.6T 不受限；（b）光模块整机厂商（中际旭创、新易盛）"保成熟、卡未来"的政策博弈下影响有限；（c）TSMC +50% 同比 + 三星 +783% 同比说明 AI 算力真实需求并未降温，只是市场从"故事驱动"切换到"业绩验证"。建议短期观望 10.15 TSMC 法说会、10.27 FOMC 会议、10.27 苹果触屏 MacBook 三大事件窗口。
