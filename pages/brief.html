### 8.4 编辑后记（v6 关键改动）

今天是 2026 年 9 月 6 日，周日。比起"今天发生了什么"，我更想讲讲不那么显然的几个信号。

**第一个信号：稀土停供 + 0.1% 衍生品规则，是 2025 年贸易战以来中方最精准的一次反制。**
路透社 9.4 证实中国稀土供应商已拒绝对美发货，这不是"卡脖子"，是**让美国用来自残的合规工具锁死了自己的供应链**——RBA/RMI 既是美方审查中国企业的工具，也是中国企业出口必须配合的认证体系。商务部 8.5 一纸反制令（禁止境内任何组织、个人与 RBA 等 6 家美国实体交易）就制造了"配合 = 违反中国法 / 不配合 = 美国买家拒收"的死结。叠加 0.1% 衍生品规则（境外用中国稀土制造的永磁体再出口也需中方许可），美国稀土化合物 67% 净进口依赖度 + 镓/石墨/铟/铕 100% 依赖度，立刻变成军工和 AI 硬件的卡喉点。**可验证的判断**：接下来 2-3 周内，MP Materials、USA Rare Earth 等美本土稀土公司股价会出现剧烈波动；任何一家美国军工承包商披露 Q3 财报时若提到"原材料供应延迟"——这就是验证条件。**风险点**：美方可能在 9-10 月以"国家安全豁免"或紧急许可绕过部分限制，但 2027 H2 之前很难找到非中国替代源。

**第二个信号：存储 9 月再涨 10-20% 不是周期性反弹，是 AI 基础设施对传统内存的结构性排挤。**
三组数据摆一起：16Gb DDR4 年涨 879%、美银预 9 月再涨 10-20%、SK 海力士 2026 产能全部售罄。HBM 在 DRAM 产能中占比 30% 但只贡献 13% 位元产量——**这意味着 HBM 抢走的不是性能优势，是物理产能**。DDR4 这种"老古董"在 AI 时代反而最贵，因为扩产没动力。可验证的判断：9.10 iPhone 18 发布会时苹果若把 256GB 基础版价格上调 50-100 美元（不影响起售价但削弱相对性价比），就是消费端传导的明确信号。**风险点**：如果 SK 海力士龙仁新厂 2027 Q1 提前投产，叠加三星 P4 晶圆厂加速，2027 Q2-Q3 现货价可能突然回调 15-25%，届时美光/SanDisk 股价会领先现货 2-3 周反应。

**第三个信号：华虹无锡三期 69.5 亿美元 + 大基金三期 6.25 亿美元 = 国产成熟制程从"政策驱动"切到"利润驱动"了。**

    // Init
    function init() {
      renderBrief(DEFAULT_BRIEF);
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
