## 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**（1）国务院常务会议：AI 落地应用成为一等公民（10 月 16 日）**

李强总理主持的国常会听取「人工智能+」行动进展情况汇报，核心表述有三层：
- **夯实发展底座**：加强技术攻关和算法创新，促进**算电协同**，增加高质量数据供给
- **突出赋能应用**：以实体经济为重点强化供需衔接，鼓励联合研发，**推进中试验证**，加大场景培育
- **统筹发展和安全**：因业分级分类施策，守牢 AI 安全底线

同日会议原则通过《教师法（修订草案）》《价格法（修正草案）》，审议通过修改废止 14 部行政法规部分条款的决定。其中价格法修正明确要**治理低价无序竞争**、健全行业成本调查与制止低价倾销规则、**规范平台经济价格竞争**——这条对光伏、锂电、互联网平台的"内卷式竞争"是直接的制度约束。
[来源：新华社 / 人民网](https://cpc-app.people.cn/n1/2026/1017/c64094-40816438.html)

**（2）工信部等八部门印发《产业基础能力提升"十五五"规划》（10 月下旬）**

规划提出到 2030 年：产业基础薄弱问题明显缓解，形成一批**引领整机创新的关键基础产品**，新培育一批单项冠军和专精特新"小巨人"，产业基础能力总体进入国际先进行列。这是把"国产替代"从企业自发行为上升为国家五年规划的正式抓手。
[来源：新华社客户端](https://www.thepaper.cn/)

**（3）发改委《对外投资管理办法》发布（10 月 22 日）**

新办法共 **76 条**六章，2026 年 **12 月 1 日**起施行。相比 2017 版有三方面修订：更好契合发展实际、更好保护投资者权益、更好防范境外风险。
[来源：央视新闻 / 发改委](https://www.ndrc.gov.cn/)

**（4）央行：LPR 连续 17 个月不变，但利率锚正在换（10 月 20 日）**

10 月 20 日 LPR：1 年期 **3.00%**、5 年期以上 **3.50%**，均与上月持平。上次调整是 2025 年 5 月（同步下调 10bp）。

真正值得看的是潘功胜 10 月 19 日在 2026 金融街论坛的表态：
- 推动贷款利率定价基准改革，从**单一参考 LPR** 转向**多元化定价基准**
- 财务能力强的企业可自主选择 **DR001**（银行间隔夜回购利率）或 LPR 作为浮动利率贷款基准
- 研究择机把公开市场主要操作品种期限**切换为隔夜**
- 债券与金融衍生品定价基准可考虑锚定 DR001
- **退出存贷款基准利率**

配合 9 月 29 日的结构性工具调整：PSL 利率下调 0.25pct，支农支小再贷款额度 +5000 亿（民企再贷款 +3000 亿、科技创新和技术改造再贷款 +2000 亿），"报销"比例由 60% 上调至 100%；财政部等首次出台首套刚需购房贷款贴息政策。
[来源：金融时报 / 央行](https://www.toutiao.com/article/7698578063101854234/)

**Mavis 点评**：政策面今天最值得记的不是 LPR 数字，而是**利率锚从 LPR 迁移到 DR001**。这意味着未来"降息"这件事不会再以 LPR 下调的形式出现——你要盯的是隔夜利率和挂钩 DR 的贷款投放规模。用 LPR 交易降息预期的资金，明年可能会被打脸。

从"帮老年人用技术"（2020 国办方案）→ "系统布局智慧健康养老产业"（2024）→ 2025《中共中央 国务院关于深化养老服务改革发展的意见》明确"加快养老科技和信息化发展应用"。落地方向包括毫米波雷达跌倒预警、智能水表异常监测、一句话紧急呼叫器等"润物无声"式设备。争议点在个人信息边界——涉老设备大量采集健康行踪数据，需防止"守护"变成"监控"。

**（5）新业态就业医保覆盖启动（10 月 22 日）**

**（6）AI 虚假房源引流：治理盲区**
部分房产中介用 AI 生成虚假"完美房源"图片引流。法律难点在于：AI 图片通常只用于诱导咨询、不直接决定交易，难以满足民事欺诈的构成要件。专家建议三条：立法禁止去除/清洗/篡改 AI 生成内容标识、建设公共 AI 核验平台、要求上传带拍摄时间与地理位置的实拍照片。

**Mavis 点评**：**财产净收入只涨 1.6%** 是今天最被忽略的数据。工资性收入 +5.3% 说明"工资本身"还行，但居民财富的被动增长几乎停滞——在房产负财富效应的背景下，这意味着居民资产负债表修复会非常慢，**这是消费疲弱的真正底层原因**，比任何消费刺激政策都更本质。

### 2.4 🔴 技术面 T

**（1）AI：从"能不能"进入"赚不赚钱"**
国常会的核心表述是"注重以**落地应用牵引技术创新**"。工信部信通院专家委员盘和林给了市场最诚实的判断：当前围绕 AI 存在"泡沫"与"非泡沫"之争，核心焦点就是**应用能不能赚钱**；能盈利（哪怕未来能盈利），这轮投资热本质是技术革命；否则就是退潮。这也是政策把落地应用前置的原因——先有应用，再用 AI 去找解决方案。

算电协同的技术路径：浪潮信息正预研基于 **800V 高压直流（HVDC）** 的供电架构，减少中间环节损耗，已在西北落地多家"高密低耗"智算中心，某电力企业智算中心融合光伏、储能、余热回收，**年省电 320 万度**。

- 杰富瑞统计：微软、Alphabet、亚马逊、甲骨文的 AI 基建合同积压订单总额 **2.3 万亿美元**，约一半来自 OpenAI 与 Anthropic
- 但下游现金流已在恶化：智谱 2025 年收入 7.24 亿元、研发开支 31.8 亿元、经调整净亏损 31.82 亿元；MiniMax 经调整净亏损约 17.3 亿元
- 英特尔 CEO 陈立武：行业挑战之一是"人们需要看到投资回报"

**（3）绿色算力与"东数西算"（10 月 16 日）**
习近平在内蒙古乌兰察布考察时指出，实施"东数西算"工程、构建全国一体化算力网是党中央重要部署，要求落实**高效、绿色、安全**，注重"算电协同""算水协同"。察哈尔高新区已推进枢纽节点建设和绿色算力产业。

## ✏️ 五、编辑后记

### 总论：今天有四条主线

**第一条：Q3 GDP 回升是"供给强、需求弱"的伪回暖。**
4.5% 的增速比 Q2 好看，但拆开看：社零只涨 **1.1%**、固定资产投资 **-7.2%**、房地产开发投资 **-20.6%**、民间投资 **-10.4%**。真正撑起 GDP 的是信息软件服务（+10.4%）、制造业（+5.6%）和 9 月单月 **+29.6%** 的出口。统计局副局长毛盛勇自己说了"国内需求不足问题仍较突出"。**这不是复苏，这是"生产端很强、消费端很弱"的剪刀差。**

**第二条：存储涨价进入"斜率衰减期"，全产业链开始分化。**
Q2 涨 80% → Q3 涨 40% → Q4 只涨 20%。江波龙 Q3 单季净利环比腰斩 36%—49%、复旦微电环比降 57%—85%，都是这条曲线的映射。**同比 +1800% 的数字必须打对折看。** 真正的赢家从模组转向原厂——长鑫前三季净利 **1310—1325 亿元**、扭亏为盈，Q3 单季净利 **533.95—548.95 亿元**还在环比增长。

**第三条：手机市场创史上最大单季跌幅，且跌的是"中国品牌"。**
Q3 全球 -22%（IDC 口径，有史以来最大），三星苹果合计份额从 36.9% 拉到 **45.0%**，小米 -29.2%、OPPO -34.5%、vivo -31.5%。中国市场连续六个季度下滑。**更扎心的是国补被涨价击穿**：vivo X500 的 6499 元、小米 18 Pro Max 的 6999 元，都已经越过 6000 元补贴门槛。

**第四条：全球市场在同一晚做了同一件事——给 AI 重新定价。**
美股 10 月 22 日：费城半导体指数 **-6.72%**（6 月 23 日以来最大单日跌幅）、存储概念重挫（闪迪 -8.51%、SK 海力士 -8.07%、美光 -6.23%）、光通信 ETF -11.7%、Meta **-6.98%**（Q3 营收 646 亿美元超预期，但披露 **8250 亿美元**未来支出承诺）；同时美债 10Y 单日暴跌 **19.3bp**（2023 年 3 月以来最大单日降幅）。A 股次日：创业板指 **-4.37%** 九连跌，沪指失守 3700。**同一天，全球风险资产跌、国债涨——这是典型的"增长恐慌 + 流动性避险"组合，而不是普通的板块轮动。**

### Mavis 的 6 条独立判断

**判断 1：DRAM 合约价同比增速大概率在 2026 Q4 见顶。**
依据是三组数据交叉验证：集邦 Q4 预估从 Q3 的 40% 降到 20%；IDC 口径存储成本同比涨幅从 Q1-Q2 的 50%—100% 降到 Q3 的低双位数；江波龙自己承认"涨价对利润的边际贡献大幅放缓"。**斜率见顶 ≠ 价格见顶**，高位还能维持 2—3 个季度，但边际利好在衰减。

**判断 2：设备板块的风险不在需求，在零部件。这是我认为市场当前最大的误读。**
北方华创 Q3 收入只涨 8%—16%（板块最低），但订单 550—570 亿、全年上修到 800 亿。中信里昂说得很直白：上游零部件紧缺正在短期拖累交付，**Q4 至 2027 年才逐步改善**。海外进口设备交付周期 12 个月，国内检测设备 6 个月以上。这意味着当前锁定的订单，业绩确认窗口在 **2027 上半年**。如果你现在买设备股买的是"订单兑现"，那你至少要等两个季度。

**判断 3：AI 芯片的"预期差"将成为常态，但海光和寒武纪不是一回事。**
海光是**线性兑现**（Q3 单季营收 51.8—64.8 亿，环比继续上行），寒武纪是**确认节奏波动**（MLU692 收入确认推迟 + MLU580 出货受限）。大摩甚至在指出 Q3 可能不及预期的同时，把寒武纪 2027 年收入预期上修到 **540 亿元**。**国产算力的需求是真实的，但从"需求"到"报表收入"之间横亘着供应链节奏、产品迭代周期、收入确认时点三道过滤网。** 买方需要习惯这种节奏偏差，不要把它读成需求逆转。

**判断 4：Meta 的 8250 亿美元承诺，是本轮 AI 叙事最脆弱的一环。**
其中 **3557 亿美元**是尚未纳入资产负债表的经营租赁与融资租赁，租期 1—30 年，陆续启动至 2036 年。10 月 22 日 Meta 信用风险指标升至历史新高，CoreWeave 债券收益率和 CDS 利率仍居高不下。黄仁勋自己承认"资金短缺阻碍了新云企业的增长"。**这不是 AI 投入，这是用杠杆锁死未来三十年的现金流去换一个回报周期不确定的技术假设。** 我认为 AI 交易从 2026 年下半年起，会从"信仰驱动"切换到"现金流验证驱动"——能拿出自由现金流的（苹果、微软、亚马逊）会被重新奖励，靠发债的（CoreWeave、Meta 的部分）会被折价。

**判断 5：稀土在等下游点头，不是在等供给放松。**
镨钕从 10 月 14 日的 90.5 万高点回落到 88.5 万，氧化铽单周跌 1.53 万元/吨。根本原因是车企和电机厂对 2027 年成本没把握，磁材企业只消化长协库存、现货按需小采。**这是"原料涨价—终端抵触—价格回落"的标准三段式。** 我倾向于认为镨钕在 88—90 万区间震荡的概率大于重回 91 万。

**判断 6：LPR 已经不重要了，下次降息也不会以 LPR 形式出现。**
潘功胜 10 月 19 日明确：推动贷款定价基准从单一参考 LPR 转向多元化，**DR001 事实上已成为货币政策调控的目标利率**，下一步将研究择机把公开市场主要操作品种期限切换为隔夜，同时**退出存贷款基准利率**。招联数据显示 **LPR 减点发放贷款占比已接近一半**。**如果你还在用"LPR 是否下调"来判断货币政策松紧，2026 年之后这个框架会失效。** 该盯的是 DR001 的低位持续性，以及挂钩 DR 的贷款实际投放规模。

### ⚠️ 风险提示

**存储周期拐点风险**：存储行业强周期属性，Q4 合约价若低于机构预测的 10% 涨幅，存储设计企业毛利率改善逻辑直接落空。若 2027 下半年新增产能提前释放，消费级存储价格或提前回落，压制板块整体估值。

**AI 资本开支可持续性风险**：这是**当前最大的系统性风险**。Meta 8250 亿美元承诺、全球九大云厂商 9570 亿美元资本开支（+106%），全部建立在 AI 应用最终能盈利的假设上。若应用变现不及预期，将同时冲击算力需求 → 存储需求 → 光模块需求 → 设备订单，四层链条一起断。

**下游支付能力封顶风险**：国内智谱 2025 年收入 7.24 亿元、研发 31.8 亿元、经调整净亏 31.82 亿元；MiniMax 经调整净亏约 17.3 亿元。算力价格逻辑已从"供给主导"转向"供需双向制衡"——上游成本在托底，下游支付能力在封顶。

**地缘政治风险**：中东局势升级已把布伦特原油推到 **113.17 美元/桶**（+4%，5 个月新高），美国和以色列据报已制定中期选举后再次打击伊朗的具体计划。油价若持续高位，将强化美联储紧缩预期，压制全球风险资产估值。巴拿马运河方面，NOAA 预测 **2026 年 10—12 月出现超强厄尔尼诺概率高达 81%**，可能实质降低运河有效运力，推升部分航线运价。

**零部件交付风险**：设备端订单锁定到 2027 年，但卡在上游零部件。若 2027 上半年瓶颈不缓解，收入确认全面后移。

**政策退出风险**：LPR 已连续 17 个月不变，市场对进一步宽松的预期在消退。结构性工具（PSL 降息 0.25pct、再贷款额度上调）已集中出台，进入政策效果观察期。

**消费需求永久性损伤风险**：81% 的中国消费者已注意到手机涨价，37% 表示折扣不理想就推迟购机。IDC 判断 2028 年前无复苏。这意味着消费电子的量价关系可能进入一个**长期错配状态**。
