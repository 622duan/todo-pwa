## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**① 国务院常务会议（10 月 23 日）—— 人口 + 服务业双主线** [来源：新华社/人民日报 10/24 01 版](http://m2.people.cn/news/default.html?s=MV8xXzQwODIwNjA1XzEwMjRfMTc5Mjc5MzM5Mg==&from=tencent) · [转载全文](https://www.nhc.gov.cn/wjw/mtbd/202610/24eb4334233443bdbf3d0547f6d3de99.shtml)

会议由李强总理主持，两项议程：

- **统筹人口与经济社会发展**：完善相关政策、持续积累和释放人口综合红利；完善全民终身学习机制、广泛开展技能培训、强化教育与产业协同联动；加强区域人口发展分类指导、引导城乡人口有序流动、稳步推进基本公共服务均等化；加快建设**生育友好型社会**，持续完善婚嫁、生育、养育、教育政策，优化面向家庭的**财税、社保、住房**支持举措，努力稳定新出生人口规模。
- **推进全国服务业大会部署落实**：加力推进服务业扩能提质，破解难点堵点，加强**融资、用地、人才、数据**支持，稳步推进公共事业领域**价格改革**，清理民间投资隐性壁垒，构建全国统一大市场，鼓励扩大服务业投资、释放服务消费潜力。

**Mavis 点评**：国常会同时碰"人口"和"服务业"，本质是一件事——中国正在从"地产驱动"切换到"人力资本 + 服务消费"驱动。会议把**财税、社保、住房**三件套一起提到"稳定新出生人口规模"的高度，这是育儿补贴、住房公积金新政之后又一记政策背书。服务业段落里"清理民间投资隐性壁垒"这句值得划重点——这正是 9 月社零只有 +1.1%、民间固投 -10.4% 的直接对症药。**但注意：这些都还是"研究""听取汇报"阶段，真正的财政量级要等 12 月中央经济工作会议才见分晓。**

**② 央行潘功胜 2026 金融街论坛（10 月 19 日）—— 货币政策框架重大转型** [来源：国家外汇管理局全文](https://www.safe.gov.cn/safe/2026/1019/27999.html) · [央视网报道](https://news.cctv.com/2026/10/20/ARTIlOO2kGlehEViZR5MvMFS261020.shtml)

即将出台的**五项**政策举措：

| # | 举措 | 关键细节 |
|---|------|----------|
| 1 | 设立应对**非银机构大额赎回**的流动性支持工具 | 宏观审慎新工具；在资管机构面临群体性流动性风险、债券市场出现"赎回—抛售"负向循环时启用；适用银行理财子公司、公募基金管理人及对应母行、证券母公司；须满足宏观审慎要求 + 提供高等级抵押品，防止"兜底幻觉" |
| 2 | 扩大**常备借贷便利（SLF）**适用机构范围 | 纳入境内外资法人银行，明确全国性银行适用同样安排，实现对境内存款类金融机构**全覆盖** |
| 3 | 推动**银行间与交易所债券市场互联互通**落地 | 已具备落地条件，测试后即可开通 |
| 4 | 试点便利境外金融机构在境内**外汇市场人民币购售** | 拟允许 **8 家**中外资人民币境外清算行在境内银行间外汇市场自营交易 |
| 5 | 会同科技部等 **10 个部门**出台金融支持三大国际科技创新中心指导意见 | 京津冀、长三角、粤港澳大湾区；推动再贷款、债券市场"科技板"、跨境投融资加大投入 |

**货币政策框架三大方向**（近中期）：
- **优化短端利率调控**——研究择机把公开市场主要操作品种期限**从 7 天切换为隔夜**，隔夜回购利率（DR001）成为主要政策利率；
- **贷款定价基准多元化**——从单一参考 LPR 转向多元基准，财务能力强的企业可自主选择 DR001 或 LPR；
- **退出存贷款基准利率**——2025 年 10 月以来已长期未调整，目前仅在少数司法领域作为计息依据，将以市场化利率指标替代。

潘功胜同时回应了人民币汇率（重申"以市场供求为基础、参考一篮子货币调节、有管理的浮动汇率制度"，2017 年后已退出常态化干预，明确"中国没有必要也无意通过汇率贬值获取贸易竞争优势"）与人民币国际化（SWIFT 口径国际支付占比 **3-4%**，含 CIPS 与离岸口径约 **6-7%**，稳定居全球第三）。

**Mavis 点评**：🟥 **"退出存贷款基准利率"是这份讲话里最被低估的一句**。存贷基准自 2015 年 10 月起 **11 年没动过**，它早就是"名义上的锚"——现在央行要把它彻底拆掉，等于宣告利率市场化进入"无锚"阶段，配合 DR001 成为政策利率，短期会让债券市场、银行的定价行为和久期策略全部重算。**对债市偏空、对银行息差管理能力是压力测试。**另一条：非银流动性支持工具本质是"防赎回踩踏"的熔断器，**这不是宽松，是给风险定价**——央行特意强调"防止形成兜底幻觉"，意思是救市有条件、且要抵押品。市场如果指望这是"国家队第二次出手"，方向就错了。

**Mavis 点评**：政策端今天最值得注意的不是新文件多，而是**三条线的组合拳已经成型**：①货币宽松靠"利率市场化"而非降准降息；②财政靠"提前下达 2027 专项债额度"（意味着明年一季度就有钱）；③产业靠"AI+实体经济"（8 部门规划 + 国常会双部署）。**三线都指向同一个词：落地。**10 月 16 日国常会那句"以落地应用牵引技术创新"，加上今天的 MaaS/Agent-as-a-Service 新业态，政策语言已经从"要不要 AI"切换到"AI 怎么落地、怎么赚钱"。

**Mavis 点评**：🟥 **Q3 全球 -22%（2.553 亿台）是 IDC 有统计以来最大单季跌幅，中国 -15.4% 创 14 年同期最低——这不是"手机行业 downturn"，是"存储涨价把一个 12 亿台/年的市场打出了结构性裂缝"**。三个最值得记的数：**入门机存储占 BOM 从 18% 飙到 51%**（一台 999 元的手机，内存闪存要吃掉 500 块，这不是加价能解决的，是产品定义被摧毁了）；**12GB+256GB 成本从 500 元到 2200 元**（涨 4.4 倍）；**苹果囤货 76.5 亿美元、传音囤 189.4 亿元**（这两个数就是 2027 年的"待爆弹药"）。

但更该看的是**座次变化而不是总量**：华为 **+17.3% 唯一增长**、小米 **-29.2%**、OPPO **-34.5%**，国产海外份额从约 30% 掉到约 25%，而三星+苹果海外合计从约 42% 拉到约 53%。**中国品牌在海外让出的货架，是被三星和苹果填上的，不是空着的。**等到存储降价、国产想回来，面对的不是"空位"，是"别人的货架"。这个损失比 Q3 的 -22% 严重得多。

**我唯一想跟市场分歧的地方**：所有人都在看总量下滑，但**真正决定 2027 年格局的是"谁在涨价潮里活下来了还保住了渠道"**。小米砍量保价、OPPO 合并品牌线、vivo 收中国市场、苹果推迟标准款——都是同一件事：**主动放弃规模换利润**。这在 2026 年是对的（存储成本不可逆），但 2027 年如果存储真的松动了，主动收缩过的品牌要重新买回渠道和用户，那个成本比现在的份额损失更大。

**⑥ HBM 行情**
- HBM 产能缺口仍高达 **50%~60%**；全球主要存储原厂已将约 **70%** 的新增产能向 HBM 倾斜

- 🟥 **三星据报 2027 年 HBM4 报价超 3 倍 HBM3E 每 Gb**——对主要客户报价 **每 Gb 4 美元中高位**，对比当前 HBM3E 约 1.50 美元/Gb；10 月进入最后谈判阶段

**Mavis 点评**：🟥 **这轮存储行情最反常识的一点：DDR4 比 DDR5 贵 44%。**上一代内存跑赢新一代，近十年第一次。原因不复杂——三星、SK 海力士、美光已基本完成消费级 DDR4 停产退出，产能全挪去 HBM 和 DDR5；而 DDR4/DDR5 插槽不兼容，存量工控、嵌入式主板只能买 DDR4。**供给在主动撤退，需求退不出去，价格只能往上走。**这个信号比"DRAM 涨了多少"重要得多：它说明这轮不是需求拉动的普涨，是**供给侧的战略性撤退**，而撤退是有明确终点的（2027H2 起新产能释放）。

第二个关键判断：**涨幅在收窄，但斜率收窄 ≠ 周期反转。**Q2 +80% → Q3 +40% → Q4 +15~20%，看上去在见顶。但伯恩斯坦算得很清楚：DRAM Q4 涨幅在过去 15 年里仍处 76—89 分位，NAND 在 90—95 分位——**绝对定价能力还在历史高位区间**。同时现货端已经分化：eMMC 报价开始松动、零售 1TB NVMe 30 天 -0.05%，说明**消费级已经先于企业级出现松动**。

第三点，关于长鑫那个 **1310 亿归母净利** vs 韩国教授说的"2029 年红海"：我的判断是**两者都对，但时间尺度不同**。长鑫的扩产是"月产能 32 万片 → 42 万片 → 60 万片"这种可测量的物理节奏，2028 年底才见顶；黄仁勋的"用得更多"是需求侧的信仰。**2026—2028 是长鑫的利润期，2029 是它的产能兑现期。**真正需要盯的不是两方表态，是长鑫月产能的实际爬坡数字和 HBM4 实际价格。顺便说一句：**黄仁勋说"对长鑫合作持开放态度"是今天最值得玩味的一句话**——买方在周期顶部公开释放供给方筹码，这是有意的信号管理。

**Mavis 点评**：设备材料这一段的**核心矛盾藏在数据里**：北方华创收入 +24.90% 但扣非只 +5.02%，先锋精科收入 +1.25% 而扣非 **-47.40%**——**收入在涨，利润在掉**。原因机构说了：新厂折旧、人员投入、客户对先进制程要求提高。**这说明国产替代目前处在"用钱换份额"的阶段，ROE 拐点还没到。**

但中微公司（扣非 +108.36%）和拓荆科技（+861.92%）证明了一件事：**一旦产品跨过"客户重复下单"这道门槛，利润释放是阶跃式的，不是线性的。**中微的高选择性刻蚀首台机交付正是这个信号——它不是"又一台设备"，是**打进了一个过去 100% 靠进口的细分市场**。

还有一个容易被忽略的点：**长鑫 4F² 架构 + 混合键合年底产品化，跟拓荆的混合键合设备是同一条线**。国产存储扩产最需要的不是成熟制程设备，是**3D 堆叠的相关设备**（键合、高选择刻蚀、CMP、薄膜沉积）——这四类国产厂商今年全部交出了答卷。**如果 2027 年 HBM4 量产周期真如三星报价暗示的那样紧，国产 3D 堆叠设备链会是最先吃到订单的一批。**

**Mavis 点评**：制造封测这一段最扎眼的数据是**长江存储的 330 亿元 IPO 募资 + 科创板"已问询"**——**这是国产存储第二把钥匙**。长鑫已经上市并开始赚钱（前三季 1310 亿），长江存储现在还在排队，**一旦过会上市，会立刻成为 A 股存储板块的第二个定价锚**。对现有存储板块估值结构的影响是：长鑫目前 3.05 万亿市值已经"透支"了很多 2029 年的预期，**长江存储上市会分母**。

另一个值得注意的：**长鑫花 108 亿元建后道测试基地（二期）**。存储厂把后道测试自建，说明模组环节的利润正在转移——**原厂向下游延伸，模组厂的中间地带被挤压**。这解释了江波龙、德明利这类模组/企业级存储公司为什么三季报这么好（江波龙 Q3 扣非 +740%~964%），但也说明它们的护城河比原厂薄。

**双 11 那个"价格最低点不在 11/11"的判断我认同，但补一句**：京东 30 天价保是今年最大的变量——**它把"提前下单"的风险几乎抹平了**。所以今年双 11 的真实策略不是等 11/11，而是**在 10/20 开门红时用满价保 + 国补 + 以旧换新，把成本锁定在 10 月**。这个结论直接对应消费电子的逆向布局：**要买存储相关消费品的，现在比 11/11 更合适。**

## 6. ✏️ 五、编辑后记

### 6.1 总论：今天的四条主线

**主线一：政策把"落地"写进了文件。** 10/16 国常会讲"以落地应用牵引技术创新"，10/22 八部门规划把 MaaS 和 Agent-as-a-Service 写成新业态，10/23 国常会讲服务业"清理民间投资隐性壁垒"，10/23 央行讲要"退出存贷款基准利率"——**四处政策指向同一个词：把已经确定的方向，从文件变成可执行的机制。**这是政策风格的一个真实转向：从"定方向"到"给路径"。

**主线二：存储涨价从芯片传导到了国家统计局报表。** 9 月 PPI 同比 **+5.0%**、环比 +1.2%，生产资料 +6.5% 而生活资料 -0.1%；同时 9 月手机产量 **-26.6%**、微型计算机设备 **-17.0%**。**上游涨价、下游减产、终端涨价、需求延后——一个完整的闭环在 10 月的宏观数据里合上了。**Q3 全球手机出货创有统计以来最大单季跌幅（**-22%**）不是消费疲软，是成本失控。

**主线三：国产链的业绩兑现已经不能用"预期"来描述。** 长鑫前三季归母净利 **1310~1325 亿元**（去年同期亏 52.80 亿）、联讯仪器 **+1866%~2073%**、长川科技 Q3 **+180%~216%**、拓荆科技扣非 **+861.92%**、中微高选择刻蚀全球首台交付。**这不是题材，这是财报。**但股价在 10 月 19 日给了长鑫一个 -7.77%——**因为聪明钱已经在给 2029 年定价了**。

**主线四：地缘风险从"叙事"变成"价格"。** 布伦特原油 **116.70 美元（+4.00%）**、伊朗革命卫队击毁油轮、美以筹划中期选举后打击伊朗、美 10Y **4.994%**、美联储 12 月累计加息 25bp 概率 **74.8%**。**避险资产失效了**——10/22 黄金跌 2.79% 而油涨 4.00%，这在传统框架里几乎无法解释。**油涨意味着通胀输入型压力回归，美债利率上行意味着分母端在恶化，双重挤压成长股。**这是理解 10 月 22 日全球科技股暴跌的钥匙。

### 6.2 Mavis 的六条独立判断

**判断一：手机行业正在经历的不是周期下行，是"产品定义被摧毁"。**
存储占入门机 BOM 从 **18% 冲到 51%**——这意味着一台 999 元的手机，内存闪存要吃掉 500 块。在这个成本结构下，厂商只有三条路：涨价（需求死）、减配（产品死）、或退出（份额死）。**"千元机可能在未来一两年内彻底退出市场"不是分析师的修辞，是算术。**这轮冲击的终局不是"手机行业变差了"，而是**"消费电子的价格分层结构被永久改写了"**。

**判断二：三星和苹果这次赢的不是产品，是供应链。**
IDC 口径下国产三家海外合计份额从约 30% 掉到约 25%，三星+苹果海外合计从约 42% 拉到约 53%。**原因写得很清楚：三星手机能用自家存储，苹果是全球最大终端采购方、长期合约覆盖大部分需求，国内厂商不具备这个条件。**在正常年份，渠道和品牌可以弥补供应链劣势；在成本军备竞赛里不行。**这才是国产安卓最深的软肋——不是芯片，是长约。**

**判断三：存储的"周期反转"叙事有三条腿，缺一条就塌。**
第一条腿是"涨幅收窄"（Q2 +80% → Q4 +15~20%）；第二条腿是"现货松动"（eMMC 降价、零售 1TB NVMe 30 天 -0.05%）；第三条腿是"新增供给"（长鑫 32 万片/月 → 42 万片 → 60 万片）。**但伯恩斯坦的测算显示，DRAM Q4 涨幅仍在过去 15 年的 76—89 分位，NAND 在 90—95 分位——绝对定价能力没回到正常。**所以真正的拐点信号不是"涨得慢了"，而是**"现货开始连续 4 周以上走低"**。目前只有两周。

**判断四：黄仁勋说"内存很棒的一点是，你永远可以用得更多"，但他自己也是买方。**
这句话在 10 月 22 日把全球存储股砸下去 5% 又在 10 月 23 日把长鑫拉到 +8%，说明**市场根本没有共识，只有叙事的两端**。我的看法是：**黄仁勋的表态对英伟达有利（锁定供应、维持成本稳定），对长鑫是双刃剑（需求背书 + 供给暴露）**。真正能证伪 2029 年红海论的只有两个数据：**长鑫月产能的月度爬坡表**和**HBM4 的实际成交价**。其他都是观点。

**判断五：国产设备材料的收入在兑现，利润还没兑现，这是 2027 年最关键的观察窗口。**
北方华创收入 +24.90% 扣非只 +5.02%，先锋精科收入 +1.25% 扣非 **-47.40%**——**国产替代的账还记在"份额"上，没记在"ROE"上**。但中微（扣非 +108.36%）和拓荆（+861.92%）证明了阶跃式的可能：**一旦产品跨过"客户重复下单"门槛，利润会突然释放**。中微的高选择性刻蚀首台机交付是这类阶跃的信号弹。**2027 年看国产设备，不是看订单，是看毛利率。**

**判断六：今天最被低估的政策变量是"退出存贷款基准利率"，它对债市的影响可能比降准更大。**
存贷基准 2015 年 10 月以来 **11 年未动**，市场早已默认它是"名义锚"。现在央行要把它拆掉，同时把 DR001 变成政策利率——**这等于承认"利率锚"要整体重构**。长久期债券的定价模型要重算，银行的负债成本管理要重建。**市场如果只把这当"利率市场化又进一步"来读，会低估它。**我倾向于认为：**短端确定性上升、长端不确定性上升，10 年国债 1.633% 这个位置有向上压力。**

### 6.4 风险提示

1. **存储周期拐点风险**：Q3 涨价幅度已明显收窄，若 Q4 实际合约价低于 +15%，或消费级需求因涨价过快萎缩，存储板块的高位定价会快速修正——**长鑫 3.05 万亿市值中包含了相当比例的 2027—2029 年预期**。
2. **AI 资本开支节奏风险**：Meta 大额支出计划已引发 AI 基建融资担忧并直接导致 10/22 纳指 -2.60%。**若全球云厂商资本开支增速放缓，HBM/服务器 DRAM 的需求假设会同时被下修**，届时影响的不是价格斜率，而是价格方向。
3. **地缘与油价风险**：布伦特 **116.70 美元**、美 10Y **4.994%**、美联储 12 月加息 25bp 概率 **74.8%**。**油价再上一个台阶，成长股的分母端会继续恶化**，这不是估值调整，是流动性冲击。
4. **技术性超买风险**：中欧基金李帅披露的"通信电子基金持仓比例绝对值和相对值**均创历史新高**"——拥挤交易的负反馈是这轮调整的直接触发器，**即使基本面无恙，10 月 22 日那种 -6.72% 也可能再来一次**。

    // Init
    function init() {
      renderBrief(DEFAULT_BRIEF);
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
