## 📊 8 大板块核心动态

### 一、宏观 PEST · 流动性与政策共振

**🟢 货币财政：双宽松确认**
- 央行 8-14 公布 7 月金融数据：M2 同比 **+7.7%**，社融存量 **+7.4%**，前 7 月社融增量 **22.25 万亿**，人民币贷款增加 **10.38 万亿**；7 月企业新发放贷款加权平均利率略低于 **3.0%**（同比低 0.2pct）。
- 央行 Q2 货政报告：下半年将"实施好适度宽松的货币政策"，"加大逆周期调节力度"，8000 亿"两重"项目 + 2000 亿设备更新资金加快落地。
- 8-14 央行开展 10000 亿元 6 个月买断式逆回购操作 + 隔夜逆回购操作，流动性"应给尽给"。

**🟡 通胀数据：双双低于预期**
- 7 月 CPI 同比 +0.5%（前值 1.0%），核心 CPI 同比降至 1% 以下；PPI 同比 +3.5%，结束此前一年的持续改善，生产资料环比降幅扩大。
- 财新解读：油价、金价走弱拖累 CPI 环比连降三月；高盛预计 2026 全年实际 GDP 增速 4.6%。

**🟡 海外：美联储分歧加剧**
- 美联储哈马克重申"现在必须加息"，巴尔金称"加息支持与反对理由并存"；7 月 29 日 FOMC 维持 3.5%-3.75% 不变，3 张鹰票凸显内部分歧。
- 8-13 美元指数收 99.964（-0.05%），市场对 9 月加息概率定价已从 40% 降至 **34.8%**。
- 美国 7 月非农意外减少 2.3 万（预期 +8 万），失业率 4.1%；7 月零售销售环比 -0.6%（预期 +0.1%），为去年 5 月以来最大降幅。
- 关税：中美关税协议再度延期 90 天，综合税率维持 30%，避开 8 月中旬触发的 80% 高税率暴击；11-10 是关键日期（美国大选后）。

**🟢 政治局定调：宏观政策发力提效**
- 7-30 政治局会议：新增"加快推动新旧动能转换"、财政政策重在加快进度、货币政策综合运用适时调整、"六张网"建设扎实推进、清欠首提"常态化"。
- 高盛闪辉：AI 产业对 GDP 仍有一定拉动，未来贡献可能逐步下降。

**Mavis 点评**：央行的"适度宽松"已经不只是口号——10000 亿买断式逆回购 + 8000 亿两重项目是实打实的钱在路上。但通胀已经冷下来了，CPI 0.5% 距离通缩警戒线只剩 0.5pct，央行 Q3 还有再降准 25bp 的空间。海外那边，9 月加息概率已经打到了 35% 不到，但凡 8 月底杰克逊霍尔年会鲍威尔再鸽一点，10 月降息预期就要重燃——这对人民币资产是真利好。

### 二、半导体产业链 · 大年大年大年

**🟢 制造：中芯 + 华虹双雄业绩爆表**
- **中芯国际**（8-13 公告）：Q2 收入 30.06 亿美元（同比 +36.1%，环比 +20%），**首破 30 亿美元大关**；毛利率 25.3%（超 20-22% 指引）；归母净利 4.79 亿美元（同比 **+261.7%**）；Q3 指引环比 +2% 到 +4%，毛利率 26%-28%。
  - 关键数据：Q2 销售晶圆 287 万片（折 8 寸，环比 +14.4%），ASP 环比 +5.7%；中国区收入占比 90.2%（去年 Q2 84.1%），美国区从 12.9% 回落至 8.2%。
  - 赵海军判断：今年之内没有看到降价的可能性；折旧对毛利率影响约 4-5pct，二季度还原后实际毛利率比 Q1 高 9-10pct。
- **华虹宏力**：Q2 收入 7.175 亿美元（同比 +26.8%，创历史新高），毛利率 16.5%，**产能利用率 102.8%（满载）**；嵌入式非易失性存储器 +41.8%，独立式 NVM +149.3%。

**🟢 设备：景气右侧确立**
- TrendForce：2026 全球前十大晶圆代工 8 寸产能利用率回升至 88%，H2 达 90%；8 寸成熟制程已率先吃紧，H2-H1 酝酿第三波涨价（5-15%）。
- SEMI：2026 Q2 全球硅晶圆出货 3573 MSI，同比 +7.4%。
- 法国巴黎一大教授孔布：美国对华光刻机管制"短期放慢中国，长期倒逼自主研发"；中国 2026 年交付几台 DUV、2027 年 ~20 台（vs ASML 2025 交付 131 台 DUV）。"中长期欧美将失去中国客户"。

**🟢 存储：史诗级扩张**
- **Omdia 8-12 上调**：2026 全球半导体市场营收增长 **+94.1%**，存储器芯片占全球总营收 **50%+**；HBM/先进封装/先进制程产能瓶颈至少持续至 2027 年。
- **Counterpoint**：Q2 NAND 出货量份额：三星 25% / SK 海力士 22% / **长江存储 14%（首入前三）** / 铠侠 / 美光。
- **高盛**：DRAM 2026 涨幅上调至 **+250%-280%**，NAND **+200%-250%**。
- **长鑫科技**（8-12 公告）：成交额 230 亿元，收涨 7.8%，报 54.33 元；母公司长鑫存储 Q1 净利 +1268%，预计上半年预盈 500-570 亿（+2200%）。
- 三大原厂（Hynix/Samsung/Micron）将 80%+ 先进产能转向 HBM / DDR5，传统 DRAM 供给被压缩至 <20%；三星 6 月前停产 MLC NAND，美光停售消费级 DRAM。

**🟢 设计：科创芯片设计指数反弹**
- 上证科创芯片设计指数 8-13 涨 1.59%（盘中高 +3%），沐曦 +7.18%，盛科通信 +7.02%。
- 科创半导体 ETF 华夏（588170）半月 +10.33%，冲击 5 连涨；近 1 周日均成交 97.51 亿，居可比基金第一。

**🟢 手机：iPhone 17 累计 3954 万部**
- iPhone 17 系列累计销量约 **3954.25 万部**（截至 W31），单周新增 57.22 万部；上半年全球高端机（>$600）销量同比 +5%，占全球 29%（历史新高）。
- 苹果在高端市场份额从 2022H1 74% 降至 2026H1 65%，华为、小米高端化挤压。
- 存储涨价重压之下：iPhone 18 Pro 预计 +$200-300；苹果同时向面板供应商压价、延长库存周期。
- 华为 Mate 90 系列定档 9-23 深圳发布，搭载"韬定律"新一代麒麟芯片（晶体管密度 +55%、功耗 -41%）。
- 荣耀 Robot Phone 8-12 发布，全球首款机器人手机，9999 元起，搭载四自由度钛合金云台 + 系统级 Agent 架构。
- 8-12 REDMI K100 Pro Max 首销，销量为上代 150%，4199 元起，9070mAh 电池。

**🟢 板块行情**
- 8-13 收盘：半导体、芯片板块集体高开，中证半导体材料设备主题指数 +1.4%，上证科创板芯片指数 +2.6%。
- 半导体设备 ETF 易方达（159558）连续 5 日资金净流入合计 14.4 亿元。

**Mavis 点评**：半导体这条线我周三已经在圈里讲过——2026 是史诗级大年，现在 Omdia 把全年预测从 +62.7% 直接拉到 **+94.1%**，等于把上半年的逻辑又确认了一遍。中芯 Q2 收入首破 30 亿美元，归母净利同比 +262%，毛利率超指引上限，但市场之前不敢信——现在信了。中芯 + 长鑫 + 长江存储三巨头并起，国产替代从"能不能用"跨到"敢不敢用"的关键节点就在今年 Q3-Q4。**风险点：估值已经很高，融资余额创历史新高，杠杆踩踏的雷随时在。** 但只要 AI 资本开支（8867 亿美元/+90%）这条逻辑不破，回调就是买入机会。

  - 绿城朗月和风：周末两日到访 213 组，日均从 36 提升至 107，**环比 +197%**；

      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
