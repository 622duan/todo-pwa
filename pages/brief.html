## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**【10月22日】八部门联合印发《产业基础能力提升"十五五"规划》——行业首次发布产业基础领域规划文件**
工业和信息化部会同国家发展改革委、教育部、财政部、人力资源社会保障部、国务院国资委、市场监管总局、国家国防科工局联合印发，围绕 7 个方面提出 **22 项重点任务**。到 2030 年目标是：产业基础薄弱问题明显缓解，产业基础能力总体进入国际先进行列，新培育一批制造业单项冠军企业和专精特新"小巨人"企业。
七大重点方向：① 集中力量攻坚重点产业链关键基础产品，推动国企开放研发与供应链资源；② 梯度培育优质市场主体；③ 打通创新成果落地通道（编制创新成果推广目录、实施"一条龙"应用计划、完善首台套/首批次/首版次政策、建立创新产品采购容错机制）；④ 打造产业集聚高地；⑤ 强化人才要素保障；⑥ 构建多元投融资体系；⑦ 稳步扩大高水平对外开放。
前瞻布局领域点名：**量子科技、生物制造、氢能和核聚变能、脑机接口、具身智能、6G、深空深海深地极地**。
→ [证券时报](https://stcn.com/article/detail/4237790.html) | [央视财经/环球网](https://www.toutiao.com/articles/7699330176014172735/) | [人民日报（腾讯转载）](https://new.qq.com/rain/a/20261027A04U2E00)

**【10月21日】国务院印发《关于推动科技创新和产业创新深度融合的意见》**
围绕促进创新链产业链对接、强化科技供给、企业主导产学研融通创新等六方面作出部署，是"十五五"科技政策的纲领性文件。同日工信部印发《加快构建工业和信息化领域碳排放双控工作体系实施方案（2026—2030年）》。
→ [策略周报（新浪财经）](https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/846127921042/index.phtml)

**【10月16日】国务院常务会议部署深化拓展"人工智能+"行动**
会议要求**以落地应用牵引技术创新**，加强技术攻关和算法创新，促进**算电协同**，增加高质量数据供给。同日发改委印发《关于进一步完善价格形成机制推动普惠养老服务提质扩面的指导意见》。
→ [策略周报](https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/846127921042/index.phtml)

【10月26日】央行正式发布公告，决定设立**债市非银大额赎回互换便利（BondMarketNBFISwapFacility，简称 BNSF）**，在理财子等机构面临群体性流动性风险时提供回购融资支持，意在阻断"赎回—抛售"负循环，对银行/券商情绪与理财赎回压力有缓释作用。

**【10月16日】商务部拟将人工智能、生物医药、光伏三个领域 40 项技术增列入目录**

会议提出"要进一步发挥服务业对经济发展的支撑作用，加力推进服务业扩能提质，把服务业潜力空间转化为发展动能"，从**要素保障、准入破障到监管适配**系统性部署：加强融资、用地、人才、数据支持，稳步推进公共事业领域价格改革，加大力度盘活用好闲置资源；按全国统一大市场要求破除市场准入障碍，清理民间投资隐性壁垒。2025 年我国服务业总规模 80.9 万亿元，到 2030 年将迈上 **100 万亿元**台阶。
→ [中国工业新闻网/经济参考报](https://www.cinn.cn/yw/2026/10-26/gD7ZaLQr.html)

**Mavis 点评**：🟢 这周政策密度是近几个月最高的一次，而且逻辑高度一致——**从"给钱"转向"给制度"**。八部门产业基础规划 + 科技创新产业创新融合意见 + "人工智能+"国常会，三份文件指向同一件事：把基础能力（材料、设备、零部件）当成产业链安全的底座来做。**最值得注意的是"算电协同"四个字首次进入国常会表述**——这意味着电力/数据中心配套被正式纳入 AI 政策视野，对 IDC、液冷、电源、变压器这条链是实打实的利好。⚠️ 但要清醒：政策利好的是**供给侧能力**，短期无法解决终端需求不足的问题，后面会看到社零数据有多难看。

**Mavis 点评**：🔴 手机是今天最刺目的重灾区，**全球 -22%、中国 -15.4%，13 年最差**，而且这不是周期底部而是**加速下行**（中国跌幅从 Q1 的 -3.3% 一路扩到 Q3 的 -15.4%）。但我认为**真正的信号不是总量，而是结构**——华为 +17.3% 和苹果守住份额，安卓四家（OPPO/vivo/小米/荣耀）跌 17%—25%，**差距在 10—25 个百分点量级彻底拉开**。原因很直白：华为涨价幅度只有同行一半（数百到上千元），靠"够稳"接住了被涨价吓退的人群。⚠️ 我最担心的三件事：① **ASP 涨、毛利降**（小米 1,351 元 ASP 对应 8.5% 毛利）说明涨价只能转嫁成本不能创造价值；② 苹果把标准版推迟到 2027 是**用产品线做价格防守**，短期保住了高端用户，长期是**主动放弃大众市场**；③ 国产厂商海外份额一年从约 30% 掉到 25%，让出的货架被三星苹果填上了——**这比国内份额流失更难逆转**。IDC 说复苏要等 2028 年，我倾向于认为**消费级手机的"正常价格"永远回不去了**。

**Mavis 点评**：🟢 芯片是**国产化叙事最强、兑现度最高**的板块。三个数字最有说服力：**昇腾 384 超节点部署 750 余套、国产 AI 卡 H1 份额 66%、非GPU 出货首超 GPU**。寒武纪三季报 **95.26 亿营收 / 37.15 亿净利 / 56.53% 毛利率** 已经进入国际头部 AI 芯片公司的盈利区间。⚠️ 但我必须指出最大的隐患——**两家龙头的现金流都转负了**：寒武纪 Q3 经营现金流 -8,368 万（由正转负），海光前三季度 -24.43 亿（同比从 +22.55 亿转负），海光合同负债从 20.19 亿掉到 **0.12 亿**。**存货 116.65 亿、周转 541 天、合同负债几乎清零**——这说明**下游客户付款方式正转向"货到付款"，议价权在转移**。这不是财务造假，是行业性现象（海光同样如此），但它是一个**明确的周期位置信号**：**产能锁定的红利期正在转成现金流的消耗期**。国产化率 21%→43% 的跃迁是国策级别的大方向，但光刻/量检测/涂胶显影仍在低位——**最难啃的骨头还没开始**。

## 6. ✏️ 五、编辑后记

### 6.1 总论：今天有四条主线

**第一条主线：宏观在"生产强、需求弱"的岔路口上。** Q3 GDP +4.6% 稳住，Q3 环比 +1.2% 回升，9月工业增加值 +5.5% 逐月加快，出口交货值 +17% 创近5年单月新高，规上工业利润 +15.5%——这些数字都很好。但另一边，社零 +1.1%、限额以上商品零售 **-1.5%**、固投 **-7.2%**、地产 **-20.6%**、民间投资 **-10.4%**。**当前的经济增长是靠出口和高端制造在托底，而不是内需在自发修复**。更关键的是，9月 **PPI +5.0% 而 CPI 仅 +0.9%**，上游涨、下游不涨，中游制造业利润被两头挤——而这恰恰是消费电子产业链当前的真实处境。

**第二条主线：存储涨价已经从产业链事件变成了社会事件。** 我原本以为这轮存储涨价是半导体行业内部的周期故事，但 9月 CPI 数据打脸了：**数据存储设备同比 +46.7%、平板 +23.6%、计算机 +21.8%、移动电话机 +14.9%**。存储价格被写进了国家统计局的价格篮子。这意味着"算力税"已经从云厂商的账单，传导到了普通消费者的购物车和厂商的财务报表。余承东说每部手机成本多 **200 美元**、李斌说每辆车多 **1 万元**——这些不是抱怨，是账单。

**第三条主线：国产替代在 2026 年从"故事"变成了"合同和交付"。** 长鑫 G5 平台量产（half-pitch 11.95nm）、LPDDR6 全球首量产装进小米 18 Fold、前三季度净利 **1,310 亿元**；国产 AI 加速卡 H1 份额 **66%**，非GPU 出货**首次反超 GPU**；字节 400 亿锁单昇腾；SEMI 口径中国 Q1 设备销售 **+25% 创单季历史新高**。这不是 PPT 了。

**第四条主线：市场在 10月27日给了一次非常响亮的警告。** 隔夜美股科技大涨（费半 +3%）、日经 +1.73%、韩国 +3.09%，A 股却高开低走尾盘跳水，**科创50 -4.81% 创年内新低，超 4900 只个股下跌**，半导体板块主力净流出 **63.47 亿**，而银行逆势净流入 21.6 亿、工行建行创历史新高。**"产业强、股价弱"的背离，是筹码结构问题不是基本面问题**——但它提醒我们，**在这个位置，估值和情绪的杀伤力可以短期盖过产业景气**。

### 6.2 Mavis 独立判断（6 条）

**① 存储的股价风险，已经比基本面风险更近了。**
大摩的框架很清楚：存储板块股价通常在企业盈利峰值前 **4—8 个月**提前见顶；如果行业盈利峰值落在 2027年Q1—Q2，那么现在就是阶段性博弈窗口。**更要命的是我看到的两个背离信号**：① **合约价还在涨（Q4 DRAM +10%~15%），但 10月22日 NAND 现货已经转跌**（eMMC 8G 降至 $16.643），DDR5 现货涨幅从 0.38% 收敛到 0.28%；② **NAND 现货走弱的同时，手机出货 -22%、PC 出货 -21%**——终端需求塌了，现货就是先行的。我倾向于认为 **2026Q4—2027Q1 是存储板块的高波动区间，方向取决于"AI 资本开支是否继续上修"这一个变量**。

**② 国产 AI 芯片真正的软肋不是技术，是现金流。**
寒武纪 Q3 经营现金流 **-8,368 万**（由正转负）、存货 **116.65 亿**、周转 **541 天**、合同负债从 1.88 亿降到 1.41 亿；海光前三季度经营现金流 **-24.43 亿**（同比从 +22.55 亿转负）、合同负债从 **20.19 亿降到 0.12 亿**。两家行业最好的公司同时出现"利润暴增 + 现金流为负 + 合同负债清零"，这不是个体问题，是**行业性的议价权转移**——下游客户正在把付款方式从"预付"改成"货到付款"。**这个信号比任何一份技术路线图都更能说明周期位置**。我给国产算力赛道的判分标准就一条：**营收涨、毛利稳、存货是"锁产能"而非"清库存"、合同负债在回升**。四条缺一条，就要打问号。

**③ 手机行业正在从"多强并立"变成"超级头部通吃"，而且这个转变不可逆。**
华为 **+17.3%**、苹果守住 22% 全球份额，国产三家（小米/OPPO/vivo）全球份额一年从 13.2%/11.9%/8.5% 掉到 12.0%/10.0%/7.5%，**让出约 4pct**。更值得警惕的是海外——国产三家海外合计份额从约 30% 掉到约 25%，而三星苹果在海外合计从 42% 升到 53%，**一年多拿 10 个百分点**。IDC 说复苏要等 2028 年，但我认为更可能的现实是：**当存储价格回落时，国产厂商面对的已经不是"空出来的位置"，而是"已经被填上的货架"**。品牌心智和渠道布局的重建需要数年——这比一个季度的出货量重要得多。

**④ 中国制造业的"新三样"其实在偷偷完成一次能源结构切换。**
前三季度**光伏装机 12.99 亿千瓦已历史性超过煤电**，成为装机规模最大的电源品类；可再生能源装机 **24.96 亿千瓦**占总装机 **60.8%**；清洁能源发电占比 36.8%；单位 GDP 能耗 **-3.1%**、规上工业单位增加值能耗 **-4.3%**。同时原油、天然气产量双创历史同期新高（16,460 万吨 / 1,967 亿立方米）——**不是因为需求，是因为霍尔木兹海峡通行长期受阻，亚洲石脑油供应紧张**（10月23日东北亚乙烯现货 $1,190/吨，较冲突前 $695 溢价 **超 70%**）。这说明中国的能源安全已经不再依赖单一通道，这是十五五期间最被低估的结构性变化。

**⑤ 战略小金属的"管制溢价"正在变成可计量的数字，而海外的痛感已经开始显性化。**
锗锭 **28,500 元/千克**创本轮新高，且"每周一台阶"、无单周回调；铟较 1月 **+134%**（InP 光芯片直接受益）；**《金融时报》10月20日报道日本数月后将面临稀土紧缺，日本经产省称钇供应"已停滞"**。中国对美稀土出口 H1 **-49%**、对日 **-43.8%**。**真正的转折点不是管制发布，而是管制生效 6—12 个月后海外产业链开始断料的那天**。2026年11月27日是镓/锗对美暂停令的到期日——**这个日期要标在日历上**。

**⑥ 算力泡沫的裂缝不在技术，在变现曲线。**
Anthropic 招股书披露未来 7—10 年算力采购合同合计约 **4,500 亿美元**，Meta 多年支出承诺约 **8,250 亿美元**，瑞银测算 3 年累计 4.1 万亿美元。而另一边：IDC 预测 2027 年全球生成式 AI 市场规模仅约 **1,500 亿美元**；麦肯锡调研**近 80% 部署 AI 的企业未实现净利润提升，95% 的生成式 AI 试点无可衡量财务回报**。**8,250 亿 vs 1,500 亿，这个剪刀差是本轮周期最大的裂缝**。但我要补一句：即使有泡沫，基础设施建成后支撑的产出水平会更高——互联网时代"看似过剩的建设"最后降低了宽带成本、催生了云计算。**所以正确的问法不是"是不是泡沫"，而是"变现曲线追上资本开支曲线需要几年"**。我的答案是 **3—5 年**，这意味着中游（存储、设备）有 2—3 年的好日子，而下游（手机、PC、汽车）要忍更久。

### 6.4 风险提示

1. **存储周期顶部风险（最高优先级）**——大摩明确警告 DRAM 合约价同比增速大概率在 2026Q4 见顶，板块股价领先盈利峰值 4—8 个月；2027下半年全球新增产能集中释放，消费级 NAND 可能面临价格回落。板块远期 PE 仅 3—4 倍看似低估，实为典型周期顶部估值陷阱。
2. **AI 资本开支放缓风险**——本轮存储涨价的核心驱动是 AI 算力对产能的虹吸。若超大规模厂商资本开支增速放缓或消费级需求因涨价过快萎缩，合约价涨幅收窄甚至阶段性回落，将直接冲击国内存储设计企业的毛利率改善逻辑。
3. **地缘与技术管制风险**——美国国土安全部已对 DeepSeek 产品和服务发布联邦采购排除及移除命令；出口管制政策持续演变可能影响国内存储/晶圆厂获取先进设备、EDA 与高端材料。镓/锗/稀土的管制窗口在 11月27日到期。
4. **国产算力产能与制程风险**——中芯 7nm 存在 40% 晶圆缺口；长鑫 4F² 仍在样品阶段（计划 2026 年底出 DDR5 RDIMM 样品），HBM3 试产初期良率仅 25% vs 成熟 80%。若制程突破节奏慢于预期，国产替代逻辑兑现将延后。
5. **需求端持续走弱风险**——固投 -7.2%、民间投资 -10.4%、限额以上商品零售 -1.5%、居民消费支出增速低于收入增速 1.7pct。若 Q4 消费进一步走弱，涨价传导将面临"提价即失量"的两难。
6. **市场结构风险**——10月27日科创50 -4.81% 创年内新低，RSI(14) 主要指数全线低于 30（科创50 19.42、创业板 20.58），已进入极端超卖但趋势未确认。融资融券余额 23,892.59 亿，环比 -55.63 亿，杠杆资金延续降仓。**"产业景气与股价背离"更偏交易结构与筹码层面的集中兑现**，不宜在未确认企稳前盲目抄底。
7. **业绩集中兑现窗口风险**——三季报密集披露期，个股业绩与预期差可能放大波动（10月27日紫光国微跌停、星宸科技跌超 14% 即为样本）。
8. **油价与地缘反复风险**——布伦特 10月27日 **$113.90**，虽因俄乌赫尔松局部停火回落，但多家能源机构认为高位或延续至 2028 年后；霍尔木兹海峡通行受阻推高国内化工成本（东北亚乙烯溢价超 70%）。
