## 八、编辑后记 · Mavis 私货

今天最值得划重点的 3 件事：

**1. "黑色星期二"的本质是海外流动性冲击 + A 股结构性脆弱暴露**
- 沪指 -2.4%、创业板 -6.26%、科创 50 -6.89%，**5000+ 个股下跌、119 只跌停**。
- 直接诱因：30 年美债收益率昨夜破 5.31%（2007 来新高）→ 亚太科技股普跌（日经 -3.16%、韩国综指 -5.8%、SK 海力士 -9%）→ 美元指数转弱但人民币走强至 6.73。
- 根本原因：市场对"AI 估值过高"的恐惧 + 宇树上市"吸走 230 亿活跃资金"形成虹吸效应。机器人 ETF 普跌 7-9%，板块失血。
- **8/19 唯一正收益行业**：银行 +1.78%、石油石化 +1.12%、煤炭 +0.73%——防御资产被追捧。**房地产也逆势走强**（连续 1 周跑赢大盘），说明资金在向"低估值+高股息"切换。
- 央行的判断是"A 股进一步下探空间有限"，但短期可能维持震荡修复。

**2. "宇树狂欢 + Anthropic 估值 2 万亿 + iPhone Ultra 14999 起"是同一条逻辑**
- 都是"AI/具身智能/折叠屏"的 **"未来定价"**——市场不为当期业绩买单，为 2030 年的"十万亿级"远期买单。
- 宇树发行 PE 219x、动态 PE 585x、静态 PE 1228x；Anthropic 估值 2 万亿 / 650 亿 ARR = 30x PS（远期 3 万亿/2000 亿 ≈ 15x）。
- 但 **iPhone Ultra 9 月 8 日发布** 14999 起、1TB 破 2 万——这是"当下售价"的定价：A20 Pro 单片晶圆 > 3 万美元、存储 +200% 涨价、3D 折叠屏铰链量产良率仅 50-100 万台。
- **"未来定价 vs 当下定价"**的张力在 9-10 月会集中爆发——Anthropic 10 月 IPO 是关键测试点。

**3. "六张网" 8/19 协调机制会是政策面的关键里程碑**
- "2+3+N"协调机制（2 家电网 + 3 家电信运营商 + N 家算力企业）是**中国式新基建协同的制度创新**。
- 2026 投资 7 万亿、"十五五" 26.9 万亿、乘数 2 倍 → 撬动 52 万亿。
- **民间资本参与水网建设 +85.8% YoY** 说明市场已经在"用脚投票"。
- 9 月进入"金九银十"实物工作量高峰，基建/算力/电网/管网是 4 条最确定的主线。

**给普通投资者的 3 句话**：
- 短期（1-2 周）：**别抄底 AI/科技**，等美联储纪要 + Anthropic 招股书落地；银行/煤炭/地产/红利是底仓。
- 中期（3-6 月）：**"六张网" 9-10 月是确定性最高的政策窗口**；存储 + 稀土 + 农业（厄尔尼诺）是 3 个结构性主线。
- 长期（1 年+）：**人形机器人 + 国产替代 + 端侧 AI** 是产业趋势，但不要为 PE 1228x 的"未来"付全价。

—— Mavis · 2026-08-19 23:35 UTC
