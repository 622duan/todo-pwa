### 8.4 编辑后记（v6 关键改动）

今天不做"今日 4 大主线"式的总论。挑三个不那么显然的信号。

**第一个：中芯国际的"量的增长空间基本见顶"和长鑫科技的"单季净利 541.5 亿"是同一件事的两端。**

中芯 Q2 财报里赵海军那句"计入三季度新增产能后，产能利用率将维持约 95%，同时仍需保留约 5% 用于研发"——**产能利用率见顶，意味着中芯的增长从此只能靠涨价和产品结构，而不能再靠投片**。这解释了为什么 Q3 收入指引突然降到环比 +2%~4%（Q2 是 +20%）。但另一端，长鑫 Q3 单季净利 541.5 亿、环比只增 2.41%——增速掉下来不是因为存储不涨了（Q4 合约价反而从 +3~8% 上修到 +10~15%），而是因为**合肥二期和北京厂的利润占比快速提升，少数股东损益吃掉了归母部分**。把这两条合起来看：晶圆代工和存储的利润正在**同时从"总量扩张"转向"结构分配"**，这意味着**接下来 12 个月赚的是"谁的产线折旧完了、谁的产能排到 2028 年"的钱，不是"谁扩产快"的钱**。

*可验证判断*：北方华创（在手订单 850 亿、排产至 2027Q3，部分至 2028 年初）在 11 月三季报中若显示**合同负债继续环比增长且经营现金流转正**，说明订单正在转成确定性收入；同时看**中微公司**（订单能见度超 80 周）——它比北方华创更纯粹、更早暴露周期位置，如果中微的 80 周能见度在 Q3 财报后开始缩短，**存储扩产周期见顶的信号就是它**。风险在于精智达的教训：9.4 签下 15.76 亿大单后股价当天 -8.13%——**框架协议不创造现金流，只创造预期**。

**第二个：9 月 CPI 里"数据存储设备 +46.7%"，和 Q3 全球手机出货 -22%，这两件事不是矛盾，是同一条价格链的两端。**

CPI 同比里，数据存储设备 +46.7%、平板电脑 +23.6%、计算机 +21.8%、移动电话机 +14.9%，四项合计上拉 CPI 同比约 0.23pct——这是**统计局替我们确认了存储涨价已经传导到终端零售价**。同一时间，全球手机出货 -22%、换机周期拉长到 4 年。而 CPI 环比里服务价格从 +0.1% 转 **-0.2%**、机票 -8.7%、宾馆 -7.0%——**消费需求在缩**。所以真实的画面是：一条产业链上，存储的涨幅（+46.7%）跑赢了手机的涨幅（+14.9%），**差价被手机厂和消费者共同承担**：小米 ASP 涨到 1351 元创历史新高，毛利率却从 11.5% 掉到 8.5%。这不是需求疲软这么简单，是**价值链上新增的利润没有落到终端用户手里，而是被上游截留了**。

*可验证判断*：看 11 月底双十一 + 小米 Q3 财报两个节点。如果小米 Q3 毛利率**没有回到 10% 以上**、或者 2027 年 ASP 指引继续下调到 1500 元以下，那么"存储涨价由消费者买单"这个假设就证伪，届时**国产手机厂会走向两个极端：砍掉存储容量规格（降规格路线，跟巴克莱报告里说的芯片设计商"降规格"策略一致）或者彻底退出中低端**。风险是第二种——OPPO/vivo/小米/荣耀海外合计份额已从 30% 掉到 25%，**它们如果在中低端继续失守，回来的时候面对的是三星和苹果已经填上的货架，不是一个空位**。

**第三个：稀土 11.10 悬崖的真正杀伤力不在稀土本身，在 0.1% 那条线。**

商务部 2025 年第 70 号公告暂停的是 55/56/57/58/61/62 号公告，为期一年，11.10 到期自动恢复。多数讨论集中在"稀土涨不涨"，但真正有牙齿的是 **61 号公告的域外原则**：任何在**中国境外**生产、含中国原产稀土成分达产品价值 **0.1%** 及以上的产品，再出口都需要中国许可。这不是限制稀土出口，是**把审批权伸进别人的工厂**。数据已经显示这不是纸面条款——8 月稀土出口 4735 吨，同比 **-18.2%**（在"暂停"状态下），而美元金额同比 +53.5%，**单吨价值 +72.7%**，这是许可配给制的算术特征；同时对日**零出口**镝铽氧化物（2025.11-2026.5），日本磁体厂只拿到管制前 12 个月镝进口量的 **4%**，德国是 0%。

*可验证判断*：**11.10 之前，看 MP Materials（MP）Q3 财报是否首次披露重稀土（Dy/Tb）实际产量和收入贡献**——它 200 吨/年的名义产能对比中国约 90% 的重稀土分离份额，这是西方第一个可信替代，但也是"名义产能"和"实际产出"最容易被混淆的地方。如果 MP 的 Q3 财报仍然只有"预研/调试中"的措辞，那么 11.10 之后 MP、USA Rare Earth（USAR）、Energy Fuels（UUUU）会出现脉冲式上涨，域外溢价（氧化铽约 4500 美元/kg、氧化镝约 1450 美元/kg）会再上一个台阶。**具体到 A 股可交易标的，北方稀土（600111）和中国稀土（000831）这一轮的实际受益时间点是 11.10 之后而非之前**，而中国稀土前三季度净利已预增 88.96%-140.99%——**业绩已经先行，价格还没走**。

风险点很具体：如果 11.10 出现的是"部分恢复 + 延长其余暂停"（外交上最可能、也最难交易的结果），那么以"全面恢复"为前提的稀土多头会在 11.10 当天被埋。**这 40 天的正确姿势不是赌方向，而是把仓位换成"部分恢复"情景下也能活的那部分**。

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
