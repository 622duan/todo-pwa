## 2. 📊 一、宏观 + PEST

### 1.1 🟢 政策面 P — 稳投资再加码，"六张网""两重"成关键抓手

**核心政策动作：**

- **8.28 全国投资工作推进会议**：发改委、工信部、住建部、交通运输部、水利部、国家能源局六部门一把手出席，明确"六张网""两重"为稳投资 7 项工作重点。[来源：新华财经](https://www.toutiao.com/article/7680345407695684131/)
- **8 月以来发改委密集召开 5 次稳投资专题会**：从"两重"建设到 109 项"十五五"重大工程加快落地。
- **8000 亿元新型政策性金融工具**预计下半年集中投放，补充重大项目资本金并撬动银行贷款；2026 年新增专项债 4.4 万亿元，下半年剩余 **2.3 万亿元** 待发（财政部副部长廖岷表态）。
- **"六张网"**（水网/电网/算力网/交通网/油气网/通信网）109 项重大工程项目加速推进。
- **9.1 湖南专项债招标**：发行 70.52 亿元，十四期用于土地储备，十五-十七期用于交通/能源/生态环保/社会事业，再融资专项债用于偿还 2021 年保障性安居工程到期本金。
- **8.28 三部委完善商品住房销售制度**：住建部 + 自然资源部 + 金融监管总局联合发文，要求"有序推行商品住房现房销售"；央行 + 金融监管总局发布房地产信贷管理新规；证监会发布资本市场支持房地产新模式意见。

**Mavis 点评**：政策已经从"喊话"阶段切换到"真金白银"阶段。下半年 2.3 万亿元专项债 + 8000 亿元政策性金融工具 = **3.1 万亿元子弹**正在路上，节奏明显比上半年快。但能不能真正转化成"实物工作量"还得看项目储备和地方执行力——目前看是"不缺钱，缺好项目"。

### 1.2 🟠 经济面 E — 制造业 PMI 回稳，但需求端仍弱

**8 月经济数据：**

| 指标 | 8 月 | 7 月 | 同比变化 |
|------|------|------|---------|
| 制造业 PMI | **49.8%** | 49.2% | +0.6pct |
| 生产指数 | 50.4% | 49.9% | +0.5pct |
| 新订单指数 | **50.6%** | 48.5% | **+2.1pct** |
| 新出口订单 | 50.1% | 49.6% | +0.5pct |
| 非制造业商务活动 | 49.0% | 49.0% | 持平 |
| 综合 PMI 产出 | 49.5% | 49.3% | +0.2pct |
| 原材料购进价格 | **56.6%** | 53.2% | +3.4pct |
| 出厂价格 | 50.4% | 47.8% | +2.6pct |

**结构亮点：**
- 装备制造业 PMI 51.4%，高技术制造业 PMI **52.9%**(生产/新订单均在 53% 以上)
- 消费品制造业 PMI 49.0%(+1.2pct)，高耗能 47.9%(+0.9pct)
- 21 个细分行业中 **16 个 PMI 较上月上升**

**金融数据(9.1)：**
- 央行开展 50 亿元 7 天逆回购（利率 1.40%）+ 3590 亿元隔夜逆回购
- 净回笼 4690 亿元（"跨月后顺势回笼"，非收紧）
- **DR007 加权 1.3841%**，隔夜 Shibor 1.364%（政策利率下方）
- 8 月 MLF 缩量续作（5000 亿元 1Y，利率 2.50%）
- 1Y LPR 3.00%，5Y LPR 3.50%（连续 4 个月不变）

**Mavis 点评**：PMI 触底回升是好事，但 49.8% 仍在荣枯线下，**16 个行业改善是"环比"，不是"绝对"**。真正值得看的是出厂价格指数重返扩张区间（50.4%）——这是 PPI 触底信号，对企业利润修复至关重要。9 月降息降准概率不大，央行更倾向于"隔夜逆回购+买断式"等结构性工具精准滴灌。

### 1.3 🟣 社会面 S — 青年就业结构性错配

**青年就业现状：**
- 2026 届高校毕业生 **1270 万**（同比 +48 万，连续 8 年破千万）
- 全年求职市场 **1500 万人**抢岗，校招岗位仅 **567 万个**（3:1 抢岗）
- 校招岗位较峰值缩水近 **40%**，25%+ 企业明确缩减校招
- 专科 offer 率 **56.7%** > 本科 45.4% > 硕士 40%（**学历越高越难就业**）
- 真正签劳动合同的毕业生仅约 **55%**
- 近 25% 毕业生连一次面试机会都没有
- 普通岗位平均收 17.2 份简历，应届生投 150-200 份才能换 1 个 offer
- **港青(20-29 岁)失业率 8.4%**，比整体 3.7% 高出 4.7pct
- 2025 年 7-8 月青年失业率峰值 **18.9%**(2024 年 7-8 月为 15.3-15.7%)

**消费与外贸：**
- 1-7 月全国固投(不含农户) 26.03 万亿元，**同比 -6.7%**
- 上半年高技术产业投资 +4.6%
- 上半年服务零售额 +5.3%
- 2025 年汽车出口 832 万辆，2025 年我国对外籍个人股息红利所得 **9.1 起不再免征个税**

**Mavis 点评**：1270 万毕业生 + 3:1 抢岗 + 学历贬值 = **就业市场进入"结构性挤压"**。AI 冲击的是初级岗位（行政、文书），而"白领情结"还根深蒂固。**硕士跑不过专科**这件事，本质是产业结构和教育结构的错位——"白领入场券"增速跑不赢毕业生增速，扩招惯性停不下来。这不是周期问题，是结构问题，3-5 年内看不到根本解。

## 8. ✏️ 编辑后记

### 8.1 今日 4 大主线

1. **美伊冲突 + 全球债市抛售** — 9.1 美军空袭伊朗 + 伊朗威胁关闭霍尔木兹海峡，原油瞬间 +5% 站上 $90；美 10Y 收益率 4.80% 创 19 月新高，30Y 5.28%，全球债市同步抛售（日本 10Y 3% 创 1996 来新高）。**地缘溢价+财政赤字+沃什鹰派**三股力量拧在一起，9.16 FOMC 决定方向。
2. **存储 "涨价狂欢" 进入下半场** — 8 月 DDR4 +4.2% / NAND +1.4%，Q3 涨幅从 Q2 45-50% 收窄到 18-23%。江波龙存货 258 亿（占总资产 60%）是定时炸弹，但三星 70% 产能锁到 2031 + LTA 谈 2029-2030 表明 HBM/AI 主线仍吃紧。**国泰海通判断涨价趋势延续到 2027 年**。
3. **半导体设备 + 国产 AI 芯片 "成建制打胜仗"** — 27 家设备 H1 净利 +94%，中微 +300%、拓荆 +1324%；国产 AI 芯片调用份额 42% vs 美国 47%。9.17-9.24 华为 + 阿里双会将"国产超节点"推到台前。
4. **"六张网"加码 + 地产"现房销售" 30 年最大制度变化** — 8000 亿元政策性金融工具 + 2.3 万亿元专项债下半年集中投放；8.28 三部委要求"有序推行现房销售"。地产从"以价换量"切换到"制度重构"。

### 8.2 Mavis 独立判断

1. **9.16 FOMC 加息概率 >66% 是真信号**。沃什杰克逊霍尔讲话已经把"2% 通胀目标坚定且固定"摆到台面，加上 8 月油价 +5% 推升通胀预期脱锚，**巴克莱预计 9 月+12 月各加息 25bp** 不像是 PPT。**这意味着人民币贬值压力会上升，国内降息空间被进一步压缩**。
2. **存储链 "利润 +71500%" 的故事下半年会哑火**。江波龙 8.26 股价较高点 -51.4% 已经先于业绩见顶。基数效应让 2026H2 同比增速从 +700% 跌到 +50% 甚至更低，**市场会从"看增速"切换到"看环比"和"看 2027 供需"**。但也别全看空，HBM/AI 仍吃紧，企业级存储仍能涨。
3. **手机 Q2 -7%~-11% 不是底部**。IDC 已经把 2026 预测从 -13.9% 下调到 -16.7%，2027 继续 -1.1%。**Android 阵营丢失的 7pct 份额**短期回不来，iOS 23.6% + 鸿蒙 24%(中国) 抢占。**关注 9.5 苹果发布会 + 折叠屏 2026 +12.6% 逆势**。
4. **"现房销售" 是 30 年最大变化，但短期是供应收缩**。北京、上海"以旧换新" + 8 月 474 亿元收储专项债 + 深圳新房 +32% YoY 都在指向一件事——**一线核心城市企稳，三四线继续跌**。分化会进一步加剧。
5. **半导体设备 "估值 TTM PE 127 倍 90% 分位" 是真贵**，但订单能见度 80 周+ 历史上从没出现过。**9-10 月如果叠加美债利率 + FOMC 加息 + 油价上行的"杀估值三件套"**，板块短期可能回调 10-15%。**别追高，等回调 15%+ 分批进**。
6. **9 月华为 + 阿里双会 + FOMC + 中美 AI 对话** = **4 大事件窗口**。建议 9.10 之前把仓位降到 6-7 成，9.17 之后看昇腾 950 商用细节 + 美联储决议再定方向。

        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
