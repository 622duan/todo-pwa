### 8.4 编辑后记（v6 关键改动）

今天不写"四大主线"。只讲三个不那么显然的信号。

**第一个：长鑫前三季净利 1310 亿 + 存储 Q4 涨幅降到 20%——这两件事放在一起，才是中国存储股真正的分水岭。**
表面看，DRAM 合约价涨幅从 Q2 的 80% 掉到 Q3 的 40% 再掉到 Q4 的 20%，是"涨价周期见顶"的经典信号。但同一时间，长鑫前三季归母净利 1310-1325 亿、同比 +2581%，营收同比超 7 倍；高盛同一天（10/1）把 2027 年 DRAM 缺口从 -2.5% 下修到 **-5.9%**。这两个数据指向的是同一件事：**行业从"涨价驱动"切换到"产能驱动"**。过去赚的是价差，现在赚的是量和国产替代份额——价差会收敛，份额不会。所以我的判断是：**存储板块接下来要看的不是价格曲线，是国产原厂的产能爬坡和长协锁定比例。**具体到可验证的点：如果 Q4 长鑫月产能站上 **32 万片**、且高盛 2027 缺口预测不再下修，那么"涨幅放缓 = 景气见顶"这个判断就是错的，北方华创/中微的设备订单还能再讲一年。

**第二个：Q3 全球手机出货 -22%，但存储占 400 美元以下机型的物料成本已经到 60%——这不是消费崩塌，是产业链重新分配利润。**
IDC 的 -22% 是有记录以来最大单季跌幅，媒体全在写"手机行业崩塌"。但同一份数据里，华为是唯一双位数增长（+17.3%、份额 21.1%），苹果份额还升了 4.8pct 到 19.5%，国产三家合计在海外的份额从约 30% 掉到 25%——被三星和苹果吃掉的份额是**永久性的货架位置**，不只是量的转移。**这跟存储是一回事**：小米 ASP 涨到 1351 元但毛利率从 11.5% 掉到 8.5%，说明成本涨得比价快，低端机已经无利可图；而长鑫的内存进了全球首款智能体手机努比亚 NaviX Ultra，鸿蒙装机量破 1 亿。**判断：2027 年中国手机市场（IDC 预测全年 -7%、2027 大部分时间仍明显下滑）的看点不是销量，是单台价值量。**验证条件很硬——如果 12 月底促销季旗舰机降价超过 500 元，说明 20% 的涨价幅度已经越线，产业链利润再分配就停住了；如果不降价还能守住销量，那三星苹果拿走的就是永久份额。

**第三个：9 月 20 日公积金提取从 6 项扩到 9 项，新增装修和物业费——这个动作比降首付更值得盯，但它指向的不是楼市，是"存量持有成本"改革。**
多数解读集中在"9.20 政策放松利好地产"，但把时间和动作连起来看：10 月 15 日杭州多子女家庭贷款上限从 306 万提到 324 万，10 月 22 日成都推**现房销售定金制**，1-9 月二手网签 +10.7%、上海二手同比 +0.8% 是 70 城首个转正——**这些全部指向同一个转向：从"帮居民买第一套房"转向"帮居民把已经持有的房子住得更省"。**装修、物业费、加装电梯都进得去，这套逻辑是"住房持有环节成本减负"（易居报告原话）。**判断：这条线对家电、家装、物业服务的现金流影响是直接的，量级被市场严重低估。**可验证的点：如果明年一季度物业服务/家装板块的经营性现金流同比改善超过 10%，说明"小钱包变大钱包"真的兑现了；如果一季度仍是"政策热度高、订单没来"，那就是又一次预期透支。

**最后一句风险，比上面三个都重要：**
黄金在 4,060 美元，伦敦银已经跌破 54.75 前低，12 月加息概率 68.9%——**如果 10/29 凌晨沃什的措辞偏鹰，那么"AI 资本开支 + 高利率 + 强美元"这个三杀组合会同时压到科技股和贵金属上**。纳指已经从 6/22 高点跌了 20%，而费半年内还有 +62.1% 的涨幅垫子没打完。**这个缓冲垫越厚，10/29 那天砸下来的越狠。**不要在 FOMC 前夜加杠杆。

        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });

        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
