## 七、编辑后记

**今天的几条核心判断**：

1. **国常会+央行四箭齐发是 Q4 主基调**：PSL 利率 -25bp 至 1.5%、房贷贴息 1% 落地、5000 亿支农支小再贷款——Q4 弹药上膛，看 12 月经济数据能否回升到 5%。

2. **存储是当下最强景气方向**：Micron 单季营收 $542 亿同比近 4 倍，CEO 说 2027、2028 两年供不应求；长鑫终于学会定价权（报价敢高于三星）。HBM 抢产能到极致，消费级 DRAM 跟着喝汤。

3. **苹果折叠屏 10 月发布 + iPhone 18 Pro 中国 +12%**：库克用 Pro 系列吃掉所有升级周期，iPhone Duo 1999 美元定价锚定高端折叠屏市场。存储涨价反而帮苹果——所有竞品涨 $200+，苹果相对性价比反而提升。

4. **黄金短期承压但中长期逻辑没破**：9 月跌 6.22% 是因为美债收益率飙升+美元走强，但央行月均 50 吨买盘+ETF 回流托底，摩根斯坦利看 $5000 不是梦。短线投机者跑了，战略投资者还在买。

5. **DeepSeek/Anthropic/OpenAI 三线齐发**：DeepSeek ARR 翻倍到 10 亿美元、估值 750 亿融资中；Anthropic 2 万亿估值冲刺感恩节 IPO；OpenAI 软银 646 亿/NVIDIA 100 亿到位。AI 资本泡沫还没到顶。

6. **A 股节后关注点**：10/8 央行买断式逆回购净投放 2000 亿，10/9 9 月 CPI/PPI 数据，10/13 苹果折叠屏发布会，10/15 TSMC 财报。中长期看好——Q4 政策密集落地 + 估值低位。
