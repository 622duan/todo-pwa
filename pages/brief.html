## 📰 8 大板块速读

### 1️⃣ 宏观 PEST
- **政治**：六大部委 7 月协同落地楼市 "王炸"（住建部+央行+财政部+金管+税务+自然资源）；二十届三中全会改革部署继续推进。
- **经济**：二季度 GDP 实际 **+4.3%**（一季度 5.4% 放缓），但 GDP 平减指数转正，名义增速 13 季度首超实际；6 月工业增加值 **+5.3%**（装备制造、新动能领跑），固投 1-6 月 -5.7%（基建年内首度转负）。
- **社会**：上半年人均可支配收入增速低于经济增速，中位数低于平均，K 型分化延续；6 月社零同比 +1.0%（超预期），618 大促不达预期。
- **技术**：工信部将印发算力标准体系建设指南；AI 智能体从基础设施投资期向商业化变现期过渡；7/15 网信办首批端侧大模型备案（苹果、华为、荣耀等）。

**Mavis 点评**：宏观面其实是"价升量减"——名义增速转正是好信号，但工业产能利用率 73% 创六年新低，光伏、电池拖累电子之外的扩产。上层已经放弃"房地产夜壶"思路，国资直接进场收储是制度型转折，下半年看新质生产力（AI、机器人、固态电池）能否接棒。

**【设备】🟢 卖方市场**
- ASML 2Q 净销售 93 亿欧元 / 毛利率 54%，2026 全年指引由 360-400 亿 **上调至 430-450 亿**，**Low NA EUV 明年再 +30%** 产能。中国市场净销售占比 ~20%。
- SEMI 年中预测：2026 全球设备销售 **+23.2% 至 1659 亿美元**；2028 年达 **2295 亿美元**（连续 5 年增长），其中晶圆设备 1439 亿、测试 +31%。
- 国内：科创半导体设备 ETF（588710）7 月吸金 **44.55 亿元**；半导体设备 ETF 易方达年内规模 **+11.5 倍**。
- 哈工大 DPP-EU 光源突破 + 国产化产业链提速，但与 ASML 仍有 10-15 年差距（行业判断），真正量产还在 2027-2028。

**【制造】🟢 涨价+扩产**
- 台积电 2Q 营收结构：3nm **30%** / 5nm **33%** / 7nm **11%** / 2nm **3%**，先进制程合计 **77%**。
- 台积电 3nm/5nm 涨价 **5-10%**，三星 4nm/5nm 新客涨价 **15%**；玻璃中介层 2026 出样品，对标 CoWoS。

- 三星 SF1.4 量产 **2029 年**（落后台积电 1 年），2030 推 SF1.4+。
