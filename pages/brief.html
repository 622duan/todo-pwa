### 4.4 存储：本周期最硬的一条线

**价格（TrendForce，10/21）**

| 品类 | Q4 环比 | 历史分位 |
|---|---|---|
| 一般型 DRAM | **+10%~15%** | 15 年 **76—89 分位** |
| 含 HBM 整体 DRAM | **+15%~20%** | 极高 |
| NAND Flash | **+15%~20%** | 15 年 **90—95 分位** |
| 企业级 SSD | **+23%~28%** | 最高项 |

**斜率收敛但水位未降**：Q2 约 +80% → Q3 约 +40% → Q4 约 +20%。高盛 10/1 将 2027 年 DRAM 供需缺口从 -2.5% 下修至 **-5.9%**、NAND **-4.6%**，判断紧张延续至 2028 年；美银上调 2030 年全球内存市场规模从 1.8 万亿至 **2.0 万亿美元**，2027—2030 年 DRAM+NAND CAGR **21%**。

**产能分配**：韩系厂 **70%—80%** DRAM 产能转向 HBM，仅留 20%—30% 给 DRAM/LPDDR。摩根大通测算 DRAM 缺口 2026 年 **20%**、2027 年 19%、2028 年 15%。到 2027 年 HBM 占用全球内存晶圆产能近 **30%**，但只贡献 **13%** 容量。

**国产份额**：长江存储中国 NAND 份额 **28%（去年）→ 38.5%（Q2）**，首次超过三星；长鑫全球 DRAM 营收份额 **4%（25Q2）→ 10%（26Q2）**，升至全球第四；长鑫 DRAM 月产能接近 **32 万片**，一年内计划新增超 **10 万片**推至 42 万片以上，2028 年底有望达 **60 万片**（+87.5%）。长鑫前三季度营收 **2650—2700 亿元（+7 倍以上）**，归母净利 **1310—1325 亿元**，同比扭亏为盈。

**争议与分歧**：美光 10/21 明确**不跟进长鑫 4F² 路线**，坚持 6F² 并迈向 3D DRAM，理由是 DRAM 微缩终极瓶颈在**电容间距**而非单元结构，且 4F² 对 ALD 与选择性外延工艺复杂度极高。行业对 4F² 的商业化时点存在分歧，但**中信里昂认为产业机会集中在要求更高的刻蚀、沉积及热处理工艺设备供应商**。三星已展示 16Gb 4F² 测试芯片，SK 海力士推 4F² VG 平台。韩国《每日经济》专栏引发全球存储股抛售（10/13 KOSPI **-5.46%**，三星 -7.39%、海力士 -10.09%），黄仁勋 10/22 在柏林 GTC 回应"2029 年不会过剩"——**"用得更多" vs "产能集中释放"的对决，本质是需求假设 vs 供给时间表**。

**传导到终端**：内存已占惠普整机成本约 **35%**（上季 15%—18%）；32GB DDR5 单条从约 900 元涨到约 **4000 元**；IDC 预警 2026 年 PC 价格普遍涨 **15%~20%**；Q3 全球 PC 出货 **6270 万台（-20.1%）**，连续第二季下滑；服务器级 DDR5 克价已达国际现货黄金的 **1.84 倍**。

**Mavis 点评**：今天产业链最干净的一条线是**设备**。国产化率 16%→26%→43% 的斜率在变陡，而且不再靠发布会，靠的是**在手订单兑现**（先锋精科在手订单 +80%、陶瓷加热器四季度小批量量产）。零部件那个 **8% vs 美国 59.7%** 的数字，才是真正的天花板。

存储这条线要**分开看**：Q4 涨幅收窄到 20% 是"减速"，但 15 年 90 分位是"仍在高位"。真正该盯的变量是 **HBM 的产能分配**和**长鑫的扩产节奏**——这两个才是 2029 年那场辩论的答案。寒武纪的 **147 亿存货+预付** 是个漂亮的提醒：在这个行业，缺货不是机会，是**要花钱买的机会**。

**铝**：国内电解铝运行产能接近产业天花板，上周产量 87.41 万吨（+2.49%）；社会库存 **60.10 万吨**（周降 4.50 万吨）；但 9 月地产竣工面积 **-25.10%**、9 月新能源汽车产量 **-8.72%**，需求端塌方明显。**氧化铝总库存 706 万吨（同比 +52.19%）**，严重过剩是核心矛盾。

**锂**：枧下窝环评拟批准公示，复产窗口可能提前至 **11—12 月**，满开月产 5000—6000 吨 LCE；智利再抛五个新矿招标；港口锂矿库存单周累库 **4.5 万吨**。机构判断处于"复产预期加速兑现 + 旺季成色不足 + 资金集中卖空"共振下行，**不宜抄底**。

**多晶硅**：10 月产量降至 **10.78 万吨（环比 -10.98%）**，11—12 月逐月降至 9.67 / 8.44 万吨；但 9 月末社会库存 55.76 万吨，两个月去库不足 1.6 万吨，**高库存基数稀释减产利多**，期价不涨反跌。

**稀土**：镨钕 901.4 元/公斤持平。欧盟拟就中国稀土"最低价格"机制达成一致（**待最终确认**）。

今天是 2026 年 10 月 27 日，日报第 337 期。

今天这份日报，有两条线特别值得停下来多看两眼。

**第一条：国产化率从"补课"进入"赶考"。** 16% → 21% → 26% → 43%，这条曲线的斜率正在变陡，而且最关键的变化是——**驱动力从市场逻辑切换成了安全逻辑**。过去国产设备撬不动门，是因为性价比打不过；现在能撬开，是因为客户要给供应链留后路，试用窗口被打开了。

但我要泼一盆冷水：**这个窗口不会永远开着**。等供应链重新稳定，客户会重新拿成本、良率、效率这些硬指标筛设备。窗口关上之前，谁能把"送样"变成"复购"，谁就留在了牌桌上。零部件那个 **8% vs 美国 59.7%** 的数字，是这场考试里最难看的一栏。

**第二条：存储这条线，已经不是"半导体行情"了，是"算力抢产能"的社会成本外溢。** 内存占惠普整机成本 35%，Q3 全球手机出货 -22%，PC 出货 -20.1%，高通的ahlí手机芯片收入 -20% 然后裁员。**下游厂商正在为上游的利润表付账**。

而上游这边，长鑫三个月内把月产能从 32 万片推向 42 万片，2028 年底 60 万片；长江存储 2027H2 新增一个 Fab、NAND 产能翻倍。**韩国《每日经济》那篇专栏之所以能砸掉 KOSPI 5.46%，就是因为市场开始意识到：缺货的钱最终会变成过剩的产能。**

黄仁勋说"内存很棒的一点是你永远可以用得更多"，可他没说够不够快。这场辩论要到 2029 年才有答案，但答案会写在长鑫的月度产能爬坡曲线里，不在谁的嘴上。

**所以今天最该盯的三个指标**：
1. **8 英寸产能利用率能不能守住 90%**——跌破 85%，这轮涨价周期就结束了
2. **中芯和华虹在折旧压力下的毛利率能不能守住 20%**——新厂投产掉到 20% 以下，说明规模换不来利润
3. **国产浸没式 DUV 有没有产线交付的实锤**——不是发布会，是交付记录

至于八卦环节——王灿那 744 万的涨幅和美光那 1 个月的履历，我读出了点别的东西。一个 2016 年还在华为赛门铁克写驱动的工程师，2020 年去美光只待了 1 个月，2025 年年薪就涨到 945 万、辞掉上市公司核心技术人员的位置去子公司搞自研主控。**这不是个人故事，这是国产存储从"缺人"到"抢人"的价签。**

最后照例提醒一下：明后两天有 **SK 海力士（10/28）、三星电子（10/29）** 财报。它们的 HBM 价格和产能指引，会直接决定寒武纪 Q4 那 39.74 亿能不能交出来、MLU580 能不能放量。**下一个变量，就在下周。**

        document.getElementById('briefContent').innerHTML = html;

        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';

    function goHome() { window.location.href = 'home.html'; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
