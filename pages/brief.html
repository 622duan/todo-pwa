## 🧭 板块 1：宏观 PEST

### P - 政治
- 7/30 政治局会议对房地产只写 7 个字——**"稳定房地产市场"**（提、改、删三字诀：要托底，不强刺激）。城市更新被剔除出房地产表述，回归长期工程。
- 央行 8/1 下半年工作会议：**"继续实施好适度宽松的货币政策"**，强调"两项支持资本市场工具"稳定市场信心。
- 北京 8/7 印发房地产新政：非京籍 1 年社保、五环外不限购、公积金额度最高 340 万——**一线城市首个跟进政治局表态的城市**。

### E - 经济
- 7 月外贸（美元口径）：出口 **3978.5 亿美元（+23.9%）**，进口 2853.5 亿美元（**+27.5%**），顺差 1125 亿美元。前 7 月累计进出口同比 **+17.3%**。

### S - 社会
- 上海到 2030 年民营经济增加值占比目标 **33% 左右**。
- 广东 7 月用电量 **破 1000 亿度**（全国首个省级单月破千亿）。
- 政策面：上海多区消费券覆盖夜间经济/机场免税；海洋经济 5.5 万亿元规模被定位"蓝色引擎"。

## 🧪 板块 2：半导体产业链

### 设备
- SEMI 预测 2026 全球设备销售 **1659 亿美元**（+23.2%），2028 年达 **2295 亿美元**，连续 5 年增长。
- 台积电 2026 CapEx **600-640 亿美元**（上修 80 亿）。
- ASML Q2 净销 93.26 亿欧元（同比 +21%、环比 +6.4%），年内第二次上调全年指引。
- 半导体设备零部件进入"全链条涨价"，海外交期大幅延长；中微公司华中总部落户光谷（注册资本 5000 万），三星/SK 海力士评估其刻蚀设备入华。
- 国内设备国产化率 16%→30%+；大基金一期减持盛科通信 1%（7/21-8/6 减持 410 万股）。

### 制造
- 台积电 3nm Q4 月投片冲 **18 万片**（提前 2-3 月）；2nm 上半年月投片 5-6 万片，Q4 增至 8 万片以上，年底近 10 万片。
- CoWoS 封装告急，台积电把 CoW 进一步外包给日月光等封测厂。
- 三星代工 H2 利用率冲 100%（目前 70-80%），4nm 满载至 2027 年建议客户转 5nm。
- 因 DRAM 短缺，台积电 **N2 制程的 A20 Pro 库存积压 10 亿美元**等待封装，拖累苹果 iPhone 18 备货。

### 设计
- AMD 8/6 宣布收购 AI 推理芯片公司 Taalas（强化 AI 路线图）。
- Anthropic 首次公开确认组建自研芯片团队（多芯片策略：AWS/谷歌/NV/AMD 仍是核心）。
- 长鑫存储 **LPDDR6 进入研发验证尾声**，已向核心客户送样，2026H2 发布并量产导入。
- 高通 9 月起对高端芯片涨价 **10-15%**。
- 2026H1 全球智能手机 SoC 出货 **-15%**（成本上涨 + 厂商库存管理 + 换机周期延长）。

### 存储
- **DDR5 16Gb Major 8 月初 40→48 美元（+14.29%）；DDR5 24Gb Major 42→48 美元（+14.29%）**。HBM 缺口 5.1% 创 2011 来新高，DRAM 缺口 4.9%，NAND 缺口 4.2%。
- 伯恩斯坦 7 月报告：Q3 传统 DRAM 合约价环比 +17%，NAND 涨幅近 20%，但**涨价潮接近天花板**；存储股 8/8 普跌（SK 海力士 -6%、西数 -6%、闪迪 -4%、美光 -3%）。
- SK 海力士 8/7 宣布投资 **54 万亿韩元** 建设龙仁 Y2 与青州 M17 晶圆厂（锁定 AI 内存中长期产能）。
- 三星 70% 内存产能已被 LTA 锁单，HBM 短缺明年进一步扩大；CFIA 报告称**消费级 NAND Q4 承压**。
- 长鑫科技 7/27 科创板上市，发行价 8.66 元，募资 579 亿元（超中芯 532 亿纪录），上市首日 **+465.82%**，收盘市值 **3.28 万亿元**，超茅台约 2 倍，**登顶 A 股市值第一**。8/10 起纳入 MSCI 中国全股票指数。

### 材料 / 封测
- 2026 年中国大陆半导体材料销售 **156 亿美元（+12.5%）**；高端材料供给缺口 ~25%。
- 半导体材料设备指数 8/6 涨 3.51%；巨芯、有研新材、有研硅、江化微涨停。
- 华海清科（Hua Hai Qing Ke，688120）8/9 涨 6.01%（259.30 元，市值 1287 亿，PE 130）。

**Mavis 点评**：设备 + 制造的景气是"看得见的繁荣"，存储的景气是"听得见的天花板"。伯恩斯坦那个"涨价接近天花板"会重演 2018Q3 那一波——价格倒挂往往出现在"创新高"那周。SK 海力士 54 万亿投资是给 AI 长期派的定心丸，但消费端 Q3 拐点要注意。苹果囤 10 亿美元 A20 等 DRAM 这事儿本身就是最好的指标：连苹果都要抢货，Q3 不会便宜。

## 📱 板块 3：手机终端

### 销量结构（K 型分化）
- 2026Q2 中国出货 **6601 万台（-4.3%）**，已连降 5 季；上半年累计 **1.34 亿台（-4.2%）**。

### 产业链涨价传导
- 苹果紧急抢购 DRAM 芯片（美光供应不足，转 SK 海力士/三星/长鑫）。
- 微软 Win 11 提升内存利用效率，删除 32GB 推荐——**这本身就是 DRAM 短缺的副产品**。
