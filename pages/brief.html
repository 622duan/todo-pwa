## 📊 2. 一、宏观 PEST

### 2.1 🟢 政策面 P

**🟥 10.16 国常会聚焦"人工智能+"**——国务院总理李强 10 月 16 日主持召开国务院常务会议，听取"人工智能+"行动进展情况汇报。核心定调："人工智能是影响未来发展的关键变量"，要夯实发展底座（算电协同、高质量数据供给），突出赋能应用（实体经济供需衔接、场景培育），统筹发展和安全（因业分级分类施策）。会议还原则通过《教师法（修订草案）》和《价格法（修正草案）》，重点整治低价无序竞争、健全行业成本调查、制止低价倾销配套规则——直接对应当前存储涨价、AI 算力定价博弈等热点。([人民网](https://politics.people.com.cn/n1/2026/1017/c1024-40816345.html) / [新华社](https://tv.cctv.cn/2026/10/16/VIDEm4gTaJbsfKXfO7GHMkE6261016.shtml))

**🟥 央行"组合拳"四箭齐发**——中国人民银行 10 月 13 日宣布：(1) 下调 PSL 利率 0.25 个百分点；(2) 扩大 PSL 支持领域，将"六张网"（水网、新型电网、算力网、新一代通信网、城市地下管网、物流网）建设纳入支持领域；(3) 增加科技创新和技术改造再贷款额度 2000 亿元，并将支持比例从 60% 提至 100%；(4) 增加支农支小再贷款额度 5000 亿元（其中民营企业再贷款额度增 3000 亿元）。9 月 27 日已先行降准 0.5 个百分点 + 7 天逆回购下调 0.20 个百分点（1.70% → 1.50%）。([经济日报](https://www.toutiao.com/article/7695918464506151460))

**🟥 财政部 5500 亿元地方债务结存限额**——10 月 9 日财政部安排使用地方政府债务结存限额 5500 亿元，其中一般债务 3000 亿元全部分配县区，专项债务 2500 亿元重点支持"六张网"建设，向经济大省倾斜。([界面新闻](https://www.toutiao.com/article/7695004577229324800/))

**发改委 88 个项目 311 亿元民间投资**——9 月 29 日发改委向民企公开推介 52 个制造业项目（总投资 524 亿元，拟引民间 155 亿元）+ 9 月 10 日 36 个项目（总投资 614 亿元，拟引民间 156 亿元），重点领域覆盖核电（莱阳一期民资参股 25%）、风电、储能、充电设施、水利等。([中国发展改革报](http://fgw.xiangyang.gov.cn/gzdt/fgyw/202610/t20261010_4070441.shtml))

**🟥 9 月 28 日国常会部署"六张网"+ PSL 框架**——研究宏观政策发力提效、促进有效投资，推出一批增量政策，加快专项债发行使用进度，9 月新增专项债发行额同比 +**50.2%**。([央视网](https://big5.cctv.com/gate/big5/news.cctv.cn/2026/10/11/ARTISReCbs0xHtS8Vv5sIlv9261011.shtml))

**Mavis 点评**：今天的"政策包"非常清晰——人工智能+ 是国常会明确定调的"十五五"主线，央行 4 箭 + 财政部 5500 亿 + 发改委 88 项目"六张网"已经形成"产业+货币+财政+投资"的四轮齐发格局。重点观察：央行将 6 万亿规模（粗略估算）的"六张网"纳入 PSL 是少见的"产业+货币"深度联动，央行的支持比例从 60% 提到 100% 是本次政策最大机制优化——这等于直接降低银行对中小科技企业、设备更新贷款的风险权重，"敢贷、愿贷"机制下，2027 年设备更新贷款投放有望同比翻倍。

### 2.2 🟠 经济面 E

**🟥 9 月 PPI 同比 +5.0% 创近 4 年新高**——9 月 PPI 环比 +1.2%（涨幅扩大 0.8 个百分点），同比 +**5.0%**（涨幅扩大 1.2 个百分点），为 2022 年 7 月以来近 4 年新高。8 个行业涨幅比上月均扩大：煤炭开采 +35.3%、石油天然气开采 +24.5%、石油煤炭加工 +21.6%、化学原料 +12.1%、有色冶炼 +21.4%、电气机械 +6.2%、计算机通信 +5.8%。([国家统计局](https://www.stats.gov.cn/sj/zxfbhjd/202610/t20261014_1965475.html))

**🟥 9 月 CPI 同比 +0.9%，核心 CPI +1.0%**——9 月 CPI 环比 +0.2%（涨幅回落 0.2 个百分点），同比 +0.9%（涨幅扩大 0.1 个百分点）；扣除食品能源的核心 CPI 同比 +1.0%（与上月持平）。数据存储设备价格同比 +**46.7%**、平板电脑 +23.6%、计算机 +21.8%、移动电话机 +14.9%——电子消费品"价升"特征明显。([央广网](https://finance.cnr.cn/ycbd/20261014/t20261014_527841877.shtml))

**🟥 9 月制造业 PMI 50.1% 重回扩张区间**——9 月制造业 PMI 50.1%（+0.3 个百分点），时隔两个月重返扩张区间；生产指数 51.7%（+1.3）、新订单 50.5%（-0.1）；非制造业 50.2%（+1.2）、综合 50.7%（+1.2）。21 个行业中有 12 个 PMI 高于临界点，比上月多 4 个。([国家统计局](https://www.stats.gov.cn/zwfwck/sjfb/202609/t20260930_1965449.html))

**🟥 9 月出口同比 +36.3% 单月破 5 万亿**——9 月进出口 5.16 万亿元（首次单月破 5 万亿，同比 +27.5%），出口 3.03 万亿元（+29.6%），进口 2.13 万亿元（+24.6%）；以美元计出口 +**36.3%**（增速较 8 月加快 11.3 个百分点），进口 +31%。贸易顺差 1335.3 亿美元。集成电路出口 449.51 亿美元，同比 +**136%**；自动数据处理设备及零部件 +92.9%；手机 +14.2%（出口均价 +30.6%、数量 -12.6%）；汽车 +62%。前三季度进出口 39.94 万亿元（+18.8%），出口 +16.4%，进口 +22.3%。([海关总署/澎湃](https://www.toutiao.com/article/7696517742157840896))

**LPR 维持 3.0%/3.5%**——10 月 20 日将公布 10 月 LPR，市场预期维持 1 年期 3.0%、5 年期 3.5% 不变，已连续 16 个月不动。([Trading Economics](http://hi.tradingeconomics.com/china/interest-rate))

**前三季度挖掘机开工率环比 +1.71%**——9 月全国工程机械平均开工率环比上涨 1.71 个百分点，28 个省份环比正增长（比 8 月多 9 个），"西北能源项目+东南沿海配套工程"双线领跑；9 月新增专项债发行额同比 +50.2%。([央视网](https://big5.cctv.com/gate/big5/news.cctv.cn/2026/10/11/ARTISReCbs0xHtS8Vv5sIlv9261011.shtml))

**Mavis 点评**：今天的经济数据"冰火两重天"——外需端"AI+芯片"拉动出口 +36.3%、集成电路 +136% 创历史新高，PPI 同比 +5.0% 创 4 年新高；但内需端 CPI 同比 +0.9%（核心仅 +1.0%）、服务价格环比 -0.2%、制造业用工景气回落（从业人员指数 48.4%）。"上游强、终端弱"的结构性分化仍在加深——PPI-CPI 同比涨幅差扩大至 4.1 个百分点，1-8 月汽车制造业营收 +2.9% 但利润 -16.0%。这是为什么政策要"针对性反内卷"：昨天国常会《价格法》修正案直指"低价无序竞争"，就是要稳住中下游企业利润。

### 2.3 🟣 社会面 S

**国庆 8.26 亿人次出游**——2026 年国庆 7 天国内出游 8.26 亿人次，国内旅游总收入 **7383.75 亿元**；10 月 1-6 日全国 78 个重点步行街/商圈客流量同比 +2.5%、营业额 +4.7%。([商务部/中国日报](https://www.bizchina.com.cn/a/202610/12/WS6acc5699e4b09a165c78ec75.html))

**失业率 5.1% 持平**——9 月全国城镇调查失业率 5.1%（与上月持平），但制造业从业人员指数 48.4%（-0.3 个百分点），用工景气继续回落。([国家统计局 PMI 报告](https://www.stats.gov.cn/zwfwck/sjfb/202609/t20260930_1965449.html))

**9 月线下消费 +3.1%**——三季度线下消费支付金额同比 +2.6%（较 Q2 提高 0.7 个百分点），9 月单月 +3.1%（较 8 月 +0.5 个百分点），连续 3 个月上行；中小商户 9 月支付金额 +5.7%（较 8 月 +1.3 个百分点）。([央视网](https://big5.cctv.com/gate/big5/news.cctv.cn/2026/10/11/ARTISReCbs0xHtS8Vv5sIlv9261011.shtml))

**快递业务量破 1500 亿件**——截至 10 月 11 日，今年我国快递业务量突破 1500 亿件，比 2024 年提前 37 天。([新华社](https://m.nbd.com.cn/web_app/column/375?max_pos=4087382))

**🟥 黄金周零售涨价潮传导**——9 月 1 日华为/小米/荣耀同日集体上调在售机型价格（小米 17 由 4799 元 → 5099 元、Pro Max 由 6499 元 → 6999 元；华为 Mate 80 12+256GB 4699 元 → 5499 元，涨幅 800 元；iPhone 18 Pro 国行起售价 8999 元 → 9999 元，Pro Max 9999 元 → 10999 元，1TB 涨幅 2500 元）。([界面新闻](https://www.toutiao.com/article/7694194019760407082/))

**Mavis 点评**：社零数据表面温和恢复（线下 +3.1%），但深层次是"旺丁不旺财"——国庆出游 8.26 亿人次创新高，但单价消费在缩水，电影票冷清、VR 抓娃娃排队，反映娱乐预算从"单次大额"拆成"多次小额"。更核心的问题是涨价潮传导：9 月 1 日集中调价后，4 季度手机出货预计继续下滑（IDC 预测 -15% 甚至 -20%），这意味着 C 端的通胀压力已经开始反向压制需求，"PPI 高、CPI 低"的剪刀差不会持续很久——预计 10 月 CPI 反弹至 +1.1% 附近。

## 🏭 4. 三、上下游产业链

### 4.1 原材料

**🟥 稀土反制锁定美国半导体上游命脉**——商务部 10.9 稀土出口管制直接针对 14nm 以下逻辑芯片+256 层以上存储芯片+相关设备材料。辛德尔豪濒临破产（ASML EUV 镜头稀土镀膜核心供应商）证明中方对欧洲关键矿产的"外科手术"级打击；镓/锗/锑早已实施管制。([腾讯新闻](https://view.inews.qq.com/a/20261015A056Z400))

**🟥 9 月有色金属价格同比 +21.4%**——9 月有色金属矿采选业/冶炼和压延加工业价格同比 +21.4%；铜箔环比 +4%（宁德时代 Q3 单位利润主要压力）。([国家统计局](https://www.stats.gov.cn/sj/zxfbhjd/202610/t20261014_1965475.html) / [腾讯新闻](https://news.qq.com/rain/a/20261013A0858I00))

**🟥 原油/天然气进口金额 +3.3%/+34.0%（量减价升）**——9 月原油进口数量 -21.5%、均价 +31.6%；天然气进口数量 -1.7%、均价 +36.2%（霍尔木兹海峡通航受阻 + 供暖季临近）。([澎湃新闻](https://www.toutiao.com/article/7696517742157840896))

**🟥 煤炭价格 9 月环比 +9.5%/+13.6%**——冬季供暖备煤需求 + 主产矿区供应偏紧 + 国际煤价上涨预期，煤炭开采和洗选业 +9.5%、煤炭加工 +13.6%。([国家统计局](https://www.stats.gov.cn/sj/zxfbhjd/202610/t20261014_1965475.html))

**Mavis 点评**：原材料板块今天的关键信号是"地缘溢价"——稀土是地缘博弈，铜/铝/锡是 AI 与电力需求拉动，煤炭/原油/天然气是地缘紧张推升。这三股力量叠加，导致 9 月 PPI 同比 +5.0% 创 4 年新高，但这种价格上行不是健康的需求拉动，而是供给约束+地缘风险溢价，对中下游企业利润是双重挤压（"增收不增利"）。

## ✏️ 6. 五、编辑后记

### 总论

**今天 4 大主线**：
1. **政策"四箭齐发"**——国常会"人工智能+"明确定调 + 央行 PSL 利率下调+六张网纳入支持+设备更新再贷款支持比例提至 100% + 财政部 5500 亿地方债务结存限额 + 发改委 88 个项目 311 亿元民间投资，2026 Q4 的"政策包"已经形成。
2. **经济数据"外强内弱"**——9 月 PPI 同比 +5.0% 创近 4 年新高、出口 +36.3%（集成电路 +136%）、PMI 重回 50.1% 扩张区间；但 CPI 同比 +0.9%（核心仅 +1.0%），内需仍弱，PPI-CPI 剪刀差扩大至 4.1 个百分点。
3. **存储芯片"代际撕裂"**——DDR4 三个月 +24% 罕见反超 DDR5（+20%）；HBM4 报价 4-5 美元/Gb 等于 HBM3E 三倍；短缺持续到 2028-2029；长鑫科技市值 3.06 万亿重回 A 股第一，国产存储板块从"政策驱动"转向"市场驱动"。
4. **手机"量跌价升"**——Q3 全球 -22% 创 2012 以来最大降幅，中国 -15.4%；存储成本同比 +350%；DRAM 已超过 SoC 成旗舰成本最高元器件；华为 Q3 同比 +17.3% 成头部唯一双位数增长。

### 5 条 Mavis 独立判断

1. **HBM4 三倍报价 = 存储芯片进入"代际定价"新周期**。这不仅是涨价，而是定价逻辑根本切换：从"库存周期"波动转为"算力稀缺资源"溢价。SK 海力士（Vera Rubin 60-70%）、三星（25-30%）、美光三强格局短期难破，国产存储（长鑫/长存）需要 3-5 年才能进入 HBM 主战场。

2. **手机市场进入"剩者通吃"阶段**。存储涨价是天然筛选器，2026 Q4 至 2027 全年下滑趋势已成定局（IDC 预测 2027 年大部分时间仍将下滑）。华为 21.1% 份额登顶中国，是国产手机品牌"软硬件垂直整合"的胜利——麒麟+昇腾+多形态产品+克制定价。**小米/OPPO/vivo 必须从"中端走量"转向"垂直赛道突围"才能活下来**（一加 16 主打游戏影像 +18% 销量增速是成功案例）。

3. **国产替代从"政策驱动"转向"市场驱动"**的临界点已到。海光信息、寒武纪、长鑫 G5、摩尔线程、昇腾 950 业绩兑现 + 政策保护 + 商务部稀土反制——三股力量首次在 2026 Q4 形成共振。设备国产化率从 16% → 21% → 26%（2026 预测）→ 43%（2028 预测）的曲线在加速。**最值得关注：长鑫 G5 平台 11.95nm 已经接近顶尖 1c DRAM 节点**——这意味着国产 DRAM 距离全球第一梯队只差半代。

4. **稀土反制是 10.9 落地的"精准外科手术"**。商务部出口管制只针对 14nm 以下逻辑芯片+256 层以上存储芯片+军事用途，既不影响民用合规贸易，又精准打到美国/日韩/欧洲半导体设备对镓/锗/中重稀土的依赖。辛德尔豪濒临破产（ASML EUV 核心供应商）证明中方对欧洲关键矿产的反制能力——**欧盟急求北京谈判就是最好的注脚**。

5. **中芯/华虹"量价齐升"逻辑至少持续到 2027 H1**。中芯 Q2 毛利率 25.3%（比 Q1 +6 个百分点）、华虹 Q2 净利同比 +385.9%——成熟制程 ASP 提价能力在增强。**集邦预测 2026 全球晶圆代工产值 +24.8%（2188 亿美元）**，AI 芯片需求持续性 + 消费电子备货 + 国产替代是三大支撑。

### 风险提示

1. **存储涨价反噬** — DDR4 3 个月 +24% 已经传导到手机（IDC 预测 2027 年大部分时间仍将下滑）、PC、汽车等多个终端。如果消费端无法承受，可能出现"涨价-需求收缩-渠道库存积压"反向循环。
2. **稀土反制升级风险** — 中美 11.10 暂停窗口到期后，若双方未能达成共识，可能出现新一轮关税与出口管制螺旋升级。
3. **AI 估值高位回调** — Gartner/Dell'Oro 警告：尽管 7 月起纳指已调整 4.48%，但美 10Y 5.06% + Vera Rubin 量产延迟仍可能引发 AI 板块二次回调。
4. **大基金减持/产业资本退出** — 二季度国家队已对部分半导体标的减持（如中国中车、国电南瑞），需关注产业资本减持节奏。
5. **欧洲需求下滑** — 即使中国对欧盟出口 9 月 +25.3%（抢出口+季节性），但欧洲制造业 PMI 52.9% 已接近触顶回落。

      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
