**长协与产能**：
- 海外存储大厂 2027 Q1 报价较 2026 Q3 **上调 30-40%**，已获下游大客户接受；苹果已接受三星 2027 Q1 存储报价。
- 🟥 2027 年 HBM 均价预计同比 **+121%**，HBM4e 价格突破 **5 美元/Gb**。
- 三星 / SK 海力士 / 美光 2026 合计资本支出接近 **1200 亿美元**，均创历史新高；但新厂到 2027 H2 才投片，明显放量拖至 2028。
- 2027 年 HBM 预计占全球 DRAM 晶圆产能近 **30%**，但只能贡献约 **13%** 容量份额——**"吞噬效应"是本轮最硬的供给逻辑**。
- HBM 单片晶圆面积约为同容量通用 DRAM 的 **3 倍**；单台 AI 服务器 DRAM 容量是传统服务器的 **8-10 倍**。

**🟥 长鑫科技业绩预告**（10.19 临时股东会）：
- 前三季度营业收入 **2650-2700 亿元**（同比增加 2329.16-2379.16 亿元，**同比超 7 倍**）
- 归母净利润 **1310-1325 亿元**（上年同期 -52.80 亿，**同比扭亏为盈**，净利增量 1362.80-1377.80 亿）
- 合肥、北京两地晶圆厂高产能利用率运转，订单饱满；已完成第一代到第五代工艺平台迭代，覆盖 DDR5 / DDR5X / **LPDDR6**（速率 12800Mbps，功耗较上代 -20%）
- 预计 2025-2030 年 DRAM 行业年均复合增长率 **38.39%**
- 董事长朱一明提议回购 **10-20 亿元**

**⚠️ 关键分歧（韩媒引述专家）**：韩国《每日经济新闻》引述专家警告——**随着大量新增产能陆续投产，2029 年起存储市场将转为"红海"**。**🟥 英伟达 CEO 黄仁勋 10.22 在柏林 GPU 技术大会反驳**："内存半导体供应过剩不太可能在 2029 年之前发生"，理由是 AI 对内存的消耗是**结构性效率挤压**而非线性容量叠加；英伟达已将手机用 LPDDR 引入数据中心（能效达现有方案 2 倍）。

**长鑫 4F2 架构进展引发的供给担忧**：相较主流 6F2，4F2 记忆体单元面积理论上可缩小约 **33%**，但目前仍缺乏明确量产良率、成本及大规模客户验证资讯；单元面积缩减不代表晶圆有效位元产出等比例增加。

2. **半导体圈**：存储正在经历**从"涨价预期"到"业绩兑现"的关键切换**——TrendForce 预计 Q4 NAND **+15-20%**、企业级 SSD **+23-28%** 的同时，长鑫前三季净利 1310-1325 亿（扭亏）、寒武纪 Q3 +147.74%。但真正的分歧在**2029**：韩国专家警告新增产能投产会转"红海"，黄仁勋反驳"2029 年前不会过剩"。**判断这场分歧谁对，盯 HBM 产能占比这一个变量就够了**——2027 年 HBM 占 DRAM 晶圆产能近 30% 却只贡献 13% 容量，这个"吞噬效应"只要不消失，消费级存储就永远缺货。

### 8.4 编辑后记

**🟥 Mavis 点评**：

今天是 2026 年以来最戏剧化的一天——**A 股深 V 反转 + 美股道指跌 652 点 + 布伦特破 116 美元 + 黄金跌破 4000**，四个方向完全相反的市场同时发生。这种日子最容易犯的错是**把任何一个单一信号当成结论**。

我想说的是三件事：

**第一，10.23 的 A 股反弹不是"牛回来"，是"政策底 + 资金底 + 盈利底"三件事同时落地。** 三季报那天晚上披露的寒武纪（+147.74%）、北方稀土（+161.13%）、云汉芯城（+312~355%）、东岳硅材（+19413%），是真金白银的业绩兑现，不是 PPT。ETF 连续 14 日净流入 2612.96 亿、主动 ETF 首日破百亿、40+ 家上市公司抛出 113.7 亿回购，是真金白银的资金。**这三样东西同时出现，在 A 股历史上是极少数。** 但童第轶那句话我认同——"底部是一个区域，不是某一个点"。**今天只是这个区域里的一根阳线，不是确认信号。**

**第二，全球的麻烦不在 AI，在油。** 霍尔木兹海峡两艘超级油轮触雷、载 450 万桶原油的船弃船逃生、沙特拦截胡塞导弹——**这直接推高布伦特到 116.72**。而油价 → 通胀 → 美联储（12 月加息概率 78%）→ 美债 10Y 回 5% → 成长股折现率上行，**这条链条是 2026 年 Q4 全球风险资产的总开关**。黄金跌破 4000 那个反直觉信号，我建议记住：**当避险资产和风险资产一起跌的时候，说明真正的风险是"流动性"而不是"事件"**。下次油冲到 120，A 股的成长板块会很难受。

**第三，也是我最想说的：存储和手机的故事，已经从"同一件事"变成了"两件事"。** AI 服务器存储（DRAM +10-15%、HBM 缺口 50-60%、长鑫净利 1310 亿）是超级周期；消费级存储（手机 BOM 占比 64%、全球出货 -22% 创 13 年新低、IDC 说 2027 复苏无望）是**需求破坏正在兑现**。同一颗芯片，两条完全相反的曲线。**手机厂商的"砍量保价"（小米毛利率 11.5%→8.5%）和存储厂的"扩产"（三巨头 1200 亿美元资本开支）撞在一起，就是明年最大的产业风险。** 2029 到底转不转红海，取决于 HBM 产能占比这一个变量——**这是 2027 年最值得盯的一条线。**

**最后一句**：如果你只想记住一个数字，记 **116.72**（布伦特）。它不是最刺激的，但它决定了下周 10.27-28 FOMC 的姿态、决定了美债能不能站住 5%、决定了这轮深 V 是"一日游"还是"起点"。

祝周末愉快。别在 10 月底追高，也别在恐慌时割肉。**管住仓位比看对方向重要。**

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
