### 3.1 政策面：10.16 国常会聚焦"人工智能+" + 禁限出口技术目录修订

**10.16 国务院常务会议**（新华社 / 央视新闻联播）专题研究"人工智能+"行动进展，提出三方向：
- **夯实底座**：加强技术攻关和算法创新，促进**算电协同**，增加高质量数据供给
- **赋能应用**：以实体经济为重点强化供需衔接，鼓励联合研发、推进中试验证
- **统筹安全**：因业分级分类施策，加强风险研判评估，守牢安全底线

同日原则通过《教师法（修订草案）》、《价格法（修正草案）》—— **价格法重点：依法依规治理低价无序竞争，制止低价倾销，健全行业成本调查制度**（针对平台经济"内卷"），14 部行政法规修改、4 部废止。

**10.15 商务部 + 科技部**：拟修订《中国禁止出口限制出口技术目录》，公开征求意见——**40 项关键技术**：人工智能 23 项（大模型、智能体、算力集群、信息处理）、生物医药 5 项（细胞基因治疗、小核酸药）、光伏 12 项（多晶硅/硅片/电池制造 + 关键设备）。**对已通过开源、学术论文进入公共领域的不纳入**。

**10.15 国新办预告 10.19 发布会**：商务部 + 工信部 + 文旅部介绍"加快推进科技兴商"。

**10.14 中金公司吸收合并东兴 / 信达证券**进入换股实施阶段，10.16 为股权登记日——**头部券商整合落地**。

**10.9 商务部 + 海关总署**联合公告：自 **11.8 起**对超硬材料、稀土设备和原辅料、钬等 5 种中重稀土、锂电池和人造石墨负极材料相关物项实施出口管制。

      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
