## 一、宏观 PEST：美联储今夜凌晨揭晓，9 月加息概率飙至 80%

### 政治（Politics）

**🟥 6 月 GDP 同比 +4.7%，二季度放缓至 +4.3%** — 季度低于 4.5% 引发市场对"稳中求进"基调的讨论。上半年最终消费、资本形成、净出口分别拉动 GDP +2.1 / +1.7 / +0.8 个百分点，三大需求贡献差距收敛。7 月政治局会议窗口将至，"跨周期"表述或淡化。

**🟥 沃什上任第二场议息，今夜 2 点公布** — 7/29 FOMC 投票结果 9:3，3 票反对（Hammack / Kashkari / Logan）均要求加息 25bp。措辞从"重申"改为"继续执行"，删除"部分原因在于中东冲突"的前置定语。芝商所 FedWatch 显示 7 月加息概率 35%，9 月已飙至 80%。

**🟥 中东战事升级：美沙联手空袭伊拉克，伊朗革命卫队对约旦美军基地发动弹道导弹突袭** — 霍尔木兹海峡 7/21 起通过量从 800 万桶/日骤降至不足 200 万桶；也门胡塞武装宣布对沙特实施海上禁运，曼德海峡 7/23 仅 10 艘油轮通过（两天前 17 艘）。油价单日反弹抹平前一周跌幅。

**🟢 商务部"万字长文"回应产能过剩指责** — 强调产业补贴与产能过剩不存在必然联系，出口多、顺差大不等于产能过剩。商务部服贸司司长表示中美双方正在就贸易理事会架构及 300 亿美元规模对等降税安排征求意见。

### 经济（Economy）

**🟢 6 月出口再创纪录：4124 亿美元/月首次破 4000 亿** — 同比 +27%（前值 +19.4%），环比 +9.5%（过去 5 年同期均值 +3.8%）。进口 2868 亿美元，同比 +36%，环比 +5.7%。贸易顺差 1256.2 亿美元。AI 产业、绿电出口是主推手。

**🟢 PPI 结束 41 个月负增长，二季度 GDP 平减指数 13 季度首转正** — 上半年名义 GDP +5.3%，增量 3.6 万亿元（近 5 年同期最大）。1-5 月规上工业企业利润 +18.8%，营收利润率 5.56%（2023 年以来同期新高）。

**🟡 6 月社零环比 +0.27%，但居民消费倾向仍偏低** — 上半年人均可支配收入增速低于经济增速，中位数低于平均数，中低收入人群增长偏慢。消费倾向仅高于疫情较重的 2020、2022 同期。

**🟡 上半年房地产投资 -18.0%，新开工 -23.4%，竣工 -23.7%** — 但 6 月一线新房连续 4 个月环比上涨，二线由降转平。30 个重点城市去化周期 26.1 个月（杭州、合肥不足 12 个月）。

### 社会（Society）

**🟡 16-24 岁青年失业率 14.9%，高于上年同期** — 25-29 岁也高于总体失业率，毕业季压力或尚未充分显现。

**🟢 上半年人均可支配收入同比增速加快** — 服务性消费支出占比近 5 成，居民从实物消费向发展型、享受型服务消费升级。

**🟡 6 月新婚 + 新生儿数仍处低位，户均住房保有量超 1 套** — 城镇化率突破 68%，刚需增量需求大幅收缩。

### 技术（Technology）

**🟢 上半年高技术制造业利润 +44.7%** — 拉动全部规上工业利润 +8.0 个百分点。高技术产品出口 +39%，占全部出口 22.1%。集成电路、电脑零部件出口表现亮眼。

**🟢 钙钛矿-有机叠层太阳能电池效率达 28.04%** — 中科院化学所李永舫院士、孟磊研究员团队刷新世界纪录，连续光照 625 小时仍保 90% 初始效率，7/13 发表于 Nature。

**🟢 硅-28 同位素首次实现自主量产（丰度 > 99.99%）** — 中核集团核工业理化工程研究院 6/15 突破，为硅基量子计算、先进制程半导体提供关键材料。

## 二、半导体产业链

### 1. 设备：海外交期拉满，国产替代窗口期全开

**🟥 五大海外设备巨头（AMAT / ASML / LAM / TEL / KLA）主流设备交期延长 50%-100%** — 常规 6 个月交期的设备，当前等待周期接近 12 个月，部分机型超 1 年。SEMI 上调预测：2026 年全球半导体设备销售额 **1659 亿美元**（同比 +23.2%），2028 年达 **2295 亿美元**。

**🟥 台积电 2026 全年资本开支上调至 600-640 亿美元**（较此前上调 80 亿美元，+15%）。美光上调美国建厂长期投资至 2500 亿美元。三星、SK 海力士加大 HBM / DDR5 扩产力度。

**🟥 ASML 季度业绩超预期，年内第二次上调全年目标** — 中信建投：全球半导体设备零部件正经历"历史罕见的全链条涨价潮"，定价权从芯片终端向设备与零部件环节结构性上移。

**国内龙头业绩预期**（机构预测 2026 同比）：
- 富创精密：+4800%（业绩反转）
- 中科飞测：+530.16%
- 联动科技 / 晶升股份 / 华亚智能 / 芯源微 / 金海通 / 京仪装备：业绩翻倍
- 京仪装备：半导体专用温控设备国内市占率约 39%，排名第一

**Mavis 点评**：设备这条线是当前国产替代里**最硬的赛道**。海外产能饱和 → 国内拿到"试一试"机会 → 验证通过 → 批量导入，链条已经跑通。京仪装备、华海清科、中微公司这些"小巨人"正在变成"大巨人"。

### 2. 制造：台积电 2nm 全面投产，三巨头吃肉

**🟥 台积电 2nm Fab 20 月产破 2 万片** — 5 座 2nm 晶圆厂中 Fab 20 率先达产。2nm 流片量是 3nm 同期的 **4 倍**。2nm 已贡献 Q3 营收的 3%（无客户正式出货）。8 月起谷歌 Tensor G6（Pixel 11）和苹果 A20 Pro（iPhone 18）将率先商用 2nm。3nm 节点月产 17.5 万片仍领先。

**🟥 AMD MI455X GPU 宣布采用台积电 2nm** — 英伟达 Rubin 系列将"与之较高下"。CoWoS 先进封装已售罄到 2027 年，瓶颈正从晶圆制造转移到封装测试。

**🟢 中芯国际 A+H 总市值 7/20 突破 1.4 万亿元，超越贵州茅台** — 首次成为 A 股市值最高的公司，跃升全球第三大晶圆代工厂。CEO 赵海军：今明两年大量订单将回流中国，成熟制程代工价格上调。

**🟢 英特尔 Q2 营收 161 亿美元，同比 +25%** — 大超公司指引（138 亿）。陈立武上任后拿下首个外部代工客户 Fortinet（飞塔信息），SP6 芯片采用 Intel 4 工艺。

**Mavis 点评**：制造端的故事已经写好——台积电吃肉，中芯国际喝汤，英特尔搬桌子重开席。**2nm 良率爬坡是 8-9 月最大的产业变量**，谷歌、苹果首颗 2nm SoC 上市后的实测反馈，会决定台积电资本开支还能不能继续超预期。

### 3. 设计：高通、苹果、英伟达三角博弈

**🟥 高通宣布 9/1 起涨价两位数百分比** — 骁龙 8 Elite Gen 6 Pro 单颗突破 300 美元。台积电 2nm 晶圆 3 万美元/片，存储成本继续往上顶。

**🟥 OpenAI 计划与 AMD 合作开发 MI500 系列 AI 芯片** — 三个月前已部署 AMD Helios GPU 机架。AMD ROCm 平台宣布每 6 周发布一次新功能（一年 8-9 个正式版本），加速追赶 CUDA。AMD 数据中心 CPU 市场份额已达 46%。
