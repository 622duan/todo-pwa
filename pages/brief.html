### 3.6 Mavis 点评

> **Mavis 点评**：PPI +5.0% 而 CPI 只有 +0.9%，这 4.1 个百分点的剪刀差是今天宏观层面最该被记住的一句话——**上游在涨价，下游在挨打**。但请注意这个剪刀差的方向变了：过去它是"成本传导不畅"，现在是"成本传导根本没人接"。9 月 PPI 分行业里"计算机通信电子设备制造 +5.8%"是少数还在涨的制造业，可 CPI 里"数据存储设备 +46.7%"却对应着手机出货 -22%——**这是一条从芯片到终端的完整挤压链**，不是周期波动，是成本结构已经改写了。
>
> 流动性端反而是最宽松的：潘功胜把政策利率切换到隔夜、10 月 LPR 连续 17 个月没动但 DR001 已跌到 1.2778%、Shibor 1M 创 2020 年 5 月以来新低。**宽松是真的，可市场就是不涨——因为钱的边际去向从地产变成了国债和存款**，住户贷款前三季度还是减 1.03 万亿。钱不是不够，是不敢去。

### 4.6 Mavis 点评

> **Mavis 点评**：今天半导体板块最大的反常识是——**利润最爆炸的公司，股价跌得最惨**。三星营业利润 +783%，SK 海力士净利率 80%，美光营收 +379%，结果存储指数较 7 月高点回撤 **47.10%**。这不是市场瞎了，是市场在提前定价 2027 年：长鑫年底月产能 35~40 万片、2028 年 50 万片，长存 26Q2 位元份额已 14% 冲进全球前三——**国产供给正在吃掉这轮周期最肥的尾巴**。美银同时喊"PE 只有 2~3 倍是周期底部"和"2027–2028 仍会更紧缺"，这两句话不矛盾：**底部是真的，但底部之后是国产替代的斜率**。
>
> 另一个信号藏在北方华创：单季营收只 +1.31%、毛利率降近 2 个点，公司自己说"个别品类物料供应紧张，订单交付存在压力"。**设备龙头的瓶颈从"接不接得到订单"变成了"发不发得出货"**——这是国产替代真正进入深水区的标志，也是中微 10/31 三季报最值得盯的验证点。

### 5.5 Mavis 点评

> **Mavis 点评**：这一板块最刺眼的是三个"背离"，而且它们指向同一件事——**定价权在从"中国需求"切换到"中国供给"**。
>
> ① 地产：1–9 月开发投资 **-20.6%**，可 10 月 300 城宅地溢价率只剩 **1.2%**（年内最低）；但上海二手房价同比 **+0.8%**，全国首个转正。**同一件事的两个面：投资端塌了，交易端活了**——因为"8·28 现房销售"把房企信用担保换成了制度担保，买家敢了，但房企在现房模式下资金占用周期被拉长，所以不敢拿地了。这不是复苏，这是**存量时代的切换成本**。
>
> ② 基建：规划超 7 万亿、新型电网超 5 万亿，可 1–9 月基建投资 **-4.2%**、电力热力燃气水 **-6.8%**、土地出让金 **-27.9%**。缺口靠中央资金填——2500 亿专项债结存限额明确投向"六张网"、8000 亿政策性金融工具 10/28 全部投放完毕。**中央在替地方背书基建，地方的钱袋子已经空了。**
>
> ③ 稀土：1–9 月出口量 **-9.6%**、出口金额 **+40.5%**；海外氧化钇 **1150 美元/kg，2 年涨 179 倍**，日本钇库存"仅够数月"（10/20 FT）。**这是中国把"资源"真正变成"武器"的一个样本**——量的自我克制反而让价格弹性最大化。但要清醒：稀土精矿 Q4 交易价环比只 +0.53%，氧化铽年内同比还偏弱，**管制喊得响，现货并没有同步暴涨**，这轮真正的价格弹性在外围而不在国内。
>
> 农业是唯一"天时与人祸同向"的板块：厄尔尼诺 Niño3.4 12 月或达 **3.7℃ 创观测史最高**、FAO 谷物指数 9 月同比 **+17.2%**，可国内玉米只有 2191 元/吨。生猪则是"**产能拐点已现、价格拐点未至**"——能繁母猪 3602 万头首次跌破 3750 万头调控线（**这是周期底部的硬信号**），但出栏仍 +1.4%、PSY 每年 +3% 带来"减母猪不减肉"，猪价反而跌到 10 元下方、期货创上市新低。**猪周期的反转时点大概率在 2027 上半年，不是现在。**

### Mavis 点评选

> **点评一（技术圈）：Alphabet 跌 13% 不是"AI 泡沫破"，是"AI 账本开始被审计"。**
> 三个数字放一起看才有意思：营收 1275.8 亿（低于预期 1282.2 亿）、自由现金流 **-90.7 亿**（市场预期才 -35 亿）、资本开支 513.6 亿（**低于**预期 557.8 亿）。**第三个数最要命**——如果连 Alphabet 都不敢把钱花出去了，说明整个行业的资本开支循环要断。
> 但同一天亚马逊资本开支 **772.6 亿**超预期 34%、微软时隔 9 年发 **250 亿**高评级债、Anthropic 与 SpaceX 签 **1205 亿美元**长约。**所以真相是：钱没减少，只是从"自由现金流为正的公司"转移到了"能发债的公司"。** 验证条件很具体——**看微软 250 亿债券的认购倍数和利差**。如果认购火热且利差压在 135bp 以内，AI 资本开支循环还转得动；如果利差顶到上限，说明债市开始定价 AI 违约风险，那 12 月 FOMC 加息 25bp 就会成为压垮估值的那根稻草。
>
> **点评二（机器人圈）：宇树 PE 465 倍和摩根大通目标价 995 元同时存在，这本身就说明了 2026 年的市场状态。**
> 一边是公司自己在 10/26 发异常波动公告，承认滚动 PE **465.22 倍** vs 行业 38.54 倍、"贵约 12 倍"，一边是摩根大通 10/25 把目标价从 300 元**直接砍到 995 元**（上调 3.3 倍）、2028 年销量预测从 4.16 万台上调到 11.16 万台。**一家公司自己发风险提示，券商同时把目标价翻三倍——这就是当下 A 股科技股定价的真实状态。**
> 真正的验证点不在 PE，在**订单**：绿的谐波 10/28 锁死宇树 **11 万台减速器**三年独家供货、产能排到 2027 年末、且是唯一进入特斯拉 Optimus 供应链的国产谐波减速器企业。**如果 11 万台在 2027 年真的交付，宇树的 465 倍 PE 会变成合理；如果 2027 年 Q1 宇树单季营收低于 10 亿元，995 元目标价就变成笑话。** 具体到日子：**2027 年 1 月底看宇树 2026 全年营收有没有突破 25 亿元**（前三季度 18.17 亿，需 Q4 单季 6.8 亿以上，Q3 已做 6.65 亿——其实已经很接近）。

### 8.4 编辑后记（v6）

今天不想再复述数据了。三个信号，说的都不是数字本身。

**第一个：存储指数跌 47% 和三星营业利润涨 783% 同时出现，这两件事是同一件事的两端。**
市场在 7 月就给出了答案——7/1 高点 7436.42 点，10/29 收 3933.88。而同一时间，三星的季度营业利润从"史上首家破 100 万亿韩元"变成了"史上首家破 100 万亿韩元"，美光营收 +379%，长鑫前三季净利 1310~1325 亿。**股价在跌，是因为有人在算账：长鑫年底月产能 35~40 万片、2028 年 50 万片，长存 Q2 位元份额 14% 已进全球前三，SK 海力士清州 M17 要到 2028 年 12 月才开洁净室，龙仁 Y2 要到 2029 年 6 月。这四个日期加起来，是"这一轮缺货"的到期日表。**
所以美银 10/16 那份报告真正的意思不是"存储便宜了"——PE 2~3 倍、P0.9 倍 PB、较四轮周期顶部折价 30~50%，听着是白捡。**但同一份报告给美光目标价 1550 美元（10/29 重申），同时点名 CXMT 是最大风险源。这两句是矛盾的，矛盾的地方就是钱所在的地方。**
可验证的判断很具体：**看 2027 年 1 月长鑫的月产能爬坡数据**。如果长鑫在 2026 年底真的摸到 35 万片、且 2027 年 Q1 出货量同比增速超过 40%，那么存储股当前 PE 2~3 倍就是真的周期底部，可以重仓；**如果长鑫 2027 年 Q1 月产能停在 28 万片不动，或者长存扩产因为价格崩塌而推迟，那"周期底部"就是个套子——因为它的前提是供给上不来。**
风险点非常具体：**别把"合约价涨"当成"景气度涨"。** 江波龙 Q3 单季净利已经环比降了 35.6~49%，公司自己在季报里提示了。而现货 512Gb TLC 从 3 月的 23 美元跌到 18.592 美元，MicroSD 存储卡现货 16GB 跌 4.92%。**合约价是原厂谈出来的，现货价是市场投票的——它们已经在打架了。**

**第二个：上海二手房价同比 +0.8% 全国转正，同时 300 城宅地溢价率只剩 1.2%——这不是矛盾，这是同一个政策的正反面。**
先说数字：9 月一线二手环比 +0.2%（连涨 7 个月），上海同比 +0.8%，终结 70 城二手连续跌 32 个月；二手房网签占比首破 **52.2%**。另一边，1–9 月开发投资 **-20.6%**、新开工 -24.9%、到位资金 -21.6%，10 月 300 城宅地平均溢价率 **1.2%**，10 月第二周只有 **0.54%**。
把这六个数字连起来，答案就出来了：**"8·28 现房销售制度"把买房的风险从"房企会不会跑路"换成了"制度担保"，所以二手房先动、新房跟涨；但它同时把房企的资金占用周期从预售期拉长到交房期，锁死了拿地能力，所以土地市场瞬间冷却。**
这意味着接下来会看到一件反直觉的事：**在存量市场里，政策放松对房价的边际效用上升，但对投资和土地市场的边际效用反而下降。** 因为放松的着力点是交易，不是开发。
可验证的判断：**看 2027 年 1 月土地市场。** 如果 2026 年四季度土拍溢价率持续在 1%~2% 徘徊（不像 9 月的 7%），且 2027 年 1 月首周一线城市宅地成交仍然稀少，那 2027 年的开发投资增速会继续在 -15% 以下；**反过来，如果 2027 年 1 月一线出现溢价率 10% 以上的宅地成交，那说明房企已经开始接受现房周期的资金成本——这是国内地产投资拐点的真正信号，比任何"金九银十"的成交数据都可靠。**
风险点具体到数字：**土拍溢价率如果连续三个月低于 1.5%，同时 300 城成交金额继续腰斩，那"库存去化周期不足 8 个月"这个官方数据就会失真**——因为去库存是去的是现房库存，而拿地停滞意味着 2027 年以后的供给会断崖式减少。**到那时候，"房子不够买"的紧平衡会以另一种形式出现。**

**第三个：Alphabet 跌 13% 的同一天，微软发了 250 亿美元债，Anthropic 签了 1205 亿美元长约。**
这三个数字放在一起才是今天真正重要的事。Alphabet 自由现金流 **-90.7 亿美元**（预期 -35 亿），股价 -12.64%、市值蒸发 4790 亿；微软时隔 9 年重返高评级债市，10 个期限档次至少 250 亿，40 年期利差指引最高 135bp；Anthropic 与 SpaceX 的合同到 2029 年最多付 **1205 亿美元**，12 月起月付 31 亿。
**AI 的资本开支没有减少，它只是换了融资方式——从"公司自己赚的钱"变成了"债市借的钱"。** 而债市是有价格的。Gundlach 那句话值得贴在这里：他觉得 AI 企业的债券利差走阔"在逻辑上没问题"，并把 2006 年次贷前夜 ABX 指数的形态拿来做类比。
可验证的判断：**盯微软 250 亿债券的定价结果**。40 年期定价指引是"较美债溢价最高 135 个基点"——如果最终落在 100bp 以内，说明债市还愿意给 AI 算力无限期的高估值，那是继续做多 AI 硬件的信号；**如果顶到 135bp 上限，甚至出现认购不足，说明债市已经开始给 AI 现金流折价——那一天起，AI 估值就从"信仰定价"切换成"信用定价"，而信用定价是不接受信仰的。**
风险点具体到时点：**11 月 10 日、11 月 16 日。** 11/10 是 FOMC 决议（加息概率 74.9%）叠加美国中期选举叠加 BIS 关联方规则生效，三件事在同一周；11/16 是美联储五大工作组"AI 组"首次举行听证会——**这将是 AI 与利率的关系第一次被官方正式讨论**。这两周里，黄金跌破 3900 美元、AI 硬件再跌 20%、A股创业板跌破 2400 点，任何一个发生都不用意外。
