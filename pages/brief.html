**🟥 重点信号**
- **货币宽松加码**：央行 10/27 开展 **9000 亿 MLF**（净投放 2000 亿，连续 8 月加量）；10 月买断式逆回购净投放 4000 亿；中期流动性净投放 6000 亿。
- **国债买卖重启**：行长潘功胜 10/27 金融街论坛宣布"将恢复公开市场国债买卖操作"——今年初因债市供求压力暂停，现判断"债市整体运行良好"。
- **社融爆量**：前三季度社融增量 30.09 万亿，人民币贷款 +14.75 万亿；9 月企业新发放贷款加权平均利率约 **3.1%**（同比 -40bp），房贷 ~3.1%（-25bp）。
- **美联储退坡**：8 月核心 PCE 仅 3.0%（YoY，低于市场 3.3%），交易员将下次加息预期从 10/28 推迟到 12/9，10 月维持概率回落到 **52.9%**。
- **特朗普 H200 困局**：BIS 1 月放行 H200 对华出口，但截至 7 月实际运抵中国仍为个位数；中国海关审批卡住，英伟达中国数据中心业务市占率从 95% 滑到接近 0。

**Mavis 点评**：中国这边是"宽货币 + 宽信用 + 恢复国债买卖"三件套同时落地；美国那边是"再加一次话就到顶，但谁也不知道是不是最后一次"。**两边流动性都偏松，对应到资产价格就是：贵金属 + 中国小盘 + 国产替代主题 三个最受益**。H200 这事最有意思——美方想卖、中方不一定想接，最后变成一个"姿态性政策"。

## 🔬 板块 2：半导体产业链（设备/制造/设计/存储/手机）

### 2.1 设备 — 美方加紧围堵，中国已悄悄囤货
- **CTS 报告**（华盛顿科技与国家治理能力中心）：截至 2026 年初，中国晶圆厂已累计获得 **343 台** ASML 浸没式 DUV，其中 **270 台** 为 NXT:1980i。
- 单 2024+2025 两年，中国花 **超 130 亿美元** 买 NXT:1980i（约 90+89 台）；2024 ASML 中国占比 41%，2025 仍 33%。
- 2026 Q1 降到 19%、Q2 14%——买盘减弱。
- **报告建议**：美荷联手全面禁运浸没式 DUV（含零件/服务）；Match Act 法案已在国会推进。
- 美光、英伟达 H200 实际通过率极低；Hao Global 1.6 亿美元走私案认罪，台湾起诉 Nvidia 高级经理涉 74 台 B300 服务器走私。

### 2.2 制造 — 中芯 N+2 良率 90%，TSMC Q3 收入破纪录
- **中芯国际**：2026 年 9 月已量产最先进工艺 14nm，N+2（等效 7nm）良率突破 **90%**，小批量试产；28nm 及以上仍占营收大头（67%）。
- **TSMC Q3**：营收 **$330.8 亿**（YoY +40.8%），EPS $2.85（vs 预期 $2.63），Q3 毛利率超预期，AI 需求驱动；Arizona 厂换帅，Ray Chuang 接任 CEO。
- **应用材料**、**KLA**、**泛林** 中国大陆营收占比仍达 27% / 24% / 34%（成熟制程设备继续卖）。
- 中国半导体设备国产化率近 4 年翻倍：日本五大设备厂对华销售 1.47 万亿日元（-12% YoY，首次同比下降）。

### 2.3 设计 — 麒麟 9050 Pro 发布，"韬定律"破局
- **华为 Mate90 + 麒麟 9050 Pro**（10/1）：9 核 16 线程，多核 +23%，GPU +40%，NPU +140%；晶体管密度从 1.55 亿/mm² 跃至 **2.38 亿/mm²**（+53.5%，相当于传统工艺 3 年走完）。
- 华为 2025 研发投入 **1923 亿**（YoY +7%，约占收入 21.8%）；近 10 年累计 1.38 万亿；研发员工 11.4 万（占 53.7%）。
- **寒武纪**：2026 H1 净利润 **23.11 亿**（YoY +122.6%）；市值破万亿；2026 预计出货 35 万片。
- **国产 AI 芯片竞争格局**（2025 数据）：华为昇腾 81.2 万张 + 阿里平头哥 26.5 万 + 百度昆仑芯 11.6 万 = "一超多强"。

### 2.4 存储 — 超级周期延续到 2027
- **DRAM 合约价**：26Q3 服务器 DRAM +13-18%，HBM +20-30%；2026 全年 HBM 累计或 +200%。
- **长鑫科技**：2025/7/27 科创板挂牌，开盘涨 471%，市值 3.31 万亿，募资 600 亿；2026 Q1 营收 508 亿（YoY +719%），净利 247.6 亿。
- **NAND 闪迪** 半年股价 +1100%，三星 +120%、SK 海力士 +228%、美光 +280%。
- **惠普** 已向美国银行确认对"中国供应商"做资质认证，国产存储首入全球 TOP2 PC 品牌供应链。

### 2.5 手机 — 苹果吃掉高端，安卓被存储涨价反噬
- 2026 中国 Q3：vivo 1180 万 / 苹果 1080 万 / 华为 1040 万 / 小米 1000 万 / OPPO 990 万 / 荣耀 980 万——前六差距仅 200 万。
- iPhone 17 全年（截至 12/31）中国销量 **1557 万台** = 小米 17 系列的 5.5 倍；iPhone 17 Pro Max 单品 6 月破 1120 万。
- 存储涨价推高 BOM：低端品牌（小米、TCL、传音、realme）利润率被严重挤压；高端（苹果、三星）靠长期协议和现金储备扛过。
- 华为 Mate90 + 麒麟 9050 Pro 重新定义国产高端。

**Mavis 点评**：芯片这一行现在有两条完全平行的故事线：**"美国想堵的"vs"中国在造出来的"**。CTS 报告把 343 台 DUV 这件事挑明了——中国在过去两年集中下单，已经把这些机器铺到了所有头部 fab。所以接下来不管全面禁令怎么搞，**短期 2-3 年内中国先进芯片产能已经锁定**。存储这边则是 AI 周期 + 国产替代双重红利，长鑫上市只是一个开端。

- 全国秋粮收获已超 20%，玉米主产区收购价 **0.83-0.95 元/斤**（黑龙江、内蒙古潮粮）。
- 2025/26 年度玉米进口量估计 **500 万吨**（同比下调），大豆进口 1.08 亿吨（上调）。
- **超强厄尔尼诺**：2026/11 前后海温指数峰值预计 3.2-3.5℃（历史最大），1960 年以来历次超强厄尔尼诺大概率导致玉米、棕榈减产；大豆存在增产可能。
- 全球粮食"安全垫"变薄，远端价格弹性放大。
- 山东/河南秋粮连续阴雨，烘干设备 24 小时连转；玉米含水从 29.6% 烘至 14.1%。

**Mavis 点评**：地产和基建是"硬币的两面"——**地产跌得越深，基建就要撑得越用力**。5000 亿政策性金融工具 + 8000 亿明年扩容就是这个逻辑。矿产这边稀土 + 锂的故事讲了两年，今年稀土出口管制的暂停其实是"以退为进"——欧美日对中国稀土依赖太深，停得太久它们也撑不住。农业最值得盯的是厄尔尼诺，"超强"两个字不是修辞，是真的会影响明年粮价。

- BIS 1 月规则：H200、MI325X 等需美国独立第三方测试后才能对华出口；25% 关税适用。
- 中国商务部回应：2026 年初海关拦截 H200 入境，警告国内科技公司"非必要不购买"。

### 4.4 客户圈 — AI 大客户迁徙
- **DeepSeek V4** 首次在官方技术报告里将华为昇腾与英伟达 GPU 并列为已验证硬件平台。
- 美团 LongCat-2.0 全流程用寒武纪 + 昇腾训练；智谱 GLM-Image 用国产芯片训练。
- 字节 / 腾讯 / 阿里 2025-2026 累计向国产芯片下单超 100 万张；微软 GitHub Copilot 接入 Kimi K2.7 Code。
- H200 进入中国：ByteDance + Tencent 各 1 万台左右（夏季首批）；8 月后获批出口的实际出货 <1%。

### 4.5 事故圈 — 走私案连环爆
- **Hao Global** 创始人 Alan Hao Hsu 与公司 2025/10 认罪，涉 1.6 亿美元 H100/H200 走私。
- 台湾检方 8 月起诉 Nvidia 高级经理（张某）+ 8 人，涉 74 台 B300 服务器经日本 / 印尼转运中国。
- 标志性画面：东南亚仓库里有人用吹风机揭服务器序列号标签。

### 4.6 对手圈 — 国产阵营"一超多强"
- 2025 国产 AI 芯片：华为昇腾 81.2 万张 + 阿里平头哥 26.5 万 + 百度昆仑芯 11.6 万 = 165 万张（占比 41.3%）。
- 2026 预计：昇腾 102.6 万、平头哥 +、昆仑芯 +、寒武纪 35 万、海光 30 万+。
- 软件生态：华为 CANN 2025/12 开源、CUDA 兼容度 >95%；寒武纪 NeuWare、燧原"驭算"跟进。

**Mavis 点评**：六条线凑一起看就是——**"美国封堵越狠、中国国产替代越快；H200 卖得越少、寒武纪市值越高；走私越多、BIS 越收紧"**。这是个典型的"双边博弈正反馈"循环，对国产芯片是结构性利好。
