## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

- **9.28 国常会"组合拳"已落地**：李强总理主持召开国常会，明确"加大宏观政策逆周期调节力度""推出一批务实管用的增量政策"。次日（9.29）央行、财政部、金融监管总局即同步落地一揽子政策——响应速度罕见，释放稳增长信号[（来源）](https://www.toutiao.com/article/7690564160383484452)。
- **🟥 央行"四箭齐发"**：① 下调一年期 **PSL 利率 0.25 个百分点**（1.75%→1.5%）；② 扩大 PSL 支持领域，新增**"六张网"**（水网/电网/算力网/通信网/地下管网/物流网）；③ 科技创新和技术改造再贷款额度增加 **2000 亿元至 1.4 万亿**，支持比例从 60% 提至 100%；④ 支农支小再贷款额度增加 **5000 亿元至 4.85 万亿**，民企再贷款额度增至 1.3 万亿[（来源）](https://www.toutiao.com/article/7692410535110902313)。
- **🟥 首套房贷款贴息**：财政部、央行 10.1 起对符合条件的首套住房商业贷款按年化 **1 个百分点** 贴息，覆盖 120 平米/150 万元以下刚需户型，中央承担 90%。按 100 万贷款测算，首年最高减息 1 万元[（来源）](https://www.163.com/dy/article/L8QKI83B0552A9XP.html)。
- **5500 亿元地方债务结存限额下达**：一般债 3000 亿全部分配县区，专项债 2500 亿向经济大省倾斜，优先支持"六张网"项目[（来源）](https://www.chinatimes.net.cn/article/156171.html)。
- **十五五《新就业形态劳动者权益保障办法（征求意见稿）》**：首次以部门规章形式将外卖、网约车、直播从业者纳入劳动法律保障框架[（来源）](https://www.toutiao.com/article/7694961554770051611/)。

**Mavis 点评**：本轮增量政策是"财政+货币+产业"组合拳的最大集合——PSL 利率回到 2014 年以来低位、贴息首次中央直接补商贷、债务结存灵活调动。响应速度（9.28→9.29 落地）远快于以往，国常会次日即执行，说明四季度稳增长已被中央列为政治任务，10-12 月大概率还有"促销费+稳地产"细则在路上。

### 2.2 🟠 经济面 E

- **🟥 9 月 PPI 同比 +5.0%**，**创近四年新高**（2022 年 7 月以来）；环比 +1.2%，扩大 0.8 个百分点。煤炭开采洗选业 +35.3%、石油天然气开采业 +24.5%、有色冶炼 +21.4%——8 个行业涨幅扩大合计上拉 PPI 5.42 个百分点[（来源）](https://www.stats.gov.cn/sj/zxfbhjd/202610/t20261014_1965475.html)。
- **9 月 CPI 同比 +0.9%**，扩大 0.1 个百分点；核心 CPI 同比 +1.0% 持平。**汽油 +16.6%**（贡献 CPI 同比 0.47pct）拉动能源价格涨幅从 4.1% 扩至 7.3%。**通信工具 CPI 同比 +3.7%** 创近年新高——AI 通胀已开始向终端渗透[（来源）](https://finance.cnr.cn/ycbd/20261014/t20261014_527841877.shtml)。
- **🟥 9 月外贸首破 5 万亿**：进出口 5.16 万亿元，同比 +27.5%（出口 +29.6%、进口 +24.6%）。**前三季度累计 39.94 万亿、同比 +18.8%**，连续 6 个月两位数增长[（来源）](https://finance.cctv.com/2026/10/15/ARTIW0LjpXof1NQqaI6R6yjt261015.shtml)。
- **🟥 集成电路出口同比 +99.1%**，进口 +63.5%；9 月单月集成电路出口 **+136.0%**，自动数据处理设备及零部件 +92.9%——AI 算力外贸拉动占整体出口增速 1.8 个百分点[（来源）](https://www.toutiao.com/article/7696356401970430474/)。
- **前三季度 GDP 101.5 万亿元、同比 +5.2%**（Q1 +5.4% / Q2 +5.2% / Q3 +4.8%）；9 月城镇调查失业率 5.2%（环比降 0.1pct），前三季度居民人均可支配收入 32509 元（+5.1%）[（来源）](https://www.stats.gov.cn/sj/sjjd/202510/t20251020_1961623.html)。
- **10 月 LPR 维持**：1 年期 3.0%、5 年期以上 3.5%，连续 16 个月按兵不动；10 月 MLF 等量平价续作 5000 亿[（来源）](https://www.pbc.gov.cn/en/3688229/3688335/3730276/3883798/2026092013580173281/index.html)。
- **前三季度装备制造业贡献近 9 成出口增量**；中间品占出口总值超一半；电动汽车、锂电池、风电整机出口分别 +72.3% / +36.4% / +22.4%[（来源）](https://www.toutiao.com/article/7696345904466444826/)。

**Mavis 点评**：9 月数据全面超预期——**PPI 创近四年新高 + 外贸单月首破 5 万亿 + 集成电路出口翻倍**，这是一组"上游强、终端弱、结构性涨价"的组合。但要警惕三个风险点：① 上游涨价正传导至 CPI，9 月汽油/通信工具/数据存储设备对 CPI 同比贡献近 0.7pct；② 10.20 出口增速基数抬升+美国中期选举+ AI 估值回落，Q4 出口增速中枢可能回落；③ 国新办仅公布 9 月总量数据，地产/汽车/服务消费等高频数据未单独披露，需关注后续央行货政报告。

### 2.3 🟣 社会面 S

- **就业**：1-9 月城镇新增就业 **1052 万人**（完成全年 87.7%），前 8 月调查失业率均值 5.2%[（来源）](https://www.toutiao.com/article/7695546526721901075/)。
- **社保**：截至 9 月底，基本养老/失业/工伤参保人数分别 10.79 亿 / 2.51 亿 / 3.27 亿，三项基金累计结余 11.2 万亿[（来源）](https://news.cctv.com/2026/10/10/ARTIOzkHy1gEczUWDh448cWs261010.shtml)。
- **新就业形态**：外卖、网约车、直播等从业者权益保障办法征求意见稿发布[（来源）](https://www.toutiao.com/article/7695546526721901075/)。
- **民生新政**：技能人才 2030 年占比目标提至 35%，"十五五"开展补贴性培训 5000 万人次、新增技能证书 4000 万[（来源）](https://www.toutiao.com/article/7695546526721901075/)。

**Mavis 点评**：就业总量稳但结构压力未消——1052 万新增就业完成进度 87.7%，但 9 月失业率仅微降 0.1pct，青年就业、AI 对中等岗位的替代效应仍是隐忧。新就业形态保障办法落地的核心是给 8400 万灵活就业者一个"制度身份"，是社保体系现代化的标志性一步。

**Mavis 点评**：手机市场的本质矛盾是"AI 通胀 → 整机涨价 → 销量下滑"——9 月新机扎堆但首销普遍遇冷，**小米 18 Pro 仅为上代首销的 30%**。华为靠 Pura X View 28.2 万激活 + Mate XT2 在 6000+ 价位抢苹果 17pct 中的 10pct；苹果靠 Pro 集中策略 + 国产涨价衬托稳住基本盘。**存储涨价是核心变量**，小米 18 Pro 16+1TB 涨 50% 是行业最危险的信号——可能加速消费分级，高端机销量↑，中端 2000-4000 段继续走弱。

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
