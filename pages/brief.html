**Mavis 点评**：半导体板块今天被英伟达财报"炸"醒了。1.6nm A16 + 5.5x CoWoS + 5 万亿日元铠侠闪迪扩产 + 国内长江存储 Q2 全球第三——三件事把整个产业链景气度钉死。存储是真正的"上甘岭"：HBM 涨 70-140%、消费级被 AI 吃掉 7 成产能，2027 才可能松。但 5 万亿日元投资到 2032 年会变成新一波"杀价"——长鑫、长江存储能不能在窗口期内把消费级到企业级 SSD 的产品结构爬上去，是国产替代能否"换挡"的关键。手机这边，K100 把小米拉到 4-6K 第一，但 1TB 微亏定价不可持续——Q4 跟新机潮是验证窗口。

## 七、编辑后记

今天是 8 月最后一周的关键节点。三件大事同时落地，把市场情绪从"质疑 AI 泡沫"拉回到"算力即收入"：

1. **英伟达 FY27Q2 给出 2028 财年 +70% 指引**（市场预期 45%），订单积压 2 万亿，亚马逊 200 万 GPU 加单——AI 资本开支的"最后质疑者"被官方数据击退。
2. **沪八条 + 成都公积金 + 北京限购优化 + 8000 亿政策性金融工具**集中释放，沪新房成交环比 +18.95%，二手房网签 +10.2%——"金九银十"有政策托底。
3. **"六张网"7 万亿 + 重庆央企 1904 亿**——基建投资不是喊口号，是真金白银。

**今天的判断**：

- **半导体**：HBM/存储/先进封装的"涨价长尾"至少延续到 2027 H2，国内长江存储/长鑫存储是真正能吃到窗口期红利的少数标的。但消费级 DRAM/NAND 将在 2027 H2 见顶回落——那时才是国产替代的真正考验。
- **房地产**：政策诚意到位，但 1-7 月一线新房 -0.7% 说明"卖旧买新"是主流、纯增量还没起来。9-10 月是关键验证期。
- **AI 资本开支**：英伟达 5000 亿基建池+亚马逊 200 万 GPU+订单积压 2 万亿——AI 不会"软着陆"，但市场已经 price in 30%，下一波要等 Q3/Q4 财报。
- **新势力**：H1 半年报已经分出胜负——零跑（销量+海外）vs 理想（产品结构+毛利率）vs 小鹏（技术服务）vs 小米（集团兜底）。9 月新机潮是窗口期。
- **黄金**：4600 美元站住，央行购金+去美元化+财政压力三重支撑，UBS 看 5400、JPM 看 6000，前提是降息兑现。

**风险提示**：
- 美 7 月核心 PCE 3.3% 仍黏性，9 月降息不是板上钉钉
- 美加关税战外溢到 TSMC 50% 汽车关税
- HBM 涨价传导 PC 内存占 BOM 已到 35%，需求端可能反噬
- DeepSeek / Kimi 估值 PS 148-167 倍，IPO 估值能否稳住看 G 轮接棒

    // Init
    function init() {
      renderBrief(DEFAULT_BRIEF);
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
