| 10.30 公开市场 | 7 天期逆回购 **150 亿元** + 隔夜逆回购 **1 万亿元**，单日净投放 **150 亿元** | 跨月资金面略有收敛 |
| 结构性工具 | PSL 利率下调 0.25pct；支农支小再贷款 **+5000 亿**；科技创新和技改再贷款 **+2000 亿**、"报销"比例 60%→**100%** | 9 月末落地 |
| 财政贴息 | 中央 **90%** / 地方 **10%**，年化 **1pct**、≤5 年、单户 ≤100 万 | 10.1 起实施，实施期暂定 1 年 |
| 政府债资金 | 中央预算内投资 **7550 亿** + 超长期特别国债 **1 万亿**；新型政策性金融工具 **8000 亿** | 有序投放中 |

**"换锚"的市场解读（三家口径）**：
- **中信证券明明**：1.25% 定价与现有资金中枢基本一致，释放积极稳定信号；预计资金中枢围绕隔夜逆回购利率运行；"隔夜—7 天—3M—6M—1Y"曲线形成；11 月隔夜弹性投放将对冲年末政府债供给与跨年资金需求，**11 月资金面有望延续平稳宽松**
- **东方金诚王青**：主要政策利率"换锚"启动，货币政策框架向价格型转型迈出重要一步；**不意味着变相降息**；关注 DR001 中枢是否跟进下调至 1.25%
- **国信证券王剑**：不涉及利率水平本身的调整，**不能直接理解为降息或加息**；未来观察重点是隔夜政策利率方向、市场利率偏离程度、利率走廊运行状态
- **邮储银行娄飞鹏**：公开市场主要品种与目标利率 DR001 **期限匹配，消除此前期限错配**；临时正逆回购改以 1.25% 为锚加减点，意味着**利率走廊中枢下移、波动收窄**

📌 **Mavis 点评**：这轮"换锚"最容易被误读成宽松或紧缩，其实两都不是——它是**换刻度**。真正的价值是让央行的操作目标和 DR001 对齐，消除了此前"工具期限 7 天、目标利率隔夜"的期限错配。但要注意一个容易被忽略的推论：**隔夜 1.25% 比 7 天期低 15bp，等于给银行负债端成本松了绑**——明明团队明确说这"为广谱利率下行创造空间"。所以我的判断跟王青一致但更具体一点：**LPR 大概率不动，但新增贷款的实际利率会继续往下走**，挂钩 DR001 的贷款投放规模是新的跟踪指标，比 LPR 报价更有信息量。11 月中旬税期那次 7 天期补位操作是第一次实战检验。

📌 **Mavis 点评**：今天存储这块必须抓住一个此前被忽略的事实——**NAND 结束 21 个月上涨，不是因为需求回暖，是因为需求被价格杀死了**。DRAMeXchange 的 DDR4 8Gb 涨到 **27.5 美元**（2016 年是 2.9 美元，9.5 倍），PC 厂商下半年只能靠**削减 SSD 容量**来压整机成本，OEM 下单量自然缩。TrendForce 自己的判断很直白："客户端 SSD 涨幅有限、企业级 SSD 涨幅扩大"——**AI 拿走高端产能，留下的是消费端的滞销**。所以现在这条链上有三个完全不同的价格信号：原厂合约价（DDRAM 新高、NAND 持平）、现货价（NAND 崩 -9.19%）、零售价（1TB SSD 约 144 美元、三星 990 Evo Plus 1TB 约 237 美元 vs 涨价前约 59 美元，**涨了 300%**）。**可验证判断：Q1'27 NAND 合约价谈判（11 月中下旬）大概率从 +15~20% 下修到 +5% 以内**；而 **DDR4 的紧张会持续更久**（因为它是供给退出型紧张，不是需求型）。这意味着存储板块内部接下来会**从"整体贝塔"切换到"结构阿尔法"**——买服务器 DRAM 链，不要买消费级 NAND 链。

**Mavis 点评选（2 条最有洞见的）**

**第一条：智元提出 "Worken"，但自己承认"产出效能比仍比较模糊"——这个自相矛盾恰恰说明行业商业化还差最后一公里。**

判断：Worken 公式 = 活跃机器人数 × 自主工作时长 × 产出效能比。智元两个案例的产出效能比分别是 **0.7**（龙旗工厂上下料）和 **0.5**（广州地铁安检）——**机器人目前的产出效率只有人工的一半到七成**。这是一个被叙事掩盖的关键数字：如果机器人只等于 0.5-0.7 个工人，替代人工的经济性只在特定场景成立。而智元自己也承认计价问题没解决：与酒店客户谈前台接待时，迎来送往、行李搬运、业务引导的效能比各不相同，无法综合评价。

更值得注意的是**宇树和智元同时出现的两个反差数字**：宇树前三季营收 **18.17 亿元（+55.71%）**、净利 **3.87 亿元（+270.54%）**（真赚钱），智元上半年 9700 台、收入近 20 亿元但**未披露盈利**。**同一波量产潮里，一家已经跑通单位经济模型，一家还在烧钱**。

**可验证判断**：Worken 或类似计价标准能否在 2027 年上半年被至少一家头部厂商实际用于**合同定价**，是"机器人从卖硬件变成卖服务"的分水岭。如果 2027 年财报里机器人公司的营收模式从"卖本体"变成"Worken × 单价"，估值锚要整体重估——**那才是这轮行情真正的主升浪**。反过来，如果 2027 年还是一次性硬件销售+一次性交付（像智元/江波龙那样库存收益退坡、净利环比 -35%~-49%），这轮行情在 2026 年 Q4 就该结束了。

**第二条：10.30 特斯拉把 Optimus 的场景从"工厂产线"扩展到"给 Robotaxi 插充电枪"——这个动作的价值不是技术，是把叙事锚从"降本故事"换成了"服务收入故事"。**

判断：此前 Optimus 的叙事锚只有两个：弗里蒙特百万台级产线爬坡、首批量产标准机器人下线。这两个都是**成本侧**叙事，回答的是"能不能造出来"。10.30 财联社报道的"为 Robotaxi 完成充电枪插拔作业"是**第一个需求侧叙事**——Robotaxi 车队规模化的每一步，都对应机器人充电运维的刚性需求，而且这是**按次付费**的服务场景，不是自用降本。

这个切换很重要，因为市场对机器人公司的估值模型正在从"卖硬件的 PE"往"服务化的 PS/Worken 计价"迁移。**Optimus 同时具备"世界第一车企 + 第一 Robotaxi 运营商"两个身份**，它是全球唯一一家能把机器人从成本项变成收入项的公司。

**可验证判断**：**盯特斯拉 Q4 电话会（2027 年 1 月）里三个数**：① 对外销售前的产量指引（Q3 电话会给的是 **1-2 万台**，远低于市场最乐观预期）；② 周产能爬坡速度（当时说周产 2 万台/年化百万台还需至少一年）；③ **有没有出现第一个"按小时/按次收费"的外部客户合同**。第三个数才是真正的分水岭——只要还是"卖本体给工厂"，估值就该按制造业给；一旦出现"机器人接充电枪按次计费"，整条产业链的估值锚会立刻重估。

### 8.4 编辑后记

**第一个信号：央行把主要政策利率从 7 天期换成隔夜 1.25%，而 10 月 DR001 均值是 1.2805%——这个"换锚"不是为了给市场降价，而是为了让央行的操作目标和它真正的目标利率对齐。但它顺手给银行负债端松了绑，这部分红利不会体现在 LPR 上，会体现在新增贷款的实际利率里。**

三点必须拆开看。第一，**换锚 ≠ 降息**。王青和明明都明确说了，1.25% 与既有资金中枢基本一致，"确认既有中枢"，王剑说得更狠："不能将操作期限、政策利率品种和定价基准的调整，直接理解为降息或加息。"第二，**换锚 ≠ 收紧**。明明团队明确指出，考虑到年末政府债供给与跨年资金需求，**隔夜逆回购的弹性投放将成为对冲潜在波动的主要手段**，11 月资金面有望延续平稳宽松。第三，**换锚有一个被低估的推论**：隔夜 1.25% 比 7 天期低 **15bp**，而 7 天期降的是银行负债成本、进而通过 DR 基准传导到贷款定价——所以明明说"为广谱利率下行创造空间"。娄飞鹏说得更具体：临时正逆回购改以 1.25% 为锚加减点，意味着**利率走廊中枢下移、波动收窄**。

**我的判断：11 月 20 日 LPR 大概率不动，但 11 月 MLF 续作量和挂钩 DR001 的贷款投放规模会是更有信息量的观察口。** 而 11 月中旬税期那次 7 天期多重价位中标操作，是换锚后的第一次实战检验——如果那一次 7 天期中标利率明显低于 1.25%，说明市场对宽松的预期已经打进去了；如果贴着甚至高于 1.25%，那说明 10 月末的资金面收敛（DR007 +5.2bp）才是主导。

**第二个信号：DRAM 创历史新高、NAND 结束 21 个月上涨，而这两件事发生在同一个月、同一家原厂、同一套产能调度逻辑下——这说明本轮存储周期的紧缺是有形状的，而且形状会移动。**

TrendForce 10.30 的两个数字必须并排看：**PC DRAM（DDR4 8Gb）10 月合约价 27.5 美元、环比 +5.77%，是历史新高，较 2016 年 6 月的 2.9 美元涨了 9.5 倍**；**NAND 128Gb MLC 10 月合约价持平 30.61 美元，终结连续 21 个月的上涨**。原因在 TrendForce 自己那份 10.28 客户端 SSD 报告里说得明明白白——PC 终端需求疲弱、整机物料成本上升、**买方对新一轮涨价抵抗明显，市场已由缺货推动转入买卖双方拉锯**；而企业级 SSD 因为 AI 推理和 QLC 爬坡，位元需求同比 **+80%**，增量货源多已被云厂商提前锁定。

所以存储链现在是三条完全不同的价格线：**① HBM / 服务器 DDR5 / 企业级 SSD —— 新增需求驱动，HBM + 服务器 RDIMM 已占全球 DRAM 位元供给 51%；② DDR4 等成熟品 —— 供给退出驱动（原厂把晶圆转向 HBM/DDR5），所以出现 DDR4 现货价高于 DDR5 的倒挂；③ 消费级 NAND —— 需求毁灭驱动（PC 厂商砍 SSD 容量、手机品牌减少采购）**。原厂在三条线上的行为是一致的：优先供应 AI 和服务器，把痛苦留给大众市场。

**可验证判断：Q1'27 NAND 合约价谈判（11 月上旬启动）是这一整条链的判决点。** 如果从 Q4 的 +15~20% 下修到 +5% 以内，那么三件事会同时发生：① 消费级 SSD 的"券后回落"变成真跌；② 江波龙这类存货 257.77 亿元（占总资产 60.12%）的模组厂面临跌价，Q3 净利环比 -35%~-49% 的减速会加速；③ 存储板块估值锚从"AI 稀缺"回到"周期品"。**反过来，如果 Q1'27 合约价仍坚挺在 +10% 以上，那这次现货崩塌只是投机盘出清，消费级 SSD 的回落窗口就是真实买点。** 另外提醒一个常被忽略的时间差：**DDR4 的紧张会比 NAND 持续更久**（它是供给退出型紧张，不是需求型紧张），所以如果你现在要选存储方向，服务器 DRAM 链比消费 NAND 链安全得多。

**第三个信号：中国稀土 11.2 起停牌筹划重大资产重组，盛和资源同时向集团转让 4 家冶炼分离子公司 51% 股权——管制正在从"出口许可"升级成"股权整合"。这意味着中重稀土的战略地位已经被写进资产负债表，而不再是新闻里的一个百分比。**

把这条线和价格数据放一起看更有意思。10 月内外价差：**氧化钇 +12,918%、氧化钆 +10,936%、金属钇 +10,740%、氧化钐 +2,157%、氧化镝 +1,915%、氧化铽 +1,178%**——而**氧化镨钕只有 +27%**，氧化镨本身周环比还跌了 **2.06%**。这个分层说明管制打的是**中重稀土**（钇、镝、铽、镓），普涨的镨钕受国内配额和需求影响不大。**看懂这个分层，才知道该盯谁的业绩弹性**——重稀土标的的业绩弹性来自价差，而普涨品种的弹性来自量。

中国稀土的重组如果落地，等于把"中重稀土的定价权"从分散的冶炼分离产能手里收进一家上市平台。这件事的**验证时点非常近：10 个交易日内披露交易方案**（11.2 停牌起算，即 11 月中旬前）。可验证判断：**看重组方案里对价用什么资产支付（现金 vs 股份）、以及是否配套注入凉山之外的资源**——如果用股份支付，说明是资产腾挪而非现金买断，对二级市场的提振有限；如果配套融资，那才是真正的资本开支周期信号。

**第四个信号（补充）：10.30 A 股成交 1.69 万亿放量下跌，同一天港股恒指却涨 1.46%，而六大行 Q3 净利全部 4.5%-7.1%、四大行 A+H 总市值刚在 10.29 历史首破 10 万亿元——A 股和港股在同一天给出了相反答案，这不是全球风险偏好下降，是账户内部的资产搬家。**

10.30 A 股的盘面结构说明了一切：**光通信、软件、半导体、军工板块大跌，传媒股大面积跌停；而银行、煤炭板块上扬，银行股批量创新高。** 同期港股白酒、石油石化、家电、银行走强，恒指 +1.46%。同一天、同一套宏观环境、同一批宏观变量，**A 股成长权重砸出坑、港股红利权重撑住指数**——这是典型的仓位再平衡，不是系统性风险。

而搬家的动机非常具体：**Alphabet 单日 -13%、蒸发 4790 亿美元**（AI 资本开支变现效率被质疑）+ **英特尔 -28.58%、Q4 指引远低预期**，这两件事让"AI 叙事"从信仰变成需要验证的假设；而同期六大行的 Q3 净利给出了 4.5%-7.1% 的确定答案。**钱不是消失了，是从"要验证的"流向了"已兑现的"。**

**可验证判断：银行板块持仓的这次跳升是加仓还是套牢盘的分水岭。** 如果 Q4 主动基金银行持仓比例继续往 2.5% 以上走，同时银行板块 PB 没有同步扩张，那说明这是配置盘在 AI 叙事动摇时的长期迁移，接下来银行会靠股息和 ROE 走独立行情。反之，如果 3 个月后持仓比例回落而 PB 已被推高，那就只是一次拥挤的避险交易，10 万亿市值会成为顶。**观察窗口：11 月 4 日三季报披露截止后 + 2027 年 1 月底的基金四季报。**
