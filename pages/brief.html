## 三、8 大板块详细解读

### 板块 1：宏观 PEST（政治/经济/社会/科技）

**🟢 信号：温和回暖 + 政策密集**

**1. 8 月价格数据"双升"（9/9 国家统计局发布）**
- **🟥 CPI 同比 +0.8%**（环比由 -0.1% 转 +0.4%），核心 CPI 升至 1.0%

  - 鲜菜 +5.5%（高温多雨+换茬）、鸡蛋由 -2.1% 转 +2.4%、猪肉 +1.3%
- **🟥 PPI 同比 +3.8%**（环比由 -0.7% 转 +0.4%）
  - 拉动项：煤炭开采 +26.6%、有色冶炼 +20.8%、石油天然气 +10.5%、电子电路制造 +3.5%、VR 设备 +1.9%
  - 拖累项：电力热力 -5.3%、汽车制造、医药制造、农副食品加工

**2. 1-7 月工业企业利润数据**
- 全国规上工业企业利润同比 **+17.6%**
- 营收利润率改善，营业收入 186.5 万亿元（+5.8%），利润总额 9.2 万亿元（+4.2%）

**3. 投资数据：1-7 月分化加剧**
- 全国固定资产投资 **-6.7%**（民间投资 -9.4%）
- 🟥 **房地产开发投资 -19.2%**（主要拖累项）
- 🟥 **电子电路制造业投资 +57.7%**、信息服务业 +19.2%、知识产权产品 +9.1%
- 🟥 "六张网"建设投资规模 **超 7 万亿元**

**4. 稳投资政策加力**

**Mavis 点评**：8 月价格数据双双转正是个重要信号 —— 不是简单的基数效应，而是"输入性涨价 + 智造升级 + 季节性需求"三股力量同时发力。但房地产开发投资 -19.2% 这个数仍然刺眼，说明地产对宏观的拖累还在；现在的复苏靠的是政策托底 + 高技术投资替代，这套结构能走多远是关键。CPI 0.8% 离 2% 还有距离，但金饰品 +33.6%、手机 +11% 这种"高端消费品涨价"反而是消费分层的信号 —— 有钱人在买金子买高端手机，普通人还在等便宜猪肉。

### 板块 2：半导体产业链

#### 2.1 半导体设备 🟢 历史级景气

**🟥 中微公司（9/1）一气发布 6 款高端设备**
- **Primo XD-RIE™** 极高深宽比刻蚀机：70:1-90:1（针对 3D NAND/DRAM）
- **Performo QuaStar® ON/GE** PECVD（16 片晶圆同处理）
- **Prefima Unicore™ AM** 12 英寸 ALD 金属钼设备（瞄准 300 层 NAND "钨转钼"）
- **Preforma Uniflash® SPTi/TiN** 金属硅化物集成系统
- **PRISMO PDS8®** 碳化硅外延设备（第三代半导体）
- 公司已开发 54 种高端设备，8800+ 反应台在 220 条产线量产

**🟥 三大存储厂商订单最密窗口期（2026H2-2027）**
- **长鑫科技**：IPO 募资 345 亿元，DRAM 升级 180 亿 + 75 亿技改，2026 设备采购额 **200-430 亿元**
- **长江存储三期**：IPO 330 亿，208 亿用于技改，10 万片/月规划，**9 月已进入设备安装阶段**
- **福建晋华**：原产能 3 万片，2026 扩至 6 万片，2027 新增 3 万片，**已重启采购**
- 长存三期国产化率 50-70%（高于公司整体 45%）

**🟥 国产设备厂订单普遍爆表**
- 北方华创：2025 新签订单 500 亿，2026 预计 **700+ 亿**（+30%+）
- 中微公司：上修 2026 订单增速预期至 **50%+**，合同负债与存货高企
- 拓荆科技：2026H1 新接订单同比 **翻倍**，CX 端第一大客户，存储敞口超 60%
- 华海清科：2026H1 新接订单已达 2025 全年，**全年 100+ 亿**
- 盛美上海：2026Q1 新签订单 +65%，2026H1 **+105%**

**Mavis 点评**：设备业绩弹性不在 2026，而是 **2027-2028**（订单到收入确认 8-12 个月时滞）。现在订单爆表是预期，已经反应在股价上了（半导体设备 ETF 9/17 两天 +8%）；真正要关心的是 2027 兑现能力，以及美国出口管制会不会扩大打击面。

#### 2.2 制造/代工 🟢 TSMC 一家独大

**TSMC 8 月营收 5148 亿新台币**（环比 +10.1% / 同比 **+53.3%**），单月历史新高
- Q3 3nm 单季产值有望破 **4000 亿新台币**，占企业总营收 >30%
- 2026 年 capex **600-640 亿美元**，设备需求上修至原 1.9 倍
- 亚利桑那投资总额 **2650 亿美元**（再加 1000 亿扩产）
- 台积电 + ASE 9/21 在高雄 **先进封装园区** 破土动工（白埔工业区）

**Samsung 加速**
- HBM 市场份额从 15% 跳到 **38%**（1 年）
- 4nm 产线 **50-60% 产能**用于 HBM4 基础裸片
- 计划 2027 HBM4 产能 **至少翻倍**
- 越南工厂新增 **1612 台韩国造后段设备**

**Intel 高歌猛进**
- High-NA EUV 累计处理晶圆 **突破 100 万片**
- 股价逼近 **$95.80**（52 周低点 4 倍）
- 正在与 Google、Nvidia、SK Hynix 评估 EMIB 封装技术

**Mavis 点评**：TSMC 8 月营收 +53% 是 2026 半导体行业最强的单一数据点 —— AI HPC 需求不只是故事，是真金白银的产能订单。Samsung 把 50-60% 的 4nm 产能压到 HBM4，说明"内存不是逻辑附庸"了，是 AI 时代的核心战略资源。Intel 翻身速度比预期快，股价从 $24 到 $96，市场已经给了投票。

#### 2.3 设计/Fabless 🟢 AI 拉动

**🟥 2026Q2 全球前十大 Fabless 合计营收同比 +73%，达 1414.5 亿美元**
- 英伟达稳居第一，AMD 受益 AI CPU 排名上升
- 高通受手机拖累排名下滑

**Qualcomm + Amazon 9/9 宣布 40 亿美元 AI 联盟**
- 对英伟达推理市场主导地位的实质性挑战
- 燧原科技 9/11 科创板上市，募资 **61.19 亿元**

#### 2.4 存储/内存 🟥🟢 极度紧缺

**🟥 三星锁产能 70%、SK Hynix 锁定长协，库存告急**
- 全球 HBM 库存 **<10 天**
- KB Securities 预测 2027 DRAM/NAND 需求超供应 **10+ 个百分点**
- HBM4 消耗 3 倍传统 DRAM 晶圆产能

**🟥 长鑫存储 LPDDR6 全球首发（搭载小米 18 Fold）**
- 容量 16GB，速率 12800Mbps
- 比 LPDDR5X **带宽 +60%、功耗 -20%**
- 从"落后 5 年"到"全球首发"，用了 4-5 代时间追赶

**🟥 长江存储、CXMT 持续突破**
- CXMT 准备扩产 NAND，对标 YMTC
- 中国 LPDDR6 + 先进 NAND 在 AI 时代打开缺口

**🟥 Intel 12.8 亿美元现金收购 Infineon NOR Flash + F-RAM 业务**（Winbond 出资 11.2 亿美元）
- 服务器 NOR Flash 竞争格局重塑

**Mavis 点评**：存储的"紧缺 + 涨价"已经传导到消费端了 —— 8 月手机价格 +11% 不是偶然，是 HBM 抢产能导致通用 DRAM/NAND 减产。中国玩家长鑫从 LPDDR4 落后 5 年到 LPDDR6 全球首发，速度比当年 DRAM 行业快 5-10 倍，这就是国产替代的真正窗口。

        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
