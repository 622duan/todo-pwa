## 📡 板块 1｜宏观 PEST

**🟡 政策：央行"适度宽松"再加码**
- 8.1 央行下半年工作会议：综合运用并适时调整货币政策工具、保持流动性充裕、保持社会综合融资成本低位运行。
- 8.4 央行公告：8.5 开展 **5000 亿元买断式逆回购**（3 个月期，92 天），延续中短期流动性供给。
- 7 月 MLF 净投放 1000 亿，SLF -10 亿，其他结构性工具净投放 1744 亿；6 月末社融 +7.4%、M2 +8.0%。
- 8.4 人民币中间价 **6.7917**，单日调贬 19 基点；7 月全月中间价累计升值 215 基点。

**🟡 经济：7 月 PMI 跌破荣枯线**
- 7 月制造业 PMI 49.2%（前值 50.3%，-1.1pct），非制造业 49.0%（-1.2pct），供需双缩。
- 极端天气+暑期消费弱是主因，政治局会议定调"高度重视经济运行中的困难挑战"。
- 上半年规上工业企业利润 +18.7%，电子行业是核心拉动；广东 GDP +4.5%，但固投 -11.4%。

**🟠 外部：美联储 9 月加息分歧拉满**
- 7.30 FOMC 以 **9:3 维持 3.50-3.75%** 不变，三位地方联储主席投反对票要求立刻加息。
- CME 观察：9 月加息 25bp 概率 **64.7%**，维持 35.3%；10 月累计加息 25bp 概率 56.2%。
- 美国 7 月非农预期 8.5-9.1 万（前值 5.7 万），8.7 公布是 9 月决议前最重要锚。
- 美元指数 99.81（-0.26%），10Y 美债 4.684%（-1.29bp），30Y 5.226%。
- 日本央行 7.31 维持 1% 不变，市场押注日本新一轮救汇耗资 **870 亿美元**（11 万亿日元）。

**Mavis 点评**：政策端从"用好用足"转向"增量 + 落地"，8.5 5000 亿买断式回购 + 业内降准降息预期，下半年宏观面偏宽信号明确。但美联储 9 月加息分歧是悬在头上的剑——A 股今天能走强，跟美元走弱、人民币 7 月累计升值 215 基点直接相关。**如果 8.7 非农再超预期，9 月加息概率可能回到 70%+，那 A 股的反弹窗口会被压缩到 8 月上半月。**

## 💡 板块 2｜半导体产业链

**🟢 设备：景气持续确认**
- SEMI 预测 **2026 全球半导体设备销售额 1659 亿美元**（+23.2% YoY），连续 5 年增长，2028 年达 2295 亿美元。
- 台积电上修 2026 CapEx 至 **600-640 亿美元**（前值 520-560 亿，+15%）。
- ASML Q2 净销售 93.26 亿欧元（+21% YoY），年内第二次上调全年指引。
- **中微公司 H1 业绩预告：归母净利润 27-29 亿元，同比 +282.48%~+310.81%**；扣非净利 10-12 亿（+85.61%~+122.73%）；研发投入 20.42 亿（+36.89%）。8800+ 反应台在 220+ 产线量产。
- 长鑫存储注册资本由 238.9 亿增至 **313.9 亿元**（+31%）。

**🟢 制造：先进制程爆单**

- 2nm + 3nm Q4 合计月投片 **超 26 万片**。

- 1.4nm 中科新厂 2027 Q3 试产、**2028 中量产**，A14 节点密度比 2nm 提升 20-23%。

**🟢 存储：涨价末班车还在加速**
- 7 月 **DDR4 8Gb 合约价 $24**（+14.3% MoM），创 2016.6 以来历史新高，1-7 月累计 +340%。
- **128Gb MLC NAND 首破 $30**（+4.3% MoM），连续 19 个月涨价；SLC NAND 部分品 +35% 至 $51。
- HBM/服务器需求挤占消费级产能，Q3 DRAM 合约价再涨 13-18%，NAND 涨 10-15%。
- 铠侠 Q2 净利暴涨 45 倍，NAND 均价环比 +70%。
- **长鑫科技（688825）上市一周 +523%**，总市值 **3.61 万亿**，A 股市值一哥；预计 H1 营收 1100-1200 亿、归母净利 500-570 亿。
- DDR4 涨价是 SOP 工艺退出 + 三大厂转 HBM 的结构性结果，预计紧张持续到 2027。

**🟢 手机/SoC：成本压力见顶**
- Q2 全球手机出货 -6% 至 2.72 亿部，三星 6050 万、苹果 5510 万创新高、小米 3120 万（-26%）。
- **小米 8.2 起 9 款机型涨价 300-500 元**：小米 17 Pro Max 5999→6499，REDMI K90 Pro Max 4199→4499；卢伟冰称"近十年最严峻"。
- **高通 9.1 起全系两位数涨价**；联发科 6 月已调价。Q2 SoC 出货 -25% YoY。
- 华为 Mate 80 系列累计销量 **809 万台**（降价 800 元反向操作），第 30 周份额 20.7% 稳居国内第一。

**Mavis 点评**：半导体今天是全市场最硬的"主升浪"——SEMI 数据、台积电上调资本开支、ASML 超预期、中微业绩爆量，**四个独立信源同时验证同一个结论**。这轮周期的特点是"AI 算力 + 存储涨价"双轮驱动，定价权从芯片终端上移至设备/零部件。**长鑫科技一周 +523% 不是炒作，是国产存储"从 0 到 1"定价锚的建立——以前 DRAM 定价看三星海力士，现在 A 股有自己的锚了。**

## ✍️ 编辑后记

**Mavis 点评**：今天的日报核心是"科技主升浪 + 宏观预期改善"的双击。8.4 创业板 +5.64%、科创 50 +4.09%、成交 2.21 万亿，AI 硬件、CPO、PCB、CRO 全面爆发——这不是反弹，是 7 月极致分化之后的修复性暴力反弹。但要清醒：

1. **结构性而非系统性**：今天银行 -2.75%、白酒 -1.51%，**科技 vs 红利跷跷板** 还在拉扯。资金从高股息往科技搬，**茅台和工行今天被抽血 ~2600 亿**，不是它们基本面变差，是市场风格切了。
2. **存储涨价末班车**：DDR4 +340%、NAND +320% 累计涨幅，1-7 月已经透支了大部分预期。**8 月消费电子旺季数据会验证涨价能否传导到销量**——Q2 全球手机 -6% 已经是预警，苹果 iPhone 18 Pro 备货紧张、小米/OPPO 涨价 300-500 元后销量会不会崩，是接下来 1-2 个月最关键的验证点。
3. **美联储 9 月是最大变量**：8.7 7 月非农是关键锚。如果新增就业 > 10 万，9 月加息概率可能从 64.7% 回到 75%+，全球流动性再次收紧；如果 < 8 万，9 月不动、Q4 降息预期升温，**A 股科技股还有一波 9-10 月的主升浪**。
4. **国产存储锚定估值**：长鑫科技一周 +523%、市值 3.61 万亿，**正式成为 A 股市值一哥**。这件事的战略意义大于交易意义——它意味着 A 股市场对国产存储、半导体设备、材料形成了"独立定价体系"，不再完全跟着海外走。叠加 SEMI 上修设备销售额到 1659 亿美元、台积电上调 CapEx 80 亿美元，**半导体设备 + 存储 + HBM 这条线是 8-12 月最确定的主线**。

操作上：**继续超配半导体设备（HBM 链、长鑫链、ASML 链）、CRO 龙头、AI 算力（CPO/PCB/光模块）**；减仓高股息红利（银行、白酒、煤炭），除非 8.7 非农走弱再回来对冲。

**风险提示**：8.7 非农、9.16 美联储议息、9 月下旬政治局三季度经济形势分析、台海/中东地缘、AI 财报季（英伟达、AMD）任何一个事件都可能改变节奏。
