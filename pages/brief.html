## 6. ✏️ 五、编辑后记

**总论：今天 4 大主线**

今天（2026-09-05，周六）有 4 大主线值得重点关注：

1. **政策密集落地周**：9.1-9.4 连续 4 天 4 份重磅文件（双化协同、中小企业十五五规划、商品消费扩容实施意见、AI 中小企业创业计划），政策密度罕见。叠加 9.7 央行等量续作 3 个月期买断式逆回购 5000 亿、8000 亿新型政策性金融工具开闸投放，**Q3 实物工作量将明显抬升**。
2. **存储 + AI 芯片的"超级周期"已经载入史册**：Q2 全球 DRAM 市场规模 1470 亿美元创历史新高、HBM 现货价 287 万韩元（=长协 4-5 倍）、三星 70% 产能锁到 2031 年、寒武纪 H1 净利 23.11 亿超 2025 全年。**长存控股 330 亿 IPO 已问询（科创板史上最大）+ 长电科技 65 亿定增 + 长鑫 LPDDR5X 10667Mbps 量产** 标志国产存储进入"资本+产能+技术"三轮驱动。
3. **手机市场"消费降级挤出效应"**：Q2 全球 -7.4%/-11%，但**苹果 +14.9%、三星 +8.1%**——国产品牌（小米 -26.4%）让出的份额主要流向这两家。小米 18 Fold 全球首秀（玄戒 O3 + 长鑫 LPDDR6 + 1.2 万起售价）是中国折叠屏的"技术三件套首秀"。
4. **国产 AI 芯片"成人礼"**：2025 国产份额首次破 40% 达 41%，TrendForce 预测 2026 接近 90%；华为昇腾 950PR 单卡 = H20 的 2.87 倍、950 超节点 1 EFLOPS；DeepSeek-V4 适配 9 种国产芯片、华为 CANN 全面开源——**国产 AI 生态"上下打通"已经完成**。

**Mavis 独立判断 5 条**

🟢 **1. 存储是 2026 H2 最确定的方向，不是之一**
HBM 现货价 4-5 倍长协、三星 70% 产能锁定到 2031 年、HBM4 良率低于 HBM3E、HBM 抢货挤压所有 DRAM。**这意味着传统 DRAM/手机 DRAM 至少在 2027 年之前不会出现真正的"价格下行"**——这是结构性供需失衡，不是周期性涨价。**长存控股 330 亿 IPO + 单季 333.79 亿净利**是这个逻辑的国产映射。

🟢 **2. 国产 AI 芯片进入"业绩兑现期"**
寒武纪 H1 净利 23.11 亿超 2025 全年、摩尔线程 +147.4%、昇腾 81.2 万张占国产 49.2%——**财报已经覆盖了"市梦率"阶段**。**华为 CANN 全面开源 + DeepSeek-V4 9 种国产适配**完成了 CUDA 替代的"软件基础设施层"。摩根士丹利预测 2026 国产份额 90% 可能偏激进，但 70-80% 是合理预期。

🟡 **3. 全球手机"消费降级挤出"将持续 2-3 个季度**
ASP +27.6% 看起来是消费升级，但本质是"便宜机型消失"——东南亚 100 美元以下机型同比 -69%、拉美 -72%、非洲 -34%。**小米 -26.4% / OPPO -17.1% / vivo -19.6%**是结构性打击，**不是周期波动**。**小米 18 Fold 1.2 万起售价能否破圈** 是 9.7 发布会最关键看点。

🟡 **4. 9 月 LPR 仍按兵不动，Q4 降息 10-20bp 是基准情形**
LPR 连续 15 个月 3.0%/3.5% 不变；商业银行净息差 1.40% 再创历史最低，报价行缺乏主动下调 LPR 报价加点的动力。**但 Q3 出口可能边际走弱（关税 + 全球手机 -11%）+ 内需仍待提振**，Q4 实施政策性降息可能性较大，估计幅度 10-20bp；同时 5 年期以上 LPR 可能单独引导较大幅度下行推动房贷利率下调。

🟢 **5. 政策"密集落地" = Q3-Q4 实物工作量回升 = 9-10 月 A 股吃饭行情**
9.1-9.4 4 份文件 + 8000 亿政策性金融工具开闸 + 9.7 央行等量续作 + 长存/长电 IPO/定增提速 = **Q3-Q4 "稳投资"组合拳已经成形**。叠加 9.4 沪指 3930.17 点（连跌 2 日）、两市成交 2.03 万亿（放量 2718 亿）、电子化学品/半导体/元件/能源金属 9.4 跌幅居前——**这可能是 Q4 反弹前的"挖坑"阶段**。

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
