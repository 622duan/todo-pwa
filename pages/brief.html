## 三、板块一：宏观 PEST

### 3.1 政策：央行"组合拳"五连发（10/19 金融街论坛）

潘功胜行长在 2026 金融街论坛开幕式宣布即将出台的政策：

1. **设立应对非银机构大额赎回的流动性支持工具** —— 适用银行理财子、公募基金及其母行/证券母公司，在资管机构面临"赎回—抛售"负向循环时启用
2. **扩大 SLF 适用机构范围** —— 纳入境内外资法人银行，全国性银行适用同等安排，实现对境内存款类机构全覆盖
3. **推动银行间与交易所债券市场互联互通落地** —— 已具备落地条件，测试后即可开通
4. **试点 8 家中外人民币境外清算行** 在境内银行间外汇市场开展自营交易
5. **会同科技部等 10 部门**出台《关于金融支持建设北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心的指导意见》

**货币政策框架三大转向：**
- 研究择机把公开市场主要操作品种期限切换为**隔夜**，隔夜回购利率相应成为主要政策利率
- 推动贷款利率定价基准从单一 LPR 向**多元基准**转型，财务能力强的企业可自主选 DR001 或 LPR
- **退出存贷款基准利率**

**Mavis 点评**：这段话信息量很大，但最容易被误读。央行自己已经在多个场合强调"操作机制改革 ≠ 降息"。当前 7 天期逆回购利率 1.4%，隔夜大概率低于 1.4%——这属于正常期限溢价。广发郭磊、申万黄伟平都提示市场避免炒作。**真正该盯的不是"降不降息"，而是 DR001 能不能长期稳住、以及挂钩 DR 的贷款实际投放规模有多大。** LPR 的角色正在从"全市场统一锚"收缩成"小企业+个人贷款锚"。

### 3.2 财政与监管

- 证监会吴清：将推出 4 项举措——筹建基金业运行监测中心、发布 AI 在证券期货业安全合规应用的意见、完善违规减持处罚规则、制定证券市场先行赔付指导意见
- 金融监管总局丁向群：全面强化"五大监管"，综合运用兼并重组、市场退出稳妥处置高风险机构
- 9 月末央行已调整完善结构性工具：PSL 利率下调 **0.25pct**，支农支小再贷款额度上调 5000 亿（民企再贷款 +3000 亿、科技创新和技术改造再贷款 +2000 亿、再贷款"报销"比例由 60% 提至 100%）

### 3.3 汇率

- 10/16 人民币对美元中间价报 **6.7220**，单日调升 33 基点，本周累计调升 110 基点
- 中金李刘阳：中间价年化波动率由 2025 年的 0.8% 回升至 **1.2%**，市场化程度明显提升
- 央行三季度例会重申"保持人民币汇率在合理均衡水平上基本稳定"
- 潘功胜回应汇率指责："把本国长期高财政赤字、产业竞争力下降等结构性问题简单归因他国汇率，是对自身调整责任的推诿和回避"

## 四、板块二：半导体产业链

### 4.1 设备：从"单点突破"到"全栈平台"（湾芯展 10/14—16 深圳）

**展会硬数据：**
- 近 **8 万㎡** 展览面积（首届仅 3 万㎡），**1000+ 家**企业参展
- 参展企业同比 **+66%**，展览面积同比 **+30%**，22 个国家和地区
- 首次设立 **AI 基础设施板块**

**2025 年国产化率真相（伯恩斯坦 5 月研报）：**
| 环节 | 国产化率 | 梯队 |
|------|---------|------|
| 刻蚀 | **31%** | 第一梯队 |
| 薄膜沉积 | **27%** | 第一梯队 |
| 量检测 | **约 10%** | 第三梯队 |
| 离子注入 | 更低 | 第三/四梯队 |
| 光刻 | 最低 | 第四梯队 |

**亮点企业动态：**
- **中微公司**：Primo Domingo® 气相高选择性刻蚀设备全球首台机付运国内客户，填补国产在 GAA/3D NAND/3D DRAM 高选择性刻蚀的空白；展出 70:1–90:1 超深孔刻蚀机 + 12 英寸 ALD 金属钼设备；研发周期从 3–5 年压缩到 **2 年以内**，未来 3–5 年投 **近 130 亿**开发 **102 款**新设备，目标覆盖 60% 以上高端设备市场；截至 6 月末 **超 8800 个反应台**在国内外 **220 余条产线**量产
- **华海清科**：跨界发布首款**中束流离子注入机**，整机国产化率 **95.6%**，计划 2027 年全部国产化（目前仍处验证阶段）
- **微导纳米**：发布 iMagtron 系列 PVD 设备，补齐 **ALD / CVD / PVD** 三大主流薄膜路线；同步推出金属钌 ALD 工艺
- **精智达**：首次把存储测试机、自研算力芯片测试机、连接测试机、探针卡**全系列**推向市场；上半年营收 8.04 亿（+81.17%），1 月和 9 月签两笔合计 **28.87 亿**测试设备合同，超去年全年营收两倍
- **新凯来**：新增 PMI 光学检测设备、mEBI 多电子束晶圆缺陷检测设备；表态"半导体设备已进入量产阶段，国内多家晶圆厂在用"
- **启云方**：发布 EDA 系统级工具链，设计周期缩短 **20%**、硬件一版成功率提升 **30%**

**零部件本土化四梯队：**
1. **已批量供货** —— 汉钟精机干式真空泵（全球半导体真空泵本土化率不足 15%）、恒运昌等离子体射频电源（已供货拓荆/中微/北方华创，5nm 产品小批量试产，产能利用率 102%，国内份额第一）、中瓷电子 + 珂玛科技陶瓷加热盘（珂玛已量产应用于 14nm，累计交付超 2000 支）
2. **小批量/验证→批量过渡** —— 静电卡盘（中瓷 12 寸氧化铝基已在北方华创上机验证；先锋精科客户样品验证预计 2027）、新松半导体 EFEM + 机械手（国内份额第一）
3. **验证导入期** —— 半导体级 MFC（本土化率不足 **5%**，日本 Horiba 占全球超 60%，交期近一年，压电陶瓷占成本约 40% 被日本垄断）、碳化硅零部件
4. **最难档** —— 光刻机光源（Cymer 占全球 80%+，本土化率不足 **1%**）、半导体级真空阀门（长期依赖瑞士 VAT、日本）

**Mavis 点评**：零部件这个"四梯队"框架是本周最有价值的整理。很多报道只讲"国产替代"四个字，但拆开看差距是结构性的——**射频电源国产化了、静电卡盘还在验证、光刻光源连 1% 都不到**。还有一个被忽略的信号：东吴证券指出海外零部件交期拉长，国内龙头设备商已出现零部件紧缺，这会**加速**国产零部件导入。这是一个被动的、但确定性很高的国产化推手。

**Q3 稼动率 95.8%**（8 英寸），8 英寸 BCD 平台已提价约 **10%**，订单能见度接近 **6 个月**。

**同业对照：**
- **华虹**：营收 +19.41%、出货 +17.9%，但十二英寸产线爬坡带来折旧上升
- **晶合集成**：营收 +14.59%，**部分提价尚未充分体现**（受生产周期影响），扩产折旧摊销 + 股权激励共同压制利润
- **台积电**：计划 2027 年退役 6 英寸 Fab2 和 8 英寸 Fab5
- **三星**：2026 下半年关闭清河 8 英寸厂，月产能减少 **5 万片**

**财通证券首次覆盖中芯，给予"增持"**：预计 2026—2028 年营收 123.16 / 146.38 / 161.63 亿美元（+32.1% / +18.9% / +10.4%），归母净利 14.35 / 20.04 / 24.86 亿美元，对应 PE 40.25 / 28.81 / 23.23 倍。

**Mavis 点评**：三家代工厂出现明显分化，这个案例特别值得记住——**中芯已经拿到量价改善传导到毛利的正向证据，晶合却是"收入扩张 + 利润承压"同时发生**。晶合自己都说了"部分产品价格上调的积极影响尚未在当期业绩充分体现"。所以判断利润拐点的正确姿势不是"工厂忙不忙"，而是"**提价有没有真正进入交付 + 新增折旧能不能被摊薄**"这两件事在同一期相遇。时代商业研究院说得更狠：中芯的盈利抬升主要来自成熟制程红利 + 高稼动率，**先进制程更多是远期价值期权，不该视作未来一两年的业绩核心驱动力**。

**竞争焦点转移：**

**华为**：麒麟处理器累计出货突破 **1 亿颗**，Mate XT 2 预计售 100 万台。

**Mavis 点评**：这份三季报最值得看的不是海光的增速，是三个"隐形信号"：
1. **利润增速超营收增速** —— 海光扣股份支付后 +76.9% vs 营收 +57.6%，说明产品结构在高附加值方向走，这个比营收本身有意义
2. **研发占营收近 30%** —— 这个投入强度是硬门槛，短期扰动利润，长期才是护城河
3. **存货和预付款暴涨** —— 这不是财务问题，是**供应链焦虑**。上游存储涨价已经把芯片设计公司逼到必须提前一年锁产能

至于"Day 0 适配普及"，我的判断是：**这是好事，也是坏消息**。好事是国产芯片不再是"模型发布两周后才能用"的次等选项；坏消息是适配速度不再是壁垒，那么差异化就只剩系统效率、供货能力和价格——而这三样恰好都是最难补的短板。

| **玉米** | 主产区价格偏弱但趋势趋缓；东北新粮收获超六成，黑龙江部分折干价贴近 **2000 元/吨**；北方港口库存处近年同期高位；中储粮东北启动轮换收购，挂牌价高于深加工收购价，提供底部锚 | 关注农户售粮节奏、11 月上市高峰回落 |
| **生猪** | 北方产区继续下跌；10 月规模猪企出栏环比增加，9 月未完成计划顺延；出栏均重仍高；国庆备货红利消退，屠宰开工率回落；冻品库容率处近年同期高位；下跌空间已不大但供强需弱格局未扭转 | 关注集团出栏节奏、二次育肥动向、冻品去库 |
| **鸡蛋** | 主产区均价已跌至**成本线**；食品厂订单同比下滑约 10%；10 月中旬以来老鸡淘汰加快，库存压力边际缓解；继续深跌会触发加速淘汰，下方空间有限 | 关注双 11 电商备货需求拐点 |
| **豆粕** | 平开震荡回落，转震荡偏弱；美豆收割本周完成 **64%**（上周 46%，五年均值 65%），季节性收获压力明显；美国大豆出口检验量环比 +80%、同比 +26% 超预期 | 关注 3220—3320 区间 |
| **油脂** | 布伦特原油徘徊五个月高点（胡塞袭击沙特基础设施维持风险溢价）；马来西亚考虑**免除毛棕榈油出口税**以削减高企库存；10 月 1—15 日马棕出口环比 **+43.2% 至 58.3%** | 棕油关注 9380—9780 |
| **棉花** | 郑棉高开震荡走弱；美棉产区天气干燥利收割但可能带来供应压力；美国出口销售报告平淡，创 9 月 10 日以来最低；纺织需求季但乏力 | 郑棉关注 15440—18680 |

| **双焦** | 焦煤跌幅大于焦炭，保供政策预期持续压制；山西复产推进 + 11 月蒙煤通关恢复预期 | 暂时观望 |

**Mavis 点评**：农产品这块的核心不是涨跌，是**成本线附近的僵持**。玉米、生猪、鸡蛋三个都贴着成本线，这个组合在过去几年很少见——通常只有一个品种在成本线附近。这意味着整个农业链条的定价权暂时消失，所有品种都在等外力打破：**中储粮收储**是玉米唯一的向上变量，**双 11 备货**是鸡蛋唯一的向上变量生猪则完全没有向上的抓手。这种状态下，猜方向很难，等触发更现实。

## 六、板块四至六：六大圈子八卦

### 6.1 融资圈：铭芯启睿 A 轮超 4 亿，米哈游 + 小米 + 兆易创新围投

**10 月 19 日，铭芯启睿（MemSilicon）宣布完成超 4 亿元 A 轮融资**
- 领投：博原资本
- 跟投：博世创投、创领资本、**米哈游**、中关村科学城公司、**兆易创新**
- 老股东加注：复容投资、国开科创、恒裕资本、锦秋基金、顺禧创投、**小米战投**、中科创星
- 用途：RRAM 产业化与商业化 + 新产品 LPU 研发

**同日人事：前 Graphcore 总裁兼大中华区总经理卢涛出任 CEO 兼联合创始人**
- 履历：Cavium 中国区总经理（Arm 服务器 CPU）→ 英国 AI 芯片公司 Graphcore 总裁兼大中华区总经理（IPU 架构）→ 曦智科技副总裁（硅光芯片）
- **两年前公司刚成立时就邀请过他，被拒绝**。今年 3 月英伟达 GTC 大会后重新考虑创业，接受时认为"从零组建团队、确定架构、完成融资需要 6—9 个月"
- 博原资本蒋红权："对铭芯的信任始自十年前的 Graphcore 渊源"
- 锦秋基金郑晓超："具备国际化视野、浪漫又务实的创业者"

**技术进展：** 10 月 14 日宣布"**泰山一号**"完成流片——28nm CMOS、1T4R 单元、单芯片容量 **1Gb**（约 128MB）、存储密度 **30Mb/mm²**、访问延时 **<20ns**、集成片上硬件纠错电路。团队源自中科院刘明院士团队，200 余项发明专利。

**LPU 目标（很激进）：** 支持数万亿参数完整模型、不依赖量化或投机解码、**每用户每秒 1000 Token**。对照：当前主流云端长上下文推理输出速度在几十到百余 Token/s。首代 LPU 尚未流片、无实测数据，团队仅十几人，且**第一代 LPU 并不直接采用 RRAM**，先用更成熟存储介质跑通产品。

**Mavis 点评**：这个案子最值得看的不是 4 亿，是那个**两年前被拒绝、今天主动上门的 CEO**。卢涛完整经历了 Graphcore 从 27.7 亿美元估值、裁员、关海外业务、2024 年被软银收购的全过程——一个知道"怎么死"的人来做推理芯片，比十个从 PPT 出发的人有价值得多。投资方蒋红权那句"信任始自十年前"直接点破了资本圈的隐藏逻辑：**AI 芯片的胜负在人事，不在图纸**。

但我得泼点冷水：1000 Token/s 的目标 vs 十几人团队 vs 尚未流片，这个落差太大了。卢涛自己也用高铁打比方承认了——"普通票 200 元、高铁票 2000 元，很难普及"，定价逻辑只能是"比普通服务贵，但溢价有限"。**这个赛道已经有 Groq（35 亿美元估值）、Etched（210 亿美元估值，Jane Street 领投并接收首个机柜）、Cerebras（OpenAI 分阶段部署 750 兆瓦）**。铭芯的差异化在 RRAM 与推理架构的底层结合，但"泰山一号"仍在验证、无量产客户，RRAM 的可靠性一旦在系统级验证暴露短板，产品化节奏会被拖慢。

### 6.2 AI 芯片创业圈：Groq 被英伟达技术许可，Jim Keller 又出新牌

- **英伟达 2025 年 12 月**与专注推理的 **Groq** 签署非独家技术许可协议，创始人 Jonathan Ross 等核心成员加入英伟达；Groq 保留独立运营，今年 8 月完成 **3.5 亿美元**融资，估值 35 亿美元
- **Etched** 8 月融资 **7 亿美元**，估值 **210 亿美元**（一个月前还是 103 亿）；量化巨头 **Jane Street** 领投并接收其交付的首个机柜；公司称已有超 **10 亿美元**客户合同
- **Cerebras** 2026 Q1 营收 1.934 亿美元；今年 1 月 **OpenAI** 宣布合作，计划分阶段部署 **750 兆瓦**低延迟计算容量直至 2028 年
- **Tenstorrent**（Jim Keller）：2024 年 12 月 D 轮超 **6.93 亿美元**（三星证券、AFW Partners 领投，现代汽车、LG 电子参投）；同时布局硬件/软件栈/IP 授权三线，**三星、LG 已基于其自研 TT-Ascalon RISC-V CPU 核心和 Tensix AI 核心自研 AI 芯片**
- **反例 Graphcore**：一度估值数十亿美元，最终因没能建立足以对抗 CUDA 的客户和软件生态，2024 年卖给软银

**Mavis 点评**：把 Groq、Graphcore、Tenstorrent 放在一起看是最好的一堂课。Graphcore 技术足够好、融资足够多，死在**生态**；Groq 技术好、现在被英伟达技术许可收编，创始人加入英伟达，本质是同一结局的另一种形式；Tenstorrent 的出路是**IP 授权**——把核心 IP 卖给三星、LG，让别人去建生态。**这三条路径说明，推理芯片这个赛道，"自己建生态"这条路大概率走不通，除非你有 Jane Street（既是投资方又是第一个客户）这种级别的锚定客户。** Etched 拿到 Jane Street，某种程度上是被允许的"Graphcore 剧本重演，但这次有兜底"。

### 6.4 晶圆厂圈：三星关厂、台积电退产，成熟制程成了香饽饽

- **三星**：2026 下半年关闭清河 8 英寸厂，月产能减少 **5 万片**
- **台积电**：计划 **2027 年**退役 6 英寸 Fab2 和 8 英寸 Fab5
- **贯通芯联**（Tazmo 中国独家代理）：晶圆搬运设备**供不应求**，交货周期达 **8—12 个月**，多家厂商已锁定合作订单；LoadPort 国内已多家落地，晶圆装载环节基本完成国产化；**校准仪预计明年推出完全自主研发国产化版本**；机械臂定制化已落地
- **神火股份**：新疆 + 云南两大电解铝基地合计产能 **170 万吨/年**，煤炭在产产能 795 万吨/年，电池铝箔储备产能 16 万吨/年

**Mavis 点评**：三星和台积电同时退 8 英寸/6 英寸产线，加上中芯、华虹、晶合的 8 英寸 BCD 平台集体提价 10%——这三件事必须一起看。**成熟制程不是"落后产能"，而是正在变成战略资源**。原因是 AI 服务器的电源管理、PMIC、连接芯片需求暴涨，单台 AI 服务器 PMIC 内容量从 $80 涨到超 $1000，而这些东西绝大多数都在成熟制程上。台积电资源向 AI 先进节点倾斜，28nm 及以上被挤占，PMIC/MCU/CIS/显示驱动订单外溢——东吴证券的这个逻辑链是完整的。**对国产设备厂来说，这是过去几年最舒服的订单环境**。

### 6.5 硅片与材料圈：立昂微、西安奕材双双转正

- **立昂微**：前三季度净利 **1.74 亿**，同比扭亏；扣非 1.33 亿扭亏。原因：半导体硅片板块盈利能力大幅改善，12 英寸硅片产销量大幅增长、单位成本同步下降、售价上涨，综合毛利率同比大幅上升
- **西安奕材**：前三季度营收 **26.51 亿**（+37.16%），净利 1.51 亿扭亏（但扣非亏 4.73 亿）；Q3 营收 10.62 亿（+68.50%），净利 **4.41 亿**（扣非亏 1.53 亿）。产线**持续满稼动**，期末出货突破 **110 万片/月**，12 英寸硅片国内第一、全球第六；年底第二工厂达产后产能约 **120 万片/月**
- **富创精密**：静电卡盘完成国内部分设备厂商验证并本土化，可适配 ETCH/CVD/PVD/IMP/CD-SEM；上半年归母净利同比 **+992.90%**，营收 23.18 亿

**Mavis 点评**：注意西安奕材的利润结构——**归母净利 1.51 亿，但扣非亏 4.73 亿**，差额来自对外投资持有上市公司股票的公允价值变动。这是 A 股三季报里的经典陷阱：**看净利是扭亏，看扣非还在亏**。立昂微则相反，扣非也是正的 1.33 亿，质量更实。所以同样"扭亏为盈"四个字，含金量完全不同。

### 6.6 算力基建圈：一周签出 450 亿+

- **协创数据**：10/19 晚公告，全资子公司签署合同金额**近 375 亿元**算力大单，服务期限 **60 个月**
- **赛意信息**：与 W 公司在 2 份 67.2 亿高性能算力服务合同基础上，再签《算力组网服务合同》3.15 亿，合计调整为 **70.35 亿**
- **彩讯股份**：9 月底与 H 公司签《算力技术服务协议》，服务期 60 个月，服务费总额预计**不低于 18.12 亿元**
- **华为**：昇腾 950DT 万卡池、千卡超节点在运营商侧落地；华为云灵衢昇腾 950 智算集群 **9 月 30 日**在国内商用
- **京东云**：9/9 宣布拟建**十万卡**智算集群，采用摩尔线程 GPU；看中的是摩尔线程在大规模集群上的成熟交付经验
- **润泽科技**：全球布局九大 AIDC 集群，规划规模约 **6GW**、运营约 **750MW**，2026 年落地香港和印尼节点，巴淡岛项目预计年内交付 60MW；上半年算力业务营收 19.95 亿（+126.24%），占比 53.26%
- **浪潮信息**：拟 **90 亿元定增**投向超节点整机柜、液冷原生算力基础设施；元脑 SD200 超节点在万亿参数模型上 Token 生成快至 **4.77 毫秒**

**全国算力盘子**：截至 9 月底智能算力规模 **2592 EFLOPS**（同比 **+146%**）；5G 基站 **525.4 万座**；千兆光网 10G PON 端口 3340 万个。

**Mavis 点评**：协创数据这一笔 **375 亿 / 60 个月**（平均每月 6.25 亿）不是普通订单，这个体量意味着**算力已经从"卖硬件"变成"卖电力+卖机柜时长"的公用事业生意**。山西证券的判断我认同：商业模式正向 **Token 分成**跃迁。这意味着行业正在从"一次性资本开支"转向"持续性服务收入"，估值逻辑会变。同时要看到反面——**协创数据本身不是芯片公司，它是算力租赁/服务商**。375 亿订单带来的是营收，但同时也带来了巨额资本开支和折旧负债。真正的确定性在芯片和设备，不在租赁。

## 九、编辑后记

今天是**信息密度极高**的一天。宏观（金融街论坛五项新政 + GDP 4.5%）、产业（湾芯展落幕 + 长鑫三季报 + 工信部有色新政）、公司（三季报密集披露 + 回购潮）三条线同时交汇，随便挑一条都能写三千字。

如果要我用一句话概括今天：**"国产替代从政策叙事进入了收入表兑现期，但兑现的方式是分化，而不是普涨。"**

三个具体感受：

**第一，存储的"斜率三连降"是这周最重要的价格信号，也是最容易被误读的。** Q2 +80% → Q3 +40% → Q4 +20%，很多人会把这读成周期见顶。但高盛同期把 2027 缺口从 -2.5% 下修到 -5.9%，美光说紧张持续到 2028，海外大厂 2027Q1 报价还涨 30%~40%。**涨幅收窄和景气反转是两件事**——前者是基数效应，后者需要供给真正释放，而新增 DRAM 产能从装机到形成有效比特产出要 7—9 个季度，且大部分已被 HBM 占用。真正该盯的反转信号是"多个 DDR5 品种 30 日涨跌持续转负"，目前还没有。

**第二，国产设备展的热词变化比任何新品发布都更有信息量。** 从"光刻机""刻蚀机"变成"系统""平台""全栈""量产胜任力"——这四个字背后是行业认知的成熟：参数达标不等于能供货，能供货不等于能稳定跑一年。中微说自己研发周期从 3—5 年压到 2 年以内、要投 130 亿做 102 款设备，这个"更快更宽"的策略我认为是对的，因为在国产化率只有 21% 的市场里，**做得慢不如覆盖全**。但零部件的四梯队提醒我们，最后那几个百分点才是最贵的——光刻机光源本土化率不足 1%，这不是钱和时间能立刻解决的，是整个上游材料体系的问题。

**第三，中芯和晶合的分化值得所有制造业观察者记住。** 中芯 Q2 销量 +14.9%、均价涨到 6667 元、毛利改善；晶合收入 +14.59% 但利润被折旧和股权激励压住，**公司自己都承认"部分提价带来的积极影响尚未在当期业绩中充分体现"**。同一个行业、同样"量价齐升"的叙事，落到报表上是完全不同的两张脸。判断一家制造企业，不能问"工厂忙不忙"，要问三个问题：**提价进没进交付？新增产能的折旧摊薄了没有？产品组合是往高走还是往低走？**

最后说点不客气的。今天的信息源里有一类内容我必须点出来——**"一年赚到中芯国际 40 年的钱"这类标题**，用的推算逻辑是"Q1 净利 333.79 亿 × 4 季 = 2000 亿"，但它既没有考虑 Q3 净利已达 508 亿（Q1 到 Q3 环比是上升的）、也没考虑四季度价格拐点的不确定性，更没考虑巨额资本开支的折旧。**这种数字游戏对读者没有价值，只会制造错误锚点。** 我把它放进日报并标注"公司未披露全年指引"，是为了让读者看到它、判断它、然后自己否掉它。

明天关注：LPR 后的第一轮流动性观察（隔夜逆回购 10/21—11/2 每日上限 1 万亿）、科创板三季报披露收尾、以及铜的"232 关税靴子"是否落地。
