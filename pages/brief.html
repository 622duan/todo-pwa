## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

#### 国务院常务会议（2026 年 10 月 23 日）

李强总理主持召开国常会，两大议题：

**议题一：研究统筹人口与经济社会发展有关工作**
- 加快完善全民终身学习机制，广泛开展技能培训，强化教育、培训与产业发展协同联动
- 加强区域人口发展分类指导，稳步推进基本公共服务均等化，根据人口分布优化基础设施布局
- 加快建设生育友好型社会，完善婚嫁、生育、养育、教育政策，优化财税、社保、住房支持举措，努力稳定新出生人口规模

**议题二：听取推进全国服务业大会部署落实情况汇报**
- 加力推进服务业扩能提质，加快破解融资、用地、人才、数据等堵点
- 稳步推进公共事业领域价格改革，加大力度盘活用好闲置资源
- 按照全国统一大市场要求，持续破除市场准入障碍，清理民间投资隐性壁垒
- 鼓励扩大服务业投资，释放服务消费潜力

来源：[人民日报 2026-10-24](https://politics.people.com.cn/n1/2026/1024/c1024-40820605.html) | [新华社·国家卫健委转载](https://www.nhc.gov.cn/wjw/mtbd/202610/24eb4334233443bdbf3d0547f6d3de99.shtml)

#### 国常会（10 月 16 日）—— "人工智能+" 专项汇报 + 价格法修订

- 听取"人工智能+"行动进展：**以落地应用牵引技术创新**，促进算电协同，增加高质量数据供给，推进中试验证，加大场景培育力度
- 原则通过《价格法（修正草案）》：明确不正当价格行为认定标准，**依法治理低价无序竞争**，健全行业成本调查、制止低价倾销规则，"持续规范平台经济领域价格竞争行为"
- 原则通过《教师法（修订草案）》

来源：[中国教育报 2026-10-17](https://paper.jyb.cn/zgjyb/h5/html5/2026-10/17/content_144740_19947370.htm) | [人民网](https://cpc.people.com.cn/BIG5/n1/2026/1017/c64094-40816438.html)

#### 商务部等 9 部门《关于加快推进科技兴商的意见》（商建函〔2026〕551 号，10 月 13 日）

九部门联合发文（商务部、中央网信办、发改委、教育部、科技部、工信部、文旅部、央行、市场监管总局），落实"十五五"规划纲要，**十八条**部署科技赋能商贸：

| 方向 | 关键部署 |
|------|---------|
| 商品消费 | 深入实施"人工智能+制造"专项行动，丰富智能手机、电脑、家居、穿戴设备、机器人等智能商品供给 |
| 服务消费 | 开展"人工智能+文化和旅游"应用试点；升级国家智慧教育平台；建设智慧养老托育机构 |
| 流通链条 | 数智供应链专项行动；推广智能立体仓库、智能物流装备、无人配送；"先鉴别后发货"品质电商 |
| 未来场景 | 培育**商业智能体**新业态，推动**具身智能**在商贸领域落地；区块链碳足迹核算 |
| 标准体系 | 推广实施《**人工智能终端智能化分级**》系列国家标准 |
| 金融支持 | 加大财政金融支持，普惠算力赋能商贸领域 AI 创业企业 |

来源：[中国政府网](https://www.gov.cn/zhengce/zhengceku/202610/content_7083721.htm)

#### 货币政策工具调整（央行，9 月 29 日）

| 工具 | 调整 |
|------|------|
| PSL 利率 | 下调 **0.25 pct**（1 年期 1.75% → **1.5%**） |
| PSL 支持领域 | 扩至"**六张网**"：水网、新型电网、**算力网**、新一代通信网、城市地下管网、物流网 |
| 科技创新和技术改造再贷款 | 额度 1.2 万亿 → **1.4 万亿**，支持比例 60% → **100%** |
| 支农支小再贷款 | 额度 4.35 万亿 → **4.85 万亿**，其中民企再贷款 1 万亿 → **1.3 万亿** |

来源：[新华社 2026-09-29](https://www.gov.cn/xinwen/2026-09/29/content_7083600.htm)

#### 居民购房贷款贴息政策（财金〔2026〕95 号，9 月 29 日）

中央财政首次对部分收入相对不高的群体商业性个人住房贷款贴息：
- **聚焦首套刚需**：建筑面积 ≤ **120 ㎡**，房价 ≤ **150 万元**
- **贴息 1 个百分点**，可享受贴息的贷款规模最多 **100 万元**，贴息期限最长 **5 年** → 100 万贷款累计减息近 **5 万元**
- 起始日 **2026 年 10 月 1 日**，实施期暂定 **1 年**，资金总规模**不设上限**

来源：[财政部/央行/金融监管总局答记者问](https://www.gov.cn/xinwen/2026-09/29/content_7083600.htm)

#### 绿色算力设施推荐（工信部等五部门，9 月 21 日）

- 绿色发展水平须达《绿色数据中心评价》**二级及以上**
- 电能利用效率（PUE）达《数据中心能效限定值及能效等级》**二级及以上**
- 算力设施规模原则上不小于 **3000 个标准机架**、**上架率不低于 60%**
- 各省级工信部门 **11 月 16 日前**报送推荐意见

来源：[上海金属网引工信部通知](https://www.shmet.com/news/newsDetail-2-927936.html)

**Mavis 点评**：10/23 国常会把"人口"和"服务业"放在同一张桌子上谈，这比单独讲生育政策更有意思——本质是承认人口结构已经是经济变量。🟢 更值得注意的是 10/16 国常会通过了《价格法（修正草案）》，明确要"治理低价无序竞争、制止低价倾销"，在存储涨价潮推动终端提价的当口修订价格法，指向的是"打击价格战式内卷"而非"限制涨价"。配合 9/29 央行把 PSL 扩到算力网、再贷款支持比例提到 100%，政策端已经在给算力基建加杠杆了。

#### 🟥 HBM 产能挤出：涨价的物理机制

- **生产每比特 HBM 所消耗的晶圆产能约为标准 DRAM 的三倍**（芯片面积更大、堆叠工艺复杂、良率损耗贯穿全程）
- 三大原厂 HBM 晶圆投片占 DRAM 总投片量比重：2025 年底约 **18%** → 2026 年底 **22%** → 2027 年底预计 **30%**
- HBM 位元供给占总 DRAM 位元供给比例：8% → 9% → 约 **13%**
- 结论：**近三分之一的晶圆被配置到了只产出约八分之一位元供应的产品上** —— 通用 DRAM 供给缺口不是需求放缓能弥合的，是产品结构本身决定的
- 英伟达被曝内存大调整：Rubin Ultra 转向 **8 层 HBM4**；三星和 SK 海力士准备 2027 年 Q2 供应
- 三星被曝 2027 年 HBM4 报价达 **中高 40 美元/Gb**，对比 HBM3E 当前约 **$1.50/Gb**（谈判报价，非成交合同）
- SK 海力士 2027 年 HBM 供货谈判已完成，HBM 与常规 DRAM 盈利能力差距将显著收窄

**Mavis 点评**：SK 海力士这组数字是本轮周期最硬的证据——营业利润率 **80%**（去年同期 47%）、营收同比 **+328%**、单季利润接近去年全年两倍。但 🟥 净利润 39.78 万亿**低于预期**，环比 -58%，原因不在经营面（是铠侠投资重估的一次性收益反噬 + 汇率/投资资产损失 32.63 万亿）。**最关键的一句话是"2029 年产能已近乎售罄"**：LTA 锁了 2027—2028 年 **50%+** 产能，14 家客户长协，退出成本高到无法砍单 —— 这意味着本轮周期和历史任何一轮都不同，靠"涨价刺激供给释放"来终结已经走不通了。🟢 但我更在意 A 股的分化：江波龙单季净利率从 47.4% 掉到 26%，说明**存储涨价的利润在向原厂集中，模组和贸易商在被挤压**；真正抗周期的是澜起科技（毛利率 68%，靠互连不靠颗粒涨价）。这比"存储板块涨了多少"更有信息量。

#### 设备与材料国产化率（核心结论）

- 半导体设备整体国产化率 **不到 20%**，核心环节 **低于 10%** —— 这是一个"从 0 到 1 已完成、从 1 到 优 未完成"的阶段
- 中芯 N+2 产线设备国产化率约 **50%**，刻蚀/薄膜沉积超 **60%** → 成熟制程已能大规模用国产设备，先进制程还差一半
- 干式真空泵认证周期 **2—5 年**，形成"无量产履历无订单、无订单无履历"循环 → 这是最典型的"最后一公里"瓶颈

**Mavis 点评**：设备材料是国产替代里**确定性最强、弹性最小**的一环 —— 因为它不需要等下游需求，只需要等验证。2026 中报已经给出答案：中微净利 **+300%**、长鑫扭亏、安路/立昂微/中瓷电子全线飘红。但我盯的不是这些，是那个被忽视的 **干泵 80% 外资占比** —— 主设备都"能用"了，配套干泵还卡着 2—5 年认证周期，等于主设备的"好用"承诺兑现不了。真正该跟踪的三个指标：**新增产业投资落地、国产设备材料验证进度、下游 AI/汽车电子需求**。至于铜箔和 InP 这些材料，缺口 48% 和 70% 不是需求问题，是产能问题 —— 下游客户现在连预付款锁产能都开始了（朗美通付 8700 万美元无息预付款）。

## 6. ✏️ 五、编辑后记

### 总论

今天真正的主线只有一条，但被拆成了三层：**存储超级周期进入业绩兑现期**（SK 海力士营收破 100 万亿韩元、营业利润 +632%），**国产算力完成第一次份额反转**（昇腾从 3% 到 50%、英伟达从 95% 到 8%），而这两件事共同把消费电子行业砸进了**史上最惨季度**（IDC 全球 Q3 -22%，中国 -15.4%）。三件事不是并列的，是因果链：HBM 吃掉三分之二晶圆产能 → DRAM/NAND 合约价再涨 10%—20% → 手机 BOM 存储占比冲到 65% → 终端被迫提价 → 消费者推迟换机。

第二条被市场忽略的主线是**国产芯片的瓶颈已经换了性质**。昇腾份额反转是技术叙事，但徐直军自己说了实话 —— 瓶颈不在需求在产能。中芯 N+2 全年 260 万颗 vs 国产 AI 芯片需求 420 万颗，缺口 160 万颗，占需求近四成。这意味着国产 AI 芯片的竞争已经不是"能不能做出来"，而是"能不能排到产线"，华为锁 43%、寒武纪拿 11%，这是分配额不是分蛋糕。

第三条线是**政策窗口**：11 月 10 日（稀土）、11 月 27 日（对美镓锗锑）、11 月 16 日（绿色算力名单报送）、11 月 18—19 日（APEC 深圳）。四个日历节点挤在两周半内，材料板块的定价逻辑在这段时间会反复摇摆。

### 六条独立判断

**一、这一轮存储周期和历史任何一轮都不一样，因为需求方的退出成本被锁死了。** SK 海力士 LTA 客户从 10 家扩到 14 家，锁定 2027—2028 年 **50%+** 产能，CEO 说 2029 年已近乎售罄。过去存储周期的终结方式是"涨价刺激供给释放 → 需求方砍单 → 价格崩塌"，现在需求方已经被长协绑住了，砍单等于违约。🟥 所以我判断：**2027 年会出现"价格不涨但量也不跌"的僵持期**，而不是传统意义上的下行周期。估值会比价格先崩 —— 这正是摩根士丹利"看多价格、看淡估值"的含义。

**二、真正的风险不在存储，在手机渠道库存。** 苹果元器件库存从上一财年末 **21.2 亿美元**涨到 **76.5 亿美元**，传音存货从 **89 亿元**涨到 **189.4 亿元**。这是用库存对冲涨价，逻辑上没错，但它是**借来的时间**：如果 2027 需求不来，今天的缓冲垫就是明天的包袱，届时只能降价清库或者减产。🟥 我更担心的是国内小经销商 —— 一线厂商可以自己扛库存缓冲，压货压的是渠道的资金，底子最薄的那批"一旦任务量消化不了，资金链先断"。这是比出货量下滑更值得盯的领先指标。

**三、国产 AI 芯片的竞争已经进入"产能配额时代"，这是比价格战更难解的局。** 昇腾 50%、寒武纪 9%、海光 8%、平头哥 5% —— 这些份额数字背后是**中芯 N+2 的流片排期**。华为锁 43% 并签五年长约，后来者即便设计能力不俗也"无产线可排"。更麻烦的是中芯 N+2 良率约 **40%**（华为内部标准 60%），意味着 100 片晶圆只能用 40 片，产能数字要打对折。🟢 我认为华为用"超节点 + 全光互联 + 逻辑折叠"做架构补偿是正确的战略取舍 —— 10 万卡集群算力利用率提升 2.75 倍，这是拿系统复杂度换制程差距，在训练场景国产替代从"能不能用"跨到"能不能用好"的那一步。

**四、手机行业的洗牌本质是"贵的卖得更好，便宜的卖不动"，但这轮洗牌的受益者比看上去更脆弱。** 600 美元以上份额 +7.1pct、200 美元以下 -13.9pct，原因是存储占低端 BOM 65%+ 而高端只有个位数。华为凭"涨价幅度只有同行一半"拿下 21.1% 份额 —— 但 9 月 1 日它也加入了涨价行列，nova 16 在 10 月初又涨 200—400 元。🟥 我的判断是**华为的相对优势正在收窄**，Q4 份额数据会检验"涨价后华为"的真实竞争力。Counterpoint 提醒的另一件事更该记住：**28% 中国消费者表示会因更强 AI 功能换品牌，但 AI 功能大多还在技术验证到规模化商用的过渡期** —— 换机需求没有被 AI 激活，说明 AI 手机这轮叙事还没兑现。

**五、战略金属的定价权正在从"政策文本"移向"合约曲线"，这是比管制本身更重要的变化。** 10 月 19—20 日两天，芝商所宣布 2027 Q1 推出钨期货（全球第一条公开钨远期曲线），同期锑价跌穿 9 万元、钴价跌穿 24 万元 —— 一边造价格工具，一边给价格去泡沫。而铜创历史新高、InP 缺口 70%+、锗年内 +98.53%，靠的是 AI 真实物理需求。🟢 分化的判据很清楚：**AI 需求定价的品种（铜、铟、锗、钽）继续走强，管制溢价定价的品种（钨、钴、锑）在出清**。对 A 股材料公司的启示是，选对需求来源比选对赛道更重要。

**六、逆周期政策已经出手，但它的作用是"托底"不是"拉动"，不要误读力度。** 购房贷款贴息（首套 ≤120㎡、≤150 万元、贴息 1 个百分点、贷款上限 100 万元、贴息最长 5 年 → 100 万贷款累计减息近 5 万元）、PSL 利率降 25bp 并扩到算力网、科技创新再贷款支持比例提到 100%、"六张网"纳入口径 —— 工具箱用得很足。但社零只有 +1.1%、固投 -7.2%、民间投资 -10.4%、房地产开发投资 -20.6%，这些数字说明政策在**对冲下行而不是制造上行**。🟢 唯一真正亮眼的是二手房网签 **+10.7%**（一手 -13.2%）—— 存量置换在发生，但增量需求还没起来。所以我倾向于把"政策底"理解为风险的下限，而不是行情的起点。

### 风险提示

1. **存储周期拐点风险** —— 强周期属性，价格与盈利弹性大，波动剧烈。A 股存储概念股已深度回撤（江波龙较 7 月高点 **-68%**、兆易创新较年内高点 **-66%**），市场对"超级周期能持续多久"的分歧从未消失。
2. **AI 资本开支可持续性风险** —— 本轮一切（存储涨价、算力金属、国产 AI 芯片产能）都建立在 AI 基建投入之上。Anthropic 630 亿美元融资落地暂时缓解了担忧，但"单一交易并不能完全消除信用分层问题"，后续仍需更多融资案例验证回报路径。
3. **地缘与出口管制风险** —— 11 月 10 日、11 月 27 日两个节点；美方设备出口政策虽已从"推定拒绝"调整为"逐案审查"，但 2026 年 4 月有议员推动新法案拟彻底封死 DUV 和刻蚀设备。壁仞、摩尔线程等已被列入实体清单。
4. **终端需求二次下滑风险** —— Q2 全球手机 -6.7%、PC -4.9%，成本传导到终端价格后，需求端已经开始回落。IDC 明确提示厂商持续涨价可能造成渠道库存积压，2027 年预测有下行风险。
5. **国产化率短板风险** —— 半导体设备整体国产化率不到 **20%**、核心环节低于 **10%**、干泵国外占比超 **80%** 且认证周期 2—5 年。中芯毛利率 25.3% vs 台积电 50%+，差距的根源在设备而非经营。
6. **材料价格剧烈波动风险** —— 钨两周跌 **22.64%**、锑同比 **-45.47%**、钴跌破 24 万元，同时铜创历史新高、InP 涨 10%。剧烈波动对商品产业链整体不利，警惕"盲目跟风"式炒作。
7. **宏观数据持续疲弱风险** —— 社零 +1.1%、固投 -7.2%、民间投资 -10.4%、从业人员 PMI 48.4% 仍在收缩。政策在托底而非拉动，若 11 月 PMI 再度回落，"经济企稳"叙事需要修正。
