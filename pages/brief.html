## 📊 八大板块速读

### 一、宏观 PEST 板块

**🟢 流动性/财政：央行月中加码 + 集成电路税收红利**

央行今天发布 7 月金融数据 + 公告 8 月 14 日开展首次**月中隔夜逆回购**，操作量不超过 6000 亿元，17-19 日继续操作。这是一组关键信号：8 月 11-12 日 7 天期逆回购已连续"零操作"两天，月中突然加码隔夜投放，说明**月末/中跨月流动性缺口比市场预期更大**。同时 8 月 14 日有 10000 亿元 182 天期买断式逆回购到期，等量对冲压力不小。

7 月金融数据核心指标全部偏强：
- **M2 余额 355.51 万亿，同比 +7.7%**（高于名义 GDP）
- **社融存量 463.27 万亿，同比 +7.4%**
- **本外币贷款余额 286.07 万亿，同比 +5%**
- 7 月银行间同业拆借加权平均利率 1.40%，质押式回购 1.42%（环比 -1bp，同比 -5bp）

**🟢 财政端：四部委联合发布 2026 年第 23 号公告**，集成电路企业、工业母机企业在 2026-2028 年发生非货币性资产交换，确认所得可**5 年内分期均匀计入应纳税所得额**。这是继 2023 年研发费用加计扣除后的又一项精准减负——非货币性资产交换常见于行业并购整合、资产剥离、股权置换，5 年分期相当于给企业**递延了所得税现金流**。对北方华创、中微公司、华海清科、拓荆科技这些频繁做产业链整合的设备龙头是直接利好。

**🟢 政策面：国务院《扩大消费"十五五"规划》** 把住房定性为"大宗耐用消费品"——房子从金融资产回归消费品的政策表述正式落地。住建部 38 号文进一步明确"年度新增建设用地原则上不用于经营性房地产开发"。

**Mavis 点评**：今天金融数据 + 财政红包 + 货币投放三件套同时落地，宏观面的"政策底"已经非常清晰。M2 7.7% 创年内新高，但银行间利率却在下行，说明钱"宽在金融体系、没完全进入实体"——下半年关键看 7 天回购利率能不能守住 1.4% 这条线，以及企业贷款特别是中长期贷款的恢复速度。集成电路的 5 年分期政策是真金白银，对正在做整合的设备龙头是直接利好。

### 二、半导体-设备板块

**🟢 全球设备市场历史性扩容窗口**

SEMI 7 月 14 日报告将 2026 全球设备销售额调高至 **1659 亿美元，同比 +23.2%**，并首度给出 2028 年展望至 **2295 亿美元**。平安证券测算全球晶圆制造设备市场 2026 年 1439 亿美元，2028 年突破 2000 亿美元。

关键资金信号：
- **半导体设备 ETF 易方达（159558）连续 6 日净流入，合计 19.03 亿元**；近一月吸金超 37 亿元居同类第一
- 科创半导体 ETF 华夏（588170）近 3 日净流入 15.69 亿元
- 科创芯片设计 ETF 易方达（589030）连续 4 日净流入，8 月 14 日单日份额 +21.91%

**国内龙头业绩兑现**：
- **中微公司**：刻蚀设备龙头，盘中涨 2.0% 至 377.95 元，存储芯片扩产周期中刻蚀需求弹性最大
- **北方华创**：上半年受海外零部件交付紧张拖累，进入 Q3 后交付进入加速阶段
- **拓荆科技、华海清科、盛美上海**：薄膜沉积/清洗设备均受益本土配套加速

**机构判断**：海外设备交期较常态延长 50%-100%，部分机台排产已至 2027 年。叠加地缘政治因素，国产设备加速导入，本土设备厂商订单可见度持续提升。

**🟢 上游供应链受益**：富创精密、新莱应材、中船特气、华特气体、安集科技、鼎龙股份、晶瑞电材均直接受益于国产替代。

**Mavis 点评**：今天半导体设备的强势不是炒概念，是真金白银的资金行为——19 亿连续 6 日净流入是**机构级别的方向性加仓**。从 159558（设备 ETF）到 588170（科创半导体）到 589030（科创芯片设计），资金沿着"卖铲人 → 制造 → 设计"的链条逐级传导。这条主线的核心是：海外交期延长 + 国产替代加速 + 国内存储扩产明确，三重共振。但要警惕的是，7 月半导体板块已经历 -35.38% 的回调，估值在历史 5 年分位 85% 以上，追高要设好止损。

### 三、半导体-制造板块

**🟢 国内两大代工龙头 Q2 财报双双超预期**

| 指标 | 中芯国际 | 华虹宏力 |
|---|---|---|
| Q2 销售收入 | 30.06 亿美元 | 7.175 亿美元 |
| 同比 | +36.1% | +26.8% |
| 环比 | +20% | +8.6% |
| Q2 毛利率 | 25.3% | 16.5% |
| Q3 收入指引 | 环比 +2% 到 +4% | 7.7-7.8 亿美元 |
| 母公司应占利润 | 4.79 亿美元（+261.7%） | 3860 万美元（+385.9%） |

**核心解读**：
- 中芯国际 **Q2 营收首次破 30 亿美元**创历史新高，毛利率 25.3% 超指引（20-22%）
- 晶圆销售环比 +14.4%，ASP 环比 +5.7%——量价齐升
- 华虹宏力 Q2 收入 7.175 亿也超指引（6.9-7 亿）
- 但华虹 Q3 收入指引 7.7-7.8 亿美元**增速边际放缓**，今天盘中华虹宏力跌超 8%（港股跌 9%）

**🟢 行业整体景气**：
- 2026 Q2 全球半导体销售额 **4033 亿美元**，创季度新高，SIA 预计全年超 1.5 万亿美元
- 台积电全年资本开支上调至 **600-640 亿美元**，70-80% 用于先进工艺
- ASML Q2 净销售 93.3 亿欧元，毛利率 54%，全年指引上修至 430-450 亿欧元
- 全球 9 大 CSP 资本支出 **8867 亿美元**，年增率 90%

**🟢 成熟制程涨价延续**：八英寸产能利用率持续提升，相关代工价格 2026 年上半年平均上涨 **5%-15%**；十二英寸成熟制程从宽松转向局部紧平衡。

**Mavis 点评**：中芯和华虹的财报**双双超预期但华虹 Q3 指引偏弱**是今天盘面分化的根本原因——市场对"未来增速放缓"的预期已经提前定价。中芯的 30 亿美元是**国产代工的历史性时刻**，意味着国产制程在 7nm 及以下已经能稳定输出。但要警惕的是，**Q2 财报大日之后通常会有"利好兑现"的回调**，加上华虹今天的跌停式下跌，说明市场对代工板块的分歧在加大。先进制程（5nm/3nm）目前还是台积电独占，国产替代的下一城是中芯 N+2 的良率爬坡。

**Mavis 点评**：今天是国产设计板块的"封神时刻"——寒武纪利润 +122%、海光营收 +66%、长江存储冲进全球前三。这三条消息放在一起说明：**国产 AI 算力替代已经从"PPT 阶段"进入"利润释放阶段"**。但要注意，腾讯 4 万亿市值被国内存储巨头超越这个细节说明：市场正在把存储视为 AI 算力的下一个卡位环节，类似 2020-2022 年的"宁王"逻辑。

**Mavis 点评**：存储板块是**典型的"业绩兑现 → 股价杀跌"反向案例**。SK 海力士 7 月单月回撤 54%、三星 42%、美光 33%——业绩发布后股价反而大跌。原因很简单：**涨价斜率在放缓**。但闪迪今天给出的长协 + KV Cache 故事，把"涨速放缓"重新包装成了"周期被锁定"。我的判断是：存储板块**最猛烈的涨价期已经过去，但产能缺口会持续到 2027 年**。建议从"涨价弹性"转向"长协保障"——重点关注国内有长协订单的存储模组厂和上游设备厂，而不是纯粹的存储颗粒厂。

- **农业**：猪价"翘尾"的故事讲了两个月，但自繁自养还在亏 153 元/头。**真正的周期反转要等 2027 年**——今年下半年是磨底阶段。

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
