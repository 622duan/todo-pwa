## 三、八大板块速读（8 Sections）

### 1️⃣ 宏观 PEST · 中国 PMI 转正 + 三箭齐发

- **🟥 PMI 50.1% / 50.2% / 50.7%**：制造业、非制造业、综合 PMI 同步重回扩张区间，为连续 2 个月收缩后反转。
- **新订单 50.5%、新出口订单 50%、生产 51.7%**：生产指数 +1.3pct，企业生产节奏明显加快；消费品制造业新订单指数升至近 53%（双节备货驱动）。
- **🟥 价格端通胀压力**：购进价格指数 **60.8%**（+4.2pct），原油/天然气/煤炭全线上行——这是 PMI 的隐忧。
- **央行组合拳**（9/29 公布）：
  - 🟥 PSL 利率下调 **0.25pct**（1 年期 1.75% → **1.5%**）
  - 新增 5000 亿支农支小再贷款额度
  - 新增 2000 亿科技创新和技术改造再贷款额度
  - 扩大 PSL 支持领域
- **首套房贷贴息 10/1 落地**：年化 **1pct**、最长 5 年、单户最高 100 万、面积 ≤120㎡、总价 ≤150 万；六大行当日齐发公告"免申即享"。
- **外资看好**：路透称"AI 热潮推动中国制造业 9 月持续扩张"；WSJ 称"需求依然强劲"；美联社/埃菲社同步用"积极信号"作标题。
- **国庆休市安排**：10/1-10/7 休市，10/8 开市。

**Mavis 点评**：央行在长假前同时打出"PSL 降息 + 再贷款扩容 + 房贷贴息"三张牌——这是 2014 年以来最重的"组合拳"，目的明确：抢在国庆假期前稳定四季度的政策预期。9 月 PMI 转正给了政策底气，但购进价格指数飙到 60.8% 说明输入性通胀压力正在回流，PPI 四季度可能转正——这会挤压中游利润，**对股市是利好（流动性），对企业是分化（成本端受冲击）**。
