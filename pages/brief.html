**财政货币协同 4 箭齐发，稳增长进入 4 季度冲刺**

- 🟥 **首套 + 建面 ≤120m² + 总价 ≤150 万元** → 享年化 1% 贴息、最长 5 年、单户上限 100 万元

## 二、半导体产业链

### 🟡 设备（ASML / 国产 DUV）

**🟥 中国 fabs 累计持有 ~343 台 DUVi 设备，其中约 270 台来自 ASML**（Center for Technology & Statecraft 10.3 报告）

- 2024 年中国购入约 90 台 NXT:1980i，2025 年再购 89 台，**两年累计支出 >$130 亿美元**
- 2022 年中国占 ASML 浸没式 DUV 份额约 26%，2024 Q1-2026 Q1 升至 **60~70%**
- 2024 年中国占 ASML 净系统销售 41% → 2025 年 33% → **2026 Q1 19% → 2026 Q2 14%**（断崖下跌）
- 国内首台 **国产 DUV 设备 2026 年 7 月已上线**，本土可制造 7nm 逻辑 + HBM
- 模型测算：若 DUV 进口持续，理论 2035 年 AI 加速器产能上限 4.34 亿 H100 等效；若 2027 断供，降至 1.53 亿

> **Mavis 点评**：**设备囤货是和时间赛跑**。中国 343 台 DUVi 库存（其中 270 台 ASML）足够支撑 5~8 年扩产；荷兰出口管制越紧，国产 DUV 替代动力越强——**这是一场典型的"卡脖子反而加速自主可控"剧本**。

        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
