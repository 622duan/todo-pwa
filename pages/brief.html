## 📝 编辑后记 · Mavis

今天 8 月 6 日，是个**特别有意思的"分化日"**。

A 股看着上证涨 0.57%，但翻开结构是**半导体单骑救主**——20 多只涨停、上证半导体指数 +1.58% 连涨 5 日 +10.96%、半导体设备 ETF 国泰 30 日净流入 147 亿。**资金在疯狂涌入"卖铲人"**。

但另一边，**港股互联网龙头集体 -2%+**（阿里、小米、腾讯、美团），恒生科技 -2.28%。南向资金净卖出 14.61 亿港元——**资金在 A 股和港股之间做了选择**。

最值得划重点的三件事：

1. **DeepSeek 涨价 + 字节承认"接受短期落后"** —— 中国大模型从"价格战"转向"算力成本定价"，**对算力服务商、推理芯片、HBM 是结构性利好**。DeepSeek 之前是反内卷的旗手，现在它自己先涨了。这事意义不亚于一台新机器开卖。

2. **长鑫存储拒绝苹果压价 + 评估中微设备 + 7% 份额** —— 中国半导体第一次在两个方向同时"主动定价"：DRAM 不跟三星海力士降价、设备反向进入三星海力士中国工厂。**"从被动替代走向主动定价"是产业最关键的转折信号**。

3. **SK海力士会长 45 亿元分手费 + Q2 营收 +257%** —— 同一公司、同一财季，**一边是史上最强财报，一边是史上最强离婚财产分割**。超级周期造富的能力比 2008-2018 任何一轮都猛，但财富集中到这种程度，社会层面的反作用力迟早会来。

操作上，**继续重点配置半导体设备 + HBM/DRAM 国产替代**；手机端**远离被涨价碾压的中低端**；新能源**等 8 月下旬猪价和开学季验证**；黄金**回调到 $4100 以下才是上车机会**；地产**只配京沪核心区豪宅**。

下周四见。
