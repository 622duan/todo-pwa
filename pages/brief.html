## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**9·28 国常会"政策组合拳"四季度落地。** 李强总理 9 月 28 日主持国常会，提出"加紧加力推动各项政策落地落实"、"推出一批务实管用的增量政策"、"上下协同合力稳投资"。国庆前后一套"财政+货币+产业"组合拳密集落地：

- **财政部 5500 亿元债务结存限额下达**：一般债 3000 亿全部分配县区，专项债 2500 亿向经济大省倾斜，聚焦"六张网"建设。
- **央行 10·1 起购房贴息 1pct 启动 + PSL 利率下调 0.25pct**：科技创新和技术改造再贷款额度增至 **1.4 万亿元**，支农支小再贷款增加 5000 亿元。
- **国常会研究新污染物治理**：《事业单位登记管理条例(草案)》审议通过。
- **《关于发展新质生产力的意见》印发**（10·11）：19 项重点举措，部署量子科技、生物制造、氢能、脑机接口、具身智能、6G 等未来产业，全面实施"人工智能+"行动。([中国政府网](http://hezerf.heze.gov.cn/2c908088819842f701819a19cc180003/2109574397777080320.html), [华夏时报](https://www.chinatimes.net.cn/article/156171.html))

**稀土超硬材料反制升级。** 商务部 10·9 联合海关总署发布对**超硬材料、稀土设备和原辅料、钬等 5 种中重稀土、锂电池和人造石墨负极材料**实施出口管制，**11·8 正式实施**。这是继 4 月 7 类中重稀土之后的二次扩围，措辞罕见严厉："中方注意到中重稀土相关物项在军事领域有重要应用"。**最终用途为研发 14nm 及以下逻辑芯片 / 256 层及以上存储芯片 / 先进半导体设备的出口申请，逐案审批**——直接对标美方先进半导体管控。同日美方威胁加征 100% 关税，中方表态"不愿打、也不怕打"。([商务部](https://cacs.mofcom.gov.cn/article/gnwjmdt/gn/202510/185832.html))

**全国卫生与健康大会 10·12-13 召开。** 习近平出席并讲话，强调"扬优势、固基础、补短板、强弱项"。这是 2016 年后的最高规格卫生会议，"健康中国 2030" 进入收官前最后冲刺。

**Mavis 点评**：4 季度政策窗口期开得早、落得实。财政 5500 亿 + 央行 1.4 万亿再贷款 + 5500 亿债务结存 + 购房贴息——四件套齐发，但**关键在执行**，从"加紧加力"到"实物工作量"的链路能否在 Q4 跑通，决定 5% 增长目标能否守住。稀土反制"军民两用" + "14nm/256层"逐案审批，是中国出口管制从"被动应对"到"主动塑造"的关键一跃，对标美方 BIS 体系的制度对等性。

### 2.2 🟠 经济面 E

**国家发改委 10·11 公布三季度高频数据。** 三季度各项促消费政策持续扩围加力：

- 9 月线下消费支付金额同比 **+3.1%**（连续 3 个月上行）；
- 9 月主要港口货运船舶离港载重同比 **+53.2%**（较 8 月大幅加速）；
- 9 月全国新增专项债发行额同比 **+50.2%**；
- 9 月算力/数据/网络等新基建项目中标金额同比 **+50.4%**；
- 9 月人工智能、人形机器人前沿领域资本投资金额同比 **+198.7%**。([大同经开区](https://kfq.dt.gov.cn/dtjjjskfqz/zcjd/202610/f8cd303a40a145a587048ccd1a750fb9.shtml))

**国盛高频数据 10·5-10·11 跟踪。** 国盛基本面高频指数 132.9（前值 132.8），当周同比 +4.8 点。工业生产 131.0（持平），出口 158.1（继续上行），库存 175.0（继续补库），融资 272.7（继续上行）；地产销售 36.6 仍弱、基建 120.6 略降、消费 121.5 持平。([同花顺](https://news.10jqka.com.cn/20261013/c680611793.shtml))

**AI 板块带动金融数据。** 1-9 月人工智能/人形机器人投资 +184.1%（三季度），是 2026 年最强增长引擎。

**前 8 月固投 -7.2% 降幅扩大**，但 9 月新专项债 +50.2% + 8000 亿超长期特别国债 + 新型政策性金融工具 8000 亿（撬动约 10 万亿总投资），四季度有望企稳。

**Mavis 点评**：经济"分化中复苏"——**外需（港口 +53.2%、出口高频 +14.4 点）> 基建（-1.2 点走弱）> 地产（-5.7 点深跌）**。AI/具身/算力是唯一持续 +100%+ 的板块，Q4 增量政策传导到"实物工作量"的速度，是 5% 增长目标兑现的胜负手。

### 2.3 🟣 社会面 S

**楼市政策井喷但销售仍弱。** 中指研究院统计**今年以来各地出台超 880 条楼市政策**，其中公积金政策超 470 条居首。公积金贷款利率存在下调预期。([华尔街见闻](https://wallstreetcn.com/articles/3783569))

**卫生与健康大会 10·12-13 召开**，部署 15 年"健康中国"最后冲刺。

**前三季度服务贸易逆差缩小。** 1-8 月服务进出口 5.07 万亿元 +7.9%，逆差 1.07 万亿元同比缩小 1451.2 亿元；服务出口 +14.8% 显著强于进口 +3.8%。

**多家银行获窗口指导**金融投资增速不得高于贷款增速、新增债券久期不得高于存量久期——监管在控配债节奏。

**Mavis 点评**：社会面"温和修复"——政策密度在提（880+ 楼市、AI+ 卫健），但居民/企业体感仍弱（地产销售高频 -5.7、青年就业压力未实质缓解）。**关键观察点**：四季度"实物工作量"能否转化成就业和收入，形成正循环。

### 2.4 🔴 技术面 T

**🔴 长鑫 4F² DRAM 突破 + 韩国综合指数 -5.46%。** 10·13 长鑫存储总裁曹堪宇在公开场合披露，公司**预计 2026 年底推出采用 4F² 架构的新一代 DDR5 RDIMM 服务器内存产品**。主流 DRAM 仍用 6F² 架构，4F² 可缩小存储单元面积、提高存储密度。**消息直接冲击海外存储股**：10·14 韩国综合指数收跌 **5.46%** 报 6035.35 点，盘中一度跌超 7% 触发 Sidecar 暂停程序化卖盘（8 月 19 日以来首次）。SK 海力士 **-10.09%**、三星电子 **-7.39%**、铠侠 **-13%**。([华尔街见闻](https://wallstreetcn.com/articles/3783569))

**🟢 "求索"4.0 国标评测发布。** 10·13 由中国电子技术标准化研究院发布"求索"4.0 版本——**国内首个人工智能全产业链评测基准**，覆盖算力、模型算法、智能系统与产品、行业应用、安全治理。已配套电力、医疗、钢铁等真实业务负载；金融、电力、石油石化完成验证。([央视](https://www.toutiao.com/article/7696099531457085995))

**🟢 华为终端沟通会详解麒麟 9050。** 10·13 华为时隔 6 年再开芯片层面技术沟通会，麒麟 9050 系列已**累计发货过亿**。**核心创新"逻辑折叠"**：单芯片内部分层排布，TSV 垂直互联，信号路径缩短、时延降低，**NPU 功耗降 66%、GPU 降 58%、CPU 性能核心降 41%**。2027 麒麟测试进度符合预期。([上证报/华尔街见闻](https://wallstreetcn.com/articles/3783569))

**🟢 DeepSeek 1000 亿融资。** 拟融资金额从 500 亿元**翻倍至 1000 亿元**，投前估值 5000 亿；新进投资方包括石溪资本、中芯聚源、CPE 源峰、君联资本、吉利，**宁德时代加码 100 亿元**。完成后 DeepSeek 半年累计融资约 1500 亿元——今年中国一级市场最大融资。

**🟢 阿里 V900 提前 2 季度上市。** 中原证券报告：阿里新一代自研芯片 V900 原计划 2028 上市，**现提前到 2027Q1**。华为昇腾 960 同样计划提前。逻辑折叠加持下，麒麟 2026 性能核心 CPU 下降 41%。

**🟢 阶跃星辰智能体手机 STEPX Neo 预售。** 10·13 上海发布，**先行版 3999 元/台**，含 Step Studio 开发工具 + 12 个月 Token Plan 权益。10·16 首销。

**🟢 "求索"4.0 评测+ 国标"智能体应用安全基本要求"立项。** 强制性国标由中央网信办归口、中国移动牵头起草——智能体安全首次上升为具有法律约束力的"准入门槛"。

**Mavis 点评**：今天"技术"板块三个重磅炸弹——**长鑫 4F² 吓崩韩国存储股 + 华为"逻辑折叠"商业化兑现 + 阿里/华为芯片上市提前 2 季度**。这意味着：①中国存储首次在架构层（4F²）领先于国际主流（6F²），DRAM 价值链 50% 锁向 HBM 的格局被撕开口子；②华为"逻辑折叠"绕开 EUV 卡脖子，是"用设计创新榨取性能"的中国路径；③阿里 V900、昇腾 960 提前交付，国产算力供给曲线明显前移。**短期是情绪冲击（韩股 -5.5%），中期是产业格局重构（中国存储从"卷价格"到"卷架构"）**。

**国产存储利润碾压。** 长鑫 2026H1 营收 **1503.1 亿元**、净利 **776.05 亿元**（半年净利接近英伟达全年利润量级）；长存 Q1 营收 470 亿、净利 333.79 亿。**6 家上市国产 AI 芯片**（寒武纪/摩尔/沐曦/燧原/壁仞/天数）H1 合计营收 123.58 亿、**扣非后净利仅 3.61 亿**（5 家主业亏损）。

**Mavis 点评**：今天是**存储板块的"中国时刻"**——长鑫 4F² 第一次在 DRAM 架构层领先（4F² vs 主流 6F²），叠加 DDR5 16Gb 现货价同比 +480%，**韩国综合指数 -5.46% 是市场对"中国存储价值链位置重构"的最直接定价**。**HBM 仍是 AI 算力的"卖水人"（SK 海力士 FY27 75% 产能已锁），但 HBF 新增市场 400-1500 亿美元给了非 HBM 玩家（长鑫）弯道超车机会**。4F² 架构专利 300+ 件 = 中国存储从"卷价格"到"卷架构"的范式拐点。

## 4. 🏭 三、上下游产业链

### 4.1 原材料

**🟥 硫磺价格飙至冲突前 10 倍。** 霍尔木兹海峡两周 24 艘船遇袭（10·11 截止数据，单日 6 船遇袭；超过 3 月上旬 13 艘的前高点）。该海峡日均石油出口量从 9 月 1550 万桶降至 10·11 的 **290 万桶**。硫磺作为石油副产品，**价格从 100-200 美元/吨飙至近 1000 美元/吨**。硫磺下游：铜生产、磷肥（农业）。([华尔街见闻](https://wallstreetcn.com/articles/3783569))

**LME 金属：锡 -3.40%、锌 -1.08%、铜 -0.43%、铝 -0.59%**（10·14）。铜价 14555 美元/吨、铝 3034 美元/吨。

**稀土超硬材料反制落地。** 钬等 5 种中重稀土、锂电池、人造石墨负极材料 11·8 实施管制——直接卡下游"美方先进半导体 + 军工"两个去向。

**光伏硅料反内卷。** 通威、协鑫等 8 家多晶硅企业 10·11 杭州闭门会，约定硅料平均成本含税价 **不低于 4.3 万元/吨**，BC 组件不低于 0.86 元/W、TOPCon 不低于 0.79 元/W；建立同业举报与产能限制。棒状硅现价已探至 4.30 万元/吨，颗粒硅 4.03 万元仍需抬升。

**Mavis 点评**：原材料"两条战线"——**外部地缘（硫磺 10 倍 + 霍尔木兹 290 万桶/天）**推升输入性通胀，**内部反内卷（硅料 4.3 万 + 稀土超硬 11·8 落地）**稳定供给秩序。两条线交汇：化工/化肥/铜/铝下游成本压力大，硅料/电池组件价格有支撑。

## 6. ✏️ 五、编辑后记

### 总论：今天的 4 大主线

**主线 1：长鑫 4F² 吓崩全球存储股。** 韩国综合指数 **-5.46%**（盘中触发 Sidecar 暂停程序化卖盘），SK 海力士 **-10.09%**、三星 -7.39%。中国存储第一次在 DRAM **架构层**（4F² vs 主流 6F²）领先，长鑫 300+ 件专利、H1 净利 776 亿元、年底推 DDR5 RDIMM。叠加 TrendForce Q4 DRAM +10-15% / NAND +15-20% 涨价预测、海外 AI 资本开支增速可能 Q3 见顶（高盛观点）——**中国存储价值链位置从"卷价格"到"卷架构"的范式拐点**。

**主线 2：华为"逻辑折叠"商业化兑现 + 阿里/昇腾 960 提前交付。** 华为 10·13 终端沟通会披露麒麟 9050 累计发货过亿，"逻辑折叠"使 NPU 功耗降 66%、GPU 降 58%、CPU 降 41%；**阿里 V900 提前 2 季度到 2027Q1 上市**，昇腾 960 同样提前。中国用"架构创新绕开 EUV 卡脖子"的路子被验证。

**主线 3：国常会政策组合拳密集落地。** 财政部 5500 亿债务结存 + 央行 1.4 万亿科创再贷款 + 购房贴息 1pct + 出口退税调整。9 月高频数据**外需强（港口 +53.2%）、新基建强（+50.4%）、AI 投资强（+198.7%）**，但地产销售仍弱（高频 -5.7）、固投降幅扩大（-7.2% 前 8 月）。Q4 增量政策能否传导到"实物工作量"是 5% 增长目标兑现关键。

**主线 4：稀土超硬材料反制 11·8 实施 + 智能体安全强制性国标立项。** 商务部 10·9 出口管制公告措辞罕见严厉，**14nm/256层先进半导体 / 军事用途逐案审批**——直接对标美方 BIS 体系；同款反制清单覆盖超硬材料、钬等 5 种中重稀土、锂电池、人造石墨负极。智能体安全全球首部强制性国标（中央网信办归口、中国移动牵头）。

### Mavis 独立判断（6 条）

1. **长鑫 4F² 突破 = 韩国存储 30 年价值的"中国时刻"**。4F² 架构在存储密度上代差（4F² vs 6F²），叠加长鑫 H1 营业利润率 82%（三星 28%/海力士 51%/美光 35%），**DDR5 16Gb 现货价同比 +480%** — 三大 DRAM 巨头被 HBM 锁产能，**长鑫在"非 HBM 主流市场"撕开大口子**。**这是 2017 年存储周期以来的最大产业格局变化**。

2. **AI 资本开支增速可能 Q3 2026 见顶**（高盛观点）。支撑：①股价与实际盈利背离出现；②信贷市场对 AI 借款方重新定价（高盛、摩根大通**拒绝承销 11% 高息 AI 芯片贷**）；③贝莱德/高盛/花旗等开始看多短期美债、下调美股。**风险信号亮两盏**——AI 基建产业链 Q4-2027H1 可能进入"消化期"。

3. **晶圆代工"中芯放缓、华虹加速"——AI 需求从先进制程/存储溢出到成熟制程和特色工艺**。华虹 102.8% 超负荷+独立 NVM +149% 受益最直接；中芯 12 英寸 78.2%、ASP 上行、毛利率 25.3% 已充分释放。**花旗升目标价至 100/175 港元，超历史 P/B 2 个标准差**——市场在为"AI 溢出持续性"定价。

4. **国产 6 家上市 AI 芯片 H1 扣非净利 3.61 亿** = 5 家主业亏损（沐曦/天数靠盛合晶微配售浮盈 8.87+7.6 亿美化报表）。**寒武纪独占 50% 营收**。叠加**壁仞 3 月两度配售 40 亿港元 + 7 月 70 亿 = 不到一年累计股权融资 175 亿**，**摩尔 80 亿 IPO 募资**——市场化梯队仍"烧钱换市场"。华为昇腾/阿里平头哥/海光等"国家队"未单独披露，无法准确评估全行业。但**这意味着"国产替代"叙事进入下半场：从"芯片可用"到"规模可用+主业造血"**。

5. **稀土超硬材料反制是"对等制度博弈"**。美方管制清单 3000+ 项 vs 中方 900+ 项；美方最低含量 0% 规则；这次中方"14nm/256 层/军事用途"逐案审批 = **对标美方 BIS 制度对等性**。但**需注意：管制不等于禁止**，商务部明确"对符合规定的申请予以许可"——这是"主动塑造"而非"全面封锁"。

6. **消费电子涨价潮将传导到 2027 H1**。TrendForce 称 2027 PC DRAM 供给占比将进一步下降；笔记本/台式机厂商可能调整标配配置、接受更高元件成本、或转嫁整机价格。**iPhone 17 系列 H1 出货 +9.4% / 中国 +30% / 高端份额 65%** = 苹果的"高溢价 + AI 智能体"双重护城河。**国产机需要找到"高端+AI"的双锚**。
