## 📊 板块 3：宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面：房贷贴息 + 现房销售 + 央行工具箱 三弹齐发

**🟥 房贷贴息 10.1 落地**（财政部、央行、金融监管总局 财金〔2026〕95 号）

中央财政首次对商业性个人住房贷款进行贴息，是住房领域保障和改善民生方式的新探索。三大要点：

- **范围**：首套住房（含新房+二手房），建筑面积≤120㎡、总价≤150 万元
- **力度**：年化 1 个百分点贴息、贴息期限最长 5 年、单户贷款上限 100 万元
- **节奏**：政策实施期暂定 1 年，资金总规模不设上限、预算已做充分安排

**测算**：100 万 30 年期贷款，按目前首套房商贷利率约 3% 计，5 年累计贴息 ~5 万元——相当于利率打 8.3 折。

**🟥 现房销售改革北上广齐发**（9.24/9.28/9.30 三城一日一城）

8.28 住建部 + 自然资源部 + 金融监管总局《关于完善商品住房销售制度的通知》后，**北、上、广**三个一线城市相继落地实施细则：

| 城市 | 现房销售备案门槛 | 定金上限 | 预售封顶 |
|------|------------------|----------|----------|
| 北京（9.24） | 完成"大产权证"（最严） | 总房价 1% | 须主体结构封顶 + 5 方验收 |
| 上海（9.28） | 完成"大产权证" | 总房价 3% | 主体结构封顶 |
| 广州（9.30） | 竣工 + 水电气配套验收（最宽松） | 总房价 5% | 主体结构封顶 |

**核心变化**：① 单体建筑**封顶才能拿预售**，房企不能再"卖图纸"；② 购房按揭贷款**竣工备案后才能发放**（北京最严），购房者月供起点推迟；④ 北上广定金的资金监管比例从"5% 全额监管"上抬，**烂尾风险大幅压降**。

**🟥 央行 9.29 调整四大货币政策工具**

国务院总理李强 9.28 主持国常会、央行 9.29 跟进：

| 工具 | 调整 | 意义 |
|------|------|------|
| **抵押补充贷款（PSL）利率** | **-25bp 至 1.5%** | 定向支持"六张网"（水网/电网/算力网/通信网/地下管网/物流网） |
| 科技创新和技术改造再贷款 | **+2000 亿**，支持比例 60%→**100%** | 设备更新+技术改造满血 |
| 支农支小再贷款 | **+5000 亿** | 其中**民营企业再贷款 +3000 亿** |
| "六张网"纳入 PSL 适用范围 | 新增领域 | 算力/通信/物流首次入 PSL |

**📌 Mavis 点评**：这三个政策同日落地，**构成了 Q4 政策的"金三角"**：

- **需求侧（贴息）**：直接降低刚需购房成本 1pct/5 年
- **供给侧（现房销售）**：从根上修复烂尾预期
- **货币侧（PSL+再贷款）**：给"六张网" + 设备更新 + 民营企业三个定向输血

这是 9.28 国常会"加大宏观政策逆周期调节力度"的具体落地。从 2024 年的"517 新政"到 2026 年的"购房贴息"，决策层对地产的思路已经从"救房企"切到"救购房者"——这是质的转变。

### 4.1 设计：英伟达 + AMD + 中国 AI 芯片

**英伟达 H200 重启对华出货**（9.30 美方正式批准）

- 美国商务部工业与安全局（BIS）批准英伟达向**"批准客户"**出售 H200（以及次级别 H20）
- **条件**：美国本土供应稳定 + 客户验证程序 + 不作军事用途 + **25% 销售费上缴美国政府**
- 报道：中国科技公司已下单 **200 万片 H200** 用于 2026，但英伟达目前仅 70 万片在手库存
- 定价：每片 H200 ~**2.7 万美元**
- TrendForce 调查：中国企业未来一年 AI 加速器采购预算中，**国产芯片占比从 ~30% 升至 46%**
- 伯恩斯坦更预测：英伟达在华 AI 芯片份额从 2025 年 ~40% **暴跌至 2026 年约 8%**，华为份额将突破 50%
- 中国政府计划未来五年投入 **2 万亿元**建设数据中心，**要求至少 80% 核心芯片国产**

**AMD MI325X**同步获批，市场份额与英伟达合计 < 10%。

**📌 Mavis 点评**：H200 重启对华是**特朗普的"政治算法"**：

- **英伟达赚**：每片 25% 销售费上缴美国政府 = 美国"对华芯片税"
- **中国亏**：本来能买 8%，但怕被卡脖子所以继续扶持国产

### 8.4 编辑后记：3 个不那么显然的信号

**信号 1：美光 FY26Q4 营收 542 亿$，**单季占全年 41%** ——这是 AI 超级周期的"Q4 拐点"，不是 Q4。

美光 FY26 全年营收 1331 亿$，**Q4 单季 542 亿$ 占 41%**——这种"Q4 单季占全年 40%+"是 AI 超级周期里第一次出现的"季度跃迁"。意味着：

- **真正的兑现点在 Q3-Q4**，不是均匀分布在全年
- 美光 FY27Q1 指引 615 亿$（环比 +13.4%）——**继续高位向上**
- 但三星 + SK 已经"卖现实"——6 个交易日外资净卖出 496 亿人民币 + 韩元短期走强 11%
- **真正的可验证判断**：Q4 业绩兑现后（10.14 ASML + 10.15 台积电 + 10.21 Lam + 10.30-31 中芯/华虹），**目标价 vs 共识差距会快速收敛**——三星高盛目标价 49 万韩元（确信买入）vs 共识股价 vs KOSPI 6838 的位置就是验证锚。

**信号 2：财政部 10.1 起购房贷款贴息 1pct/5 年 + 北上广深现房销售细则齐发——这是 Q4 政策的"金三角"，但只救**150 万以下首套**。

      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
