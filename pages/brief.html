## 三、宏观 PEST

### 1. 政策（Political）

- **《关于发展新质生产力的意见》正式发布**（10/9，新华社）：中共中央、国务院 5 方面 19 项举措，**首次提出"严禁借发展新质生产力之名搞恶性招商引资、盲目'跟风'上项目、乱'烧钱'"**；明确"创新主导、改革为要、因地制宜、先立后破"4 原则；目标 2027 年率先实现 AI 与 6 大重点领域广泛深度融合，新一代智能终端/智能体应用普及率超 70%。**Mavis 点评**：这是"十五五"开局年最重磅的纲领性文件，把"反泡沫化"明文化——意在纠偏前几年"一哄而上"搞 AI 算力中心、机器人产业园的乱象。**真正利好的是"全面实施 AI+行动"和"算力网首次列入六张网"**——直接给国产 AI 芯片 + 算力基建吃了定心丸，但同时把"国家级技术问题清单"上明显凑数的项目筛掉。
- **房贷贴息 10/1 正式落地**（财政部+央行+金融监管总局）：首套 120㎡/150 万上限，1 个百分点贴息、最长 5 年。**Mavis 点评**：这是**中央财政首次**对商业性房贷贴息，信号意义 > 实际让利——意在扭转"房价跌→观望"的负反馈。
- **财政部 10/9 安排 5500 亿元地方政府债务结存限额**（vs 去年 5000 亿）：3000 亿一般债全额下沉县区保"三保"、2500 亿专项债聚焦"六张网"（水网、新型电网、**算力网**、新一代通信网、城市地下管网、物流网）。
- **证监会大修公募基金运作管理办法**（12 年首次）：权益类基金成立门槛由 2 亿元降至 **5000 万元**；违法罚款上限由 3 万抬至 10 万（涉金融安全 20 万）。
- **保代新规**：禁止"只签不保"、**禁止以 AI 替代专业判断**——监管对投行质量的回归。
- **工信部《"人工智能+软件"专项行动实施方案》**（10/9）：到 2030 年关键软件全面实现智能化升级。
- **央行 10/8 开展 1.2 万亿元买断式逆回购操作**——净投放中期流动性，总量政策保持宽松基调。

## 四、半导体产业链

### 1. 设备

- **ASML 韩国 EUV/DUV 零件 2027/1 起统涨 10%**——韩媒口径"实属罕见"，三星、SK 海力士已全盘接受。2025 年 ASML 售后/零件业务 81.93 亿欧元（占总营收 25%），公司预计今年 +30%；美银将 ASML 2028 收入预测上调 8.7% 至 **765.7 亿欧元**。
- **应用材料、东京电子、Advanced Energy 紧随涨价**——**全球设备供应商议价权**集体抬升。
- **SEMI 2026 Q3 全球设备出货 432 亿美元**，同比 +26%、环比 +12%——连续 3 季度历史新高。**中国大陆采购 138 亿美元，占全球 32%**，继续坐稳最大设备市场。2026 全年全球设备销售额预计 **1659 亿美元**（同比 +23.2%），2028 年达 2295 亿美元。
- **大基金三期 3440 亿元首单落地**——华虹无锡三期 41.7 亿美元增资（月产能 5.5 万片 12 英寸特色工艺），约 **70% 资金定向投向设备与关键材料**，**成熟制程国产设备采购目标锁定 50% 以上**。年底前有望看到设备招标下单。
- **国内 12 英寸晶圆厂四季度集中招标**（中芯京城/中芯东方/中芯深圳 8-10 万片、华虹九厂 6-8 万片、长鑫 5-8 万片、长江存储 3-5 万片）——招标规模超 120 亿元，国产设备中标金额占比预计超 60%。
- **中微公司高深宽比刻蚀机进入三星西安 NAND 产线**（累计装机 >15 台），国产刻蚀首次实现海外存储大厂量产导入。
- **上海微电子 28nm 浸没式 DUV 全工艺复现验证完成**（曝光良率 99.5%），关键零部件国产化率 70%，**2027 年正式客户批量交付**——成熟制程光刻设备国产化破冰。
- **国内首台 300mm 混合键合设备**完成长电科技全流程验证，对准精度 ±0.5μm、堆叠良率 99.2%，长电将批量采购。
- **氟化液需求爆棚**：2026 年我国氟化液总产能将破 8 万吨/年，2026 需求超 4.5 万吨，市场规模 50-54 亿元（同比 +20-29%）；半导体温控+数据中心液冷双轮驱动；2025-2030 复合增速约 18%。
- **行业人才缺口达 18 万人**（设备分会数据），刻蚀/薄膜/量测研发工程师占 50%。

**Mavis 点评**：本周是设备国产化的"**三浪叠加**"——大基金三期注资落地 + 海外涨价倒逼国产替代加速 + 国产设备海外大厂导入。**设备股 Q4 业绩兑现的确定性，比 4 月那一波更强**。关注受益最直接的 **北方华创（多品类平台型龙头）+ 中微公司（刻蚀制程全突破）+ 拓荆（薄膜沉积）+ 长川/华峰测控（测试）**。

## 八、编辑后记

**Mavis 点评**：

今天这份日报信息量是近一个月最大的一期——11/11 全红、5 数字全是关键拐点信号。几条主线看得很清楚：

1. **存储超级周期进入"消费电子买单"阶段**。三星利润 +782% 是高潮，但苹果砍单 20% / 三星减产手机 20-30% / 国产机集体涨价 1000 元 / PC 出货 -20%，是这轮周期的**回旋镖**。接下来 1-2 个季度，关注 HBM 供需缺口是否被 SK 海力士 + 长鑫的产能补上，以及消费电子的需求弹性是否被价格"卡死"。**这轮周期的回旋镖会在 2027 H2 集中爆发**——届时存储原厂利润率从 +80% 跌到 +20%，设备订单延迟，机构从"超级周期"叙事切换到"供过于求"。在那之前，2026 Q4 存储三巨头依然是确定性最高的主线。

2. **国产替代的"三浪叠加"已经到 Q4 兑现窗口**：①大基金三期 3440 亿元首单落地华虹，②SEMI Q3 全球设备 432 亿美金（大陆占 32%），③中微刻蚀机进入三星西安产线 + 28nm 浸没式 DUV 全工艺验证 + 混合键合 99.2% 良率。设备股 Q4 业绩兑现的确定性，比 4 月那一波更强。**重点关注：北方华创 + 中微公司 + 拓荆 + 长川 + 华峰测控**。

3. **华为"系统级突围"被低估了**。昇腾 960 提前 3 季度上市 + HIONE 光引擎替代 4.8 万个光模块为 5500 个，单卡算力追平 H200 而**超节点能效指数级提升**——这是"**用系统补单卡**"的逻辑闭环，对标英伟达 NVL72 的 72 卡单节点，华为已经做到 4096 卡。**DeepSeek DeepGEMM-Ascend 99.8% 利用率说明软件栈已经不是最大瓶颈**——CANN + DTK + MindSpore 三套生态已具备承担 1.5 万亿参数大模型训练的能力。**真正应该重估的是 950/960 系列的集群总吞吐**——昇腾 + DeepSeek 是 2026-2027 中国 AI 算力的"国家队长组合"。

4. **铜和黄金走出"两条独立逻辑"**：铜是"AI+电网+新能源"的实物短缺（数据中心 2028 年用铜 130 万吨），黄金是"去美元化+央行背书"的金融再平衡（央行黄金储备占比 <10% vs 全球均值 15%）。摩根士丹利说 12 个月 5000 美元、4000 是底部；铜精矿加工费跌入负值，矿冶撕裂比金铜分歧还大。**大宗的叙事不靠美联储，靠实物**。**Q4 最大风险是霍尔木兹海峡封锁**——伊朗的 7000 公里海岸线 vs 全球 30% 原油海运量，这是个"非对称博弈"，G7 释储+美军打击预期+伊朗封锁消息会反复拉锯。

5. **地产是"政策猛药"vs"基本面"赛跑**。国庆新房同比 +30% 是政策直接效果，但 1-8 月土地出让金 -28.6%、M1-M2 剪刀差仅 2pct，**政策对冲的是资产负债表衰退，不是周期自然复苏**。这次 5,500 亿地方债结存 + 房贷贴息 + 现房销售 + 以旧换新四件套，相当于把过去三年没打出去的子弹一次打完，Q4 数据大概率好看，但**真正决定 2027 的是居民收入预期**。

6. **机器人赛道开始"分层成熟"**。智元 2 万台 + 宇树灵巧手 3.99 万 + UBTech 目标 1500 台/月 + 银河通用 7 亿订单，**春晚上场 → 国庆景区练兵 → 工厂落地**的路径越来越清晰。但 C 端零售 <5% 是硬数据，意味着估值要按"工业 B 端设备公司"重估，不是按"消费电子"。**机器人是下一个"被低估的工业品"——不是消费品**。

7. **新质生产力《意见》是 Q4 政策定调**。"严禁借发展新质生产力之名搞恶性招商引资"这话说得很重——意味着 2024-2025 年的"百城千亿算力中心"扩张会刹车，**资源向"AI+ 制造业 + 能源革命"集中**。受益的是已经跑出来的华为昇腾、海光、寒武纪、长鑫、长存，**踩雷的是蹭概念、靠地方政府输血、空喊口号的伪新质生产力项目**。
