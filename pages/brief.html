> **Mavis 点评**：存储这条线今天出现了一个**新变化**——不是价格，而是**议价权的方向变了**。原厂（三星/海力士/美光）**暂停报价**了，现货价继续涨（DDR4 8Gb +36%），但 NAND 现货在跌（买家观望）。同时 A 股存储板块内部开始分裂：**跌的是主控、模组这些中间环节，扛住的是原厂**。原因很直白——中间环节成本上去了却未必提得了价。
> 所以昨天那波"存储杀跌"不是景气反转，是**红利在链条上重新分配**。看 A 股存储，正确姿势是分清楚"原厂"和"中间商"。另外 NAND 现货连续走弱是个警示信号：**消费级存储的边际买家已经撑不住了**。

| 荣耀 WIN RT2 / Turbo2 | **12070mAh** | — | 不做轻薄妥协，影像压缩（RT2 仅 2 亿主摄、90W） |

| 一加 Ace7 系列 | — | — | 骁龙 8E5V / 8E5、2 亿主摄、185Hz、双路出风主动散热 |

**技术底座**：硅碳负极成熟——石墨理论克容量 372mAh/g vs 硅 **>4000mAh/g**；28% 硅含量是当前可大规模量产的实用上限；欣旺达称量产体积能量密度约 **850Wh/L**、预研约 **930Wh/L**。

**Mavis 点评**：手机这条线的逻辑链条非常完整——**AI 抢走存储产能 → 存储涨价 → BOM 重排 → 存储超过 SoC 成为最贵元器件 → 厂商没法再"堆内存"当卖点 → 转向电池（零理解成本）**。REDMI 官方自己都说了：**95% 的用户全天用电量不超过 9083mAh**。所以 10000mAh 卖的不是精准匹配需求的电量，是**"电量自由"的安全感**。
> 我的判断：电池是这轮硬件内卷里**最后一块红利**，2027 年之前会持续。但它比内存更快到头——机身空间是刚性的，12070mAh 之后就得牺牲厚度、重量或影像。2026 年是"参数竞赛"转向"取舍竞赛"的第一年，K100 就是最好的样本：**2999 的钱是从老款 SoC、没有长焦、44W 快充、单摄里抠出来的**。所谓"满分旗舰"是营销修辞，真实定位是"给游戏玩家和续航焦虑者定制的特长生"。

## 板块 10：✍️ 编辑后记

**今天的三个真信号**

**第一，钱在往上走，价格在往上走，但"需求"没跟上。**
SK 海力士营业利润同比 +632%、三星 +783%，存储原厂直接暂停报价、现货 DDR4 8Gb 单周再涨 36%；同时手机出货 -15%、NAND 现货转跌、二手车维修量 +30%。这不是"AI 泡沫"的证据，这是**算力基础设施把消费电子的物料预算吃掉了**。2027 年中后期新产能落地前，这个分配格局不会变。真正的风险不在需求，在**高盛把 2027 DRAM 缺口从 -2.5% 下修到 -5.9%**——缺口越被上修，越说明长约锁产能锁得越死，一旦 AI 资本开支放缓，2027 会出现"合约价还在、现货先崩"的错配（10/22 的 NAND 现货走弱已经是预演）。

**第二，货币政策在做一件"技术含量很高但市场还没定价"的事。**
潘功胜研究把公开市场主力品种切到隔夜，加上 DR001 与 LPR 并行的贷款定价基准改革。这套东西的意义是：**信号更纯、传导更快、政策利率锚更清晰**。它同时给了一个新的观察锚——以后看流动性，不要只看 7 天逆回购，要看 DR001 围绕政策利率的偏离度。10/28 隔夜 Shibor 1.2810%、DR001 稳在政策利率附近运行，说明框架切换是平稳的。**但有一条被低估的暗线**：这次改革同时降低了"降息"的信号价值，改革本身不是宽松，别把框架调整读成政策转向。

**第三,A 股今天完成了一次教科书级的"科技内部换血"。**
机器人早盘高潮 → 午后 69 股炸板；半导体从超跌坑里接盘，主力净流入 6.891 亿全场第一。**这不是行情结束，是筹码在板块内部搬家**。三个证据：① 量能从 1.46 万亿放大到 **1.63 万亿**，三连缩量后首次放量，这是反弹的根基；② 封板率只有 51%，说明情绪过热但还没崩；③ 连板晋级率降到 25%、连板梯队只剩 8 只，**接力生态其实没修复**——反弹靠的是首板和超跌权重，不是高度。所以明天看两件事就够：**宇树科技 10/29 的首份三季报**（它今天 57.5 亿成交、28% 换手，全场多空都在等这份财报定价），和**成交额能不能守住 1.6 万亿**（缩回 1.5 万亿下方就是一日游）。
