## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**「十五五」规划建议全文发布（10 月 28 日）** —— 这是今天最重要的政策事件。

中共中央 10 月 28 日公布《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》，全文约 **2 万字、15 个部分、61 条**，为 2026—2030 年发展擘画路线图。文件由二十届四中全会于 10 月 23 日通过，七大主要目标依次为：高质量发展取得显著成效、科技自立自强水平大幅提高、进一步全面深化改革取得新突破、社会文明程度明显提升、人民生活品质不断提高、美丽中国建设取得新重大进展、国家安全屏障更加巩固。

[来源：央视网 / 中国新闻网](https://m.chinanews.com/wap/detail/chs/zw/0929295hewpevsdf.shtml)

其中与科技产业直接相关的部署：

| 部署 | 关键表述 | 产业含义 |
|------|---------|---------|
| 关键核心技术攻关 | 「采取**超常规措施**，全链条推动集成电路、工业母机、高端仪器、基础软件、先进材料、生物制造取得决定性突破」 | 集成电路首次与工业母机并列，定位为「决定性突破」级别 |
| 未来产业布局 | 推动量子科技、生物制造、氢能和核聚变能、脑机接口、具身智慧、**第六代移动通信**成为新的经济增长点 | 6G 首次写入五年规划建议 |
| 人工智能 | 「全面实施『人工智能+』行动」「抢占人工智能产业应用制高点」 | AI 从试点转向全面实施 |
| 消费 | 「**清理汽车、住房等消费不合理限制性措施**」「落实带薪错峰休假」「加大直达消费者的普惠政策力度」 | 18 个新提法之一，直接指向汽车和住房 |
| 教育 | 「稳步扩大免费教育范围，探索延长义务教育年限」 | 财政与教育投入前置信号 |
| 财政 | 深化零基预算改革、加快构建与高质量发展相适应的政府债务管理长效机制 | 地方债约束硬化 |

**Mavis 点评**：这是给未来五年定调的纲领性文件，也是给二级市场定价的锚。三条最值得盯：①「超常规措施」用在集成电路上，是把国产替代从市场化行为升级为战略任务；②「清理汽车、住房等消费不合理限制性措施」首次明确写入五年规划建议，比一般性促消费表态更硬；③淡化具体增速目标、强调「韧性」，意味着宏观政策会更相机决策，波动性上升。

**国务院常务会议（10 月 23 日）** —— 李强主持，两大议题：统筹人口与经济社会发展、推进全国服务业大会部署落实。

会议明确「加快建设生育友好型社会，持续完善婚嫁、生育、养育、教育等政策，优化面向家庭的财税、社保、住房等支持举措，努力稳定新出生人口规模」；服务业方面要求「加力推进服务业扩能提质」「加快破解服务业发展的难点堵点」「聚焦生产生活重点领域因业施策，加强融资、用地、人才、数据等支持」。

[来源：人民网 / 新华社](https://politics.people.com.cn/n1/2026/1024/c1024-40820605.html)

**Mavis 点评**：10 月 23 日国常会同时抓人口和服务业，是两个被长期低估的慢变量。人口政策从「刺激生育」转向「财税社保住房综合支持」，意味着成本从单点补贴转向全周期；服务业则是今年唯一贡献率超 66% 的板块，政策力度加码指向「融资、用地、人才、数据」四类要素供给，落地速度值得跟踪。

**「十五五」服务业与就业专项部署（10 月 10 日）** —— 人社部副部长李忠在国新办发布会给出完整框架：就业实施「**2 个计划**」（青年就业支持、灵活就业和新就业形态就业质量提升）、「**5 项行动**」（含「适应人工智能发展促就业行动」）；健全「**4 个方面制度机制**」，其中新就业形态劳动者权益保障办法已公开征求意见。

[来源：国新办 / 工人日报](https://www.workercn.cn/papers/grrb/2026/10/11/1/news-2.html)

**Mavis 点评**：「适应人工智能发展促就业行动」是新提法，说明决策层已经把 AI 对就业的冲击当作需要主动管理的变量，而不是等它自然发生。配合 AI 产业 1.2 万亿规模，这条线值得单独跟踪。

**其他政策动态**：
- 10 月 16 日国常会原则通过《价格法（修正草案）》，明确「依法依规治理低价无序竞争，健全行业成本调查、制止低价倾销等配套规则」「持续规范平台经济领域价格竞争行为」—— 这条是「反内卷」从行业倡议走向法律层面的关键一步。
- 10 月 20 日商务部就欧盟可能将中欧混合动力汽车贸易谅解安排延伸至化工等领域回应：「如欧方对中国产品采取歧视性限制措施，中方必将采取一切必要措施」，同时透露中欧贸易投资磋商机制第二次例会已取得积极进展。
- 10 月 20 日国家数据集团有限公司在河北雄安新区成立，定位为推进数据资源开发利用、释放数据要素价值、服务 AI 发展。

### 2.2 🟠 经济面 E

**前三季度经济数据（10 月 19 日国家统计局）** —— GDP **107.1 万亿元**，同比 **+4.6%**。

[来源：国家统计局](https://www.stats.gov.cn/zwfwck/sjfb/202610/t20261019_1965618.html)

| 指标 | 前三季度 / 9 月 | 同比 | 备注 |
|------|----------------|------|------|
| GDP | 1071071 亿元 | **+4.6%** | Q1 5.0% / Q2 4.3% / Q3 **4.5%** |
| 规上工业增加值 | — | +5.3% | 9 月 +5.5%，比 8 月加快 0.3pct |
| 制造业增加值占 GDP | **25.7%** | +0.6pct | 实体经济根基巩固 |
| 社会消费品零售总额 | 370001 亿元 | **+1.1%** | 9 月 +1.1%，比 8 月加快 0.7pct |
| 社会消费商品和服务零售总额 | — | **+2.6%** | 服务零售 +5.0%，商品零售 +1.0% |
| 固定资产投资 | 334115 亿元 | **-7.2%** | 扣除房地产后 -4.2% |
| 房地产开发投资 | 53364 亿元 | **-20.6%** | 新房销售面积 -13.2% |
| 民间投资 | — | **-10.4%** | 扣除房地产后 -6.7% |
| 进出口总额 | 399399 亿元 | **+18.8%** | 9 月 +27.5% |
| 出口 | 231979 亿元 | +16.4% | 机电产品占比 **64.3%** |
| 进口 | 167420 亿元 | **+22.3%** | 每季度增速保持 20%+ |
| CPI | — | **+0.9%** | 核心 CPI +1.1% |
| PPI | — | **+2.3%** | 9 月 +5.0%，涨幅扩大 1.2pct |
| 城镇调查失业率 | 均值 5.2% | 持平 | 9 月 5.2%，环比 -0.1pct |
| 规上工业利润（1—8 月） | 52720 亿元 | **+15.7%** | 利润增速行业数比去年全年 +6 个 |

**结构亮点**：
- 新动能贡献率 **40% 以上**；高技术制造业增加值 **+14.3%**，快于全部规上工业 9.0pct
- 集成电路制造行业增加值 **+79.2%**，航天器及运载火箭 +36.2%，光电子器件 +28.4%
- 前三季度增量 **5.7 万亿元**，近五年最大规模
- 三季度末人民币兑美元较年初升值 **4.3%**；外汇储备连续 6 个月稳定在 3.4 万亿美元以上
- 单位 GDP 能耗同比 **-3.1%**，规上工业单位增加值能耗 -4.3%
- 新能源汽车国内零售渗透率连续 **6 个月超过 60%**；1—8 月新能源乘用车全球占比超六成
- 1—8 月规上服务业企业营业收入 +6.0%
- 9 月规上工业企业利润：二手/高端制造订单外溢持续

**Mavis 点评**：4.6% 的 GDP 在全球主要经济体里领先，但结构撕裂明显 —— 工业 +5.3% 对固投 -7.2%，制造强、投资弱。真正值得注意的是 **进口 +22.3%**：进口是内需最诚实的温度计，每季度 20%+ 增速说明内需在改善；同时 **PPI +2.3% 而 CPI 仅 +0.9%**，上下游价格传导断层仍在，上游涨价（有色 +9.4%、加工 +3.4%）压在中下游利润上。房地产开发投资 -20.6% 是最大的拖累项，但统计局三次强调「不看投资看成交」—— 二手房网签 +10.7%、待售面积 -1.5%，去库存确实在推进。

**货币政策**：
- 央行 10 月 31 日（昨日）开展 **3276 亿元** 7 天期逆回购操作，中标利率 **1.50%**，与此前持平
- 央行已明确**银行间债券市场债券发行管理规则**（征求意见稿），禁止发行人认购或变相认购自己发行的债券，禁止低评级主体发行高等级债券 —— 规范债市一级发行秩序
- 财政部 10 月安排使用地方政府债务结存限额 **5500 亿元**，用于提高县区一般公共预算保障能力和支持地方扩大有效投资
- 9 月 28 日国常会部署的降低抵押补充贷款利率、增加再贷款额度、居民购房贷款贴息、金融支持服务业发展等增量政策，国家发改委 10 月 20 日表示正在抓好实施，「根据需要及时出台新的增量政策」

**Mavis 点评**：央行利率没动 + 财政部结存限额 5500 亿 + 发改委喊话「及时出台增量政策」，三件事连起来读，政策意图是「存量加速落地 + 增量留后手」，不是马上放大水。7 天逆回购利率已经是被明确为「货币政策调控的目标利率」，这个信号比降准本身更重要。

**10 月 PMI（10 月 31 日发布，数据时点未到）** —— 今日暂缺。已知线索：9 月制造业 PMI **50.1%**（较 8 月 +0.3pct，重返扩张区间），非制造业商务活动指数 50.2%，综合 PMI 产出指数 50.8%。9 月生产指数 52.0%，新订单指数 50.0%，生产经营活动预期指数 54.0%（近 4 个月高点），主要原材料购进价格指数 53.4%（+8.3pct）、出厂价格指数 49.9%（+5.9pct）。

**Mavis 点评**：10 月 PMI 明天（10 月 31 日）才出，今天只能给 9 月的底色。9 月出厂价格指数 49.9% 仍在收缩区间、而购进价格 53.4% 已在扩张 —— 这就是「上游涨价、中游被压」的量化证据。中秋国庆双节 + 手机新品集中发布（9 月通讯器材类零售额 **+30%**）会给 10 月消费分项带来支撑，但手机出货 -22% 的出货口径和 +30% 的零售口径存在矛盾，说明渠道库存正在被动去化。

## 6. ✏️ 五、编辑后记

### 今天的四条主线

**第一条：「十五五」规划建议落地，政策锚从「短期稳增长」切到「五年定方向」。** 10 月 28 日公布的 2 万字文件里有三条最硬：集成电路与工业母机并列写入「采取超常规措施…取得决定性突破」；「清理汽车、住房等消费不合理限制性措施」首次明确写入五年规划建议；6G、量子科技、脑机接口、具身智能被列为新的经济增长点。这不再是年度经济工作部署，是十年期的资源配置说明书。

**第二条：存储涨价从「周期反弹」升级为「AI 算力的结构性挤出」，手机成为第一个被击穿的消费终端。** Q3 全球手机出货 **-22%**（史上最大单季跌幅），中国 -15.4% 创 14 年同期最低。原因是 HBM 每比特占用晶圆约为普通 DRAM 的 3 倍，原厂扩产和消费级供给收缩同时发生。DDR4-8Gb 同比 **+860%** 已超过 DDR5 的 +480%，说明缺货穿透新旧两代平台。

**第三条：国产替代的主战场已经明确，且速度超预期。** 全球 **77%** 新增 12 英寸产能落地中国，设备国产化率从 25% 冲到 **35%**，长鑫 G5 平台量产 + LPDDR6 全球首发 + 4F² 架构年底推 DDR5，长江存储 NAND 份额破 10%。但技术天花板同样明确：14nm 及以下先进制程产能占比仅 **1.7%**，卡在 EUV。

**第四条：AI 叙事进入「被要求交作业」的阶段。** Alphabet 单日 -13% 蒸发 **4790 亿美元**市值，亚马逊自由现金流连续两季为负，英特尔盘后暴跌超 20%。A 股这边创业板指 10 月 29 日跌 **4.45%**、超 4700 股下跌，天孚通信 -19.77%。而四大行 A+H 总市值历史首次突破 **10 万亿元**。钱在从「讲故事」流向「有利润」。

### Mavis 的六条独立判断

**1. 手机行业真正的拐点不是「销量何时回升」，而是「千元机何时消失」。** 1500 元以下机型的存储成本占比已从 18% 飙到 **51%** —— 这意味着这个价位段的机型在数学上就无法盈利。当 200 美元以下价位段的产品项目被系统性砍掉，行业的竞争维度就从「规模」永久切换到「ASP 和品牌力」。IDC 说的复苏在 2028—2029 年，我倾向于认为**结构变化会比总量变化更早落地**。

**2. 长鑫「拒绝苹果报价」这件事的意义，比它本身更重要。** 我要强调：这件事**没有公开确认**，具体原因无官方说明，我不把它当事实写。但即便如此，它揭示的产业状态是真实的 —— 当一个 DRAM 厂商有能力「挑客户」，说明产能已经稀缺到需要按产业优先级配置。这是国产存储从「争取验证机会」变成「参与主流平台竞争」的分水岭。真正的验证是 LPDDR6 进入玄戒 03 —— 通过旗舰移动平台工程验证，比拒单一纸更有价值。

**3. 长协（LTA）正在改写存储行业的周期属性，这是本轮最被低估的变量。** 主要存储厂商用 3—5 年期长协锁产能，部分设价格下限。这会系统性压低现货波动率，把行业估值框架从「周期股」推向「特许经营型资产」。但反过来说：**当供给最终释放时，价格的下行弹性也会被协议锁死**。市场如何给存储的「周期 vs 成长」定权重，将直接决定估值中枢 —— 这是当前定价里最具争议、也最值得跟踪的单一变量。

**4. Agentic AI 让 CPU 第一次拿到了真正的时代窗口，不只是「补位」。** 智能体的工作负载从计算密集转向控制密集、分支密集、IO 密集，CPU:GPU 比例从 1:4~1:8 往 **1:1** 走。苏姿丰把 2030 年服务器 CPU 市场规模从 1200 亿上调到 2200 亿美元。在国产语境下，这意味着国产 CPU 第一次有了「不是替补但也不是看空 AI」的独立叙事。

**5. 11 月 10 日和 11 月 27 日是本月最大的政策定时器，而且多数人读错了。** 11 月 10 日**不是禁运日，是暂停期到期日**。9 月 28 日商务部说吉隆坡安排延到 2027 年 1 月 10 日，但**没有点名 70 号和 72 号公告**，截至 10 月 27 日两份公告均未修订，**法律文本日期仍然读作 11 月 10 日和 11 月 27 日**。日本已经把钇库存的焦虑捅到了《金融时报》和美国政府 —— 这意味着如果真的到期不续，政治压力会推动续期。但别把「政治解读」当成「法律事实」。

**6. 算力金属的定价权正在从「配额文本」转向「合约曲线」，而这个转向对中国是双向的。** 芝商所 2027 Q1 推钨期货（第一条公开钨远期曲线）+ 锑价跌穿 9 万、钴价跌穿 24 万 —— 同时在「造工具」和「去泡沫」。中国手里有 85% 的稀土精炼份额、98% 的原产镓、77% 的精炼锗碲，但**当价格由伦敦/纽约的指数和期货曲线定义时，量的优势就要通过价的折让来兑现**。同时期货化也给了国内产业一个对冲工具 —— 这是把「管制溢价」变成「金融工具」的入场券。

### 风险提示

1. **存储周期拐点风险**：4Q26 传统 DRAM 与 NAND 涨幅已在收敛（+10%—15% / +15%—20%，较 3Q26 收窄）。若 2027 年海外大厂扩产节奏超预期或 AI 资本开支增速放缓，供需边际方向可能逆转。
2. **AI 资本开支回调风险**：Alphabet 搜索变现率承压、亚马逊自由现金流连续为负、微软重返高评级债市融资至少 250 亿美元 —— 若 AI 投资回报证伪，存储和算力链会同时被击穿。Gundlach 已警示 AI 信贷出现「2006 年式信号」。
3. **终端需求持续走弱风险**：手机 Q3 已 -22%，机构普遍预计 2027 年大部分时间仍明显下滑。千元机品类可能实质性退出，行业 ASP 上行掩盖不了总量崩塌。
4. **地缘政策风险**：MATCH 法案若落地，中芯国际、长江存储先进设备获取受限；日本 8 月生效的 20 大类物项管制已从设备延伸至材料和先进封装。
5. **出口管制节点风险**：11 月 10 日 / 11 月 27 日若未如期续期，稀土一揽子许可制回归（对军用和受控用户推定拒绝），镓锗锑对美禁令重启，海外溢价可能进一步扩大并冲击国内下游成本。
6. **地缘冲突风险**：胡塞武装袭击沙特石油设施后布伦特原油在收盘后转涨；美军中东最高指挥官赴白宫汇报对伊军事选项，不排除中期选举后动手。油价是本轮 PPI 输入性通胀的直接推手。
7. **高位回调风险**：铜期货 11.22 万元、钽铟历史高位；申万银行指数单日 +1.97% 而创业板指 -4.45% 的极端分化，历史上是高波动前兆。
8. **数据口径风险**：本报告多机构数据并存（IDC -22% / Counterpoint -20% / Omdia -20%），口径差异必然存在；「库存不足 10 天」为券商测算而非财报口径；长鑫拒接苹果报价未获官方确认 —— 引用时请回到原始报告。
