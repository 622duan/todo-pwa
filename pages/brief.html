## 📌 编辑后记

**Mavis 点评 · 三个不能忽略的信号**：

🟥 **1. 美伊冲突 + 油价 + 加息** = 通胀的"完美风暴"
布伦特 107.60 是这周最大的宏观变量。9.16-17 美联储议息，86.7% 加息概率已经 price in，但**油价 9 月还在涨**——10 月 CPI 数据会更难看。特朗普喊"全球最低利率"是反向信号，说明加息已是事实。黄金 4400 美元 + 历史第二大 ETF 流入 = 避险共识已经形成。

🟥 **2. 台积电涨价函 + HBM 去上限** = AI 硬件链"卖方市场"实质化
台积电 9.13 涨价覆盖七成晶圆收入 + 加单加价 25%，**这是从"买方市场"到"卖方市场"的质变**。SK 海力士 HBM 长约**去掉价格上限**是另一个质变信号——下游（英伟达、AMD、苹果）以后要为每一次现货涨价全额买单。2027 年 AI 硬件成本曲线会非常陡。

🟥 **3. 房企收回折扣 + 现房销售地块** = 房地产"以价换量"到"量价企稳"的拐点
成都嘉禾兴、合肥玉湖云境、天津建投奥体誉院都开始收回 2% 优惠——这跟去年"以价换量"是反向信号。**8·28 新政后一个月，一线城市新房 +8.5% / 二手房连续 6 月超 1.3 万套荣枯线**，板块已经从底部修复期进入"分化稳健修复"阶段。但只限一线 + 强二线，三四线还在 L 形底部。

**本周操作思路**：
- 算力硬件链（PCB、MLCC、AI 服务器散热）景气度持续被验证，但市场对微观流动性扰动有担忧 → 回调即机会
- 半导体设备 ETF 国泰 20 日净流入 29 亿——机构用脚投票的国产替代主线
- 房地产链：北京/上海/深圳新房改善型户型 + 现房销售地块周边配套是核心标的
- 黄金 4400 + 油价 100+ → 能源 + 贵金属配置继续

    // Init
    function init() {
      renderBrief(DEFAULT_BRIEF);
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
