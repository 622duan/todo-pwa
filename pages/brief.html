## 🌍 一、宏观 PEST（Macro Lens）

### 1.1 中国宏观：宽货币紧信用，政策待发力

**核心数据（8/14 央行发布）**：
- M2 余额 355.51 万亿元，同比 +7.7%（前值 +8.0%，回落 0.3pp）
- M1 余额 115.46 万亿元，同比 +4.0%（持平前值）
- M0 同比 +11.6%
- 社融存量 463.27 万亿元，同比 +7.4%
- 人民币贷款余额 282.29 万亿元，同比 +5.1%（前值 +5.5%）
- 前 7 月社融增量累计 22.25 万亿元，比上年同期少 1.74 万亿元
- 7 月 CPI 同比低于预期，PPI 同比结束持续改善高位回落
- 财新：广东进口连续 5 月 +30%+，芯片涨价放大进口增量
- 7 月快递发展指数 424.2（YoY +2.4%），日均业务量 5.5 亿件
- 西部陆海新通道 1-7 月进出口 6036.3 亿元（YoY +10.9%），首破 6000 亿
- 上半年航空货邮 +6.0%，国际航线 +13.9%

**央行操作（8/14）**：开展 1 万亿元 6 个月期买断式逆回购操作（固定数量、利率招标、多重价位中标），保持银行体系流动性充裕。

**Mavis 点评**：信贷塌方是 7 月最大隐忧——M2 跌、贷款增量少、但社融存量增速仍高于名义 GDP，这是一份"宽货币紧信用"的答卷。8/14 的 1 万亿买断式逆回购相当于二次降准但更精准。政治局 7/30 已经定调"宏观政策要发力提效、及时谋划出台务实管用的增量政策、加大逆周期调节力度"，叠加 8/14 流动性投放，9 月降准或降息窗口正在打开。

**7 月 CPI 全面符合预期（8/12 公布）**：
- CPI 同比 +3.4%（预期 +3.4%，前值 +3.5%）— 3 月以来最低
- 核心 CPI 同比 +2.5%（前值 +2.6%），创 2021 年 3 月以来最慢涨速

## 🔬 二、半导体产业链（The Big Three）

### 2.1 设备：应用材料创纪录但股价跌，订单看到 2030

- 非 GAAP 毛利率 50.4%

- **2026 全年封装业务营收增幅上调至 +70%**（此前 +50%）
- **客户订单沟通已延伸至 2030 年**

**泛林集团（Lam Research）**：8/14 宣布未来 5 年投资 30 亿美元扩展全球研发实验室网络，实验容量提升 50%+

**Mavis 点评**：应用材料这份"成绩单"被自家股价盘后跌 5% 打了脸——年内已翻倍的估值让市场开始"看增长不达预期就杀"。但订单延伸到 2030 年这条信息比 Q3 财报更重要，意味着 AI 资本开支的能见度已经从 2027 拉到 2030，**半导体设备是"卖铲人"里业绩确定性最强的赛道**。国内设备厂商在 HBM 扩产周期里加速国产替代，2026 是国产化率突破 20% 向 35% 跃迁的关键年。

- "100% 退出中国高端 AI 算力市场"
- B200、B300、GB 系列、Rubin 全部禁售
- 2026 FY Q1 数据中心营收 752 亿美元（YoY +92%），但中国占比大幅下滑
- H20 国内 9-12 万/卡、B30（5-6 万/卡，2025Q4 出货）合规可买
- H200 国内"技术性放行"但截至年中无实质成交
- RTX PRO 6000 工作站版（96GB）国内京东在售 ¥6-15 万

**国产 GPU 全面补位**：
- 华为昇腾 910C/910D：8 卡服务器 ¥110-120 万，性能对标 H100 60-80%
- 寒武纪思元、海光深算、摩尔线程：单卡 ¥3-5 万，主打中小模型推理
- 腾讯云：年底前可用 GPU 算力储备将达"非常充足"
- 昆仑芯 P800（百度系）：FP16 算力 345 TFLOPS（是 H20 的 2.3 倍），3.2 万卡规模部署，万卡集群有效训练时长 >99.5%

**苹果折叠屏冲击**：Counterpoint 预测 2027 折叠屏格局将从"三星+华为两强"演变为"苹果+三星+华为三足鼎立"，三星份额将从 40% 跌至 32%

**Mavis 点评**：黄仁勋自承 100% 退出中国，是 AI 芯片史上最大的"市场让位"事件。**H20 和 B30 撑不起英伟达在华品牌，B30 的 GDDR7 显存（低带宽）和 H20 的 1/6 算力让国产卡在企业级推理市场获得了真实空间**。P800 单卡算力 2.3× H20 不是 PPT 参数——百度 32 台服务器就能跑 DeepSeek-V3/R1 671B 满血版，而 H20 需要 64 台。但国产卡最大的瓶颈仍是 CUDA 生态——开发者迁移成本和 MindSpore/CANN 的成熟度决定 2027-2028 是国产替代的真正决赛窗口。

### 2.4 存储芯片：涨价见顶的"最后一公里"

**历史级业绩（2026 Q2）**：
- 三星：营业利润 YoY +1814%，半导体部门贡献 99% 利润
- SK 海力士：营业利润 YoY +5 倍+
- 美光：Q3 营收 414.6 亿美元，YoY +345.7%
- 铠侠：Q1 营收 YoY +415.5%，净利润 YoY +45 倍+

- 5 大存储厂 26Q2 自由现金流合计 14.8 万亿日元，YoY +92 倍

**价格走势（关键拐点）**：
- DDR4 现货 7 月 24 美元/颗，创 2016 年有数据以来最高
- TrendForce 预测 Q3 DRAM 合约价 +13-18%（Q2 是 +58-63%），NAND +10-15%（Q2 是 +70-75%）
- 伯恩斯坦：Q3 DRAM 涨幅 17%，仅 Q2 涨幅的 1/4
- HBM 产能缺口 50-60%
- 苹果 A20 Pro 处理器因 DRAM 短缺价值 ~$10 亿晶圆堆在台积电无法封装

**SK 海力士扩产**：投资 384 亿美元在韩国本土扩产，龙仁二厂 35.2 万亿韩元（249 亿美元），生产 HBM 和下一代 DRAM

**摩根大通测算**：需新增 30 万片/月 DRAM 晶圆 + 4.5 万片/月 NAND 晶圆投片产能，2028 年前才能供需平衡

**机构观点分裂**：
- 高盛：绝对价格仍将上涨至 2027 年中
- 摩根士丹利：Q4 进入周期后期阶段
- 瑞银：DRAM 供需紧张至少持续至 2028 H1
- 历史铁律：暴涨之后必有暴跌，跌幅普遍 70-90%

**Mavis 点评**：Q2 财报和 Q3 涨幅"剪刀差"是周期见顶的标准信号——SK 海力士 7 月单月回撤 54%、三星回撤 42%、美光回撤 33%，但 Q2 业绩都创历史新高。**这就是周期股的残忍之处：业绩和股价可以背道而驰 3-6 个月**。三星和 SK 海力士宣布提高分红比例（美光承诺 100% FCF 股东回报）本质上是用现金回报为高估值兜底，但 50% 的比例被市场认为"远不够"。**消费端已经抵制：OPPO 7 月下旬拒收三星 Q3 报价，PC 经销商反馈"5 天涨价 300 元"**。操作上：HBM 仍是 2027 年最紧缺产品，但消费级 DRAM/NAND 应该在 Q4 出现拐点。

**① 半导体设备的"卖铲人确定性"**：应用材料订单延伸到 2030 年，比 Q3 财报本身更值得关注。AI 资本开支从 2027 拉到 2030 的能见度，意味着 HBM 紧缺至少持续到 2027 H1、CoWoS 紧缺到 2027 H2、先进封装紧缺到 2028——**这是国产设备龙头（北方华创/中微）业绩确定性的最强护城河**。机构在做"高低切换"：加仓低估值订单充足的设备龙头，分批减持高估值存储和光算力小票。

        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
