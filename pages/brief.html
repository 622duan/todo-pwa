## 十、编辑后记

**Mavis 点评 · 给你的 5 个判断**：

1. **9/11 CPI 是全球资产定价的"生死线"**：核心环比 >0.22% → 9 月加息（CME 概率 60%→80%），金价 / 港股 / A 股承压；<0.184% → 9 月按兵不动，Q4 重新降息预期升温，美股/成长股反弹。**这是 Q3 最重要的单一事件**。

2. **半导体"算力 + 存储 + 设备"三主线持续到年底**，但结构在切换：
   - **算力**：从 NV 一家独大到"NV 旧款（Hopper）+ AMD + 国产 ASIC"三足；
   - **存储**：从涨价驱动到"涨价见顶 + 国产替代接力"；
   - **设备**：从成熟制程扩产到"键合/TSV/3D"新增量，国产受益韬定律。

3. **华为韬定律是中国半导体的"换道超车"信号**，不是 PPT。短期看 9/23 Mate 90 发布会验证（市场对 5G 回归 + 麒麟 2026 实测的接受度）；中期看 EDA/刻蚀/键合/测试链条的订单兑现度。如果你是产业链投资者，**这是 H2 必看主线**。

4. **地缘风险溢价是"新常态"**：霍尔木兹 + 俄乌 + 委内瑞拉三线同时紧绷，油价在 $85-95 区间高位震荡。WTI 上 $100 的概率不低（10%），WTI 跌回 $80 的概率更低。**对航空/航运/化工/塑料是负面，对油气/煤炭/黄金是结构性利好**。

5. **A 股 H2 节奏**：9 月震荡分化、10 月政策窗口（政治局会议+四中全会）、11 月特朗普关税大棒 + 美联储降息预期重启、12 月机构调仓。**Q4 才是真正的主升浪，9 月是播种期**。建议关注：算力（光模块/存储/PCB）、铜铝、猪、银行红利。

- 美联储 9 月加息超预期 → 全球资产重新定价
- 霍尔木兹完全封锁 → WTI 冲击 $100+

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
