## 📊 板块 3：宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面：六张网 + 8000 亿政策性金融工具 + 8·28 房贷新政

**8000 亿政策性金融工具开闸**（经济日报 9.2 + 上海证券报 9.4）：8 月 28 日发改委联合财政部召开"全国投资工作推进会议"后，9 月 1 日农发行浙江省分行投放全国首笔 3 亿元（支持建德抽水蓄能电站），9 月 2 日国开行四川分行 2.45 亿元（支持中创新航动力电池自贡基地）。粤开证券罗志恒：本轮 8000 亿有望撬动 **10 万亿元量级**项目总投资。福建发改委 9.4 投放 5 亿元，带动投资 56 亿元（杠杆 11.2×）。

**六张网 + "十五五" 109 项重大工程**（经济日报 9.2 权威解读）：发改委 9.2 召开"六张网"重大项目协调推进机制第 **7 次会议**（8 月中旬以来），2026 年六张网（**水网、新型电网、算力网、新一代通信网、城市地下管网、物流网**）相关重点领域投资规模 **超 7 万亿元**。"十五五" 期间累计预计 **25 万亿元**。资金来源：财政托底+政策性金融赋能+国企市场化+民间投资增量。

**8·28 房地产新政"组合拳"**（克而瑞 9.16 详解）：
- **销售端**：现房销售+期房主体结构封顶监管+购房人首付款+个贷资金全额纳入监管
- **信贷端**：个人住房贷款期限 **30→40 年**+延后发放时点（预售严格竣工备案后发放）
- **融资端**：证监会支持上市房企再融资、并购重组、发行 ABS+REITs 高质量发展
- **首付**：上海下调外环外二套商贷首付 **至不低于 15%**+2 亿元"以旧换新"补贴+房票安置

**📌 Mavis 点评**：政策"组合拳"已从"投什么"切到"谁来投"。**6 张网是供给侧（政府主导），8·28 房贷是需求侧（激活购房）**，8000 亿工具是"政府投带动民间跟"。三者合力形成 Q4 稳投资的"立体支撑"。但 1-7 月全国固定资产投资同比 **-6.7%**，民间投资 **-9.4%**——稳投资的拐点还没真正出现，要看 8·28 新政从"文件"切到"成交"的传导效率。

### 3.2 货币与流动性：LPR 钉在历史低位，降息窗口未开

- **9.20 LPR 报价（预计）**：1Y 维持 3.00%，5Y 维持 3.50%，**连续 15 个月不变**。央行数据显示 2026 Q2 商业银行净息差降至 **1.41%**（历史最低，逼近国际公认 1.8% 安全线），银行报价空间极小
- **7 天逆回购**：1.40%（2025.5 起锁定），是 LPR 定价锚，锚不动 LPR 难动
- **实际房贷利率松动**：深圳部分银行首套 **3.05%**（LPR-45bp），武汉/成都/郑州下调加点 10-15bp——银行在"以价换量"
- **存量房贷新政**（8.28）：央行+金管局允许存量房贷客户在利率偏离达一定幅度时主动协商变更合同或申请贷款置换，9.1 起银行每月公布"全国新发放房贷利率均值"
- **8 月社融数据**（9.14 已发布）：M2 同比 +8.6%，新增人民币贷款 9000 亿，社融存量 +8.2%（较 7 月微升）

**📌 Mavis 点评**：LPR 不动 ≠ 买房成本不动。100 万房贷 30 年等额本息，从 3.5% 降到 3.3%，月供少 138 元/年省 1656 元——银行通过"补息+贴息+消费券"间接让利。Q4 真正的看点是"9.1 起每月公布的全国新发放房贷利率均值"——这是央行给购房者的"议价尺子"，会触发一波存量房贷协商潮。

- **制造业 PMI 49.8%**（环比 +0.6pct，仍低于临界点）
- **新订单 50.6%**（环比 **+2.1pct**，回扩张区间）

**70 城房价**（克而瑞 9.16）：
- 新房环比 **-0.17%**（49 城跌/15 涨/6 持平），一线由持平转 **+0.1%**（上海 +0.4%、深圳 +0.2%）

**📌 Mavis 点评**：8 月 PMI 是"政策托底 + 外需修复"的组合拳——新订单指数单月跳升 2.1pct，是 2025 年以来最大单月改善。但"产成品库存 -0.4pct+在手订单持平"说明企业还在去库存，**不是主动补库**。**Q4 真正的看点**：① 9.20 公积金条例大修落地后，2 亿灵活就业缴存是否激活；② 10 月初中美高层经贸磋商结果；③ 二十届四中全会（10.16）"十五五"规划纲要正式发布。
