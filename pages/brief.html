### 2.1 🟢 政策面 P

**🟥【本周最重磅】10 月 26 日至 29 日：二十届五中全会召开**

五中全会审议"十五五"规划建议，是未来五年产业政策的总纲。市场普遍预期新质生产力、算力网、半导体自主可控将继续加码。

三条必须逐字读的表述：
1. **"加快构建全国一体化算力网，推动算力、电力、网络协同发展"** —— 算力从"项目制"升级为"国家级网络"，意味着未来五年招标主体、电价机制、跨区域调度都有制度安排。
2. **"研制高性能人工智能芯片和高可用基础软件栈"** —— 芯片第一次被放在"研制"而非"应用"的位置。
3. **"做精做细芯片成熟制程，提高先进制程制造能力"** —— 官方首提"成熟制程做精做细"，这与中芯国际"不盲目追赶"的战略完全对齐。

配套：9/29 央行 PSL 利率下调 **0.25pct**，支农支小再贷款额度上调 **5000 亿**（民企再贷款 +3000 亿，科技创新技改再贷款 +2000 亿，"报销"比例 60%→**100%**）；财政部会同央行、金融监管总局首次出台**首套刚需购房贷款贴息政策**。9 月企业新发放贷款加权平均利率略低于 **3%**。

**Mavis 点评**：🟡 经济面是"**总量平庸、结构极端**"的教科书案例。4.6% 的增速低于预期，但把它拆开看：**信息软件服务业 +10.4%、租赁商务服务业 +12.3%** 两块合计拉动 GDP 1.1pct，接近全国增速的一半；而**建筑业 -4.1%、房地产 -0.2%** 还在拖后腿。LPR 连续 17 个月不动，本质原因是**央行换了工具**——不再用降息，而是用 PSL 降息+再贷款扩容+购房贴息做结构性宽松，同时把 LPR 的"唯一锚"地位拆成"LPR+DR 双锚"。我对这个判断是：**社会综合融资成本仍会往下走，只是不会体现在 LPR 报价上**，后续观察重点应从 LPR 转向 DR001 低位的持续性。

**Mavis 点评**：🔴 存储是今天的**核心矛盾**。三个必须分开看的层次：
1. **价格还在涨，但斜率在塌**——Q1 涨 93%、Q2 涨 80%、Q3 涨 40%、Q4 只涨 15%。**长鑫 Q3 净利环比只增 1%-3.9%（Q1 曾环比 +246%）、江波龙 Q3 环比直接下滑 36%-49%**，这两家公司的公告已经明说"存储价格上涨对盈利的**边际贡献显著趋缓**"、"从消费类价格周期转向 AI 驱动技术周期"。**涨价作为利润放大器的作用正在进入递减区间**。
2. **结构分化已经出现**——企业级 SSD +23%~28%，但移动端 LPDDR5X 只有个位数，NAND 现货甚至在跌。**"存储超级周期"其实是"AI 服务器存储超级周期"**，手机存储是被误伤的池鱼。
3. **长期看紧不看好**——高盛把 2027 缺口下修到 -5.9%、黄仁勋说 2029 年前不会过剩、三星 2028 年前无显著新增供应、摩根大通看到 2028 年还有 15% 缺口。

我的结论：**周期没反转，但股价和业绩都在给"斜率"定价**。10/28 SK 海力士 Q3 财报是最近的定价锚——机构预期营业利润接近 **77 万亿韩元**、利润率超 70%。若它不超预期，存储板块今年涨幅这么大，回撤会很快。

1. **国产化已经进入"市场驱动"阶段**——海光信息自己在三季报里说的这句话是本期最有分量的表述。**当国产替代不再需要政策补贴来买单时，这条链的现金流才是真的**。半导体 19 家公司扣非净利 +83.47% 高于营收 +22.71%，说明**盈利弹性来自产品结构升级和产能释放后的规模效应，不只是收入扩张**。
2. **利润高度集中在一个环节**——22 家披露三季报/预告的公司合计归母净利约 1660 亿元，**长鑫一家占约八成**；加上江波龙、澜起，存储三chain贡献近九成利润。**这不是"半导体行业高景气"，这是"存储单极景气"**。如果长鑫的环比增速继续收敛，整个板块的业绩叙事会同步降温。
3. **设备零部件是下一个接力棒**——海外零部件对国内设备厂"软断供"（交期 1-2 年），正在把国产零部件从"验证通过"推向"批量采购"。ASML 说 2029-2030 年都排满了，**这意味着设备订单的能见度是三年以上，而不是一两个季度**。

### 4.3 制造 / 封测

- **华虹**：Q2 稼动率 **102.8%** 超满载；FAB9B 获 **25.36 亿元**专项投资；Q1 归母净利同比 **+513%**

- **长电科技**：🟢 2026 资本开支上调至 **173.1 亿元**；江阴高端先进封装扩产、上海新高端先进封装项目推进；XDFOI 平台具备 PIC + EIC 异构集成能力，光引擎与交换/计算芯片共封装；**韩国**厂导入高端先进封装项目、**新加坡**转向高价值应用（数据中心）；玻璃基板与面板级封装推进至中试线建设

- **封测厂订单排期普遍到 2027 年**，先进封装（CoWoS 类）产能同为 AI 芯片瓶颈环节

**Mavis 点评**：🟢 制造封测的关键词是"**满载**"。中芯 93.7%、华虹 102.8%（超满载）、长电资本开支从 99.8 亿直接翻到 173.1 亿——**产能是这轮最硬的约束**。中芯赵海军那句"不盲目追赶，先把成熟制程做到全球第一"，在"做精做细芯片成熟制程"被写进国家规划之后，从"认怂"变成了"**路线图**"。但要清醒：先进制程仍差 3-4 代，国产替代的真实现金牛在成熟制程和特色工艺，不在 2nm。

## 6. ✏️ 五、编辑后记

今天的信息量足以写三份日报，但真正的线索只有四条，我把它们串起来：

**第一条主线是"AI 虹吸"**。存储同比涨 480%、服务器 RDIMM 涨 455%、智能算力规模同比 +146%、高技术制造业 +14.3%、数字产品制造业 +13.6%、集成电路出口 +99.1%（9 月 +136%）——所有这些都是"吸"的结果。而被吸走的是：手机出货 -22%、锂价腰斩、建筑业 -4.1%、NAND 现货下跌、消费级 DRAM 涨幅收敛到个位数。**这不是全面繁荣，是一次极其彻底的产业再分配。**

**第二条主线是"政策给确定性"**。《国家信息化"十五五"规划》把"做精做细芯片成熟制程""研制高性能人工智能芯片""全国一体化算力网"三句话写死了，配 12 项预期性指标、3.8 万亿信息基建投资、10/26 开幕的五中全会。**过去三年国产替代靠的是"卡脖子"倒逼，现在开始靠"规划"和"市场"双轮。**

**第三条主线是"业绩开始分化"**。半导体 19 家营收 +22.71%、净利 +67.85%，但 22 家披露三季报的公司合计利润约 1660 亿元，**长鑫一家占八成**。同时长鑫 Q3 净利环比只增 1%-3.9%（Q1 曾环比 +246%）、江波龙 Q3 环比直接跌 36%-49%。**利润的来源正在从"涨价"切换到"HBM 占比、客户结构、良率"——切换完成前，股价的波动会比基本面剧烈。**

**第四条主线是"宏观的冷水"**。GDP 4.5% 尚可但建筑业 -4.1%、房地产 -0.2%；CFO 出口 +18.8% 漂亮但进口 +22.3% 更快；LPR 17 个月不动、央行在换锚；美联储 10/27-28 议息、美 10Y 已到 4.994%。**外部流动性是这周最大的变量。**

### Mavis 的 6 条独立判断

**1. 手机行业的"最坏"还没到，但"最痛"已经在中低端发生了。** -22% 是出货量，**51% 的存储成本占比才是真相**。1500 元以下机型已经不存在"合理毛利"这个概念了。三星苹果合计 45% 的份额不是靠创新抢的，是靠**别人被迫收缩**抢的——一旦存储价格在 2027 下半年松动，国产三家的份额也不会自动回来，因为货架已经被填满了。

**2. 存储周期没有反转，但"涨价赚钱"的边际效应已经过峰。** 这是我最想强调的一条。Q1 涨 93% → Q4 涨 15%，长鑫和江波龙自己在公告里承认"边际贡献趋缓"。**10/28 SK 海力士 Q3 财报（机构预期营业利润近 77 万亿韩元、利润率超 70%）是最近的定价锚**——它超预期则整个板块再冲一程，不及预期则今年涨幅过大的一批标的回撤会很快。**我倾向认为它是超预期的（长协锁量+HBM4 量产），但边际斜率会继续收敛。**

**3. 设备零部件是国产链里位置最好、赔率最高、但最容易被忽视的一环。** 海外零部件"软断供"（交期拉长到 1-2 年）本质上是**给国产零部件发了一张加速卡**——验证通过的正在转批量采购，头部企业普遍"爆单"。同时 ASML 说 2029-2030 年都排满，**设备订单能见度是三年以上**。北方华创对应 2027 年不到 4 倍 PS，赔率不错。**但我不建议在板块情绪最热时满仓。**

**4. 五中全会对科技板块大概率是"确认"而非"超预期"。** 因为《国家信息化"十五五"规划》已经把最重磅的话都说完了——**当产业规划比全会更具体时，全会的边际信息量就下降了**。所以我更关注两个可能超预期的地方：一是**新型基础设施的财政安排**（专项债、超长期特别国债对算力网/6G/卫星互联网的配套比例），二是**人口与生育支持政策的财政落地形式**（国常会 10/23 已经定调）。

**5. 人民币资产的短期风险不在基本面，在外部流动性和拥挤度。** 美 10Y 4.994%、Meta 披露 8250 亿美元未来支出承诺后纳指单日跌 2.6%、费半跌 6.72%——**市场开始质疑"谁来为 AI 基建付钱"**。A 股这边，10/23 创业板指 +4.16% 是超跌反弹，机构席位数据显示周五大涨时**内资机构仍在微幅净卖出**。**反弹是真的，但驱动力不是基本面，是空头回补。**

**6. 最被忽视的长期风险是"卡脖子"的形态变化。** 过去是设备（EUV、光刻机）；现在是**材料**——ABF 建层膜自给率不足 5%、味之素 5 月起涨价 30%、高盛预测 2028 年缺口 42%；是**零部件**——MFC、分子泵、静电卡盘交期 1-2 年；是**电性材料**——镓、锗的出口管制；是**规则**——三星西安、SK 海力士大连的设备安装都要"与美国磋商"。**国产化最脆弱的一环，已经从设备转向了"设备里那些不起眼的小东西"。**
