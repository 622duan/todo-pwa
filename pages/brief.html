## 一、宏观 PEST（2026-09-08）

### P（政治·政策）

- **央行 9/7 续作 5,000 亿元 3M 买断式逆回购**（89 天，到期 12/5），**从 7-8 月"加量 2,000 亿"切换为"等量续作"**，但市场解读为"灵活摆布"而非转向。9/1-9/4 7 天逆回购连续三日 0 操作，**DR001 报 1.3593%** 略低于 1.40% 政策利率。
- **8000 亿元新型政策性金融工具"开闸"**：9/1 农发行浙江分行首笔 3 亿元投放抽水蓄能项目，同日国开行云南分行 7,800 万；可撬动 **8-11 万亿元项目总投资**。东方金诚王青认为 Q3-Q4 基建增速将由负转正。
- **财政部 8/21 廖岷表态**：下半年还有 **2 万亿+ 地方政府专项债 + 超长期特别国债**待发行；"六张网"今年投资规模 7 万亿元+；"十五五"109 项重大工程（含三峡水运新通道 772 亿、广州新机场、福建上白石水利枢纽）顶格调度。
- **货币政策展望**（东方金诚 / 中信证券）：Q3 政府债净融资或升至 1.6 万亿创历史同期新高；**降准可能性延后到 Q3 末或 Q4**，买断式逆回购将替代降准提供流动性。

### E（经济）

- **1-7M 全国固投 -6.7%、民间投资 -9.4%**；房地产开发投资 -19.2%。但**电子电路制造业 +57.7%、信息服务业 +19.2%、知识产权产品 +9.1%** —— 投资向"新"集聚。
- **8 月建筑业 PMI 46.9%**（环比 -0.1），但**土木工程建筑业 PMI 升至 52%+**，需求侧订单、价格、预期均向好，9 月起将"加快形成实物工作量"。
- **铜价**：LME 三个月期铜 9/8 触及 **14,617 美元/吨历史新高**（今年 1 月 13,387）；沪铜 110,620 元/吨。**17 年内难以新增大型矿山**（标普全球）—— 铜是 AI/电网/电动车最大金属增量需求。
- **油价**：布油 9/7 收 97.31 美元/桶（+1.07%），美油 92.7（+1.33%），逼近 100 关口。**沙特阿美吉赞炼厂遇袭 + 美伊军事冲突升级** + 美国原油库存超预期下降共同推升，**9/11 国内成品油或上调**。

### S（社会·消费）

- **手机全面涨价**：9/1 起华为 Mate 80 全系 +800-1,000 元、畅享 90 +200；小米 17 系列 +300-500；荣耀 Power2 +500-600、Magic 8 +300-500。**千元机占比跌破 3%**（2024 年还有 15%），入门机价格中枢抬到 1,500-2,000 元。
- **换机周期延长**：IDC 数据 2026 年国内平均 **42 个月**（5 年前 24 个月），消费者从"快消品"转向"耐用品"思维。
- **新机高 ASP**：小米 Q2 智能手机 ASP **1,351 元（同比 +25.9%）**，创历史新高 —— **涨价反而让品牌 ASP 涨了 26%**。

### T（技术·AI）

- **AI 硬件进入全产业链业绩兑现期**（广发证券 9/2 研报）：从 2024-2025 的"点状爆发"扩散到**上游材料（CCL/铜箔/电子布）、设备、配套（MLCC/热管理/交换机）、算力金属（钨/锡/铜/钼）**全栈。
- **AI 算力链 Q2 盈利增速**：存储器 +957.9%、光模块 +136.2%、先进封装 +133.5%、半导体材料 +127.3%、AI 算力 +117.4%、AI PC +117.8%、MCU 芯片边际提升 250.9 pct（长江证券）。
- **海外云厂 1H 2026 资本开支 1,712 亿美元，同比 +80.19%**（国金证券）；TrendForce 预计 2026 全球 CSP Capex 同比 +98%、2027 再 +50%，**DRAM/NAND 在 CSP 资本支出占比将从 47% 升至 68%**。
- **博通 FY26Q3 AI 半导体收入 167 亿美元**（+221% YoY），CEO 给 2027FY 1,150 亿、2028FY 2,300 亿美元指引（连续两年翻倍）。谷歌 / OpenAI / Anthropic / Meta **全部加速自研定制芯片**。
- **三星联合 Arm 启动 2nm 端侧 AI 定制芯片**，目标客户或为 OpenAI。

**Mavis 点评**：今天的宏观不是"松不松"的问题，而是"松到哪儿、给到谁"。央行 9/4 的等量续作不是收紧，是 **"价格型调控" 框架下让 DR001 不要再显著往下漂**（已经 1.36%，低于政策利率 4 bp）。真正的弹药是 8000 亿政策性金融工具 + 2 万亿专项债剩余额度 + 1.3 万亿超长期特别国债，**三箭齐发在 Q3 末-Q4 形成实物工作量**。宏观背景对半导体、设备、存储、算力金属、有色、基建链条是结构性利好；地产、手机、消费电子是结构性压制。**这种"K 型分化"就是接下来 3-6 个月的主旋律**。

  - **TSMC 把 2026 设备采购指引从 1.0 调到 1.9**（半年内近翻倍），同时在建 20 座 fab（13 座台湾 + 5-6 座海外），侯永清："过去 30 年从没见过需求这么剧烈地变化"；2026 Capex 600-640 亿美元、美国加投 1,000 亿。
  - **全球 Q2 半导体设备销售 405.3 亿美元**（+23% YoY / +11% QoQ），连续两季创纪录；应用材料 +4.37%、ASML +3.57%。
  - **ASML 2027 年产能 +30%**、2028 再 +30%；低 NA EUV 2027 年订单几乎售罄；营收 CAGR 至 2027 接近 30%。
- **结构性信号**：
  - 长江存储三期 / 长鑫存储产线国产设备占比 **>50%**（刻蚀、沉积、检测已批量验证），国产替代从"补缺口"进入"整线级迁移"。

**Mavis 点评**：设备端这一波是真的不一样 —— **订单排到 2028 年，业绩能见度 18 个月以上**。但我得说一句反共识：2028 年才是真考验，**HBM 长协松动 / 存储合约价连续 2 季环比下跌 / 海外云厂下调 Capex 指引** 三个信号任一出现就是拐点。目前一个都没出现，所以**短期看 2027 H1 之前硬着陆概率不高**。

- **中芯国际 26Q2**：营收 30.1 亿美元（**+36% YoY / +20% QoQ**，超指引上限），毛利率 25.3%（超指引 20-22%），**产能利用率 93.7%**，晶圆出货环比 +14.4%、ASP +5.7%；12 英寸收入占比 77.4%、中国区占比 89.6%；**汽车电子 + 工业占比 +5.3 pct**。H1 营收 386.35 亿元（+19.44%）、归母净利 44.67 亿元（+94.16%）。
- **华虹宏力 26H1**：营收 95.74 亿元（+19.41%）、归母净利 3.99 亿元（**+436.69%**）、扣非 +470.34%；Q2 营收 49.49 亿元、净利 2.59 亿元，毛利率 16.5%（同比 +5.6 pct / 环比 +3.5 pct）；中国市场收入占比 78.6%、北美 +77%；Q3 指引 51.93-52.6 亿元，毛利率 16-18%。
- **华力微收购**：华虹宏力拟以发行股份方式收购华力微 97.4988% 股权，配套募资 ≤75.56 亿元，证监会已同意 —— **12 英寸产能深度整合**。
- **国芯科技 / 长电科技**：长电先进封装扩产建设期 20 个月；长鑫存储 2026 年底月产能目标 35 万片；长江存储三期 2026 年底投产。

### 2.3 设计 · 国产 AI 芯片第一次集体赚钱

- **寒武纪（688256）**：26H1 营收 59.96 亿元（**+108.13%**）、归母净利 23.11 亿元（+122.61%）；**存货 82.48 亿元（占资产 45.32%，环比 +66.83%）** —— 备货锁定上游产能，**预示 Q3 及下半年放量延续**。股价 1,072 元，市值 6,741 亿元，半导体板块市值排名 3/180。
- **海光信息**：26H1 营收 90.99 亿元（+66.52%）、归母净利 17.98 亿元（+49.69%）；**CPU:GPU 配比从 1:8 趋近 1:1**，CPU 在 AI Agent 任务编排中枢价值被重估。
- **天数智芯**：26H1 营收 9.46 亿元（**+192%**），通用 GPU +231%，**推理系列智铠 6.54 亿元（+651.8%）**；7 月发布天垓 Gen4 旗舰，服务客户 380+ 家。
- **壁仞科技**：营收 12.36 亿元（**+1,997.6%**），亏损 -3.77 亿元（-76.4%），毛利率 31.86% → 42.66%。
- **摩尔线程**：营收 +147%，归母净利亏损收窄 95.73% 至 -1,156 万元。
- **沐曦股份**：营收 +44.67%，扣非净利 -4,886 万元（同比减亏 75.83%）。
- **国产 AI 芯片共同痛点**：除寒武纪、海光外，**摩尔/沐曦/天数智芯/壁仞 经营现金流均为负**（沐曦 -12.97 亿、摩尔 -21.69 亿、天数 -27.86 亿）；"**芯模协同**"成主流，但 CUDA 生态迁移、HBM 国产化、万卡集群稳定性仍是三大卡点。
- **范式智能 - 华为大单**：范式智能 H1 算力 Capex 22.37 亿元，**拟出资超 10 亿元采购华为昇腾 950 系列芯片**（全液冷架构），金融/制造落地。

**Mavis 点评**：**设计端第一次出现"国产 AI 芯片上市公司集体性盈利"**，但要小心"**主业扭亏靠公允价值变动**"的天数智芯（一次性确认盛合晶微股份公允价值收益 7.6 亿元），剥离后主业仍亏 6.54 亿。真正的胜负手是 **"存货 +66.8% 是不是能在 Q3 兑现成收入"**——寒武纪给了一个 hint。

### 2.4 存储 · 周期拐点 vs 超级周期中场

- **Q3 价格信号**（群智咨询 9/1 报告）：
  - 16GB DDR4 +16%（动能在削）
  - LPDDR4X 4GB +7%、LPDDR5X 12GB **+3%**（接近停滞）
  - 256GB UFS3.1 +11%
  - DRAM 整体 Q3 涨幅 **13-18%**（Q2 是 58-63%），**斜率明显放缓**
  - NAND Flash Q3 涨幅 **10-15%**（Q2 是 70-75%）
- **现货市场**：DDR4 现货价 8GB 142 美元、DDR5 133 美元（**两代产品价差只剩 6%**，历史新低）；LPDDR4X/5X 1Gb 单价约 1.6 美元、涨幅控制在 10% 以内。
- **结构性紧缺**：
  - **三星 70% 产能锁到 2031 年长约**（英伟达、微软、谷歌等），现货市场只剩 3 成
  - 三家原厂 Q2 DRAM 营收 1,547.3 亿美元（+59.5% QoQ），三星市占 39.4%、SK 海力士 24.9%、美光 23.3%，**双强合计 64.3%**
  - TrendForce：2026 HBM+RDIMM 占 DRAM 供给 51%；2026 DRAM 全年涨幅 150%+、NAND 100%+
  - **美光台湾桃园 / 台中工厂超 80% 员工酝酿罢工**（约 1 万人），工会比照 SK / 三星薪酬
- **国产原厂**：
  - **长鑫科技 8/29 宣布 LPDDR6 量产**，首发搭载小米 18 Fold 折叠屏
  - 长鑫 9/1 中报：DDR5 占比持续提升，**毛利率冲高至 84.7%**
  - 长江存储 H1 NAND 毛利率 78.73%，跻身全球第一梯队
  - Semianalysis 预计长鑫 2028 年底产能达全球 DRAM 17%（2025 年 11%）
- **拐点辩论**：
  - 群智："四季度涨幅进一步收窄"
  - 集邦："DRAM 供不应求延续至 2027，价格涨势延续至 2027 H2"
  - 野村："供应严重短缺，4800 万亿韩元韩国集群 5-10 年才能转产能"
  - 摩根大通："科技/半导体去杠杆接近尾声"

**Mavis 点评**：存储现在像"**超级周期的中场休息**"——斜率在削，但**没到顶**。**真正要看的是 8 个信号里 HBM 长协松没松**（目前 0 个触发），**手机/PC 二级备货情绪**（已经全面抵制），**美光台湾罢工**（仍在倒计时）。建议关注 11 月 OPPO / vivo Q4 备货节奏 + 三星 2027 资本开支指引。

### 2.5 手机 · 涨价潮的"结构性重构"

- **9/1 调价清单**（主流品牌集体）：
  - **华为**：Mate 80 全系 +800；Mate 80 Pro / Pro Max +1,000（Pro Max 16+1TB **9,999 元**）；畅享 90 Pro Max +200
  - **小米**：小米 17 +300、小米 17 Pro +300、小米 17 Pro Max +500；REDMI K90 +200、Turbo 5 Max +200
  - **荣耀**：Power2 +500-600；Magic 8 各版本 +300-500
- **物料成本结构**：
  - **BOM 涨幅**：200 美元以下机型 +70%、400-600 美元机型 +52%（Counterpoint）
  - **存储占 BOM 比重**：10-15% → **30-50%**（部分低端机 60%）
  - 高通 9/1 起全系列芯片调价（**涨幅两位数**，骁龙 8 Elite Gen6 Pro 突破 300 美元/颗）
  - 联发科天玑 9600 Pro 216 美元（+8-20%）
  - 台积电 2nm 单片晶圆 ~3 万美元（vs 3nm 2.5-2.7 万，**+15-20%**）
- **ASP 跃升**：小米 Q2 ASP **1,351 元（+25.9% YoY）**创历史新高
- **渠道反馈**：4-7 月销售大盘两位数同比下降；消费者"手机涨 500、我省下 5,000"成主流心态；**二手安卓中低端回收价涨 10%**（新机卖不动，二手机吃香）
- **IDC 预测**：2026 全球智能手机出货 **-16.7%**（历史最大跌幅），中国 **-10.5%**（十多年新低）；换机周期 42 个月
- **特殊受益方**：**华为因自研麒麟 + 全链路自主可控，调价幅度相对温和**，价差策略留住高端用户
- **苹果**：iPhone 18 系列基础版起售价预计上调 100 美元（近年最大涨幅）

**Mavis 点评**：手机这轮涨价不是"成本转嫁"，是**"定价体系重构 + AI 算力虹吸"**两层。**AI 服务器对 DRAM 需求是普通服务器 8-10 倍**，吃掉全球过半月产能；**三星 / SK / 美光把 70%+ 先进产能转 HBM**，留给手机 30% 不到 —— **存储是 AI 的"税"**。**千元机退场**是结构性的，**5,000 元以上的旗舰市场未来 12 个月是绝对主线**，华为 / 苹果 / 荣耀 / OPPO Find / vivo X / 小米 Ultra 是赢家。**普通人**：旧机换电池再战 1 年最划算。
