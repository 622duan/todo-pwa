## 📊 板块 3：宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面：中小企业 60 日付现 + 国资委央企推进会

**9.14 国办《关于加强中小企业回款难问题治理有关工作的通知》**（新华社 9.14 转发）—— 4 方面 10 条措施，核心 3 条：

- **60 日付现承诺**：龙头企业自货物/工程/服务交付之日起 **60 日内以现金方式**（含银行转账）向中小企业付款，"付款四项关键要素"纳入合同示范文本
- **电子凭证最长 6 个月**：从 2024 年 4 月规范以来，电子凭证余额从 3 万亿降至 2.4 万亿（**-20%**）；平均期限较去年同期缩短 **92 天**；145 家不合规平台已退出
- **央企"三带头"**：① 违约拖欠"动态清零"；② 少开票多付现，严禁开 6 个月以上票证；③ 带头打破不合理行规，率先在合同明确"四项关键要素"

**国资委本周全央企推进会**：8 月底以来重点车企（17 家）率先承诺账期不超过 60 天，平均账期有所改善但仍有差距。工信部+市场监管总局出台《关于推动汽车企业规范供应商账款支付 优化账期管理的通知》。

**央行副行长陆磊 9.10 国新办**："十五五"时期货币政策框架将向价格型转型更明显，DR001 围绕政策利率平稳运行。

**9.15 国新办统计局付凌晖**：8 月规上工业 +5.2%，制造业 +6.1%（+0.7pct），高技术制造业 **+16.7%**，装备制造业 **+12.1%**；锂离子电池、工业机器人、3D 打印设备产量 **+57.2% / +34.6% / +29.9%**。

**📌 Mavis 点评**：60 日付现 + 央企带头，是从 2020《保障中小企业款项支付条例》以来最硬的一次升级。央行表态"积极支持大型企业通过贷款、发债置换应付账款"，等于给大企业开了一条"应付账款置换"的融资绿色通道——这是把"内卷式拖欠"问题从供应链金融层面彻底治理的标志。**Q4 大企业的应付账款规模会大幅压缩**，但同时需要警惕大型企业短期资金压力——国新办"债市空头已极端"的信号意味着，央行可能在中短期通过中期借贷便利（MLF）加量续作来对冲。

### 3.2 货币与流动性：隔夜逆回购对冲税期

**9.14 央行公开市场**：开展 **5040 亿元隔夜逆回购**操作（vs 当日 5 亿元 7 天期 + 5000 亿元买断式到期），全口径净投放 35 亿元。DR001 加权 **1.4145%**（-0.6BP），R001 与 R007 利率倒挂。

**9.15 央行 5000 亿买断式逆回购等量续作**（6 个月期，2027.3.15 到期），本月 3M/6M 双等量续作——结束了此前两个月的加量续作过程。**信号**：DR001 多数时间在政策利率下方运行，央行用"买断式等量"传达"避免市场利率大幅向下偏离政策利率中枢"的调控意图。

**本周（9.14-18）资金面**：税期（15-17）+ 大额政府债缴款（约 6330 亿）+ 5000 亿 6M 工具到期三重叠加。央行预告连续 4 天隔夜逆回购（每日 ≤6000 亿），**R001 中枢预计仍在 1.35-1.45%**。

**9.14 普惠小微贷款余额 38.5 万亿**（2020 以来年均 +20%），截至 6 月末数据；金融支持民营经济 25 条持续推进。

**华虹 Q2 2026**（8.7 中报）：
- 营收 7.175 亿美元（**创历史新高**）
- 独立式非易失性存储器收入 **+149.3%** YoY
