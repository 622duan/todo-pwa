**Mavis 点评**：🟥 这组数据最刺眼的是 **"剔除房地产后固投只有 3.0%"和"企业短期信贷多增 1.7 万亿但居民信贷少增 8400 亿"** 这对组合。翻译成人话：**钱在流向"能签合同、能回款"的实体企业，没有流向"要掏首付、要背三十年房贷"的居民**。这解释了为什么 AI、机器人、算力这些方向能一路涨，而地产、钢铁、白酒这些"居民部门相关"的方向起不来。📌 结构性判断：PPI +5.0% 创四年新高、核心 CPI 只有 1.0%，这个 **4.0pct 的剪刀差** 意味着成本压力全在生产端，而**居民端没有支付能力**——这正是 10/16 国常会要修《价格法》治"低价无序竞争"的原因，也是今天国办发 AI 就业意见的底层动机：**如果居民端收入跟不上，AI 替代的就业冲击会直接变成消费塌方**。

**Mavis 点评选 2 个最有洞见的**：

**第一个：Meta 的"自由现金流首次转负"，比"股价跌 7%"重要一百倍。**
10/23 那波美股抛售，媒体都在讲"Meta 烧钱"和"增发稀释"，但真正的分水岭数字是 🟥 **Q3 自由现金流 -21.2亿美元**（去年同期 +106.3亿）——**这是它十多年来第一次现金流净流出**。配合"未来租赁及合同支出承诺约 8250 亿美元"，这意味着 Meta 的 AI 支出已经不是"用利润投资"，而是**"用未来的资产负债表投资"**。🔍 为什么说这一天是分水岭：市场对 AI 的怀疑在 10/22 之前还停留在"回报率需要更长时间"（Miller Tabak 的原话），10/22 之后变成了"**有人已经开始用外部融资填窟窿了**"。而这条线会外溢——CoreWeave 无担保债券收益率上周飙至 **15%**、股价 -10%；Nebius 拿到花旗 35亿信贷额度后反而跌 7%。📌 **可验证判断**：看 **11 月美股科技巨头的 Q4 资本开支指引与自由现金流指引的"背离度"**。如果出现"capex 上调 + FCF 指引同步恶化"，AI 板块的估值锚就正式从"增长股"切换到"高杠杆成长股"，那时 A 股 10/23 那批高位股（宁德、宇树、汇金科技）会跟着杀估值。反之如果 Anthropic 11月 IPO 的招股书里"年化收入/算力资本开支"比值高于 2x，这波杀跌就是流动性事件而非基本面事件。**注意中际旭创 2028 年需求指引**——这是产业链里唯一敢把话说三年的人。

**第二个：iPhone Duo 溢价腰斩 + 华为阔折叠出货破 321 万台，说明苹果折叠屏的"教育市场"失败了。**
表面看是黄牛不炒了，深层是**折叠屏市场的定价权和心智都在华为手里**。🔍 三个数字连起来看：苹果 iPhone Duo 首发日黄牛加价 **1000元**（预售期传闻 3000元，缩水近五成）→ 溢价消失意味着**真实需求不足**；华为阔折叠累计出货 **321万台**、Pura X Max 在 iPhone Duo 预售 6 天窗口里**销量环比 +38%** → 说明华为折叠屏已经过了"尝鲜期"进入规模期；苹果 10/21 影视飓风测评发现**约八成应用未适配**、微信 10/23 才紧急发 8.0.80 → **生态准备度不足**。📌 更狠的一个细节：**iPhone Duo 内屏磨砂膜能徒手撕下**（吹风机加热即可），撕掉成本 7998元。这不是段子，这是**折叠屏品控和结构设计的真实短板**（柔性屏 + 保护层 + 铰链的装配公差问题）。**可验证判断**：Q4 折叠屏分品牌份额 + **苹果 vs 华为在双十一的折叠屏实际成交价**。如果苹果 1TB 版本（国行 23999元起）在双十一后仍需靠 3000+ 元降价清库存，说明折叠屏 iPhone 是**一场成功的发布会、一次失败的产品周期**。**同步看**：华为手机中国份额 21.1% 逆势 +17.3%，是头部唯一双位数增长——**在 iPhone 全球 Q3 只跌 4% 的背景下，这 17.3% 是从谁手里抢的，答案很清楚**。

### 8.4 编辑后记

今天是**指数强、宏观弱、产业强**的一天，三者第一次这么分裂。

10/23 A股那个深V，沪指从失守 3600 到收 3690，创业板从 2494 拉到 2684，放量 4238 亿，82 只涨停——**这是 10/22 下午那批 CPO 龙头集体开口说话的结果**（中际旭创说海外订单排到 2027、部分客户给 2028 指引，新易盛说回购 8-10 亿）。市场这次不是被"叙事"说服的，是被**在手订单**说服的。半导体板块 1659 亿美元、零部件全链条涨价、存储 DDR5 克价 1.84 倍黄金——这些数字都硬。

但同一天的另一组数字更硬，也更让人不安：🟥 **前三季度固定资产投资 -0.5%**，剔除房地产后只有 3.0%，**拉动 GDP 不到 1 个百分点**；**居民信贷只增 1.1 万亿、同比少增 8400 亿**；房地产开发投资 **-13.9%**，房企到位资金 **-8.4%**，国房景气指数 **92.78** 连续两个季度跌势扩大。厦门 108.7 亿土拍**全部底价成交、民企缺席**。

这两组数字是**同一个经济体的两面**：钱在流向"能签合同、能回款、能算进 GDP 数字"的地方（算力网、存储、机器人、半导体设备），没有流向"要掏首付、要背房贷、要生孩子"的地方。而 9 月 PPI +5.0% 对核心 CPI +1.0% 的 **4.0pct 剪刀差**，说明**涨价全发生在 AI 和能源链上，一分钱都没传导到老百姓**。

所以 10/23 那两份文件才这么值得读：国办《适应人工智能技术发展助力构建就业友好型发展方式的意见》里那句"**建立人工智能应用就业风险评估机制**"，和《国家信息化"十五五"规划》里那句"**做精做细芯片成熟制程，提高先进制程制造能力**"——**一份给 AI 装减速带，一份给 AI 装油门，而减速带装在油门前面**。这不是矛盾，这是**在居民端收入跟不上的时候，唯一能同时推进 AI 和避免消费塌方的走法**。

三件事值得这周盯着：

**第一，Meta 的自由现金流 -21.2 亿美元**。十多年来第一次净流出。这一天美股跌的不是"AI 烧钱"，是"**有人已经开始用未来的资产负债表烧了**"。而这条线会外溢到 A 股——宁德 10/23 涨 7.8% 重回万亿市值，宇树 20cm 涨停市值 2524 亿，汇金科技 20cm——**这些票现在的估值锚已经不是"增长股"了**。

**第二，存储这条线我给个反直觉的判断：现在不是买点，但方向是对的。** Q4 DRAM 合约价 +15%~20%、企业级 SSD +23%~28%，基本面确实在兑现。问题是**SK海力士放弃了 Solidigm 的 IPO**——这是存储资产在二级市场被嫌弃的信号。产业在赚钱，卖方嫌贵，两者同时为真，意味着**这轮周期的后半段是估值先于基本面见顶**。真正舒服的位置在下一次 AI capex 被证伪之后的杀跌里。

**第三，地产我不敢说"见底"，但有一个可以量化的观测点。** 政策面这周出了天津公积金扩围（新增物业费/装修提取，继深圳之后第二个地方跟进）、阳江备案价上下浮动 15%、海南容积率奖励 6% 上限——**"住房消费"这个概念正在被官方接受**，这比降首付更实质。但**厦门土拍全部底价成交**提醒我们：所有政策都在解决"怎么卖得出去"，没有一个在解决"房企没钱"。**房企到位资金同比降幅什么时候收窄，那个数字才是拐点**，不是土拍溢价率。

还有两个小而确定的：**铜精矿 TC 跌到 -240.83 美元/干吨**（负数，冶炼厂倒贴钱抢矿，稀缺的极端读数），**碳酸锂跌到 95620 元/吨、智利央行口径 16050 美元/吨**（1 月以来最低，因为 9 月新能源车零售 -16.7% 连续第 9 个月下滑 + 中欧限制中国混动车出口）。**铜和锂的背离不是周期错位，是两条完全不同的需求曲线**——AI 链的矿被锁死，非 AI 链的矿被抛弃。这条线到 2027 年会更极端。

最后说个让我有点意外的观察：**iPhone Duo 首发日黄牛只加价 1000 元**，比预售期传闻的 3000 元腰斩；而华为阔折叠累计出货破 321 万台、Pura X Max 在 iPhone Duo 预售 6 天里销量环比 +38%。**苹果的第一款折叠屏，全球限购 2 台，市场给的首发溢价砍到 1000 元——这不是黄牛不炒了，是真实需求不够。** 加上内屏磨砂膜能被吹风机徒手撕下来（7998 元的膜）、八成应用未适配、苹果中国手机份额从 iPhone Air 二手价低于同门 iPhone 17 就能看出来——**折叠屏 iPhone 是一场成功的发布会，一次失败的产品周期**。市场是华为的。

好，那就这样。**下周一开盘看三件事**：MLF 7000 亿落地后的资金面（10/26）、CPO 三巨头周末有没有新订单公告、以及 **10/26-28 税期 + 政府债发行高峰**这个扰动窗口能不能平稳过去。

对了——如果你还没看到这期，记得 PWA 刷新一下（iOS 上滑关闭重开，Android 清缓存或长按图标）。今天数据量比较大，日报里加了很多表格，手机上看不清可以拉到电脑端。

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
