### 4.6 Mavis 点评

**一句话**：这一轮不是"半导体大年"，是"存储把利润从终端抢过来"。

三个数据点串起来看：长鑫前三季度净利 **1310-1325亿**（同比扭亏为盈），全球手机出货 **-22%**，小米 ASP 涨到 1351元但毛利率从 11.5% 掉到 **8.5%**。存储厂赚的是手机厂和消费者口袋里的钱。

真正值得下注的变量不是"存储还涨不涨"，而是**涨价斜率的三连降**（80% → 40% → 20%）。如果 Q4 兑现 20%、Q1 降到 10% 以内，那消费电子的 ASP 压力会在 2027 上半年解除——这给了一个明确的**时间窗口**，而不是"存储永远涨"这种无法证伪的叙事。

📌 **可验证判断**：北方华创在手订单 **850亿** 排产至 **2027Q3**，这个数字在 2027Q3 之前不会变——它是三条主线里最确定的一个。中微 H1 扣非净利 **+108.36%** 远高于营收 **+34.89%**，说明设备端在赚"国产替代的溢价"，这个价差在量检测国产化率突破 10% 之前不会消失。

### 6.7 🎯 Mavis 点评选

**第一个洞见**：**黄仁勋和长鑫，在同一周做了同一件事——但方向相反。**

10月22日黄仁勋说"内存你永远可以用得更多"，同时对与长鑫合作持开放态度；10月23日长鑫科技股价盘中涨超 8%。可这两个动作本质上是**长鑫的两面**：一边是空头叙事里"2029年新增供给"的主要来源，一边是英伟达表态后的反弹领头羊。

这里的关键不是谁对谁错，而是**黄仁勋的身份是买方**。买方说"用得更多"，本身就符合英伟达锁定供应、维持自身成本稳定的利益。他的判断回答了需求侧，但**没有化解供给侧的产能时间表**——长鑫月产能 32万片→42万片→2028年底60万片，这个时间表不会因为一句表态而改变。

📌 **可验证判断**：不要跟踪黄仁勋的嘴，跟踪 **长鑫月产能的实际投产进度**。如果 2027 年长鑫月产能真站上 50万片且价格未崩，空头逻辑开始赢；如果 2027H1 现货 DDR5 跌破 $40（当前 $60.17），则价格先于产能见顶。

**第二个洞见**：**机器人板块的估值底和产能顶，同时出现。**

10月16日万联证券数据显示，人形机器人指数 PE(TTM) **25.44倍**，近5年历史分位 **0.16%**、一年分位 **0.87%**，逼近 2020年以来最低的 24.46倍。但同一周，宇树单周涨 **46.14%**、特斯拉宣布百万台产线、OpenAI 下场、王兴兴把"ChatGPT时刻"从"5-10年"提前到"1-3年"。

估值在地板，预期在天花板——**这个组合最危险的地方在于它把"预期兑现"的容错率压到了极低**。宇树自己 10月26日发公告提示：滚动市盈率 **388.25倍** vs 行业 39.51倍，且"物理AI从实验室演示走向真实场景的规模化落地仍面临感知精度、运动控制稳定性、数据积累及软硬件协同等多重挑战"。

更值得注意的是一个被忽略的数字：**IDC 数据显示科研教育、表演展示和政府数采中心三类场景，合计占上半年全球人形机器人出货量的 69%**。一位供应商直接说"当前行业收入构成中约**九成**来自唱歌、跳舞等展示性场景"。

📌 **可验证判断**：人形机器人板块的下一轮分化不在"谁有概念"，在"**谁有工业场景的重复订单**"。具体看三季报——**昊志机电**（谐波减速器+关节模组+无框力矩电机+六维力传感器）、**兆威机电**（灵巧手，"传动+电机+电控"垂直一体）、**雷赛智能**（无框力矩电机全年在手订单 **>100万台**，年交付预计 80-90万台，月产能约15万台正扩至300万台，前三季度归母净利 **+86.80%**）。如果 Q4 出现"零部件厂订单确认收入、整机厂估值下杀"的剪刀差，就是这个逻辑的兑现。

**第三个洞见**：**"保交楼"这个词，正在被"保交付"替代。**

9月房屋竣工面积同比 **-36.4%**，是年内最差读数；同期 9月一线二手房价环比 **+0.2%**、连续 7 个月涨；二手房占比从 2020年 27% 升到 2026前8个月 **52%**。

把这三个数串起来：**新房在缩量交付，二手房在放量成交，价格在二手端先稳住了。** 所以"中国房地产崩了"和"中国房地产企稳了"可以同时成立——前者说的是新开工和竣工，后者说的是存量房市场。而新《住房公积金管理条例》把提取情形扩到 9 项（含物业费、装修）、房贷贴息 10月1日全国实施，这两件事**都只对存量房有效，对新房去库存几乎无效**。

📌 **可验证判断**：看 **10月和11月的70城数据**——如果 70 城中二手房价上涨城市继续从 9 个往上走（10月数据 11月中旬发布），同时新房价格上涨城市从 17 个同步上行，才算"存量时代"真正站稳。如果只有二手涨、新房继续横盘，那意味着**存量房在替代新房**，而不是需求回来了。

### 8.4 📝 编辑后记

**第一个信号**：**10月23日国常会头一次把"清理民间投资隐性壁垒"写进服务业语境，但同一天央行缩量 MLF 2000亿。这两件事放一起，说明政策的着力点不是"放水"，是"修管道"。**

拆开看数据：MLF 净回笼 2000亿，但买断式逆回购净投放 4000亿，**中期流动性仍净投放 2000亿，连续第 4 个月净投放**。也就是说央行没撤水，只是把钱从"1年期长钱"换成了"3个月/6个月买断式逆回购"这种更灵活的期限。配合潘功胜 10月19日宣布"研究择机把公开市场主要操作品种的期限切换为隔夜"——**利率走廊在重构，不是不宽松**。

而国常会那句"清理民间投资隐性壁垒"，对应的现实是前三季度**固定资产投资 -7.2%**、民间资本不敢投。贷款端的钱再便宜，如果企业不知道该不该投、能不能投，利率传导就是断的。

📌 **可验证判断**：**民间投资**。具体看 **1-10月民间固定资产投资增速**能否从 -7.2% 的坑里爬出来（11月中旬发布）。如果 11 月数据民间投资仍深于整体固投、且没有转正，说明"修管道"还没见效——那么服务业政策要落到 2027 年才见效果，别指望 Q4 的社零数据跳升。

**第二个信号**：**10月26日社零 +1.1%，是"中秋错位 + 油价"造出来的，不是收入造出来的。但同期人均可支配收入实际 +4.4%。这个组合意味着居民不是没钱，是不敢花。**

数据链是这样的：前三季度居民人均可支配收入**实际增长 4.4%**（比上半年还加快 0.2pct），但 9 月社零只有 **+1.1%**，比 8 月加快 0.7pct——而申万宏源直接指出这个 0.7pct 加速**主因是中秋假期较去年提前至 9 月产生的错位效应**。同时，9 月社零里的石油制品、通讯器材增速改善，一部分来自**国际油价明显上涨**和**AI 终端涨价**——涨价推高了名义金额，不是销量涨了。

更要命的是：固投 **-7.2%**、地产投资 **-26.3%**、竣工 **-36.4%**，CPI 只有 **0.9%**。**没有通胀的 GDP 增长 + 没有就业预期的收入增长 = 居民选择存钱而不是消费**。灵活就业超 2 亿人，新就业形态职业伤害保障截至 9 月底累计参保 3727万人——保障在扩，但覆盖率还远不足以让人敢花钱。

📌 **可验证判断**：看 **2027年1月公布的 2026全年居民人均可支配收入实际增速**是否守住 4.4%。如果 2026 全年跌破 4.0%（即收入增速继续慢于 GDP），那 2027 年的消费政策必须从"补贴"转向"社保+收入分配"——因为补贴救不了收入预期。

**第三个信号**：**10月26日北方华创在手订单 850亿、排产到 2027Q3，和同日中微 H1 扣非净利 +108.36% 远超营收 +34.89%——这两个数加起来说明国产设备在赚"确定性溢价"，而这个溢价的地基是长鑫 42万片/月，不是政策补贴。**

理由：设备订单的可见性来自晶圆厂的实际扩产计划，而 2026-2027 年国内晶圆厂最确定的扩产来源就是存储——长鑫月产能 32万片 → 42万片 → 2028年底 60万片，中微 8800+反应台在 220+条产线跑量产，都是实物。中微同时说未来五年要覆盖 **60%+** 高端设备市场，而量检测国产化率 **<10%**、光刻 **<1%**——这说明它是在抢剩下的空白，不是抢别人已有的。

但这里有个必须说的风险：中微 H1 扣非 +108.36% 是**低基数 + 新品类导入**的结果，**不是常态增速**。设备公司的收入确认滞后于订单，850亿在手订单摊到 2027 年之后，**2028 年的报表会难看**。

📌 **可验证判断**：**中微公司 2027年一季报**。如果那时扣非净利同比掉到 20% 以下（哪怕绝对额还在涨），说明 2026 年的高增速是"验收集中确认"的一次性红利，国产替代的斜率比市场以为的平。
