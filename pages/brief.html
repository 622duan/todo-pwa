- **🟥 长鑫布局 NAND**：消息称长鑫规划 NAND Flash 赛道，剑指消费电子/服务器 NAND，与三星/SK 海力士/长江存储正面竞争。

- **🟥 美光"近 GPU NAND"**：研究高耐久 NAND 模块部署在距 GPU 更近位置，类似 HBM/GDDR7 工作方式。
- **🟥 HBM 占据 DRAM 50%+ 出货**：美银数据 AI 服务器 HBM 已占 DRAM 总出货 50%+；2026 HBM 市场规模 774 亿美元 +124% YoY，2027 进一步扩张至 1528 亿。
- **🟧 三星战略外包 DDR5/SSD**：内部产能全力押注 HBM，DDR5/SSD 新增产能外包。

**Mavis 点评**：成熟制程涨价潮是本周最值得关注的"暗线"。表层是 AI 算力 + 先进封装 + HBM 的超级周期；底层是韩台巨头"主动让出"成熟制程产能（TSMC 计划 2027 部分 8 寸停产、三星减产更激进），加上 AI 服务器、新能源车、工业自动化对成熟制程（电源管理、MCU、MOSFET、模拟）需求只增不减——供需缺口至少持续到 2027 年。国内中芯国际/华虹/芯联集成/粤芯是直接受益者，77% 的全球 12 寸成熟制程新增产能来自中国大陆。这不是题材，是 18-24 个月可见的兑现窗口。
