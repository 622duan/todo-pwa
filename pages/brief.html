## 🌐 一、宏观 PEST：中美博弈 + 中东冲突 + 内需筑底

### 1.1 🟥 政治（Politics）
- **中美 APEC 三方会晤传闻**：中外交部回应"目前没有可以提供的信息"，但中、美、俄领导人可能在 APEC 期间会晤。
- **美对芯片新一轮关税在路上**：商务部长卢特尼克 9/2 表示"美国建厂免缴、不建则缴"，覆盖范围或扩至含芯片的服务器与消费电子；各企业已承诺在美半导体制造投入约 1.2 万亿美元。
- **特朗普支持率创新低**：路透/益普索 8/24 民调支持率 33%、净支持率 -21%，距中期选举剩 62 天。
- **央行潘功胜 G20 表态**：贸易保护主义抬头、国家安全问题泛化、政策环境不可预期是全球失衡加剧主因；中国"不刻意追求贸易顺差"，"无意通过汇率贬值获取竞争优势"。

### 1.2 🟥 经济（Economy）
- **8 月金融数据前瞻**：业内预计新增信贷 4800 亿（同比 -1100 亿）、社融 2 万亿（同比 -5700 亿）；M2 增速或维持 8.4% 左右，社融存量 7.3%（环比 -0.1pct）。

## 💎 二、半导体产业链：AI 算力 + 国产替代 + HBM 抢产能

### 2.1 🟢 设备 — 国产化进入"深水区"
- **CSEAC 2026（无锡）密集发布**（8/31-9/2）：中微公司 1 天发布 6 款高端设备，涵盖刻蚀、沉积；北方华创、拓荆科技持续扩充产品组合。**行业从刻蚀/沉积向离子注入、D2W 键合、量检测等"深水区"突破**。
- **惠然微电子 14nm CD-SEM 破冰**：研发级 14nm + 量产级 22nm 12 英寸晶圆 CD-SEM 国产化，AI 深度学习将单帧画质增强至近 64 帧，**相关工艺段生产效率有望提升 10 倍以上**；与华润微电子签战略合作。
- **ASML High-NA EUV 累计曝光 135 万片晶圆**：全球已部署 10 台、3 台在途，**EXE:5200B 吞吐量 135WPH、可用率 84%**，年底提升至 90%，目标 93%；可满足未来最多 5 个 2D DRAM 制程节点。
- **国产 350nm 光刻机**：国内某装备企业自研 350nm 步进投影光刻机通过化合物半导体头部客户全流程验证，**从首台发运到批量订单仅 9 个月**，填补第三代半导体量产线国产中高端光刻设备缺口。
- **菲沃泰（CSEAC）首秀半导体纳米镀膜**：超均匀减摩膜层在晶圆卡盘等核心零部件落地。
- **华特气体（ASML + GIGAPHOTON 双认证）**：Q2 单季归母净利同比 +75.93%，特种气体营收 +38.56%。

### 2.2 🟢 制造 — 资本开支翻倍，中芯提价
- **台积电 Q 设备采购提至 1.9 倍**：联席 COO 侯永清 9/2 表示"季度设备采购预估提高至去年 12 月预测的约 1.9 倍"，**正同时建 20 座工厂（13 座台湾 + 海外）**；6 个月内两次上调 capex，全年 capex 较去年底 +90%。
- **台积电 5 倍扩张但仍跟不上 AI 需求**：今年建 25 座晶圆厂和先进封装设施，"过去每年建 5-6 座，今年建 13 座台湾 + 海外，史无前例"。
- **中芯国际部分产能涨价约 10%**：因移动应用 + AI 需求驱动，产能利用率接近或超过满产；TSMC 整合 8 英寸产能、计划 2027 年底关停部分产线，进一步强化涨价预期。
- **三星 2nm 良率持续存在问题、量产一拖再拖**：决定从得州泰勒工厂撤出人员，量产时间表已从 2024 年底推迟到 2026 年；GAA 良率仅 10-20%；李在镕亲访 ASML、蔡司求解决。
