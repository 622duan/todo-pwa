## 一、宏观 PEST

### 🟢 国内宏观：温和复苏，政策再加码

**核心数据：**
- **9 月 CPI 同比 +0.2%**，由前值 -0.3% 转涨；核心 CPI 同比 +1.2%，连续 6 个月扩大，为 2024 年 3 月以来最高。食品价格 -2.9% 降幅收窄 1.5 pct，扣除能源的工业消费品 +2.0%。
- **9 月 PPI 年内首次环比 +0.1%**，同比降幅进一步收窄；煤炭、光伏、集成电路制造价格均由降转涨。
- **9 月末社融存量 437.72 万亿元，同比 +8.5%**；M2 335.13 万亿，+8.2%；M1 112 万亿，+6.2%（M1-M2 剪刀差收窄至 2.0 pct）。
- **企业新发放贷款加权平均利率 3.1%**，同比降 40 BP；个人住房新发放 3.1%，降 8 BP。
- **央行 10/8 开展 1.2 万亿买断式逆回购**，加量 2000 亿续作，余额升至 6.5 万亿。
- **财政部 10/9 公布：再安排 5500 亿地方政府债务结存限额**（一般债 3000 亿 + 专项债 2500 亿），今年连续第五年盘活结存限额。
- **9 月社零高频指数**：线下消费热度同比 +17.3%（三线及以下 +31.2%）；游乐场、酒吧 +32-35%；景区 +14.4%。

**Mavis 点评**：9 月数据给出"温和转正 + 结构向上"组合拳：CPI 三个月内由 -0.3 拉到 +0.2，PPI 年内首次环比转正，财政再加 5500 亿弹药。10 月是高基数 + 三季报披露窗口，环比可能小幅回落但方向没问题。**3500-4500 元商务本、1500 元单条 DDR4、万元级入门游戏本**——消费降级叙事继续自我证伪，是成本传导而非需求崩塌。

### 🟡 海外宏观：加息预期降温，长端利率仍高

- **美 9 月非农就业仅 +2.2.9 万**（预期 +8.4 万），失业率 4.1%→4.2%，8 月数据下修至 +13.3 万。芝商所 FedWatch：10 月维持利率不变概率升至 **84%**。
- **10Y 美债 5.24%，30Y 5.60%**；本周终结 5 周连升，但绝对水平仍处历史高位。
- **欧元区主权债压力突显**：法 10Y 国债收益率一度逼近 5%（2002 年以来最高），法-德利差 159 BP 创欧债危机以来最高。法-意利差 30 BP 历史新高。克鲁格曼警告法国债务"大到无法救"。
- **密歇根大学 10 月消费者信心 46.3**（连续 3 月下滑），现况指标 44.7 创历史新低；1Y 通胀预期 4.7%。
- **OpenAI 澄清：年化收入 9 月底约 500 亿美元**，年底目标 700 亿（之前市场传 700 亿的预期被下修）；Anthropic、OpenAI 高管私下推演 AI 灾难情景，业内担心 6-12 个月内发生重大事件。
- **美财政部 2026 财年预算赤字 1.99 万亿**，同比 +21%，占 GDP 6%+，净利息支出突破 1.1 万亿单项贡献过半。
- **Lumentum CEO**：光学器件售罄至 **2029 年**，部分产品 2027 年仍缺 70% 产能；**SK 海力士**：光州芯片厂越快开工越好，需求将继续相当快速增长。

**Mavis 点评**：美联储已被市场倒逼成"再通胀的旁观者"，但 10Y 5.24% 仍是科技股估值的紧箍咒。法债危机是欧元的下一只黑天鹅——若法-德利差突破 200 BP，欧元资产配置会被动收缩，**美元 + 黄金 + 中国国债**仍是四季度避险底仓。OpenAI 500 亿是"挤泡沫"信号，对英伟达 / AMD 短期偏空（中长期对算力总需求无影响）。

### 🟢 中欧经贸：联合声明落地，混动汽车 / 稀土破局

- 中欧贸易投资磋商第二次例会联合声明：就**混动汽车贸易**达成谅解；继续推进电动汽车反补贴复审；同意解决医疗器械、农食、逆变器融资关切；强化出口管制对话；中方将通过**绿色通道**便利稀土及永磁体对欧出口许可审批。
- 商务部就美方所谓"结构性产能过剩"联合声明：明确反对以"产能过剩"之名行贸易保护主义之实。

**Mavis 点评**：稀土永磁的"绿色通道"是实质利好——欧洲新能源车产业链对中国稀土的依赖度短期无法替代，反向印证中国在永磁电机上游的话语权。混动谅解说明欧方对纯电路线开始务实妥协。

## 二、半导体产业链

### 🟢🟢 设备：涨价潮 + 国产替代双击

**ASML 涨价事件（10/10 落地）**：
- ASML 总部向韩国三星、SK 海力士下发涨价方案，**EUV / DUV 全部零部件统一涨 10%**，2027 年 1 月起生效。此前仅个别零部件单独调价，本次为"实属罕见"的全线涨价。
- 行业意义：① 议价权从晶圆厂向设备厂转移；② 2025 年 ASML 后服务业务占总营收 25%（82 亿欧元），今年增速预期 30%+；③ 应用材料、东京电子、Advanced Energy 已跟进涨价。
- 设备整机价格也在涨：ASML 与台积电就新设备涨价谈判中（**台积电明确反对**）。

**国内 12 寸厂 Q4 集采**：
- 国庆后首个工作日，中芯国际、华虹、长鑫存储等启动 Q4 设备集中招标，总规模 **120 亿元+**，国产设备中标金额占比预期**突破 60%**（较 Q3 +5 pct）。
- **中微公司**：自研高选择比深沟槽刻蚀机正式进入三星西安 NAND 量产产线，累计装机 15 台，国内刻蚀厂商**率先实现海外存储大厂量产导入**。
- **盛美上海**：在手订单 **170.73 亿元**，同比 **+88.2%**。
- **新凯来**：10/14 深圳湾芯展将展出半导体量检测装备最新成果，**时隔一年再次公开亮相**。
- **北方华创**：热处理、PVD 薄膜沉积设备近期获国内 12 寸逻辑厂重复采购订单。
- **泛林半导体**：在韩国设立半导体产业基金，韩国本地工厂加工腔出货突破 **15000 台**。
- **新思科技 + AWS**：10 年超 10 亿美元多年 IP 合作协议，硅 IP + AI EDA 工具加速 AWS Trainium / Graviton 定制芯片。

**机构展望**：SEMI 预测 2026 年全球半导体设备销售额 **1659 亿美元**（同比 +23.2%），2028 年达 **2295 亿美元**，连续 5 年增长。光大证券：刻蚀、清洗、CMP 国产化率已达 40-50%，ASML 涨价缩小国产设备成本差距，将倒逼晶圆厂加速替代。

**Mavis 点评**：设备"涨价 + 国产替代"是 2026 Q4 最确定的双击。ASML 这次涨价其实是把"卖设备一次收钱"模式升级为"卖设备 + 卖耗材 + 卖维护"的长期抽水——这才是**真正的护城河**。国内 60% 国产化率突破 60% 是标志性事件，意味着 28nm 及以上成熟制程已经基本完成"能用→好用"的拐点。**重点关注**：中微（已切入三星）、盛美（订单 +88%）、拓荆（先进封装键合设备）、新凯来（首次复出展出量检测）。

### 🟢🟢 制造：大基金 + 国资双管齐下

- **华虹集团获大基金重注**：上海国盛集团领投 62 亿元，华虹集团注册资本由 135 亿升至 197 亿元，国盛直接持股升至 41.7%，间接持股 10.2%。
- **华虹无锡 12 寸特色工艺产线**：投资 20 亿美元，月产能 5.5 万片，无锡总产能 +30%，预计 2027 年量产；华虹 2Q 收入 7.175 亿美元（+26.8% YoY），产能利用率 102.8%。
- **大基金持股板块 10/8 跌 4.17%**，净流出 76.12 亿元；长鑫科技流出 29.74 亿、芯原 6.73 亿、华虹宏力 6.57 亿、江波龙 5.9 亿；**净流入**：拓荆 2.24 亿、北方华创 2.05 亿、中微 1.54 亿。
- 中芯国际港股披露 H 股证券变动月报表；长鑫科技 9/20 宣布第五代 DRAM 技术平台量产，内存阵列半间距微缩至 11.95 纳米；LPDDR6 已 8 月全球首次商用量产；2Q 全球 DRAM 营收份额约 10%（Counterpoint）。

**Mavis 点评**：大基金从"撒胡椒面"转向"精准输液"——华虹 62 亿、地方国资 + 国开行一起上，看得出成熟制程是国家战略级资源。板块跌 4.17% 是短期获利回吐，**净流入前三是设备龙头**，资金逻辑很清楚：从"卡位"转向"业绩兑现"。长鑫 LPDDR6 8 月全球首发是个被低估的信号——消费电子不再是只买 LPDDR5X 的时代了。

| 整体 DRAM | **+20%** | +10-15% | 伯恩斯坦 9 月报告 |
| 服务器 DRAM | +18% | +10-15% | LTA 锁价 4Q 报价暗示 +20-25% |
| PC DRAM | +24% | +13-18% | 4Q 预期从 +3-8% 上调 |
| 移动 DRAM | +11% | 收窄至个位数 | 手机 OEM 强烈抵制 |
| 消费类 / 利基 | +33-36% | 持平 | SSD 控制器拉动 |
| 整体 NAND | **+20%** | +15-20% | 企业级 SSD 拉动 |
| 移动 NAND (eMMC/UFS) | +20% | +5-10% | 中国供应商抢占份额 |
| 企业级 SSD | +20% | 持续 | 核心驱动 |

**渠道结构性变化**：
- **三星 LPDDR5X 产能将 10+pct 重新调配至 HBM**，2027 年前完成。HBM 毛利率 58% vs 标准 DRAM 紧供应使边际晶圆产能转向 HBM 更具吸引力。
- **三星 1c DRAM 产能利用率**：2026 年 73% → 2027 年 ~85%。中国客户目前每月使用三星 4/5nm 产能 1.1-1.2 万片；三星可应对翻倍但无法满足 5 倍需求。
- **长协条款转向**：5 年以上协议包含**照付不议条款、保证金、价格上下限**，重点保护供应商下行风险。
- **渠道管控强化**：分销商必须提供终端客户销售数据并接受仓库审计；SanDisk 对部分分销商施加 NCNR 条款及 ~30% 预付款。
- **宇瞻 CEO 警告**：2027 年主要 DRAM 制造商对独立模组厂供应量可能**削减至 2026 年的 30%**。宇瞻库存已升至 124 亿新台币（约 3.83 亿美元，环比 +48%）。

**国产厂商表现**：
- **长江存储**：将 2026 Q3 对国内云厂合同涨价从 10% 上调至 **25%**；Xtacking V8 达 232 层（与三星 236 层 V8 基本持平），但韩国同行已量产 296 层 V9、400 层 V10，**技术差距 1-1.5 代**；eSSD 数据中心渗透率仍 <10%。
- **三星专家**：HBF 是一种降本方案而非颠覆性创新。GPU 上 6 颗 HBM 换 2 颗 HBF 可扩大容量但带宽降 17%，HBF 适用于中低端 GPU 工作负载。
- 华为、惠普、戴尔首次把**长鑫存储 DRAM**纳入内存采购候选名单。
- 联想已大规模采购长鑫 + 长江存储芯片，北美旗舰笔记本出现搭载长江存储 SSD 的机型。

**Mavis 点评**：存储涨价不是周期，是**结构性重构**——AI 把存储从"配套件"升级为"成本核心项"（AI 服务器存储成本占比超 30%），三大厂集体"弃低就高"（HBM 毛利 60% vs 消费级 20-40%），叠加长协锁死 50-70% 产能、现化通道收窄。Q4 还有 10-20% 空间，2027 年看 HBM 产能投放节奏。**真正的拐点信号不是合约价，是现货价何时止涨**——9 月 PC DDR5 现货已 +7.4%，但部分渠道反馈"客户价格容忍度接近极限"。

**消费级影响**：
- 16GB DDR5 内存条从数百元涨到 **1400 元上下**；32GB 规格 3300-3500 元。
- IDC 预测 2026 PC 整机售价将普遍 **+15-20%**。
- 全球 PC Q3 出货 6270 万台，**同比 -20.1%**（IDC 历史最大 Q3 跌幅，环比 -9.1%）；联想 1490 万台 -22.6%、惠普 1030 万 -30.9%、戴尔 760 万 -25.0%；**苹果 590 万台 -11.3%（份额从 8.5% 升至 9.5%）**成为头部最抗跌的一家。

今天的市场讲了一个很清晰的故事——**算力大周期 + 存储超级周期 + 设备涨价潮，三浪叠加仍未到顶**。

**最值得记住的 5 件事**：

1. **存储涨价是结构性重构，不是周期**。三大厂"弃低就高"（HBM 毛利 60% vs 消费级 20-40%），长协锁死 50-70% 产能，渠道商连仓库审计都要接受。Q3 DRAM +20%、NAND +20%，Q4 还有 10-20% 空间，**真正的拐点信号是 2027 HBM 新产能投放节奏**。

2. **设备从"卖产品"升级为"收租金"**。ASML 韩国零部件全线涨 10%，应用材料、东京电子、Advanced Energy 跟进——这是**议价权从晶圆厂向设备厂转移**的标志性事件。叠加国内 12 寸厂 Q4 集采 120 亿+ 国产化率冲 60%，中微、盛美、拓荆、北方华创四剑客正进入"业绩兑现"窗口。

3. **英伟达 6 万亿是"AI 算力总需求"的代名词**。它不再只是卖 GPU，而是**AI 基础设施平台**——GPU+CPU+网络+软件+AI 工厂方案。HBM 紧缺 + 光器件售罄至 2029 + 大客户资本开支 + 算力即服务（RaaS）四个飞轮同时转，**估值已经不是单年财报能解释**。但要警惕：AI 资本开支的资本效率正在被市场重新定价。

4. **政策"组合拳"已从"喊话"转向"花钱"**。央行 1.2 万亿买断式逆回购 + 财政部 5500 亿结存限额 + 房贷贴息 + 新质生产力 19 项——**四季度 GDP 增速"保 4.5%"基本无忧**。股市流动性边际改善 + 三季报披露期 + 美联储加息预期降温 = A 股节后修复行情可期。

5. **人形机器人迎来"商业化临界点"**。中国 H1 出货 4 万台 + 全球占比 97%，松延动力"小布米"9998 元破万元，宇树 R1 2.99 万登顶京东销量榜，特斯拉 Optimus Q4 量产。**未来 12-18 个月，"商业化能力"将决定谁能活下来**——99 块玩具级厂商和万元级可量产厂商会两极分化。

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
