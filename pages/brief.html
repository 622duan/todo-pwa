**Mavis 点评选**：
> **第一个，机器人圈的"本体厂抢投上游"。**20 家具身智能企业累计对外投资超 100 起，智元已孵化 15 家上下游项目，星海图的"星途计划"5 年投 10 亿、投 100 家公司。表面看是"边融边投"的资本游戏，但唐劲草说对了要害：**"整机厂天然面临一个矛盾——融资窗口在缩短，但供应链又没成熟到可以完全市场化采购。"**这不是造势，是**用钱买确定性**。真正该盯的是：这些投资是在锁产能（锁关节模组产能 2026 年 20 万套→2027 年 100 万套），还是在投票技术路线？
>
> **第二个，机器人板块和存储板块的"暴涨逻辑"其实是同一个。**机器人本体厂抢投上游、存储原厂疯狂扩产、显卡厂商产能被 AI 虹吸——**当所有环节都在抢同一个上游资源时，那个上游就会变成瓶颈**。所以 2027 年的核心问题不是"AI 需求够不够"，而是"**扩产能不能按期落地**"。SK海力士的答案是 2027 下半年，美光的答案是 2027-2028 更紧，英特尔的答案是"到 2027 年成为极大问题"。三个答案指向同一个结论。

2. 🟥 **PC 出货已确认负增长，且缺口至少到 2027 上半年。** 英特尔指引 2026 全年 **-12%**、H2 降幅超 20%、2027 再 **-10%**，并直言内存紧缺到 2027 年是"极大问题"。**风险点：存储涨价不是只杀手机，已经开始杀 PC 整机销量**——这条链一旦从手机蔓延到 PC 服务器，会直接击穿整个消费电子终端需求。

3. 🟥 **美联储 12 月加息概率 85.1%，且两位票委已投票反对暂停。** 10-28 是 **10:2**，库克与哈马克主张加息 25bp；洛根称至少还需加两次；欧洲央行多位官员同步警告。**风险点：10 月 CPI（PPI）若超预期，12 月加息将基本锁定**，直接冲击黄金（已跌破 4000，10 月 -7.21%）与新兴市场流动性——**注意这是一个"油价涨→通胀预期升→加息→压制风险资产与黄金"的闭环**，当前链条已全部启动。

4. 🟥 **稀土管制 11-10 暂停期届满是双向风险。** 一方面日本钇境外报价已到境内 **179 倍**、库存可能年底耗尽并已求助美国，中方有牌可打；另一方面**若中方继续暂停（中美有进展），支撑稀土板块的"卡脖子溢价"会快速回吐**。氧化镨钕已横盘在 73.5~74 万元/吨，成交跟进不足。

5. 🟥 **AI 资本开支已侵蚀云厂商自由现金流，估值锚正在切换。** 谷歌 FCF **-90.7 亿美元**（单日 -12%+）、Meta FCF 转负 -21.2 亿、五大云 12 个月 FCF 从 1924 亿降至 1259 亿，而亚马逊未来支出承诺已 **8830 亿美元**。**风险点：市场目前还在用"资本开支"给算力链定价，如果 Q4 财报季开始用"自由现金流"定价，整条链会再杀一次**——纳指距 10 月高点已跌近 8%，这个位置还没到最难受的时候。

6. 🟥 **A 股杠杆去化尚未完成，量化平仓可能二次冲击。** 两融余额自 6 月峰值 **3.03 万亿降至 2.46 万亿（-19%）**，融资余额单月降 1838 亿、连续 13 个交易日下降。**关键判断：公募科技仓位（电子+计算机+通信+传媒）已达 40.16%，超过 2020-2022 新能源浪潮峰值（近 40%）**——价格调整已完成，但**持有人换手尚未完成**。四季度净值压力、赎回压力、年末考核压力还压在这批筹码上。

7. 🟥 **新风险：11-16 的 10 月经济数据可能同时验证"投资未起"和"消费未起"。** 建筑业 PMI **48.0%**、新订单 **40.0%**（-5.7pct）已在 10 月 PMI 里预警。若 11-16 的固投和社零数据继续走弱，市场会重新质疑"财政发力是否传导到实物工作量"。**唯一的缓冲是央行 11-02 的隔夜逆回购——但那是流动性工具，不是需求工具。**

### 8.4 编辑后记

> **第一个信号：10 月 30 日这一天，同时验证了"AI 需求是真的"和"AI 估值是假的"——而市场只交易了后半句。**
>
> SK海力士 Q3 营收 +328%、营业利润 +632%，三星单季营业利润破 100 万亿韩元——这是需求侧的硬证据。但同一天，谷歌 FCF 掉到 -90.7 亿美元、Meta FCF 转负、英特尔 -28.58%、费半 -7.2%、AMD -10.88%。**这两组数据不矛盾，它们说的是同一条产业链的两端**：原厂赚到了钱，云厂商和终端厂开始付不起钱。所以杀跌不是需求崩塌，是**利润分配重新谈判**。**可验证的判断**：11-09 TrendForce 的 Q4 合约价如果 DRAM 守住 +10~15%、NAND 守住 +15~20%，那么这次杀跌就是估值杀而非景气杀，**原厂（三星、SK海力士、美光）会是修复顺序里的第一梯队，模组厂（江波龙、佰维）是最后一梯队**；反过来，如果合约价跌破 +10%，那江波龙 Q3 的 -44% 环比会变成趋势，**存储板块 Q4 还要再杀一次 20%**。
>
> **第二个信号：DDR4 现货价反超 DDR5 44%，是这轮周期里最被低估的一条——它比"存储涨价"重要得多。**
>
> 过去两年市场把存储涨价当成需求故事（AI 拉动），但 DDR4 倒挂说明它同时是**供给故事**：三星、SK海力士、美光三家基本完成消费级 DDR4 停产退出，产能全挪去 HBM 和 DDR5，而工业设备、汽车电子、旧服务器还在用 DDR4，**供给退出速度快于需求下降速度，老料就断供了**。这条逻辑有两个可验证的推论：**第一**，消费级 DDR4 至少还会涨到 2027 年，甚至不涨反涨（华强北 DDR4 16GB 最低 600 余元 vs DDR5 1400 元以上，价差在收敛）；**第二**，这个倒挂会在 2027 年随着国产成熟制程产能补上来而**反向崩塌**——**长鑫存储全球 DRAM 份额从 4% 升到 10%、长江存储 NAND 出货已到全球第三，一旦国产产能释放，就是把三星的份额从中国内部抢走，同时把全球 DDR4 的价格从天花板打下来**。所以真正的交易时点不在现在，在国产产能爬坡的时点，而那个时点的观察指标是**长鑫科技的季度净利环比增速**（Q1 +246% → Q2 +113% → Q3 +1~3.9%），它一拐头，就是周期拐点。
>
> **第三个信号：10 月 PMI 49.3% 是"假收缩"，但建筑业新订单 40.0% 是"真警告"。**
>
> 10 月 PMI 回落 0.8pct，官方解释是"十一假期前部分需求提前释放"，听起来合理——但高技术制造业 51.3%、装备制造业 50.6%、两个生产指数**连续 27 个月在扩张区间**，说明制造业本身没坏，坏的是**总量结构**。真正刺眼的是建筑业：商务活动 48.0%（-2.3pct），**新订单 40.0%（-5.7pct）**。这是两个完全不同的信号——商务活动 48% 说的是"在建的干得慢"，新订单 40% 说的是"**新的还没开工**"。中国物流信息中心的武威说得很准：四季度伊始"开工建设活动启动进度偏慢"。**可验证的判断：11-16 的固定资产投资数据如果 1—10 月累计增速不能止跌回升，10 月的"新订单 40%"就坐实了项目端的问题**；而资金端的解药（央行 11-02 隔夜逆回购）解决的是**钱够不够**，不是"项目有没有"——这两件事在 2026 年 Q4 首次出现了明确背离。**这也是我认为"稳增长"政策在 11 月需要加码实物工作量（专项债拨付、超长期特别国债）而非继续加码流动性的原因。**
>
> **第四个信号（附赠，最反直觉）：央行"换锚"不是宽松，是"拒绝宽松"。**
>
> 隔夜逆回购操作利率定在 **1.25%**，比原 7 天期 1.40% 低 15bp——市场第一天普遍读成"降息"。但恰恰相反：1.25% 与 DR001 10 月以来 **1.25%~1.30%** 的运行中枢**完全一致**，这是**锚定**，不是放松。更关键的是 7 天期工具被降级为"固定数量、利率招标、多重价位中标，主要在税期、月末开展"——**这意味着 7 天期的操作利率将不再披露**，工具曲线上只剩隔夜一个公开锚。同期美国是 10-28 以 **10:2** 维持利率、12 月加息概率 85.1%、Warsh 直接否定前瞻性指引。**两边对照着看：中国的央行在用"缩短期限+公开锚"降低政策不确定性，美国的美联储在用"取消指引"制造不确定性**。所以 11 月的真正看点不是会不会降息，而是**1.25% 这个隔夜锚能不能稳住整个曲线**——只要 11 月中旬税期 7 天期操作的资金利率不显著偏离 1.25%，中国的短端就是全球最稳的短端；反过来，如果年末政府债供给 + 跨年需求把隔夜利率推高 10bp 以上，那就说明"适度宽松"已经名不副实。
>
