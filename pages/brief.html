## 🌍 一、宏观 PEST

### P · 政治/政策

**🟢 美国/全球**：美联储 9 月 16 日以 **12:0 全票**通过 3 年来首次加息 25bp，将联邦基金利率升至 **3.75%–4.00%**。点阵图显示 18 名官员中 **12 人预计年内再加息一次**，2026 年底利率预测中值从 6 月的 3.8% 上调至 **4.1%**。这是 2022–2023 加息周期、2024–2025 降息周期之后，美联储正式宣告转向 **重新收紧**。欧央行 9/10 加息 25bp（存款利率 2.50%）、日央行 9/18 加息至 **1.25%（31 年高位）**，三大央行 9 月同步加息被《人民日报》定性为"历史罕见"，背后是中东油价+地缘冲突推升通胀黏性。

**🟢 中国**：央行 9/29 打出"组合拳"——**下调 PSL 利率 25bp**（1 年期从 1.75% 降至 1.5%）、将 **"六张网"**（水网/新型电网/算力网/新一代通信网/城市地下管网/物流网）纳入 PSL 支持领域、增加 **科创再贷款 2000 亿**（额度从 1.2 万亿升至 1.4 万亿）、增加 **支农支小再贷款 5000 亿**（其中民企额度 +3000 亿）。LPR 已 **连续 16 个月不变**（1Y 3.0%、5Y+ 3.5%），但 7 天逆回购利率稳定在 1.40%，央行用"结构性工具"绕开总量宽松——支持"十五五"开局+美国紧缩外溢下的"以我为主"。

**🟢 中美关系**：商务部 9/22 公告中美第八轮经贸磋商达成多项共识，美财长称双方同意 **贸易休战延长**至 2026 年 11 月（市场原本预期 1 月初到期）。荷兰首相耶滕 9/24 直接向特朗普游说反对 MATCH 法案——警告 ASML 对华销售限制可能 **催生竞品**；ASML CEO 警告"过度限制会带来绝望"，二季度中国市场占其设备销售 **14%**（一季度 19%）。

## 💻 二、半导体产业链

### ⚙️ 1. 设备（光刻机 + 晶圆厂务）

**🟥 ASML**：CEO 富凯 9 月警告"过度限制会带来绝望"，称华为已是 DUV 的证明——倒逼对手创新可能 **催生更强竞品**。2027 年 EUV 订单"基本已满"，公司计划再扩产 **30%** 应对 2028 年需求。Q2 中国市场占设备销售 **14%**（一季度 19%），连续被挤。荷兰政府已禁止 EUV、对部分 DUV 实施管制；MATCH 法案如通过将进一步限制所有 immersion DUV 对华销售。

**🟥 厂务工程**：台股厂务五强在手订单 **逾 8800 亿新台币**（历史新高）；全球半导体设备 Q2 销售 405.3 亿美元（历史新高），台湾跃升全球第二。

**Mavis 点评**：ASML 自己下场喊话是事件。美国推动 MATCH 法案时，已经不再区分"中国能不能造出 DUV"，而是担心**中国能不能造出 EUV**——所以下一步是连 DUV 都卡住。但 ASML 算账：14% 的中国市场 x 每台 370M 美元 = 数十亿美元/年，荷兰首相出来喊话是商业利益驱动，不是道义。这场博弈的结局大概率是 **"定向限制"+ 个别许可证豁免** 的混合方案——中美技术脱钩不会一刀切。

### 🏭 2. 制造（晶圆代工）

**🟥 台积电**：9 月合并营收 **3,309.8 亿新台币**（月减 1.4%、**年增 31.4%**），前 9 月累计 2.76 万亿、年增 **36.4%**；Q3 营收 **9,899.17 亿元** 超财测高标。10/15 法说会焦点：① Q4 财测（毛利率能否守住 60%+）；② 2nm 量产进度（占销售 3%，年底升至高个位数）；③ 2027 资本支出（今年已上调至 600–640 亿美元）。

**🟥 涨价**：2027 年起 **涨价 3%–6%**，订单能见度延伸至 **2030 年**；2nm 报价 **3 万美元/片**（比 3nm 贵 50%）；急单溢价 50%–100%，新客户被劝退转 2nm；成熟制程同步补涨，8 寸厂产能利用率超 100%、45nm 以下满载。AMD 全系芯片 Q4 起统一涨价 10%、英特尔 10/5 PC CPU 再涨 10%（2025 年底以来第三轮）。

**🟢 中芯国际**：Q2 产能利用率升至 **93.7%**，管理层称 Q3 维持 95% 高位；AI 配套芯片（数据中心逻辑电路、BCD、光模块收发芯片）供不应求。

**🟥 联电 + 力积电**：联电评估南科扩厂（受惠 Qualcomm/Intel）；力积电成熟制程报价 **大涨四成**。

### 🎨 3. 设计（芯片 + 软件 + 封测 IP）

**🟥 Qualcomm**：下一代 2nm Snapdragon 旗舰双平台仍采用 **台积电 N2**，强化对台积电定价权的依赖。GUC 推出 **2nm 16Gbps HBM4E IP**，获客户 AI 采用。

**🟥 Apple**：iPhone 18 Pro 搭载全球首款 2nm A20 Pro 芯片，借鉴 M 系列封装方案；可变光圈主摄 F1.48/F1.8/F2.8/F4.0；端侧 AI 算力大幅提升，可本地运行大模型。

## 📝 编辑后记

这是**季度末+国庆假期前+二十届五中全会前夕+美联储 10 月会议前夕**的"四重时间窗口"，信号密度极高。

**Mavis 点评**：

**第一**，9 月最戏剧性的事是**美联储时隔 3 年首次重启加息**——但市场已经消化得差不多了。A 股 9 月 -2.46% 的回调**主要不是美联储造成的**，更多是节前避险+成长股拥挤交易+获利盘消化。10 月 28-29 日的 FOMC 大概率再加息 25bp，**这才是真正的风险事件**——届时关注沃什怎么解释"通胀黏性 vs 经济韧性"的取舍。

**第二**，存储芯片涨价是 Q3 整个科技板块的"定价之锚"。**Q3 DRAM 合约价 20%-30% 涨幅 + NAND 15%+ + HBM 缺口 50-60%** 三个数据合在一起，意味着 Q4-2025 整个消费电子产业链的 BOM 成本被锁死在高位。**苹果 iPhone 18 Pro 256GB 物料成本 +400%** 是最震撼的单一数据——库克自己说"从没见过"。这条传导链到 Q4 才会在终端售价上完全显现，国产旗舰集体涨价是必然。

**第三**，**半导体国产替代 + AI 算力双主线**仍然是 Q4 最确定的方向。**长鑫 DRAM 份额 9.5%（全球第四）、长江存储 NAND 突破 10%、武汉九大国家先进存储产业创新中心**——这是中国存储产业**从"备胎"到"唯一选择"**的转折点。叠加**阿里 2032 年 20GW 数据中心**、**DeepSeek 科创板 IPO 倒计时（5000 亿估值）**、**Anthropic/智谱/MiniMax/DeepSeek 四大 IPO 冲刺**——AI 算力+大模型的双重资本盛宴正在启动。

**第四**，**房地产"金九银十"**意外超出预期：北京 +18%、上海 +16%、20 城二手房 +13.1%——这一波有 **9/28 三份重磅文件 + 9/29 房贷贴息政策 + 9/20 公积金新规**三层政策叠加。**首付下调 + 利率下调 + 贴息**三重利好已经形成"组合拳"，预计 Q4 核心城市成交量会延续修复，但**新房供应 -32%** 是房企拿地测算趋于审慎的信号——整体仍在筑底，分化延续。

**第五**，**A 股 10 月策略：业绩验证为王**。三季报 10/15 前密集披露，AI 产业链高景气方向（存储/PCB/光模块/封装）有望迎来业绩兑现。配置思路："**哑铃策略**"——底仓红利防御（银行/电力），中线 AI 硬件+半导体高景气，短线顺周期制造+事件催化。**上证 3800-4000 区间震荡**，结构性机会显著多于指数行情。

**最后**：今天是**2026 年 9 月 29 日**，距离党的二十届五中全会召开、华为 Mate 90 国行开售、台积电 10/15 法说会、10/28 FOMC 都还有 1–4 周——**Q4 的所有重磅事件都已排上日程**。建议大家：**持仓过节但不超过 7 成、保留现金应对波动、聚焦业绩兑现方向**。黄金建议等 900 元/克关口企稳再考虑分批试探；存储/AI 硬件仍是 Q4 主战场。
