### 1️⃣ 宏观 PEST

- **政治**：二十届三中全会改革部署继续落地；住建部+央行+财政部"稳楼市"形成部委协同；央行二季度货政例会强调"继续实施适度宽松"；7/24 央行净投放 MLF 1000 亿，三大中期工具 7 月合计净投放 8000 亿。
- **经济**：Q2 GDP 实际 +4.7%（上半年 4.7%），6 月 M2 同比 +8%、M1 +4%；上半年人民币贷款 +10.72 万亿、社融 +20.84 万亿；LPR 1y 3.0% / 5y+ 3.5% 连续 14 月不变；上半年居民存款少增 3.19 万亿（搬家到理财/基金）。
- **社会**：上半年人均可支配收入实际 +4.7%，中位数仍低于均值；6 月 16-24 岁青年失业率 17.7%（剔除在校生后口径）；上半年 35 城新房网签 52 万套，K 型分化继续。
- **技术**：WAIC 2026 闭幕，1100 家企业、3000+ 展品，300 款全球首发；华为昇腾 950 超节点 + Atlas850E 风冷超节点 + 阶跃 STEPX Neo + 荣耀 Robot Phone 同台竞技；工信部：智能算力规模 2185 EFLOPS，AI 核心产业规模 1.2 万亿、企业 6200+。

**Mavis 点评**：宏观面是"价稳量缓"。7 月 MLF 加量续作 + 8000 亿净投放是个新动作 — 央行开始主动对冲政府债发行提速带来的流动性缺口，邹澜也明确说"三季度宽松空间或进一步打开"。但 LPR 14 月不动说明"价格工具"被压着没用，主要靠结构性工具和买断式逆回购撑场。下半年财政金融协同促内需 1000 亿政策工具会加码，但真正起效要看 8-9 月专项债发行节奏 + 地产新政传导。

## ✏️ Mavis 点评（编辑后记）

7 月最后一周的资本市场，本质是"AI 叙事遭遇流动性压力测试"。

**最值得记住的 3 件事**：
1. **国产 DUV 浸没式光刻机量产突破**。7/27 The Information 报道，目标年产 5 台（对比 ASML 年出货 130+ 台，绝对量差距巨大，但战略意义远大于数字本身）— 同期 ASML 盘中暴跌 7%。这是 0→1 的突破，"能造"到"能造好"还有 5-10 年，但配合长鑫 3.28 万亿市值 + 哈工大 DPP 光源 + ASML 关系冰冻，**国产光刻机的预期博弈进入下半场**。
2. **英伟达 7500 亿美元"循环融资"被市场抓包**。7/28 费城半导体单日暴跌 5%、英伟达让出全球市值第一、5y CDS 创纪录。新易盛、康宁、SK 海力士集体闪崩。**这不是 AI 需求证伪，是市场对"金融工程制造需求"的觉醒**。但底层 — 台积电 2Q +36%、HPC 占 66%、CapEx 600-640 亿 — 都是真实订单。Q3 财报季会是关键验证窗口。
3. **中国地产进入"国家做房东"制度化阶段**。新华社年中观察：二手房占比首过半（50.4%）、16 城新房+二手房 +21.7%、207 城同比正增长。叠加 3000 亿保障房再贷款 + 土地闸门（去化 >36 月暂停供地）+ 房企白名单，**这是一个"防崩"机制，不是 2015 年翻版** — 人口、城镇化、杠杆都已根本不同。

**下半年看 3 条线**：
- **AI 商业化 vs 流动性**：英伟达 9 月财报 + Meta/谷歌/Microsoft CapEx 指引是 Q3 关键变量；国产这边华为 950 超节点 + 阶跃 STEPX Neo + 荣耀 Robot Phone 的"AI 智能体手机"落地节奏决定消费端承接。
- **国产替代深化**：长鑫科创板 + 纳入 MSCI 给国产存储第一次真正意义上的资本市场退出机制；DUV 量产 + 哈工大 DPP 光源让光刻机国产化的预期博弈从"概念"走向"兑现时间表"；中芯/华虹的成熟制程国产化率 2027 年是关键节点。
- **政策窗口**：7/29 美联储议息（9 月加息预期 78-82%）、8 月杰克逊霍尔年会、Q3 专项债发行提速、十五五规划编制、12 月中央经济工作会议定调 2027。地产新政传导 2-3 月见效，Q4 关注价格止跌信号。

1. **存储超级周期可能 2027 见顶**：HBM 4 涨价 +100-150% 之后需求能否接住？HBM 吃掉标准 DRAM 三倍晶圆产能，"非对称挤压"已经让手机/PC/汽车/家电全面承压。
2. **AI CapEx"循环融资"风险**：英伟达+OpenAI+Anthropic+CoreWeave 等交叉持股被市场重新审视，1.65 万亿美元"隐性 AI 债务"是悬在头上的达摩克利斯之剑。

        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
