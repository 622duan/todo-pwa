### 8.4 编辑后记（v6 关键改动）

> **第一个信号：MLF 缩量 2000 亿 + 5500 亿结存限额同时落地 + 证券交易印花税 +65.1%——货币在收、财政在放、交易在火，这三件事拼起来是一个"抽水"结构。**
>
> 10/26 央行续作 7000 亿，对冲 9000 亿到期，净缩 2000 亿；同时财政部把 5500 亿地方债结存限额搬出来（专项部分 2500 亿明确投向"六张网"）。这两件事方向相反但结果一致：**钱在从金融体系流向实物工程**。而前三季度证券交易印花税 2391 亿元、同比 **+65.1%**——这个增速是同期名义 GDP 增速 6.0% 的十倍以上。
>
> **可验证的判断**：如果 10/29 FOMC 确认 12 月加息 25bp（CME 概率 74.8%），全球流动性进一步收紧，**A 股唯一能扛的板块是有真实订单的半导体设备与算力硬件（北方华创 850 亿在手订单、寒武纪 1H 营收 +106.76%），而不是券商和地产**。看 10/27-28 的成交额是否重回 2 万亿、且成交是否集中到有中报的硬科技——如果量回来了但钱去了银行和石油（10/26 的形态），说明这仍是防御性轮动，不是进攻。

> **第二个信号：9 月 PPI 同比 5.0% 创年内新高，但 CPI 只有 0.9%——这 4.1 个百分点的缺口里，藏着 AI。**
>
> 9 月 8 个涨价行业合计拉动 PPI **5.42pct**（煤炭 +35.3%、石油天然气 +24.5%、有色 +21.4%），而 CPI 只有 0.9%、核心 CPI 1.0%。但真正反常的是 CPI 篮子里的 **AI 硬件**：数据存储设备同比 **+46.7%**、平板 +23.6%、计算机 +21.8%、移动电话机 +14.9%，合计影响 CPI **+0.23pct**。也就是说，**通胀的驱动力已经从"猪周期+油价"切换到"算力周期"**。这跟 2004-2007 年的煤油钢不一样——那轮有产能出清机制，这一轮数据中心不会在明年就停建。
>
> **可验证的判断**：如果 11 月 9 日公布的 10 月 CPI 里，"数据存储设备"同比仍在 30% 以上，**存储产业链的议价权还会支撑上游利润到 Q4**，中证 500 里跟存储相关的那部分盈利预测要上修；但同时这会强化"终端通缩"——手机出货已经 -22% 了。**这两件事同时成立，就是本轮最反常的组合：AI 让上游通胀、同时让下游通缩。** 所以别用"PPI 转正利好周期股"的旧框架看这轮，**该看的是谁能把成本传导出去**（华虹 ASP 上行、中芯毛利率 25.3%，而手机厂毛利率从 11.5% 掉到 8.5%）。

> **第三个信号：公积金提取从 6 项扩到 9 项（新增装修、物业费）——这是个反常信号。**
>
> 9/20 生效的新《住房公积金管理条例》，把提取情形扩到 9 种，新增**装修自住住房、支付自住住房物业费**。看起来是"扩大内需"的民生利好，但细想一下就发现问题：装修和物业费都是**存量房持有环节的支出**，扩的是"持有成本"，不是"购房需求"。9 月 70 城数据印证了这个方向——**二手房环比上涨城市比 8 月多 6 个，新房只多 2 个**。
>
> **可验证的判断**：这轮地产修复是"**存量先行、二手先于新房**"。所以未来 1—2 个季度，最先兑现的不是售楼处，是**物业管理 + 建材后周期（装修、电梯、管网）**，而 10/26 房地产板块领涨（招商蛇口涨停、大名城 2 连板）恰恰是**资金提前抢跑**。真正要等的是：11 月中旬 70 城数据里**二手房连续第 3 个月改善城市数超过新房**——如果这个差值继续扩大，"以旧换新+装修公积金"这条链（家电、建材、物业）比开发商更值得看。反过来，如果 11 月数据里新房上涨城市数重新反超二手房，说明这轮公积金扩容只是把购房需求**延后**了，不是**创造**了。
