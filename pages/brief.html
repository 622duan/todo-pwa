**10月23日国常会两个关键词：**
- **人口**——"加快建设生育友好型社会"，优化财税、社保、住房支持，稳住新出生人口规模
- **服务业**——"加力推进服务业扩能提质"，破除市场准入障碍，清理民间投资隐性壁垒，稳步推进公共事业领域价格改革

🟥 **10月16日国常会的价格法修正，才是今天最容易被忽略的政策剧变**：《价格法(修正草案)》明确"依法依规治理低价无序竞争，健全行业成本调查、**制止低价倾销**等配套规则"。这与手机、存储、光伏、锂电行业过去两年的"内卷式低价竞争"直接对撞——📌 **低价倾销被写进价格法，意味着"内卷出清"从行业自律升级为法律工具**。

> **Mavis 点评**：🟡 国常会这两天的重点都不在"刺激"，而在**修制度**。人口政策是把 2026 年出生人口托住，服务业+价格法是把产业利润修回来。价格法修正这条线是本轮最值得跟踪的——它决定了后面哪些行业会被"反内卷"点名。

### 8.4 编辑后记 · v6 关键改动

**第一个信号：9 月 PPI 涨 5.0% 而 CPI 只涨 0.9%，中间那 4.1 个点的差距不是"传导不畅"，是有人把成本吃下去了。** 拆开 9 月 PPI 的构成——石油开采 +14.5%、煤炭加工 +13.6%、有色冶炼 +1.5%——这三条都是国际输入型的。但同期 CPI 里，**数据存储设备 +46.7%、平板 +23.6%、计算机 +21.8%、手机 +14.9%，四项合计拉动 CPI 同比 0.23 个百分点**。也就是说，存储涨价没有传导成"物价上涨"，它变成了**手机厂和组装厂的毛利蒸发**。可验证的判断是：**盯 10 月、11 月的 CPI 消费品分类，如果数据存储设备涨幅从 46.7% 回落到 20% 以下而手机出货继续下滑，说明厂商在清库存；如果存储 CPI 涨幅维持在 40% 以上，说明涨价已完全传导到零售价，出货量会从 -22% 继续扩大**。具体的观察点是国家统计局 11 月 9 日左右的 10 月 CPI 解读。风险在于：一旦消费级存储价格先于合约价下跌，**设备端按 800 亿订单定价的北方华创、中微、拓荆，订单确认节奏会被拖后 1-2 个季度**。

**第二个信号：10 月 23 日国常会研究的"人口"，和 9 月 20 日施行的公积金条例、10 月 1 日实施的购房贴息，串起来看是一套组合拳，但和 8 月 28 日的现房销售改革，方向是相反的。** 前者是在**需求端加杠杆**（补贴 1 个百分点、公积金提取扩到 9 项、买房贴息减负每月 800-900 元），后者是在**供给端削杠杆**（预售封顶、现房销售、40 年贷款期限、单项目单主办银行）。这两个方向同时推，结果是 9 月一线二手环比 +0.2% 连涨 7 个月、但新房端 34 城成交环比 -15.1%。可验证的判断：**2026Q4 到 2027Q1，如果二手房网签面积同比增幅维持在 +10% 以上而新房销售面积同比降幅收窄到 -10% 以内，说明"需求端加杠杆"压过了"供给端削杠杆"；如果新房降幅继续扩大，说明现房销售改革带来的供给收缩快于需求恢复**。验证点是住建部 12 月中旬的 1-11 月网签数据和统计局 12 月的 70 城房价。风险在于：财政贴息中央承担 90%、实施期**暂定 1 年**（即 2027 年 9 月 30 日到期），**如果到期不续，Q3 2027 会有一波集中退坡**。

**第三个信号：北方华创全年 800 亿订单 + 设备国产化率 35%（新建产线招标国产占比 55%）+ 中微 8800 个反应台在 220 条产线量产，这三个数加上长鑫 32→42→60 万片的产能曲线，其实回答的是同一个问题——本轮扩产的瓶颈是钱还是设备？** 答案是**都不是，瓶颈在"良率爬坡的时间"**。PSMC 的数据是绝佳佐证：它的晶圆 ASP 在**投产时**计费，Q3 完成的存储晶圆 ASP 比同期投产的低 **30% 以上**——这意味着存储涨价的利润要等两个季度才落到代工/设备商账上。可验证的判断：**跟踪长川科技的 Q3 环比加速（22%-39%）能否延续到 Q4，如果 Q4 环比继续为正，说明前道扩产已进入后道放量期；如果 Q4 环比转负，说明晶圆厂在等良率而不是缺设备**。**具体到标的：长川科技和华峰测控（后道测试）对存储扩产最敏感，北方华创订单确认周期最长（Q1 签的订单通常 Q4 确认收入），三者的背离本身就是判断扩产阶段的信号**。风险在于：一旦 2027 年 1 月消费级存储合约价开始打折，晶圆厂的扩产决策会**先于价格反映**——届时 800 亿订单是"已签"还是"可撤"，是这轮周期最大的信息差。

        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
