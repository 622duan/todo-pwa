> **Mavis 点评选**

> **第一个：宇树 8 个交易日 +58%、换手率 23.42%，但它上市首日最高到过 1100 元、发行价 150.80 元、较高点跌去 63.2%。** 这轮反弹的本质不是"业绩兑现"——宇树自己在公告里就写了"行业尚处商业化早期，技术成熟度、下游需求培育、产业链配套能力均存在不确定性"。**真正被重新定价的是筹码位置**：机器人指数 5 月 26 日见年内高点，到 10-27 已调整近五个月，万得机器人指数最大回撤 **29.22%**、年内仍跌 13.27%；而同期光模块指数年内涨 41.26%、半导体设备涨 45.35%、存储器涨 18.73%，却分别从高点回撤 39.20%、47.48%、43.48%。**一边是年内负收益且回调五个月，一边是涨过但正在消化估值**——这就是钱回机器人的全部理由，跟机器人基本面没关系。**可验证判断**：如果这轮是基本面驱动，那么 11 月中旬三季报密集披露时，涨得最猛的数据环节（海天瑞声、奥比中光、索辰科技、凡拓数创）必须出现收入端的拐点。奥比中光前三季营收 7.11 亿元 **同比 -0.43%**、归母净利 7386 万元 **-31.62%**，凡拓数创上半年营收 **-27.8%**、亏 7725 万元——**这四个"数据卖铲"的公司，业绩还没跟上股价**。哪个先证伪，就看三季报。
>

### 8.4 编辑后记（v6 关键改动）

**第一个信号：出口 +91.6% 和手机 -20% 这两个数，是同一台机器的两头。**

10-28 发改委披露，2026 年 1—7 月中国集成电路出口 **1.49 万亿元，同比 +91.6%**；同一天，Q3 全球智能手机出货 **同比 -20%，2012 年以来最差**。同期存储价格：16Gb DDR5 现货 **60.6 美元/颗，同比 +547%**，华强北 DDR5(16GB) 从 200 多元涨到 **1400 元以上**，服务器级 DDR5 合约价克价已是国际现货黄金的 **1.84 倍**。

这三个数连起来讲的是一件事：**中国半导体在"卖"和"用"两端同时被拉爆，但拉爆的位置不在同一层**。出口 +91.6% 主要是 AI 服务器、算力配套（电源管理、接口、光模块收发、BCD）流向海外，成熟制程成了全球 AI 的"外溢承接地"；而 -20% 的手机是消费级存储被 HBM 挤出去之后的结果。中芯国际 Q2 12 英寸收入占比 **78.2%**、工业与汽车占比从 14% 升到 **16.5%**、智能手机占比从 25.2% 降到 **16.9%**——**结构切换已经在财报上写好了**：这轮景气不吃手机的钱，吃的是 AI 的钱。

**可验证判断**：**具体到公司**——不要买"手机链"，要买"AI 配套链"。具体到时点：**11 月中芯国际 Q3 财报**，看两个数：① 12 英寸收入占比是否继续从 78.2% 往上走；② 工业与汽车占比能否从 16.5% 突破 18%。**如果这两个数继续上行、而消费电子占比继续下滑，那么"AI 外溢"就是结构性的，不是周期性的**。反向验证在消费端：**11 月 11 日双十一**如果手机品类 GMV 同比仍是负增长、Counterpoint 那个"63% 消费者注意到涨价"的调研在下季度变成 70% 以上，那么存储涨价的成本传导还会继续往上走，**消费电子链的毛利还要再被压一层**。

**风险点具体在哪**：中芯 Q2 折旧摊销 **12.12 亿美元，同比 +37.9%**——这是全行业最硬的天花板。**在 7nm 及以下产能无法规模化的前提下，营收每涨 10%，利润只能涨一部分**，因为折旧是刚性的。所以看多中芯的逻辑必须建立在"ASP 涨幅 > 折旧涨幅"上，而这个差值的窗口不会永远开着。

**第二个信号：稀土海外溢价最高 +12,918%，和它对应的不是"反制见效"，而是"西方已经放弃自主定价权"。**

REEx 10 月评估：中国产氧化钇 **8.17—8.73 美元/kg**，海外 **1,100 美元/kg 以上**，溢价 **+12,918%**；氧化钆 **+10,936%**；氧化镝 **+1,915%**；氧化铽 **+1,178%**。同期 USA Rare Earth 与美国政府直接设定托底价——氧化镝 **$575/kg**、氧化铽 **$2,050/kg**。

**这两个数放一起才说明问题**：溢价高到 +1,915% 说明有管制；但高到 +12,918% 说明**不是管制，是断供**。而且美国政府**下场给托底价**这件事，比任何管制清单都更能说明问题——当一国政府要为一个原本市场化交易的商品定"最低收购价"时，意味着**这个市场已经没有价格发现功能了**。这是稀土反制真正生效的标志：**不是"我们涨价你不许买"，而是"你根本买不到，只能接受我们或第三国的价格"**。

**可验证判断**：**具体到公司**——北方稀土、中国稀土、盛和资源这类有海外权益和分离产能的，逻辑不在"稀土涨价"本身（镨钕氧化物海外溢价只有 **+27%**，中国 $103—106/kg vs 海外 $125—140/kg，几乎平价），**逻辑在分离环节的定价权**：海外溢价的分布极不均匀，镨钕（+27%）和钴（+6.9%）是平的，镝（+1,915%）、铽（+1,178%）、钇（+12,918%）、钆（+10,936%）、镓（+635%）、锗（+382%）是断崖。**所以真正该跟踪的是中重稀土和镓锗，不是总量稀土。** **验证时点**：2027 年 1—3 月 NOAA 那个"83% 概率成为 1950 年以来最强厄尔尼诺"的窗口，叠加 11 月中重稀土出口管制配额的下一批公示——**如果配额在旺季前收紧，中重稀土（镝铽）价格会出现断层，而镨钕不会**。**风险点**：**一旦西方真的建成本土分离产能（美国政府托底价就是这个信号），溢价会从供给缺口定价转向成本定价，那就不是 +1,915% 而可能是 +300%**——**这是所有反制叙事里唯一真正的时间炸弹**。

**第三个信号：10-27 A 股 4,900 股下跌、创业板 -3.41%、科创50 -4.81%，同一天建设银行和工商银行创历史新高。**

这一天同时发生了三件事：① 1—9 月规上工业利润 **+15.5%**、电子行业 **+100%**；② SK 海力士 Q3 营收 **+328%**、营业利润 **+632%**；③ 港股 AI 硬件和机器人股集体走强（长飞光纤 +10%、优必选/禾赛 +10%），A 股人形机器人概念多股直线涨停。**基本面全面向上，A 股成长股全面下跌。**

这个背离只有一个解释：**10-27 是美联储决议前夜**。CME 数据显示 10 月按兵不动概率 92.8%，但**12 月累计加息 25bp 概率 77.7%**；美国 10 年期国债 **4.984%**、20 年期 **5.358%**。**在 20 年期美债 5.3% 的贴现率下，"看 2028 年现金流"的成长股没有估值可言，"看当期分红"的银行有。** 所谓"红利 vs 成长"的风格切换，实质是**贴现率切换**。

**可验证判断**：**具体到资产**——这不是个股问题，是久期问题。**看三件事**：① 10 年美债能不能回落到 **4.8% 以下**（回落则成长股估值修复，最直接受益的是科创50 和创业板）；② 12 月 FOMC 点阵图；③ **中国 10 年国债 1.582% 与美国 10 年 4.984% 之间 3.4 个百分点的利差**——这个利差是人民币资产的机会，但前提是汇率不失控（在岸 6.6695、美元指数 102.35）。**具体到时点**：**未来 5 周看 10-29 的美国 9 月 PCE**——如果 PCE 因油价（Brent 113.88）超预期，12 月加息概率会从 77.7% 冲到 85% 以上，那么 A 股成长股的下杀还没结束；如果 PCE 因为俄乌局部停火 + 油价回落而温和，加息预期回落到 70% 以下，**11 月的成长股修复窗口就打开了**。

**风险点具体到数字**：**20 年美债 5.358% 是真正的那根线**。AI 硬件（光模块、半导体设备、存储器）年内分别涨 41.26%、45.35%、18.73%，但已经从高点回撤 39.20%、47.48%、43.48%——**这个回撤幅度说明市场已经在给 AI 资本开支定价"减速折现"，但如果长端利率继续往上，AI 硬件的估值压缩和基本面减速会叠加**。这就是为什么美银说"存储股估值已见底"要被人质疑：**2~3 倍 PE、0.9 倍 PB 确实是历史底部特征，但美银的前提是"2027—2028 维持超级周期"——而这个前提依赖 AI 资本开支不减速。市场现在恰好在质疑这件事。**

        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
