## 板块 3：📊 宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面（**9.28 国常会"加力" + 9.29 央行四箭齐发 + 10.1 房贷贴息**）

🟥 **国务院常务会议 9.28（李强主持）——加大逆周期调节力度**：
- 存量政策：加快各类债券发行使用进度；推动"十五五"规划、"六张网"实施方案明确的重大工程项目尽早开工；推进老旧水库、老旧粮库改造；加力实施扩投资、促消费贴息政策
- **增量政策**：优化财政支出、用好地方政府债务结存限额（仍有约 6000 亿专项债结存限额）；综合运用并适时调整货币政策工具；增加科技创新和技术改造、支农支小再贷款额度；研究出台稳定房地产、促进就业增收措施
- 突出"上下协同合力稳投资"+"鼓励有条件地方先行先试"两个新提法
- **Mavis 解读**：本次国常会罕见在三季度末召开，意味着对 Q3 经济数据（1-8 月固投 -7.2%、三季度 GDP 预计 +4.5%）的官方确认——"出现了一些问题"。政策从"跨周期+逆周期并提"切换为"突出逆周期"

🟥 **央行 9.29 四箭齐发（一天后落地）**：
1. **PSL 降息 25bp**：1Y 抵押补充贷款利率 1.75%→**1.50%**，直接降低政策性银行负债成本
2. **六张网纳入 PSL**：水网、新型电网、**算力网**、新一代通信网、城市地下管网、物流网（继 8 月《物流网建设实施方案》后又一网落地）
3. **科创再贷款 +2000 亿**：支持比例从 60% 统一提至 **100%**，额度 1.2 万亿→1.4 万亿
4. **支农支小再贷款 +5000 亿**（其中民营 +3000 亿）：额度 4.35 万亿→4.85 万亿

🟥 **10.1 房贷贴息（财金〔2026〕95 号，财政部+央行+金管局联合发布）**：
- **首套住房**（含二手）+ **≤120 ㎡** + **≤150 万元**（即总价 150 万、面积 120 ㎡以内的首套房）
- 财政按贷款本金给予 **年化 1 个百分点**贴息（≈目前首套商贷利率的 1/3）、最长 **5 年**、单户最高 **100 万元**贷款本金
- **中央：地方 = 90% : 10%**；经办银行**全行业覆盖**，"免申即享"自动扣减
- 100 万元 30 年期贷款，**最多累计减息近 5 万元**
- **Mavis 解读**：这是**中央财政首次对商贷贴息**。两个关键设计：①"100 万元本金上限"——精准锚定刚需；②"免申即享"——避免地方补贴"先到先得"弊端。**影响测算**：以首套商贷 3.1% 计算，1pp 贴息 ≈ 利率降至 2.1%，对一线城市 150 万以下二手房成交是直接刺激，但大城市"150 万以下"池子相对偏小，更利好二三四线刚需

**9 月新规日历**：
- 9.20：LPR 1Y 3.00%、5Y 3.50% 连续 16 个月不变
- 9.23-10.8：央行每日操作隔夜逆回购 ≤1 万亿（应对税期+国庆流动性）

      document.getElementById('briefDate').textContent = `${dateStr} · 编制 Mavis`;
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
