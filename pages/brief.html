## 📊 2. 一、宏观 + PEST

### 1.1 政策面 P

**📌 7.20 国务院常务会：四件事一揽子部署**
7月20日，李强主持国常会，部署四件事：①听取服务业扩能提质和"六张网"（水网、新型电网、算力网、新一代通信网、城市地下管网、物流网）规划建设督查汇报；②审议通过《知识产权保护和运用"十五五"规划》；③研究优化社会保障体系；④听取 2025 年度中央预算执行审计整改工作建议汇报。会议强调"扎实做好下半年各项工作，确保完成全年经济社会发展目标任务"。[[中国政府网]](https://www.gov.cn/)

> 💡 **Mavis 点评**：六张网是国家"十五五"基础设施投资的核心抓手，"算力网"首次进入国常会核心议题，呼应 AI 与新基建；知识产权"十五五"规划是科技自立自强的制度配套，**信号意义大于单点利好**。

**📌 7.22 财政部：上半年财政"积极发力、收支平稳"**
- H1 一般公共预算收入 **12.10 万亿 +4.7%**；支出 14.33 万亿 +1.5%
- 6 月单月财政收入 **+8.7%**（由负转正，所得税与进口相关税种支撑）
- H1 国有土地使用权出让收入 **9778 亿，同比 -31.5%**（本轮地产下行最大降幅）
- 上半年财政贴息约 **9900 万人次** 享受红利，四项相关贷款 +4.6%
- 房产税 +6.3%、城镇土地使用税 +2.6%（弥补部分卖地缺口）

> 💡 **Mavis 点评**：财政"前低后高"特征明显——6 月单月跳升至 +8.7%，但卖地收入腰斩式下滑 31.5% 拖累地方。**下半年专项债+特别国债提速**是必然，否则地方财政将面临"硬缺口"。

**📌 7.17 习近平 WAIC 主旨讲话 + 7.16-7.20 WAIC 2026**
- 习近平 7.17 在 2026 世界人工智能大会开幕式发表主旨讲话，提出"携手构建公正合理的全球人工智能治理体系"
- 大会四天 102 个国家和国际组织参会、1117 家企业、4486 项成果、351 款产品全球首发、**线下观众 40 万人次**
- 29 国签署《关于成立世界人工智能合作组织的协定》

> 💡 **Mavis 点评**：WAIC 今年的三个转变值得注意——①从"模型比拼"到"智能体落地"；②从"国际竞争"到"全球治理"；③从"概念展示"到"商业化签约"。**AI Agent 国标与互联标准**将是下半年的关键赛道。

## ✏️ 8. 七、编辑后记

今天的中国资本市场，呈现一幅**极端分裂的画面**——一边是 WAIC 智能体手机集中亮相、长鑫科技 666 亿募资创纪录、H1 集成电路出口 +88.7%、智能算力 +177% 的全面爆发；另一边是 30 年美债破 5.14%、霍尔木兹海峡被伊朗宣布"完全封锁"、布油冲 96 美元、地缘风险溢价系统性抬升。**国内 AI 算力产业链的强劲，与海外宏观脆弱性的加剧，构成了 2026 年最戏剧性的对比**。

如果要用一句话概括今天的核心矛盾：**"算力国产化的算术题 + 美债去全球化的应用题"**。算术题这边，长鑫的 666 亿募资+昇腾 950 的平替宣言+ AI Agent 国标，意味着"中国 AI 硬件底座"已经完成**算力 + 存储 + 互联 + 标准**的闭环；应用题那边，霍尔木兹风险、30 年美债破 5、美元指数 101 徘徊，意味着"旧美元体系"在 7 月的最后一周正在加速裂痕。

**Mavis 的独立判断**（仅代表个人，欢迎打脸）：

1. **🟢 长鑫的 666 亿募资是 7 月最大的产业事件**——这不只是科创板纪录，而是中国半导体"卡脖子"清单上**最后一张王牌打出**。HBM 仍差 2-4 年，但 DRAM 这条线已经能上桌打牌。**最直接的受益者是兆易创新（持股 1.8%）、长电科技（封测）、江波龙（模组）**。

2. **🟢 DeepSeek 梁文锋的"昇腾 950 平替 GB300"判断被低估**——"4 张顶 1 张，硬件落后 2 年"很诚实，但"AI 自己写代码建生态"才是真正改写游戏规则的事。CUDA 护城河不是被打破，而是被**绕过**。**1.6 万张昇腾 950 已经跑起来，一年内市场会重新评估国产 AI 芯片的真实可用性**。

3. **🟡 半导体板块 7.23 大跌不是趋势反转**——华虹 -12.58%、翱捷 -7.56% 是前期 AI 算力股获利了结+科创 50 指数技术性回调，**与长鑫上市、ASML 上调指引的产业基本面完全背离**。**8 月初中报披露季是检验主线真伪的关键**。

    // Init
    function init() {
      const stored = localStorage.getItem(STORAGE_KEY);
      const content = stored || DEFAULT_BRIEF;
      renderBrief(content);
      updateDate(stored);
    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function updateDate(isCustom) {
      const now = new Date();
      const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      const label = isCustom ? `${dateStr} · 今日已自定义` : `${dateStr} · 编制 Mavis`;
      document.getElementById('briefDate').textContent = label;
    }

    function openSheet() {
      document.getElementById('briefInput').value = '';
      document.getElementById('sheet').classList.add('show');
    }
    function closeSheet() {
      document.getElementById('sheet').classList.remove('show');
    }
    function loadBriefFromInput() {
      const v = document.getElementById('briefInput').value.trim();
      if (!v) { alert('内容不能为空'); return; }
      localStorage.setItem(STORAGE_KEY, v);
      renderBrief(v);
      updateDate(true);
      closeSheet();
    }
    function resetBrief() {
      if (!confirm('恢复默认嵌入的 2026-07-24 日报？已自定义的内容会清空。')) return;
      localStorage.removeItem(STORAGE_KEY);
      renderBrief(DEFAULT_BRIEF);
      updateDate(false);
      closeSheet();
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    init();
  </script>
