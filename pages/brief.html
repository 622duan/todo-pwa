## 📊 板块 3：宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面：房贷贴息落地 + 央行 PSL + 6 张网

**10.1 居民购房贷款贴息正式实施**（财金〔2026〕95 号）：这是**中央财政首次**对商业性个人住房贷款贴息，三部门联合发布。核心条款：

| 维度 | 标准 |
|------|------|
| 适用对象 | 首套住房（新房 + 二手房，不含存量贷款置换） |
| 住房门槛 | 建筑面积 ≤ 120 m²，总价 ≤ 150 万元 |
| 贴息力度 | **年化 1 个百分点**，贴息期限最长 **5 年**，**单户贴息上限 100 万元** |
| 财政分担 | 中央 90% + 地方 10% |
| 配套利率 | 贴息后首套利率约 2.0%，与中指院 6 月 50 城毛租金回报率 2.28% **差距显著收窄** |
| 财政成本 | 一年试行期累计约 **662 亿元**（浦银国际估算） |
| 银行响应 | 工/农/中/建/交/邮储六大行 9.30 集体公告，"免申即享"，按月自动扣减 |

**央行"四箭齐发"**（9.29 同日落地）：
- **PSL 利率 -25bp**：从 1.75% → **1.5%**（历史低位），同时将"六张网"（水网、电网、算力网、新一代通信网、城市地下管网、物流网）纳入支持范围
- **科技创新和技术改造再贷款**：+2000 亿 → 总额 **1.4 万亿**，支持比例上调至 **100%**
- **支农支小再贷款**：+5000 亿 → 总额 **4.85 万亿**（其中民营企业再贷款 +3000 亿 → 1.3 万亿）

**国庆楼市"回暖信号"**：
- 武汉 10.1-10.3 新建商品房销售额同比 **+10% 以上**
- 佛山 10.1 单日报备量 **破 5000 条**，带看量 1600+ 次；顺德 116 单领跑
- 江门 10.1 认购 145 套，1.61 万 m²，1.44 亿元
- 30 大中城市国庆新房成交面积同比 **+18%**（同比口径）

**📌 Mavis 点评**：房贷贴息不是新降息——**它是"定向降低刚需购房成本 + 中央财政出血"** 的精准设计。100 万贷款 5 年贴息累计 5 万，相当于月供减少 833 元，撬不动投机，但能让观望刚需出手。**央行 PSL -25bp + 6 张网扩范围**则是更硬的信号——政策已经从"楼市"切到"基础设施"，算力网首次被纳入 PSL 抵押贷款支持，是给 IDC / 算力中心/通信基建定向放水的明确信号。Q4 政策弹药库还有：10.16 二十届四中全会、12 月中央经济工作会议。

**📌 Mavis 点评**：DRAM 涨价的核心不是"短缺"，是"产能结构性转移"——三大原厂把 50% 产能塞进 HBM（AI 算力刚需），消费级 DDR5/DDR4 自然供给收缩。**长鑫利润率 82% 全球第一**是这一波最大的逆袭——它吃到的是三大原厂主动让出的市场。Q4 涨价已锁定（合约价已签），但**现货价先跌 + 合约价仍涨**通常意味着循环接近后段早期信号。**HBM 是中国存储的"圣杯"**——长鑫、长江存储、武汉新芯都在投，2027-2028 突破的话全球存储格局重写。短期最大风险是 2027 H2 海外原厂扩 NAND 产能 + 消费端疲软叠加，可能见顶。

### 8.4 编辑后记：3 个不那么显然的信号（v6 关键改动）

**信号 1：央行 PSL -25bp + "算力网"首次入列——这是 Q4 最硬的"卖铲子"信号，比房贷贴息更重要。**

央行 9.29 把 PSL 利率从 1.75% → **1.5%**（历史低位），同时**首次将算力网纳入 PSL 抵押贷款支持范围**。这意味着 IDC 运营商、算力中心建设方可以用极低利率（1.5%）拿到长期资金支持资本开支。**可验证判断**：① 10.16-20 二十届四中全会"十五五"规划建议里，**算力网 / IDC / 智算中心**大概率被列为"新基建"核心；② 10 月底 IDC 招标量、液冷设备订单、智算中心租赁价格会出现明显放量；③ 真正受益的不是 IDC 运营商本身（宝信软件 / 润泽科技 / 世纪互联），而是**上游设备**：电源（科华数据 / 科士达）、液冷（英维克 / 高澜股份 / 中石科技）、光模块（中际旭创 / 新易盛 / 天孚通信）。**风险点**：若 10.20 LPR 不降息 + 11.1 PMI 走弱，市场可能重新定价"政策力度"。

**信号 2：长鑫科技 Q2 营业利润率 82% 全球第一，但 2027 H2 NAND/DRAM 见顶风险已现——这是"国产存储从卷价格到卷价值"的范式拐点，但别冲太猛。**

长鑫 Q2 营业利润率 82%（三星 28% / SK 海力士 51% / 美光 35%），背后是三大原厂主动让出的市场 + AI 算力挤占消费级产能。**可验证判断**：① 长鑫 DDR5 已通过苹果 / 联想 / 戴尔 / 华为 / 小米等主流 OEM 认证，2027 年中国 DDR5 自给率将从 30%+ → 50%+；② **2027 下半年是 NAND 见顶窗口**（海外原厂扩产 + 消费端疲软叠加）；③ **HBM 是中国存储的"圣杯"**——长鑫 / 长江存储 / 武汉新芯都在投，2027-2028 突破的话全球存储格局重写。**风险点**：① 2027 H2 NAND 见顶预期 + 2027 H1 海外 DRAM 厂扩产周期回归，可能压制长鑫利润率；② HBM 国产化进展是中长期催化，不是 Q4 兑现点。**投资优先级：长鑫 IPO > 长江存储 IPO > 北方华创 / 中微（设备龙头） > 江波龙 / 兆易创新（消费级存储）**。

**信号 3：9.30 A 股地产板块"地天板" + 国庆 +18% 成交——这是"政策托底"和"基本面"的关键观测窗口，但 30 大中城市以外的三四线，依然是主跌区。**

深物业 A / 金地集团 9.30 "地天板"是市场对房贷贴息的**脉冲式反应**——短线资金兑现跑路 vs 抄底资金博弈 Q4 修复。但 30 大中城市新房成交面积同比 +18% 是真实的——这是**核心城市的局部回暖**，不是全国性反转。**可验证判断**：① 10 月 70 城新房价格指数若**连续 4 个月跌幅收窄**，决策层满意现状，Q4 不会再加码；② 若环比跌幅再次扩大，**10 月底-11 月初**可能出现"公积金缴存人专项消费券 / 补贴"为名的二次扩容；③ **雅居乐境外债务重组接近敲定**（51.83 亿$ 境外金融债务）是民营房企融资改善的明确信号，但仅限"已经爆雷但愿重组"的房企，**不是行业全面回暖**。**K 型分化加剧**：① 资金优先配置**财务稳健 + 核心土储 + 国资背景的头部**（保利发展 / 中海地产 / 招商蛇口 / 万科 A）；② 房地产后周期方向（中介 + 物业）能随交易量快速受益，可作为防御性配置（贝壳 / 碧桂园服务 / 华润万象生活）；③ 三四线 / 高负债 / 非核心地段房企压力继续。
