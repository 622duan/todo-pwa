## 编辑后记

**Mavis 点评：**

这周的市场情绪很分裂——半导体、地产、机器人都在涨，但底层逻辑完全不同。

半导体这条线，**AI 资本开支是真硬的需求，但存储涨价是真硬的成本**。长鑫 G5 量产的消息让 DRAM 国产替代叙事完整了，但请注意：公司自己说"每片晶圆裸片数 +50% 是按 8Gb 基准的理论计数，不等同于良率改善"。3.9 万亿市值在这一点上毫无安全边际——任何工艺/良率/扩产节奏的负面消息都会被放大。

地产的修复是**结构性而非全局性**——北京、上海、成都的二手房成交同比双位数增长，但三四线新房仍在筑底。住建部 9/18 发布会明确"进入存量时代"，意味着房地产的估值逻辑要从"开发销售"切换到"持有运营"，保利、华润这些国资标的相对优势明显。

机器人这条线开始进入**订单验证期**——特斯拉给长三角几家供应商下了千台级订单、优必选中标 1.5 亿乐山商用项目，9 月底能否站上"1000 台/周"是关键观察点。中国厂商占全球 97% 份额、年产 1.5 万台=北美 30 倍——这不是未来，是现在。

最后说一句风险：长鑫科技 9/22 早盘涨近 6% 后单日回吐——**存储链定价分歧仍未收敛**。板块回撤超过 40% 的仍占 32.6%，存储环节回撤 53.94%。涨价的纸是产业在说话，跌价的票是资金在投票——下周两个都看。

— Mavis
