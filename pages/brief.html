## 二、半导体产业链

### 2.1 半导体设备｜国产化率四层分化
- 🟥 **2026 全球半导体设备销售额预测 1659 亿美元，同比 +23.2%**（SEMI）；到 2028 年 2295 亿美元。
- 国产化率分层（一图看懂）：
  - **第一梯队（兑现）**：刻蚀设备 40-45% 国产化，中微公司（8800+ 反应台）、北方华创、拓荆领跑。
  - **第二梯队（红利期）**：薄膜沉积/清洗，拓荆 Q1 净利 +488%；华海清科放量中。
  - **第三梯队（弹性最大）**：存储测试设备国产化率仅 8-10%，长川科技 H1 扣非净利预增 110-134%。
  - **第四梯队（卡脖子）**：光刻 + 高端量测 < 10%；上海芯上微装 AST6200（350nm 步进）8/10 通过化合物半导体客户验证、获批量重复订单。
- **日本第三轮管制落地（2026 年 8 月）**：先进封装全链约 20 大类设备逐案审批，3-6 个月审批周期，驳回率 70-80%。
- 北方华创中标株洲中车时代半导体 PECVD 设备采购项目第一名。

### 2.2 半导体制造｜中芯华虹 Q2 双双创历史新高
- 🟥 **中芯国际 Q2**：销售收入 **30 亿美元**（+36.1% QoQ +20%），毛利率 25.3%（+5.2pct），归母净利 4.79 亿美元（**+261.7%**），月产能 109.65 万片（8 寸当量），产能利用率 93.7%。Q3 指引：收入环比 +2-4%，毛利率 26-28%。
- 🟥 **华虹宏力 Q2**：销售收入 **7.175 亿美元**（+26.8%），毛利率 16.5%（+3.5pct），应占利润 3860 万美元（**+385.9%**），产能利用率 **102.8%**（超满载）。独立式存储 +149.3%、嵌入式存储 +41.8%。
- AI 算力外溢：1 个 72 GPU 机柜配套电源管理芯片约 16000 个，需求从存储/逻辑外溢到 BCD 电源、模拟、接口芯片。
- 中国区收入占比：中芯 90.2%、华虹 78.6%。

### 2.3 半导体设计
- 芯原股份 H1 营收 +91.37%，但归母净亏损扩大至 6.12 亿元（去年同期亏 3.20 亿）。
- DeepSeek API 提价：摩根大通认为给 MiniMax 等"价格端"模型公司喘息空间，但核心竞争力仍需 M3.1 验证。
- 智谱 GLM-5.3 后训练升级：摩根大通上调智谱与 MiniMax 目标价。

### 2.4 存储｜AI 虹吸效应下的超级周期（结构性行情）
- 🟥 **DDR4 8Gb 现货价最新报 24 美元**（+14.3% MoM），创 DRAMeXchange 自 2016 年 6 月统计以来历史新高。
- 🟥 **HBM 缺口 50-60%**，2026 年 HBM 市场预计 +58% 至 546 亿美元，占 DRAM 市场近 4 成。海外三巨头已把 70% 新增/可调配产能转向 HBM，消费级产能被压缩至 < 20%。
- HBM3 24GB 12-Hi Stack 现货 199.58 美元/stack（同比 +4%）；HBM3E 36GB 12-Hi 300.24 美元（同比 +14%）。
- TrendForce Q3 预测：DRAM 合约价 +13-18%、NAND +10-15%（较 Q1 的 93-98% 大幅放缓）。
- 行业格局：HBM 最紧缺 → 服务器 DRAM 紧跟 → NAND 率先分化（消费级 NAND 率先走弱）。
- 长鑫存储 Q2 营收同比 +716%，以 7% 份额稳居全球第四。

**Mavis 点评**：📌 存储行业这轮已经不是"AI 抢了消费电子的产能"这个单线逻辑——本质是三星、SK 海力士、美光三家寡头的"联合定价选择"，叠加 80% 先进产能转 HBM 形成结构刚性。下游手机厂商只能接受涨价，小米、OPPO、vivo、苹果全行业跟进。这一周期至少延续到 2027 年底（小米卢伟冰判断），瑞银认为 DRAM 紧张持续到 2028 上半年。

### 2.5 手机｜全行业涨价潮
- 🟥 **安卓旗舰普涨 1000 元，部分累计 1500 元**；中端 +300-800 元；千元机因 BOM 中存储成本占比逼近 50% 出现负毛利，新品大量减产。
- **存储芯片在手机 BOM 占比**：从 10-15% 飙至 20-30%，中低端机型逼近 50%。
- 12GB LPDDR5X 内存 + 1TB UFS 4.0 闪存采购价：~200 元 → ~600 元（3 个月涨幅 80-95%）。
- 🟥 **iPhone Ultra（折叠）顶配或破 2 万元**，9 月发布；2nm 芯片单片晶圆报价 > 3 万美元。

## 八、编辑后记 · Mavis 私货

今天最值得划重点的 3 件事：

**1. "稀土 + 存储" 是中国在 2026 下半年手里最大的两张明牌**
- 稀土已经从"贸易摩擦筹码"升级为"全链条执法"，大连拘留日企高管是分水岭事件。
- 存储是 AI 算力革命的"卖水人"，中芯/华虹 Q2 业绩 + 长鑫 +716% + 北方华创中标，连环验证国产替代逻辑。
- 这两个赛道今年还有 1-2 个季度的红利窗口。

**2. "金九银十"前夜的"三箭齐发"**
- 6 张网 7 万亿 + 8000 亿政策性金融工具 + 2.3 万亿专项债，预计在 9-10 月集中形成"实物工作量"。
- 一线二手房连续 4 周回暖（+12.9% YoY），北京/上海政策松绑加码，是观察楼市是否真企稳的关键窗口。

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
