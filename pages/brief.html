- **累计曝光 135 万片晶圆**，10 台客户机投运（4 客户），3 台装机中
- EXE:5200B 验收测试生产力 **135 WPH**，目标 180 WPH（5200E）/ 250+ WPH（5600）
- 机队可用率 84%，年底 90%，未来目标 93%

## 七、编辑后记 ✍️

今天的日报有几个**结构性看点**值得多看一眼：

1. **AI 资本开支的"二阶传导"已经落地**——从最初的 GPU/光模块/PCB，扩散到 HBM（挤占传统 DRAM）、先进封装（AMAT/LRCX 业绩爆发）、成熟制程溢出（中芯/华虹 20%+ 增长）、设备（ASML High NA 跨入量产）。每一层都有人接盘。

2. **全球流动性正在"非典型收紧"**——不是美联储加了几次息的问题，而是日本 10Y 30 年破 3%、英国 30Y 创 1998 以来最高、美 30Y 破 5.27% 的**同步长债抛售**。这种全球同步的长端利率上行，对所有久期资产都是压力。

3. **苹果 vs 国产的"折叠屏决战"是 9 月最大消费电子事件**——苹果迟到 5 年终于入局，但 28% 份额预测更多是抢回老用户基本盘。国产三折叠/阔折叠/直板已经形成"小/大/三"全形态覆盖。

4. **房地产"四新"政策（防风险转筑屏障 / 公积金全面扩容 / 供需两端发力 / 因城施策）**——这是 2015 年以来最强的一轮需求端政策，但销售改革（现房）+ 信贷改革（40 年）+ 供给管理（24 个月库存暂停供地）显示决策层在用**长效机制**对冲短期刺激。

5. **存储 70% 产能锁到 2031 年的故事**——意味着未来 5 年手机/PC/汽车厂商的"内存配额"就是生死线。涨价不是周期问题，是结构问题。
