### 8.4 编辑后记（v5 关键改动）

**第一个：9.9 苹果发布会的真正意义不是 iPhone 18，而是 iPhone Duo。**

iPhone 18 Pro 9999 起、Pro Max 2TB 21499，是"例行升级 + 全系涨价 1000-3500"——本质是存储涨价（BOM 上升）向消费者转嫁。但 iPhone Duo 15999 起 + 10.16 预售，是苹果在折叠屏**迟到 4 年后的入场**。9.7 华为 Mate XT 2 19999 起、9.7 小米 18 Fold 破万、9.12 Mate XT 2 开售、9.18 iPhone 18 Pro 发售、10.16 iPhone Duo 预售——**4 款折叠机集中在 30 天内全部开打**。这不是"价格战"，是"高端卡位战"——每家都想用 9999+ 的产品线把 ASP 拉上去，对冲手机整体 -5.5% 的出货量下滑。**关键判断**：9.12 Mate XT 2 实际首销转化率（黄牛溢价 1000+ 已是信号）若 ≥50%，整个折叠屏品类在 H2 会再扩容 30%。

**第二个：华虹无锡三期 41.7 亿美元 + 台积电近 20 座晶圆厂 + Susquehanna "存储占半导体收入 50-55%"——三件事合起来讲的是，AI 周期从"概念"切到"重资产投入"了。**

中芯 Q2 营收 30 亿美元（+36% YoY）但 Q3 指引仅 +2-4%——不是需求不行，是产能顶到天花板（93.7% 利用率）。华虹 Q2 利用率 102.8%、独立式 NVM 同比 +149.3%——**AI 需求从存储扩散到逻辑/模拟配套芯片**。台积电 2026 设备采购预估 1→1.5→1.9 倍——**资本支出从"计划"升级到"抢购"**。Susquehanna 报告的"存储占半导体收入 50-55%"（历史区间 20-30%）——**半导体行业每赚 2 块就有 1 块多来自存储**。**关键判断**：9.30 美光 FQ4 业绩（营收指引 490-510 亿美元、毛利率 81%）如果兑现，整个存储板块还有 +20% 估值修复空间；如果 miss，整个"AI 资本开支转化收入"的故事会遭遇首次证伪。

**第三个：9.15 FOMC 加息概率 86.5%，是 9 月最大风险点。**

10Y 美债 4.97% 创 2023.10 以来新高、30Y 5.37% 创 2007.6 以来新高——长端利率的"二次冲顶"已经发生。芝商所 FedWatch 给 86.5% 概率、CNBC 称"交易员预计 90%"——**下周不加息才叫意外**。关键是"鸽派加息"还是"鹰派加息"——Lombard Odier 的判断是"鸽派加息"（解读为防范通胀，而非开启长期周期），但市场更担心的显然是后者。**关键判断**：如果 FOMC 措辞偏鹰（A 股 9.16 开盘首当其冲），北向资金可能再次流出 200-300 亿；如果偏鸽，AI 算力链（MLCC/PCB/CPO/光通信/存储）会再次领涨。**仓位建议**：9.15 当天把科技股仓位降到 50% 以下，等 FOMC 措辞明确再加回去。

**第四个：北京楼市"以价换量" + 9.20 公积金 9 类 + 8.28 现房销售 = 一套组合拳，9-10 月是验证窗口。**

8 月北京二手 1.4 万套（+3.9%）、9 月第一周同比 +26-31%——量是起来了。但价格 1-8 月累计 -4.58%——**量价背离**。核心矛盾是：政策在精准托底刚需（公积金 340 万），但**新房均价 1-8 月 +0.81% 是因为优质项目入市**，二手房整体还在磨底。9.20 公积金提取扩 9 类（装修 25 万 + 物业费）相当于**给存量房市场直接发消费券**——这是"金融十五五"规划的落地。**关键判断**：如果 9-10 月北京二手房连续 3 个月成交 1.5 万套以上，价格止跌信号就成立；如果继续"量增价跌"，说明政策只是托底、没拉涨，对全国楼市的示范效应会打折。

**第五个：铜 +17% YTD vs 黄金 +1.8% YTD，是 2026 年最反常识的资产对比。**

LME 铜 9.8 触及 14779 美元/吨历史新高，年内 +17%、过去 12 个月 +47%。**比黄金还猛**。背后是"美国关税预期 + 智利矿端 +6.7% YoY 减产 + AI 算力"三因子叠加。瑞银预测短缺从 2026 年 21.9 万吨扩大到 2027 年 37.9 万吨，目标价 2026 底 15000、2027 9 月 15500。**关键判断**：如果美国精炼铜关税 9.30 报告若延后，铜价可能短期回调 10%（9.10 已跌 3.5%），但中长期上行趋势不变。**操作建议**：铜股（江西铜业/云南铜业/紫金矿业）回调至 5 日均线是买点。
