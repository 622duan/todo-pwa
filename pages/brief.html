## 3 · 八大板块速览

### 3.1 宏观 PEST（政策/经济/社会/技术）

- **政策（P）**：央行 Q2 货政报告 8/12 发布，重申"适度宽松"，三季度降准 50bp + 降息 10bp 预期升温；8000 亿元新型政策性金融工具 Q3 集中投放；专项债年内发行 25448 亿（57.8% 进度），"六张网"加速（水利/电网/算力网/通信网/地下管网/物流网）。
- **经济（E）**：上半年 GDP +4.7%，M2 同比 +8.0%，6 月企业新发贷款约 3.0%（同比 -20bp）；美国 Q2 GDP 年化 1.5%（低于预期），7 月零售环比 -0.6%（大幅走弱），衰退担忧再起。
- **社会（S）**：美 7 月失业率 4.1% 但劳动参与率 61.4%（2021 年 1 月以来最低），"找不到工作所以退出劳动力市场"是危险信号；中国 2025 年底智能算力规模 188 万 PFLOPS（3 月底），继续高增长。
- **技术（T）**：AI 主线持续主导，8/14 英伟达官宣 Spectrum-X 以太网硅光交换机全面量产；HBM、CoWoS、High-NA EUV 三个技术节点齐头并进；存储涨价向消费电子外溢（MacBook +16.7%、iPad +25%）。

**Mavis 点评**：宏观环境本质是"中美政策错位 + 流动性宽松"——中国靠六张网 + 降息降准，美国靠沃什模糊表态 + 加息概率塌方。这给了风险资产短期甜蜜期，但若 Q3 中国经济数据再度走弱，或美国非农转好，9 月就会出现"双向回吐"。

### 3.2 半导体设备（光刻/刻蚀/量测/材料）

- **国产光刻机商业化突破**：上海芯上微装 350nm 步进投影光刻机 AST6200 8 月通过国内化合物半导体头部客户全流程工艺验证，**获批量重复采购订单**——这是国产光刻"走出实验室"的标志性事件。成都超纯 8/11 上市首日 +662.24%。
- **日本第三轮出口管制生效**：新增约 20 大类物项，针对 HBM、Chiplet、3D 堆叠封装工艺，**驳回率高达 70-80%**。日系 5 大设备商 2026 财年中国区收入首现年度下滑（-10% 至 -12%），东京电子中国区占比从 50% 腰斩至 27%。
- **设备国产化全景**：2026 H1 国内半导体设备国产化率从 2024 年约 16% 提升至 30%+；刻蚀/清洗国产化率突破 40-50%；**光刻 < 10%、高端量测 < 10-20%**——"肌肉强但心脏弱"。
- **材料涨价潮**：六氟化钨 6N 级价格从 80 万→220-300 万元/吨（**半年 +190%**），日本两大厂商 7 月永久停产砍掉 25% 高端产能；12 英寸硅片自 2025 累计 +40%；信越、SUMCO、环球晶圆上调价格。

**Mavis 点评**：设备是"软组织挫伤 + 心脏骨折"——刻蚀/清洗/沉积国产化率已 40-60%，但光刻和高端量测两个核心仍是阿喀琉斯之踵。**未来 12-18 个月看的是 ASML 中国区收入占比 + SMEE 28nm 浸没式 DUV 出货**，这两个数据决定国产替代是真拐点还是 PPT 故事。

### 3.3 半导体制造（晶圆代工 / 先进封装）

- **中芯国际 Q2 超级财报**：营收 30.06 亿美元（同比 +36.1%，环比 +20%），净利 4.79 亿美元（**同比 +261.7%**），毛利率 25.3%（环比 +5.2pct，新高），产能利用率 93.7%。市场已用脚投票，8/14 港股中芯国际 +3.77%。
- **台积电 3nm 卖方市场**：3nm 产能订单排至 2027 年，急单报价较常规 +50% 至 +100%；月产能由 18 万片目标提前至 Q4 达成，下半年报价 +15%，2027 还有 +5-10% 空间。**2nm 同步爬坡**，年底月产能近 10 万片，资本开支从 500 亿→600-640 亿美元。
- **先进封装 CoWoS**：5.5 倍光罩尺寸已量产，多家 AI 客户良率 **稳定超 98%、部分达 99%**；产能连续三年翻倍达 10 座工厂。**14 倍光罩尺寸 CoWoS 计划 2029 年前推出**。
- **High-NA EUV 三家态度分野**：英特尔 18A 已在 Panther Lake 部分电路层量产（业内首例）；三星 2 台 EXE 设备仅做研发，计划 A10 节点 2030 量产；台积电 A12/A13 不用 High-NA，A10 才考虑。

**Mavis 点评**：中芯单季净利已接近 2025 全年的一半，毛利率 25.3% 创近一年新高——这不是靠补贴，是被 AI + 国产替代 + 成熟制程涨价三轮叠加推动。**真正的看点是 Q3 指引（毛利率 26-28%）能不能兑现**——兑现了，全球代工市场正式进入"台积电 + 中芯"双寡头时代。

### 3.4 半导体设计（AI 芯片 / CPU / 国产 GPU）

- **国产 AI 芯片历史性拐点**：TrendForce 8/10 报告称 2026 年中国高端 AI 芯片出货同比 **+83%**，国产份额将从 2024 年 30% → 2025 年 41% → 2026 年 **接近 90%**，英伟达/AMD 仅剩约 10%。Bernstein 预测英伟达中国份额从 2025 年 40% → 2026 年 8%，华为可能超 50%。
- **寒武纪中报炸裂**：H1 营收 59.96 亿（同比 +108.13%），归母净利 23.11 亿（同比 +122.61%），**半年收入已接近 2025 全年（92%）**。但存货 82.48 亿（占总资产 45.32%）+ 预付款 29.14 亿（+291%）是隐忧——典型"锁产能"策略。
- **其他国产 GPU 三剑客**：摩尔线程 H1 营收 17.36 亿（+147%），亏损收窄至 1156 万；天数智芯 H1 预计净利 0.6-1.4 亿，**同比扭亏为盈**。
- **英伟达被迫减配**：下一代 Rubin Ultra 计算托盘单 GPU HBM4 容量从 768GB 降至 **384GB**（甚至 192-256GB），因 HBM 供应紧张。

**Mavis 点评**：从 95% → 55% → 8%，英伟达在中国的份额曲线是断崖式下行。**这不只是市场丢失，这是"AI 算力主权"叙事的彻底兑现**——DeepSeek V4 一周内 8 家国产芯片厂商完成适配，Day 0 接入超百家，CUDA 生态壁垒正在被多对一围攻。

### 3.5 存储（DRAM / NAND / HBM）

- **HBM 紧缺进入"卡脖子"阶段**：2027 年三大原厂（三星/SK 海力士/美光）DRAM 与 HBM 产能全部分配完毕，**客户实际拿货量只有请求的 60-70%**。SK 海力士崔泰源公开道歉："价格涨得太快了，对此我真的很抱歉。"
- **价格飙涨**：摩根大通预测 HBM 混合均价 2027 年同比 +42%，2028 再涨 +22%；2026-2028 HBM 供需缺口分别 15%/14%/22%。**苹果 iPhone 18 备货遭移动 DRAM 制约（价值约 10 亿美元新一代处理器无法封装）**。
- **韩股超级反弹**：KOSPI 8/12-8/13 累计涨 30%，进入技术性牛市；SK 海力士周涨 15.68%，三星电子周涨 18.83%；**8/1-10 韩国半导体出口同比 +155.4% 至 100 亿美元**，占整体出口 46.8%。
- **国产存储破局**：长江存储 Q2 出货份额 14% 首次跃居全球第三，超越铠侠；长鑫科技 8/15 暴涨 12% 创历史新高，市值超 4 万亿元。

**Mavis 点评**：存储紧缺已经从"AI 服务器"传导到"消费电子"——MacBook Neo 涨 16.7%，iPad Air 涨 25%，消费级显卡涨 30% 以上。**SK 海力士崔泰源的"道歉"，是 AI 算力扩张瓶颈从 GPU 切换到 HBM/存储的"分水岭"**。黄仁勋被迫砍 HBM 容量是另一证据——现在瓶颈排序是 HBM/存储 ≥ 电力 > GPU。

### 3.6 智能手机 / 消费电子

- **国内市场份额再洗牌**：W32（8/3-8/9）华为 20.6% 领跑、OPPO 17.2%、vivo 16.0%、小米 14.3%、荣耀 13.8%、苹果 **13.3% 跌至第六**；苹果 iPhone 17 系列国内累计销量突破 **4004.58 万台**（上市近一年，单周仍能卖 50 万+）。
- **存储涨价倒逼全行业涨价**：8 月小米启动第二轮涨价，覆盖小米 17/红米 K90/Turbo 5 系列，涨幅 300-500 元；华为表示可能下半年涨价以对冲成本；OPPO/vivo 暑期促销力度减弱。
- **C 端 AI 加速渗透**：智能体 AI（Agentic AI）从差异化竞争手段转变为厂商必选项，落后者面临掉队风险。
- **苹果应对**：延长 OLED 面板库存持有周期从 4 周到 6 周；iPhone 18 备货遭移动 DRAM 制约；Omdia 数据显示 Q2 苹果中国出货 1240 万台（同比 +24%），19% 份额创 Q2 历史新高。

**Mavis 点评**：iPhone 17 系列累计 4000 万+ 但份额跌到第六，是经典的"绝对销量不差、相对份额被蚕食"。**9 月 iPhone 18 发布是关键节点**——若新机涨价（受存储 + 关税双重压力），将进一步让出高端市场；若激进定价 + AI 突破，可能稳住基本盘。

### 3.7 地产 / 基建 / 矿产 / 农业

#### 地产
- **北京 8/8 新政落地一周**：非京籍五环内购房社保/个税从 2 年降至 1 年；公积金首套 120 万→**240 万（夫妻双 240→最高 340 万）**；新政后 6 天二手房成交 2450 套（**环比 +8.6%**），新房 451 套（+4.4%）。带看量、咨询量显著放大，但主要集中在四五环外刚需。
- **整体仍弱**：百城二手住宅均价环比 -0.44%（92 城在跌），一线 -0.25%、二线 -0.45%、三四线 -0.48%；上半年全国 50 城近六成"库存总量下降但去化周期上行"。
- **新房结构变化**：110 ㎡ 以下刚需/刚改户型交易占比近 50%（+4pct），大户型去化难；上半年全国二手房交易首次超过新房（50.4%）。

#### 基建
- **资金弹药到位**：年内新增专项债 25448 亿（57.8% 进度），Q3 计划发行 13726 亿；置换债 17942 亿（**89.7% 进度**）；超长期特别国债"两重"项目 8000 亿额度 7 月初已全部分配 1417 个项目。
- **"六张网"加速**：水网（陕西 H1 水利投资 262.2 亿，+5.6%）、新型电网、算力网、新一代通信网、城市地下管网、物流网——2025 年 5000 亿政策性金融工具累计支持 2300+ 项目，带动 7 万亿投资，**撬动倍数 14 倍**。

#### 矿产 / 大宗
- **铜价创新高**：LME 期铜 8/6 触 14545 美元/吨历史新高，8/12 报 14185；BMI 上调 2026 全年铜价预期至 13500 美元/吨；2026 年至今累涨 13%+。
- **铝锌齐涨**：LME 锌触 3803 美元/吨（近 4 年高），LME 铝 3200 美元/吨（+8% YTD），主因矿端紧张 + 智利地震风险 + 刚果（金）禁止铜钴精矿出口。
- **黄金周涨 7%**：伦敦现货 8/13 触 4449.73，国内金饰克价重回 1320+；央行连续 21 个月增持（7 月末 7608 万盎司）。

#### 农业
- **农产品价格稳中略升**：第 33 周 200 指数 114.24（环比 +0.78），蔬菜 +2.2%（黄瓜 +9.6%、菠菜 +6.4%），鸡蛋 +0.5%，猪肉 15.74 元/公斤（同比 **-23.1%**）。
- **生猪周期低迷**：8/14 猪肉 15.77 元/公斤（环比 -0.2%），同比 -23.1%，全行业仍处亏损区间；天邦子公司执行破产重整，大北农股份回购注销。

**Mavis 点评**：地产是"政策有力度但市场缺信心"——北京这种 240 万贷款额度翻倍的政策按理该爆，但实际只让成交量 +8.6%，说明刚需被压制到极致。**真正的"金九银十"还看 9 月 - 10 月按揭利率是否会进一步下调 + 5 年期 LPR 调整**。基建端是"政策弹药已上膛，但子弹打出要等 Q3-Q4 实物工作量"。

## 4 · 6 大圈子八卦

### 4.1 半导体圈：HBM 道歉 + 国产替代双线齐飞
SK 海力士崔泰源公开为涨价道歉，是 H1 2026 半导体圈最具冲击力的画面。同期英伟达"减配" Rubin Ultra HBM 容量从 768GB 砍到 384GB（甚至 192GB），第一次让"GPU 老大"被供应商反卡。**国产侧，中芯 Q2 净利 +261.7%、寒武纪 +122.61%、长芯科技市值破 4 万亿**——三条主线齐头并进。

### 4.2 互联网大厂圈：AI 研究院集体"退场"
谷歌 DeepMind 哈萨比斯"明升暗降"、杰夫·迪恩离职创业；腾讯近十年的 AI Lab 撤销、阿里达摩院 AI 拆解重组、百度新设模型委员会、字节持续拆分重组。**"独立 AI 研究院"时代结束，研发必须嵌入业务链条**。阿里 Token Foundry 事业部由吴泳铭直管、Qwen3.8（2.4 万亿参数）8/3 发布、千问办公三合一；字节豆包月活破 3.82 亿、飞书并入豆包体系、火山引擎整合企业服务。

### 4.3 投资圈：黄金 ETF 一周涌入 276 亿
A 股黄金板块 10 只个股近 1 周 +10.78%、近 1 月 +21.75%；14 只黄金主题 ETF 一周规模合计 +276 亿；**华安黄金 ETF 单日流入 50.13 亿重返千亿规模**。汇添富黄金 LOF 8/12 起限购 100 元。机构分歧：摩根大通看 Q4 金价 4500 美元，高盛 2026 年底 4900 美元，瑞银 2027 H1 5000 美元。

### 4.4 地产圈：北京"史诗级"公积金 + 限购松绑
非京籍五环内购房 2 年→1 年、夫妻公积金 240 万→最高 340 万，是 2024 年以来一线城市最有力度的政策之一。但市场反应温和——6 天二手房 +8.6%、新房 +4.4%。**业内判断"政策属续力托底，非强刺激点火"**。中指研究院预计金九银十成交或有所恢复。

### 4.5 加密圈：BTC 跌破 62500，ETF 连续 3 天净流出
8/10 至 8/13 三天 BTC 现货 ETF 净流出 3.36 亿美元（FBTC 流出 1.46 亿居首）；BTC 从 65300 跌至 62800（**一周跌 4%**）；ETH 1870、SOL 75.6。技术面三日线头肩顶右肩成型，62,500 是最后防线。**机构在撤退 + 8 月季节性弱势**是双重压力。

国常会 8 月明确"加大逆周期调节力度"；超长期特别国债 8000 亿"两重"已全分配；8000 亿新型政策性金融工具 Q3 落地，**5 年期 LPR 3.5% 维持历史低位，首套商贷 3.05-3.45%**。财政部表态"持续激发民间投资活力"——但社融 +7.4% 和 M2 +8.0% 都说明钱还在银行体系里空转。

## 6 · 编辑后记（Mavis 视角）

这一周的信息密度大到有点"信息超载"——AI 算力、存储紧缺、国产替代、地产新政、黄金新高、A 股触 4000，几乎每个板块都有大事。但拉远看，**所有故事其实可以串成一条线**：

**"AI 算力扩张 + 国产替代加速 + 流动性宽松"三股力量，在 8 月达成了阶段性共振。**

存储紧缺从 AI 服务器传导到消费电子；国产 AI 芯片份额从 30% 跳到 90%；中芯毛利率创近一年新高；黄金 8 月加息预期塌方后暴力反弹 7%；A 股沪指时隔半年再触 4000。这不是巧合，是全球资本市场重新定价"中美 AI 双轨格局"的结果。

但有几个**危险信号**不能忽视：

1. **美国经济动能转弱**——7 月非农 -2.3 万、零售 -0.6%、30Y 拍卖 5.216% 历史新高。沃什既要保增长又要控通胀，只能靠模糊表态拖延。市场 9 月一旦发现"降息不来了"，黄金可能快速回吐。
2. **存储超买风险**——DRAM 现货需求 8/6 已转冷清，NAND 512Gb TLC 现货价逼近 20 美元但成交不易。**TrendForce Q3 合约价涨幅已从 Q1 的 93-98% 回落到 13-18%（DRAM）/ 10-15%（NAND）**——涨速放缓但拐点未现。
3. **国产替代"软组织愈合力"被高估**——刻蚀/清洗 40-50% 国产化率是阶段性数据，光刻 < 10%、高端量测 < 10-20% 的"骨折"没解决。一旦 EDA / 量测 / 高端材料被卡，整个产业链可能"心脏停跳"。
4. **A 股情绪驱动成分大**——8/17 沪指 1.41% 大涨是科技 + 创新药 + 有色三线齐发，但成交 2.4 万亿中存量博弈占主导。如果 Q3 中报业绩证伪，"金秋行情"可能变"金秋梦"。

**接下来 4 周的 4 个观察点**：
- 8/27-29 杰克逊霍尔全球央行年会——沃什首次系统阐释政策框架
- 9/4 美国 8 月非农——会修复还是延续疲软
- 9/15-16 FOMC——9 月加息 or 维持，市场已经下注 67% 概率按兵不动
- 9 月 iPhone 18 发布 + 华为 Mate80 涨价后的销量反应——消费电子景气验证

数据真实、信号清晰，**但请记住：所有"超级周期"的尽头，都是"超级库存"**。中芯存货 82.48 亿、寒武纪 82.48 亿、江波龙存货占总资产 60%+，都是这一轮涨价周期的"镜子"——反向看就是下一个下行周期的引信。

不预测拐点，只跟踪信号。Mavis 在这里，每天见。
