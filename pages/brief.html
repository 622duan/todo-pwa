**关键制度变化（重磅）**：10/19 金融街论坛年会上，央行行长潘功胜明确 **"研究择机把央行公开市场主要操作品种的期限切换为隔夜"**，公开市场隔夜回购利率将成为主要政策利率；同时推动贷款定价从单一 LPR 转向 **"LPR+DR001"多元基准**，并退出存贷款基准利率。DR001 基准利率贷款自 7 月首单落地海南以来，已有 **24个省份**落地 **百余笔**。

**Mavis 点评**：🟡 "换锚"不是降息，但它把降息的门槛降低了。隔夜利率大概率低于 7 天期，资金中枢自然向 DR001 收敛，贷款利率下限被市场利率压低——所以银行会**非对称降息**：贷款利率降得快、存款利率降得慢，净息差继续收窄。真正的验证点在 **11月10日 LPR**。

**Mavis 点评**：🟥 这轮周期最反常的地方是**利润率**：一家卖标准品的存储厂做出 **80%** 营业利润率，在几十年存储周期史上几乎没有过。原因是交易方式变了——14家客户长协锁住 2027—2028 一半产能。但晨星点破的是要害：**长协锁的是量，不是价**。一旦长鑫的 26万片/月 DRAM 产能规模释放（对标美光 33万片），80% 的利润率就撑不住。可验证判断：**2027Q1 前后看 TrendForce 一般型 DRAM 合约价是否跌回个位数涨幅**——如果跌了，说明长协开始被违约/重谈，存储板块会杀估值。

### 8.4 编辑后记（v6 关键改动）

**第一个信号：SK海力士的 80% 营业利润率 + 长鑫的 4F² 架构 + 中国设备零部件 8% 国产化率——这三个数字合起来才是完整故事。**

单独看，SK海力士 632% 的利润增速是"AI 存储超级周期"的证据；单独看，长鑫 4F² 架构是"国产替代进展"的证据；单独看，零部件 8% 国产化率是"国产设备还有巨大空间"的证据。但放在一起，画面完全变了：SK海力士用 14 家客户长协锁住 2027—2028 一半产能、DRAM/HBM 售罄到 2029 年，代价是**放弃了在存储扩产周期里的定价自由**——因为客户下单量已达其供应能力的 2 倍以上，也就是说它的产能早被预定了。而长鑫 4F² 一发布，SK海力士股价单日跌超 10%，说明市场立刻开始为 2027—2028 的供给释放定价。问题在于，新产能不是从天上掉下来的：它要靠设备，设备要靠零部件，而零部件国产化率只有 **8%**、美国占 59.7%、日本占 26.7%，且北方华创已经公开承认"受个别供应商物料交付紧张影响，部分订单交付存在一定压力"。**可验证判断：2027 上半年国内存储扩产的实际速度，瓶颈不在晶圆厂扩产决策，而在国产零部件能否跟上设备排产。**盯富创精密、珂玛科技、正帆科技、新莱应材的合同负债与交付周期——如果这四家 2026Q4 到 2027Q1 的合同负债没有连续两个季度环比增长，2027 年的存储供给释放就会慢于市场预期。反过来说，如果它们连续放量，说明国产存储产能释放会快于长协锁量的速度，2027 年存储价格回落的时点会早于 2027Q1。

**第二个信号：Q3 中国手机出货 -15.2%，而同期中国集成电路产量和工业利润是历史最好——这个背离本身就是最强的信号。**

IDC 明确写出因果链："存储及其他元器件成本大幅上升所引发的终端价格上涨与产品配置方案调整，已开始明显抑制消费需求。" 上半年手机出货只跌 4%，Q3 突然跌到 -15.2%，拐点就是存储 ASP 环比涨 20% 高段那两个月。但更有意思的是**结构**：600 美元以上高端份额同比 +7.1pct，200 美元以下低端 -13.9pct。**这不是消费升级，这是消费降级伪装成的高端化。**真正的验证条件是可查的：IDC 说 2027 年大部分时间仍将延续下滑，而折叠屏已连续 4 个季度 -32.7%——**"折叠屏等高端"恰恰是跌得最狠的品类**，说明高端市场的增长主要来自价格带划分的重新贴标签，不是真实需求扩张。可验证判断：**2027 年 1 月的 Q4 出货报告里，看华为/vivo/OPPO 在 600 美元以上的绝对出货量（而非份额）**——如果份额涨了但绝对量跌了，那就是纯价格带上移；只有绝对量也涨，才说明高端需求真实存在。这条判断直接决定了对存储涨价持续性的看法：**如果终端只买得动 3000 元的手机，存储涨价的承受力就只到 2027 年上半年为止。**

**第三个信号：8000 亿政策工具 10/28 同日打光 + 专项债发行进度 81% 低于近三年均值 86.8% + 1—9 月固投 -7.2%——这三件事讲的是"钱到位了但项目还没启动"。**

8000 亿全部投放完毕是好消息，但要看清它的性质：这笔钱是补充**项目资本金**的，不是工程款。国开行 3650 亿涉及项目总投资 5.5 万亿——撬动比 15 倍，可撬动的前提是项目本身已经立项、只差启动资金。而专项债进度 81%（低于去年 83.2%、低于近三年均值 86.8%）说明，**真正卡住投资的不是缺钱，是项目和审批**。再看微观：1—9 月固投 -7.2%，但 9 月基建相关行业中信息传输业投资 +30.8%、航空水上运输 +10% 以上——**增长完全集中在"六张网"里的算力网和交通网，而传统基建和地产链在塌**。可验证判断：**看 11 月和 12 月的专项债发行是否冲高，以及 2027 年 1 月公布的投资数据里"六张网"投资增速能否维持在 30% 以上**。如果 12 月专项债仍未冲高、且"六张网"以外的投资继续两位数下滑，那么"8000 亿撬动10万亿"这个叙事就只在报表上成立，**实物工作量的兑现要推迟到 2027 下半年**，届时 15.5% 的工业利润累计增速大概率已经回落。

**第四个信号（短，但决定 11 月节奏）：美联储 10:2 + 中国10Y 1.62%——34年以来的极致中美利差，配上黄金 4051 美元的"抗跌"，说明市场在同时定价两个不兼容的剧本。**

美联储 10/28 以 10:2 维持 3.75%—4%，库克和哈马克两位票委**明确主张加息 25 个基点**——这是 2023 年 7 月以来第一次出现"少数票要求加息"出现在"暂停"决议里，高盛资产管理的首席投资官直接给出"12月 + 2027Q1 加息、10Y 美债冲 5.25%—5.5%"的路径。但同期 COMEX 黄金在 4081 一线、10 月 28 日只跌了 23 美元，几乎没跌——**如果市场真的相信 12 月加息，黄金早该破位了**。这说明市场内部有两条腿：一条腿在交易"12月加息"（美债 5.0175%、铜 COMEX 溢价 200—250 美元），另一条腿在交易"地缘 + 财政 + 通胀螺旋下的长期避险"（黄金 4051 不跌）。对 A 股的直接含义是：**人民币 6.6669 和中国 10Y 的 1.62% 定价的是"国内不需要降息"，而这个定价成立的前提是 11 月 10 日的美国 CPI 不能超预期、11 月 6 日的 NFP 不能太强。**验证条件极其明确：**11/6 NFP 若新增就业超预期 + 11/10 核心 CPI 环比 ≥0.3%，那么"美债 5%+人民币破 6.75+黄金 3900"的组合会在 24 小时内同时出现**——那时候 A 股的成长股和港股会先崩，因为它们是外资定价权最重的资产。这两个日期是 11 月唯一真正的胜负手。

        const filename = `daily-brief-${dateStr}.md`;

        a.href = url;

        document.body.appendChild(a);
        a.click();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

      }
