## 🌐 8 大板块（深度拆解）

### 一、宏观 PEST

**🟡 政策** — 央行 9/4 公告 9/7 等量续作 5000 亿 3M 买断式逆回购，结束此前 2 个月加量续做（7、8 月各加 2000 亿）。9 月 1–4 日 7 天逆回购操作量 **连续为零 / 50 亿地量**，DR001 持续运行在 1.35–1.40% 政策利率下方。东方金诚王青、中信证券明明均认为这是央行"灵活摆布工具品种、避免利率向下大幅偏离政策利率"。

**🟢 财政** — 8000 亿新型政策性金融工具加速落地。9/1 周新增专项债 620 亿，环比 -1246 亿；月计划完成度仅 5%（月初节奏慢），但累计进度追平 67%（同比仍慢 7.6pct）。

**🟢 经济** — 8 月制造业 PMI 回升 0.6pct 至 49.8%（官方），产需双扩；标普全球 8 月中国制造业 PMI 51.5% 连续 9 月扩张、出口新订单 6 月最快。1-7 月规上工业企业利润同比 **+17.6%**。

**🔴 外部** — 9/2 沃什在杰克逊霍尔偏鹰讲话（PCE 2% 不动摇、关注 AI 资本开支的二阶导），9 月 FOMC 加息预期从 ~40% 飙至 **~50–70%**；10Y 美债 4.79% 近 19 月高、30Y 5.21% 创多年高、30Y 日债 4.19% 历史高、30Y 英债 5.82% 创 1998 年来高。

**🟡 汇率** — 人民币 6.72 区间窄幅波动，中间价持续高于即期（逆周期因子发力稳汇率）；9 月美中贸易全国委员会代表团访华，李强会见。

> **Mavis 点评**：央行"等量续做"是技术性操作而非转向，9 月 MLF 整体仍有望加量。真正压市场的不是中国，是 9/16 FOMC + 美伊地缘两条线。A 股下月定价总体中性，**靠业绩、不靠估值**。

### 二、半导体产业链

**🟢 设备（海外/国产双爆）**
- **应用材料 (AMAT) FY26Q3**：营收 91.2 亿美元同比 +25%（超预期 89.9 亿）、Non-GAAP EPS $3.50 同比 +41%、Q4 指引 102.5 亿 ± 5 亿；半导体系统营收 70 亿创纪录，DRAM / HBM 包装同比 **+52%**；客户能见度延伸至 2030 年。年内股价 +77% 跑赢道指。
- **ASML**：UBS 把目标价从 2050 → **2350 欧元**；2026 总净销售指引 430-450 亿欧元（年初 360-400 亿）；High-NA EUV 累计加工 135 万片晶圆，EXE:5200B 吞吐 135WPH。9/1 现货 1665 欧元。
- **国产突围**：北方华创营收 +24.9%、中微公司营收 +34.89% 利润 **+300%**、盛美上海 / 拓荆 / 华海清科 2026 营收均破 10 亿美元。德意志银行预测国产设备今年占中国晶圆制造设备市场 **25–30% 份额**；三星 / SK 海力士正在测试中微刻蚀机。

**🟢 制造（台积电 +19 倍扩产）**
- 台积电侯永清 9/2 表态：全球近 20 座晶圆厂同步在建（台湾 13 + 海外 5-6），季度设备采购预估上调至去年 12 月预测的 **1.9 倍**，30 年未见之增速。
- Q2 全球专业晶圆代工营收同比 +29%，**台积电 73% 市占**（连续 2 季第一）、中芯国际 5% 创历史新高。
- 台积电 CoWoS 明年产能 **全部预订**，部分客户转投英特尔 EMIB-T；通富微电与富士通共建 Fan-Out WLP / FC-BGA 研发中心。

**🟢 设计（ASIC + GPU 双线）**
- **博通 (AVGO) FY26Q3**：总营收 295.91 亿同比 +86%，**AI 半导体 167 亿同比 +221%**；CEO 陈福阳指引 FY27 AI 收入翻倍至 1150 亿、FY28 再翻倍至 2300 亿；CFO 确认 FY27 起在新加坡工厂生产基板。
- **英伟达 35 亿美元认购联发科可转债**（8/31 创海外直投新高），通过 NVLink Fusion 接入定制 XPU 生态；联发科 2026 AI 芯片目标 20 亿美元，2026 AI ASIC 市场份额冲击。
- 长川科技主力净流入 11.52 亿（AI 算力受益）；中际旭创 H1 营收 417.78 亿 +182.49%，归母 136.51 亿 +241.7%。

**🟢 存储（超级周期 + 国产超车）**
- **长鑫科技 (CXMT)**：H1 营收 1503 亿同比 +874%、归母净利 776 亿（去年同期亏 2.33 亿），LPDDR6 **8/29 量产**，首发小米 18 Fold（12.8 Gbps 速率、最高 16GB 容量）。
- **兆易创新**：H1 营收 115.66 亿 +178.67%，归母 68.57 亿 **+1091.50%**；管理层指引 DRAM 下半年温和上行、SLC NAND 景气周期至少延续 2027 全年。
- **DRAM 价格**：DDR5 16Gb 现货 $54.24 同比 +480%；DDR4 8Gb 同比 +860%；Retail DDR5 64GB Kit 30 日 +24.74%；TrendForce 预计 Q3 一般型 DRAM 合约价环比 +13-18%、NAND +10-15%。
- **机构观点**：摩根大通上调全球内存市场预测，2027-2028 仍供应紧缺；美光 / SK 海力士 CEO 称短缺或延至 2030。

**🟢 手机（涨价潮 + 苹果躺赢）**
- **iPhone 17 系列累计销量 4119.9 万台**（截至 W34，全球第一），单 iPhone 17 占全球出货 6%。Counterpoint Q2 全球前十 iPhone 17 系列包揽前三、合计 26%。
- 华为 Mate 80 系列 881.88 万、小米 17 系列 608.37 万、vivo X300 系列 366.93 万、OPPO Find X9 293.1 万、荣耀 Magic8 162.84 万。
- 受存储涨价影响，国产手机集体涨价 200-1000 元，门店"门可罗雀"，苹果成最大赢家。
- 9/7 华为 Mate XT 2 / 9/10 苹果秋季发布会、荣耀 Magic 9 / 小米 18 Fold 密集官宣。

> **Mavis 点评**：设备 → 制造 → 设计 → 存储 四条线齐爆，**这是 AI CapEx 的"二阶导"在产业链的全面兑现**。应用材料那句"客户能见度到 2030"是今天最值钱的信号。但要警惕：**博通 + 长鑫 + 兆易 = ASIC + DRAM + 利基 NAND**，国产替代从"可选项"变成"必选项"。

- 8/28 四部委《关于完善商品住房销售制度的通知》落地：现房销售"优先"、老项目老办法、新项目新办法；房贷发放延后至销售备案 / 竣工备案后（"一手交钱一手交房"）；证监会同步发房企融资新规，**主体信用 → 项目信用**。

今天是 2026 年 9 月第一个完整交易周结束，主题词就一个词：**"切换"**。

切换一：**科技 → 农业 + 消费**。本周传媒 +251 亿、白酒 +32 亿、养殖 +17 亿净流入；半导体 -383 亿、芯片概念 -202 亿、新材料 / 资源股 -313 亿。不是科技不行了，是**AI 兑现的二阶导**已经反映在股价里，资金开始找下一站 — 猪周期反转、白酒三底共振、传媒 AI 降本。

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
