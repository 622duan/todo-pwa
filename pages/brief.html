## 板块 1 · 宏观 PEST（政策/经济/市场/利率）

### 🏛️ 政策面：地产 + 货币双管齐下
- **8/7 北京楼市新政重磅落地**：非京籍家庭购五环内住房社保/个税从 2 年→**1 年**；夫妻双方公积金首套 120→**240 万元**、二套 100→**200 万元**；多子女/绿色建筑可上浮 60-100 万元；父母赠与不再核验子女购房资格。
- **政策对标沪深**：限购放松程度已与上海、深圳接近；公积金贷款利率低于商贷，**实质"变相降息"**。
- **国务院《扩大消费"十五五"规划》**：住房消费列入大宗耐用商品消费范畴**首位**。
- **央行 7 月 LPR 维持**：1 年期 3.0%、5 年期以上 3.5%（连续 8 个月不变）；1 月已下调再贷款再贴现利率 25BP，新增科创/技改再贷款 4000 亿元。

### 📊 经济面：景气阶段走弱
- **7 月制造业 PMI 49.2%**（环比 -1.1pct），**非制造业 49.0%**（环比 -1.2pct），**综合 PMI 49.3%**（环比 -1.3pct），三项全部**跌破荣枯线**。
- 7 月新订单 48.5%（-2.7pct），生产 49.9%（-1.5pct），需求端回落最明显。
- **上半年规上工业利润 +18.7%**：电子行业 +96.9% 拉动全局 8.5pct；集成电路制造利润 **+2579.5%**、服务器利润 +689.3%。
- **下半年展望**：8 月制造业产能利用率 73.0%，专项债加速 + 8000 亿元新型政策性金融工具落地，基建增速有望由负转正。

### 💰 利率/汇率：人民币续创三年半新高
- **美联储 FOMC 12 月点阵图**：2026 年末利率中值 **3.75%**（前值 3.375%），实际比市场预期更鹰；多数票委倾向 2025 已降 75BP 后暂停评估。
- **8/12 人民币中间价 6.7900**（贬 236 个基点），但 **在岸 CNY 16:30 收 6.7457**，**离岸 6.7485**，双双创 2023 年 2 月以来新高。
- **2025 年 4 月以来人民币累计升值 6.98%**（在岸）/ 3.25%（离岸）；出口高增 + 经贸环境改善 + 外需强劲是核心支撑。

**Mavis 点评**：货币政策"以我为主"信号明确，央行没跟美联储降息，但人民币自己走强——这是 2026 年宏观面最值得关注的反常组合。对资产价格意味着：进口型通胀压力进一步缓解，但出口型企业的汇兑收益在变薄。

## 板块 2 · 半导体产业链

### 🔥 HBM 超级周期：缺口创 2011 年来新高
- **高盛 5 月研报**：2026 年全球 DRAM/NAND/HBM 供需缺口分别 **4.9% / 4.2% / 5.1%**，均 2011 来最高；AI 服务器贡献超 50% DRAM 需求。
- **三大原厂 Q2 HBM 产能全部售罄**；三星 Q3 计划**第三次提价**，DRAM 合约价环比再涨 13-18%。
- **SK 海力士 CEO 公开表态**："**2027 年将是存储行业历史上供应最紧张的一年**。"
- **三星/海力士放弃 1 年期以内短期合同**，全面转向 3-5 年长协，含 10-30% 预付款 + 最低价格底线。
- **HBM5 已亮相台北电脑展**：16 层堆叠、I/O 提升至 4096-bit、带宽 **4 TB/s**，2029-2031 上市；HBM4 良率逼近 80%。

### 🇨🇳 国产存储：里程碑时刻
- **8/9-10 苹果测试长鑫 CXMT DRAM**：若通过验证，国产存储首次进入苹果 iPhone/MacBook 核心供应链；初期可能"中国市场专供机型"形式落地。
- **华盛顿震动**：苹果一边承受"去中国化"压力、一边被内存价格逼得转向中国供应商；南韩贸易部长警告"不应过快重分配半导体利润"。
- **8/12 长鑫科技成交 230 亿元**，涨 7.8% 报 54.33 元。
- **Omdia 上调 2026 年全球半导体市场增长预测至 94.1%**；存储芯片将占全球半导体总营收 **50%+**。

### 🛠️ 设备/材料：国产替代加速兑现
- **国产化率约 20%**（刻蚀 15%、薄膜沉积 <10%、CMP 15%），是国产化率最低环节 → **翻倍空间最大**。
- **中微公司 2026 H1 净利润预增近 3 倍**，研发投入 20.42 亿元（+36.89%）。
- **国产光刻机突破**：上海芯上微装 350nm 步进投影光刻机 AST6200 通过国内化合物半导体头部客户全流程验证，获批量复购订单。
- **CPO/硅光**：台积电关联企业 VisEra 1.6T 硅光产品 2026 末小批量量产，1.6T 高密度耦合平台 2027 H2 量产。
- **零部件出海**：海外收入占比已达 17.5%，领先设备端；国产替代从"产品出口"→"本地化服务+产能落地"。

### 🏭 制造/封测：先进封装决定 AI 算力上限
- **台积电 7 月营收 145 亿美元**（同比 **+44.7%**），月增 14.5%，2026 全年增长预测 **超 40%**；3nm 占晶圆营收 28%，5nm 占 35%。
- **2026 全年 capex 520-560 亿美元**（2025 约 400 亿），首次年营收破 1000 亿美元。
- **CoWoS 产能缺口 >30%**；日月光/AMD 全面涨价 30%；先进封装成本已占 AI 芯片总成本 **30-50%**。
- **长鑫 HBM 仍处样品验证阶段**，与国际巨头存在 2-3 年代差；A股无企业能自主生产 HBM 颗粒，机会在封测/材料/载板/接口/设备/分销。

### 💾 存储涨价向下游传导
- **DRAM 现货价**（中关村）：DDR4 8Gb 1Gx8 3200Mbps **7.80 美元**（月涨 18%），Q3 预计再涨 15-25%。
- **苹果出手提价**：iPhone 18 Pro 预计 9999 元起（+1000 元），顶配 Pro Max 或破 2 万；2nm A20 Pro 晶圆成本多 10-20 美元/颗。
- **小米卢伟冰承认**：千元机市场最受伤，存储涨近 4 倍，水滴屏/720P 屏幕回归；REDMI Note 17 系列本月发布但"压性价比不是嘴上说说"。
- **OPPO/vivo 中端机全系涨价**，连长焦配置都被砍。

**Mavis 点评**：8/12 的三个里程碑——苹果验证长鑫、Omdia 上调 94.1%、长鑫成交 230 亿——构成"国产存储逆袭"叙事的完整闭环。但 A 股投资人要清醒：长鑫 HBM 仍处样品阶段，与 SK/三星 2-3 年代差不是钱能砸出来的，**真正受益的下一波是设备和材料端**（中微/拓荆/北方华创/芯源微/华峰测控），不是存储芯片本身。

## 板块 8 · 产业链上下游传导

### 🔗 AI 算力链条（最热）
- **上游**：HBM 颗粒（SK/三星/美光 90% 寡头）→ TSV/混合键合设备 → 硅光模块（CPO 1.6T）→ 液冷（英伟达 Rubin 100% 全液冷）→ 电源（电容/电感）
- **中游**：CoWoS 封装（台积电 + 日月光）→ AI 服务器（戴尔/超微/广达/纬创）→ 数据中心 capex 8867 亿美元（+90%）
- **下游**：AI 智能体（英伟达 Nemotron 4 1 万亿参数）→ 行业大模型（腾讯混元/字节/阿里）→ 终端应用（智能眼镜 AR +136%）

### 🔗 存储链条（涨价传导）
- **晶圆厂**：长鑫/长江存储扩产 → 设备采购（刻蚀 15% 国产化、薄膜 <10%）→ 材料（电子特气/光刻胶/靶材）
- **封测**：通富/长电/华天 → HBM 配套（暂未直接受益，差距 2-3 年）→ SOCAMM2/LPDDR5X 模组
- **模组**：江波龙/佰维/朗科 → 涨价转嫁（已涨价 18%/月）
- **终端**：苹果/小米/OPPO/vivo 涨价 → 千元机市场萎缩 → 高端集中度提升

### 🔗 地产-钢铁-水泥链条（政策托底）
- 限购松绑（北京/沪深）→ 二手房成交回暖 → 建筑钢材需求结构变化（从螺纹转向型钢/高强钢）
- 基建专项债 + 政策性金融工具 → 温和修复（下半年由负转正）
- 制造业用钢 51% 反超建筑业 49% → 钢厂转型（宝钢/中信泰富取向硅钢/汽车板/电工钢）

### 🔗 手机-存储-屏幕链条
- 存储涨价 → 终端涨价 → 中低端市场萎缩 → 折叠屏/影像旗舰走量
- OLED 屏幕、潜望长焦、硅碳负极电池成为差异化点
- 智能眼镜接棒（国内 AR +136%、无显示智能眼镜 +210%）

**Mavis 点评**：这四条链条**互相咬合**——AI 算力 capex 推高 HBM 需求 → 挤压消费电子存储 → 手机涨价 → 千元机萎缩；地产政策托底传导到钢铁需求结构变化；这是 2026 H2 投资要盯紧的"全图"。

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
