📌 **Mavis 点评**：10.23 国常会 + 10.16 价格法修正案连着看，政策重心已经明确从"扩投资"切到"扩消费 + 治内卷"。服务业 66.3% 的贡献率是结果也是命令——下一个五年的政策不会再主要靠盖房子，但价格法专门写"制止低价倾销"，说明政府已经意识到内卷正在吃掉服务业利润。**真正的验证点在 2027 年**：如果服务业贡献率继续抬升但价格起不来，说明是在"扩量不增收"。

**"政策利率换锚"细节**（10.19 潘功胜演讲 + 10.28 经济日报解读）：
- 三阶段演进：MLF-LPR 机制 → 7 天期逆回购利率为政策利率 → **隔夜逆回购利率为政策利率**
- 隔夜交易已占货币市场日均交易量 **九成**，近两年 DR001 基本运行于政策利率 ±15bp
- 2026 年临时正逆回购操作利率区间收窄为政策利率 **±25bp**（2024 年为 -20bp/+50bp）
- 已有 **24 个省份**落地 DR001 基准利率贷款，全国首单 7 月在海南落地
- 10 月 LPR 减点发放贷款比重已接近 **50%**（2019 年 LPR 改革时远低于此）

📌 **Mavis 点评**：央行这轮"换锚"最容易被误读成宽松或紧缩，其实两都不是——它是**换刻度**。用 10.19 潘功胜自己的框架说：DR001 已经是事实上的目标利率，但公开市场操作品种还是 7 天，两边对不上，所以要改。东方金诚王青判断"换锚本身带动 LPR 下调可能性不大"，但中信证券明明团队指出"换锚后资金中枢长期维持在隔夜利率附近，带动银行负债端成本下行，给广谱利率下行创造空间"。**我的判断：LPR 不动，但新增贷款的实际利率会继续往下走**。跟踪指标从 LPR 转向 DR001 低位持续性 + 挂钩 DR 贷款投放规模——这两个数在 11 月 MLF 和年末的中央经济工作会议前后会有明确信号。

**Mavis 点评选（2 条最有洞见的）**

**第一条：宇树王兴兴那句"全世界几乎所有人，对 AI 的重视程度和信仰都还不够，包括我自己"——这是产业内部人主动上修技术曲线的信号，但同一场大会他给的三个约束更值钱。**

判断：**这不是一个吹票的信号，是一个校准的信号。** 他同时说了三件互相矛盾但都成立的事：① 突破"被击穿苗头"，时间表从"快则 2-3 年"提前到"一两年"；② 普及需要年产千万台，当前只有几万台——**产能与需求缺口是数量级的**；③ 核心瓶颈不是模型，是**模型 I/O 与真实执行的对齐**（"会规划导航 ≠ 能稳定抓取装配"）。

为什么这个信号值钱：一家公司最了解自己的业务。当产业最核心的创始人主动把瓶颈从"算法"下移到"工程对齐 + 产能数量级"，且把时间表往前拉，这种双向修正通常出现在**真实曲线即将穿越临界点**的时候。

可验证判断：**看雷赛智能的月产能**——目前约 15 万台/月，正在向年产 300 万台扩建。如果 2027 年 Q1 月产能没有实质爬到 50 万台以上，说明对齐瓶颈和良率瓶颈比预期更难，宇树的时间表会再往后滑一年。**同时看卖铲子的定价权**：如果减速器、无框力矩电机在产能扩张后毛利率仍逆势回升（浙商/国元均提示这是核心指标），说明需求真的超供给。

**第二条：智元提出 "Worken"，但自己承认"产出效能比仍比较模糊"——这个矛盾恰恰说明行业商业化还差最后一公里。**

判断：Worken 公式是 活跃机器人数 × 自主工作时长 × 产出效能比。智元的两个案例里，产出效能比分别是 **0.7**（龙旗工厂上下料）和 **0.5**（广州地铁安检）——**也就是说，机器人目前的产出效率只有人工的一半到七成**。这是一个极其关键但被叙事掩盖的数字：如果机器人只等于 0.5-0.7 个工人，那它替代人工的经济性只在特定场景成立。

更值得注意的是**智元自己也没解决计价问题**：与酒店客户谈前台接待时，迎来送往、行李搬运、业务引导的效能比各不相同，无法综合评价，所以智元承认 Worken 现在只能做补充指标。

**可验证判断**：Worken 或类似的计价标准能否在 2027 年上半年被至少一家头部厂商实际用于合同定价，这是"机器人从卖硬件变成卖服务"的分水岭。**如果 2027 年财报里机器人公司的营收模式从"卖本体"变成"Worken × 单价"，估值锚就要整体重估——那才是这轮行情真正的主升浪。** 反过来，如果 2027 年还是一次性硬件销售+一次性交付（像江波龙 10 月 28 日预告的 Q3 净利环比 -35%~-49% 那种库存收益退坡），这轮行情在 2026 年 Q4 就该结束了。

### 8.4 编辑后记（v6 关键改动）

**第一个信号：9 月 PPI +5.0%、CPI +0.9%，但统计局自己在发布会上承认"价格传导沿产业链逐级递减"——这两件事必须合起来读，而不是分开看。**

单独看，PPI +5.0%（涨幅扩大 1.2pct）是好消息；单独看，CPI +0.9%、核心 CPI +1.0%、服务价格环比转负 -0.2% 也不算坏。但统计局王冠华 10.19 那句"价格传导往往沿产业链逐级递减"配着 PPI 的行业构成看——**涨的 5 个行业（煤炭 +35.3%、石油开采 +24.5%、化工 +12.1%、有色冶炼 +21.4%、电气机械 +6.2%、计算机通信电子 +5.8%）合计上拉 5.42pct，几乎就是全部涨幅；而真正贴近消费者的服务价格环比是负的。** 上游涨价、下游不涨，中间被吃掉的是什么？是制造业毛利。

**可验证判断**：看 11 月中旬的 10 月工业利润（1-8 月同比 +15.7%、利润增长行业个数比去年全年 +6 个）。**如果 10 月利润增速从前 8 月的 15.7% 回落到 12% 以下，说明 PPI 涨的是成本不是利润，制造业的定价权在继续丢失**；那时候"反内卷"（价格法修正案 + 发改委产能调控）的紧迫性会从文件变成行动，钢铁、水泥、化工的价格治理是下一个政策密集区。

**第二个信号：中芯国际 Q3 指引环比只增 2-4%，而华虹宏力 Q3 指引环比增 8%——同一家 AI 周期里的两家晶圆厂，节奏完全相反。这不是经营能力差异，是产能释放的结构性差异。**

把这三个数字放在一起：中芯 Q2 月产能 109.65 万片、产能利用率 93.7%，2026 年预计新增 12 英寸约 4 万片/月但**关键设备与配套设备存在时间错配**；华虹无锡 Fab 9 正处爬坡期、Fab 9B 已启动招标（+5.5 万片/月）、收购华力微再增 4 万片/月，且 Q2 产能利用率已经 **102.8%**（超负荷运转）。也就是说：**中芯的问题是"设备到不了"，华虹的问题是"产线刚爬坡"**——一个是外部供给约束，一个是内部节奏问题，两者都可解，但解法完全不同。

**可验证判断**：**盯中芯国际的季报里"产能利用率"和"12 英寸月产能"两个数**。如果 Q3 利用率还在 95% 以上、而月产能没有实质增加（说明仍在等设备），那么 2026 年报时点（中芯 2026 全年新增 4 万片/月的目标）大概率要打折，反过来华虹宏力 Q3 报表上"无锡 12 英寸占比"从 62.1% 继续往上走、Fab 9 满产达成，则华虹的 2027 年 ASP 上行幅度会显著大于中芯。**这个差别的交易表达是：同一个"AI 芯片国产化"叙事下，2027 年的弹性排序是华虹 > 中芯，而不是反过来。**

**第三个信号：DRAM 涨、NAND 崩，两者在同一周发生——这个背离本身就是信号，说明 AI 需求的"存储饥荒"是有形状的，不是弥散的。**

10.30 的 TrendForce 现货：DDR5 16Gb **+0.27%**、DDR4 16Gb **-0.15%**（82.796 美元，仍比 DDR5 贵 35%）；而 10.28 的 NAND：**512Gb TLC 单周 -9.19%**、CFM NAND 指数 -3.3%、eMMC 64GB -4.65%、UFS 2.2 64GB -4.26%。原因清清楚楚：AI 吃的是 HBM 和服务器 DDR5（TrendForce 预计 2026 年 HBM + 服务器 RDIMM 占全球 DRAM 位元供给 **51%**），它不吃消费级 NAND；而 NAND 这边，Q2 手机存储涨 80% 直接把需求打崩，双 11 又集体降价清库存，谷歌 TurboQuant 压缩算法则给了投机盘一个崩塌的叙事借口。**供给端原厂控制产出 + 需求端高价毁灭需求，NAND 靠供给收缩撑住的价格，本来就是最脆弱的那种。**

**可验证判断**：**11 月中下旬 Q1'27 NAND 合约价谈判是这一整条链的判决点**。如果 TrendForce 把 Q4 那个 +15~20% 的指引下修到 +5% 以内，说明 NAND 已经从"结构性紧张"变回"普通商品"，那么三件事会同时发生：① 消费级 SSD 在双 11 后的"券后回落"变成真跌（不是假性回落）；② 江波龙这类存货 257.77 亿元（占总资产 60.12%）的模组厂面临跌价；③ 存储板块的估值锚从"AI 稀缺"回到"周期品"。**反过来，如果 Q1'27 合约价仍然坚挺在 +10% 以上，那么这次现货崩塌就只是投机盘出清，消费级 SSD 的"券后假性回落"窗口就是真实买点。** 这个数字 11 月中下旬出，比现在猜更省力。

**第四个信号（补充）：10.30 A 股成交 1.67 万亿放量下跌，同一天港股恒指却涨 1.46%，而四大行 A+H 总市值刚在 10.29 历史首破 10 万亿元——A 股和港股在同一天给出了相反答案，这不是全球风险偏好下降，是账户内部的资产搬家。**

Q3 北向 + 被动 + 主动基金合计净流入银行板块约 **649 亿元**，主动基金银行持仓比例从 Q2 的 1.10% 跳到 **2.16%**（翻倍）；同时算力硬件链（天孚 -19.77%、新易盛 -11.06%、中际旭创 -8.53%）和消费电子（胜宏 Q3 净利 -52.2%）被集中减持。**AI 资本开支变现效率的质疑（Alphabet -13%、4790 亿美元市值蒸发）传到 A 股后，资金没有去避险——债券和现金——而是去了银行、煤炭、石油这些能自己产生现金流的东西。**

**可验证判断**：**银行板块的这次持仓跳升（1.10% → 2.16%）是加仓还是套牢盘的分水岭。** 如果 Q4 主动基金银行持仓比例继续往 2.5% 以上走，同时银行板块的估值（PB）没有同步扩张，那说明这是配置盘在 AI 叙事动摇时的长期迁移，接下来银行会靠股息和 ROE 走独立行情，而不是靠估值修复。反之，如果持仓比例在 3 个月后回落到 1.5% 以下而 PB 已经被推高，那就只是一次拥挤的避险交易，10 万亿市值会成为顶。**观察窗口：11 月 4 日三季报披露截止后 + 12 月中央经济工作会议前的基金四季报（2027 年 1 月底）。**
