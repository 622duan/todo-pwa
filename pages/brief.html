## 1️⃣ 宏观 PEST：财政加力、货币宽松、扩内需成主基调

**政策**  
- 🟥 7·30 中共中央政治局会议：实施"更加积极的财政政策"+"适度宽松的货币政策"，强化逆周期调节
- 🟥 8·17 国务院第十二次全体会议：李强强调"加快各类政策资金使用进度，尽早形成实物工作量"，对**民间投资**给予更多支持
- 🟢 财政部：1-7 月一般公共预算支出 16.29 万亿元/+1.3%，专项债新增 2.4 万亿元（全年 4.4 万亿额度）；**下半年新增专项债+超长期特别国债合计超 2 万亿**待发
- 🟢 央行：Q2 货币政策执行报告"加大逆周期调节力度"；7 月企业贷款加权平均利率**略低于 3%**

**经济**  
- 上半年 GDP 69.6 万亿元/**同比+4.7%**，规模以上工业企业利润**+18.7%**
- 1-7 月固定资产投资 26.03 万亿元/**-6.7%**；其中**民间投资 -9.4%**（亟需政策托举）
- 1-7 月进口同比 **+22%**，自 150+ 国家实现正增长
- 1-7 月社零 28.77 万亿元/+1.2%（除汽车 +2.7%），7 月单月 +0.6%

**社会/科技**  
- 装备制造业、高技术制造业增加值上半年分别 **+9.3%**、**+13.3%**
- 服务零售额上半年 **+5.3%**，升级类商品消费增长较快
- 房地产"止跌回稳"目标确认，京沪深二手房价格率先企稳

**Mavis 点评**：上半年的"政策靠前发力"确实把 GDP 顶住了，但 7 月经济数据疲软+民间投资 -9.4% 暴露了**需求端冷、热不均**的结构问题。下半年看两件事：一是 8000 亿政策性金融工具三季度能不能"快投快建"，二是"消费贷款财政贴息"+"以旧换新"能不能把消费从 1.2% 拉回 3-4% 的舒服区间。**全年 4.5-5% 目标大概率能完成，但质量比速度重要。**

## 2️⃣ 半导体设备：长鑫+长江存储双轮驱动，国产化率 15%→35%

**国产化进程**  
- 🟥 长鑫科技 2026 年设备采购**国产化率从 15% 提至 35%**
- 🟥 长江存储武汉第三厂设备**国产化率目标 50%**
- 28nm 成熟工艺：清洗/刻蚀/热处理/CMP 国产化率均**突破 50%**
- 14nm 及以下先进工艺：光刻/量测/离子注入/ALD 国产化率**仍 <10%**（硬骨头）

**业绩兑现**（H1 2026）  
- 🟥 拓荆科技：营收 29.13 亿元/**+49%**，归母净利 13.43 亿元/**+1324%**
- 🟥 中微公司：营收 66.91 亿元/**+35%**，归母净利 28.25 亿元/**+300%**
- 盛美上海：营收 37.18 亿元/+14%，归母净利 9.89 亿元/**+42%**

**全球超级周期**  
- SEMI 7 月预测：全球半导体设备销售额从 1450 亿美元**上修至 1659 亿美元/+23.2%**，创近十年新高
- TSMC 2026 资本开支指引上调至 **600-640 亿美元**（YoY +50%+，70-80% 投先进制程）
- 三星 2026 设施+研发投入超 110 万亿韩元（约 733 亿美元，YoY +21.7%）
- 海力士 DRAM 月产能：2025 年 55 万片→2030-2031 年 100 万片

**重大事件**  
- 中微公司上海临港二期项目**总投资 35 亿元**，重点扩刻蚀/薄膜沉积/量检测（瞄准"批量交付"能力）
- 华海清科 Versatile-DT300D 双工作台划切装备**首台出机**发往国内先进存储龙头
- 深科达**西部数据近 6000 万元订单**，存储分选设备国产化率从 5% 向 30% 攀升

**Mavis 点评**：这周是国产设备的"封神榜"——拓荆 +1324%、中微 +300% 的业绩读起来像爽文，但**冷热必须分清**：28nm 是已经站稳的成熟阵地，14nm 以下才是真正的攻坚战。中微临港二期 35 亿不是在扩产能，是在补"从样机到长期稳定交付"的能力，这是**从'有'到'好'的拐点**。明年看长鑫 35%、长江存储 50% 能不能真兑现，否则订单潮就是"昙花一现"。

## 4️⃣ 存储芯片：DDR4 Q3 还要涨 50%，长江存储冲刺 IPO

**价格行情**（截至 2026-08-20）  
- 🟥 **HBM3 24GB 12-Hi**：200.24 美元/stack（同比 +4%，30 日 +0.46%）
- 🟥 **HBM3E 36GB 12-Hi**：299.97 美元/stack（同比 **+14%**，30 日 +2.26%）
- 🟥 **DDR5 16Gb**：51.84 美元/die（同比 **+480%**）
- 🟥 **DDR4 16Gb**：85.28 美元/die（同比 **+690%**）
- 🟥 **eSSD 30.72TB QLC**：4619 美元（同比 +165%）
- 主流 DDR4 1Gx8 3200：本周现货 42.90 美元/+0.67%
- 512Gb TLC NAND 晶圆：21.21 美元/+0.39%

**机构预警**（大摩、瑞银、美银）  
- 🟥 2026 Q3 标准型 DRAM 价格**预计 +50%**，Q4 再 +10%
- 🟥 SLC NAND Q3/Q4 **每季 +50%**，涨势可能延续到 2027 Q1
- 🟥 24GB DDR5 现货 8 月环比 +8%，同比 **+483%**（8 美元→47 美元）
- 2026 Q3 DRAM 合约价季增 13-18%，NAND 合约价 +10-15%

**核心矛盾**  
- HBM 消耗硅晶圆是传统 DRAM 的 **3 倍**（垂直堆叠 + TSV 禁布区）
- 全球前 3 大存储厂 **2026 年产能已售罄**，2027 年 HBM 供货价格谈判已启动
- 三星+海力士上半年库存合计增加超 22 万亿韩元（约 155 亿美元）= 主动战略备货

**国产突破**

**Mavis 点评**：这轮存储涨价不是"周期反弹"，是 **AI 算力需求结构性抽水**——HBM 产能每 1 比特占晶圆面积是 DDR5 的 3 倍，意味着同等晶圆投入下，全行业能产出的"通用比特"在急剧萎缩。国产这边，长江存储光速 IPO+长鑫市值登顶，**资本市场已经在为"中国 HBM 国产替代"定价**。但需求端已经在裂：消费电子（手机/平板）Q2 出货同比 -12.3%，"以价换量"压力直接传导到下游品牌。这是 2026 H2 最值得持续盯的"上下游撕裂"信号。

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
