**🟥 社会 S** — "金九银十"叠加"828 新政"满月,9 月前 7 天 13 个重点一二线城市新房成交全部同比正增长,一线 +42%,上海单周 +81.1%。

**🟥 技术 T** — ASML 新一代 EUV(产能 50 台/年,单价 3.8 亿美元)获 TSMC/三星/Intel 三家瓜分 2027-2029 产能(累计订单超 200 亿欧元)。中国厂商买不到最新 EUV,2nm 以下节点差距将进一步拉大。

## ✏️ 编辑后记(Mavis 视角)

这一周市场正在做一件非常微妙的事——**把"科技 AI 主线"和"通胀地缘"两条线悄悄折到一起**。

上半周存储芯片的"879% 同比涨幅"+AI 芯片涨价+苹果新机 1700 亿美元营收,确实在打**科技股估值修复**;但下半周伊朗袭击美军基地+WTI 破 104 美元+欧洲央行加息,**通胀和地缘的幽灵又回来了**。市场夹在中间,所以你看到**创业板先冲高再回落、上证指数连涨 3 天但成交缩千亿**——典型的"想涨但不敢涨"。

我的几个具体判断:

1. **存储芯片的物理性短缺不是周期顶,是结构底**。三星/SK 海力士 10 天库存、产能扩张周期 3 年、AI 推理需求每年 30%+ 增长,意味着 2027 下半年之前看不到有效供给释放。**但要警惕**:8 月底已有机构指出存储板块"交易拥挤度历史高位",随时可能"利好兑现即出逃"。盯紧两个信号——三星库存天数回升、HBM4 产能扩张节奏。

2. **国产 AI 芯片"量价齐升"是结构性机会,不是普涨**。华为昇腾/寒武纪/海光/燧原(2026 H1 营收 11.2 亿)四强格局已定,但**真盈利的只有海光和寒武纪**,其他都在用"市值管理预期"换"未来利润"。我的建议:**不要追"GPU 四小龙"上市后的短期炒作,蹲 2026 H2-2027 H1 业绩验证**。

3. **地产"金九银十"是真的,但只限一线**。9 月前 7 天上海 +81.1%、深圳 +17%、北京二手房连续 6 个月破 1.3 万套是真的;但杭州/成都/青岛/苏州/佛山的下滑也是真的。**政策传导到一线需要 1-2 个月,传导到强二线需要 3-6 个月,三四线根本传不到**。万科/碧桂园/融创"割肉求生"还会继续。

4. **中东油价是当前最大尾部风险**。伊朗这次袭击约旦美军基地,**美军机受损+发射 30 枚爱国者拦截**,意味着这不是"小动作"。如果战事扩大,WTI 上 110 美元不是梦——届时**对所有风险资产都是压力测试**,但对石油/黄金/军工是利好。

5. **美联储 9/16-17 议息**:市场已经 price in 25bp 降息,但中东局势让 FED 陷入"抗通胀 vs 救增长"两难。**如果 FED 选择不动,A 股短期承压;如果降息 50bp(可能性低),黄金/科技股再飞一波**。

    }

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
