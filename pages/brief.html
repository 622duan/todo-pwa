## 🌍 三、宏观 PEST 板块

### 3.1 政策 (Political)
- **央行继续"适度宽松"基调** (7/15 国新办发布会) — 邹澜表态:6 月 M2 同比 +8.0%，社融存量 +7.4%，企业贷款加权平均利率约 3.0% (同比 -20BP)。10 年期国债收益率 1.73% 附近，人民币对一篮子货币较年初 **升值 4.7%**。
- **房地产"王炸"六部委政策包** (7 月)：住建部 + 央行 + 财政部 + 金融监管总局 + 税务总局 + 自然资源部协同:
  - 首套首付下调至 **15%** (历史最低)，二套 25%
  - 5 年期 LPR 维持 **3.5%**，首套商贷普遍 3.05-3.45%
  - 存量房贷利率引导下调约 50BP
  - **3000 亿元保障房再贷款** (年化 1.75%)，可撬动近万亿
  - 满 2 年住宅免征增值税，"卖旧买新"个税退税延至 2027 年底
  - 去化周期 >36 个月的城市暂停新增住宅供地
- **国务院批复《中医药振兴发展"十五五"规划》** (7/7) — 国函〔2026〕71 号。

**Mavis 点评**：这一轮地产政策是真的"王炸"，但和 2015 年去库存最大不同是"国资进场收储"——央行用 3000 亿再贷款给 60% 配套，相当于给市场画了一条底。但要警惕:这次政策目标是"稳"不是"拉"，别再用 2015-2016 的逻辑推演房价。

### 3.2 经济 (Economic)
- **GDP 上半年 +4.7%** (Q1 +5.0% / Q2 +4.3%)，名义 GDP +5.3%，**平减指数结束连续 12 季度负增长**首度转正 — 这是 5 年同期名义增量最大。
- **工业利润 1-6 月 +18.7%** — 营收利润率 5.70% 创 2023 年以来同期新高。有色冶炼 **+99.4%**、计算机通信电子设备 **+96.9%**、化工 **+67.8%** 领跑；汽车制造 **-19.5%**、黑色冶炼 **-25%**、非金属矿物 **-47.8%** 垫底。
- **6 月规上工业增加值 +5.3%** (环比 +0.76%)，制造业 +6.0%，出口交货值 **+14.8%**。
- **1-6 月固投 -5.7%** — 民间固投 **-8.5%**，东北 -22.9% 最弱；高技术产业投资 +4.6%。
- **上半年财政收入 +4.7%** (税收 +5.3%)，支出 +1.5%。政府性基金收入 **-21.6%** (土地财政压力)。
- **社零 +1.3%**，网上零售 +5.2%，服务零售 +5.3% 持续快于商品。

**Mavis 点评**：上半年数据是"K 型"——AI/电子设备/有色翻倍涨，传统汽车/地产/建材深跌。"以新代旧"是新常态，配置思路要跟着切换。

## 💾 四、半导体产业链 (核心战场)

### 4.1 设备 (Equipment) 🟢
- **ASML Q2 净销售 93 亿欧元 (毛利率 54%)**，净利润 29 亿欧元，**全面超出指引**。
  - 上调 2026 全年净销售指引至 **430-450 亿欧元** (此前 360-400)，毛利率 **54-56%** (此前 51-53%)
  - 2027 年 EUV 产能规划在 2026 基础上 **+30%** (EUV 65→85 台)，DUV (130→170 台) 也 +30%
  - 中国市场 2026 净销售占比约 **20%** (仍为重要收入来源)
- **SEMI 年中预测**: 2026 全球半导体设备销售 **1659 亿美元 (+23.2%)**，2028 年达 **2295 亿美元** 创纪录 (连续 5 年增长)。
- 国内: 半导体设备 ETF 易方达 (159558) 规模年内 **+11.5 倍** 至 200.7 亿；科创半导体设备 ETF 华泰柏瑞 7 月以来净流入 **44.55 亿元**。

**Mavis 点评**：ASML 一边喊"中国份额会降"一边把全年指引拉满 70 亿欧元——资本市场已经看明白:AI 算力扩产周期里，没有任何一家设备厂能置身事外。短期估值高位有压力，但 2027-2028 的产能扩张是实打实的订单。

### 4.2 制造 (Foundry) 🟢/🟡
- **台积电**:
  - 2nm (N2) 量产初期月产能 **3.5 万片**，2026 年底冲 **14 万片/月** (高于此前 10 万片预期)
  - 2026 Q2 先进制程 (7nm 及以下) 营收占比 **77%**，营业利润率 60.3%
  - 2026 全年资本支出指引上调至 **600-640 亿美元** (此前 520-560)
  - **2027 年起 3nm/5nm/7nm 涨价 5-10%**，HPC 新增订单再加 10-15% 溢价
  - CoWoS 产能 2027 年底扩至 **20 万片/月**
- **三星**:
  - 美国泰勒首座代工厂 2026 投产有序推进，**第二座 2025 年底开工，2030 年投产**
  - 4nm 产能**基本售罄** (明年也已售罄)，部分 8nm 满载
  - 接 Meta 10 万亿韩元 ASIC 订单 (2nm 工艺)
  - 三星代工订单积压约 **50 万亿韩元**
- **中芯国际 / 华虹**: 国产成熟制程受益国产替代，月产能持续爬坡；但成熟制程毛利仍承压。

- **苹果 2026 返校季**: 7/15 国行 Apple 智能完成备案，iPhone 17e 起步价 5999。Q2 中国出货 1195 万部 **+24.4%**。

### 4.4 存储 (Memory) 🟢 超级周期
- **DRAM 现货**:
  - 32GB DDR5 套装华强北年内 **+320%** (900 → 3800 元)
  - 1TB SSD 410 → 950 元 (+132%)
  - 三星、SK 海力士、美光 70-80% 先进产能转 **HBM/高端 DDR5**，通用 DRAM/NAND 被挤压
- **HBM**:
  - 2026 H2 HBM4 价格或涨至 **4-5 美元/千比特** (vs 当前 2 美元)
  - SK 海力士 HBM 市占 **58%** (Q1)，三星 21%，合计近 80%
  - 三星 HBM 月产能 2026 年提升约 50% 至 **25 万片**
  - 据 SemiAnalysis: 2026 DRAM 供应低于需求 7%，HBM 缺口 6%，**2027 年 HBM 缺口扩大至 9%**
  - 2027 年全球 DRAM 产能中约 **50% 将被长期协议锁定** (中小买家基本拿不到现货)
- **机构预期**:
  - Gartner: 2026 DRAM 价格涨 125%，NAND 涨 234%
  - TrendForce: 26Q2 DRAM 合约价季增 58-63%，NAND 70-75%
  - 集邦: 2026 存储产业整体产值 **5516 亿美元** (年增 134%)

**Mavis 点评**：这轮存储周期不是普通周期，是 AI 驱动的**结构性重构**。原厂 80% 产能转 HBM 意味着消费级 DRAM/NAND 会持续紧缺到 2027 年底甚至更久。要买电脑/手机/游戏机的，**现在不买等明年更贵**。

## 🔥 六、6 大圈子八卦

### 6.1 半导体圈子
- **吴金刚离职中芯国际 (历史旧案 + 持续思考)**: 5 年前放弃近千万股权的研发副总裁离职，是国产芯片人才困境的缩影。芯片人才战升级: 2021 年起 OPPO/小米/华为开出 40-50 万应届年薪，太和司南数据: 45-50W 高级 IC 工程师主动离职率 7.48% (30-35W 段仅 2.75%)。
- **国产光刻机 2026 量产 (争议话题)**: 网传上海微电子 28nm 良率突破 90%，SMEE 提交 EUV 专利，2026 量产——但 ASML CEO 富凯已暗示"中国可能反向出口"。时间线真伪难辨，需要持续跟踪。
- **国产存储芯片公司动态**: 长鑫存储 + 长江存储与苹果就 iPhone 存储采购谈判中 (7/5 报道)，存储涨价让苹果都得找中国厂。

### 6.2 互联网圈子
- **阿里"千问 + 即时零售"双线烧钱**: 千问 App 月活 1.66 亿 (超越 DeepSeek)，8 月淘宝闪购周日均订单 8000 万。但 EBITA 同比 -84% 触目惊心。
- **腾讯混元 3 + 元宝 App 路线之争**: 马化腾说"站上去了，但坐不下去，船漏水" — 微信 AI 嵌入太敏感，独立 App 又不够大。
- **京东外卖减亏 33%**: 5 月亏损 148 亿，6 月 103 亿。外卖份额突破 15%，但 ROI 仍待验证。
- **美团由盈转亏**: 因阿里京东入局，业绩压力山大。

### 6.3 财经圈子
- **央行连续 20 个月购金**: 6 月单月加仓 48 万盎司创本轮新高，是金价中长期最强支撑。但短期 ETF 资金撤离，黄金在 4000 美元拉锯。
- **地方债 8 月 1.09 万亿供给压力**: 7 月发 7914 亿，8 月 1.09 万亿 (环比 +37.9%)，超长债调整成买点。
- **2026 Q1 货币政策会议**: 央行"加大逆周期和跨周期调节力度" — 降准降息预期升温。

### 6.4 房产圈子
- **3000 亿保障房再贷款是这次王炸的核心**: 国资真金白银进场收储，过去从未有过。7 大城市城投已启动收购计划。

## ✏️ 编辑后记 (Mavis)

这一周的核心矛盾只有一个: **AI 算力需求强到炸 + 传统消费电子弱到跪 = 半导体产业链剧烈分化**。

台积电先进制程营收占比冲到 77% 是历史新高，背后是英伟达、AMD、苹果在抢产能；与此同时手机厂商 (除华为苹果) 在萎缩、小米出货同比 -22%，存储涨价让本来就不富裕的家庭雪上加霜。

**3 个不容忽视的趋势**:
1. **存储芯片不是周期，是 AI 重构的产物** — 2027 年全球 DRAM 50% 产能被锁定，价格高企至少持续到 2027 年底。**现在买电子产品正在"价格低点"**。
2. **房地产不是新一轮暴涨，是模式切换** — 3000 亿收储再贷款是国资托底，但目标是"稳"不是"拉"。投资客彻底退场，刚需改善迎来 2015 年以来最佳窗口。
3. **国产替代进入"收钱"阶段** — 兆易创新净利 +1099%、海光高增长、存储分销 +330%，国内半导体不再是"估值故事"，是真金白银的业绩兑现。

**个人操作建议** (仅供参考):
- 持有小米/OPPO/vivo 的，**短期不要加仓**，存储涨价对它们是结构性利空
- 想配半导体的，**优先设备股** (ASML/AMAT/北方华创)，其次是 HBM 链 (SK 海力士)
- 有购房刚需的，**现在是政策最优窗口** (首付 15% + 利率 3% + 退税)
- 黄金**分批买** (不要一把梭)，4000 美元以下是好机会
- 关注 8 月 5 日 SK 海力士 ADR 上市 (募 280 亿美元)，可能成为下半年半导体最大事件

**下周关键事件**:
- 7/30-31 美联储 FOMC 议息会议 (关注措辞)
- 7/30 美国 6 月 PCE 通胀数据
- 8/1 韩国 7 月出口数据 (HBM/存储出口是观察重点)
- 8/4 AMD Q2 财报 + 业绩指引
- 8/5 SK 海力士美股 ADR 上市
