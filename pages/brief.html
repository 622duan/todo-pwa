## 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**本周政策密集落地，这是 10 月以来最重的一周。**

**国常会「AI+」三大部署**（原话要点）：
- **夯实底座**：加强技术攻关和算法创新，促进**算电协同**，增加高质量数据供给

**Mavis 点评**：🟢 政策面是当前最确定的变量。10.16 国常会 + 10.20 发改委 + 10.22 产业基础规划，三份文件在**同一周**把「AI+ 落地应用」「扩内需 5 年方案」「产业基础自主可控」三条主线钉死。价格法修正尤其关键——首次明确「不正当价格行为认定标准」和「制止低价倾销」配套规则，这是对光伏、锂电、MCU 内卷式价格战的直接法律约束。注意「严禁一哄而上、盲目投资」的表述也在新质生产力意见里出现，说明监管层在防的是「政策套利式伪产能」。

### 2.3 🟣 社会面 S

**就业（10.10 国新办「开局起步『十五五』」发布会）**
- 1-9 月城镇新增就业 **1052 万人**，完成全年目标 **87.7%**
- 前 8 个月城镇调查失业率均值 **5.2%**
- 「十四五」累计新增就业超 **6200 万人**
- 截至 9 月底：基本养老/失业/工伤保险参保 **10.79 亿 / 2.51 亿 / 3.27 亿人**，三项基金累计结余 **11.2 万亿元**
- 专业技术人才超 **8000 万人**，技能劳动者超 **2.2 亿人**，高技能人才超 **7200 万人**
- 职业伤害保障试点累计参保 **3727 万人**、参保单数 **1087 亿单**，平台企业 **25 家**，已覆盖全国所有省份
- 社保卡持卡 **13.9 亿人**，电子社保卡 **11.2 亿人**，社保业务线上办理量 **>80%**

**「十五五」就业三大抓手**：1 个目标（高质量充分就业）+ 3 个重点（稳总量、破结构性矛盾、重点群体）+ 2 项保障（服务供给、权益保障）。「**2 个计划**」：高校毕业生等青年就业支持计划、灵活就业和新就业形态劳动者就业质量提升计划。「**5 项行动**」：适应人工智能发展促就业行动、技能照亮前程、农民工就业促进行动、高品质就业公共服务供给、人力资源服务+。目标：五年补贴性培训 **5000 万人次**、新增技能证书 **4000 万人次**（其中高级工以上 **1400 万**），**2030 年技能人才占就业人员比例提至 35%**。

**新职业**：「十四五」发布 72 个新职业、近百个新工种；2026 年至今再发 **11 个新职业、23 个新工种**，颁布 **56 个国家职业标准**。盯住 AI、数字经济、绿色低碳、现代服务。

**民生其他**：第 48 届世界技能大赛（9.22-9.27 上海）中国代表团 **41 金 11 银 4 铜**，连续五届金牌榜与团体总分世界第一。社保「五个化」：数字化、智能化、便利化、精准化、大众化——已探索「人工智能+社保」（智导/智办/智审/智控）。

**Mavis 点评**：🟡 就业是这周最稳的板块，**87.7% 完成度 + 5.2% 失业率**说明基本盘没塌。但有一条暗线值得盯：人社部把「**适应人工智能发展促就业行动**」单独列为 5 项行动之首——这等于官方承认 AI 已经对岗位结构产生实际冲击。真正的风险不在失业率数字，而在**新职业的技能证书转化率**：AI 训练师这类岗位的薪资还没跑出来，4000 万人次考证如果没有配套的岗位增量，就是把焦虑制度化。人口数据本期无新发布。

**AI 芯片市场格局**：2026 年国产加速卡全年出货预计 **300-400 万张**，国内份额**首破 60%**，英伟达国内份额降至 **40% 以下**。IDC 数据：2026 H1 英伟达在中国数据中心 AI 芯片份额降至 **34%**，华为升至 **28%**。京东云 9.9 宣布建**十万卡**智算集群，采用摩尔线程 GPU。

**软硬件生态**：华为 CANN 基础软件 2025 年 8 月全面开源。超节点技术把通信损耗从 **30%-40% 降到 10% 以内**，算力利用率从 **60%-70% 提到 90% 以上**，万亿参数训练周期从数月缩至数周。Kimi K3（2.8 万亿参数）官方建议本地部署用 **64 个以上加速器**超节点。

**进出口管制**：10 月美国商务部把 **23 家**中国实体塞进出口管制清单（理由：帮中芯获取设备），许可证一律「推定拒绝」；更早报道称美方计划把多达 **200 家**中国芯片公司列入限制名单。

**材料国产化**：国产 EDA 工具覆盖率从不到 30% 提升至 **85%**（华大九天 10.12）；国产 ArF 光刻胶实现 **28nm 规模化量产**（南大光电，良率 **99.7%**），14nm 浸没式已通过中芯验证并小批量导入；国内半导体光刻胶市场约 **78 亿元**。有研新材 Q3 扣非净利 **+82.38%**，集成电路靶材收入 **+40% 以上**，12 英寸超高纯铜/铜锰靶材已用于 **14 至 3 纳米**制程。英诺赛科建成**全球首条 8 英寸硅基氮化镓量产线**，2026 H1 交付约 **5.47 亿颗**，累计出货破 **25 亿颗**，良率维持 **95% 以上**。

**Mavis 点评**：🟢 芯片是唯一「政策 + 产业 + 业绩」三重共振的板块。三个判断：①**设备订单不是问题，交付才是**——北方华创 850 亿在手订单排到 2028，但 H1 净利只 +5.05%，卡在零部件 7.1% 的国产化率上，**零部件是 2027 年最确定的国产替代主线**；②**AI 芯片进入验证期**——寒武纪 Q3 环比净利只 +8%、**合同负债从 1.88 亿降到 1.41 亿**，这是最需要盯的两个先行指标，说明订单节奏在放缓而非加速；③**台积电对 2027 年保持审慎，而国产算力在扩产**——这两个信号放在一起，指向同一个结论：**存储供给而非算力需求，将是 2027 年算力扩张的真正天花板**。

## ✏️ 五、编辑后记

今天这条主线其实只有一根：**存储涨价正在把整个中国科技制造业的利润表重新洗牌**。

上游，DRAM 合约价再涨 10%-20%，长鑫前三季净利 **1310-1325 亿元**、同比扭亏 26 倍；中游，设备厂商订单排到 2028 年但交付被零部件卡死，国产化率 35% 和 7.1% 的鸿沟成了整条链的天花板；下游，手机出货跌 20% 创 14 年新低，均价却涨 20%，国产四家安卓品牌海外份额一年丢掉 5 个百分点。宏观层面，PPI **+5.0%** 创四年新高，但 PPI-CPI 剪刀差拉到 4.1pct，说明这是成本推动而非需求拉动。

### 六条独立判断

**1. 这轮手机下滑不是周期，是成本结构的永久性改变。**
证据链太干净了：中端机存储占 BOM **40%**，400 美元以下机型近 **60%**，而全球出货 -20%~-22%。周期下行会均值回归，但成本占比不会自己降回去。除非 HBM 挤占的产能回吐，否则 2027 年之前手机都是「量跌价升」。

**2. 真正的国产替代战场不在整机，在零部件。**
整机国产化率 35% 已经不低，刻蚀甚至 55%-65%，但零部件只有 **7.1%**。ASML 对韩国市场替换件**全面涨价 10%**，2027 年生效——定价权还握在海外手里。零部件扩产周期 12-18 个月，意味着这一替代窗口是 2027-2028 的事，不是 2026。**现在追设备商是买明年的贝塔，买零部件商才是买 2028 年的贝塔。**

**3. 寒武纪的合同负债是这轮最该盯的数字。**
Q3 净利同比 +147.74% 很漂亮，但环比只 +8%，而且**合同负债从 1.88 亿降到 1.41 亿**。合同负债是客户预付的钱，它掉头向下意味着后续订单节奏在放缓。国产算力「躺赢」阶段结束了——出口管制给的窗口红利正在被 Day 0 适配的普及所稀释，芯片厂商之间的差异化优势在收窄。

**4. 「金九银十」没来，因为需求被提前透支了。**
十位产业链人士的反馈高度一致：5-6 月涨价函一封接一封，客户提前备货，9-10 月反而淡。消费类 MCU 原厂说「全年计划都没完成」，工业/汽车电子说「增长超 50%」。**这是双轨制，不是普涨。**任何把「半导体上行」当整体叙事的判断都会被打脸。

**5. AI 手机真正的对手不是模型，是平台。**
豆包的 **155 款拒绝清单**（微信、QQ、淘宝、支付宝、高德、美团、快手）说明，AI 智能体想替代的是各家最核心的流量入口。这不是技术问题，是商业模式问题。**2027 年之前，AI 手机只能做到「你说我做」**，做不到「我自己做」。

**6. 最好的国产存储股票，恰好是估值最贵的。**
长鑫 3.06 万亿市值、年内 +419.86%，同时 Q3 净利环比只 +1.04%-3.88%。市场在赌 4F² 突破能改写全球存储格局，但 4F² 仍在**早期验证阶段**，良率/产量/毛利率/客户认证四项全未定。基本面在减速、叙事在加速——这是最危险的组合。

### 风险提示

1. **存储周期拐点**：Q4 涨幅已收窄，长鑫 Q3 环比利润只 +1%-3.88%，涨价斜率见顶信号明确。若 2027 上半年海外扩产提前，链条可能急转直下。
2. **AI 资本开支可持续性**：Meta 支出承诺飙至 **8250 亿美元**、5 年期 CDS 升至约 120bp；CoreWeave 融资缺口高盛算 **230 亿**、伯恩斯坦算 **760 亿**（差三倍）。TS Lombard 推演泡沫可能在 **2028 年初**破裂，标普 500 跌 30%、科技股跌 **40%**。
3. **地缘与油价**：布伦特 **116.7 美元**（10.23 +4.00%），霍尔木兹局势升级直接传导 PPI 与 CPI。BMI 已把 2026 布伦特预测从 83 上调到 **93 美元**。
4. **消费需求二次探底**：9 月服务价格已由涨转跌（-0.2%），核心 CPI 持平 1.0%，PPI-CPI 剪刀差 4.1pct。若内需不接棒，四季度靠价格传导的复苏难以为继。
5. **地缘出口管制**：美国 10 月将 23 家中国实体入清单并「推定拒绝」许可证，另有 200 家传闻名单。设备/EDA/材料受限将直接冲击国产扩产节奏。
6. **政策执行风险**：新质生产力意见明确「严禁借发展新质生产力之名违规滥用政策，对一哄而上、盲目投资造成重大损失的严肃追责」——地方上马的低效产线面临出清压力。
7. **厄尔尼诺**：WMO 预计可能是 **70 年来最强**、持续至 2027 年 2 月，冲击铜/锂/镍的干旱与冶炼。
