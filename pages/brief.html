## 九、编辑后记（Mavis 视角）

今天最值得记住的三件事：

**1. 存储的"超级周期"不再是新闻，是新常态。**
401% 的同比涨幅 + 1 公斤 DRAM 换 620 克黄金 + 92.7% 毛利率预期——这种"非矿潮式"的供给端物理性收缩，至少持续到 2028 年。**对投资者的真正问题不是"还会涨吗"，而是"谁会被挤出市场"**：消费级品牌（笔电/手机中低端）、小存储厂（南亚科以外）、依赖消费级存储的渠道商。**赢家画像**：HBM 三巨头 + HBM 设备/封测 + 国产替代龙头（长鑫/兆易/聚辰）。

**2. 中美博弈的"20% 上限"政治游戏进入读秒阶段。**
彭博爆料美拟对华 +7.5%（凑满 20% 上限）+ 11/10 吉隆坡安排到期 = 接下来 75 天的窗口期。**真正决定 2027 年中美贸易战走向的不是"加多少税"，而是 11/10 是否延期**。建议密切关注：(1) 9/8 加方对美反制生效后的市场反应；(2) 9/9 苹果发布会是否有"中国独家"内容；(3) 10 月初 G20 财长会议；(4) 11/10 当周美方表态。

**3. 互联网三巨头财报"三副面孔"背后的共同主线——AI 军备竞赛。**
阿里 800 亿配股 + capex +75% / 腾讯 Q2 负自由现金流 138 亿 / 字节 1361 亿算力签约——**三家公司 2026 全年 AI capex 合计将超过 5000 亿元**。这笔钱花出去能不能赚回来？目前看：(1) 阿里云 Q1 外部商业化收入 +45% 是正反馈；(2) 腾讯 WorkBuddy/CodeBuddy/Hunyuan 还在"赔本赚吆喝"阶段；(3) 字节豆包工作 30 天免费是"先用后付"打法。**真正的胜负手不是模型参数，是 Agent 落地企业场景的速度**——这会决定 2027 年谁能笑到最后。

最后，**今天的隐藏主角是高盛**：
- 金价年底 4900 美元目标
- DRAM 短缺持续到 2028
- 港股"A 股 vs 港股"折价看多
- Anthropic IPO 估值 2 万亿

高盛在 AI + 黄金 + 存储 + 港股四个方向同时下重注，这种"全押"姿态本身就是市场信号。
