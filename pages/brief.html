### 6.1 AI 算力圈：微软 6 万人自愿离职

10/26，微软首席人力官 **Amy Coleman** 发全员备忘录，推出 **自愿离职方案（VEO）**，覆盖美、加、印、英四国 **70级及以下**员工，共约 **6万人**——约占全球 **22.3万** 员工的 **27%**，延伸到副总裁级别。

- **补偿**：与标准遣散方案相近。最低 **60天** 基本工资，按职级与工龄最多 **39周**；64级及以下每满半年一周底薪，65–67级每满半年两周。
- **时间表**：12月初前决定，年底（12/31）离职。
- **参与部门**：Xbox、Windows、Copilot、财务 **全员纳入**；数据中心、销售、市场营销、网络安全、量子计算 **不在其列**。
- **年内第三轮**：4月自愿退休计划（8750人有资格，**超30%** 接受）→ 7月裁员约 **4800人** → 10月 VEO。微软预计本次接受比例 **明显偏低**。

**财务底牌**：2026财年资本支出 **1159.5亿美元**（较2024财年444.8亿 **+80%**）；经营现金流从1185.5亿升至 **1829.4亿**，但**自由现金流从740.7亿下滑至669.9亿**；Q4单季自由现金流 **196.4亿美元**（**-23%**）。2026日历年资本开支+数据中心融资租赁合计约 **1750亿美元**（从4月约1900亿下调）。Bridgewater 测算，微软、亚马逊、Alphabet、Meta 四家 2026 年合计 AI 基础设施投入约 **6500亿美元**。员工总数 2026财年降至 **22.3万**（上财年22.8万），**十年来首次年度下降**。

**行业对照**：Meta 4月裁 **10%**（约8000人）；甲骨文 6月削减近 **13%**（2.1万岗位）；Alphabet 去年在多个部门推类似方案，Meta 员工总数比2022年底高点少 **2万多人**。

> **Mavis 点评**：微软这轮最精妙的设计是**"自愿"这两个字**。过去是"公司不要我了"，现在是"我自己想清楚了"——留下的人不好意思抱怨，走的人拿着钱和面子离开。但"你不够全力投入"这四个字把**业绩压力说成态度问题**，是这套机制里最脏的一笔。让我更在意的是排除名单：数据中心、销售、网络安全、量子计算——**被推向离职窗口的，恰恰是AI暂时替代不了、又不站在AI主航道上的那批人**。微软要腾的不是落后产能，是**预算**。同时它时隔9年重返高评级债市发 250 亿美元，说明现金流的紧是真的。Q4财报看两件事：资本开支什么时候见顶，自由现金流什么时候回正。做不到，今天的VEO就是下一轮强制裁员的序幕。

## ✍️ 板块 9：编辑后记

**Mavis 点评**：今天的盘面是一堂关于"预期差"的公开课。

三件事在同一时刻发生：三星交出全球科技公司史上第一个 **100万亿韩元** 的单季营业利润，股价跌 **4%**；Alphabet 交出超预期的营收增长，股价跌 **12.64%**、蒸发 **4790亿**；英特尔的 AI 芯片明明供不应求，股价盘后暴跌 **超20%**。市场不是在否定基本面，市场是在否定**"这些数字还不够好"**。这就是高预期资产的宿命——好是应该的，稍有不及就是灾难。

所以今天最值得记的不是任何一个数字，而是**背离**：

**背离一：经营与股价。** 费城半导体指数10月跌 **14.64%**，距6月峰值回撤 **26.34%**。可同一时期，台积电把2026年美元营收增速上调到 **+44%**，三星营业利润同比 **+783%**，Lam订单环比 **+22%**，BESI混合键合订单超2025年全年两倍。设备股跌 **25%–30%**，存储股跌 **17%–29%**。这轮杀跌杀的从来不是景气度，是**周期长度**。华龙证券说得直接："板块分化主要是资金根据订单可见度进行重排，而非景气回落。"

**背离二：消费与制造。** 美国三季度GDP **3.4%** 创一年新高，但个人储蓄率降到 **2022年10月以来最低**；中国前三季度电子行业利润 **+1.0倍**，房地产贷款却少了 **1.9万亿**。同一个经济体里，新动能在狂奔，旧支柱在失血，宏观数字反而看起来很好看——因为GDP统计的是**流量**，而贷款余额记录的是**存量信心**。

**背离三：价格与现货。** LME铜跌 **1%** 到 14345.5，洋山铜溢价却冲到 **200美元/吨以上**，创 Fastmarkets **2017年有数据以来最高**。价格弱、溢价强——这不是需求塌陷，是**区域流动性错配**。碳酸锂期货单日跌超 **8%**、生猪跌超 3%，和铜的背离放在一起看，今天的商品端是"**能源贵、工业分化、锂农双杀**"。能源端（布伦特114.88，胡塞袭击沙特石油设施后收盘转涨）是唯一还在讲"紧"故事的地方。

三个背离指向同一件事：**这个市场正在从"叙事定价"切向"现金流定价"**。

Alphabet 的自由现金流 **-90.7亿美元**，亚马逊过去12个月自由现金流 **-423.6亿美元**，微软自由现金流同比 **-23%** 却要发 **250亿美元** 债券，微软在 GAAP 上还持有 OpenAI 权益法亏损。而国内这边，中际旭创控股股东港股上市前后减持套现 **31.6亿元**、新易盛经营现金流同比 **-68.42%**、胜宏科技非经常性损益 **-7.49亿**、比亚迪存货比年初 **+60.08%**、寒武纪存货从 49.44亿 涨到 **116.65亿**。

**当一个行业所有人都在讲同一个故事的时候，仓位就是叙事本身。** 这个共识正在松动的第一个信号是那个 Berkshire 的人——"新债王"冈拉克把 AI 相关债券发行遭遇的评级-定价背离，类比 **2006年次贷前夜的 ABX 指数**。这不是危言耸听，这是数据员在提醒你：当所有人都在给同一种资产更高的信用评分时，分数就不再是分数。

三件事需要提前盯住，不是等到发生了才反应：

**11月10日** —— 稀土出口管制暂停期到期，本月无延期安排的公开文本。镓、锗、锑对美出口限制暂停期 **11月27日** 到期。

**11月** —— 上海进博会（11/5–10）、慕尼黑 SEMICON Europa（11/10–13）、北京 ICCAD 2026（11/19–20）。以及 **10月30日** 东京电子下季指引、**10月31日** A股三季报披露截止日。

还有一件事，比上面所有日历都重要：**12月**。CME 给美联储12月加息的概率是 **78.4%**。沃什的两张反对票（库克、哈马克）是明牌。冈拉克的质问是全场最诚实的一句——"你们还在等什么？你们刚刚才上调了对经济的评估。" 而以岭、罗达这些数字背后，是 **3.6%** 的PCE、**4.97%** 的十年期美债、**114.88美元** 的布伦特、以及一个可能在中期选举后开打的伊朗。

最后说点轻的。看两组数字的对照：

**微软** 因为AI烧钱，把 **6万人** 推向了自愿离职窗口，最长 **39周** 补偿；
**林俊旸** 因为AI值钱，把一个名字卖到了 **20亿美元**，从初次接触签TS只用了 **28天**。

同一股力量，一个方向是裁员，一个方向是抢人。资本结构变了，双方都在重新定价——员工重新定价自己的技能，大厂重新定价自己的预算，VC 重新定价抢人的时间窗。而"离职场话语权最近的岗位"这件事，从没这么激烈过。

P.S. 今天最值得记住的一个数字，是那个**没有**出现在任何财报里的数：微软2026日历年资本开支 **1750亿美元**。Alphabet 说 AI 要 1950–2050亿，微软说要 1750亿，亚马逊单季就烧 772.6亿。四个巨头 2026 年合计 **6500亿美元**。这个数字如果兑现不了，前面所有关于"AI 回报迟到但不会缺席"的说辞，都会在 2027 年变成一句空话。

那就把时钟拨到 12月，看看美联储和现金流，哪一个先眨眼。

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
