### 🏛️ 政策圈
- **央行要换锚了**。潘功胜 10·19 明确"研究择机把公开市场主要操作品种的期限切换为隔夜"，公开市场隔夜回购利率将成主要政策利率。董希淼的判断是：买断式逆回购将取代 MLF 成为中长期流动性主要投放渠道，隔夜利率取代 7 天期，**贷款利率定价基准多元化，退出存贷款基准利率**。这意味着"降息降准"这类总量工具的紧迫性下降。
- **10·26-10·30 是月度资金大考**。税期顺延至 10·26-10·28、26 日隔夜+7 天逆回购合计到期 **3380 亿**、27 日 MLF 到期 **9000 亿**、30 日跨月、全周政府债净缴款 **4134 亿**（2025 年以来中枢 2710 亿）。刘郁判断"资金面或面临一定挑战"，但央行 10·21-11·2 的隔夜逆回购上限 10000 亿/日已提前对冲。
- **私募母基金新规征求意见**，投资其他私募基金份额不低于净资产 **80%**；花旗证券（中国）获批，外资独资券商增至 **7 家**。

### 8.4 编辑后记 · 三个不那么显然的信号

**信号一：央行在"减长钱、加短钱"，这不是宽松也不是收紧，是换一种调控方式。**
10 月的操作组合看起来矛盾：MLF 净回笼 2000 亿（年内第三次净回笼），但中期流动性整体仍净投放 2000 亿（连续第四个月），而且买断式逆回购加力 4000 亿。拆开看就清楚了：**央行在把"中长期资金的投放渠道"从 MLF 换成买断式逆回购，同时把"政策利率的锚"从 7 天换成隔夜。** 缩的只是 MLF 这个工具，不是钱的总量。真正的信号在潘功胜那句"研究择机"——用"研究"而不是"决定"，说明换锚时点未定，市场却已经开始交易这个预期。这就是为什么 10Y 国债 1.64% 会比"钱实际变多"跑得更快。**交易预期和落地之间，有一段会不舒服的落差。**

**信号二：存储的钱，正在从"卖模组的"手里，流向"造晶圆的"手里。**
江波龙 Q3 净利环比 -35.6%，美光同时宣布 1000 亿美元长单 + 180 亿现金押金 + 86% 毛利率。表面看是"存储行业景气度见顶"和"存储行业超级景气"同时发生，矛盾吗？不矛盾。**江波龙不产晶圆，它赚的是"低价库存 × 高价售价"的价差。这个价差是一次的——库存吃完了就没了。美光赚的是"产能稀缺 + 长期锁价"，这是可以复利的。** 同样的产业景气，两种商业模式，一个在还旧账，一个在开新户。江波龙自己的表述最诚实："存储行业正在从消费类价格周期转向 AI 驱动技术周期。" 换句话说，**存储的估值锚正在从"涨价周期股"变成"AI 基础设施股"**——这意味着不该再用周期股的 PB 去看，也不该再用周期股的顶来判断。

**信号三：地产真正的变化，是"官方开始不看投资了"。**
前三季度房地产开发投资 -20.6%、新开工 -24.9%，但毛盛勇在发布会上主动把观察重心从"投资"切到"成交、库存、价格"。这不是数据不好回避，而是**指标体系本身换代了**。支撑这个判断的硬数据：二手房网签 +10.7% 且占比过半、住宅销售均价 15 个月来首次同比转正、上海二手同比 +0.8% 是 70 城唯一。旧系统是"拿地-开工-预售-普涨"，新系统是"现房-项目信用-好房子溢价-存量流通"。**判断中国地产的正确姿势正在从"投资增速回升没有"换成"二手房流通加速了没有、好房子溢价出现了没有"。** 而深圳把折扣从 85 折收回 93 折这个细节，是新系统里最有说服力的一个信号——它意味着开发商终于有定价权了，虽然这个定价权来自"不再需要靠降价换现金流"。
