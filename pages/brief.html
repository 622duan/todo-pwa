- **PRISMO PDS8®** 碳化硅外延设备：泛半导体新材料方向

- 目标 5 年内覆盖 **60% 以上** 集成电路高端设备、**70% 以上** 先进封装设备

### 2.2 半导体制造 🟢（高盛上调存储三季报）

**【高盛 9 月 1 日报告】** 维持三星电子、SK 海力士"买入"评级
- 三星电子目标价 **49 万韩元**（普通股）/ **36 万韩元**（优先股）
- SK 海力士目标价 **350 万韩元**（对应 2026-2027 平均盈利 9x P/E）
- 核心逻辑：DRAM/NAND Q3 ASP 走势与此前预期基本吻合，存储行业仍处景气上行通道
- 风险提示：存储供需恶化+三星手机利润收缩+移动 OLED 份额下降+SK 海力士 HBM 进展

**【TrendForce 上调预测】**
- Q3 PC DRAM 涨幅预期由 15-20% **上调至 18-23%**（已超三星/SK 此前预计 17%）
- Q3 服务器 DRAM 涨幅 **13-18%**（符合高盛预计 18%）
- Q3 移动 DRAM 涨幅 **8-13%**（远低于 Q2 的 70-83%）
- Q4 移动 DRAM 涨幅进一步降至 **0%-5%**（需求降温）

**【现货 vs 合约溢价】**
- DDR5 16Gb 现货价格较合约 **溢价 16%**
- DDR4 8Gb 现货价格较合约 **溢价 43%**
- 现货强 = 后续合约价仍有上调空间

**【CFM 闪存市场 9 月 1 日指数】**
- NAND 指数 **2980.03**（+0.36%）
- DRAM 指数 **4274.57**（+0.01%）
- 9 月 1 日 18:00 统计：121 个产品，2 涨 116 平 3 跌（市场观望为主）

**【闪迪/西数动态】** 据传三星存储业务部门已将 **2031 年前 70% 产能** 锁给 LTA 长协客户

**Mavis 点评**：
> 高盛这次的报告核心是"上调但不追高"——Q3 涨幅超预期被验证，Q4 移动 DRAM 涨幅却要降到 0-5%。这意味着**存储芯片这波最舒服的行情是 Q3，Q4 开始分化**：服务器/HBM 继续强，消费类（手机/PC）开始松劲。要配置存储股的，**9 月底前是窗口期**。

> Q3 存储涨价是"卖方市场"的极致演绎——服务器 eSSD 涨 25-30%、DDR4 现货溢价 43%，这种行情**上一次出现还是 2017-2018 年**。但和上次不同，这次是 AI 算力虹吸造成的"结构性短缺"，不是全面紧缺。意味着**消费类（手机/PC）Q4 会松劲，AI 链（HBM/服务器 DRAM/eSSD）继续紧**。

### 2.4 半导体设计 🟡（手机 SoC 的存储焦虑）

**【手机芯片厂的成本困局】**
- 存储占手机 BOM **50-70%**，500 美元机型的 12GB+1TB / 16GB+1TB 版本存储成本**已超 BOM 总额**
- 苹果、华为凭借大单量签长协：**苹果三年长协（今年续约，价格翻倍但保供）**、华为长协覆盖稳定
- 其他安卓品牌（小米/OPPO/vivo/荣耀）合约期**从年签→半年签→季签**，议价权被压缩
- 联发科、紫光展锐等中低端 SoC 受冲击最大，150 美元以下机型"涨无可涨"
- 小米 Q2 出货暴跌 26.5%、毛利率 11.5%→8.5%、调整后净利连续两季 -40%+

**【HBM 竞争格局】**
- 三星 HBM3E 在 NVIDIA 验证持续推进，但量产 HBM3E **2027 Q1 前不会进入开放市场**
- SK 海力士仍是 HBM 龙头，HBM3E 严重分配中
- 长鑫科技（CXMT）DDR5 持续推进，9 月 2 日股价 56.50 元（-2.60%）

**【国产 GPU/AI 芯片】** 寒武纪、海光信息、龙芯中科、摩尔线程等持续推进，2026 下半年陆续有新品落地（关注 9 月底-10 月各厂商新品发布会）

**Mavis 点评**：
> 手机 SoC 的"存储焦虑"本质上是**长协 vs 短协的阶级分化**：苹果/华为吃得下涨价（量大利厚），其他安卓只能"以季度为单位讨饭"。Q4 要看两个信号：① 苹果 iPhone 18 是否继续维持原价 ② 华为 Mate 90 韬定律 3D 堆叠芯片能否对冲存储涨价。**短期谁有长协谁就是赢家**。

    function renderBrief(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('briefContent').innerHTML = html;
      } catch (e) {
        document.getElementById('briefContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadBrief() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-brief-${dateStr}.md`;
        // Add BOM for proper UTF-8 in Notepad / some markdown editors
        const blob = new Blob(['\uFEFF' + DEFAULT_BRIEF], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
