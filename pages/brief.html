**Mavis 点评**：🟥 **长鑫科技用 3 个季度做到净利超中国石油全年 80%**——这是今天所有数字里最炸的一个，说明**存储的利润弹性远超想象**。但更该看的是寒武纪 Q3 归母净利率 **39.75%** 对海光的 **17.90%**：两家毛利率只差 0.06pct，**差距全在费用和权益归属**。海光研发投入是寒武纪的 3.65 倍、少数股东分走 18% 净利、且经营现金流已经转负 -24.43 亿。**这意味着国产算力双雄已经分出两种打法：寒武纪是"高周转精选客户"，海光是"重投入换生态"，未来 4 个季度的现金流质量会是分水岭**。设备端，国产化率从 16% 走到 26% 只用了两年，交期从 2 个月拉长到 5 个月——**产能瓶颈已经从"能不能造"转移到"造多少"**。

## 6. ✏️ 五、编辑后记

今天的数据讲了一个**结构性分化的故事**：政策在给长期（人口、服务业、母基金长期钱），产业在给短期（AI 算力利润兑现），而消费端在承担所有代价（手机 -22%、PC 缩容、二手存储芯片、厂商停产）。

四条主线：

**主线一：AI 算力从"资本开支故事"进入"报表利润兑现期"。** 寒武纪 Q3 净利 +147.74%、长鑫 3 个季度净利超中国石油全年 80%、长电扣非净利接近翻倍、源杰预告 +578.85%~659.70%——这不是预期，是已经落在纸面上的数字。

**主线二：存储涨价从"普涨"转为"结构性分配"。** Q4 出现罕见的品类倒挂：企业级 SSD 加速涨（+23~28%），消费级 SSD 涨不动。同一个季度，AWS 产能排到 2028 年，低端手机用二手颗粒。这是产能被 AI 拿走后剩下的分配结果。

**主线三：国产链的胜负手从"能不能做"转向"现金流质量"。** 设备国产化率 16%→26%、中微 8800 个反应台、华海清科离子注入机整机国产化 95.6%——制造能力已经不是问题。问题在寒武纪存货 +136%、海光经营现金流转负 -24.43 亿、寒武纪计提存货跌价 5.02 亿。

**主线四：政策从"刺激需求"转向"修复结构"。** 人口 + 服务业 + 母基金 + 私��母基金 + AI 就业，四条线指向同一个判断：**中国经济的下一个增量不来自地产和基建，而来自人力资本、第三产业和长期资金的制度化进场**。

### Mavis 独立判断（6 条）

**① 存储拐点会来得比多数人预期的晚，但幅度可能超预期。**
理由：新建存储晶圆厂完整周期 1.5~2 年（西南证券胡杨）到 2~3 年（国泰基金李星全），即使今天投，2027 年底前不形成有效供给。已有在建项目（SK 海力士大连二厂 2027H1、晶合集成四期 2028Q2 满产、深科技封测 2028/12）普遍在 2027H2 之后才有效。我倾向李星全的"缺口延续至 2028 年之后"口径，理由是**产能爬坡天然慢于扩产计划，且目前看不到 AI 需求见顶信号**。但如果 AI 资本开支在 2027 年意外降温，价格回落斜率会比上行斜率陡得多——**周期行业的下跌从来比上涨快**。

**② 长鑫"拒接苹果报价"这件事的意义被低估了。**
理由：这不是情绪表达，是**产能稀缺下的客户排序**。DRAM 客户切换供应商涉及平台认证、模组适配、整机验证和长期供货承诺，把晶圆投给验证成熟、需求确定的客户是教科书级的商业理性。真正的产业位置信号是**"国产存储开始有资格选择客户"**——这比任何扩产数字都更能说明议价权变化。但要清醒：这**是阶段性战略资产，不等于体系能力**。海外替代供应 2030 年只能覆盖 48% 需求的现实，意味着中国在镓锗稀土上的定价权能维持很多年。

**③ 国产算力双雄会分道扬镳，寒武纪赢短期、海光赢长期。**
理由：两家毛利率只差 0.06pct，**差距全在费用结构和权益归属**——海光研发投入是寒武纪 3.65 倍、少数股东分走 18% 净利、合同负债从 20.19 亿清到 0.12 亿、经营现金流已转负 -24.43 亿。寒武纪 39.75% 的单季净利率虽亮眼，但**存货 116.65 亿（+135.96%）+ 应付票据 49.66 亿 + 计提 5.02 亿跌价**说明它同样在用供应链负债买确定性。**未来 4 个季度看现金流，2 年后看生态**。海光董事长历军已明说四季度及全年收入利润将持续增长，董事长口径的现金流故事比分析师的乐观更值得听。

**④ 设备端的下一个瓶颈不是技术，是产能和零部件。**
理由：交期从 2 个月拉到 5 个月，**说明需求已经追上了国产供给能力**——这是好信号。同时**零部件自给率仍 <35%**，射频电源、AlN 陶瓷腔体、OES 光谱仪是三大卡点。四川英杰电气双频射频源纹波 <0.08%、整机成本 -12% 说明国产替代在零部件层是成立的。**2027 年前这三大件国产化率能否超 60%，决定了设备自主化是走到 40% 还是 60%**。我会盯住这个数。

**⑤ 手机市场 2027 年不会转正，但华为会继续扩大领先。**
理由：IDC 判断复苏最早 2028 年，我认同但理由更直接——**Q3 存储成本同比 +350% 仍在涨，而手机厂已无库存缓冲**。华为 +17.3% 的增长不是靠性价比，是靠**多形态（折叠屏全球 2000 万台、国内份额超 70%）+ 克制涨价 + 麒麟 9050 Pro 端侧 30B 模型**。端侧 AI 是继影像之后**下一个真实的换机理由**——昇腾集群与手机 NPU 同源意味着云端/端侧模型切换成本下降，这个生态位比参数领先值钱得多。

**⑥ 小金属的跟踪锚点是"豁免到期后的放行节奏"，不是日度价格。**
理由：管制范围每扩容一次，存量库存就被重新定价一次，**库存从成本项变成看涨期权**。钼钽的主升逻辑最扎实（低库存 + 供给事件明确），稀土镨钕与镝的时间窗口最明确（11/10 管制暂停到期），铟锗镓铋弹性最大但兑现节奏最不确定。**加工端的顺价能力才是管制红利真正的落点**——如果加工端能主动报价而非被动承受毛利率，才说明这轮不是纯情绪。反过来说，如果加工端被下游压价，涨价的持续性就存疑。
