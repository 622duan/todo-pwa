## 2. 📊 一、宏观 PEST

**【头条·政策剧变】央行政策利率正式"换锚"**

| 要素 | 内容 | 日期 |
|------|------|------|
| 公告 | 央行公开市场业务公告〔2026〕第 13 号 | 2026-10-30 |

| 7 天期定位 | 调整为固定数量、利率招标、多重价位中标，主要在**税期、月末**时点开展 | 11.02 生效 |
| 加减点基准 | 临时正/逆回购、境外央行类机构回购工具等，统一改以**隔夜逆回购利率为锚** | 11.02 生效 |

[央行公告原文](https://www.pbc.gov.cn/zhengcehuobisi/125207/125213/125431/125469/2026103016375865177/index.html) ｜ [中国证券报解读](https://epaper.cs.com.cn/zgzqb/html/2026-10/31/nw.D110000zgzqb_20261031_1-A02.htm)

**Mavis 点评**：这是**机制改革而非降息**，7 天期利率预计不再披露，市场若当成"隐性降息 15BP"来交易会误判。中信证券明明指出 1.25% 与当前 DR001 运行中枢基本一致——央行是在承认事实锚，不是主动放松。但信号意义在于：**短端利率调控权从"7 天"正式交给"隔夜"**，意味着货币政策框架从数量型向价格型又迈了一步。

## 6. ✏️ 五、编辑后记

### 总论：今天的三条主线

**第一条主线：政策在给财政打补丁，PMI 在给经济降温。**

10 月 23 日国常会的"加力推进服务业扩能提质"、10 月 30 日财政部的"5500 亿结存限额"、10 月 30 日央行的"政策利率换锚"，看似三件事，实际指向同一件事：**土地财政（-27.9%）塌了，政府需要用新工具把增长接住**。另一面，10 月 PMI 三大指数同步跌破荣枯线（制造业 49.3%、非制造业 49.7%、综合 49.7%），建筑业新订单单月塌 5.7pct 到 40.0%。**政策在加码，数据在走弱**——这不是政策无效，是政策有一个滞后期。11 月是关键验证窗口：专项债能否形成实物工作量，决定 4Q 和 2027 年的开局。

**第二条主线：AI 的账单，正在从云端向全产业链传导。**

存储涨 350%、DRAM 成为手机最贵元器件、笔记本内存成本占比从 15% 升到 35%、英特尔单日 -28.58%（40 年最大跌幅）、铠侠第三财季指引低于预期导致 NAND 涨幅从 70% 骤降至 20%-30%——**这是一条完整的传导链**。上游（存储原厂）赚疯了（三巨头单季合计营业利润超 240 万亿韩元，利润率近 80%），中游（模组厂）靠库存价差吃差价（江波龙毛利率 59.08%），下游（手机、PC）正在流血。**中金说的"AI 次贷"（Neocloud 信用债收益率 15%、隐含违约率 60%）是这条链最末端的风险**。

**第三条主线：国产替代的进度，比任何口号都更值得跟踪。**

10 月 15 日，中微、北方华创、拓荆四天内三笔并购、累计超 29 亿元，全部砸向**混合键合**——这是 HBM 堆叠、Chiplet 互连、3D IC 集成的共同底座。同时：新建 12 英寸产线国产设备金额占比已达 **55%**，长存三期国产设备占比首次破 **50%**，长鑫 G5 平台 9 月底量产、Q2 营业利润 **81.7 亿元**（上年同期亏 13 亿）。**但光刻占设备投资 30%、国产化率接近零，中韩 HBM 技术差距约 3 年**——两件事必须一起说。

### Mavis 的七条独立判断

**1. 央行"换锚"不是降息，但比降息更重要。**
隔夜逆回购 1.25% 较原 7 天期 1.40% 低 15BP，但这个"低"是为了匹配 DR001 的实际运行中枢（1.25%-1.30%），属于**向事实利率靠拢**。真正值得关注的是两件事：① 7 天期利率预计不再披露，短端利率的"锚"从此只有一个；② 潘功胜已明确三大方向——优化短端调控、贷款利率定价基准从单一 LPR 转向多元、**退出存贷款基准利率**。后者意味着 2015 年 10 月以来没动过的存贷款基准利率要动了。**如果哪天 LPR 也开始跟隔夜逆回购而不是跟存贷款基准走，整个利率体系的传导链就重画了。**

**2. 10 月 PMI 的回落不是"衰退信号"，是"新旧动能切换的账单"。**
高技术制造 51.3% 和消费品 48.8% 之间 2.5pct 的裂口，比 49.3% 这个数字本身重要得多。装备制造、高技术制造已连续 **27 个月**在扩张区间。真正需要担心的是建筑业新订单 40.0%——**这是地产投资下行的滞后传导，不是新问题**。我的判断：11 月 PMI 大概率回到 49.5%-50.5% 区间，但结构不会变。

**3. 铠侠的指引，比高盛和摩根士丹利的目标价更值得相信。**
当 SK 海力士说"供不应求到 2030 年"、美光 CEO 说"2027-2028 比 2026 更紧"的时候，铠侠说的是**自己 Q3 财报里 NAND ASP 涨幅从 70% 掉到 20%-30%**。这三者不矛盾——**长约覆盖率高、锁产比例大的原厂看到的是 2027-2028 的确定性；靠现货走量的厂商看到的是当季的议价权**。SK 与 14 家客户签约锁了 2027-2028 产能 50% 以上，铠侠没有这个缓冲。**对 A 股模组厂（江波龙、佰维）的判断应该用铠侠的尺子，不是 SK 的尺子**——江波龙存货占总资产 60.12%，它更接近铠侠而不是 SK。

**4. 手机的复苏最早在 2028 年，但"高端化"会先于"复苏"到来。**
IDC 说 2026 全年出货 -16.7%、总值 +6.3% 到 6130 亿美元——**出货和金额第一次反向**。这意味着行业接下来两年不会回到量的增长，只会回到价的增长。三星+苹果份额从 36.9% 冲到 45%、其余品牌合计少 6600 万部，这不是暂时现象，是**低端机在 BOM 成本 +70% 的重压下的被动出清**。华为能逆势增长 18%，靠的是"全价位产品线 + 涨价克制"，本质是**用产品组合的宽度吃掉别人的生存空间**。苹果靠 iPhone 18 Pro 前三周 +23.5% 也说明：**存量换机需求还在，只是被价格卡在门外**。

**5. 光刻是国产设备故事里唯一真正重要的数字，而 ASML 已经告诉你窗口什么时候关。**
CMP 39%、刻蚀 31%、清洗 29%、沉积 27% —— 这些已经过 25% 门槛的环节，是接下来两年国产设备订单的直接受益者。但**光刻占设备投资约 30%，国产化率接近零**。更关键的是 ASML CEO 傅恪礼那句"**2027、2028 年计划产出无法满足客户需求，部分客户已接洽 2029 甚至 2030 年订单**"——**这是官方给国产设备窗口期定的截止线**。而泛林那句"部分设备出货从 12 月季度推迟到 2027 年 3 月季度、12 月季度来自中国营收占比将明显下降"，等于在提醒：**海外设备的约束会自己缓解**。所以国产设备的窗口不是永久的，**大概率在 2027-2028 年随着海外产能释放而收窄**。时间不多了。

**6. 真正的风险不在需求端，在融资端和现金流端。**
中金提出"AI 次贷"：Neocloud 信用债收益率飙到 15%、隐含违约率约 60%。英伟达已经用**逾 50 亿美元担保 Nscale 的 460MW 数据中心**、累计提供约 **1700 亿美元**信用支持；亚马逊另开 **800 亿美元**硬件担保融资。未来支出承诺 8830 亿美元，是 2025 年同期的两倍多。**当一个行业需要由芯片龙头来为下游的债务担保时，风险就从经营层面转移到了金融层面**。而国产链这边同样有现金流红灯：**寒武纪 Q3 经营现金流 -8367.8 万元、摩尔线程 -33.09 亿元**，存货分别较去年末 **+136% 和 +152%**（摩尔线程存货甚至超过前三季营收）——**这些公司赚的是"预付款锁产能"的钱**。存储原厂可以靠长约锁产穿越周期，但如果云厂商融资链条断裂，**长约本身也会变成负担**。这是 2027 年最需要盯的变量。

**7.（补）这条链上最干净的周期见顶信号，不在存储，在碳酸锂。**
存储涨价是因为 AI 抢产能（供给收缩），碳酸锂跌 47% 是因为产能过剩（供给释放）——**两个完全相反的剧本，说明本轮周期不是"普涨"，是结构性错配**。高盛已经预判碳酸锂 **2027-2028 年供应过剩 8%-18%**，基准价今年见顶明年回落。**同一条产业链上，两个环节的供需方向完全相反**——这是判断"哪些是真周期、哪些是假景气"的最锐利标尺。宁德时代董事长在 10 月 31 日说要用大语言模型赋能电化学源头发现，某种意义上也承认了：**在过剩产能里，只能靠"找到新配方"来重新定价**。
