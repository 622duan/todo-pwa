### 8.4 编辑后记（v6 关键改动 · 非显然信号）

> **第一个信号：出口退税 13%→9% + 苹果库克访华 = "中国制造"换挡**
>
> 出口退税下调 4 个百分点，按 2026 前 9 月汽车出口 57.1 万辆（单 9 月+160%）测算，**单年减少退税约 200-300 亿元**。但同期库克访华、苹果中国份额从 8.2% 飙到 18.1%。这两件事合起来看：政策在主动"放弃低端整车出口"，市场在"用脚投票高端品牌"。**结论**：2026Q4-2027H1 选股逻辑要切到"海外建厂进度 + 高端品牌占比"——比亚迪、奇瑞（海外建厂快） vs 长城、理想（依赖国内）。**验证时点**：11 月广州车展 + 12 月中央经济工作会议。

> **第二个信号：兆易净利+1091.5% + 中微卖股票凑利润 = 财报要"穿透看"**
>
> 兆易 H1 净利 +1091.5% 看着吓人，实际是存储涨价 + 低基数。但中微 H1 归母净利 28.25 亿里，**19.82 亿是卖拓荆股票的投资收益**，主业扣非净利只有 8-10 亿。**所有半导体公司 2026 中报都要"穿透"看**——主业扣非 vs 投资收益的拆分，决定 2026Q4 估值修复方向。**结论**：扣非增速 >100% 的公司（澜起 +72.3%、海光 +69.6%、江波龙扭亏、士兰微 +48.3%）是真正的"利润驱动"；扣非一般但靠投资凑数的（中微、北方华创），要警惕"基数失真"。

> **第三个信号：北京公积金 340 万 + 8.28 现房新政 = "房地产要换估值体系"**
>
> 北京 10/1-7 网签同比 +174.7%，但要看到这个数据是**结构性而非全面复苏**——现房/准现房 + 国企央企盘 + 改善型三要素缺一不可。**估值体系要从"销售面积×均价"切到"竣工库存消化 + 现房溢价"**。**结论**：保利发展、招商蛇口、华润置地等"国企 + 现房库存"占比高的，估值修复持续到 2026Q4；高杠杆民企（碧桂园、融创、金科）依然要避开。**风险**：如果 11/10 稀土管制谈判破裂，市场情绪从地产/科技切到"通缩+避险"，地产股估值修复会中断。

        document.body.appendChild(a);
        a.click();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
