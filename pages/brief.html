## 三、八大板块深度

### 板块 1：宏观 PEST（流动性 + 财政 + 价格）

**流动性**
- 🟢 **8 月 25 日 MLF 5000 亿续做，缩量 1000 亿**（上月为加量 1000 亿），但同月 3 个月期买断式逆回购加量 2000 亿，**6 个月期买断式逆回购 10000 亿等量续做**——合计中期流动性净投放 1000 亿
- 🟢 **8 月 27 日—9 月 1 日央行开展隔夜逆回购**，每日上限 6000 亿，**8 月操作次数将达 8 次**（前两个月仅 4 次/月），DR001 围绕政策利率平稳运行
- 🟢 央行二季度货政报告：**"适度宽松、加大逆周期调节"**，框架从"数量型"加速向"价格型"转型
- 🟢 国常会 8 月 21 日部署新一代通信网（6G）建设

**通胀/价格**
- 🟡 7 月 **CPI 同比 +0.5%**（前值 -0.5% 转正），核心 CPI 同比 +0.9%
- 🟡 **PPI 同比 +3.5%**（涨幅回落 0.6pct），智能无人飞行器 +2.5%、智能家庭消费设备 +3.4% 逆势上涨
- 🟢 平板/计算机/手机价格同比 +17.2% / +17.4% / +8.5%，**AI 终端带动消费电子价格回升**

**Mavis 点评**：货币政策已经从"精准滴灌"切换到"适时加力"。**8 月央行的长短组合拳**（MLF 缩量但中长期净投放，隔夜逆回购高频操作）非常聪明——用 7 天+隔夜工具覆盖跨月扰动，用买断式逆回购承接政府债发行。**降准降息还没来，但工具箱已经全部待命**。

**设备**
- 🟢 8 月 28 日发改委定调**"全链条攻坚，决定性突破"**，集成电路被定性为**新兴支柱产业**（不是"战略"了，是"支柱"）
- 🟢 半导体设备整体国产化率从 2024 年 **16% → 2026H1 30%+**，刻蚀/清洗 **40%-50%**，光刻胶 25%、电子特气 40%
- 🟢 **28nm 成熟制程**：清洗/刻蚀/热处理/CMP 国产化率均突破 50%，**已经站稳脚跟**
- 🟡 **14nm 及以下先进制程**：光刻/量测/ALD/离子注入国产化率仍 <10%，是真正卡脖子环节
- 🟢 高盛预测：**2030 年中国芯片业 CapEx 820 亿美元**（较一年前上调 79%），2027 年晶圆制造设备市场 530 亿美元，本土市占率 2028 年从 26% → 38%

**制造**
- 🟢 中芯国际 **14nm N+2 良率突破 80%**，N+3（接近 5nm）试产中，DUV 多重曝光绕开 EUV

**Mavis 点评（综合 8 月 28 日）**：

这周是中国产业格局的关键转折点，三件事压在一起：

1. **集成电路从"战略"升格为"支柱"**——发改委用"决定性突破"四个字给半导体行业定调，2026 年是设备国产化的"决战之年"。光刻机和量测检测是最后的硬骨头，2-3 年内要拿下。

2. **地产预售制 30 年大改**——8/28 三部委新规比 2002 年预售制实施更具历史意义。"封顶预售+现房销售"将彻底改变行业游戏规则：**资金挪用、烂尾延期将成为历史**，但中小房企的流动性绞索会收紧。

3. **AI 行业"中间层大战"开打**——英伟达 129 亿美元收 Hugging Face + Stripe 70 亿收 OpenRouter，**渠道之争白热化**。这意味着 AI 行业的护城河从"模型能力"转向"分发渠道+生态绑定"，国内阿里千问办公出海、DeepSeek 准备科创板 IPO 是同步动作。

**对个人决策**：
- **存储**：刚需早买，DIY 等 2027H2（NAND 先松绑，DRAM 要到 2028）
- **房子**：上海新政窗口期已开，三部委新规对购房者是天大利好，**好城市好地段等得起**
- **AI 应用**：Agent 工具调用（QwenWork / Kimi K3 / DeepSeek）已经能稳定提升个人 30%+ 效率，**普通人最值得投入的方向**
- **投资**：9 月震荡修复概率大，**AI 硬件+半导体+高股息三足鼎立**，CPO 短期超涨建议等回调

**风险提示**：
- 央行短端工具高频操作不代表宽松升级，警惕 9 月 MLF 续做继续缩量
- 美国"全面禁令"尚未正式落地，存储/制造随时可能承压
- 房地产"以旧换新"补贴 2 亿元规模小，"用完即止"可能造成需求前置释放后回落
