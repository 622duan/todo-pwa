## 📊 8 大板块深度

### 1. 宏观 PEST

**🟢 P（政策）— 财政货币协同放松进入新阶段**

央行今日开展 **7000 亿元 6 个月期买断式逆回购**操作，到期 5000 亿元，**净投放 2000 亿元**；10 月 3M+6M 买断式逆回购合计加量续作 4000 亿元。9 月 29 日"929 新政"组合拳落地：PSL 降息扩容 + 7000 亿再贷款额度 + 房贷贴息 + 5500 亿地方债结存限额使用，财政货币协同进入"常态化精准调控"。

**🟥 E（经济）— 出口亮眼，内需分化**

前三季度进出口 **39.94 万亿元** 同比 **+18.8%**，近 5 年同期最快；9 月单月 **5.16 万亿元首次破 5 万亿**，**+27.5%**。**集成电路 +99.1%**、电脑零附件 **+210%**、固态硬盘 **+130%**。9 月社融 **+3.55 万亿**、贷款 **+1.08 万亿** 双双超预期，但 M1 回落至 **+3.2%**、M2-M1 剪刀差扩大至 **4.0pp**，**居民贷款净增接近零**——内需修复不均衡。

**🟥 S（社会）— 房地产结构性回暖，银十"分化"**

10 月 1-7 日 25 城新房日均成交 **+33.8%**（与 2024 同期基本持平），11 城二手房日均 **+42.8%**；但市场分化加剧——济南刚需盘带看量回升，海信君安改善盘国庆成交 22 套，唐冶部分项目日均到访不足 10 组。房贷贴息（年化 1%、最长 5 年）落地满 10 天，**首套刚需 120 ㎡/150 万门槛精准命中**。

**🟥 T（技术）— 货币政策进入观望期**

- 鲍曼（美联储理事）：不认为联储迫切需要再加息，9 月 25bp 加息后需时间观察
- 古尔斯比（芝加哥联储）：核心通胀若维持月化 4% 水平"完全不可接受"
- 10 月加息概率：CME FedWatch 从 22% 飙至 **51.5%**
- 国内：央行重申"不预设汇率目标"，"适度宽松"基调未变，**降准概率高于降息**

**Mavis 点评**：今天最拧巴的画面是"中国出口 +36.3% vs 美国 PPI +5.0%"。全球大宗商品在涨（PPI 上去），但中国自己 CPI 只 +0.9%、核心 CPI 才 +1.0%，**说明这轮通胀主要是输入性的，不是国内需求拉动的**。所以央行的"适度宽松"是对的——不是放水救经济，是给企业降本腾空间，配合财政把"政府债"换成"订单和工资"。居民端是真的冷，M1 跌到 3.2%、M2-M1 差 4pp，说明钱在银行账上趴着不动。对实体最该盯的不是社融总量（这个有政府债托底），而是 **企业中长期贷款 + 居民中长贷**——这两个如果连续 2-3 个月少增，**说明经济内生动能没起来**，央行四季度降准概率会从"可能"升到"必出"。

### 2. 半导体产业链

**🟥 设备 — 阿斯麦救不了芯片股**

阿斯麦 Q3 净销售 **€116.6 亿**（环比 +25%）、净利润 **€49.6 亿**（环比 +70%）、毛利率 **57.5%**，均超预期，**订单已排到 2030 年**。CEO 傅凯：客户每天要求更多产能，"对 2027 和 2028 的产能规划无法完全满足需求"，**正评估把 2028 扩产幅度再提高 30%**。但即便如此，费半 6 连阴、迈威尔 **-6%**、AMD **-5.74%**、Arm **-6.8%**、英特尔 **-4.48%**——**上游设备的订单能见度 ≠ 芯片厂盈利兑现**，巴伦周刊已经点破这层窗户纸。

**🟥 制造 — 台积电法说会前夜**

台积电今晚美股盘前发 Q3 业绩，市场预期营收 **约 1.49 万亿新台币、同比 +51%**，重点看 2025 资本开支。台湾代表团证实：台积电已同意 20 年内采购阿拉斯加 LNG 30% 出气量，并**额外投资 44 亿美元（约 1411 亿新台币）**。中芯国际港股报 **54.3 港元**（-2.25%），1 月以来跌 25.97%，分析师目标价中位数 **96.01 港元**（上行空间 76.8%）。

**🟥 设计 — Arm 暴跌、应用材料领跌**

- Arm Holdings **6 日累跌 21%**，是费半成分股最惨
- 应用材料 **6 日累跌 16%**
- 英特尔 **6 日累跌 13%**，且以色列加特镇工厂**今日发生爆炸致 3 人受伤**
- AMD 跌 5.74%、英伟达跌 3.11%、博通跌 2.89%、高通跌 2.89%
- **唯一上涨**：格罗方德（GlobalFoundries）

**🟥 存储 — HBM4 扩张放缓，需求存疑**

SK 海力士 HBM4 后道设备订单出现**延期迹象**；HBM 4C 后续发单计划尚未明确。但 9 月韩国 ICT 出口 **751.5 亿美元**（史上首次破 700 亿）、半导体出口 **603.3 亿美元**（+262.8%），连续两月刷新单月纪录——**韩国出口与股价背离**，外资年内净卖出 203.7 万亿韩元（约 1415 亿美元）。

**🟥 手机 — 华为 + 苹果吃下 41%，小厂承压**

Omdia：Q3 中国大陆手机出货 **5930 万台** 同比 **-12%**，**创 2013 年以来新低**。华为 + 苹果合计份额 **41%** 领跑，其余厂商承压，全年预计降约 7%。**存储成本高企**是核心压制项。

**🟢 国产替代 — 长鑫存储再获省级力挺**

安徽省委书记李乐成赴**长鑫科技集团**调研："**全力支持长鑫做大做强**，壮大集成电路链主企业、龙头企业，培育专精特新，招引上下游。" 长鑫是国内 DRAM 龙头，这次省一级最高规格站台，对合肥集成电路产业链是明确信号。

**Mavis 点评**：今天是半导体板块的"信仰崩塌日"。阿斯麦财报数字好得不能再好——订单排到 2030、产能要再加 30%——**但市场照样砸盘**。这说明投资者担心的根本不是当下供需，而是"AI 基建能撑多久"。CoreWeave 债收益率 15%、甲骨文 -8.83%、戴尔 -11%、惠与 -4%，**整个 AI 资本开支链条开始出现裂痕**。黄仁勋说会"对开发不安全 AI 的客户断供"，这话听着像道德表态，实则是给资本市场打预防针——**英伟达也意识到，AI 故事要换讲法了**，不能只讲"卖铲子"。今天 SOX 跌 4.3%，但有个细节值得注意：格罗方德是费半 30 多个成分股中**唯一上涨的**。格罗方德的客户大多是车规、IoT，不是 AI，**说明资金在往"非 AI 半导体"避险**。这是个早期信号——如果接下来 1-2 周 AI 资本开支链继续裂，**SOX 可能进入技术性熊市**（较年内高点跌 20%）。对国内是机会：长鑫这种 DRAM 龙头 + 国产 EUV 样机（90% 国产化）会迎来估值修复。

**Mavis 点评**：地产这次的"国庆银十"和过去几轮真不一样——不是全面回暖，是**结构性撕裂**。刚需盘带看量明显回升（济南华山片区中介带看量环比涨），但改善盘"冷热不均"（海信君安 22 套、唐冶个位数）。这说明政策对路：**贴息精准命中 120 ㎡/150 万的首套刚需**，但改善客群没被覆盖到。从投资角度看，机构研报说得对——**2027 年才是地产 β 重估起点**，今年四季度只有"交易性窗口"。**基建是今天最被低估的主线**：6 万亿水网 + 国家算力网 + 1000kV 特高压环网，全部在落地节奏上。**算电协同是核心抓手**——广州算力公司是首个央地合资平台，背后的逻辑是"算力跟着便宜绿电走"，未来 5 年这个赛道会出不少 10 倍股。矿产里，**铜比锂更值得关注**——铜是真实供需紧张（AI、新能源车、光伏、电网全要），锂是"故事性紧张"（储能还在等经济性拐点）。**农业最关心的是牧原的母猪数据**：297 万头已完成调减，说明行业出清进入下半场，**猪周期 2027 年中可能反转**，但短期猪价还会磨。

## ✍️ 编辑后记

今天最值得记住的 3 件事：

**1）通胀与货币政策的"中美分裂"**
中国 PPI 涨 5%、CPI 只涨 0.9%，美国 CPI 涨 3.7%、PPI 还没公布但可能也高。**两个国家都在跟通胀作斗争，但路子完全不一样**——中国是"输入性 + 供给侧"，靠适度宽松 + 财政发力稳住；美国是"需求拉动 + 服务业粘性"，靠美联储可能再加 25bp。**中国降息空间比美国大，但传导效率比美国差**。所以 A 股今天虽然出口数据炸裂（+36.3%），但上证还是跌了 0.88%——因为市场不傻，**资金知道：社融 3.55 万亿靠的是政府债，居民贷款接近零、M1 跌到 3.2%**，实体经济内生动能没起来。

**2）AI 资本开支链第一个真正的裂口**
CoreWeave 债收益率 15%、戴尔 -11%、甲骨文 -8.83%、惠与 -4%——**这不是单只股票的事，是整个"用债买 GPU 跑 AI"商业模式的怀疑**。马斯克回"吓人"两个字不奇怪——SpaceX 自己也发了不少债。**AI 故事要换讲法**：不能再讲"算力无限扩张"，要讲"算力高效落地"。这对国内反而是机会——Meta 开源 Muse、Google 长 token Gemini 4、阿里适配 Apple Intelligence，都是"不烧钱也能跑 AI"的故事。**中国 AI 资产可能进入"软硬分化"：硬件承压、软件相对抗跌**。

**3）地缘冲突从"叙事"变成"现实"**
胡塞袭击沙特阿美总部 + 霍尔木兹海峡两船遭袭 + 沙特管道扩能绕行 + 伊朗革命卫队放话"等美军舰靠近就击沉"——**这不是远在中东的炮火，是油价 $95 上面贴着的保险费**。今天 WTI +1%、布伦特 $106 站稳，**柴油库存创 1989 年以来新低**，全球供应链"被掐脖子"的感觉越来越实。对国内是双刃剑：**油价高 → 输入性通胀 → 央行宽松空间被压缩**；但**油价高 → 中国新能源/储能/光伏/电池出口竞争力凸显**（9 月汽车出口 +62%，新能源占 60.8%）。能源转型这条主线，在 2026 年的最后三个月，**会比 AI 更确定**。

**📌 一句话总结今天**：
中国在"出口超预期 + 房地产拐点 + 财政货币协同"的三重利好下，**结构上正走在经济企稳的路上**；但美国在"通胀反复 + 加息预期 + AI 泡沫裂痕"的三重压力下，**短期面临估值消化**。接下来 1-2 周最关键的两个节点：10/29 美联储利率决议、10/30 美国 Q3 GDP 终值。**如果美联储真的再加 25bp，全球流动性会再紧一轮；如果不加息，市场会松一口气，AI 资本开支链能喘口气。**
