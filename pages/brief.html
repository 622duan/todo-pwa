## 三、八大板块详解

### 🅰️ 板块 1：宏观 PEST

**🟢 P（政治）：增量政策一揽子落地，"六张网"是核心抓手**

- **央行 9/29 三箭齐发**：① 一年期 PSL 利率 **1.75%→1.5%**（-25bp）；② PSL 扩容至"六张网"——**水网、新型电网、算力网、新一代通信网、城市地下管网、物流网**；③ 科技创新再贷款额度 **1.2→1.4 万亿**（+2000 亿），支农支小再贷款 **4.35→4.85 万亿**（+5000 亿，其中民企 1.0→1.3 万亿）
- **财政 10/1 启动房贷贴息**：单户最高 **100 万 × 1pp × 5 年**，中央:地方 = **90:10**，应贴尽贴、不设上限
- **国常会 9/28** 强调"推出一批务实管用的增量政策"，新一轮稳楼市信号释放
- **10/8 央行买断式逆回购 1.2 万亿元**，加量 2000 亿，对冲政府债发行；同日财政部发行 **5 年期 1500 亿元中央金融机构注资特别国债**

**🟢 E（经济）：9 月 PMI 同步回 50 上方，政策底传导见效**

- 制造业 PMI **50.1**（+0.3），非制造业 50.2（+1.2），**建筑业首次年内站上 50.3**（+1.2）
- **高技术制造业 PMI 52.5**、消费品制造业 **50.7**——结构上高景气
- 生产指数 51.7，产成品库存 47.6（订单消化顺畅）
- **新出口订单同比 +2.2 个百分点**，外需韧性仍存
- 上半年 GDP 同比 **+4.7%**，Q2 放缓至 4.3%，全年目标 4.5-5%
- **房地产金融加速器效应弱化**：按揭利率 3.0-3.1% > 无风险理财利率 1.5-2%，**贴息后房贷利率回到 2%，与无风险利率持平**——居民加杠杆意愿的临界点

**🟡 S（社会）：国庆消费数据待验证，深圳水贝黄金抢购潮**

- 国庆档新机密集落地：OPPO Find X10（4999 元起）、小米 18 Pro（5999 元起）、iPhone Duo（苹果首款折叠）、**华为 Mate 90 系列**
- IDC：2026 年 1-8 月中国手机出货 **-7%**，但华为 **+13%**，苹果 **+24.4%**
- 1-8 月个人/机构新开户 **2741 万户**，同比 +40%
- **快递业务量年内破 1500 亿件**，比 2025 年提前 12 天

**🟢 T（技术）：生成式 AI 用户破 7 亿，智能算力 +177% YoY**

- 截至 2026 年 6 月，**生成式 AI 用户规模 7 亿人**，普及率 >50%
- 智能算力规模 **2185 EFLOPS**，YoY **+177%**
- 日均 Token 调用量 **500 万亿**，较 3 月 140 万亿翻 3.6 倍
- IDC 预测 2026 年 MaaS Token 消耗 4 万万亿次（同比 +20 倍），2026-2030 年再 +1000 倍

**Mavis 点评：** 这一轮政策包不是"大开大合"，是"结构性滴灌"。PSL 降息 + 扩容精准押注"六张网"，房贷贴息精准押注"150 万以下首套刚需"——**像手术刀，不是大锤**。数据上 PMI 同步回 50 是 6 个月来首次，但强弱程度要看 10 月数据能否延续。

## 四、Mavis 编辑后记

**这个 10 月，是"政策月"+"财报月"+"美债月"的三重叠加**——谁先把握住节奏，谁就是赢家。

**三个最值得跟进的边际变化：**
