> **Mavis 点评**：国资央企的合规治理与巡视节奏在提速，这是中期变量，不是短期噪音。配合"安全生产、保供稳价"的要求，**煤炭、电力、石油、粮食这类保供类资产在 2027 年的政策溢价会被系统性抬升**。

## 九、Mavis 点评

**这一周有两条完全独立的行情，方向相反，别混着看。**

**国内这条线是向上的，而且有真东西。** 10 月官方 PMI 在 10/31 发布了（数值本报标注待核验，机构预期 49.6–50.0）；央行把政策利率锚换成了 1.25% 的隔夜逆回购，从 11 月 2 日起每天操作；8000 亿新型政策性金融工具全部投放、带动超 11 万亿投资；五中全会定调、二十一大定在 2027 年下半年。**三季报也给了实打实的兑现**——长鑫营收 +738%、中际旭创净利 +212%、寒武纪 +131%、摩尔线程 Q3 营收 +1774%、北方华创合同负债 +23.5%。这不是题材，这是利润表。

**海外那条线是向下的，而且逻辑很硬。** 美联储 10:2 投票、12 月加息概率 74.9%、前副主席喊 50bp；9 月核心 PCE 3.1%、Q3 GDP 3.4%、油价还在涨——**通胀和增长同时超预期，利率只能往上**。然后是那个致命细节：亚马逊 12 个月自由现金流 **-424 亿美元**、谷歌 -90.7 亿、微软开始发债 250 亿。**AI 的账从损益表挪到了资产负债表**。费半 -7.2%、英特尔 -28.58%（1968 年以来最惨单日）、黄金跌破 3900、白银跌破 50、比特币跌破 7.7 万——**这不是避险，这是保证金被追缴时的无差别抛售**。

**所以 11 月 2 日开盘该怎么看？**

先纠正一个直觉错误：**不要用 10/30 A 股的跌幅去推 11/2 的跌幅**。10/30 A 股通信设备 -5.87%、半导体 -5.44%，那对应的是**当晚纳指 -1.38%**；而 10/30 美股收盘是纳指 -2.86%、**费半 -7.2%**——**这段隔夜信息差 A 股还没定价**。算力硬件链周一大概率还有补跌压力。

但也别线性外推恐慌。有三个支撑在：
1. **港股 10/30 已逆势上涨**（恒指 +1.46%、恒生科技 +0.29%），金龙指数 +0.44%，美团、小米 ADR 涨超 2%——**背离是重要信号**，说明这不是全面流动性危机，是科技股的重定价。
2. **红利和内需在 10/30 已经被验证过**：四大行、中国神华、中国石油创历史新高，白酒医药涨停潮，美股这边宝洁、可口可乐、礼来、阿斯利康同向上涨。**避险资金有去处，这才是健康的板块轮动**。
3. **国内产业趋势没变**：设备在手订单 +88%、封测资本开支翻倍、2nm 占比到 8%、CPO 已批量交付、机器人的研发投入 +250%。**订单在，估值被杀**——这是好消息也是坏消息。

**我自己会盯的三个指标**：① 开盘 30 分钟中际旭创、新易盛的跌幅（超 5% 说明补跌压力真实；3% 以内快速收窄说明恐慌有限）；② 港股恒生科技开盘表现（港股若继续逆势，A 股情绪有救）；③ 银行红利是否继续走强（**如果红利也跌了，那是流动性问题，不是情绪问题**）。

**最后一句留给地产。** 万科前三季 -239.44 亿、开发毛利率 5.2%、524 亿现金对 1898 亿一年内到期短债、克而瑞百强 10 月销售 -41.9%——**这不是一家公司的问题，是整个行业的资产负债表问题**。西安"封顶才能预售"是个方向性信号：政策在从"救企业"转向"防风险"。对投资来说这条线的结论很冷：**在债务重组完成前，地产链的贝塔是负的。**

## 编辑后记

**本期最大的工作量，不在写作，在剔除。**

三个研究子代理分别在三个板块里挖到了 2022、2024、2025 年的旧闻，而且都藏在很像样的表格里：

1. **2022-10-31 的行情数据**——沪指 2893.48、深成指 10397.04、创业板 2265.08、成交 8832 亿、"保利跌停"、"北向净卖出 90.12 亿"，以及那则"龙湖吴亚军卸任"的旧闻。这些数字看起来极其合理，因为它们就是真实的 2022 年 10 月 31 日。但 2026-10-31 是**周六，A 股根本没开盘**。
2. **2024 年 10 月的 PMI**——"制造业 PMI 50.1%、非制造业 50.2%、综合 50.8%"这组数字在 10/31 的财经媒体上广泛流传，还带着"时隔半年重返扩张区间"的正确语气。但核对原文（2024-11-01 稿）就知道它是 2024 年的。而且**算术上也不自洽**：2026 年 9 月是 50.1，若 10 月是"50.1、环比 +0.3pct"，那 9 月就该是 49.8。**自相矛盾是污染最有效的识别器。**
3. **2025 年 10 月的 A 股收盘**——"上证 3954.79、月内站上 4000 点创十年新高"。这一组我也删了。

**处理原则：宁可写「暂无新数据」，不写一个看起来很真的错数字。** 本期有 5 处最终标注为待核验/暂无新数据，包括最想写的那个 PMI 数值。PMI 我明明找到了"50.1%"，但核对之后发现它是 2024 年的，所以本报告的 PMI 栏位写的是"数值待核验 + 机构预期 49.6–50.0"。**这比贴一个错数字诚实得多。**

**顺带修正一处口径。** 前期资料里"现货黄金 3875.55（-3.63%）、WTI 104.10、布伦特 113.40"这一组，实际是 **10/29** 的收盘价。10/30 的真实收盘是：现货黄金**盘中失守 3900 美元/盎司**（自 1 月高点 -29%）、白银跌破 50 美元（-59%）、**WTI 104.12 / 布伦特 117.64（均涨超 2%）**。日期错一天，结论会完全反过来——**10/29 是"油跌金跌"，10/30 是"油涨金跌"，而 10/30 的油涨金跌才是加息逻辑最完整的表达**。

**关于结构。** 本期 8 大板块齐了：宏观 PEST、半导体（设备/制造/设计/存储/算力）、消费电子手机、地产基建矿产农业、六大圈子八卦、关键看板、信息源。11 维信号灯里有 5 绿 6 红，绿的全在国内，红的几乎全在海外——**这个分布本身就是本期最重要的结论**。

**下周见。** 11 月 3 日美国中期选举，11 月 4–8 人大常委会，11 月 10 日稀土管制暂停到期，11 月 17 日英伟达财报。**四个事件挤在同一周**，其中人大常委会被《华尔街日报》称为"宣布更多刺激措施的关键窗口"——**如果国内在 11 月初给增量政策，本周五的红色信号灯可能会重新转绿**。这值得盯着。

**最后一句给还在看这份报告的人**：本周的下跌是**估值杀，不是产业杀**。费半 -7.2% 的同一周，长鑫的毛利率是 89.53%、中际旭创的订单下到了 2028 年、联讯仪器的利润涨了 1975%。**报表和股价暂时背离，但报表更诚实。**
