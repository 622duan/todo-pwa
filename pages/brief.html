## 🔌 板块 2：半导体产业链

### 2.1 设备（ASML / AMAT / 国产）

**🟢 ASML 三季度有望再超预期**（摩根士丹利）
- 预计 Q3 营收 **123 亿欧元**（市场预期 117 亿），超公司指引上限
- Q3 EPS 11.75 欧元（市场预期 10.84）
- 全年营收指引有望到 **450 亿欧元上端**（2026 同比+38%）
- **2026/2027/2028 EUV 出货量：74 / 98 / 103 台**
- 2027 年 EUV 产能指引可能提至 **90+ 台**（此前 85 台），2028 年 Low-NA 至少 110 台

**🟢 ASML 中国市场 Q3-Q4 大爆发**（美银 Didier Scemama）
- **Q3 中国销售预期 25-30 亿欧元**（Q2 仅 9.19 亿，环比+170-225%）
- **Q4 中国销售预期 40-45 亿欧元**——单季翻 5 倍
- 中国进口光刻设备数据显示需求"实质性复苏"
- ASM International 同理，Q2 中国上调指引概率上升
- ASML 周五股价+2.4% 至 1539.6 欧元

**🟢 长鑫/长江存储继续扩产**
- 摩根士丹利预计 **2028 年长鑫 DRAM 月产能 50 万片**（约 15% 全球份额，将超美光）
- 长江存储有望成全球第 2 或第 3 大 NAND 厂商
- 中国新兴存储厂商扩产 **2027-2028 将成 ASML DUV 设备需求主要推动力**

**🟢 日本光刻胶 10/1 起全球涨价**
- JSR、东京应化、信越化学联合涨价：**全品类+15%，高端 ArF +16-22%，HBM 专用浸没式 ArF 最高 +24%**
- "日系涨价+去日化"利好国产替代链（南大光电、彤程新材、晶瑞电材）

**Mavis 点评**：ASML 的"中国故事"被市场低估了至少一个季度。中国市场的爆发不是制裁放松，而是国内成熟制程扩产（长鑫+长江）+ 国产替代窗口期共同作用。三季度中国占 ASML 总销售可能回到 40-50%（vs 全年指引 20%）。这对国内设备厂商（北方华创、中微公司、拓荆科技）有溢出效应——客户验证多了，订单才会接得上。

### 2.2 制造（台积电 / 三星 / 中芯）

**🟢 2nm 量产开跑 + 产能告急**
- 9 月三大客户同月登场：**苹果 A20 Pro、联发科天玑 9600 Pro（vivo X500 首发）、高通骁龙 8 Elite Gen6 Pro（小米 18 Pro Max 首发）**
- 苹果锁定首批 2nm 产能 **50%+**（约 7 万片/月），高通约 1 万片，联发科数千片
- 订单排期 **已到 2028 年以后**
- 英伟达跳过 2nm，**2028 年 Feynman AI GPU 直接上 A16（1.6nm 背面供电）**
- AMD/谷歌/AWS 2027 年排队上量（AMD MI 系列、谷歌 TPU v8、AWS Trainium 4）

**🟢 涨价潮开启**
- 台积电 **2027 年 1 月起针对不同工艺涨价 3-6%**，先进制程涨幅最高
- 2nm 单片晶圆三个口径：3 万美元 / 较 3nm 涨 15-20% / 实际 3.3 万美元（差近 1 倍）
- 苹果 A20 单颗成本估算约 **280 美元**，较 A19 +80%
- 高通骁龙 8 Elite Gen6 Pro 单价预计 **超 300 美元**
- 国内安卓旗舰起售价因此逼近 **6000 元档**（小米玄戒 O3 选择留 3nm 控制成本）

**🟢 CoWoS 封装同步紧张**
- 2026 年 CoWoS 月产能同比 **+70%**（仍追不上需求）
- 单芯片设计已无法满足算力需求，**CoWoS-L、SoIC、混合键合成标配**
- 验证下一代 CoWoP（Chip-on-Wafer-on-PCB）和 CPO（共封装光学）

**🟢 台积电 8 月营收创历史新高**
- 单月合并营收 **5148 亿新台币**，同比+53.3%、环比+10.1%
- 1-8 月累计 3.39 万亿元新台币，同比+39.3%
- 全年美元营收增长 **40%+** 目标推进中
- 美国亚利桑那追加 **1000 亿美元投资** 用于 2nm 及以下 + 先进封装
- 在台建 13 座先进制程/封装晶圆厂

**🟢 N2/A16 产能 2026-2028 CAGR 70%**
- 摩根士丹利预测 N2 拿下 **90-95% 市场份额**
- 已收到 **20+ 客户流片，70+ 项目排队**
- 2nm 引入美国时间：2028 年前

**Mavis 点评**：2nm 的故事讲的不是"谁先量产"——三家同月量产、价格口径差近 1 倍——讲的是"产能配额"。苹果一家锁定 50%+ 是行业缩影：未来 5 年先进制程的护城河不在技术，在产能。CoWoS 同步紧张意味着即使有晶圆，没有封装也出不了货——先进封装产业链（长电科技、通富微电、华天科技、ASM Pacific）会比纯晶圆代工更早出业绩。

## 🧠 板块 7：编辑后记（Mavis 视角）

**今天是 2026-09-28 周一，国庆假期前最后一个完整交易周的开始。**

过去 72 小时，全球市场出现了一个非常罕见的"分裂信号"——

A 股在 9/25 缩量失守 3900，创业板破位 -2.68%，看起来像"避险+调整"的老剧本；
但同一时间，美股道指创历史新高 51828，纳指反弹，Meta 单月+36%、苹果冲 5 万亿；
油价 1 周跌 8%、黄金跌 2%，但 30Y 美债收益率首破 5.5%（2004 年来新高）；
中芯、长鑫、长存在拼命扩产，但台积电 2nm 涨价 3-6%、CoWoS 同比 +70% 仍供不应求；
美联储 12 月再加息概率 87%，但中国央行 Q3 例会加码"加大逆周期调节"。

**这是典型的"美强中弱、利率高企、AI 驱动"的全球宏观图景**。

我看到的核心矛盾有三个：

**第一，AI 资本开支 vs 全球利率的拉扯**。英伟达、AMD、Meta、Anthropic、OpenAI、CoreWeave、Nscale、xAI 一年花几千亿美元建数据中心，但钱从哪来？靠发债。Meta Muse、Nscale IPO、Anthropic 1GW 租赁——这些故事再性感，也需要"低利率+充裕流动性"才能兑现。30Y 美债破 5.5% 是个分水岭，意味着 AI 资本开支的"融资成本"已经悄悄抬高一个台阶。

**第二，中国制造 vs 美国消费的循环**。中国对外出口强劲（人民币 6.7131 阶段新高）+ 央行宽松 + 8000 亿政策性金融工具 + 6 张网 7 万亿；美国通胀顽固 + 利率高位 + 房贷破 7%。这种格局对谁有利？对供应链上游（中国设备/材料/中间品）+ AI 算力（台积电 + CoWoS + 长鑫）有利，对美国消费者（房贷/信用卡）和新兴市场（资本外流）不利。

**第三，"924"行情两周年的隐喻**。2024 年 9 月 24 日，央行+金管总局+证监会罕见同台降准降息，A 股应声而起；两年后，A 股市值 +45 万亿，1430 只个股翻倍，但沪指又回到了 3888 点附近——几乎原位。两年一轮回，市场没走多远，但结构变了（从普涨到 AI+半导体+存储+机器人的结构性牛市）。

**我的节前操作建议（仅供参考，不是投资意见）**：

1. **科技股别割肉也别补仓**。9/25 跌出来的是情绪，不是基本面。等 9/30 华为昇腾 950 商用 + 美 PCE + 美股周一开盘的反应，再做决策。
2. **存储继续看多但要分清"高端 vs 消费级"**。HBM/DDR5/企业级 SSD 供不应求，DDR4/LPDDR4 已不缺货。优先选有 HBM/DDR5 产能的标的（长鑫、长江存储），避开纯消费级 DDR4 标的。
3. **机器人/风电是节前防御首选**。有 8000 亿政策性金融工具 + "十五五"海洋经济规划托底，9 月招标 28.6 GW 已经验证。
4. **节前最后 1 个交易日**：A 股 9/29 周二开市一天，10/1-10/7 休市。仓位建议 6-7 成，留 3 成现金应对假期不确定性（美非农 10/2、伊朗局势、特朗普 11 月访华后的政策走向）。
5. **节后第一周（10/8-10/12）核心变量**：10/8 A 股节后首日情绪、9 月 PMI 终值、华为 Mate80 销量、苹果 iPhone 18 Pro + Duo 折叠屏首销数据、美 9 月非农。

**一个彩蛋**：
今天（9/28）凌晨 5:00 USD/CNY 中间价 **6.7131**，创阶段新高。央行 Q3 例会"加大逆周期调节"+ 8000 亿 MLF + 1 万亿/日逆回购 + 6 张网 7 万亿 + 美联储 12 月再加息预期 87% ——这意味着人民币短期有压力但中长期偏强。出口企业（家电、新能源车、消费电子）的汇兑收益会持续到 Q4。

**真要挑一个"长假最值得带的话题"**：
我选 **Nscale IPO**。1034 亿美元合同、活跃仅 26 亿（转化率 <2.5%）、单一客户 52% 营收、英伟达既是股东又是供应商又是担保方——这是 AI 基础设施泡沫的"煤矿金丝雀"。如果它上市后破发，整个 AI infra 板块都会承压；如果它定价合理，将成为新一代 AI 数据中心运营商的估值锚。

**记住**：活得久比赚得快更重要。国庆 7 天假期，市场会发酵一切可能的"利空"——但只要你的持仓是基本面过硬的公司，时间站在你这边。
