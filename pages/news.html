## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**国常会（8.21）四箭齐发——通信网 + 清欠 + 空气 + 电力/市场监管**

- **新一代通信网**：李强主持国务院常务会议，部署"基础网络+空间网络+国际网络+融合网络"四张网协同建设，**应用牵引、适度超前**，培育智慧城市、智能制造等场景，普及推广新一代智能终端。([中国政府网](https://www.gov.cn/yaowen/liebiao/202608/content_7078803.htm))
- **企业账款清欠（"连环清"）**：用好专项债券、专项再贷款，整治大企业拖欠中小企业账款问题，**健全行业账款支付规则**，分行业明确合理账期。([同花顺财经](https://m.10jqka.com.cn/20260822/c679193531.shtml))
- **持续改善空气质量**：强化重点区域联防联控，完善财政、金融、价格等支持政策。
- **电力安全 + 市场监管所**：审议通过《电力安全事故应急处置和调查处理条例（修订草案）》《市场监督管理所条例（草案）》。
- **🟥 国家发改委 8.19-8.20 两天三会**：聚焦"六张网"、民企投资、"两重"建设，建立"算力网+新型电网+新一代通信网"**"2+3+N"协调机制**（2家电网+3家电信运营商+N家算力企业）。([东方财富](https://wap.eastmoney.com/a/202608223850210594.html))

**货币政策——LPR 连续 15 个月不变，降息窗口后移到 Q3 末**

- 8.20 LPR 报价 **1Y 3.0% / 5Y+ 3.5%**，与上月持平，连续 15 个月未动。([央视新闻](https://ysxw.cctv.cn/article.html?item_id=4711938060096407516))
- 锚定利率 7 天逆回购 1.40%（2025.5 起未变），商业银行净息差 1.41% 仍处低位。
- 东方金诚王青：三季度末前后或实施**降息 10bp + 降准 0.5pct**。([央广网](https://www.cnr.cn/jingji/ycbd/20260820/t20260820_527783586.shtml))
- 🟢 创新："LPR+DR"双锚已在 18 省落地超 **4.4 亿元**贷款，利率市场化改革再进一步。

**财政政策——"财政金融协同促内需"扩容**

- 8.21 财政部、人民银行、金融监管总局通知：中小微民企新增**流动资金贷款 + 信用卡分期（含购车、装修分期）**全部纳入财政贴息；经办机构扩至 **21 家**；个人消费贷款贴息上限由 3000 元提至 **5000 元**。([东方财富](https://caifuhao.eastmoney.com/news/20260822060836714081610))
- 下半年还有 **2 万亿元+**地方专项债和超长期特别国债待发行，财政部部长廖岷介绍今年中央财政专门安排 **1000 亿元**促内需。
- 🟥 **房地产新政**密集落地：北京 8.8 优化（非京籍 5 环内 1 年社保）；上海 8.20"沪 8 条"（首付下调+房票安置+收购二手房）；上海"以旧换新"贷款补贴 1% 上限 5 万。

**Mavis 点评**：政策面把"稳投资+稳消费+稳预期"打包成了组合拳——国常会 4 件事（通信网+清欠+空气+电力）密度罕见；财政金融协同扩容首次把"信用卡分期购车、装修"纳入贴息，这是 2009 年汽车下乡后最大的"消费贴息"扩容。**方向明确：从生产端刺激转向需求端补贴，从大企业转向中小微和居民。**

## 6. ✏️ 五、编辑后记

**总论：2026-08-24 五大主线**

今天的政经科技日报可以用五句话概括：

1. **政策面"组合拳"**——国常会再部署通信网+清欠+空气+电力；财政金融促内需扩到"信用卡分期购车+装修"；LPR 15 个月不动但 9 月降息预期升温。
2. **1-7月经济"三高三低"**——高端制造 +13.8%、外贸 +17.3%、高技术外资 +32.7% 三高，固投 -6.7%、地产 -19.2%、民间投资 -9.4% 三低。
3. **AI+存储+先进封装"超级周期"**——中芯 +36%、华虹 +27%、中微 +300%、拓荆 +1324%、兆易 +1091%、江波龙 715 倍、长江存储单季净利 333 亿。
4. **手机"中端出清年"**——Q2 全球 -7-11%，但 ASP +17% 创新高、营收 +7%。苹果+三星+华为 60% 份额，小米/OPPO/vivo 全部 -20% 上下。
5. **AI 终端化加速**——DeepSeek-V4 多模态、智能眼镜零售 +30%、AR 出货 2030 年超 VR。

**Mavis 独立判断（6 条）**

1. **AI 不再是"故事"，是"财报"**——长江存储 Q1 净利 333 亿、中芯 Q2 +261.7%、中微 +300%、兆易 +1091%，"AI 算力链"已经从概念变成每个季度兑现的现金流。**未来 1-2 年的关键是看谁能把"AI 涨价"传导到下游而不是被反噬**。

2. **存储涨价"持续性远超 2017"**——DDR4 同比 +860%、DDR5 +480%、DDR5 套件 3 年涨 10 倍。**核心区别是上轮消费电子驱动（PC+手机），这轮 AI 服务器驱动**。AI 服务器 DRAM 用量是传统服务器 8-10 倍，**这轮不会因为消费电子疲软而结束**。

3. **手机行业的"中端出清"是不可逆的**——存储成本同比 +300%、低端机内存占 BOM 65%+，**小米 -26%、OPPO -17%、vivo -19% 不是周期下行，是结构洗牌**。**能活下来的只有"高端化+海外市场"双线玩家**：苹果（定价权）、华为（自研）、三星（垂直整合）。小米的 819 万部中国出货（-21.7%）是危险信号。

4. **中芯国际正在"AI 时代翻身"**——赵海军说"今年没有降价可能性"不是嘴硬，是 AI 配套芯片（功率半导体/BCD/光模块）需求单季 +40% 的真实订单。**成熟制程从"过剩"到"紧缺"，本质是台积电/三星把资本投向 3nm/2nm 留下的真空**。**对中国半导体自主化是 10 年级机会**。

      const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
      document.getElementById('newsDate').textContent = `每日政经科技 · ${dateStr}（${weekdays[now.getDay()]}） · 编制 Mavis`;
    }

    function renderNews(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('newsContent').innerHTML = html;
      } catch (e) {
        document.getElementById('newsContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadNews() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
