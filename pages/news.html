## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**🟥 国务院令第 844 号：公积金条例 9/20 施行**
8/18 国务院总理李强签署国务院令，公布《国务院关于修改〈住房公积金管理条例〉的决定》，自 **2026 年 9 月 20 日**起施行，重点内容四条：
1. **拓宽提取范围**：提取公积金支付房租不再设"房租超家庭工资比例"门槛，新增装修自住住房、支付物业费可提取；留出"国务院批准的其他住房消费情形"兜底条款
2. **提升管理效能**：提取手续无需单位核实；贷款审查时限从 15 日缩短到 **10 日**；推进缴存记录全国互信互认、转移接续和异地贷款便捷办理
3. **扩大覆盖**：个体工商户、非全日制从业人员及其他灵活就业人员 **可自愿缴存**，享受同等政策（不强制、一刀切）
4. **强化风控**：明确公积金信用信息纳入全国信用信息共享平台，欺诈提取的法律责任细化
*来源：[人民日报](https://www.dswxyjy.org.cn/BIG5/n1/2026/0819/c423712-40782163.html) / [央视新闻联播](https://tv.cctv.com/2026/08/18/VIDEfrQuzChPUyu1P2mTw6M8260818.shtml)*

**财政部：超长期特别国债 + 政策性金融工具双管齐下**
- 8/19 财政部续发 **20 年期超长期特别国债（五期）**，面值 **240 亿元**，票面利率 2.24%，8/24 上市
- 8/14 续发 **50 年期特别国债** 400 亿元（2.52%）+ 新发 30 年期 730 亿元（"26T6"），单周超长债供给 1130 亿元，**8 月 7 日超长期特别国债已发 8350 亿元，8-10 月还剩 4650 亿元待发**
- 8/7 发改委部署加快 2026 年新型政策性金融工具投放，加大对民间投资项目支持力度
- 蓝佛安文章（人民日报）：增量政策将"适时适度盘活专项债结存限额、增发超长期特别国债、增加政策性金融工具额度"
*来源：[财政部公告](https://zwgls.mof.gov.cn/ywgg/202608/t20260812_3995305.htm) / [中国金融信息网](https://www.cnfin.com/yw-lb/detail/20260810/4453298_1.html)*

**央行：8 月 LPR 连续 15 个月持平**
- 8/20 LPR 报价：1 年期 **3.0%**，5 年期以上 **3.5%**，连续 15 个月不变
- 二季度货政报告：适度宽松基调不变；DR 基准贷款已在 18 省落地 42 笔、规模超 4.4 亿元，定价机制从单一 LPR 转向"LPR+DR"双锚
- 东方金诚、招联等机构普遍预期：**Q3 末至 Q4 初可能实施 10bp 降息 + 0.5pct 降准**
*来源：[央广网](https://www.cnr.cn/jingji/ycbd/20260820/t20260820_527783586.shtml) / [中国网](https://finance.china.com.cn/news/20260820/6321474.shtml)*

**国常会与十五五就业规划**
- 8/19 李强主持国务院第十二次全体会议：深入贯彻落实党中央决策部署，努力完成全年经济社会发展目标任务
- 6 月印发《实施就业优先战略"十五五"规划》：探索人机协同新型工作形态，强化 AI 就业创造效应
- 7 月人社部启动"2026 年高校毕业生等青年就业服务攻坚行动"
*来源：[搜狐财经-财经](https://www.sohu.com/a/1065917997_115571)*

**Mavis 点评**：公积金条例是 1999 年以来最大修订——从"购房融资工具"升级为"购、租、修、养"全周期住房支持工具，对地产需求侧是"低成本、小步快跑"的精准滴灌；DR+LPR 双锚落地是利率市场化的关键一步，三季度末降准降息仍存博弈窗口，10bp 概率较高。

### 2.2 🟠 经济面 E

**7 月份国民经济：外需强、内需弱，结构优化持续**
国家统计局 8/17 发布会数据（1-7 月累计 + 7 月单月）：
- 工业增加值：1-7 月 **+5.3%**，装备制造业 +9.7%、高技术制造业 **+13.8%**；7 月单月 **+4.5%**（制造业 PMI 49.2%，仍在荣枯线下）
- 社零：1-7 月 **28.77 万亿、+1.2%**；服务零售额 **+5.0%**（明显快于商品零售 +1.1%）
- 固投：1-7 月 **-6.7%**（扣除房地产开发 -3.7%）；高技术产业投资 +5%；制造业投资占比 26.6%（+1.4pct）
- 房地产：1-7 月销售面积 -11.8%、销售额 **-13.1%**（跌幅收窄 0.5pct），开发投资 **-19.2%**（跌幅扩大 1.2pct）
- 进出口：1-7 月 **30.13 万亿、+17.3%**（出口 +14.0%、进口 +22.0%）；7 月单月 **+19.2%**（出口 +17.8%）
- CPI：7 月 **+0.5%**（核心 CPI +0.9%）；PPI **+3.5%**（环比 -0.7%，连续 5 个月同比上涨但涨幅回落）
- 失业率：7 月城镇调查 **5.2%**（环比 +0.2pct）
*来源：[国家统计局](https://www.stats.gov.cn/sj/zxfbjd/202608/t20260817_1965064.html) / [中国政府网](https://www.gov.cn/lianbo/202608/content_7078301.htm)*

**🟥 工业新动能：单月 +17.3% 数字产品制造业，AI 链贡献过半**
- 1-7 月新动能对规上工业增长贡献率 **50.9%**（较上半年 +3pct）
- 7 月集成电路制造 **+109.3%**、飞机制造 +38.3%、电子工业专用设备 +34.8%
- 人工智能产品：传感器 +35.3%、存储芯片 +30.2%、光纤 +21.1%、工业机器人 +30.2%
- 装备制造业占比 38.2%（+2.6pct），电子行业增速 +19.1%（居工业各行业首位，贡献率 43.7%）
*来源：[国家统计局](https://www.stats.gov.cn/sj/sjjd/202608/t20260817_1965075.html)*

**地产边际企稳：7 月销售量价跌幅收窄**
- 7 月单月销售面积 4881 万㎡（-13.4%，收窄 0.9pct）、销售金额 4773 亿元（-8.9%，**收窄 5.0pct**）
- 70 城新房环比 -0.2%、17 城上涨；二手房环比 -0.3%、**5 城上涨**（上海 +0.3%、广州 +0.4%、深圳 +0.2%）
- 1-7 月商品房待售面积同比 -0.8%，**连续 5-6 个月下降**
- 一线宅地溢价率 **18%**、二线 9%、三线 3%——资金向核心高能级城市集中
*来源：[中信建投证券](https://www.sohu.com/a/1064341375_122014422) / [国信地产](https://stockfinance.sina.cn/stock/go.php/paper/reportid/840371715599/index.phtml)*

**8/17 半导体板块爆发 vs 8/19 美债收益率冲击：过山车**
- 8/17 沪指 +1.41%、深成 +2.44%、创业板 +3.14%、**科创 50 +4.14%**（半导体、算力硬件、CPO 板块领涨）
- 8/18 美 30Y 国债收益率 **5.32%**（19 年新高），全球无风险利率重定价
- 8/19 A 股急跌：沪指 -2.40%、深成 -5.01%、创业板 -6.26%、科创 50 -6.89%；中际旭创净卖出 56.2 亿元、兆易创新 49.1 亿元；银行 +1.78%、煤炭 +0.73% 逆势
*来源：[东方财富](https://emwap.eastmoney.com/a/202608173843115045.html) / [搜狐财经](https://www.sohu.com/a/1064934660_122342456)*

**Mavis 点评**：1-7 月"5 大分化"——出口+17.3% vs 固投-6.7%、工业+5.3% vs 社零+1.2%、装备+9.7% vs 地产投资-19.2%，外需独大、内需磨底；7 月单月销售金额跌幅收窄 5pct 是 **2025 年以来最明显的边际改善**，叠加一线二手房止跌 + 公积金额度提升，地产"政策底→市场底"传导值得跟踪，但需警惕 8/19 美债收益率冲击带来的"高估值科技股重定价"风险。

## 6. ✏️ 五、编辑后记

**总论**

今天 4 大主线：**1) 国务院公积金条例 27 年来最大修订 9/20 落地**，地产需求侧精准滴灌；**2) 7 月经济数据外需强 +17.3% vs 内需弱 1.2% 的结构性失衡**持续，固投 -6.7% 是 25 年来罕见负增；**3) 半导体全产业链中报兑现期，AI 需求外溢 + 国产替代双轮驱动**——SMIC 首破 $30 亿营收、北方华创 ¥820 亿订单、长鑫 7% 全球第四、长江存储 14% 首进 NAND 前三；**4) DeepSeek V4 Pro 正式版 API 价格仅为 Claude Fable 5 的 1/45**，算力通缩成为新趋势，倒逼国产 AI 芯片 + 模型生态加速突围。

**5 条 Mavis 独立判断**

🟢 **1. 存储超级周期持续到 2028 H2，国产替代是 H2 投资主线**
SK 海力士 2027 年产能售罄、SK CEO 明确供不应求延续到 2030 年；长鑫 LPDDR6 量产 + 长江存储 300+ 层 NAND 研发，将复制 SMIC 在成熟制程的路径——**用"产能扩张 + 价格让利"做差异化，3 年内长鑫份额可能突破 15%**。国产存储链（北方华创/拓荆/中微/江丰/华海诚科）是 H2 最确定的赛道。

🟠 **2. 青年失业率 17.9% 是季节性 + 结构性叠加，AI 替代风险被低估**
花旗测算 9.6% 岗位面临直接 AI 替代、会计/财务/程序员/编辑最敏感。**真正的政策窗口不是"扩社区岗位"（治标），而是"加速 AI 应用落地 + 创造新职业"**（治本）；国务院《十五五就业规划》"探索人机协同新型工作形态"的方向是对的，但落地速度需要 Q4 验证。

🟢 **3. DeepSeek V4 Pro 改写全球 AI 竞争规则**
"算力军备竞赛 → 算力通缩"的转折点已经发生。**V4 Pro + 昇腾 600k 出货 + 寒武纪 +123% 净利增长**，意味着中国 AI 产业正在形成"国产模型 + 国产算力"的 Day-0 协同闭环。OpenAI 紧急降价 80%、英伟达下调 OpenAI 担保至 $1200 亿，都是这种压力的具体表现。

🟡 **4. 公积金条例 9/20 施行是地产"政策底→市场底"传导的关键试金石**
贷款审查从 15 日 → 10 日、装修/物业费可提取、灵活就业人员自愿缴存——**这次修订是制度性补位，不是脉冲式刺激**。北京 8 月已跟进公积金额度提升，一线二手房环比 5 城上涨（上海连续 6 月+0.3%）。**真正的风险是 8/19 美债 5.32% 收益率对高估值地产链的二次冲击**——地产股短期反弹 vs 长期估值压力需要重新平衡。

🔴 **5. 8/19 A 股科创 50 -6.89% 是"全球长端利率重定价"的预警**
30Y 美债 5.32%（19 年新高）+ 2Y 美债 4.188% 同步高企，意味着美联储降息预期被推迟 + AI 高估值板块面临"贴现率上行"双重压力。**这是 2026 H2 全球风险资产最大的尾部风险**，A 股科技成长（半导体 / 算力 / CPO）需要在 Q4 之前消化估值压力，否则可能进入"业绩兑现 vs 估值压缩"的双杀窗口。

**未来 1-2 周重点节点**

- **8/22（今天）**：宁德时代财报、汇金观（券商策略）、美联储 7 月 FOMC 纪要发布（市场高度关注）
- **8/25-26**：Jackson Hole 全球央行年会（鲍威尔讲话、可能释放 9 月降息信号）
- **8/30**：8 月 PMI 数据公布（预测仍在 49.5 附近）
- **9/1-15**：8 月经济数据密集披露（金融数据、CPI/PPI、社零、固投、地产销售）
- **9/9-10**：苹果秋季发布会（iPhone 18 系列定价 / 存储配置是核心看点）
- **9/15-20**：联储 9 月议息会议（25bp 降息概率 75%，关键看措辞）
- **9/20**：公积金条例修订版正式实施
- **9/27**：长鑫 / 长江存储 H 股二次上市可能性
- **11/27**：中国对美国镓 / 锗出口许可豁免到期（关键节点）

**风险提示**

1. **8/19 美债收益率 5.32% 持续性**：若 30Y 收益率维持在 5.20% 以上超过 1 个月，全球高估值科技股可能进入估值压缩通道
2. **H2 智能手机出货降幅扩大**：IDC 预测中国 H2 出货 -20%，若实际数据超预期，对消费电子产业链（封测/设备/材料）情绪冲击较大
3. **青年失业率 8-9 月季节性冲高**：去年 8 月 18.9% 是高点，今年毕业生多 4%，可能突破 19%
4. **地产投资跌幅扩大**：1-7 月 -19.2% 是关键警戒线，若 H2 持续扩大，开发商信用风险可能再次发酵
5. **AI 模型"算力通缩"反过来伤害国产芯片需求**：DeepSeek V4 Pro 极致效率反过来抑制算力采购量，对 HBM / AI 芯片估值形成压制
6. **地缘政治**：美国对华芯片出口管制、稀土反制、台湾大选、霍尔木兹海峡局势
