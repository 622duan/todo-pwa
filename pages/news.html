<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0F172A">
  <title>每日政经科技 · todo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #F8FAFC 0%, #E8EDF3 100%);
      color: #0F172A;
      height: 100vh;
      overflow: hidden;
    }
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
    }
    .scroll-area {
      height: calc(100vh - 60px - 80px);
      overflow-y: auto;
      padding: 0 16px 20px;
    }
    .scroll-area::-webkit-scrollbar { display: none; }
    .md-content { font-size: 13px; line-height: 1.7; color: #334155; }
    .md-content h1 { font-size: 20px; font-weight: 700; margin: 12px 0 14px; letter-spacing: -0.02em; color: #0F172A; }
    .md-content h2 { font-size: 15px; font-weight: 700; margin: 18px 0 8px; padding-top: 10px; border-top: 1px solid rgba(15,23,42,0.08); color: #0F172A; }
    .md-content h3 { font-size: 14px; font-weight: 700; margin: 12px 0 6px; color: #0F172A; }
    .md-content h4 { font-size: 13px; font-weight: 600; margin: 10px 0 4px; color: #475569; }
    .md-content p { margin: 6px 0; }
    .md-content ul, .md-content ol { margin: 6px 0; padding-left: 20px; }
    .md-content li { margin: 3px 0; }
    .md-content table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 11px; background: rgba(255,255,255,0.5); border-radius: 8px; overflow: hidden; }
    .md-content th, .md-content td { padding: 5px 6px; border: 1px solid rgba(15,23,42,0.08); text-align: left; vertical-align: top; }
    .md-content th { background: rgba(132,169,140,0.12); font-weight: 600; }
    .md-content code { background: rgba(132,169,140,0.12); padding: 1px 4px; border-radius: 3px; font-size: 11px; }
    .md-content blockquote { border-left: 3px solid #84A98C; padding: 6px 10px; margin: 8px 0; background: rgba(132,169,140,0.06); border-radius: 4px; color: #475569; font-size: 12px; }
    .md-content strong { font-weight: 700; color: #0F172A; }
    .md-content em { font-style: italic; }
    .md-content hr { border: 0; border-top: 1px solid rgba(15,23,42,0.08); margin: 14px 0; }
    .md-content a { color: #5B8C7A; text-decoration: underline; word-break: break-all; }
    .md-content > p:first-child { display: none; }
    .md-content > h1:first-child { display: none; }
    .md-content > hr:first-of-type { display: none; }
    textarea { width: 100%; min-height: 180px; max-height: 50vh; background: rgba(255,255,255,0.8); border: 1px solid rgba(15,23,42,0.1); border-radius: 12px; padding: 10px; font-family: -apple-system, monospace; font-size: 11px; resize: none; outline: none; }
    .loading { display: flex; align-items: center; justify-content: center; min-height: 200px; flex-direction: column; gap: 12px; color: #94A3B8; }
    .pulse-dot { width: 8px; height: 8px; background: #5B8C7A; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } }
  </style>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink: '#0F172A', brand: '#5B8C7A' } } } }
  </script>
  <script src="refresh.js"></script>
</head>
<body>
  <!-- Header -->
  <div class="px-4 pt-3 pb-3">
    <div class="flex items-center justify-between mb-1">
      <button onclick="goHome()" class="w-9 h-9 rounded-full bg-white/60 flex items-center justify-center">
        <i class="fas fa-chevron-left text-sm"></i>
      </button>
      <h2 class="text-[15px] font-semibold flex items-center gap-1.5">
        <span class="pulse-dot"></span>
        每日政经科技
      </h2>
      <button onclick="downloadNews()" class="w-9 h-9 rounded-full bg-white/60 flex items-center justify-center active:bg-white/90" title="下载今日日报 .md">
        <i class="fas fa-download text-sm text-brand"></i>
      </button>
    </div>
    <p class="text-[11px] text-gray-500 text-center mt-1" id="newsDate">每日政经科技 · 编制 Mavis</p>
  </div>

  <!-- News content -->
  <div class="scroll-area" style="height: calc(100vh - 60px - 80px);">
    <div id="newsContent" class="md-content">
      <div class="loading">
        <div class="pulse-dot"></div>
        <p class="text-[12px]">加载中...</p>
      </div>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <div class="absolute bottom-0 left-0 right-0 pb-7 pt-2.5 px-5">
    <div class="glass rounded-full px-4 py-2.5 flex items-center justify-between" style="border-radius: 999px;">
      <button onclick="goPage('home.html')" class="flex flex-col items-center gap-0.5 text-gray-400 px-2">
        <i class="fas fa-house text-[15px]"></i>
        <span class="text-[10px] font-medium">今日</span>
      </button>
      <button class="flex flex-col items-center gap-0.5 text-ink px-2">
        <i class="fas fa-globe text-[15px]"></i>
        <span class="text-[10px] font-semibold">政经</span>
      </button>
      <button onclick="goPage('brief.html')" class="flex flex-col items-center gap-0.5 text-gray-400 px-2">
        <i class="fas fa-newspaper text-[15px]"></i>
        <span class="text-[10px] font-medium">行业</span>
      </button>
      <button onclick="goPage('settings.html')" class="flex flex-col items-center gap-0.5 text-gray-400 px-2">
        <i class="fas fa-gear text-[15px]"></i>
        <span class="text-[10px] font-medium">设置</span>
      </button>
    </div>
  </div>

  <script>
    const DEFAULT_NEWS = `# 每日政经科技日报

> 编制：Mavis ｜ 覆盖：政策 / 经济 / 社会 / 技术 ｜ 重点行业：手机 / 存储 / 芯片

---

## 📌 今日摘要

> 等待今日 8:00 推送

---
`;

    // Init
    function init() {
      renderNews(DEFAULT_NEWS);
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
      document.getElementById('newsDate').textContent = `每日政经科技 · ${dateStr}（${weekdays[now.getDay()]}） · 编制 Mavis`;
    }

    function renderNews(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('newsContent').innerHTML = html;
      } catch (e) {
        document.getElementById('newsContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadNews() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
