## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**国务院常务会议（8/21）——新一代通信网 + 清欠企业账款**

李强总理 8 月 21 日主持召开国务院常务会议，重点议题：
- **新一代通信网建设**：坚持应用牵引、适度超前，统筹推进基础网络/空间网络/国际网络/融合网络，"普及推广新一代智能终端"，培育智慧城市、智能制造等高价值场景
- **清理拖欠企业账款**：用好专项债、专项再贷款，打通"连环清"链条；明确大企业账期，治理大企业拖欠中小企业账款
- 持续深入打好蓝天保卫战
- 审议通过《电力安全事故应急处置和调查处理条例（修订草案）》《市场监督管理所条例（草案）》

> **Mavis 点评**：这是 8 月最重磅的政策表态——把 6G/卫星/工业互联网打包进"新一代通信网"叙事，明确"智能终端+高价值场景"双轮驱动。清欠账款继续加码，9/20 即将施行的《住房公积金管理条例》修改决定也是同方向动作。**信号意义**：从"投资型"刺激转向"应用+治理"双驱动。

**8/17-8/23 周度金融政策清单**（清华大学五道口 × 新华社中经社联合）
- **石油天然气"十五五"规划**：到 2030 年国内油气供应量 4.4 亿吨油当量、新增长输管道 2 万公里、天然气储备占消费比 ≥13%、LNG 接收站接卸 2 亿吨/年
- 财政金融协同促内需 2.0：贴息范围更宽、经办机构更多、额度上限更高
- 商务部等 9 部门《关于进一步激发下沉市场活力 活跃县域消费的意见》
- 央行新增 8 家数字人民币运营机构（平安、恒丰、渤海、上海、杭州、徽商、长沙、广西北部湾），扩容至 **30 家**
- 中澳央行续签双边本币互换协议（扩大规模）
- 国家医保局《全民医疗保障"十五五"规划》

> **Mavis 点评**：8 月最后一周的"政策密度"非常罕见——石油规划、医保规划、住房公积金、央行互换协议同日落定，明显在为"十五五"开局做制度铺垫。下沉市场 + 数字人民币 + 油气储备三条线同时启动，是为对冲外部不确定性。

### 2.2 🟠 经济面 E

**🟥 前 7 月规上工业利润 +17.6%，集成电路行业利润同比 +1850%（18.5 倍）**

8 月 27 日国家统计局数据：
- 1-7 月全国规上工业利润 **45820.6 亿元**，同比 **+17.6%**
- **电子行业利润同比 +110%**（1.1 倍），拉动全部规上工业利润增长 **9.3 个百分点**
- 🟥 **以算力芯片、存储芯片为代表的集成电路行业利润同比 +1850%**（18.5 倍），**对电子行业利润增长贡献率超 80%**

> **Mavis 点评**：这是本期日报最炸的一条宏观数据——集成电路行业利润 1-7 月同比 +1850%，等于"再造一个行业"。本质是 AI 算力+存储超级周期传导到国产替代+量价齐升，单是中芯国际 H1 净利 +94%、华虹 H1 净利 +385.9%、长存 Q1 单季 333.79 亿，就足以把整个电子行业利润曲线拉成垂直向上。**意味着**：高景气不是"信号"，是"现实"。

**英伟达 2027 财年 Q2 营收 962.21 亿美元，同比 +106%**
- 数据中心业务收入 890 亿美元，同比 +117%
- 黄仁勋：AI 已达"拐点"，"算力正在转化为收入"
- 2028 财年收入指引同比 +70%
- 13 家大行密集上调目标价，瑞杰金融从 352 美元上调至 **515 美元**（对应市值 12.4 万亿美元）

> **Mavis 点评**：英伟达单季 962 亿+同比翻倍，是 8 月全球资本市场最大的"事实炸弹"——比任何分析师预测都强，直接把 AI 资本开支周期的置信度从"高景气"上调到"超级景气"。8/27 美股纳指 +1.57%、英伟达 +8.74%、市值单日增加 4420 亿美元（约 2.97 万亿人民币），A 股科创 50 当日 +3.77% 同步反弹——**这是算力链全球共振**。

**外贸高频（海关/商务部）**
- 商务部 8/27 例行新闻发布会：美方考虑对华额外加征 7.5% 关税，以"产能过剩"为由对 16 个经济体发起 301 调查，中方"坚决反对并保留采取一切必要措施的权利"
- 中美双方就年内元首互动安排保持沟通

> **Mavis 点评**：301 调查 + 7.5% 关税是 8 月末新增的关税变量，但 7.5% 的边际幅度小于 2018 年首轮 25%，且官方表态克制（"密切关注"+"保留权利"），未升级报复。这说明 4-8 月中美的"边打边谈"框架在延续。

**AI 算力需求侧"日均词元调用量"**
- 央视财经 8/27：截至 2026 年 6 月，我国日均词元（Token）调用量已突破 **500 万亿**
- 银河证券：中国 AI 产业将进入按"词元"计费阶段

> **Mavis 点评**：500 万亿日 token 调用量是 AI 落地的"流量底座"——按"词元"计费意味着 token 已经从"演示"变成"水电费"，这是从 PoC 到 PMF 的分水岭。**直接利好**：模型层（DeepSeek、Qwen）、算力层（中芯、昇腾、寒武纪）、应用层（金融/政企 Agent）。
