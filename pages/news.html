## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

- 第八十号：《中华人民共和国医疗保障法》（2027.1.1 起施行）

- 第八十二号：《中华人民共和国农业法》（修订，2027.1.1 起施行）

- 🟥 **个人住房贷款期限由最长 30 年延长至最长 40 年**（业内最大变化，月供压力降低但总利息上升）
- 建立开发贷款"主办银行制"——单项目对应一家银行，封闭管理
- 预售项目开发贷期限最长 5 年，现房销售项目最长 7 年
- **首次还本日期原则上应在项目竣工备案后**——确保"先拿房、再还贷"
- 同步住建部、自然资源部、金融监管总局印发《关于完善商品住房销售制度的通知》——**现房销售"所见即所得"全国推行**（防范交付风险）
- 金融监管总局另发 5 个管理办法（开发贷 / 个人房贷 / 商业地产 / 城市更新 / 房地产信托）

- **集成电路产业 4 大特点**：① 关键核心技术不断突破（高端芯片设计/制造、功率/化合物半导体、先进封装、存储器）② 已披露财报上市公司 **H1 营收 +12.8%、净利润 +99%** ③ 上半年主要晶圆代工产能利用率均 > 90% ④ 国产设备/材料从"单点突破"向"全链条协同"跃升

- 前 7 月集成电路制造业投资同比 +11.5%

- 审议财政部《关于今年以来预算执行情况的报告》—— 1-7 月一般公共预算收入 14.37 万亿元（+5.8%），支出 16.29 万亿元（+1.3%）

- **就业补助 667 亿元**、**养老金补助 1.2 万亿元**（含全国统筹调剂 1504 亿元）、**育儿补贴 999 亿元**（同比 +10.6%）

## 6. ✏️ 五、编辑后记

**总论**

今天（2026-08-28 周五）是 2026 年迄今最密集的政策 + 产业共振日之一：**6 部法律主席令 + 央行房贷 30→40 年新政 + 房地产融资 5 个管理办法 + 发改委集成电路 4 大成绩 + 物流网实施方案 + 沃什鹰派演讲**。产业端更炸裂：SMIC Q2 收入首次破 30 亿美元、长鑫 H1 净利 776 亿、长存 Q1 净利 333 亿、长江存储 IPO 募资 330 亿、集成电路前 7 月出口 1.49 万亿（+91.6%）。**3 个政策 + 5 个产业 + 1 个沃什** —— 10 个独立信号同时落地，密度 2026 年内罕见。

**Mavis 独立判断（5 条）**

1. 🟥 **"国产存储双雄 + 国产代工双雄"四象限已形成** —— 长鑫（H1 净利 776 亿）+ 长存（Q1 净利 333 亿）+ SMIC（Q2 收入 30 亿）+ 华虹（产能利用率 103%）。四家公司 H1 累计净利超过 1000 亿元，其中长鑫 + 长存两家公司 IPO / 已上市将吸纳 A 股大量资金，国产替代主线从"故事"进入"业绩兑现"阶段。

2. 🟥 **房地产新政 30→40 年 + 现房销售全国推行** —— 这是 1998 年房改以来最大尺度的信贷端松动，但同步要求"先拿房再还贷"。本质是：**降低月供压力（刺激刚需）+ 防范烂尾（保护购房者）+ 配合现房销售"所见即所得"**。三者逻辑自洽，但会推高购房总利息，购房者实际付出更多。**短期看 A 股地产链反弹（8.28 房地产板块涨），中期看销售去化节奏**。

3. 🟥 **沃什鹰派 + 9 月加息概率 35%→60%** —— 美联储主席"抗通胀尚未结束"的表态是 2025 年以来最强硬信号。2 年期美债收益率盘后冲至 4.31%（+8bp），10 年期 4.67%。**对 A 股影响**：① 北向资金 Q3 净流入可能放缓 ② 成长股估值压力增大（创业板 8.28 -1.41%）③ 但**对国产芯片是利好**——海外 AI 算力成本上升，国产替代加速。

4. 🟥 **AI 算力需求外溢效应** —— SMIC 赵海军透露：72 GPU 的 AI 机柜需要 **16000+ 个电源管理/供应器件**。这意味着 AI 算力扩张 1 颗 GPU 拉动 200+ 颗配套 PMIC / MCU / 模拟芯片。**SMIC、华虹成熟制程 93%+ 产能利用率、华虹 103% 接近物理极限**的本质原因在这里。**Q3- Q4 模拟 / 电源 / MCU 国产厂商（圣邦微、思瑞浦、纳芯微、艾为电子、晶丰明源）业绩弹性可能超过 AI 算力本身**。

5. 🟠 **手机市场 Q2 是分水岭，W32 苹果 13.3% 跌出前 5 是 9 月 iPhone 18 发布前最大悬念** —— 苹果 iPhone 17 销售周期 + 涨价预期透支了 2026 H1 需求，9 月 iPhone 18 + Mate 90 双旗舰发布前，国内市场进入"真空期"。**realme 退场后 1000-1500 元档真空**——这是 Redmi Note 17 / iQOO Z / 荣耀 X 系列在 9-10 月的关键窗口。

        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
