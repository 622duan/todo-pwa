## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**【国务院常务会议｜8.21 召开，李强主持】**
- 听取新一代通信网建设情况汇报，要求"应用牵引、适度超前"，统筹推进**基础网络、空间网络、国际网络、融合网络**"四张网"建设——这是对发改委近期"六张网"（含算力网、新型电网、新一代通信网）的进一步定调。([央广网](https://www.cnr.cn/china/news/sz/20260822/t20260822_527786816.shtml))
- 部署进一步清理拖欠企业账款，要求"压实主体责任、用好专项债券和专项再贷款、打通'连环清'链条"，**严防新增拖欠**，整治大企业拖欠中小企业账款。
- 研究持续改善空气质量，审议通过《电力安全事故应急处置和调查处理条例（修订草案）》《市场监督管理所条例（草案）》。
- **Mavis 点评**：🟢 国常会 19-20-21 连续三天密集部署"六张网"+ 民企投资 + 清欠，**稳投资信号是 2024 年以来最强**。预计 Q3 末发改委将继续推"2+3+N"协调机制（2 家电网+3 家电信运营商+N 家算力企业），算力+通信+电网协同进入实操期。

**【财政金融协同促内需 2.0｜8.21 三部门联合发布】**
财政部、人民银行、金融监管总局联合优化三方面政策（[人民日报](https://k.sina.com.cn/article_5895814239_15f6afc5f02001pcys.html)）：
- **贴息范围拓宽**：把流动资金贷款、信用卡分期（购车/装修）首次纳入贴息范围。
- **经办机构扩容**：中小微/服务业贴息经办机构从 100 家扩到 **400 家**。
- **额度上限提高**：中小微贴息贷款上限 5000 万→**7500 万**；服务业经营主体 1000 万→**2000 万**；个人消费贷上限 3000 元→**5000 元**。
- 财政部副部长廖岷披露：今年**财政支出首次破 30 万亿**，新增政府债券 11.89 万亿（历年最大），中央对地方转移支付 10.42 万亿（连续 4 年破 10 万亿）；**消费品以旧换新 1-7 月拉动销售额 1.32 万亿**，惠及 1.78 亿人次。
- 1-7 月财政金融协同 6 项工具**累计新发放信贷超 20 万亿**（+4.5% YoY），其中促投资 1.51 万亿、促消费 1.88 万亿。
- **Mavis 点评**：🟢 "消费贷贴息上限 5000 元"是这次最实在的——**直接降低信用卡分期成本 1-1.5 个百分点**，对 2000-3000 元价位家电、3C 消费形成精准刺激。下半年还有 2 万多亿专项债+超长期特别国债待发，财政弹药充足。

**【金融监管总局｜保险公司资产负债管理办法】**
6 章 46 条，强化险资久期/收益/流动性匹配，对长期股权投资占比上限松绑，被业内解读为"险资入市"进一步打开空间。

**【中央网信办｜促进网信企业高质量发展行动计划（2026-2030）】**
到 2030 年网信企业综合实力显著增强，"网信产业生态和发展环境全面优化"。 ([新华财经](https://www.cnfin.com/gs-lb/detail/20260822/4458945_1.html))

**【国家发改委｜《对外投资管理办法（修订征求意见稿）》】**
首次将境内企业、其他组织和居民个人统一纳入"投资者"定义，明确 QDII、港股通、跨境理财通渠道合规化——为人民币出海铺路。

**【国家发改委｜"六张网"协调调度机制 8.19】**
副主任岳修虎主持，建立"算力网、新型电网、新一代通信网"**2+3+N 协调机制**（2 家电网+3 家电信运营商+N 家算力企业）。

### 2.3 🟣 社会面 S

- **就业**：7 月城镇调查失业率 5.2%，与上年同期持平；30-59 岁劳动力失业率 3.9%（环比下降）。高校毕业生就业政策延续（稳岗返还、社保补贴扩围）。
- **消费**：以旧换新 1-7 月累计带动销售额 1.32 万亿；服务零售 +5.0% 明显快于商品零售。
- **民生"一老一小"**：下达 241 亿元支持学前一年免保教费，约 1000 亿元育儿补贴；中度以上失能老人养老服务消费补贴全国推广。
- **入境消费**：离境退税 2.0 版 7.1 落地，7 月多地离境退税商品金额大幅增长。
- **养老/医疗**：退休人员基本养老金继续上调，城乡居民基础养老金月最低标准提高 20 元。
- **社保**：北京 2026 年社保缴费基数上限 36348 元、下限 7270 元（7 月起执行）。
- **食品安全**：市场监管总局 8.21 通报 45 批次食品抽检不合格。
- **司法**：原国家中医药管理局局长于文明受贿案一审 8.21 天津宣判，**有期徒刑 15 年**。
- **Mavis 点评**：🟣 就业稳、消费弱——这是当前最真实的画像。**服务消费（旅游、文体、通讯信息服务）**是最大亮点，1-7 月旅游咨询租赁 +11%、文体休闲 +10.1%、通讯信息服务 +11.9%。**离境退税 2.0 落地后"中国游"→"中国购"转化明显**，7 月多地离境退税金额大增。

## 6. ✏️ 五、编辑后记

**【Mavis 总论】**

今天 4 大主线已经成形，没有一条是"待观察"——全部是已经落地的中报、政策和价格数据：

1. **存储超级周期**从"预期"变成"中报"：长存 IPO 受理 +330 亿元募资、长鑫市值 4 万亿、长江存储 Q1 单季净利率 70.96%、DDR5 一年 +483%——这是 15-20 年一遇的硬科技大周期。**Q3-Q4 涨幅收敛但方向不变**（大摩 +50%、集邦 +13-18%）。
2. **国产算力全链兑现**：SMIC 30 亿美元、+36%；寒武纪 +108%；海光 +67%；长电 +79%；中际旭创 +182%；通富 +288-337%——AI 算力链已经形成"中报级"的硬兑现。8.22 A 股科创 50 **+8.59% 单日最大涨幅** + 半导集体涨停，是市场对这条主线的最直接投票。
3. **国家稳投资发力**：国常会"六张网"+ 发改委"2+3+N"协调机制 + 财政金融协同政策 2.0（消费贷贴息上限 5000 元）+ 清欠 + 民企座谈，**1.32 万亿以旧换新销售额**+20 万亿财政金融协同信贷——下半年固投跌幅有望收窄。
4. **国际"双震荡"**：黄金 4600 美元/盎司（三个月新高）、央行购金 21 个月、中国央行 2306 吨储备、黄金超美债成全球第一储备资产；同时美债 30Y 5.28% 高位、杰克逊霍尔 8.28-29 沃什首秀、AI 资本开支与美债融资裂痕扩大。

**【Mavis 独立判断】**

1. 🟢 **长存 IPO 受理是 A 股半导体下半年最大事件**——330 亿元募资刷新科创板纪录，前两大股东湖北长晟 26.54% + 芯飞科技 25.35%（无控股股东），5 大行 + 大基金一期/二期 + 光谷产投 + 国芯基金共持，**多元制衡治理是好事也是效率隐忧**。Q1 333 亿净利中前五大客户占比 51-65%，**单一客户集中度风险需在路演问询中重点关注**。

2. 🟢 **AI 算力链的真正瓶颈在 HBM/先进封装，不是 SMIC 产能**——SMIC 7nm 月产能 4.5 万片/2026 末 6 万片，可做 100+ 万颗昇腾；但**长鑫 HBM3 只能供 25-30 万颗昇腾**（2026）。**长存 294 层 NAND**已经全球出货第三，但**HBM 国产化还要 2-3 年**。H1 长电 +79%、通富 +288-337%、华天 +231-275% 的不对称爆发，说明**封测产能比制造更紧**。

3. 🔴 **手机行业的"高端化+涨价+销量负循环"是 2026 年最难解的产业悖论**——Omdia 预测 2026 中国手机全年 -6%，ASP 涨 21% 至 565 美元。**4000 元以下机型正在消失**。**Counterpoint 8.20 周度报告：中国 1-30 周销量 -8.6%**——618 后跌回双位数。**真正看点是华为 24%+ 苹果 23%+ vs OPPO/vivo -17%/-18%**——"高端通吃 + 中端失血"格局已经不可逆。

4. 🟠 **黄仁勋罕见发飙（"我不是一觉醒来就认输的人"）** 说明英伟达管理层第一次承认对华管制正反噬自己。TrendForce 2026 国产 AI 芯片 90% 份额预测如果兑现，**英伟达 2026 在华份额 8%（vs 2024 66%）**——这是过去 10 年最剧烈的市场份额迁移。**苹果被"直白告知"不许用长鑫** + **长鑫拒给苹果折扣** + **惠普/宏碁/华硕已用长鑫**——商业逻辑已破，但政治逻辑还在挣扎。

5. 🟡 **黄金 4600 美元 + 央行 21 个月连续购金 + 黄金超美债成全球第一储备**——这是 2025 年以来"去美元化"叙事的"质变"信号。**但高盛把 4500 美元列为关键阻力位**，期权市场情绪过热，**下周杰克逊霍尔 + PCE 数据**是 8 月最大变盘点。短期回调风险不低，但长期支撑没破。

6. 🟢 **DeepSeek V4 + Qwen3.8-Max + 10 天三大模型齐发**——这是 18 个月来"API-only"主导被打破的标志事件。**Qwen/DeepSeek 已被联合国 AI 报告 + 黄仁勋 7.24 公开信"双认证"**。**国产开源 4/5 vs 美国开源 0/5**——开放权重对决封闭 API 的下半场已经开打。

7. 🟢 **人形机器人进入"量产元年"**：宇树 4449 亿市值 + 2025 卖 5215 台 + 2026 H1 卖 4500+ 台 + 单价从 59 万降到 8.5 万（6.9 倍降幅）。**但商业拐点还在 2027-2028**——宇树 2025 人形收入科研教育占 70%+，工业场景只是个位数占比。**2026 是"应用落地元年"（10-100），硬件量产拐点已坐实，具身智能泛化 + 真实 ROI 拐点还在磨**。

**【重点关注节点｜未来 1-2 周】**

- **8.26（周二）** 英伟达 FY27Q2 财报——AI 资本开支与 Blackwe ll 出货指引
- **8.28-29（周四-五）** 杰克逊霍尔年会，**美联储主席沃什首秀**
- **8.30（周六）** 美国 7 月 PCE 通胀数据

- **9 月中** 8 月 PMI、8 月社融、8 月经济数据

**【风险提示】**

1. **存储超级周期顶部 1-2 年内出现**——大摩预测 2027 缺口扩大，集邦预测 2027 H2 NAND 供给转松，**风险时点在 2027 H2-2028 H1**。
2. **美实体清单可能随时落下**——DeepSeek、长鑫、100+ 中国企业名单"暂缓不是赦免"，**触发后影响不止供货，还有客户/合作/托管三断**。
3. **8.26 英伟达财报可能不达预期**——AI 资本开支与融资成本、Blackwell 良率、H20 禁令再收紧都是潜在风险。
4. **国内 1-7 月固投 -6.7%**——若 Q3 跌幅不能收窄至 -5% 以内，全年 5% 增长目标承压，**稳投资政策可能再加码**。
5. **黄金高位 + 期权过热**——8 月波动率 GVZ 抬升至 22+，**下周杰克逊霍尔 + PCE 数据**可能引发 100 美元级别双向波动。

        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
