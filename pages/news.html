## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**国常会 8.31 五措并举,聚焦招商引资"反内卷"**
- 李强总理 8 月 31 日主持召开国务院常务会议,学习贯彻习近平总书记在中央政治局会议研究部署西藏日喀则市吉隆县泥石流灾害抢险救援工作时的重要讲话精神,听取城市地下管网建设情况汇报,研究促进招商引资高质量发展有关工作,讨论《税收征管法(修订草案)》,审议通过《审计法实施条例(修订草案)》。
- 会议明确"明确政府招商引资鼓励和禁止的具体行为",强化正向引导与刚性约束,要求"持续用力、久久为功"。国家发改委等部门 2026 年 1 月已表示将制定出台《妨碍建设全国统一大市场事项清单》和《招商引资鼓励和禁止事项清单》,为地方政府经济促进行为划定"红绿灯"。
- **Mavis 点评**:这是 2026 年最具结构性意义的政策转向之一——从"拼优惠"到"拼生态"标志着地方政府 GDP 锦标赛模式正式谢幕。下半年地方政府的"反内卷"治理会进入实操阶段,跨区域产业整合与并购重组将受益,头部企业供应链布局迎利好。
- 来源:[国务院网站](https://www.gov.cn/) | [21 世纪经济报道](https://www.toutiao.com/article/7680466142644994603/) | [人民日报](https://news.gmw.cn/2026-09/01/content_38977400.htm)

**🟥 7 部门联合发文推动商品消费扩容升级(9.1 发布)**
- 商务部、国家发改委、工信部、财政部、农业农村部、文化和旅游部、市场监管总局 8 月 31 日印发《关于推动商品消费扩容升级的实施意见》,提出到 2030 年社会消费品零售总额达 **60 万亿元** 左右,培育形成绿色消费、智能消费、健康消费等 **十万亿级** 市场。
- 4 方面重点任务:①促进大宗耐用(汽车、家电、智能家居);②提升生活日用(食品、纺织);③支持特色消费(银发、婴童、国货潮品);④培育升级类(绿色、智能、健康)。
- **Mavis 点评**:目标"60 万亿"对应 2025 年约 48 万亿社零总额,意味着 2026-2030 年均复合增速要达到 4.5%——这是国务院首次用"十五五"倒推机制给消费总量定调,智能家居、AI 手机、PC、家用机器人首次纳入政策视野,消费电子产业链直接受益。
- 来源:[新华社](https://m.xzxw.com/zh/html/2026-09/01/content_6951406.html) | [中国网](https://news.china.com.cn/2026-09/01/content_118673768.shtml)

**🟥 5 部委联手 8.28 推房地产"现房销售+信贷期限延至 40 年"新政**
- 8 月 28 日,住建部、自然资源部、金融监管总局联合印发《关于完善商品住房销售制度的通知》;央行、金融监管总局联合印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》;证监会发布《关于资本市场支持构建房地产发展新模式的意见》;金融监管总局发布 5 个管理办法。
- 三大亮点:①个人住房贷款期限由 30 年延长至 **40 年**(1999 年以来首次调整);②新出让土地项目 **优先选择现房销售**;③主办银行制+预售资金全额监管+竣工备案后发放按揭,形成项目资金闭环。
- **Mavis 点评**:这是房地产从"预售杠杆+高周转"旧模式向"现房兜底+稳健运营"新模式的制度转折点。对购房者是利好(彻底告别烂尾),对房企是利空(回款变慢、高杠杆模式终结)——9 月起,行业会出现明显的 K 型分化,优质央国企房企与稳健民企会拿到更多信贷倾斜。
- 来源:[央视财经](https://finance.cctv.com/2026/08/29/ARTIhxs9dk1G5wuBvnJ4OsIV260829.shtml) | [新京报](https://www.bjnews.com.cn/)

**北京、上海、深圳"金九银十"政策已就位**
- 北京 8.7 新政:非京籍五环内购房社保 2 年→1 年,夫妻双缴存公积金最高 **240 万** (顶格 340 万);上海 8.20"沪八条":外环外二套首付 **15%**,二手房日均成交 727 套,较政策前 +14%;深圳 8 月新房网签 **+20.4%**,二手 +2.4%。
- 来源:[中国经济时报](https://www.toutiao.com/article/7680383339975229987/) | [证券时报](https://www.toutiao.com/article/7680709150178853382/) | [央视财经](https://www.toutiao.com/article/7680711946929078818/)

### 2.2 🟠 经济面 E

**🟥 8 月制造业 PMI 49.8,大型企业重返扩张区间**
- 国家统计局 8 月 31 日发布:制造业 PMI 49.8%(+0.6pct),非制造业商务活动 49.0%(持平),综合 PMI 49.5%(+0.2pct)。**大型企业 PMI 50.6%(+1.1pct)** 重返扩张,中型 49.4%、小型 47.9%。装备制造业 51.4%,高技术制造业 **52.9%** 持续领跑。
- 价格指数:原材料购进 56.6%(+3.4pct),出厂价格 50.4%(+2.6pct) 重返扩张,有色金属冶炼价格指数双双冲上 60% 上方。
- 1—7 月规上工业企业利润 **+17.6%**;1—7 月固投 26.03 万亿 **同比 -6.7%**,但知识产权产品投资 **+9.1%**。
- **Mavis 点评**:8 月 PMI 走强由"国内需求回暖+新订单重返扩张"驱动,但生产端恢复滞后于需求端,显示企业还处于"以销定产"的谨慎状态。制造业内部 K 型分化加剧:大型国企+高新技术领跑,中小型仍承压——下半年财政与准财政工具(超长期特别国债、新政策性金融工具)加快落地是关键变量。
- 来源:[国家统计局](https://www.stats.gov.cn/sj/zxfbhjd/202608/t20260831_1965155.html)

**CPI/PPI 双双温和回升**
- 1—7 月 CPI 同比 **+0.9%**,PPI 同比 **+1.8%**;核心 CPI 连续 5 个月走强。PPI 改善主要受"反内卷"政策带动上游能源、原材料价格回暖(煤炭加工、黑色冶炼、光伏设备、电池制造),与产业升级带动的飞机制造(+1.4%)、可穿戴智能设备(+0.1%)形成结构性改善。
- 来源:[国家统计局](https://www.stats.gov.cn/sj)

**🔴 央行 9.1 净回笼 4690 亿元,流动性"放短收长"**
- 9 月 1 日,央行开展 50 亿元 7 天逆回购+3590 亿元隔夜逆回购,当日有 3860 亿元 7 天+4470 亿元隔夜逆回购到期,**净回笼 4690 亿元**。DR007 1.3841%,隔夜 Shibor 1.3640%,均回落至政策利率下方。
- 8 月 27 日—9 月 1 日,央行累计开展 4 次隔夜逆回购共投放 **1.64 万亿元**,MLF 当月净回笼 1000 亿元。
- 9 月有 5000 亿元 3 个月期+5000 亿元 6 个月期买断式逆回购+6000 亿元 MLF 到期;政府债净供给约 1.81 万亿元;9 月 24 日 1.78 万亿元中长期流动性工具集中到期。
- **Mavis 点评**:央行"削峰填谷"思路明确,9 月降准降息概率有限——中信证券、东吴、申万、东北证券均预计央行延续"精准滴灌"。3 季度末或 4 季度降息 10BP+降准 0.5pct 的窗口犹存,但需等出口或经济失速信号触发。
- 来源:[证券日报](https://www.toutiao.com/article/7680572097768309282/) | [澎湃新闻](https://www.toutiao.com/article/7680550036354122276/)

**人民币升值 +0.19%,逼近三年高位**
- 9 月 1 日人民币对美元中间价 6.7809(升 19 点),在岸 6.7195(升 112 点),离岸 6.7179(升 129 点);CFETS 指数 101.87;美元指数 99.65(+0.24%)。
- 1 年期 LPR 3.00%、5 年期以上 3.50% 连续 15 个月不变;1 年期 MLF 2.50%。8 月 20 日工行海南分行等落地全国首单 DR 基准利率贷款,贷款利率定价从"LPR 单一锚"转向"LPR+DR 双锚"。
- 来源:[国际金融报](https://www.ifnews.com/news.html?aid=866447)

### 2.3 🟣 社会面 S

**就业形势总体稳定,失业率季节性上升**
- 1—7 月城镇调查失业率均值 **5.2%**(与 1-6 月、上年同期持平);7 月单月 5.2%(环比 +0.2pct),外来农业户籍 4.9%,31 大城市 5.2%。企业周均工时 48.2 小时。
- 上半年城镇新增就业 695 万人,完成全年目标 58%;人社部+财政部出台青年就业 16 条,会同教育部"就业公共服务进校园百日行动"启动;补贴性培训上半年超 **550 万人次**(人工智能、先进制造、新能源汽车、康养、低空经济五大领域)。
- 来源:[华夏时报](https://www.163.com/dy/article/L4I6LFDA0512D03F.html)

**1—7 月消费规模扩大,服务零售额 +2.6%**
- 1—7 月社会消费商品和服务零售总额同比 **+2.6%**;上半年 A 股 5557 家上市公司归母净利润 **3.58 万亿**(同比 +19.4%,创 2022 年以来新高),**科创板净利润大增 437.59%**;867 家公司中期分红 7166.7 亿元。
- 6 大行中期分红比例统一提升 1pct 至 31%;工商银行总市值 2.78 万亿(逼近 3 万亿),中国/建设/中信/成都/江苏银行批量创历史新高。
- **Mavis 点评**:银行股批量新高+科创板利润暴增,反映资金从"高股息防御"到"硬科技进攻"的双线布局正在形成——这与今日 MLU 智能驾驶事故、9.1 智谱半年报 +400% 的 AI 商业化提速形成共振。
- 来源:[证券之星](https://www.toutiao.com/article/7680391259470430746/) | [腾讯网](https://new.qq.com/rain/a/20260901A0BIJ000)
