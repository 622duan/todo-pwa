**Mavis 点评**：今天是"AI 利润图谱"清晰呈现的一天。**🟥 字节 2000 亿 AI 投入 + 850 亿买芯片**是迄今最激进的中国 AI 投资。**金山办公 WPS365 H1 +60.84%** 是"应用端跑通"的最早信号。**蔚来连续 3 季盈利 + 现金储备 567 亿**是中国造车新势力的"盈利拐点"。"上游吃肉、中游烧钱、下游刚起步"的格局短期不变，但下游拐点会率先出现在"AI+ 办公"和"AI+ 教育"。

## 6. ✏️ 五、编辑后记

**今天 4 大主线：**

1. **🟥 8 月 PMI 新订单 +2.1pp 跳到 50.6%**——内需真的"动"了。**RatingDog 私部门 9 个月连续扩张** + 出口订单 50.1%，给 9 月市场一个扎实的宏观底座。
2. **🟥 长鑫科技 H1 净利 776.05 亿 + 毛利率 84.7%**——这一家公司的 H1 净利是 **10 家芯片龙头总净利的 69.4%**（776/1118），单一存储公司盈利能力超过"AI 芯片 + 晶圆代工"两大类公司合计。这是**AI 算力时代"存储即权力"**最直接证据。
3. **🟥 美银 8.27 报告 9 月存储再涨 10-20%**——16Gb DDR5 现货 54 美元（年初至今 +85%）、NAND 1Tb wafer 31.9 美元（同比 +526%）、2027 全球 DRAM 销售额 +80% 原 48%——AI 时代的"超级周期"已经从"数据信号"变为"商业现实"。
4. **🟥 美军 9.1 打击伊朗 + WTI 油 +5.2%**——美伊冲突进入"边打边谈"新阶段，**霍尔木兹海峡通航量远低于战前每天 120 艘**；9 月地缘风险溢价上升，**对冲黄金大跌** 是值得关注的反差信号。

**Mavis 独立判断（5 条）：**

- **🟢 长鑫 H1 营收 1503 亿（+873.6%）"超额兑现"是国产存储定价权的标志性事件**——超过所有分析师预期（半导体 1-7 月利润 +18.5 倍是平均水平，长鑫单家 +873.6% 远超）。**全球 DRAM 7.67% 份额（中国第一）+ 84.7% 毛利率**意味着**国产存储不再"低价换市场"**。长存 NAND 全球 14% 紧随——**国产存储"双巨头"已经成型**。
- **🟡 9.1 A 股"沪强深弱 + 算力跌、红利涨"是阶段切换**——中国银行 / 建设银行创历史新高 vs. 电子 -2.99% 表明资金从"科技 + 涨价"切换到"红利 + 防御"。**9 月中上旬延续反弹，临近十一风格偏防御**——招商 / 申万 / 中信建投三券商共振判断。
- **🟠 美伊冲突升级 + 油价 +5.2% 是 9 月最大宏观风险**——布伦特 94.65 / WTI 90.22 美元；**上海油 +7.93% 创近期最大涨幅**。中国对原油外依赖 70%+，**每涨 10 美元/桶 → 拖累 GDP 0.2-0.3pp**。**霍尔木兹海峡每天 120 艘通航量 + 战前水平对比** 是关键观察点。
- **🟢 9.9 苹果发布会 + 折叠 iPhone 1999-2500 美元** ——这是苹果 2017 iPhone X 以来**第一个真正新形态**。**预装 mac mini / Mac Studio 已于 8.25 发布，9.22 开售**。**苹果选择此时发折叠机正是英伟达重启 Rubin CPX（AI 推理专用 HBM4 1.34TB）**的同一周——**消费电子 + AI 算力"双头定价"**时代开始。
- **🟠 阿里 Q2 AI 云 +45% vs. AI 实验室 -330% 亏损扩大**——"上游赚钱、下游烧钱"是中国 AI 利润图谱的清晰写照。**阿里 800 亿港元配售 + 管理层 8 亿港元增持**形成"筹资-投资"闭环。**"AI CapEx 三年回本"是高盛对阿里的核心论点**——但前提是云业务增速 + 利润率兑现。

        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
