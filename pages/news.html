## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**9 月新规集中生效**（[来源：央视](https://www.toutiao.com/article/7680429738020373019)）：

| 新规 | 生效日 | 关键变化 |
|------|--------|----------|
| 《住房公积金管理条例》修订 | 9.20 | 🟥 **提取情形从 6 项扩到 9 项**（新增装修、物业费），房租提取取消工资比例门槛，贷款审批 15→10 日 |
| 《国务院出境入境管理规定》| 9.15 | 19 条新规；中介机构 15 日内备案，存量 90 日过渡 |
| 《微短剧发展管理办法》| 9.1 | 投资分级备案 + 发行许可；**AI 生成内容须在每集明显位置加标识** |
| 《金融产品网络营销管理办法》| 9.30 | 禁用"低门槛""秒到账""低利率"等话术；贷款产品须在金融机构自营平台营销 |
| 《国家基本药物目录（2026 版）》| 9.1 | 🟥 **药品从 685→794 种，新增 116 种**；高血压药 +4、糖尿病 +5、慢阻肺 +7 |
| 电池消费税 | 9.1 起 2%、2027.9.1 起 4% | 🟥 **钠电/固态/燃料/钙钛矿/叠层/砷化镓电池免征至 2028.12.31** |
| AI 客服新国标 | 9.1 | "AI 已读乱回"经营者要担责；必须设醒目"转人工"入口 |
| 《电子单证应用规定》| 9.1 | 鼓励电子提单、电子仓单、数字人民币跨境支付 |
| 离境退税"即买即退"线上办理 | 9.1 | 优化退税流程 |
| 公积金提取资金 / 沪苏入境游奖励 | 9.1 / 9.10 | 苏州旅行社年最高 300 万元奖励 |

**Mavis 点评**：9 月新规最值得关注的是「公积金提取扩容」和「电池消费税」——前者把住房消费的政策工具箱再次打开，对房地产需求是**温和利好**；后者对钠电/固态电池直接免税至 2028 年底，是**对新型电池路线的真金白银扶持**，宁德时代、比亚迪、亿纬锂能、瑞浦兰钧的钠电/固态产品线将获益最大。

**财政与货币**（[来源：证券日报](https://www.toutiao.com/article/7680572097768309282/)、[发改委会议](https://www.163.com/dy/article/L5H85TUH0512D03F.html)）：

- 🟥 **超长期特别国债发行进度即将达 80%**：1—8 月已发 9720 亿元（进度 75%），**9.2 续发 30 年期（六期）730 亿元**，票面 2.14%，发行后总规模将达 10450 亿元，全年额度 1.3 万亿。
- 🟥 **8000 亿"两重"资金已全部下达**：支持 1417 个重大项目；2000 亿"两新"设备更新资金也已全部下达，支持 22 个领域约 1.1 万个项目。
- 发改委半个月连开 **7 场促投资会议**（8.14、8.19、8.20×2、8.25、8.28），主题围绕"六张网"（算力网/新型电网/新一代通信网等）、"2+3+N"协调机制、专项债、新型政策性金融工具（8000 亿元）。
- 央行 9.1 开展 50 亿元 7 天期 + **3590 亿元隔夜逆回购**，当日净回笼 4690 亿元（跨月后削峰填谷）。
- 上周（8.24—8.28）央行**净投放 12265 亿元**，8 月隔夜逆回购累计操作 4 次、合计 16395 亿元。
- 8.27 MLF 缩量续作，净回笼 1000 亿元；9 月有 5000 亿 3M 买断式 + 5000 亿 6M 买断式 + 6000 亿 MLF 到期。

**Mavis 点评**：财政"加快发、加快投" + 货币"削峰填谷"组合拳已经清晰。9 月 6000 亿 MLF 到期预计仍会等量或加量续作（参照 7—8 月惯例），市场流动性不会有大风险；但**30 年国债活跃券收益率已重回 2.18% 附近**（上行 1.75bp），与 10Y 国债 1.698% 形成"长端调整"格局，债市或告别单边下行进入震荡。

### 2.2 🟠 经济面 E

**8 月制造业 PMI 49.8%**（[来源：统计局](https://www.stats.gov.cn/sj/sjjd/202608/t20260831_1965155.html)）：

- 制造业 PMI **49.8%**（环比 +0.6pct），21 个行业中 **16 个回升**。
- 生产指数 **50.4%**（+0.5pct）、新订单指数 **50.6%**（+2.1pct）— 产需双扩张。
- 大型企业 PMI **50.6%**（+1.1pct，重回扩张）；中型 49.4%（-0.3pct）；小型 47.9%（+0.5pct）。
- 装备制造业 PMI **51.4%**、高技术制造业 **52.9%** — 持续扩张。
- 原材料购进价格 **56.6%**（+3.4pct）、出厂价格 **50.4%**（+2.6pct，重回扩张）— 受原油/有色价格上行推动。
- 非制造业商务活动指数 **49.0%**（与 7 月持平）；服务业 49.3%。
- 邮政、电信、互联网软件等行业商务活动指数均 > 55.0%；邮政业创年内新高 > 60%。

**1—7 月规模以上工业利润**（[来源：中国网](https://big5.china.com.cn/gate/big5/finance.china.com.cn/industry/20260827/6322283.shtml)）：

- 🟥 **1—7 月规上工业利润 +17.6% YoY**（4.58 万亿元）。
- 🟥 **电子行业利润 +110%（1.1 倍）**，拉动规上工业利润增长 9.3pct。
- 🟥 **集成电路行业利润 +18.5 倍**（1850%），对电子行业利润增长贡献率 > 80%。
- 高技术制造业利润 **+50.1% YoY**。
- 1—7 月规上工业增加值 **+5.3%**（装备制造业 +9.7%、高技术 +13.8%）。

**1—7 月宏观数据**（[来源：国家统计局](http://tjj.xjbt.gov.cn/c/2026-08-28/8501126.shtml)）：

| 指标 | 1—7 月 | 7 月单月 |
|------|--------|----------|
| 规上工业增加值 | +5.3% | +4.5% |
| 社零总额 | +1.2% | +0.6% |
| 固定资产投资 | 🟥 -6.7% | 环比 -1.42% |
| 房地产开发投资 | 🟥 -19.2% | — |
| 进出口 | +17.3% | +19.2% |
| CPI | +0.9% | +0.5% |
| 城镇调查失业率 | 5.2% | 5.2% |

**Mavis 点评**：工业利润的爆发本质是**集成电路 +18.5 倍**驱动的——AI 算力 + 存储涨价 + 国产替代三条线共振，把电子板块的利润水平拉到了历史最高点。但同时，**固投 -6.7%、地产 -19.2%** 反映传统经济仍弱，呈现"高科技/AI 强、地产/传统制造弱"的结构性分化。

### 2.3 🟣 社会面 S

- 🟥 **就业总体稳定**：1—7 月城镇调查失业率均值 5.2%，7 月单月 5.2%（+0.2pct），本地 / 外来户籍均为 5.2%；31 大城市 5.2%；周均工时 48.2 小时。
- **社零 1—7 月 +1.2%**，服务零售额 +5.0%，商品零售额 +1.1%。餐饮收入 +2.6%，化妆品 +6.3%，通讯器材 +15.1%，粮油食品 +7.2%。
- 网上商品和服务零售额 1—7 月 +4.8%（117214 亿元），其中网上商品 +4.6%、网上服务 +5.2%。
- **暑期消费带动明显**：文体娱乐行业商务活动指数连续 2 月 > 54%；铁路、航空、住宿、景区、文体娱乐均处扩张区间。
- 9 月新规聚焦民生：医保个人账户扩大家庭共济、公积金提取扩容、AI 客服新国标、微短剧分级（保护未成年人）。

**Mavis 点评**：消费数据温和回暖但不及预期——社零 7 月单月 +0.6% 几乎是"零增长"，**通讯器材 +15.1% 是为数不多的亮点**（iPhone 17 / 华为三折叠备货）。9 月开学季 + 9 月旗舰发布潮（华为/苹果/小米/OPPO/vivo 折叠屏大战）有望带动一波换机潮。

**AI 算力 / 国产芯片**（[来源：央视财经](https://weibo.com/1279746217/5338264363338729)、[AI 前线](https://www.163.com/dy/article/L5O37M5G05566ZHB.html)）：

- 智谱 GLM-5.3-Flash 在大规模流量中首次用国产芯片集群对外提供服务，**单 token 成本已与主流英伟达 GPU 相当**。

- 华为昇腾 950 超节点 9.17—9.19 全联接大会（上海）将发布更多商用细节；阿里云栖大会 9.22—9.24（杭州）。

**手机 9 月旗舰大战**（[来源：太平洋科技](https://news.qq.com/rain/a/20260830A0AJF400)、[新浪](https://k.sina.com.cn/article_7879996046_1d5af328e06801ikhi.html)）：

- **9.10 凌晨 1:00 苹果秋季发布会**：首款折叠屏 iPhone Ultra（5.5/7.8 英寸、A20 Pro 2nm、液态金属铰链、起 14999 元）+ iPhone 18 Pro 系列。
- **9 月小米 18 Fold 阔折叠**（9999 元起、玄戒 O3 3nm 芯片）；OPPO Find X10、vivo X500、荣耀 Magic 9、一加 16、iQOO 16、华为 Mate 90 全月排队发布。
- 9.22—9.24 高通骁龙峰会（骁龙 8 Elite Gen6，N2P 2nm）；9 月天玑 9600 Pro 同样 2nm。

## 6. ✏️ 五、编辑后记

**今天 4 大主线：**

1. **存储超级周期进入主升浪第 2 阶段**：DDR5 16Gb 现货 $51（+480% YoY）、DDR4 16Gb $87（+690%）、NAND 256Gb wafer 同比 +979%——美银预计 9 月再涨 10—20%。长鑫 7.27 科创板上市（3.28 万亿市值）、长江存储 IPO 拟募 330 亿（科创板纪录），国产存储从主题进入业绩兑现期。

2. **AI 算力"配套采购"成杀手锏**：工信部 + 网信办 + 发改委 8 月底发文——采购英伟达 H20 / 同等级境外算力，须按不低于同等金额比例同步采购国产 AI 芯片。叠加英伟达 H200 实际只占其 DC 业务 < 1%，**国产 AI 芯片 2026 需求 400 万颗、实际交付 300 万颗，百万级产能缺口**——范式智能 10 亿元采购昇腾 950 是这一逻辑的最强验证。

3. **9 月手机旗舰大战：折叠屏 + 2nm + 自研芯片三线齐发**：9.7 华为 Mate XT 2（17999 元起、三折叠）、9.10 苹果首款折叠 iPhone Ultra（14999 元起、A20 Pro 2nm）、小米 18 Fold 阔折叠（9999 元、玄戒 O3 3nm）——三大头部厂商同月对决折叠屏赛道。Counterpoint：Q2 全球手机出货 -7% YoY 但**营收 +7% 至 1090 亿美元创历史新高，ASP +17% 至 $400**——存储涨价正被品牌溢价吸收。

4. **财政 + 货币双管齐下稳增长**：超长期特别国债 1—8 月已发 9720 亿（进度 75%），9.2 续发 730 亿、年内将达 1.045 万亿（80%）；8000 亿"两重"资金已全部下达 1417 个项目。央行 8 月净投放 12265 亿、隔夜逆回购工具高频使用——9 月预计延续"削峰填谷"基调，但 30Y 国债活跃券收益率已重回 2.18%。

**Mavis 独立判断：**

1. **存储涨价 Q4 不会快速回落**。美银报告显示，9 月供给满足率 < 50%，即使现货价已令多数 IT 产品毛利转负，三星 / SK 海力士 / 美光仍将 60—70% 产能纳入 LTA 长协、优先供 HBM 与服务器 DRAM。**消费电子（手机 / PC）将持续承压**，但 600 美元以上高端机型份额创历史新高 29%，证明**品牌溢价 + 高端化** 仍能吸收部分成本压力。

2. **国产 AI 芯片 2026 市场份额预计突破 60%**。基于：① 配套采购政策硬约束；② 昇腾 950 FP16 算力已达 H100 90%+；③ 华为 CloudMatrix 384 超节点跑通 300 PFLOPS；④ 范式、智谱、DeepSeek 头部 AI 公司全面切换；⑤ 长鑫 7.67% + 长江存储 14% 全球存储份额打底。**英伟达即使获准全面重返，也回不到 17% 营收占比的巅峰**。

3. **9 月手机"量缩价涨"逻辑将延续全年**。IDC 预测 2026 全年全球手机出货 -16.7%（创历史最大），但 ASP +27.6% 至 $581，总市场价值仍 +6.3% 至 6130 亿美元。**9 月新品发布季的关键观察点不是"谁卖得多"，而是"谁能把价格定住"**——存储成本传导能否被消费者接受，决定了 2027 年的份额格局。

4. **中芯国际 + 华虹的 Q3 指引分化（中芯 +2—4%、华虹 +8%）** 反映"产能扩张节奏"差异——中芯新增 12 英寸 4 万片/月因设备时间错配未能完全释放，华虹 Fab 9 满产 + Fab 9B 启动 + 收购华力微获 4 万片/月，**华虹在 Q3—Q4 的产能弹性更大**。长期看，中芯规模优势不变，但华虹的 AI 外溢受益更直接（独立式 NVM +149%）。

5. **电池消费税 9.1 开征对新能源车销量影响有限**。2% 税率可被整车厂吸收（宁德 23.96% 储能毛利率、宁德 20.63% 动力电池毛利率均有缓冲），**真正受冲击的是中低端二线电池厂**（亿纬 12.51% 储能毛利率）。同时**钠电 / 固态 / 燃料 / 钙钛矿 / 叠层 / 砷化镓** 6 类电池免征至 2028.12.31——这是对新型电池的明确扶持，宁德钠新、比亚迪刀片二代、广汽全固态都将受益。

6. **9.17—9.19 华为全联接大会 + 9.22—9.24 阿里云栖大会 + 中美 AI 对话**——三场重磅活动密集落地，可能推动 AI 进入"**国产超节点时间**"。昇腾 950 超节点（基于灵衢互联协议、1024 卡、1 EFLOPS FP8 算力、256TB 全局统一内存）将公布更多商用细节。这是中国 AI 算力从"单卡追赶"到"集群竞赛"的标志性节点。
