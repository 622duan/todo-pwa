## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**国常会 8.21 部署新一代通信网+清欠账款**：李强主持召开国务院常务会议，听取新一代通信网建设情况汇报，部署进一步清理拖欠企业账款工作，研究持续改善空气质量。强调"统筹推进基础网络、空间网络、国际网络、融合网络建设"，普及推广新一代智能终端，培育智慧城市、智能制造等场景。[来源](https://politics.people.com.cn/n1/2026/0822/c1024-40784112.html)

**财政部"十五五"财政路线图**：副部长廖岷 8.21 国新办发布会披露 6 方面：财政实力增强、支出结构优化（更多转向"投资于人"）、宏观调控提升、财税改革深化、科学管理提高、风险化解；财政支出预算首破 30 万亿，新增政府债券 11.89 万亿，中央对地方转移支付 10.42 万亿。[来源](https://www.toutiao.com/article/7676496144029024818/)

**🟥 财政金融协同促内需政策 8.1 起优化升级**：个人消费贷款贴息上限 3000→**5000 元**，中小微企业贷款上限 5000→**7500 万元**，经办机构 100→**400 家**，新增流动资金贷款+信用卡分期贴息。1-7 月累计支持新发放信贷超 20 万亿元，4.5% 同比增长，惠及居民 1.13 亿人次、企业 622 万家。[来源](https://www.toutiao.com/article/7676496144029024818/)

**🟥 长存控股科创板 IPO 受理，拟募资 330 亿元**：8.21 上交所受理，刷新科创板纪录。Q1 营收 470.42 亿元/归母净利 333.79 亿元（超 2025 全年两倍），NAND 毛利率 78.73%，产能利用率 98.02%。208 亿产线升级+122 亿研发。[来源](https://www.nfnews.com/content/X3RvwWeD3P.html)

**稀土出口管制扩至技术端**：商务部公告对稀土开采、冶炼分离、金属冶炼、磁材制造、二次资源回收利用相关技术（1E902.a/b）实施出口管制，覆盖设计图纸/工艺规范/参数/加工程序/仿真数据等。[来源](http://gzylhyzx.com/detail.html?newsId=9977717)

**Mavis 点评**：本周政策"组合拳"密集兑现：8.1 信用卡分期贴息+8.21 国常会通信网+8.21 财政发布会"投资于人"+长存 IPO 受理，四件事同周落地，是 7.30 政治局会议"加大逆周期调节"的具体落子。**Mavis 点评**：下半年还有 2 万多亿专项债+超长期国债待发行，按财政部口径将"及时谋划出台务实管用的增量政策"——9-10 月值得继续看。

- **🟥 CPI 同比 +0.5%**（前值 1.0%），核心 CPI +0.9%，汽油同比涨幅回落 16 个百分点
- **🟥 PPI 同比 +3.5%**（前值 4.1%），环比 -0.7%
- PMI 49.2%（前值 50.3%），落入收缩区间
- 1-7 月固投 -**6.7%**（前值 -5.7%），地产投资 -19.2%

- 7 月规上工业增加值 +4.5%，社零 +0.6%
- 1-7 月货物进出口 +17.3%，出口 +14.0%，进口 +22.0%
- 1-7 月规上工业 +5.3%，服务业生产指数 +4.7%
- 失业率 5.2%（环比 +0.2pct），16-24 岁青年 17.9%

**🟥 新动能亮眼**：
- 7 月数字产品制造业 +17.3%，智能无人飞行器 +15.1%
- 锂离子电池产量 **+58.8%**
- 7 月新能源乘用车零售渗透率 **65.1%**（连续 4 月 >60%）
- 1-7 月集成电路产量 2798 亿块，+23.1%；上半年集成电路出口美元口径 +96.1%

**财政 1-7 月数据**：全国财政收入 14.37 万亿元/+5.8%，税收 +6.7%，证券交易印花税 **+99.2%**；财政支出 16.29 万亿/+1.3%。[来源](https://new.qq.com/rain/a/20260822A0284700)

## 6. ✏️ 五、编辑后记

**今天 4 大主线：**
今天（8.25 周二）的中国政经科技图景，可以用 4 条主线概括：①**8.21 国常会+财政部"投资于人"+长存 IPO 受理**，政策端组合拳兑现，财政金融协同促内需 8.1 起升级（个人贴息 5000 元/企业贴息 7500 万元/经办机构 400 家）；②**存储超级周期**进入 Q3 加速阶段，DDR4 现货 +0.67%、大摩预计 Q3 涨价 50%、长鑫 Q1 利润 +1688%、长存 Q1 利润 333.79 亿/每天赚 3.7 亿；③**芯片国产替代**进入业绩兑现期，中芯 Q2 营收首破 30 亿美元/同比 +36%、华虹产能利用率 102.8%、国产 AI 芯片份额从 41% 跃升至 90%；④**手机行业"量减价升"**，Q2 全球出货 -6.7%~-11% 但 ASP +17% 至 400 美元、苹果 +15% / 华为 +20.9% 逆势增长、Counterpoint 预测全年 -13.9%。

**Mavis 独立判断：**
1. **存储的"中国价格"正在形成**——长鑫 Q1 利润超预期、苹果想砍价被长鑫拒绝、华为/小米通过长协锁定产能，国产存储已从"低价换市场"进入"掌握定价权"的新阶段。
2. **AI 芯片国产化从 41%→90% 不是预测是趋势**——NVIDIA 黄仁勋 5 月已承认中国大陆官方市场份额"清零"，H20 之后只有 RTX 6000D/RTX Pro 5000 等阉割特供版在打补丁。
3. **手机行业的"双速世界"已经定型**——苹果/华为靠品牌+提价能力获得超额收益，国产安卓被迫向中高端迁移，200 美元以下市场洗牌加速。

      const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
      document.getElementById('newsDate').textContent = `每日政经科技 · ${dateStr}（${weekdays[now.getDay()]}） · 编制 Mavis`;
    }

    function renderNews(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('newsContent').innerHTML = html;
      } catch (e) {
        document.getElementById('newsContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadNews() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
