**【🟥 头条】习近平就发展先进制造业作出重要指示 · 全国先进制造业大会在京召开**

- 李强讲话要点：以新一代智能制造为主攻方向，**纵深开展"人工智能+制造"行动**；加大对企业数智化转型引导支持力度；夯实智能软硬件基础。
- 张国清：实施重点产业链高质量发展行动，大力发展新一代智能制造，加快促进产业体系升级和融合发展。
- 工业和信息化部、国家发展改革委、国务院国资委、江苏、湖北作交流发言；吴政隆出席。
- [来源：新华社/枣庄市中区政府](http://www.zzszq.gov.cn/xw/ttxw/202609/t20260917_2330287.html)

**【🟥 重大】9.17 国常会研究推进全国统一大市场建设**

李强主持召开国务院常务会议，研究推进全国统一大市场建设有关工作，**审议通过《现代化应急体系建设"十五五"规划》**。前期 9.11 国常会已核准辽宁庄河一期等四个核电项目，部署**算力网建设**（推动算电协同、算网融合，加快绿电直连、源网荷储项目落地）。

- 此前 7.31 国常会：研究新型电网、物流网建设，**决定核准辽宁庄河一期等四个核电项目**。
- 7.20 国常会：审议通过《知识产权保护和运用"十五五"规划》。
- [来源：网易/临沧市政府](https://www.163.com/dy/article/L70RMR1N0552F81B.html)

工信部 9 月 7 日发布：到 2030 年信息通信行业收入 **4.1 万亿元**，累计投资 **3.8 万亿元**，电信业务总量年均增速 **7%**，智能算力规模 **9800 EFLOPS**，5G（含 5G-A）用户普及率 **95%**。

- 华为/苹果逆势上涨 20%+，**核心是"价格不动"**——其他厂商涨价，它们稳价。华为 5G 麒麟回归畅享系列（Enjoy 90 Pro Max / Mate 80 / nova 16）。
- Counterpoint：华为 Q2 份额 23%（2020 Q4 以来新高），出货 +24%；苹果 +23%。
- [来源：IDC](https://www.idc.com/page/7?from_search_result=true&hubs_post-cta=ver-caso-completo-de-siigo) | [新浪](https://sina.cn/news/detail/5320557014030788.html) | [Counterpoint](http://www.counterpointresearch.com/insights/china-smartphone-share)

**【🟥 全球 Q2 智能手机出货 · 13 年来最低】**

Counterpoint 全球数据：Q2 全球出货跌至 13 年最低；三星 20% / 苹果 19% 居前，小米 12% / OPPO 11% / vivo 8%。**Google Pixel 10/10a 驱动 Google +16%**，华为海外 +6%。

**【🟢 BOM 成本 · 存储涨价传导】**

- DDR5/HBM/LPDRAM 涨价已开始向下游传导。Counterpoint 预计中国手机厂商启动**第二轮涨价**。
- IDC 警告："智能手机出货量预计 Q3 环比下滑超 10%"。
- [来源：财联社 / 36kr](https://bingxzone.com/ur/news/post/jefferies-warns-memory-prices-will-surge-in-q-and-another-in-q-with-no-relief-until)

**Mavis 点评**：手机市场已经是"**赢家通吃 + 价格不动者吃肉**"格局——华为 + 苹果两家涨、其他家跌。原因是只有它们两家能在存储涨价潮中**选择不涨价**，把品牌价值变成定价权。小米 -21.7% 是最痛案例，**因为它最依赖低端机，而低端机对涨价最敏感**。判断 Q3-Q4 中国市场会进一步恶化，但华为 + 苹果仍然跑赢大盘。

- 美光：HBM4 36GB 12 层（2048 位接口），年底产能 15000 wafer/月。

- DDR5 16Gb 现货价较合约价高 **+16%**；DDR4 8Gb 现货高 **+43%**。

**Mavis 点评**：存储是当前**最确定 + 最猛烈的涨价主线**。Jefferies + 野村 + TrendForce 三家看涨的幅度差异极大（13% vs 40%），说明市场分歧巨大。**真正需要警惕的是"长协占比"问题**——美光 16 份长期协议 + 海力士/三星的 hyperscaler 长单，已经锁定了 ~50% 产能，**留给消费电子/手机的产能只会越来越少**。CXMT 产能瓶颈（35 万 wafer/月，不到 SK 海力士一半）+ 良率劣势（DDR5 50% vs 92%）短期**无法缓解全球紧缺**，反而因为优先保供国内而锁死了自己的涨价红利。

### 3.3 🔬 芯片

**【🟢 SMIC/华虹 Q3 指引 + 8 英寸 BCD 涨价】**

- SMIC 12.24 已通知客户 8 英寸 BCD 工艺代工涨价 **+10%**；世界先进迅速跟进同样 10%。
- Q3 SMIC 收入环比 +2-4%、毛利率 26-28%；华虹 7.7-7.8 亿$ / 毛利率 16-18%。
- 华虹 F9 厂 Q3 满产，新厂 Q4 试产、2027 满产；收购华力微（F5）已获证监会注册批复（增加 4 万片/月）。

**【🟠 MATCH 法案 · 美方收紧对荷/日施压】**

- 4.22 美众议院外交事务委员会 36:8 通过 MATCH 法案（Multilateral Alignment of Technology Controls on Hardware Act），要求 ASML、TEL 等盟国企业 150 天内采取与美国相同的对华限制。
- 法案要点：限制**深紫外浸没式 DUV 光刻机**对华出口；要求 ASML 等外企在华设施维修设备需许可。
- 美光全程参与起草 + 游说（CEO Sanjay Mehrotra 与委员会闭门圆桌）；SK 海力士、三星主导存储，美光第三。
- 后续：法案需众议院全院、参议院审议，可能纳入 NDAA 国防授权法案。
- [来源：四川省商务厅](https://swt.sc.gov.cn/sccom/c25030606/2026/5/11/14b3d48f02be4e3ba37bac957281207c.shtml) | [中华网](https://news.china.com/socialgd/10000169/20260409/49400059.html)

**【🟢 国产设备 / 材料 · 北方华创 / 中微 / 拓荆 / 盛美】**

- 中芯国际 Q2 资本开支 **18.36 亿美元**（Q1 为 15.63 亿）；华虹 Q2 CapEx 3.57 亿（其中 3.26 亿投 12 英寸）。
- 国内刻蚀（北方华创、中微）、沉积（拓荆）、清洗（盛美、芯源微）、CMP（华海清科）、量测（精测）持续扩产。
- 长江存储 / 长鑫存储扩产规划：CXMT 2027 目标 42 万 wafer/月（上海/北京新厂）。

**【🟠 H20 / H100 出口许可 · 暂无新数据】**

**Mavis 点评**：芯片这条线现在是**"国产替代 + AI 外溢"双引擎**。SMIC Q2 单季 30 亿$ 营收 + 36% 同比 + 261% 净利同比，说明 AI 配套需求（72 GPU 机柜就需要 1.6 万颗 BCD 电源管理芯片）已经让国产 8/12 英寸产能全面吃紧，**8 英寸 BCD 涨价 10% 只是开始**。MATCH 法案对 ASML/TEL 是政治施压而非立即生效，但中长期意味着国产设备要加速替代 DUV 浸没式 + 维修服务这条软肋。

## 4. 🏭 三、上下游产业链

### 4.1 原材料

**【🟡 硅片 / 稀土 / 镓 / 锗 / 光刻胶】**

- 沪硅产业 12 英寸硅片持续扩产，TCL 中环 12 英寸抛光片产能加速。
- 镓 / 锗 / 锑 / 石墨：自 2023.8 出口管制生效；2025 商务部对稀土 / 镓继续收紧。
- 光刻胶：南大光电、彤程新材、晶瑞电材持续突破 ArF / KrF 国产化。
- 有色：9.17 A股黄金股重挫（山东黄金、湖南黄金跌 5%+），白银、稀土同步下跌；铜、铝震荡。

**Mavis 点评**：原材料端 9 月无重大新数据，但**黄金/稀土回调是美元指数走强 + 风险偏好回升的双重信号**。光刻胶国产化是 2026-2027 国产替代的核心战场，南大光电 ArF 准分子激光光刻胶良率突破是关注节点。

### 4.2 设备 / 材料

**【🟢 半导体设备】**

- ASML 2026 在中国市场份额预计降至 **20%**（2024 年 41%，2025 年 33%）。
- 北方华创 / 中微 / 拓荆 / 芯源微 / 盛美 / 华海清科持续中标 SMIC、华虹、长江存储、长鑫存储项目。
- 国产化率：刻蚀 ~50%、CMP ~40%、清洗 ~60%、量测 ~30%、光刻 **<5%**。

**【🟢 半导体材料 · 江丰电子 / 安集科技 / 雅克科技 / 沪硅产业】**

- 江丰电子：超高纯靶材龙头，2026 铜靶/钽靶加速突破台积电、三星供应链。
- 安集科技：CMP 抛光液国内份额 ~30%，铜及铜阻挡层国产化加速。
- 雅克科技：前驱体材料国产替代加速，SK 海力士、长鑫订单持续。

**Mavis 点评**：设备 / 材料是 MATCH 法案背景下的**最强国产替代主线**。SMIC + 华虹 Q3 CapEx 持续提升（华虹 12 英寸线 CapEx 占 91%），意味着北方华创 / 中微 / 拓荆订单饱满。**光刻是唯一软肋，DUV 国产化（如上海微电子 28nm DUV）进展值得持续跟踪**。

### 4.3 制造 / 封测

**【🟢 SMIC / 华虹 / 长江存储 / 长鑫 · 见 3.3 节】**

- SMIC Q2 产能利用率 93.7%、销售晶圆 287 万片（折 8 英寸）+14.4% QoQ。
- 华虹产能利用率 102.8%（超满载），付运 153.8 万片 +17.9% YoY。

**【🟢 封测 · 通富微电 / 长电科技 / 华天科技】**

- 通富微电：AMD CPU/GPU 封装核心供应商，受益 MI300/MI400 拉动。
- 长电科技：先进封装（FoWLP / 2.5D / 3D）持续突破 HBM 配套。
- 华天科技：CIS / 指纹 / MCU 封装订单饱满。

**Mavis 点评**：制造 + 封测全线满产，**这是 2026 年最确定的盈利主线**。先进封装（特别是 HBM 配套）是下一个看点——长电 / 通富 2.5D 封装能力决定国产 AI 芯片能否真正跑通 HBM4 + Rubin 平台。

### 4.4 下游应用

**【🟠 PC / 平板 / 可穿戴】**

- IDC / Counterpoint 警告：PC 出货量预计 Q3 环比下滑 **超 10%**。
- PC 经销商反馈：内存 + SSD 涨价已传导，主流游戏本 1 万元 → 1.5-1.6 万元（+5000 元）。
- 硬盘"早上一个价、晚上一个价"——闪迪 1TB SSD 早上 820 元、当晚 860 元。

**【🟢 服务器 / 数据中心 / AI 算力】**

- AI 服务器需求持续：HBM4 + 服务器 DRAM + 服务器 SSD 三件套。
- 国内 CSP 资本开支加速：阿里、腾讯、字节、百度 Q3 招标密集。
- 北美四大 CSP（AWS/Azure/Google/Meta）2026 资本开支指引上调。

**【🟢 新能源车 / 工业控制 / IoT】**

- 8 月锂离子电池 +57.2%、工业机器人 +34.6% 持续高景气。
- 新能源车 8 月零售渗透率继续超 50%。

**【🔴 消费电子涨价潮传导】**

- 手机：第二轮涨价启动，OPPO / vivo / 荣耀 3 月已涨一波，9 月新机继续涨。
- PC：内存涨价 + SSD 涨价 + 整机涨价三件套传导。
- 国补 15% 政策对冲：京东 / 淘宝搜补贴口令领取（单件上限 500 元）。

**Mavis 点评**：消费电子涨价潮已经不可逆，**PC 整机涨幅 30-50%**、**手机整机涨幅 200-500 元**、**存储单品涨幅 50-80%**。但国补 15% + 国产存储（长鑫 17nm DDR5 良率 90%、长江存储 Xtacking 已入头部手机/PC 供应链）能给消费者兜底。**判断下半年消费电子出货会再下一个台阶，但 ASP 会显著抬升**——厂商收入端未必变差。

## 6. ✏️ 五、编辑后记

**今天 4 大主线**

1. **🟥 习近平定调先进制造业 + AI 制造**：9.16-17 全国先进制造业大会，叠加 9.17 国常会推进统一大市场、9.11 国常会部署算力网 + 核电核准。这是**顶层"算电协同"战略的全面落地**。
2. **🟥 8 月经济数据：外强内弱、工业强地产弱、供给强需求弱**：工业 +5.2%、装备 +12.1%、高技术 +16.7%、出口 +18.6%、锂电 +57.2%；但固投 -7.2%、地产 -19.9%、社零 +0.4%。**通讯器材零售 +27.3% 是消费亮点**。
3. **🟥 存储涨价持续到 2028**：Jefferies 警示 Q3 +40-50%，野村警告"严重短缺"，三星明确 DRAM/NAND 紧缺延续至 2028。HBM4 Q3 量产（SK/三星/美光三家齐发），**国内消费电子（PC、手机）将承受持续涨价压力**。
4. **🟢 SMIC + 华虹 Q2 双双爆表**：SMIC 单季 30 亿$ 营收 +36% 同比 +261% 净利同比；华虹 +26.8% 营收 +385.9% 净利同比。**国产成熟制程进入"产能天花板 + 涨价"双驱动**。

**Mavis 独立判断（5 条）**

- **存储涨价 Q3 不会缓和**：Jefferies + 野村 + 三星三家的核心共识是供应紧缺延续到 2028 年，CXMT 因良率劣势（DDR5 50% vs 三星 92%）短期无法提供增量。**判断 DRAM/NAND 价格 Q3 仍会创历史新高**，PC 和手机厂商第二轮涨价 Q4 集中体现。
