### 3.2 💾 存储

**🟥 TrendForce 4Q26 存储价格展望：DRAM +10~15%、NAND +15~20%**（9/30 报告）
- **DRAM 整体**：原厂将先进制程集中于 server DRAM 与 HBM，排挤 PC、smartphone 位元产出。
- **Server DRAM**：CSP 因 agentic AI 追加 RDIMM 采购；4Q26 供不应求延续，**部分卖方受 LTA 价格区间机制限缩涨幅**。
- **PC DRAM**：PC OEM 担忧 2027 供给紧张维持积极采购；2027 年 PC DRAM 供给可能进一步缩减。
- **Mobile DRAM**：原厂产能向 server 转移导致配额吃紧，涨势确立但涨幅收敛。
- **Graphics DRAM**：GDDR7 需求由 AI 芯片带动，GDDR6 重新获得评估采用。
- **Consumer DRAM**：QLC SSD 需求上修带动颗粒需求增加，价格上行但涨幅趋缓。

**🟥 NAND 全面分化：企业级 SSD 唯一加速**
- **Enterprise SSD**：4Q26 季增 **23-28%**（涨价加速），是 4Q26 唯一加速品类。
- 2026 年 Enterprise SSD 位元需求 YoY **+80%**（AI 推理 + Agentic AI 驱动）。
- 采购驱动从 LLM 训练转向实际 AI 部署，QLC 在 Vector Database 渗透同步提升。
- **Client SSD**：PC OEM 库存充足，调降主流机型 SSD 容量，涨势被抑制。
- **eMMC/UFS**：手机品牌厂以既有库存支撑，新增采购有限，谈判简化为最低量价格确认。
- **NAND Wafer**：达到历史高点，下游采购转趋保守，仅小幅上升。

## 6. ✏️ 五、编辑后记

### 6.1 4 大主线总论

**主线 1：政策"组合拳"集中落地，Q4 是"落地大月"**——9/28 国常会 + 9/29-30 央行调整完善 4 项工具 + 10/8 1.2 万亿买断式逆回购操作 + 财政部/央行/金管局居民购房贷款贴息 + 工信部新型电池"十五五"规划，**5+ 项政策工具在 10 天内集中释放**。这是 Q4 政策面对 A 股最确定的 alpha 源。

**主线 2：存储"超级周期"还在加速，4Q26 Enterprise SSD 季增 23-28%**——AI 推理 + Agentic AI 驱动下，CSP 持续加码 Enterprise SSD 部署；LTA 模式重塑行业（美光 16 份 SCA、闪迪 $939 亿保底价），估值锚从 5-6 倍提升到 8-10 倍。**长鑫 G5 + LPDDR6 首发标志国产存储进入第一梯队**，但 HBM 仍是 2-3 年后决战点。

**主线 3：AI 算力"软硬双自主"闭环形成**——华为 Peerium + 灵衢总线（25.6 万卡超节点）+ 昇腾中国份额超英伟达（50% vs 8%）+ DeepSeek 开源昇腾全套基础设施组件（TileLang）。英伟达地位受挑战但仍创新高（$5.7 万亿市值 + $1500 亿回购）——**全球 AI 算力"双轨制"格局 Q4 进一步清晰**。

**主线 4：A 股节后"开门绿"，科技硬件被获利了结**——10/8 沪指 -0.79%、深成 -2.07%、创业板 -3.15%、**科创 50 -4.82%**，半导体/通信设备/CPO/光芯片/存储芯片领跌。但 10/8 油价飙升 + 银行创历史新高（工行、中行、杭州银行）+ 电池板块 +3%+"（新型电池规划催化）说明资金在板块间快速轮动。**Q4 行情的关键词是"震荡 + 结构性"**。

### 6.2 Mavis 独立判断

**🟥 1. 国常会"组合拳"对 Q4 经济数据的托底效力被市场低估**——9/28-10/8 集中落地的 5+ 项政策工具合计资金量级约 **2-3 万亿元**（买断式逆回购 1.2 万亿 + 再贷款扩容 7000 亿 + 居民购房贴息不设上限 + 新型电池规划 2030 投资 + 央企战略性新兴产业 5pct 占比提升），对应 GDP 的边际拉动约 0.3-0.5pct。**10/19 国统局 9 月数据是验证窗口**——机构预期 9 月社零 +3.5% 左右、工业增加值 +5.5% 左右。

**🟥 2. 存储涨价是 2027 年消费电子最大"灰犀牛"**——千元机存储成本占 BOM 22% → 64% 这种跃迁，**2027 年 1500 元以下机型将集体消失**。iPhone 17 中国 -6%、印度 -10% 是先行指标。**手机产业链 Q4 选股逻辑：折叠屏 + 苹果供应链 + 高端化龙头（苹果、小米 MIX/数字旗舰、华为 Mate X7）> 中低端品牌**。
