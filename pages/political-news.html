## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**🟥 9 月 8 日 李强主持国务院第二十一次专题学习**（城市更新主线）

会议主题"高质量推进城市更新、促进城市内涵式发展"，李强明确：
- 建立**可持续**的城市更新模式，盘活改造的公共空间优先满足民生
- 加大政府投入，**统筹用好各类政策性资金**，强化财政金融协同
- 完善**城市更新基金**等金融工具，构建多元化可持续投融资体系
- 适时调整优化规划、用地、财税、金融等政策

配套政策已在路上：
- 5 月《城市更新"十五五"规划》印发，**10 项主要指标 + 23 项重点任务 + 14 项重大工程**
- "十五五"目标：改造危旧房 **50 万套**、老旧小区 **11.5 万个**、城中村 **4000 个**、地下管网 **36.5 万公里**
- 2026 年中央预算内投资城市更新专项 **970 亿元** + 超长期特别国债 **1600 亿元**（地下管网）
- 8 月底《城市更新项目贷款管理办法（试行）》《关于资本市场支持构建房地产发展新模式的意见》同日发布

**🟥 7 部门通知：扩大灵活就业人员医保参保**（9.8）

国家医保局等 7 部门发布通知，开展**灵活就业人员、农民工、新就业形态人员**参加基本医保提质专项行动。**3 年时间**持续提高参保人数，特别是参加职工医保人数。

**🟥 央行等量续作 5000 亿元买断式逆回购**（9.4 公告 / 9.7 操作）

3 个月期（89 天）买断式逆回购 5000 亿元，**等量续作**。东方金诚王青解读：年初资金面宽松，DR001 持续运行在 1.35% 附近，**低于 1.40% 政策利率**；央行 9.1 投放 50 亿元地量，9.2-9.4 投放量均为 0。

**王青预告**：宏观政策将向稳增长方向进一步发力，**加快政府债券发行、加快推进 8000 亿元新型政策性金融工具投放**——意味着 9 月买断式逆回购、MLF 整体有望加量续作，**不排除央行降准**。

**🟥 中长期资金部署：乡村振兴 6 渠道投入**

农业农村部等 6 部门 9.7 印发《坚持农业农村优先发展、完善乡村振兴投入机制实施方案》，到 2030 年建立与农业农村发展水平相适应的多元投入机制。2025 年全国农林水财政支出 2.35 万亿元、涉农贷款 53.57 万亿元、农业保险保费 **1550 亿元**全球第一。

**Mavis 点评**：城市更新成为这一轮稳增长的"主轴"——970 亿专项 + 1600 亿国债 + 8000 亿政策性金融工具，加总超过 **1 万亿级**的"准财政"资金。**Mavis 观点**：这一轮和 2015 年棚改货币化不同，更强调"民生优先+可持续"，资金结构上政策性金融工具占比提升、商业贷款谨慎，**对建材/管网/REITs 是利好，但别期待"涨价去库存"重现**。

## 6. ✏️ 五、编辑后记

**总论：4 大主线**

今天是 2026 年 9 月 9 日（周二），市场在等待 9:30 即将公布的 8 月 CPI/PPI 数据。今天的政经科技图景可以概括为 4 大主线：

1. **🟢 城市更新成为稳增长"新主轴"**——国务院专题学习定调 970 亿专项 + 1600 亿国债 + 8000 亿政策性金融工具 + 城市更新基金。区别于 2015 年棚改，本轮更强调"民生优先 + 可持续"，预计对建材/管网/REITs 形成持续利好。

2. **🔴 存储"超级周期"进入分化期**——HBM/AI 服务器存储锁死 2027 年，但消费级 NAND/DRAM 在 Q4 见到情绪拐点的概率上升。江波龙 4.48 亿元回购 + 净利预增 6 万倍，是国内"涨价 + 国产替代"双逻辑兑现的标志性信号。

3. **🟢 国产算力"业绩兑现期"**——上半年寒武纪 +108%、中际旭创 +241%、海光 +66%、通富 +317%，**电子行业 H1 净利 +195% 居所有行业之首**。DeepSeek V4 适配 8 家国产 GPU + 玄戒 O3 + LPDDR6 首发，国产替代从"概念"进入"规模量产"。

4. **🟡 手机行业"涨价 + 减配"非常态周期**——Q2 全球出货 -7.4%，但 ASP +27.6%。三星 + 苹果合计份额升至 42.9%（创历史新高），国产品牌全面承压。Q3 中国市场出货降幅 IDC 预测扩大至 20%。

**5 条 Mavis 独立判断**

1. **今天 9:30 的 8 月 CPI/PPI 是关键验证窗口**——MNI 报道实际 CPI -0.4%（低于市场预期 -0.2%），PPI -2.9%（连续 35 个月负值），但环比改善。如果数据弱于预期，央行 9 月降准或降息概率上升；反之，政策保持"等量续作"现状。

2. **手机行业真正的赢家是存储 + 国产替代，而不是"涨价转嫁"**——Counterpoint 数据：Q2 全球 200 美元以下手机 BOM +70% 全来自存储，意味着手机厂能把涨价全部转嫁给消费者是假象。**真正的赢家是上游（长鑫/江波龙）和国产 SoC（华为/小米玄戒/紫光展锐）**。

3. **国产 DUV 进展不该过度乐观**——宇量昇 2026 目标 12 台 vs ASML 2026 浸没式 DUV 出货 130 台，**差距 11 倍**。光刻机涉及 10 万+ 零件，光学+光源占整机价值 50%，蔡司仍卡脖子。**Mavis 观点**：国产 DUV 是"长周期高壁垒"赛道，价值兑现需 5-10 年，**Q3 资金博弈大于基本面**。

4. **存储涨价 Q4 见顶概率上升**——摩根士丹利预测 2026 Q4 内存合约价见顶，盈利上调率从 92% 峰值回落至 77%。**关键信号**：高盛研报指出"手机存储需求受到库存上升拖累"、闪德周评报道"高价之下渠道采购已从此前的'抢货'转向谨慎观望"。机装党 9-10 月是窗口。

5. **9 月市场主线：政策加码 + 中报兑现 + 美联储降息预期**——8 月非农偏弱（-2.3 万）打开美联储 9 月降息空间，国内 8000 亿政策性金融工具 + 城市更新基金是 Q4 主要增量资金。**关注 9 月下旬美联储议息会议 + 国内 8 月社融**两个关键节点。
