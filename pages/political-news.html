## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**核心事件：9.28 国务院常务会议 + 9.29 央行工具箱"四箭齐发" + 9.26 中央政治局会议**

- 🟥 **央行四箭齐发（9.29）**：下调 PSL 利率 **0.25 个百分点**（从 1.75% → 1.50%），将"六张网"建设纳入 PSL 支持领域，科技创新和技术改造再贷款 **提额 2000 亿元 + 提比例**，支农支小再贷款额度增加 **5000 亿元**（其中 3000 亿元定向支持民企）。四项措施预计引导 **超万亿元低成本资金** 流入实体。[来源](https://news.qq.com/rain/a/20260930A01R2500)
- 🟥 **国常会（9.28）**：李强主持研究宏观政策"发力提效"+ 促进有效投资。明确**加力推出增量政策**，优化财政支出安排，用好地方政府债务结存限额，综合运用并适时调整货币政策工具，**研究出台稳定房地产市场、促进就业增收**等政策。[来源](https://www.gov.cn/zhengce/202609/content_7082316.htm)
- 🟥 **居民购房贷款贴息（10.1 实施）**：财政部、央行、金融监管总局联合发文，对符合条件的房贷实施 **1 个百分点**贴息（最高贴息贷款 100 万元、最长 5 年）。条件：首套住房 + 建筑面积 ≤120 平方米 + 价格 ≤150 万元。100 万元 30 年期房贷累计可减息近 **5 万元**。[来源](https://news.qq.com/rain/a/20260930A01R2500)
- 🟥 **以旧换新第四批 625 亿元超长期特别国债下达**：发改委 + 财政部全年累计安排 **2500 亿元**支持消费品以旧换新。[来源](https://english.www.gov.cn/archive/statistics/202609/30/content_WS6abcc14ac6d00ca5f9a0d8af.html)
- 中办、国办印发《文化遗产保护传承"十五五"规划》，实施"中国营造"重点计划。
- 四部门联合印发《关于促进城市公交企业深化改革的指导意见》。
- 中央政治局（9.26）：更大力度推动"两重""两新"，加快专项债、超长期特别国债发行进度。
- 公安部公布 8 起新型涉黑恶犯罪典型案例。

**Mavis 点评**：**🟢** 这一周是"政策密集落地周"——国常会、央行工具箱、房贷贴息三件事在 48 小时内连续推出，规格明显高于 9 月初。PSL 降息 25bp 是 2026 年首次，信号意义比量级更重要——央行已经把"逆周期"提上前台。下周关注 10 月 LPR 是否跟随下调，以及房地产税、户籍改革等"研究出台"政策能否落地。

### 2.2 🟠 经济面 E

**核心数据：9 月 PMI 50.1 + 三季度 GDP 4.3% + 进出口 25%**

- 🟥 **9 月制造业 PMI 50.1**（环比 +0.3），时隔两个月重返扩张区间；非制造业 PMI 50.2（+1.2），建筑业 PMI 50.3（+3.4，年内高点）；综合 PMI 50.7（+1.2）。[来源](https://www.stats.gov.cn/sj/zxfbhjd/202609/t20260930_1965450.html)
- 🟥 **三季度实际 GDP 同比 4.3%**，低于 4.5% 年初目标，低于彭博 4.5% 一致预期。[来源](https://www.airnews.in/articles/17a6bcd7ef-china-q3-gdp-4-3-misses-4-5-target-stimulus-to-follow)
- 三季度出口同比 +25%，PPI +4.5%、CPI +1.1%，社融增速 +7.1%（企稳）。[来源](https://www.cfi.net.cn/p20260928001906.html)
- 8 月规模以上工业增加值 +5.2%（环比 +0.7 个百分点）；8 月社零 +0.4%（环比 -0.2）；1-8 月固投同比 -7.2%（降幅扩大 0.5pct）。
- 1-8 月民间投资 -10.1%（扣除房地产开发后 -6.4%）。
- 增值税留抵退税新政实施一年来全国累计办理 **2818 亿元**，制造、科研、软件、生态 4 个重点行业受益 2120 亿元。
- 第二轮土地承包到期后再延长 30 年试点在 29 个省份开展整省试点，**3000 多万农户**已顺利签订延包合同。
- 8 月国际收支货物和服务贸易进出口 **51179 亿元**。
- 国家外管局：6 月末全口径外债余额 **24982 亿美元**（较 3 月末 +861 亿美元，+4%）。

**Mavis 点评**：**🟡** 9 月 PMI 反弹"勉强够 50"，但拆分看——产需、价格指数改善靠 AI 算力+出口拉动，制造业新订单 50.5 比 8 月还略降，地产和资本市场服务 PMI 仍低于临界点。三季度 GDP 4.3% **未达 4.5% 目标**是事实，但 Bloomberg 中国开发商指数当日 +4.2%，说明市场已经 price-in "增量刺激"预期。10 月关键看 Q4 财政发力节奏+地产销售是否边际企稳。

- **国庆假期北京 8 条地铁线路延时**至次日凌晨 2:00，覆盖北京站、北京西、北京南、朝阳、丰台、大兴机场。
- **生成式 AI 用户规模突破 7 亿人**，普及率超 **50.0%**（《生成式人工智能应用发展报告（2026）》）。
- 第三十三届中国电视金鹰奖颁奖：杨紫、胡歌主演《生命树》获最佳电视剧奖。
- 中央生态环境保护督察组向辽宁、吉林、黑龙江、广东、广西、西藏、新疆 7 省（区）和兵团反馈督察情况。
- **9000 万人领到 2 万元养老金**：人社部把城乡居民基础养老金最低标准从 143 元提至 **163 元**，覆盖约 1.8 亿人（农村老人占 70%+）。中央财政安排 **1.25 万亿元** 基本养老保险转移支付兜底。
- **中国银发人群 / 65 岁+ 人群**：参保 10.76 亿人，领取养老金人数 **3.4 亿**；企业退休人均月养老金约 3640 元、机关事业单位 5870-8136 元，城乡居民月均 **246 元**。
- 公安部公布 8 起新型涉黑恶犯罪典型案例，深化扫黑除恶。

**Mavis 点评**：**🟡** 社保贴息 + 出行回暖 + AI 用户破 7 亿是今天三大民生亮点。贴息最大意义不是"省 5 万利息"，而是给市场一个"中央财政下场托底房地产"的明确信号——中央对地方土地财政承压的容忍度已经触底。但企退/事退/城乡居民三套体系待遇差 14.6 倍长期不解决，"十五五"期间财政转移支付必须加码。

- 寒武纪加入 PyTorch 基金会最高级别（白金成员）。

**Mavis 点评**：**🟢** 国产算力的"系统级放量"已经成形——从单卡竞争转向万卡集群、超节点技术、能效优化。DeepSeek 把 16 万张昇腾 950DT 部署在内蒙古智选数据中心，是迄今国产算力替代英伟达的最强信号。但海外路径的 HBF（高带宽闪存）2027 年可能商业化，未来 HBM 路线可能与 HBF 形成"HBM 高速缓存 + HBF 海量上下文"的混合层级，国产厂商要提前布局。

### 3.1 📱 手机

**核心：Q2 全球出货 -11% YoY，存储涨价吞噬中低端，Q3 中国国产首次 3 家进前五**

- 🟥 **Omdia Q2 2026 数据**：全球智能手机出货 **2.775 亿部**（-6.7% YoY），市场连续 6 个季度下滑。Samsung 6050 万部 / 22% 份额（+5% YoY）、Apple 5510 万部 / 20% 份额（最强 Q2 业绩）、Xiaomi 3120 万部（-26% YoY，**受害最大**）、vivo 2150 万部（-18% YoY）。[来源](https://syntho.net/?live-blog-20932160-2026-08-09)
- 🟥 **Gartner 数据**：2026 年 DRAM + SSD 综合涨幅将达 **130%**，传导至终端价格：PC 涨 17%、**手机涨 13%**，全球 PC 出货 -10.4%、**手机出货 -8.4%**。入门级买家退出速度是高端买家的 **5 倍**。[来源](https://daily8news.com/zh/article/memory-chip-prices-dram-nand-ai-demand-20260925-zh)
- **Gartner Q3 2026 中国大陆**：Huawei/Xiaomi/Lenovo 三家进全球前五，合计份额 **15.5%**（+4.1pct YoY）。Xiaomi **Q3 +336% YoY**（首次进入前五）。[来源](https://www.fxbwd.com/137627.html)

- **存储成本占比**：BOM 中低端机 **>60%**，高端机 **>30%**。

**Mavis 点评**：**🔴** Q2 全球 -6.7%、Q3 中国国产首次 3 家进前五，这种"总量下降 + 国产逆袭"的结构反映两件事：① 国产替代进入收官期，存量蛋糕在往国产手里集中；② 入门级退出率是高端的 5 倍，说明存储涨价已实质性地把全球手机用户的购买决策推迟 1-2 年。短期对 Q4 出货量持悲观，但 **ASP 上行 + 利润率保护**是龙头厂商的应对主线。

### 3.2 💾 存储

**核心：Q3 创新高 + Q4 涨幅扩大 + HBM 占 30% DRAM 产能**

- 🟥 **TrendForce 9.30 报告**：2026 Q4 一般型 DRAM 合约价 **季增 10-15%**，NAND Flash 合约价 **季增 15-20%**。**企业级 SSD 是唯一涨幅扩大的产品**——AI 推理基础设施驱动位元需求 **年增 >80%**。[来源](https://www.dramexchange.com/WeeklyResearch/PrinterFriendly/2/12852.html)
- 🟥 **9 月合约价**：PC DRAM DDR4 8Gb $26（**+4.0% MoM，创历史新高**），128Gb MLC NAND $30.6（+0.4%，**连续 21 个月上涨**）。TrendForce 上修 PC DRAM Q4 涨幅至 **13-18%**（原 3-8%）。[来源](https://finance.biggo.com/news/238c810f-a8d9-4378-9fe1-588b63d8f9a5)
- 🟥 **HBM 产能占比**：三星预估 2027 年 HBM 占全球 DRAM 产能 **近 30%**（vs 当前 20%）。但位元占比仅 13%（HBM 制造占用的 wafer 多）。TrendForce 预测 HBM ASP 2027 同比 **+121%**。[来源](https://www.chosun.com/english/industry-en/2026/09/30/RXC7ZU3LPNGOLD4BW33NQHCB3I)
- **SK Hynix vs Samsung HBM4 战况**：Q1 SK Hynix 58% → Q2 50%，Samsung 21% → **33%**。UBS 预测 Samsung 2027 年 HBM bit 出货份额 41%，SK Hynix 39%。
- **Micron**：HBM 月产能从 4-5 万片扩到 **10 万片**（2026 年底），HBM4 出货 2026Q1 占 20-30%、年底占 50%；累计 HBM4 出货收入已 >10 亿美元。
- **长鑫科技（CXMT）**：HBM 全球份额仍较小，向华为交付 16nm HBM3 样品，2026 年内量产；DRAM 全球份额已升至 8%（全球第四）。[来源](https://baike.baidu.com/item/HBM)
- **OpenAI 与三星、SK Hynix 协议**：每月采购 90 万片 HBM wafer 用于"星际之门"数据中心。

**Mavis 点评**：**🔴** Q4 涨幅扩大已成定局——企业级 SSD 是 AI 推理爆发的唯一加速赛道，PC DRAM 涨价是被动跟随。本轮结构性涨价至少持续到 2027H1（宇瞻 CEO 张明端：2027 年全球传统 DRAM 供应量可能同比 -70%）。国产 CXMT 在通用 DRAM 已站稳第四，但在 HBM 仍落后三星/SK 海力士 **3-4 年**，短期内不会冲击 HBM 主流市场。下周关注：长鑫存储 IPO 后是否有 HBM3 量产时点的官方表态。

## 6. ✏️ 五、编辑后记
