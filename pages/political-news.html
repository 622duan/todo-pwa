## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**【头条】9.18 国务院常务会议**（新华社 9.18）李强主持，部署四项重点：

1. **银发经济**：健全多层次多支柱养老保险体系，扩大普惠养老；培育**银发消费新场景**，实现"民生福祉与内需扩容双向促进"。
2. **体育赛事**：增加高质量供给，竞技/职业/群众赛事统筹；推动"赛事+文旅+商务"融合。
3. **医疗康复护理扩容**：基层为重点；动态调整康复医疗、长期照护服务项目目录；深化价格改革；明确"十五五"每万人口康复医师/治疗师 **0.7/1.6 人**目标。
4. **《中医药传统知识保护条例》** 审议通过；原则通过突发事件应对法等 **15 部法律**修正案。

> 来源：[国务院](https://www.gov.cn/yaowen/liebiao/202609/content_7081464.htm)、[新闻联播 9.18](http://mrxwlb.com/2026/09/18/2026年09月18日新闻联播文字版)

**9.20 公积金条例大修落地**（倒计时）：提取情形 6→9 项，新增装修/物业费/国务院批准其他；个体工商户/灵活就业/非全日制**可自愿缴存**（覆盖 2 亿+灵活就业人群）；贷款审批 15→10 日；3 年内禁提 / 5 年内禁贷 + 信用入全国平台。

**国家电网"十五五"营商环境十举措**（人民日报 9.18、央视新闻联播）：160kW 及以下民营经济全面低压供电；"十五五"完成县域电网薄弱区域主干网架升级；2030 年农网户均停电时间较 2025 年下降 **30%+**；新建小区固定车位 **100% 配建**私人充电设施或预留。

**国新办 9.18 住建部发布会**：5 年新开工改造 11.5 万个老旧小区，更新加装电梯 **57.5 万台**，改造 1500 个老旧街区厂区；新认定历史文化街区 100 片+、历史建筑 1 万处+。

**第 140 届广交会 10.15-11.4 广州**：3.2 万家参展，专精特新+单项冠军 1.1 万家+（34%），64% 应用工业互联网/AI，新产品 23.2%、绿色产品 26%，首次推 22 个智慧场景+16 项 AI 应用。已超 **21 万境外采购商**预登记。

**Mavis 点评**：本周是"十五五"开局密集落地的第三周——周一中央城市工作会议、周二算力网国常会、周三国常会银发+康复扩容，再叠加 9.20 公积金条例大修，**政策密度+结构性"投资于人"** 双线清晰。值得关注的是 11.5 万老旧小区+57.5 万台电梯+1500 个街区改造，对家电/装修/物业/电梯产业链拉动可能超过 5 万亿元。

### 2.2 🟠 经济面 E

**8 月经济数据总览**（国家统计局 9.15）：

| 指标 | 8 月 | 1-8 月累计 | 解读 |
|------|------|-----------|------|
| 🟥 **规上工业增加值** | **+5.2%** YoY（环比+0.7pct） | +5.3% | 制造业 +6.1%，装备 +12.1%，**高技术制造业 +16.7%** |
| 社零总额 | **+0.4%** YoY（环比 -0.13%） | +1.1% | 通讯器材 **+27.3%** |
| 1-8 月固定资产投资 | — | **-7.2%** YoY | 房地产开发 -19.9%，民间投资 -10.1% |
| 进出口 | +19.8% YoY | +17.6% | 出口 +14.6%，进口 **+22.0%** |
| 失业率 | **5.3%**（环比+0.1pct） | 5.2% 平均 | 31 大城市 5.3% |
| CPI | **+0.8%** YoY，+0.4% MoM | +0.9% | 核心 CPI +1.0% |
| PPI | **+3.8%** YoY，+0.4% MoM | +2.0% | 连续 6 个月同比上涨 |
| 🔥 **1-8 月集成电路出口** | — | **+95.4%** | 高技术产品 +37.1% |

**8 月 PPI 涨价结构**（国统局 9.9 解读）：
- 上游：煤炭开采 **+26.6%**、有色冶炼 **+20.8%**、油气开采 +10.5%
- 制造业：电气机械 +5.9%、**计算机通信和其他电子设备 +5.3%**
- 新质生产力：电子电路制造 **+3.5%**、VR 设备 +1.9%、服务消费机器人 +0.3%

**8 月 CPI 结构**：黄金饰品 **+33.6%**（涨幅扩 9pct）、**平板电脑 +21.5%**、**计算机 +19.6%**、**移动电话机 +11.0%**——**算力驱动消费电子涨价**已直接传导 CPI。

**锂离子电池产量 +57.2%、工业机器人 +34.6%、3D 打印设备 +29.9%**——8 月规上工业三大爆款产品。

**Mavis 点评**：8 月是"内强外热"的经典月份——内贸偏弱（社零+0.4%、固投-7.2%），外贸爆表（进出口+19.8%、集成电路出口+95.4%）。投资端，制造业投资 -2.3%，但**信息服务业投资 +22.7%**、电子通信设备制造投资 +6.9%——钱没有消失，是在转向"新质生产力"赛道。9 月数据最关键的看点是消费电子涨价向 CPI 的进一步传导，以及政策端 9.20 公积金条例落地后地产销售能否企稳。

### 2.3 🟣 社会面 S

- **就业**：8 月城镇调查失业率 **5.3%**（环比+0.1pct），外来农业户籍劳动力 5.0%，31 大城市 5.3%；周均工作 48.2 小时。1-8 月平均 5.2%，与上年同期持平。
- **消费分层**：1-8 月**服务零售 +4.9%**（快于商品零售 +1.0%）；通讯信息服务/旅游租赁服务/文体休闲类零售增速 10%+；可穿戴智能设备 25%+、高能效家电 25%+；网上商品和服务零售 +4.6%（增速比总销售快 2.1pct）。
- **乡村振兴**：乡村社零 +2.3%，比城镇高 1.3pct。
- **创新药出海加速**：9.1 先声再明与罗氏达 **$15.3 亿**三抗（CD79a/CD19/CD3）授权；9.6 和黄医药 KRAS-EGFR ATTC 与 GSK 达 **$12.95 亿**（首付款 1.1 亿+里程碑 11.85 亿+销售分成）；1-8 月创新药出海 BD 总额 **突破 1200 亿美元，同比 +36%**。
- **民生新规**：9.20 公积金条例大修；广东珠海 1-9 月获批 3 款 1 类创新药（占全省 37.5% 居首）；国家电网"十五五"农网停电时间降 30%+。

**Mavis 点评**：失业率 5.3% 看起来稳，但结构里有个细节值得注意——**外来农业户籍 5.0% < 本地户籍 5.3%**，意味着城市本地就业承压更大、农民工反而好找工作。这种结构性现象在 2026 年消费电子/AI 算力相关制造业大扩产的背景下可以解释——产线工人需求旺；同时也是 9.20 公积金条例允许灵活就业自愿缴存的现实基础。

### 2.4 🔴 技术面 T

- **AI 芯片国产化**：DeepSeek-V4 预览版 4 月首发，**首次把华为昇腾与英伟达并列写入硬件验证清单**；思元 690（双 die、196GB HBM3、FP16 **700 TFLOPS**）已量产；昇腾 950PR 量产交付，**1.6TB/s 吞吐**，对标 H20 单卡算力 2.87×。寒武纪 2026H1 营收 **59.96 亿 +108%**、净利 **23.11 亿 +123%**。
- **华为韬定律**：通过逻辑折叠大幅提升芯片性能，依赖 2.5D/3D 集成、混合键合、TSV、Chiplet 等先进封装。
- **PCB/覆铜板涨价**：AI PCB 行业市场规模 2024 年 60 亿美元 → 2029 年 **150 亿美元**（沙利文，CAGR **20.1%**）；松下 MEGTRON M6→M9 高速材料持续升级；覆铜板/PCB 厂商密集涨价。
- **半导体设备**：SK 海力士关键零部件交期延长**一倍以上**；美光高管预计内存新增供应要到 **2028 年**才开始爬坡。
- **算力规模**：2024 年中国智能算力规模 725.3 EFLOPS，2028 年 **2781.9 EFLOPS**（IDC，CAGR 46.2%）；2028 年中国 AI 服务器市场 552 亿美元（CAGR 30.6%）。

**Mavis 点评**：技术面最值得关注的是**"国模+国芯"双闭环**——DeepSeek-V4 推理价格仅英伟达方案的 1/4，但 Day0 适配多颗国产芯片；昇腾 950PR 对标 H20 的 2.87 倍单卡算力，价格只为 1/4。这两条信号叠在一起，意味着国产 AI 算力替代从"可用"跨过"好用"门槛。**存储涨价是必然的副产品**——1 片 HBM 占 3 片 DDR5 晶圆产能，AI 需求越猛，存储越涨，这是 2026-2027 年的强逻辑。

## 4. 🏭 三、上下游产业链

### 4.1 原材料

- **硅片**：沪硅产业 12 英寸国产化持续突破，受 AI + 存储扩产拉动。
- **稀土/镓/锗/光刻胶/电子特气**：出口管制延续；江丰电子、安集科技、雅克科技核心标的。
- **有色**：8 月有色冶炼 **+20.8%**、有色矿采选 +21.1%；铜/铝/锡维持高位震荡。

### 4.2 设备 / 材料

- **交期**：SK 海力士关键零部件交期延长 1 倍以上（9.17）；美光预计新增供应 2028 年才爬坡。
- **国产设备**：北方华创、中微公司、拓荆科技、芯源微、盛美上海、华峰测控 9.18 涨幅 14.36%——市场押注"美光+SK 海力士产能扩张 → 国产设备订单增"。
- **国内替代**：AMEC 中微刻蚀机进入台积电 5nm 验证阶段；盛美清洗机进入 SK 海力士 HBM 产线。

### 4.3 制造 / 封测

- **晶圆代工**：Q3 指引乐观（详见 3.3）；SMIC 中国区营收占比 90.2%；华虹 Q2 产能利用率 **102.8%** 满产。
- **先进封装**：华为韬定律带火 Chiplet/2.5D-3D 集成概念；长电科技、华天科技、通富微电 9.18 华天科技涨停。
- **存储制造**：长鑫合肥+北京 12 寸厂月产能 **28-30 万片**（满产），2026 年底 35 万片；HBM3 已送样，计划 2026 年底小规模试产。

### 4.4 下游应用

- **PC/平板**：涨价已传导 CPI（平板 +21.5%、计算机 +19.6%）；联想/戴尔/惠普已采用长鑫颗粒。
- **服务器/数据中心**：CPU:GPU 配比从 1:4-1:8 转向接近 1:1（AMD 苏姿丰）；2028 年中国 AI 服务器市场 552 亿美元；DRAM 占服务器整机成本从 2023 ~50% 升至 2026 年中 **60-90%** 🟥。
- **新能源车**：8 月规上工业制造业 +6.1%，汽车制造业 PPI -1.7%（价格下拉）。
- **工业控制/物联网**：华虹 Q2 工业与汽车芯片业务收入占比 16.5%（环比 +2.5pct）。
- **消费电子涨价潮传导**：手机/平板/电脑已在 7-9 月兑现集体涨价。

**Mavis 点评**：上下游产业链最大变化是**"上下游上热下冷"正在收敛**——8 月 PPI 生活资料 -0.5%，但耐用品价格环比 +0.6%（2022.11 以来最大环比涨幅），说明成本压力正在向消费端传导。9-10 月消费电子将进入新一轮调价窗口，**手机/PC BOM 成本中存储占比已升至 30%+**，这一波集体涨价不是结束，是开始。

    function renderNews(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('newsContent').innerHTML = html;
      } catch (e) {
        document.getElementById('newsContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadNews() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-political-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
