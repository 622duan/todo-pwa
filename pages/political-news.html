- **🟥 新动能"六成贡献"**：8 月规上高技术制造业 +16.7%、数字产品制造业 +15.7%，新动能对规上工业增长贡献率**超 60%**；1-8 月装备制造业 +12.1%，锂离子电池、工业机器人、3D 打印产品产量分别 **+57.2%、+34.6%、+29.9%**。

- **🟥 Counterpoint 中国智能手机 2026 前 30 周累计销量同比 -8.6%**：618 后 W26-W30 同比跌幅分别**+11%、+13%、+16%、+14%、+16%**；8 月 5 日余承东公开表示"内存高昂涨价，所有的手机之后可能都要大规模涨价"。([Counterpoint via IT 之家](https://m.bricksite.com/kjdata/nyhedsbrev?live-blog-21664516-2026-08-14-it-zhi-jia-8-yue-14-ri-xiao-xi-counterpoint-shu-ju-xian-shi-2026-nian-qian-30-zh))
- **品牌结构**：自 Q2 以来，华为周销量份额**一直保持 20%+**（Counterpoint），Q2 出货量同比 **+24%、份额 23%**（2020Q4 以来新高），主要靠畅享 90 Pro Max + Pura X Max 高端折叠屏；**苹果 Q2 中国市场 +23%**，但进入 7 月后随渠道恢复常规定价进入季节性淡季。
- **小米第 30 周份额升至国内第二**：得益于 REDMI Note 17 系列（7.14 发布）。但 8 月启动**第二轮涨价**，小米 17、REDMI K90、Turbo 5 系列涨价 **300-500 元**，下半年销量压力增大。Counterpoint 指出 5 月安卓旧款平均涨幅已达 **13%**。
- **OPPO/vivo 暑期旺季不旺**：成本上涨限制促销空间。**OPPO 二季度份额 16.2%（含一加、realme），vivo 15.6%（含 iQOO）**。OPPO RENO16 系列 + A7 Pro Max、vivo S60 + X Fold6 等中端新品补量。
- **全球 Q2 品牌排名**（IDC + Counterpoint）：三星 **22.6-24%**（Galaxy S26 系列重夺第一）、苹果 20-20.1%（iPhone 17 持续热销）、小米 11-12%、OPPO 10-11%、vivo 7.6-8%、传音非洲领先（年度出货 ~1.02 亿台）。全年预期三星 2.59 亿、苹果 2.41 亿、小米 1.51 亿。
- **高端市场（600 美元以上）占比创新高**，苹果+三星垄断高端 84%；2026 年全球智能手机出货量预计同比 **-14% 至 10.8 亿部**。
- **🟥 涨价+减配同步进行**：**Google Pixel 11 Pro 标配 RAM 由 16GB 降至 12GB**（$100 加价）、**vivo iQOO Z11i 采用上一代 LPDDR4X 而非 LPDDR5X**、**Samsung Galaxy Book6 重推 8GB RAM 版本**。

**Mavis 点评**：手机行业正在经历"功能机级冲击"——Intel Lip-Bu Tan（9.15 AI Infrastructure Summit）说内存可能吃掉入门手机/笔记本 BOM **80%**，迫使厂商被动减配或涨价。OPPO、vivo、小米下半年同时被"成本涨 + 高端被华为苹果夹击"，**真正赢家只有华为和苹果**。中长期看，存储涨价周期的尽头是国产存储的反扑点。

### 3.2 💾 存储

- **🟥 TrendForce 2026Q3 合约价**：传统 DRAM 环比 **+13%-18%**，NAND **+10%-15%**（涨幅较前几季明显收敛）。SK 海力士 Q2 DRAM ASP 实际 **+30%**、NAND **+50%-55%**；Q3 涨价主要由 DDR4 + SLC/MLC NAND + NOR Flash 等**利基产品**领涨。([搜狐](https://www.sohu.com/a/1077838562_123007321))
- **🟥 现货价爆表**：memoryindex.io 9.21 数据——
  - DDR5 16Gb（2Gx8 4800/5600）spot **$56.23**（+480% YoY，+5.94% MoM）
  - DDR4 8Gb（1Gx8 3200）spot **$46.12**（+860% YoY，+7.93% MoM）
  - DDR4 16Gb spot **$85.99**（+690% YoY，+7.17% MoM）
  - HBM3E 36GB 12-Hi Stack **$2,108/stack**（+14% YoY）
  - DDR5 RDIMM 64GB 模拟价 **$1,881/根**（+455% YoY）
  - 零售 32GB DDR5 kit **$459.83**（+230% YoY，+15.7% MoM）
- **🟥 Intel CEO Lip-Bu Tan 9.15 表态**：存储价格已涨**5-7 倍**，可吃掉入门手机/笔记本 BOM 最多 **80%**；问三家存储巨头得到的答案是**"2028 前无缓解"**。Intel 自身也只能满足约 **50%** 的核心处理器客户需求；10.5 计划再涨 PC 处理器价格 **~10%**。
- **🟥 Micron 财报**：F3 毛利率 **84.9%**，DRAM 价涨至 +60% 区间、NAND 涨至 +80% 区间；股票 YTD **+247.61%** 至 $991.49（年内 SK 海力士 ADS $183.70，AMD 创历史新高）。
- **🟥 HBM 虹吸**：到 2026 年底，存储厂约 **22% 的 DRAM 晶圆投入用于生产 HBM，却只贡献约 9% 的存储位元产出**。SEMI 数据：2026 HBM 市场 +58% 至 **546 亿美元**（占 DRAM 近 4 成），三大厂约 70% 新增产能倾斜 HBM，缺口仍达 **50%-60%**。
- **🟥 Kioxia 主动停涨 NAND**：CEO Hiroo Ota 9.17 接受 Bloomberg 采访，表示"过度涨价会压制数据中心客户投资能力"——这是史上第一次由供应商主动设价格天花板；Q2 NAND ASP +70%，但已"卷不动"了。
- **人才争夺战**：美光在韩国招 HBM 设计工程师，SanDisk 在首尔招 NAND 系统架构 + SSD 固件，三星加薪 + 1.777M 股票（市值 3706 亿韩元）留人才至 2028；集中战场 = **HBM + 企业级 SSD**。
- **🟥 NVIDIA 重新评估 HBM 堆栈层**：TrendForce 9 月报，NVIDIA 正审查 Rubin Ultra 的 HBM 配置（8 层 HBM4E/12 层 HBM4/8 层 HBM4 与原计划的 12 层 HBM4E），最先进 HBM 短缺倒逼方案重构。
- **HBM 替代品**：SK 海力士 + SanDisk 上月发布首个 AI 推理高带宽闪存（HBF）标准；DeepSeek V4.1 Flash 极致压缩 KV cache。

**Mavis 点评**：存储涨价周期已不是"周期"，是**结构性的 HBM 虹吸**。22% 晶圆换 9% 位元意味着即使产能不变，消费级得到的 DRAM 也在减少；Kioxia 主动停涨是真信号——**供应商已经意识到价格上限正在逼近消费可承受极限**。长期来看，长鑫 G5 量产（裸片 +50%/片）+ 三星 HBM4 量产时间（2026 末-2027 初）是破局点。22Q4-Q1 之间看消费端是否触发"集体减配回潮"。

- **🟥 国产 AI 芯片节奏**：昇腾 950 2026H1 量产，**昇腾 960DT 提前至 2027Q1、960PR 提前至 2027Q3**；**寒武纪 690 26Q3 量产**；海光 DCU4、沐曦 C700 预计 27H2 量产。([雪球](https://www.xueqiu.com/1419922109/409878081))

- **拓荆科技**：2026H1 新接订单**同比翻倍以上**，CX 端份额大幅提升，预计 2026H1 第一大客户，**存储敞口超 60%**；合同负债约 49 亿元（超过季度营收 4 倍），订单排至 2027 中。2026 订单增速 60-70%（兴业证券）。

- **盛美上海**：2026Q1 新签订单 +65%、**2026H1 同比 +105%**；全年营收指引 82-88 亿元。
- **国产 AI 芯片爆点**：京东云拟建**十万卡**全功能 GPU 智算集群（摩尔线程为底座）；沐曦 × 魔形智能万卡集群投产"Token 超级工厂"；移动云联合天数智芯 + 清华发布国内首个"国产 GPU + 类脑芯片"异构推理系统，DeepSeek V4 Flash 上验证**推理输出与能效 +1 倍以上、运营成本 -40%+**。

**Mavis 点评**：芯片国产化进入**订单与业绩兑现期**——9.17 昇腾 + 9.20 长鑫不是 PPT，已是现金流。三家存储厂（长鑫、长存、晋华）招标节奏首尾相接，国产设备厂商 2027-2028 才是业绩弹性兑现年。AI 芯片的"十万卡集群" + "国产 GPU + 类脑芯片异构"意味着云厂商已经不再只用 N 卡了——这是 Intel 当年做梦都想看到的事。

## 4. 🏭 三、上下游产业链

### 4.1 原材料

- **🟥 战略小金属全面上行**：生意社数据，截至 9.20 国内**锑锭 105,250 元/吨（MoM +19.26%）**、**锗锭 26,766.67 元/千克（MoM +13.18%）**，铋、钽同样跟涨。长期看，AI 数据中心将拉动**铟需求从 2025 年 19 吨 → 2030 年 419 吨**（东吴测算），磷化铟光芯片产能扩张直接打开铟长期空间。([证券时报](https://ggb@stcn.com/article/detail/4192388.html))
- **锗价"七周台阶"上行**：SMM 9.18 国内锗锭均价 26,800 元/千克，**七周累计 +12.8%**，本周四单日均价 +250、最高价 +500；Mysteel 9.16 锗锭 26,000-28,000 元/千克。供给端原料端持续紧张（铅锌矿 + 褐煤），出口管制常态化持货商惜售。需求端**红外军工（Q4 旺季）+ 低轨卫星锗衬底 + 光纤四氯化锗**三大共振。
- **🟥 金属镓区间整理**：9.18 国内 4N 镓主产区主流报价 1,740-1,770 元/千克，供货稳定库存充足下游按需小单，预计短期维持低位整理。Strategic Metals Invest 9.17 镓 USD 2,269.40/kg（YTD +31.74%、Jan 2020 +661.03%）。
- **战略性矿产目录（36 种）**：石油、天然气、锂、钴、镓、锗、钨、铟、钽、铋、稀土……《矿产资源法实施条例》6 月已施行。
- **稀土与小金属资金关注**：iFind 9.20 小金属指数近一年累计 **+33.24%**，年内单日成交多次破千亿；社保 Q2 新进**博迁新材（9.82 亿）+ 中钨高新（7.66 亿）**；倍杰特 5 月收购广南金鑫冶金 55% 股权（锑）；云锡竞拍赤峰大井子锡业（锡+铟）扩储。

**Mavis 点评**：战略小金属进入"战略资产"阶段——供给端有天花板（伴随矿+开采控制），需求端有 AI 服务器单台用量大幅提升的双重挤兑。**锗价 7 周连涨但本周二已现放缓迹象**，意味着高位震荡在即；铟和钽是下一个观察重点（800G/1.6T 光模块、钽电容都需要）。

### 4.2 设备 / 材料

- **设备订单密集释放期**：**长鑫上半年完成主要招标、长存三期设备安装进行时、晋华 2026H2 重启采购**，三股叠加使 2026H2-2027 成为设备订单最密集的释放窗口。由于订单到收入确有时滞 8-12 个月，**国产设备业绩弹性要落在 2027-2028**。([21 世纪经济报道](https://www.toutiao.com/article/7685966241260913161))
- **SEMI 预测**：2026 全球 300mm 晶圆厂存储领域设备投资将达 **520 亿美元、同比 +29%**，2024-2029 CAGR 19%。
- **9.16 半导体设备 ETF 招商（561980）盘中 +3.79%**，成分股有研硅 20cm 涨停、有研新材 10cm 涨停、上海合晶/天岳先进/中科飞测分别 +11%/+8%/+7%。
- **国产化率分布**：**光刻 <1%、量测检测 <5%、高端 SoC 及存储测试机 8-10%**；长存三期国产设备采购**首次超 50%**。
- **重掺硅片调价**：中信证券预计较为紧缺的重掺硅片**9-10 月继续调涨 2027 长协价格**，涨价周期至少到 2027 年。

**Mavis 点评**：设备 ETF 的短线机会在订单密集释放期（2026H2-2027H1），中线业绩兑现期才是 2027-2028。这一波更像是"订单预期交易"先行。长存三期 50% 国产化率是一个分水岭——意味着国产高端刻蚀/CMP/离子注入已经能撑起一条 50% 关键工序的产线，剩下的是堆量 + 良率。

### 4.3 制造 / 封测

- **中芯国际 + 华虹 + 长鑫 + 长江存储**：国产代工三巨头 + 存储双雄继续扩产。长存三期 2027 月产能 5 万片、长鑫 2026 新增 5-6 万片。
- **先进封装**：NPO/光互联是本次昇腾 960 增量，源杰科技、光迅科技、长光华芯受益；高速 PCB/覆铜板沪电股份、深南电路、兴森科技承接高速背板需求。
- **长电 + 通富 + 盛合晶微**：CoWoS/2.5D 受益于国产 AI 芯片需求，订单结构开始转向国产客户为主。
- **HBM 国产替代窗口**：澜起科技 HBM 接口芯片利扬芯片测试同步受益。

**Mavis 点评**：制造端的国产化和先进封装是这个十年的真正主题——DUV 多重曝光 + 自研 HBM + 国产先进封装 = 规避 EUV 封锁的可行路径。CAS（IMECAS）的 GAA DUV 路径已有 early stage 验证，短期看不到量产但意义是告诉我们**没有 EUV 也能再往下走**。

### 4.4 下游应用

- **PC + 平板 + 可穿戴**：Counterpoint 指出 8GB RAM 笔记本重出江湖；8GB 入门级笔记本今年再次成为标配。
- **服务器 + 数据中心 + AI 算力**：韩 SK 海力士 + SanDisk 联合推 HBF 标准；Nscale IPO 招股书披露**1030 亿合同 85% 来自微软 + Anthropic**（微软 438 亿 + Anthropic 446 亿），截至 8 月底活跃合同仅 26 亿、H1 营收 1.406 亿、净亏 10.2 亿，IPO 目标估值 350 亿。
- **🟥 Meta Muse AI 代理登顶 App Store**：6 天下载 90.2 万，**股价周一 +11.32%**；亚马逊封锁 Meta Muse 在 Amazon 上的购物权限（AI 代购时代规则之争开始）；Arm +17%、英特尔 +12%、AMD +10%（市值破万亿）、高通 +9%。
- **新能源车**：摩根士丹利预测比亚迪 Q4 出货增速回落但全年仍录得 +25%；工信部 + 发改委联合推动智能网联汽车 L3 准入试点（9.20 已下放部分城市）。
- **特斯拉机器人审厂**：9.21 在拓普集团、三花智控、均胜电子等长三角供应链企业审厂，关节模组/执行器/精密结构件等核心机电部件；多家供应链企业已获订单。
- **消费电子涨价潮传导**：Counterpoint 5 月数据安卓旧款平均涨幅 13%、小米 8 月再涨 300-500 元、华为 nova 15/Mate 80 据传 9 月上调价。

**Mavis 点评**：下游最大看点是 Nscale 的 IPO——**单公司未确认合同 1030 亿美元，但活跃合同只有 26 亿**，意味着这是远期期权式的"AI 卖水人"估值。如果未来 2 年合同真的履约，2030 年它将是第 5 个破万亿市值的 AI 基建商；如果毁约/延期，泡沫风险又上一个台阶。

今天的 4 大主线：

1. **国产算力里程碑周**：9.17 华为全联接大会公布昇腾 960 NPO 超节点 + 9.20 长鑫存储 G5 量产 + 9.20 长江存储三期设备安装启动，意味着**国产算力从"单卡"走到"超节点+先进存储+工艺"**的三维同步推进。

2. **存储涨价周期的"硬上限"被供应商承认**：Kioxia 主动停涨 NAND，Intel CEO 公开说存储吃掉入门设备 BOM 80%，美光 84.9% 毛利率、SK 海力士 ASP +30%/+55%——**结构性涨价持续**，但消费者端的"减配+涨价"已经在 Pixel 11 Pro、Galaxy Book6、iQOO Z11i 同时发生。

**Mavis 独立判断 5 条**：

1. **中美元首互访或比预期更务实**：3 年未访问 + 时点选在美联储加息后、FED 主席 + 财政部长刚开完纽约磋商，意味着双方都希望稳定；稀土、芯片、台海会是核心议题。**"反向挂钩"（中方恢复稀土、美方阶段性放松部分芯片许可）概率提升**。
