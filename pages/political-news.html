## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**1) 财政部 10.9 公布《2026 年上半年财政政策执行情况报告》—— 7 大方向 + 6 项工作**

10 月 9 日，财政部发布 2026 年上半年中国财政政策执行情况报告，确立"十五五"开局年的"更加积极"基调。报告披露：
- 🟥 上半年已下达 **超长期特别国债资金 6064.6 亿元**，推动 936 个重大项目尽快形成实物工作量
- 中央本级基础研究支出同比增长 **16.3%**
- 城镇新增就业 **695 万人**；创业担保贷款余额超 **2800 亿元**；国家融资担保基金累计服务小微企业等经营主体超 **650 万户次**；全国领取基本生活救助人员超 **4400 万人**
- 城乡低保平均标准比去年同期分别提高 **31 元、26 元**

下半年 6 项重点工作：
1. 有力有效实施更加积极的财政政策
2. 支持全方位扩大国内需求（"两重""两新"+ 财政金融协同促内需一揽子政策）
3. 推动科技创新和产业创新
4. 持续保障和改善民生（育儿补贴、免费学前教育、养老服务消费补贴）
5. 加强重点领域风险防范化解（一揽子化债、地方融资平台退出）
6. 深化财政管理改革（零基预算、消费税改革）

来源：[央广网](https://www.cnr.cn/rdjj/house/jdt/20261011/t20261011_527838635.shtml)、[中国经济网](https://www.ce.cn/xwzx/gnsz/gdxw/202610/t20261010_3252615.shtml)

**2) 央行 10.15 开展 7000 亿元买断式逆回购，10 月净投放 4000 亿元 —— 政策由稳转松**

🟥 10 月中长期流动性到期合计高达 **2.4 万亿元**（含 MLF 9000 亿、3 个月期买断式逆回购 1 万亿、6 个月期 5000 亿），央行 10 月 15 日以固定数量、利率招标、多重价位中标方式开展 **7000 亿元 6 个月期买断式逆回购操作**，加量续作 2000 亿元。叠加 10 月 8 日 3 个月期品种已净投放 2000 亿元，**10 月买断式逆回购合计净投放 4000 亿元**（9 月两期限均为等量续作）。

招联首席经济学家董希淼：政策取向由稳转松的信号明确。东方金诚王青：当前及未来一段时间，央行将主要通过买断式逆回购、MLF 等中期流动性工具加量续作，**适度加大逆周期调节力度**。预计 LPR 短期大概率维持不变。

来源：[中国基金报](https://www.chnfund.com/article/ARe1bf996a-9ded-1549-be17-3a244c44ef7c)、[中华网](https://news.china.com/socialgd/10000169/20261015/49795629.html)

**3) 财政部 10.8 完成 1500 亿元中央金融机构注资特别国债（一期）招标**

🟥 票面利率 **1.37%**、期限 5 年、投标倍数 2.25 倍。资金定向注入 8 家中央金融机构：
- 农业银行：1300 亿特别国债 + 300 亿其他股东
- 工商银行：700 亿特别国债 + 300 亿其他股东
- 中国进出口银行、国寿、人保、出口信用、太平、中再分别 300/350/150/100/70/30 亿元
- 本轮整体增资 **3600 亿元**（财政 3000 亿 + 中国烟草 600 亿）
- 第二期 1500 亿元 7 年期将于 **11 月 18 日**招标

来源：[腾讯新闻](https://news.qq.com/rain/a/20261012A0B18O00)

**4) 山东"十五五"数字强省规划 10.14 印发 —— 2030 年数据企业超 2.5 万家**

🟥 山东省 10 月 14 日发布《数字强省建设"十五五"规划》+《关于加快推进数据产业高质量发展的实施意见》+《关于支持人工智能 OPC 创新发展的行动方案》三大文件，部署 46 项重点任务、10 项重点工程。关键目标：
- 到 2028 年全省 **数据企业数量超 2.5 万家**，形成 30 个以上数据产业集群
- AI 核心产业营收年均增长 **20% 以上**（2025 年已达 1289 亿元，占全国 1/10）
- 到 2030 年建成百个 OPC 特色载体、千家创业主体、万名创新人才
- 每年布局 3-5 个省级中试基地，每个最高 **500 万元**补助

**Mavis 点评**：山东把"OPC（One Person Company / 一人公司）"作为新质生产力的重要载体，思路是**用制度+算力券/模型券/语料券"拎脑入驻"**降低 AI 创业门槛。这跟 2024 年杭州余杭的"算力券"、2025 年深圳的"训力券"形成区域竞争态势，地方政府正在"抢 AI 创业者"。

来源：[人民网](https://sd.people.com.cn/n2/2026/1014/c364532-41722031.html)、[中国发展网](http://fzdh.chinadevelopment.com.cn/sjzg/2026/1015/2019779.shtml)

**5) 工信部、网信办、市场监管总局联合调查"尊界 V800 汽车刹车踏板支架断裂"**

10 月 15 日，针对网络反映的尊界 V800 汽车刹车踏板支架断裂问题，工信部、中央网信办、市场监管总局成立**联合调查组**开展核查并依法依规处理。

**Mavis 点评**：鸿蒙智行（华为系）首款 70 万级旗舰车 S800 在大规模交付后出现关键安全件断裂问题，三部门联合调查级别是行业首次。**短期对华为车 BU 品牌信誉有冲击**；中长期看，倒逼供应链质量管控升级是好事。

来源：[21 经济网](https://www.21jingji.com/article/20261016/herald/4d972e0fd3a2e165ba53a8900ead5d3e.html)

### 2.2 🟠 经济面 E

**1) 9 月 CPI +0.9% / PPI +5.0% —— 剪刀差扩大，AI 通胀特征显著**

10 月 14 日国家统计局公布：
- 🟥 **9 月 CPI 同比 +0.9%**（环比 +0.2%），核心 CPI 同比 +1.0%
  - 汽油价格同比 **+16.6%**，贡献 0.47 个百分点
  - 工业消费品（不含能源）+1.6%
  - 服务价格 +0.8%（医疗 +4.0%、旅游 +2.1%）
  - 食品价格 -1.7%（鲜菜 -8.1%、猪肉 -10.0%、鸡蛋 +17.4%）
  - **AI 通胀信号 🟥**：数据存储设备、平板、电脑、手机同比 **+46.7% / +23.6% / +21.8% / +14.9%**，合计贡献 CPI 0.23 个百分点
  - **黄金饰品** +22.5%（增速回落 11.1 个百分点），仍贡献 0.11 个百分点
- 🟥 **9 月 PPI 同比 +5.0%**（环比 +1.2%），**创 2022 年 7 月以来新高**
  - 煤炭开采洗选 +35.3% / 石油天然气开采 +24.5% / 石油加工 +21.6% / 有色冶炼 +21.4%
  - 8 个行业合计影响 PPI 同比 +5.42 个百分点
  - 电气机械 +6.2% / 计算机通信电子设备 +5.8%（AI 算力传导）
  - 电力热力 -3.9% / 医药制造 -3.3% / 汽车制造 -2.0%（**中下游仍承压**）

**Mavis 点评**：申万宏源赵伟指出 9 月 PPI 同比 5% 受油价（8 月中至 9 月中回升 13.5%）、油运费（9 月进口原油运价指数 +150%）、煤价、AI 算力四重因素叠加，**预计 10 月 PPI 继续上行至 5.5% 附近**。但 PPI-CPI 剪刀差扩大至 4.1 个百分点，**汽车制造业利润 -16.0%**，中下游"增收不增利"困境加剧。9 月数据是"上游狂欢、下游买单"最直白的写照。

来源：[央广财经](https://finance.cnr.cn/ycbd/20261014/t20261014_527841877.shtml)、[Macrostream](https://www.macrostream.ai/articles/6acee52ff30e248c42413922)、[新华网](http://www.chinaview.cn/20261014/044f0e7aea0a4949bf71c7134989a940/c.html)

**2) 海关总署 10.14 公布前三季度外贸数据 —— 集成电路出口 +99.1% 接近翻倍**

🟥 **前三季度我国货物贸易进出口 39.94 万亿元，同比增长 18.8%**
- 出口 23.2 万亿元（+16.4%），进口 16.74 万亿元（+22.3%）
- 9 月单月 5.16 万亿元，首次突破 5 万亿，**+27.5%**
- 进口增速连续 7 个月超 20%，9 月首次破 2 万亿
- **装备制造业贡献近 90% 出口增量**；中间品占出口超 50%
- 对 APEC 其他经济体进出口 24.07 万亿（+23.9%），占 60.3%

算力相关出口：
- 🟥 集成电路 **+99.1%**（近翻倍）
- 🟥 电脑零附件 **+210%**
- 🟥 固态硬盘等存储部件 **+130%**
- 服务器等数据处理设备 **+7.2%**
- AI 眼镜、智能仿生机器人等终端持续走向国际市场

电力相关出口：
- 风电整机 +22.4% / 光伏 +10.3% / 电线电缆 +28.1% / 变压器 +22.5% / 蓄电池 **+34.8%**（200 多个国家）

**Mavis 点评**：集成电路出口接近翻倍不是单一行业突破，是**中国制造在全球算力产业链的定位重塑**。注意海关数据中**存储部件出口 +130%** 远高于集成电路整体 +99.1%——证明国内长鑫/长江存储/江波龙/佰维存储等存储模组厂商正享受全球 AI 需求外溢红利。但央广"晶采观察"已警示：**集成电路高速增长不代表全产业链自主可控，越在风口越要补设计/制造/设备/材料短板**。

来源：[海关总署新闻发布会](https://www.toutiao.com/article/7696417256242151970)、[央视网](https://news.cctv.cn/2026/10/14/ARTIbXTBqMGoyfAUUTQvLwnc261014.shtml)、[央广"晶采观察"](https://www.toutiao.com/article/7696848634826031626)

**3) 央行 10.15 G20 会议：继续实施好适度宽松的货币政策**

人民银行行长潘功胜在 G20 第三次财长和央行行长会议（泰国曼谷）上表示，中国人民银行将继续实施好适度宽松的货币政策，为中国经济稳定增长和金融市场的平稳运行营造良好的货币金融环境。

**4) 2025 年外商直接投资权益存量 26.8 万亿元，位居全球第二**

商务部数据：2025 年共有 **46.1 万家外资企业**提交年报（同比 +5.7%）；外商直接投资权益存量 26.8 万亿元，**连续 6 年增长**，位居全球第二。

### 2.3 🟣 社会面 S

**1) 就业与民生：上半年财政投入画像**

## 4. 🏭 三、上下游产业链

### 4.1 原材料

**1) 硅片 / 稀土 / 镓 / 锗**：暂无 10.14-10.16 重磅新数据。

**2) 有色金属**：9 月 PPI 数据中**有色金属冶炼及压延加工业 +21.4%**（同比）；铜、铝价格受国际地缘风险推升。

**3) 9 月 PPI 上游 vs 下游分化加剧**：
- 生产资料 +6.5%，生活资料 -0.1%
- 8 个行业合计影响 PPI +5.42 pp
- 5 个行业（饮料精茶 / 电力热力 / 医药 / 非金属矿物 / 汽车）合计拉低 PPI 0.66 pp

**Mavis 点评**：🟥 **PPI-CPI 剪刀差 4.1 个百分点是有数据以来最高**。"上游强、下游弱"格局短期难改；汽车制造业利润 -16.0%，工业品价格回升的红利被中下游"利润倒挂"吞噬。

### 4.2 设备 / 材料

**1) 半导体设备** 🟢：见 3.3 节。北方华创 / 拓荆 / 中微 / 华海清科 业绩 + 订单双爆发。

**2) 上游材料订单能见度延伸至 2027 年**：江丰电子、雅克科技等存储原厂材料供应商订单已排到 2027 年。

**3) 关键设备国产化率**：
- 刻蚀 55-65% / 清洗 50-60% / CMP 30-40% / 薄膜沉积 ~25% / 量检测 < 10%

**Mavis 点评**：🟥 北方华创 Q3 在手订单超 200 亿，已排到 2027 年下半年——这意味着**国产设备龙头的收入可见度比很多互联网公司都长**。**"多重曝光工艺"已成为中国绕开光刻机限制的杀手锏**——直接推升对刻蚀机和薄膜沉积设备的需求量翻倍。这是北方华创 + 拓荆 + 中微 Q3 订单爆发的核心驱动。

## 6. ✏️ 五、编辑后记

### 今日 4 大主线

**主线 1：AI 资本开支"换轨" —— 中国算力从"买英伟达"到"多架构并存"**

IDC 10.13 报告显示 2026H1 中国 AI 加速器市场**非 GPU 类（+80%）首次超越 GPU 类（-26%）**。英伟达份额从巅峰 65% 跌至 34%，华为昇腾 28% 接近翻倍，**国产四强（昇腾/平头哥/寒武纪/昆仑芯/海光）合计占非 GPU 95%**。摩根士丹利预测 2027 年国产 AI 芯片自给率从 2026 年的 45% 跃升至 68%，2027 是关键拐点。**结构性意义**：中国 AI 算力供给端"换轨"完成，下游"豆包手机/阶跃 STEPX Neo/OPPO × Manus/苹果智能"开始商业化。

**主线 2：存储"超级周期" + 国产替代双轮驱动**

🟥 **DDR4 三个月 +24% / SSD 6 季连涨创历史新高 / NAND 利润 40 倍**。SK 海力士 Q3 营业利润预期 80.1 万亿韩元（同比 +557%），营业利润率 80%。长鑫 G5 平台量产、长江存储全球第三，**国产存储 + 涨价 + 国产化三重红利**。**Q4 内存合约价还要涨 10-15%**，2027 年 DRAM 缺口 13.9%，NAND 2028Q1 缺口 8.3%。

**主线 3：政策"积极财政 + 适度宽松货币"双管齐下**

🟥 财政部 10.9 报告"更加积极财政"；央行 10.15 开展 7000 亿买断式逆回购（加量 2000 亿），10 月净投放 4000 亿；财政部 10.8 完成 1500 亿元中央金融机构注资特别国债（一期）招标，11.18 第二期 1500 亿；央行 10.15 G20 表态"继续实施适度宽松货币政策"。**财政货币协同发力"稳增长"**。Q4 还有 8000 亿政策性金融工具 + 5500 亿地方债待发。

**主线 4：消费端"涨价" vs 投资端"扩产"分化**

Q3 全球手机 -20%/-22%（创 14 年新低）、内存 +350%、iPhone 18 涨价 30%、小米 17 Ultra 涨 1000 元、PC SSD 6 季连涨 4 倍——**消费端承压**。但北方华创前三季订单 570 亿（+60%）、在手 200 亿排到 2027 下半年；台积电资本开支 600-640 亿美元；华虹 Q3 ASP 涨 10-15%——**投资端扩产**。**"投资强、消费弱"的剪刀差是 2026-2027 年最大宏观特征**。

### Mavis 独立判断 6 条

**1. Q4 PPI 同比预计 5.5% 附近，剪刀差扩大至 4.5 个百分点**

申万宏源赵伟的判断受 4 重因素叠加：油价 8 月中至 9 月中 +13.5%、油运费 +150%、煤价上涨、AI 算力传导。**Q4 中下游"利润倒挂"加剧**。但**央行 Q4 降准可能性下降**（董希淼 + 王青均表态），主要靠买断式逆回购 + MLF 加量续作。这意味着流动性"松"但利率"不松"。

**2. 内存涨价"超级周期"至少延续到 2027H1**

🟥 三星 / SK 海力士 / 美光**未来产能已被预订至 2027 年**。新增 NAND 产能要到 2027 年底 / 2028 年初才大规模开出。苹果与铠侠签 3-5 年长期协议。**意味着：① 2027H1 之前别指望 PC / 手机降价；② 二手 / 翻新机市场 Counterpoint 预测 2026 年 +13%；③ 消费电子产业链"涨价 → 减产 → 涨价"的死循环短期无解**。

**3. 国产 AI 芯片"五路纵队"中，昇腾一家独大但第二名差距明显**

华为昇腾 28% / 平头哥 7% / 寒武纪 5% / 昆仑芯 4% / 海光 3%——**昇腾一家占国产 AI 算力市场的近一半**。这意味着昇腾生态的成熟度直接决定国产 AI 芯片的整体竞争力。DeepSeek 9 月底开源面向昇腾的基础设施组件是重要信号——"模型 + 芯片"开始深度协同。

**4. 半导体设备订单"超级大年"已锁定未来 1-2 年业绩**

🟥 北方华创前三季订单 570 亿（+60%），Q3 单季 100+ 亿创历史新高，在手 200 亿排到 2027 下半年。**这相当于把"未来 1-2 年业绩"提前锁死**。但要注意：① 单季订单不等于多年业绩；② 全球半导体周期仍有变数；③ 国产替代"长逻辑"和"短兑现"要分开看。

**5. 中国手机品牌"主动收缩"策略是把双刃剑**

小米 Q3 出货 -30%+，主动减少低价机和非核心海外市场投入。OPPO 整合 OPPO/realme/一加三个品牌。**短期保住利润**，但**长期可能丢失海外市场份额**（尤其是印度、东南亚、非洲）。**Counterpoint 预测 2026 年中国手机市场仍下滑 16.7%，复苏要等到 2028 年**。

**6. PPI-CPI 剪刀差 4.1 个百分点 + 实际工资增速跟不上 = 居民消费仍弱**

虽然财政"投资于人"力度加大（低保 +31/+26 元、新增技能证书 4000 万人次），但**PPI 上游狂欢 vs CPI 下游弱势**的格局意味着**居民实际购买力增速跟不上企业利润增速**。Q4 财政货币协同能否通过"消费补贴 / 以旧换新 / 服务消费"传导到终端，是观察重点。

    function renderNews(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('newsContent').innerHTML = html;
      } catch (e) {
        document.getElementById('newsContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadNews() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-political-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
