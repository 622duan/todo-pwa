## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**本周高层动态**

- **9.10 国务院新闻办发布会**：发布《金融强国建设"十五五"规划》。截至目前，**境外主体持有境内人民币金融资产超 11 万亿元**。规划明确"十五五"金融工作八大方向，包括完善央行独立性、增强人民币国际化、建设数字金融基础设施等。[来源：国务院新闻办](http://www.scio.gov.cn/)
- **9.9 国务院办公厅印发《关于治理中小企业回款难问题的通知》**：电子凭证最长付款期限压至 **6 个月**；对故意拉长账期的大型企业开展多部门联合约谈；银行/商业保理公司不得为付款期限超 6 个月的电子凭证提供融资。**Mavis 点评**：账期从历史常见的 9-12 个月直接压到 6 个月，对中小企业现金流是结构性利好，对国企/政府类大客户的话语权是明确约束。
- **9.10 国家医保局**：2026 年国家医保药品目录及商保创新药目录现场谈判结束，**124 个目录外药品入围谈判竞价**（含肿瘤、罕见病、慢性病、儿童用药），结果预计 11 月发布，2027.1.1 起执行。**Mavis 点评**：创新药进医保的"年度大考"结束，结果待发；本周 CRO/创新药板块异动与此直接相关。
- **9.10《金融时报》披露的金融"十五五"规划八大方向**：①完善中央银行独立性；②增强人民币国际化；③数字金融基础设施；④科技金融/绿色金融/普惠金融/养老金融/数字金融"五篇大文章"；⑤防控金融风险；⑥资本市场投融资平衡；⑦金融高水平开放；⑧党管金融的制度化。
- **9.15《国务院关于出境入境管理的规定》正式施行**：19 条新规。司法部、公安部、国家移民管理局联合澄清——"出境全面收紧、普通民众出境变难"系误读，新规针对非法跨境人员（涉电诈、跨境赌博、违规技术外流），不影响公民因旅游/探亲/经商/留学的正常出境。
- **9.12-9.13 金砖第十八次领导人会晤**：习近平赴印度新德里出席。莫迪主持，议题涉及全球治理改革、贸易便利化、本币结算、AI 治理等。

**民生与产业政策**

- **8.18 国务院《住房公积金管理条例》**：9.20 生效——**提取情形 6→9 项**（新增自住房装修、物业费、国务院批准的其他住房消费）、贷款审批 15 日→10 日、首次纳入灵活就业人员（2 亿人）、存贷利率制定权上收至国务院。
- **9.4 国务院专题学习（李强）**："六张网"建设全面铺开，十五五总投资 **超 26 万亿元**（新型电网 5 万亿、水网 6 万亿、地下管网 5 万亿、算力网 4 万亿、物流网 3.6-4.3 万亿、新一代通信网 1.3 万亿）。
- **8.1 起财政金融协同促内需一揽子政策**：贴息上限从 3000 元提至 **5000 元**（信用卡/汽车/家装专项分期）；**120 亿元养老消费补贴**、**241 亿元幼儿园大班免保教费**、**近 1000 亿元育儿补贴**已落地。
- **9.8 国家医保局等七部门**：用 3 年扩大灵活就业/农民工/新就业形态人员职工医保参保，超大城市取消户籍限制。
- **9.10 中央宣传部+教育部**联合发布 2026 年"最美教师"25 人；**世界顶尖科学家奖** 揭晓（生命科学/医学奖 4 人，**邵峰**成首位中国籍获奖者，单项奖 1000 万元）。

**Mavis 点评**：本周政策信号清晰——**金融"十五五"是顶层框架**、**中小企业回款是微观发力**、**金砖+APEC 是外交支点**。三个动作齐发，9 月底-10 月初是政策密集落地期，值得盯国务院常务会议、ZZJ 会议、央行货政报告三条线。

### 2.2 🟠 经济面 E

**8 月价格数据双升（核心数据）**

| 指标 | 8 月 | 7 月 | 变动 | 解读 |
|---|---|---|---|---|
| **CPI 同比** | **+0.8%** | +0.5% | +0.3pct | 由降转涨（环比 -0.1% → +0.4%） |
| **核心 CPI 同比** | **+1.0%** | +0.9% | +0.1pct | 内需边际改善 |
| **PPI 同比** | **+3.8%** | +3.5% | +0.3pct | 由降转涨（环比 -0.7% → +0.4%） |
| **工业生产者购进价** | +5.8% | — | — | 上游成本传导 |

[来源：国家统计局 9.9](https://www.stats.gov.cn/sj/sjjd/202609/t20260909_1965261.html)

**价格结构性拆解（来自国统局解读）**：

- 🟢 **拉动项**：能源价格同比 +4.1%（汽油 +9.3%）、黄金饰品 +33.6%、**计算机 +19.6%**、**移动电话机 +11.0%**、**平板电脑 +21.5%**、**数据存储设备 +2.1%**（同比 +10% 上下）
- 🟠 **拖累项**：猪肉 -11.8%（收窄 1.5pct）、家用汽车下行、耐用消费品以旧换新效应减弱
- 🔍 **PPI 行业分化**：煤炭 +26.6%、有色冶炼 +20.8%、石油天然气 +10.5%、电气机械 +5.9%、计算机通信 +5.3%（7 个行业合计拉动 PPI +4.24pct）

**Mavis 点评**：8 月物价双升是 **AI 算力带动电子产品价格上涨 + 国际油价传导 + 食品季节性** 三个力的合成。东方金诚冯琳预计 **9 月 CPI 升至 1.0%、PPI 扩至 4.0%**。值得警惕的是耐用消费品以旧换新效应减弱、上下游分化（生产资料 +5.0% / 生活资料 -0.5%）—— 涨价还停留在上游和中游制造端，**未充分传导到终端**。

**外贸与高频数据**

- **海关数据（H1 2026）**：集成电路出口人民币口径 +88.7%（折美元 1772.8 亿、+96.1%）；规上集成电路产量 2798 亿块、+23.1%。
- **WSTS H1 2026**：全球半导体市场约 7020 亿美元，**同比 +102%**；存储 +30.5%、逻辑 +45%。
- **8.18-9.10 商务部**：中美双方正在就 **300 亿美元对等降税框架**进行磋商，争取早日落地实施。
- **2026 APEC 工商领导人峰会**：11.17-18 在深圳举办（这是中国时隔 19 年再次主办 APEC 会议）。
- **8.10 海关**：前 8 月外贸 +17.6%；8 月集成电路出口 +130%（人民币计）。

**Mavis 点评**：宏观面的"暖信号"集中在两点——**8 月 PPI 双升确认价格端修复**、**集成电路出口继续翻倍式增长**。但耐用消费品以旧换新效应减弱、地产销售低迷、民间投资偏弱，"价格修复向消费修复"的传导仍未跑通。9-10 月关键看消费补贴落地（5000 元贴息、家电以旧换新）能不能把需求拉起来。

### 2.3 🟣 社会面 S

**本周民生要闻**

- **9.5-9.8 医保谈判**：124 个目录外药品竞标，11 月发结果——这是年度最大规模的医药民生议价事件。
- **9.10 中小企业回款新政**：账期压至 6 个月——**Mavis 点评**：这本质上是给中小企业发"现金流红包"，对应**应收账款融资（供应链金融）**的政策红利窗口。
- **9.10 七部门《全民消防安全素质提升行动（2026-2030）》**：消防救援局、央社部、全总、教育部、民政部、人社部、文旅部联合印发。**4 项行动**（常识普及/技能实操/疏散演练/案例警示）+ **消防控制室"四快"规程**（确认火情快/报警调集快/启动设施快/引导疏散快）+ **值班员"五知"标准**。**Mavis 点评**：5 年长周期，消防培训、应急照明、智能疏散产业有新订单机会。
- **9.10 国家统计局**：8 月猪肉价格 -11.8%，但降幅收窄 1.5pct；鸡蛋 +18.5%，鲜菜 +5.5%（环比涨幅扩大 4.2pct）—— 食品价格分化。
- **9.10 中央宣传部+教育部**：第 42 个教师节，发布 2026 年"最美教师"25 人。

**Mavis 点评**：本周民生政策面"组合拳"特征明显——**回款新政（企业）+ 医保谈判（医疗）+ 公积金扩面（住房）+ 消防提升（公共安全）**。Mavis 自己的小判断是"6 个月账期"对中小制造业、医药流通、建材这些典型账期偏长行业是最大的边际改善。
