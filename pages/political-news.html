## 📊 一、宏观 PEST

### 1.1 🟢 政策面 P

- 8 月 29 日，国务院常务会议听取"十四五"规划实施情况汇报，研究部署"十四五"规划实施情况总结评估和"十五五"规划编制工作。十五五规划编制进入窗口期。

- 8 月 28 日，国家发改委召开新闻发布会，介绍"两重"建设和"两新"政策推进情况。截至 8 月底，**设备更新和消费品以旧换新资金已累计带动相关投资 1.2 万亿元**。
- 9 月 1 日，海关总署发布 8 月外贸数据（待发布窗口）：市场预期出口同比 +6% 左右，进口 +3% 左右。🟥

### 2.1 📱 手机

- **出货量**：Counterpoint 8 月报告，2026 Q2 全球智能手机出货量 2.95 亿部，同比 +4%。三星 19%、苹果 16%、小米 14%、vivo 9%、传音 9%、OPPO 8%、荣耀 6%、华为 5%（含 Pura 80 系列拉动）。**Mavis 点评**：高端市场苹果仍占 60% 以上，国产高端化突围仍在路上。
- **ASP**：2026 Q2 全球 ASP 同比 +6%，主要由存储涨价 + 折叠屏渗透推动。苹果 ASP 920 美元，三星 395 美元，国产 280-350 美元。
- **折叠屏**：DSCC 数据，2026 H1 全球折叠屏出货 980 万台，同比 +28%。华为 Mate X7 / Pura X 系列、荣耀 Magic V5 拉动国产品牌份额至 65%。
- **AI 手机**：Canalys 8 月报告，2026 H1 中国 AI 手机渗透率 38%，端侧大模型参数 30B+。
- **涨价潮**：realme 9 月 1 日宣布，因存储芯片涨价，GT 系列部分机型涨价 200-300 元。**Mavis 点评**：存储涨价向终端传导的第一枪，预计 9-10 月还会有更多品牌跟进。
- 龙头：传音控股 8 月 28 日 H1 财报，营收 285 亿元 +18%，非洲市场份额 41% 创新高。
