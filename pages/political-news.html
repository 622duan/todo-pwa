## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**🟥 国务院常务会议（9.18）四大议题集中部署** —— 国务院总理李强 9 月 18 日主持召开国务院常务会议，部署四件事：

1. **老龄工作**：深入实施积极应对人口老龄化国家战略。60 岁及以上老年人口达 **3.2 亿**，约 **3500 万失能老人**需要长期照护；长护险参保覆盖 **3.2 亿人**、长期照护师持证超 **5 万**人、河北/山西等 **17 省**已出台省级实施方案。银发经济 + 内需扩容双线推进。[来源](https://big5.www.gov.cn/gate/big5/www.gov.cn/yaowen/liebiao/202609/content_7081464.htm)
2. **体育赛事**：增加高质量体育赛事供给，推动赛事与文旅、商务融合，培育专业运营主体。
3. **医疗康复护理扩容**：以基层为重点建强服务体系；强化智能康复装备和价格改革。**Mavis 点评**：医疗康复产业链、康复机器人、智能康复设备三个细分受益最直接。
4. **《中医药传统知识保护条例》草案**：加强中医药理论、技术和方药保护；同时提请审议《突发事件应对法》等 **15 部法律修正案**。

**货币政策：LPR 连续 16 个月"按兵不动"（9.20）** —— 1Y LPR **3.00%**、5Y LPR **3.50%**，均与上月持平。8 月新发放企业贷款加权平均利率略低于 **3.0%**、个人住房贷款利率约 **3.1%**。央行表态"实施好适度宽松的货币政策"。市场对 Q3 末-Q4 降准 **0.5pct**、降息 **10bp** 仍有预期。[来源](https://www.news.cn/fortune/20260921/b13ec3848bd14acf903ff4e58c8f4238/c.html)

**🟥 习主席 9.23-25 对美国事访问（历史性时刻）** —— 时隔 **11 年**习近平再次对美国进行国事访问，半年内中美元首互访。期间：

- **Mavis 点评**：中美关系阶段性"压舱石"事件；半导体/AI 监管、地缘博弈、台湾议题是焦点。

**财政部 / 央行 / 商务部**：央行召开外资金融机构座谈会（9.22），持续完善政策供给、稳步扩大金融市场双向开放。商务部回应稀土出口管制：2025 年 10 月 9 日公布的措施暂停实施至 **2026 年 11 月 10 日**，将通过经贸磋商机制保持沟通。
