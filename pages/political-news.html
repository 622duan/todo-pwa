## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**【🟥 9.28 国常会：加大逆周期调节，推一批务实管用增量政策】**
9 月 28 日，国务院总理李强主持召开国务院常务会议。会议明确"加大宏观政策逆周期调节力度，推动经济持续向新向优向好发展，努力完成全年经济社会发展目标任务"。这是三季度末最高规格的政策定调文件。 ([21世纪经济报道](https://www.toutiao.com/article/7690992122236781110/))

核心要点：
- **存量政策提效能**：加快专项债、超长期特别国债、特别国债拨付使用；推动"十五五"规划和"六张网"实施方案明确的重大工程项目尽早开工；推进老旧水库、老旧粮库改造；加力扩投资、促消费贴息。
- **增量政策补缺口**：优化财政支出安排，**用好地方政府债务结存限额**（年内理论可动用约 6000 亿元）；综合运用并适时调整货币政策工具；增加科技创新和技术改造、支农支小等再贷款额度；研究出台稳楼市、促就业增收措施。
- **地方先行先试**：鼓励有条件地方在提振内需、稳投资领域先行先试。

**【🟥 央行"四箭齐发"：9.29 货币政策工具组合拳】**
- 🟥 **PSL 利率下调 0.25 个百分点**：1 年期从 1.75% 降至 1.5%，是 2024 年以来首次 PSL 利率调整。
- 🟥 **PSL 支持领域扩围至"六张网"**：水网、新型电网、算力网、新一代通信网、城市地下管网、物流网——这是央行首次把"算力网"作为政策性金融重点投向。
- 🟥 **科创再贷款提额 + 提比例**：从 1.2 万亿增至 1.4 万亿，支持比例从 60% 统一提高到 100%。
- 🟥 **支农支小再贷款 +5000 亿**（其中民企再贷款 +3000 亿），总量从 4.35 万亿升至 4.85 万亿。 ([证券时报](https://stcn.com/article/detail/4203346.html))

**【🟥 房贷贴息：中央财政首次下场，10.1 起实施】**
9.29 财政部 + 央行 + 金融监管总局联合发文，自 10.1 起对首套住房商贷实施贴息：
- 限定条件：首套 + 建筑面积 ≤120㎡ + 总价 ≤150 万
- 贴息幅度：年化 1 个百分点，期限 ≤5 年，单户贴息贷款上限 100 万
- 100 万元贷款最多累计少付近 5 万元利息
- **测算年财政贴息规模 150-200 亿元**（中指研究院）；中央财政承担 90%
- 实质：把首套利率优惠约 1/3，100 万元贷款月供少付约 830 元 ([界面新闻](https://www.toutiao.com/article/7691101599652905535/))

**【其他政策动态】**
- 🟢 **国家发改委推介 52 个制造业项目**：预计总投资 524 亿元，拟引入民间资本 155 亿元（9.29）
- 🟢 **科技部"十五五"重点布局**：基础研究、AI、量子科技、生物制造、集成电路、工业母机、深海深空深地
- 🟢 **12 部门发文推动多式联运**：到 2030 年推动 1000 个左右主要货运节点提升多式联运功能
- 🟢 **《文化遗产保护传承"十五五"规划》**：中办、国办联合印发，到 2030 年文化遗产资源全面摸清
- 🟢 **2026 世界互联网大会乌镇峰会**：11.2-11.5 举行，主题"开源开放 共建共享"
- 🟡 **中俄美元首 APEC 期间或会晤**：外交部回应"目前没有可以提供的信息"（9.29）
- 🔴 **欧盟拟推"301"工具**：商务部回应属典型保护主义、单边主义，将坚决回应

**Mavis 点评**：🟥 9.28 国常会 + 9.29 央行/财政"四箭齐发"是 2026 年至今最高规格的政策组合拳，且**"六张网"首次把"算力网"纳入 PSL 支持领域**——这是把数字基建作为货币政策落点的明确信号，**直接利好算力链（昇腾、寒武纪、中芯、华虹）和 PCB/CCL**。房贷贴息虽规模不大（150-200 亿），但**首次中央财政下场补贴商贷**的标志性意义远大于规模——它打开了"财政信用撬动金融投放"的想象空间。**"用好地方政府债务结存限额"预计四季度新增约 5000 亿地方债**，投向上偏重"六张网"和化债。

**Mavis 点评**：🟥 **PPI 转正是 2026 年最值得关注的宏观信号**——从 -2.8% 到 +4.5% 的反转，相当于上游材料价格全面修复，对中游材料企业（钢铁、有色、化工）形成巨大利好，但同时也意味着**下游制造的成本压力会持续传导**。磷酸铁锂 -7.0%、电解铜 -1.6%、螺纹钢 -0.6% 显示**新能源车产业链 + 基建链条 9 月仍偏弱**，与"加力扩投资"的政策导向形成短期背离。LPG 和成品油价格 +5% 到 +9% 反映 9 月油价传导效应，**通胀温和回升强化了货币端相机抉择的空间**，四季度降准/降息概率上升。

### 2.4 🔴 技术面 T

**【🟥 长鑫 G5 平台量产：国产 DRAM 进入全球第一梯队】**
9.20 合肥 2026 世界制造业大会，长鑫存储宣布 G5 平台正式量产：
- 🟥 **有源区半间距 11.95nm**（接近全球最先进量产能级）
- 🟥 **每片晶圆裸片数较上代提升 ≥50%**
- 🟥 **24Gb LPDDR5X 已规模量产**，单颗容量较上代 +50%
- LPDDR5X 已进入小米、华为等中国旗舰手机供应链（10667Mbps）
- 副总裁骆晓东："我们的工艺能力已与业界最先进产品处于同一梯队"
- 行业评估：与三星/SK 海力士差距约 **3-5 年**，但无 EUV 的条件下逼近极限 ([CXMT](https://www.cxmt.com/en/news/info_22.html) / [BusinessKorea](https://www.businesskorea.co.kr/news/articleView.html?idxno=277366))

**【🟥 阿里云栖大会：真武 V900 超节点】**
- 9.22 阿里发布真武 V900、ICN Switch、磐脉智能网卡、镇岳 SSD 主控芯片

## 6. ✏️ 五、编辑后记

**今天三大主线**

第一主线：**政策端"加大逆周期调节"已正式落地**。9.28 国常会 + 9.29 央行"四箭齐发"（PSL 降 0.25pct + 科创再贷款 +2000 亿 + 支农支小再贷款 +5000 亿 + PSL 扩围至"六张网"）+ 房贷贴息 10.1 起实施，**这是 2026 年最确定的方向性政策**。"六张网"首次把"算力网"纳入，意味着数字基建获得了央行结构性货币政策的明确支持。

第二主线：**存储芯片超级周期还在继续，但内部开始分化**。TrendForce 9.24 报告上调 Q4 预测：DRAM/NAND 全线 +15-28%，企业 SSD 因 AI KV cache 需求激增领涨。美光 HBM4 累计出货超 10 亿美元，2027 产能已售罄。但 DDR4 已现价格松动——**大陆存储产能释放是边际拐点**。长鑫 G5 量产 + 深圳"存储五虎"百亿利润 + 国产 GPU 四小龙齐聚资本市场，**国产存储产业链第一次具备"技术 + 财务 + 客户"三位一体的竞争力**。

第三主线：**国产 AI 芯片"封神月"**。9.11 燧原科创板上市、9.20 长鑫 G5 量产、9.22 阿里真武 V900 发布、DeepSeek 16 万张昇腾订单——四件事集中落地。摩根士丹利预测华为昇腾 62% 国内份额 + 寒武纪 14% = 国产 AI 芯片占据国内 76% 市场，英伟达从 95% 跌至 8%。**"国芯训国模"已经从口号进入业绩兑现期**。

**Mavis 独立判断**

1. 🟢 **中芯 vs 三星代工市占率差距仅剩 0.5pct**（一年前 4.6pct）。三星 GAA 良率问题 + 中芯 AI 配套满产 = 趋势继续，中芯 2027 全年指引上调概率高。

2. 🟥 **小米 Q2 出货 -26% + ASP +26% 是产业转折点**：中国手机厂商第一次被迫进入"以利润换生存"阶段。这对供应链（舜宇、欧菲光、瑞声）形成业绩压力，但有利于品牌端（华为 Mate XT 系列、OPPO Find N）的高端化转型。

3. 🟥 **存储行业的"中国独立周期"已经成型**：宏碁公开叫板三巨头 + 美国法院受理反垄断案 + 长鑫 G5 量产 + 深圳"存储五虎"百亿利润——这是 30 年来中国大陆第一次在存储行业拥有"反制能力"。

4. 🟢 **AI Agent 产业进入 0-1 突破期**：OpenAI Dots（500 美元/月）+ Anthropic 2 万亿美元招股书 + 豆包"Spell"内测 + 智谱 GLM-5.3-Flash 全国产芯片承载 = **AI Agent 商业化路径首次具备完整链路**。
