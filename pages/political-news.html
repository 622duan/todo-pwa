## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**🟥 9月1日，8000亿元新型政策性金融工具启动投放。** 国开行、农发行、进出口行 3 家政策性银行已陆续在浙江、云南、四川、湖北、新疆等地落地项目，首笔由农发行浙江省分行投放 3 亿元支持浙江建德抽水蓄能电站。额度较 2025 年 5000 亿元明显扩张，预计可撬动 8-11 万亿元总投资；财信证券测算年内即可投放完毕。资金重点从传统基建向数字经济、AI、低空经济、商业航天等新兴产业倾斜。（[证券时报](https://finance.sina.cn/2026-09-04/detail-iniqqsmn6644764.d.html)）

**🟥 9月7日，六部门联合印发《坚持农业农村优先发展、完善乡村振兴投入机制实施方案》。** 农业农村部、中央农办、国家发改委、财政部、央行、金融监管总局联合发文，要求健全"财政优先保障+金融重点倾斜+社会积极参与"格局；到 2030 年基本建立结构合理、质效并重的乡村振兴投入机制。文件特别强调"用好债券资金支农""提升信贷资金支农效能""激发民间投资活力"等五条主线。（[人民网](https://finance.people.com.cn/BIG5/n1/2026/0908/c1004-40794263.html)）

**🟥 9月6日，工行、农行等 8 家中央金融企业合计增资 3600 亿元，财政部发 3000 亿特别国债支持。** 业内测算有望撬动约 4 万亿资产扩张，优先惠及科技创新与基建领域。这是国有金融资本近 5 年最大规模集中注资。

**🟢 8月31日 - 9月1日，二十国集团（G20）财长和央行行长会议在美国阿什维尔召开。** 央行行长潘功胜发言表示，中国人民银行将持续推进货币政策框架转型、完善利率体系、继续实施好适度宽松的货币政策；明确"中国政府坚持并持续推进经济结构的转型升级，并将其作为'十五五'规划的战略重点"。（[中证网](https://jnzstatic.cs.com.cn/zzb/htmlInfo/132325.html)）

**🟢 工信部近日印发《信息通信行业发展"十五五"规划》。** 首次明确"适时启动 6G 商用"，并提出新建 5G-A 基站 50 万个、有序部署万卡及十万卡以上智算集群、探索太空算力技术前瞻研究等量化目标和前沿部署。（[天山网](https://www.ts.cn/xwzx/jjxw/202609/t20260907_36274493.shtml)）

**Mavis 点评**：本周政策面"三连发"：8000 亿政策性金融工具 + 3600 亿金融央企注资 + 乡村振兴方案，目标都是把流动性导向"十五五"重大项目和薄弱环节。叠加工信部 6G 商用明确，政策已经从"总量宽松"转向"结构性输血"——下半年市场不缺钱，缺的是"流向哪、谁先拿到"。

### 2.2 🟠 经济面 E

**🟢 8月制造业 PMI 49.8%，比 7 月上升 0.6 个百分点。** 大型企业 PMI 50.6%（+1.1pct，重回扩张区间）；生产指数 50.4%、新订单指数 50.6%（+2.1pct，回到扩张区间）、新出口订单 50.1%（+0.5pct）。产需两端同步扩张，21 个细分行业中有 16 个 PMI 较 7 月上升；装备制造业 PMI 51.4%、高技术制造业 52.9% 持续在扩张区间。8月非制造业商务活动指数 49.0% 与 7 月持平。（[国家统计局](http://xjhb.gov.cn/xjzshbsc/c114834/202609/af95205fdb9646469f736dd1c757439a.shtml)）

**🟡 央行 9月7日等量续做 5000 亿元买断式逆回购。** 3 个月期品种（89 天），到期日 2026-12-5。9月1日 7 天期逆回购为 50 亿元地量操作、9月2-4日 0 投。央行副行长邹澜表示"将根据流动性管理需要，适当选择并合理搭配存款准备金、逆回购、MLF、国债买卖等工具"。（[中证网](https://www.cs.com.cn/xwzx/01/2026/09/05/detail_2026090510037005.html)）

**🟡 财政部副部长廖岷此前介绍：下半年还有 2 万多亿元地方政府专项债券和超长期特别国债待发行。** 央行或加大公开市场投放或适时降准以对冲流动性扰动；财信证券袁闯预计年内仍保留一次降准和一次降息空间（[证券时报](https://www.toutiao.com/article/7680843181898662436)）。

**🟢 外储连续 5 个月保持在 3.4 万亿美元之上。** 国家外汇管理局数据。

**🟡 8月物流业景气指数 50.9%，较 7 月回升 0.5 个百分点。** 显示流通端边际改善（[证券日报 9.5](https://www.ts.cn/xwzx/jjxw/202609/t20260907_36274493.shtml)）。

**Mavis 点评**：8月 PMI 是"政策起效+极端天气缓解"双轮驱动的弱反弹，结构上大型企业率先回到扩张、新订单反弹幅度（+2.1pct）大于生产（+0.5pct），说明需求端修复领先于生产端。配合 9 月 7 日的 3600 亿注资 + 8000 亿政策性金融工具落地，9-10 月 PMI 重回 50% 上方的概率不小。

### 2.3 🟣 社会面 S

**🟢 暑期（6-8月）海南离岛免税购物金额 38.2 亿元。** 显示消费仍有结构性亮点（[央视新闻](https://www.ts.cn/xwzx/jjxw/202609/t20260907_36274493.shtml)）。

**🟡 8月制造业 PMI 从业人员指数 48.7%（-0.3pct），非制造业从业人员 45.4% 持平。** 用工景气度仍偏弱，建筑业从业人员 43.0% 改善 +2.1pct；服务业 45.8% 走弱 -0.4pct。

**🟡 1-8月阿拉山口公路口岸出入境车辆超 13 万辆，同比 +40.95%。** 中亚/欧亚通道继续保持高景气。

**🟢 上半年新动能延续扩张：装备制造业 PMI 51.4%、高技术制造业 52.9%、电信广电及卫星传输服务连续 2 个月 ≥55%、互联网及软件技术服务 4 月以来持续 ≥54%。** 这些行业既是就业新增量，也带动居民收入预期边际改善（[国家统计局](http://xjhb.gov.cn/xjzshbsc/c114834/202609/af95205fdb9646469f736dd1c757439a.shtml)）。

**Mavis 点评**：社零的"压力区"在 100 美元以下手机、家电等品类，但"亮点区"在服务消费（暑期海南+口岸出入境）和高端制造就业。政策端（8000 亿工具+3600 亿注资）目标是稳就业和稳预期，传导链条需要 1-2 个季度才能在社零数据上反映。

### 2.4 🔴 技术面 T

**🟥 9月7日华为发布 Mate XT 2 非凡大师，搭载全新麒麟 9050 Pro 芯片。** 这是继 2020 年 Mate 40 系列之后华为时隔六年再次在旗舰新品发布会上推出全新麒麟芯片。麒麟 9050 Pro 集成灵犀 CPU + 马良 GPU + 达芬奇 NPU，马良 GPU 计算单元与缓存翻倍、支持 5000 万线硬件级实时光线追踪；达芬奇 NPU 支持原生盘古 30B-A2B MoE 全模态大模型离线运行。整机性能较上代 +42%。（[南方日报](https://www.nfnews.com/content/16VLmglpyr.html)）

**🟥 9月7日小米发布小米 18 Fold，搭载自研玄戒 O3 芯片（3nm 旗舰 SoC）。** 这是小米首款中折叠旗舰，10999 元起售。同期小米平板 9 Pro Max 首发搭载玄戒 O3 和澎湃 OS 4。小米同时发布 AI 加速芯片玄戒 O100、智驾 AI 芯片玄戒 D100（计划明年商用），形成"人车家全生态"AI 算力底座。

**🟥 9月7日长鑫科技 LPDDR6 量产首发，搭载于小米 18 Fold。** 速率 10667Mbps，是全球 LPDDR6 产品首次落地商用。长鑫科技 LPDDR5X（10667Mbps）同期搭载于努比亚 NaviX Ultra（9.16 发布）。

**🟢 9月4日 Intel 14A 工艺（等效 1.4nm）研发进度大幅超预期。** 缺陷密度 D0 已达 0.5，研发进度为 22nm 节点以来最佳；预计 2028 年上半年率先量产，较台积电 A14 工艺早约半年。该工艺将全面开放代工，争夺苹果、谷歌、Meta 等高端订单。

**🟢 9月3日博通 Q3 财报：营收 296 亿美元同比 +86%，AI 半导体收入 167 亿美元同比 +221%。** CEO 陈福阳给出 2027 财年 AI 收入翻倍至 1150 亿、2028 财年再翻倍至 2300 亿美元的指引。

**🟢 9月3日 Marvell 数据中心业务增长几乎完全来自 AI 集群组件。** 公司正成为制衡英伟达 GenAI 投入的力量，与 AWS、谷歌达成定制芯片大额交易（[半导体行业观察](https://mp.weixin.qq.com/s?__biz=Mzg2NDgzNTQ4MA==&mid=2247831650&idx=5&sn=316fb4f4ab702d98cdb1c005d9731d69&chksm=cf028c633c90324a85145961e5d81bfed3d3f262be7f8dbd1a6e0754ae1954e2f8030ad7b531)）。

**Mavis 点评**：今天（9月8日）早上看技术面是"中国自研+海外定制"两条主线合流——华为/小米把"自研 SoC + 国产存储"压成一台万元旗舰（9月10日苹果首款折叠机将接棒），博通/Marvell 在海外用定制 XPU/光芯片卡位 AI 集群。这两拨看似不同方向，本质都是"GPU 单一中心化→多极分布式"重构。

## 3. 📱 二、重点行业（手机 / 存储 / 芯片）

### 3.1 📱 手机

**🟥 9月7日华为 Mate XT 2 售价 19999 元起，顶配 24999 元。** 展翼三折叠设计（"G"型），机身厚度 3.5mm、展开 10.2 英寸 3K 屏；首发麒麟 9050 Pro + HarmonyOS 7；IP58/59 防护、玄武昆仑玻璃、灵盾防窥屏（[北京日报](https://www.toutiao.com/article/7682858963229999668)）。

**🟥 9月7日小米 18 Fold 售价 10999 元起。** 搭载玄戒 O3 + 澎湃 OS 4 + MiMo 端侧大模型；联合长鑫首发国产 LPDDR6（10667Mbps）；雷军称是"迄今为止最贵的小米手机"。

**🟥 IDC 9月预测 2026 全球智能手机出货量同比 -16.7% 至略高于 10 亿部，创历史最大年度降幅。** 市场总价值预计仍 +6.3% 达 6130 亿美元（价格上涨替代销量）。下半年出货预计同比 -27.2%，100 美元以下机型 Q2 同比 -60%。Android 出货预计 -24.3%，份额一年滑落 7pct；iOS 份额逆升至 23.6% 新高、出货仅 -1.3%；HarmonyOS 增近 3 倍至 5100 万部。

**🟢 折叠屏是唯一例外。** IDC 预计 2026 全球折叠屏出货 +12.6% 至 2290 万部，2027 增速 +18% 至 2700 万部，几乎完全依赖苹果入局。2027 苹果折叠 iPhone 出货将超 1700 万部，约占全球折叠屏 40%。

**🟢 上半年中国市场国产手机分化：华为 +19.4%、苹果 +24.4%；小米 -21.7%、OPPO -9.7%、vivo -11.4%。** Counterpoint 预计 2026 中国主流厂商出货跌幅 15-34%，低端产品线大规模被砍。

**🟢 Counterpoint Q2 2026 全球 Top 10 畅销机型全部被苹果/三星瓜分。** iPhone 17 基础款以 6% 份额登顶，iPhone 17 Pro Max 第二，Pro 第三；前十合计份额 26%（+2pct YoY）。

**🟡 全球 ASP 预计 2026 同比 +22% 至 $450。** 新兴市场（MEA、APAC 其他）涨幅最大（>20%）。Counterpoint 强调：高 ASP 不应解读为厂商定价权增强，而是"低价段被砍+消费者延长换机+二手机迁移"的结构性结果（[Counterpoint](https://counterpointresearch.com/en/reports/market-outlook-smartphone-shipment-and-asp-forecast-by-oem-region-sep-2026)）。

**Mavis 点评**：手机行业是 9 月最热叙事——9月7日华为/小米双旗舰 + 9月10日苹果首款折叠 = "折叠三连发"。本质是"自研芯片 + 国产存储 + 折叠形态"重新定义高端：苹果价格区间首次被国产旗舰正面卡位，HarmonyOS 增速（近 3 倍）是这轮最大惊喜。但行业整体仍在 -16.7% 的出货悬崖上，K 型分化会继续加剧到 2027-2028。

**Mavis 点评**：存储的信号已经从"HBM 单品紧缺"升级为"全品类紧缺"——长鑫 +873% 营收/776 亿净利是这轮景气最直接的中国侧认证；DDR4 8Gb +860% YoY 印证了利基/成熟制程的弹性最大。HBM 双轨价格（4-5 倍溢价）说明长协世界和现货世界脱钩，超级周期仍在中段。

## 4. 🏭 三、上下游产业链

### 4.1 原材料

**🟡 9月4日 LME 伦铜 14494 美元/吨（+0.80%），沪铜主连 109890 元/吨（+0.62%）。** 国际油价上涨 + 美元指数走弱推升基本金属。

**🟡 半导体材料国产化率快速提升。** 部分高端电子特气、湿电子化学品品类的国产化率超过 30%。

**Mavis 点评**：铜价 +0.8% 在"工业金属弱复苏"叙事里是温和信号，但半导体材料的 30% 国产化率是产业升级的硬指标——长鑫/长江存储的产能扩张直接拉动了国产材料厂的订单池。

### 4.2 设备 / 材料

**🟥 北方华创（002371）9月7日中标成都飞机工业（集团）"高精度综合镀膜设备"项目，投标报价 1010 万元，交付周期合同签订后 8 个月内到货，2 个月内完成安装调试。** 验证了"设备龙头跨领域中标"。

**🟥 苏州威微电子材料有限公司"采购半导体设备第七十一批（二次）"项目，最终成交人为浙江求是半导体设备有限公司。** 公示期 9.3-9.7。

**🟢 精智达：2026 上半年研发费用 1.55 亿元（+154.06%），占营收比重 19.28%。** 已在上海、武汉落子布局，并筹划面向特定对象的再融资投向存储测试设备研发与智能制造。

**🟢 拓荆科技：PECVD 设备在国内头部晶圆厂采用率已超 30%，上半年净利 13.43 亿元已超去年全年；合同负债 51.31 亿元创历史新高。**

**Mavis 点评**：北方华创这种"半导体设备厂中标军工项目"和"求是半导体中标半导体设备项目"两则公告，揭示了 2026 的产业特征：国产设备厂订单从晶圆厂扩产一路扩散到军工、检测等垂直领域，"国产替代"已经从单一行业故事变成全产业链趋势。

### 4.3 制造 / 封测

**🟢 长江存储 232 层 3D NAND 闪存量产；通过双层堆叠可达 294 层。** 月产能约 16-20 万片晶圆，占全球 NAND Flash 产能 13-14%。

**🟢 中芯国际上海临港基地主攻 28nm 及以下、规划从 12 万片/月突破到 16 万片。** 华虹无锡二期 2026Q3 满产、粤芯半导体三期达产、四期开建。

**🟥 通富微电：2026 上半年预计净利 16-18 亿元（同比 +288.26% 至 +336.80%）。** Q1 合同负债同比 +209.75%，海太半导体 HBM 封测订单同比 +150%。HBM 产能缺口 50-60%。

**🟢 华天科技：预计归母净利同比 +200%+。** 订单饱满。

**Mavis 点评**：制造端"中芯+长鑫+长江存储"形成"成熟制程+DRAM+NAND"三角支撑，封测端"通富+华天"承接 HBM 与先进封装增量。封测合同负债 +209% 是 HBM 紧缺最直接的二阶证据——上游算不完的订单最终堵在封测端。

### 4.4 下游应用

**🟢 服务器 / 数据中心：** 戴尔 FY27Q2 财报电话会直言"缺的就是 DRAM"，950 亿美元 AI 服务器积压订单卡在内存上。

**🟢 PC / 消费电子：** Counterpoint 2026 H1 全球 PC DRAM 合约价上涨但涨幅收窄；终端零售涨价抑制消费、笔记本出货大幅下滑。TrendForce 2026Q3 一般 DRAM 合约价 +13-18%、NAND 合约价 +10-15%。

**🟢 新能源车 / 工业控制：** Omdia 数据全球 DRAM 市场需求有望持续增长，受益 AI、汽车电子、5G 应用驱动。

**🟢 中际旭创 2026 H1 营收 417.78 亿元（+182.49%），归母净利 136.51 亿元（+241.7%）。** 9月7日 A 股 CPO 概念集体大涨，中际旭创 H 股盘中涨逾 16%。

**Mavis 点评**：下游应用是"K 型分化"——AI 算力（中际旭创 +182%、博通 AI +221%）和 HBM 封测（通富 +288%）一端狂飙，传统 PC/笔记本在零售端被高 ASP 压制；汽车和工业控制是稳态需求。这套结构性分化会贯穿 2026 整年。
