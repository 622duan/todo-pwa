## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**9.28 国务院常务会议（最重磅）**

9月28日，国务院总理李强主持召开国务院常务会议，研究宏观政策发力提效、促进有效投资有关工作，并听取新污染物治理进展情况汇报，审议通过《事业单位登记管理条例（草案）》。会议明确"针对当前经济运行中出现的问题，要加大宏观政策逆周期调节力度"，释放出加强逆周期调节、稳定市场预期、增强发展后劲的鲜明信号（[中国青年网](https://news.youth.cn/gn/202609/t20260929_16892931.htm)）。

会议三大要点：

1. **存量政策加速落地**：加快各类债券发行使用进度；推动"十五五"规划、"六张网"实施方案明确的重大工程项目尽早开工；推进老旧水库、老旧粮库改造提升；加力实施扩投资、促消费贴息政策。
2. **增量政策储备出台**：用好地方政府债务结存限额；综合运用并适时调整货币政策工具；增加科技创新和技术改造、支农支小等再贷款额度；研究出台稳定房地产市场、促进就业增收等政策措施。
3. **稳投资协同发力**：高质量做好项目准备、激发民间投资活力、提高投资审批效率。

🟥 **关键数据**：8 月新增专项债 5188 亿元，年内单月第二高；截至 9 月 27 日新增专项债累计 3.36 万亿元，发行进度达 76%。下半年还有 2 万多亿元专项债+超长期特别国债待发行，规模历年最大（[中国经济网](http://m.ce.cn/gp/gd/202609/t20260928_3237911.shtml)）。

**Mavis 点评**：9.28 国常会等于明确告诉市场——Q4 政策会再加力。从表态顺序看，"科技创新和技术改造再贷款""房地产稳定""就业增收"三大增量大概率在 10-11 月陆续落地，对应到股市是半导体设备、地产链、消费三条线。央行 Q3 货政例会把"跨周期"删掉只剩"逆周期"，降息降准的窗口最快在 10 月。

**财政部 / 央行协同**

- 央行 9.20 LPR 连续 16 个月持稳：1年期 3.00%，5年期以上 3.50%（[新华网](https://www.xinhuanet.com/fortune/20260921/b13ec3848bd14acf903ff4e58c8f4238/c.html)）。9 月美联储加息落地、欧日央行跟进，但人民币汇率稳中有升，给国内"以我为主"留出空间。
- 财政部 1-8 月一般公共预算收入 15.66 万亿元，同比 **+5.7%**；其中税收收入 +6.6%。个人证券交易印花税 🟥 同比 **+82%**（[人民网](https://finance.people.com.cn/BIG5/n1/2026/0918/c1004-40801386.html)）—— 股市成交活跃直接反映到税收端。

**"六张网"加速推进**

"十五五"开局之年的重大部署——"六张网"（物流网、水网、电网、油气网、地下管网、信息通信网）。《物流网建设实施方案》已于 8 月正式印发，南水北调中线引江补汉工程等一批重大项目正在加快建设。前 8 个月与"六张网"相关的互联网和相关服务业投资同比 **+42%**，航空运输业、水上运输业投资分别 +16.7%、+14.7%，电力供应业投资 +12.7%。

**Mavis 点评**：政策面今天是肉眼可见的发力日。9.28 国常会 + LPR 持稳释放空间 + 专项债 76% 进度形成组合拳——四季度增量政策已经在路上。重点跟踪三个节点：①10 月中下旬的政治局会议；②11 月初的人大常委会；③12 月初的中央经济工作会议。

### 2.2 🟠 经济面 E

**8 月经济数据全景（9.15 国家统计局发布）**

8 月国民经济延续"总体平稳、向新向优"发展态势，但内部结构分化明显（[国家统计局](https://www.stats.gov.cn/sj/zxfb/202609/t20260915_1965307.html)）。

| 指标 | 8 月当月 | 同比 | 1-8 月累计 | 同比 |
|------|---------|------|-----------|------|
| 规模以上工业增加值 | +5.2% | 较 7 月 +0.7pct | — | +5.3% |
| 装备制造业 | 🟥 +12.1% | — | — | — |
| 高技术制造业 | 🟥 +16.7% | — | — | +14.2% |

| 房地产开发投资 | — | — | 47979 亿元 | -19.9% |

**8 月 PPI 同比 +3.8% 大超预期**（市场预期 3.6%），涨幅较 7 月扩大 0.3pct。三大推手：
1. **输入性大宗商品涨价**——石油开采 +10.5%、有色冶炼 +20.8%、化学原料 +9.1%，4 个行业合计拉动 PPI 上涨约 2.58pct。
2. **产业升级带动**——电子电路制造 +6.6%、VR 设备 +6.0%、服务消费机器人 +2.1%。
3. **季节性因素**——煤炭开采 +26.6%（迎峰度夏 + 供应阶段性偏紧）。

**进出口数据（海关总署 9.8 发布）**

- 前 8 个月货物贸易进出口总值 34.78 万亿元，🟥 **同比 +17.6%**。
- 出口 20.17 万亿元（+14.6%），进口 14.61 万亿元（+22.0%）。
- 8 月单月进出口 +19.8%，其中出口 +18.6%、进口 🟥 **+21.7%**（连续 6 个月进口增速超出口）。
- 对东盟 +20.6%、欧盟 +8.1%、美国 +1.3%、共建"一带一路"+15.9%。
- 🟥 1-8 月 **高技术产品出口额 +37.1%**，其中集成电路 🟥 **+95.4%**（[海关总署](http://www.customs.gov.cn/customs/2026-09/09/article_2026090909552693039.html)）。

**Mavis 点评**：进出口数据最炸的是集成电路出口 +95.4% 和电动载人汽车——这两个数据完全验证了"新三样"和芯片国产化的双轮驱动。但 8 月固定资产投资 -7.2%、地产开发 -19.9% 是重大警示，外强内弱格局明显。瑞银测算 2026 年 AI 资本支出 9980 亿美元、2027 年 1.447 万亿美元 —— 这部分增量主要进了亚洲存储厂商的口袋。

**9 月制造业 PMI 49.8%**

9 月制造业 PMI 49.8%，较 8 月 +0.4pct，仍处于收缩区间但景气回升（[国家统计局](https://www.stats.gov.cn/xxgk/sjfb/zxfb2020/202608/t20260831_1965154.html)）。生产指数 51.9%（+1.1pct，近 6 个月高点），新订单 49.7%（+0.2pct），新出口订单 47.8%（+0.6pct）。装备制造业 PMI 51.6%、高技术制造业 PMI 51.9% 都在扩张区间；高耗能行业 PMI 47.5% 持续收缩。

**Mavis 点评**：PMI 解读的关键是新动能接棒——装备 + 高技术贡献了超过 60% 的工业增量，传统基建地产拖后腿。财新制造业 PMI 9 月降到 49.3%，但 9 月有闰月与中秋错位，可观察性弱。预计 10 月 PMI 在政策落地后会更好看。

### 2.3 🟣 社会面 S

**就业：8 月失业率 5.3% 季节性回升**

8 月全国城镇调查失业率 5.3%，比 7 月上升 0.1pct。本地户籍 5.3%、外来户籍 5.2%（外来农业户籍 5.0%）。31 个大城市 5.3%。新毕业学生集中进入劳动力市场带来季节性影响，但 30-59 岁劳动力主体人群失业率 3.9% 与上月及上年同期持平。1-8 月平均 5.2%，与上年同期持平（[国家统计局](https://www.stats.gov.cn/sj/zxfb/202609/t20260915_1965307.html)）。

新职业、新工种方面，9 月初人社部联合多部门正式发布第八批新职业、新工种目录，新增 **11 个新职业、23 个新工种**，涵盖具身智能机器人应用技术员、低空物流员、企业可持续发展规划师等。聚焦数字经济、绿色低碳、民生服务、高端制造四大领域。

**消费：8 月零售总额 +0.4%**

8 月社零 39824 亿元，同比 +0.4%（市场预期放缓）。1-8 月服务零售额 +4.9%，网上商品和服务零售额 +4.6%，通讯信息服务类、旅游咨询租赁服务类零售额增速都在 10% 以上。限额以上仓储会员店、无人值守商店零售额增长 25%+。乡村消费 +1.6% 快于城镇 +0.2%（[国家统计局](https://www.stats.gov.cn/sj/zxfb/202609/t20260915_1965311.html)）。

8 月当月数据：粮油食品 +4.0%、烟酒 +12.5%、通讯器材 🟥 **+27.3%**、金银珠宝 -17.5%、汽车 -18.5%、家具 -7.9%。

**民生：通信器材爆涨、汽车腰斩**

🟥 通讯器材类零售额 +27.3% 的背后是存储涨价推动的手机 PC 涨价潮——消费者在涨价前抢购；汽车 -18.5% 是新能源汽车补贴退坡叠加观望情绪。1-8 月二手房交易网签面积 5.5 亿平米，连续多月高于新房销售面积；8 月新建商品房销售面积 -12.1%，二手房 +10.6%，市场进入存量主导阶段。

**Mavis 点评**：消费数据两极化——必选消费（粮油、烟酒）和升级消费（通讯器材、文旅）韧性最强，中间可选消费（汽车、家具、家电）最弱。这种结构跟居民收入预期偏弱、消费分层加剧有关。预计 Q4 消费数据会受双十一 + 国庆出行提振，但中长期看，扩容的关键还是收入预期。

### 2.4 🔴 技术面 T

**AI / 大模型 / 算力：九月三项突破**

🟥 **9.17 华为全联接大会发布昇腾 960 超节点**：全球首个采用 NPO（近封装光学）光引擎 Hi-ONE 的超节点，可扩展至 4096 卡，实现 8 EFLOPS FP8 / 16 EFLOPS FP4。多个昇腾 960 通过灵衢/RoCE 连接，最大集群 51.2 万卡，再结合多轨道拓扑技术可支持 **100 万卡昇腾超节点集群**。Kimi K3 已达 2.8 万亿参数、Qwen3.8 达 2.4 万亿参数，国产模型正向十万亿级推进（[科技日报](https://www.toutiao.com/article/7686374000443834886)）。

应用材料 FY26Q3（截至 7.26）营收 **91.15 亿美元**（同比 +24.8%），毛利率 50.4%，EPS 3.50 美元，均创新高。中国市场贡献半导体系统与 AGS 业务整体收入的 **26%**（[应用材料投资者关系](https://ir.appliedmaterials.com/news-releases/news-release-details/applied-materials-announces-third-quarter-2026-results)）。管理层上调 2026 半导体系统收入预期，预计 2026 包装业务收入 +70%+。

**Mavis 点评**：九月是国产算力集中爆发的月份——华为昇腾 NPO 超节点（架构创新对冲制程封锁）、移动云 GPU+类脑异构（架构创新对冲 HBM 短缺）、长鑫 G5（追赶顶尖内存制程）、智元 2 万台量产（具身智能商用验证）——每一项都是国产替代或架构创新的标志性事件。这不是巧合，而是 2026 年作为"十五五"开局之年技术体系化突破的反映。

### 4.2 设备 / 材料

**国产化率：长存三期超 50%**

长存三期 50%+ 设备来自本土供应商（高于公司整体 45%）。华鑫证券表示产线设备国产化率最高超 50%，东吴机械与国泰海通测算新厂国产化率约 **60-70%**。

中微公司刻蚀机已在长鑫 DRAM 多个关键制程批量应用；CCP 刻蚀机 Q3 营收 31.01 亿元（同比 +50.62%），LPCVD 与 ALD 设备收入 4.03 亿元（同比 +13 倍）。

拓荆科技 PECVD + ALD 设备已通过验证并量产，Q3 营收 22.66 亿元（同比 +124.15%），净利润 +225.07%。董事长吕光泉表示先进制程机台逐步量产，在手订单充足。

**ArF 光刻胶 / EDA / 关键材料**

国内 ArF 光刻胶树脂单体行业（截至 2026.9）需求受四重因素共振：
1. 国内 12 英寸晶圆厂大规模建设（直接拉动）；
2. 28nm 及以下先进制程推进（推动高端化）；
3. DRAM + 3D NAND 存储芯片扩产（贡献弹性）；
4. 供应链安全战略下国产替代加速（结构机遇）。

国内破冰者：徐州博康、晶瑞电材、南大光电、彤程新材、上海新阳。竞争格局：国际巨头（三菱、住友、信越、JSR、TOK、陶氏杜邦）绝对主导，国内企业从单体合成或树脂聚合单一环节切入，部分产品进入中试或小批量验证阶段。

中信证券预计较为紧缺的重掺硅片下半年有望继续涨，相关公司可能在 9-10 月调涨明年长协价格，意味着涨价周期至少持续到 2027 年。

**Mavis 点评**：设备 / 材料是国产替代兑现的最高质量环节——长存三期 50-70% 国产化率、长鑫多制程批量导入、中微 / 拓荆 / 华海清科订单饱满三个证据互相印证。但风险点是上游零部件海外依赖度仍高（射频电源、真空泵等国产化率不足 10%）。

### 4.3 制造 / 封测

**SMIC / 华虹 / 长鑫 / 长存**

12 英寸晶圆厂扩产清单（截至 2026.9）：
- 中芯国际：京城（北京，76 亿美元，10 万片/月，28nm）一期投产；东方（上海临港，88.7 亿美元，10 万片）；西青（天津，75 亿美元，10 万片）；深圳（23.5 亿美元，4 万片）已投产。
- 华虹半导体：无锡九厂 Fab 9A 67 亿美元 8.3 万片/月 26Q3 满产；Fab 9B 2026.3 开工。
- 长鑫存储：合肥 DRAM 现有约 12 万片/月，规划扩至 20+ 万片；G5 工艺量产。
- 长江存储：武汉现有约 10 万片 232 层 NAND，规划扩至 15+ 万片；三期 2026 底投产、2027 月产能 5 万片。

**封测：先进封装**

通富微电、长电科技、华天科技 —— 受益于先进封装扩产潮（AI 算力、数据中心需求快速推动）。安靠、深科技、芯爱科技、易卜半导体等国内外厂商纷纷宣布或启动相关扩产项目。先进封装站上超级风口。

**Mavis 点评**：制造端进入"产能扩张 + 国产化 + 先进封装"三轮驱动。中芯京城、东方、西青三厂同步爬产 + 长鑫 / 长存持续扩产 + 华虹 9A/9B 双线，2026-2027 是国产制造产能集中爆发的窗口。先进封装是下一个 Alpha 来源。

### 4.4 下游应用

**PC / 平板 / 服务器 / 新能源车**

PC：存储涨价带动整机上涨。经销商反馈："现在内存和硬盘价格都在疯涨，整机的价格预计在三年以内都很难下来。起步涨幅就是 800 元到 1000 元。" 以游戏笔记本为例，整体价格拉高 5000 元；去年原价 1 万元的拯救者现在 1.5-1.6 万元（[济南时报](https://www.jinantimes.com.cn/news-39-5307390.html)）。

服务器 / AI 算力：瑞银大幅上调全球 AI 资本支出预测——**2026 年 9980 亿美元**（较 2025 年 5060 亿翻倍），**2027 年 1.447 万亿美元**。上修主要源于内存价格快速攀升。

新能源车：1-8 月汽车出口 🟥 **+47.1%**（海关数据）。8 月规上工业产品中锂离子电池 +57.2%、工业机器人 +34.6%、3D 打印设备 +29.9%。

**Mavis 点评**：下游应用最确定的是服务器 / AI 算力（瑞银测算资本支出翻倍），最承压的是 PC（涨幅被消费者吸收）。新能源车出口是亮点但国内销量疲软。具身智能（人形机器人）从概念验证走向规模出货，是中国供应链在新一波技术革命中的最大机会。

## 6. ✏️ 五、编辑后记

**今天的 4 条主线：**

第一条线是政策加力。9.28 国常会、央行 Q3 货政例会、专项债 76% 进度三个信号共同指向 Q4 增量政策在路上——财政端的"科技创新和技术改造再贷款""支农支小再贷款""房地产稳定""就业增收"等增量工具大概率 10-11 月落地。从今天 A 股表现看，沪指 3888（9.11 跌 1.18%）后回升至 3911（9.18 涨 0.94%）、科创 50 反弹 4%（9.16）反映市场情绪逐步修复。

第二条线是存储涨价的连锁反应。9.15 苹果接受三星 2027 Q1 报价 +30-40% 是标志性事件——意味着全球最大存储买家也扛不住了。苹果 iPhone 18 Pro +1000 元、小米 18 Fold +1500 元、华为 iPad +800-2000 元、PC 游戏本 +5000 元、闪迪 1TB SSD "早上一个价下午一个价"。整个消费电子行业的成本结构正在被重写。

第三条线是国产算力的体系化突破。9 月三件大事——华为昇腾 960 NPO 超节点（架构创新对冲制程封锁）、移动云 GPU+类脑异构（架构创新对冲 HBM 短缺）、长鑫 G5 量产（追赶顶尖内存制程）——集中体现了"以架构创新弥补工艺约束"的国产化思路。智元机器人 9.24 第 2 万台下线，2026 H1 中国占全球人形机器人出货 97%，中国供应链在新一波技术革命中卡位领先。

第四条线是半导体设备的订单兑现高峰。北方华创 850 亿在手订单 + 中微 50%+ 增速 + 拓荆 60-70% 增速 + 华海清科 100 亿订单预期，2026H1 合同负债同比 +6.5%。订单到收入 8-12 个月时滞，意味着 2027-2028 才是业绩弹性最大窗口。

**Mavis 独立判断（5 条）：**

1. 🟢 **存储 Q3 涨幅收敛是既定趋势，但 2027 才是供应最差的一年**。TrendForce / 大摩 / 瑞银 / 高盛 / 野村五大行一致看多，区别只在涨幅和时点。DDR4 8Gb 同比 +860% 已成过去式，Q4 涨幅可能收敛至 3-8%，但 Q1-Q2 2027 大概率二次冲顶（苹果长约生效、HBM4 产能爬坡、消费端旺季）。

2. 🟠 **iPhone 18 推迟到 2027 春季暴露了一个结构性矛盾**：标准款定价空间被存储涨价压缩到无利可图。苹果的应对是——用 Pro 系列 + 折叠屏 Duo 收割高溢价，把入门款推迟。这说明 2027 春季标准版 iPhone 定价不会便宜（猜测 799 美元起）。对安卓厂商也是同样的命题——千元机市场加速萎缩。

3. 🟢 **国产存储 + 设备的双轮驱动已经走完 0 到 1，正在 1 到 N**。长鑫科技 H1 营收 +873% + 净利率 82%（超 SK 海力士）证明国产 DRAM 商业模式跑通；长江存储 NAND 全球第三 14% 份额 + 三期投产打开 1 到 N 的产能空间；北方华创 + 中微 + 拓荆订单饱满但业绩后置 2027-2028，给了我们未来 2-3 年的高确定性 Alpha 来源。

4. 🟡 **人形机器人 4 万台出货 + 97% 中国份额是惊人的产业成绩，但商业化闭环还在验证中**。宇树从 0 到 IPO 用了 5 年，智元从 6 台到 2 万台用了 3 年——但目前订单 70% 仍来自文娱商演 + 科教数采，工业和商用服务是下一波。金沙江朱啸虎退出多家具身智能公司、估值虚高、IPO 后估值 800-900 倍市盈率，都提示赛道正在分化，能把订单变复购变独立第三方收入的公司才能穿越周期。

5. 🟠 **9.28 国常会后 Q4 增量政策的看点是"结构性货币政策"而非全面降息**。温彬、王青等首席经济学家都认为央行可能在 Q4 实施 10bp 政策性降息 + 0.5pct 降准，但更核心的工具是"科技创新和技术改造再贷款""支农支小再贷款"等结构性工具——前者利好半导体设备 / 国产替代，后者利好小微 + 农业。对 A 股意味着"质重于量"——结构性政策受益板块（设备、材料、信创、消费）比全面宽松受益板块（金融、地产）更有持续性。

**风险提示：**

- **存储**：Q3 涨幅收敛后市场可能误读为"周期见顶"，但实际是消费端见顶、企业端还没见顶。Q4 价格分歧加大。
- **手机**：消费者换机周期拉长到 40+ 个月，IDC 预测下半年中国市场出货同比降幅扩大至 20%。

- **流动性**：美联储 Q4 可能再加息，美债 10Y 突破 4.8%，对全球资产估值压力持续。
