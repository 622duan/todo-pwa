## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**1) 9.11 国务院常务会议：算力网建设提级为 AI 基础设施顶层设计**
李强总理主持的国常会明确将算力网列入"六张网"之一，要求"合理布局、规范有序"，避免重复建设和"机柜规模比拼"；强调算电协同、算网融合，推动骨干光纤、绿电直连、源网荷储一体化落地。这是 AI 算力第一次以中央顶层会议形式确立"国家级基础设施"定位。发改委披露我国已建成"8+10+3"算力空间布局（8 大国家算力枢纽 + 10 大集群 + 3 个算电协同区域）。[来源](https://www.toutiao.com/article/7686269028800758308/) · [来源](https://news.qq.com/rain/a/20260912A02YI400/)

**2) 9.10 两部委联合印发《电子信息制造业发展"十五五"规划》**
工信部、国家发改委联合发文：到 2030 年电子信息制造业营收 **突破 30 万亿元**，研发投入强度达 3.5%；明确集成电路、消费电子、基础电子、能源电子四大新增长点；将"算力网、算电协同、存算一体、量子计算、光计算、类脑计算"列为先进计算新范式；提出 AI 终端、超 10 万卡智算集群、太空计算等具体目标。这是产业级"AI+电子"融合的纲领性文件。[来源](https://gxj.ordos.gov.cn/ywgz/202609/t20260915_1957469.html) · [来源](https://jingji.cctv.com/2026/09/16/ARTIoE4PmXabSHcerWzQHadV260916.shtml)

**3) 9.10 九部门联合印发《智能网联新能源汽车产业发展"十五五"规划》**
工信部、发改委、公安部等九部门发文：到 2030 年国内新能源乘用车、商用车占新车销量比分别达 **70%、40%**；具备自动驾驶功能汽车规模应用；明示新能源车销量从 2020 年 136.7 万辆增至 2025 年 **1649 万辆**，年均复合增速 **65%**；组合驾驶辅助搭载率从 16.2% 升至 64.9%。文件将"治理非理性竞争"列为核心任务之一，剑指"内卷式"价格战。[来源](https://www.toutiao.com/article/7684453617385931305/) · [来源](https://news.cctv.cn/2026/09/12/ARTIccSQzv1YdAKqarH0dHm3260912.shtml)

**4) 央行副行长陆磊披露"金融强国十五五"框架**
9.10 国新办发布：到 2030 年形成中国特色现代金融体系总体框架；境外主体持有境内人民币金融资产 **超 11 万亿元**；1-7 月人民币跨境收付超 **50 万亿元**，货物贸易人民币收付占比达三成（历史最高）；熊猫债累计发行 **超 1.3 万亿元**，覆盖 26 个国家和地区。[来源](https://www.qstheory.cn/20260913/57ae2d26a2be484dab5308a55fc4a4f2/c.html)

**5) 国办 9.8 印发《关于加强中小企业回款难问题治理有关工作的通知》**
直面"大企业拉长账期、用票据替代现金、验收结算人为拖延"等沉疴，从行业账款支付规则、大企业支付行为监管、非现金支付工具规范三方面构建全链条治理体系。[来源](https://www.qstheory.cn/20260913/57ae2d26a2be484dab5308a55fc4a4f2/c.html)

**6) 应急管理部 9.15 党委会议贯彻国常会安全生产要求**
针对青岛 9.10 北海造船厂货轮火灾事故，要求"中秋国庆假期"前紧盯重点行业，中央企业加强造修船、建筑施工、化工等行业外包业务安全监管。[来源](https://yjgl.fuxin.gov.cn/content/2026/1105882.html)

**Mavis 点评**：算力网顶层设计 + 30 万亿电子信息规划 + 70% 新能源汽车渗透率目标，三个产业纲领在同一周落定，"十五五开局年"的产业政策密度是过去十年最高的。🟢 偏积极——政府把 AI 算力、消费电子、新能源车三条主线拉成产业骨架，配套半导体国产化与新能源汽车非内卷治理，避免重蹈光伏与锂电的"散、乱、小"覆辙。

### 2.2 🟠 经济面 E

**1) 8 月经济数据 9.15 国新办发布，呈现"三稳两快"**
国家统计局付凌晖介绍：8 月规上工业增加值同比 **+5.2%**（环比 +0.54%）；服务业生产指数 **+4.1%**；社零 **3.98 万亿元，同比 +0.4%**（环比 -0.13%）；1-8 月固投 **29.31 万亿元，同比 -7.2%**；1-8 月进出口 **34.78 万亿元，同比 +17.6%**；城镇调查失业率 **5.3%**（环比 +0.1pp，季节性）；30-59 岁失业率 **3.9%**（持平）；核心 CPI **+1.0%**；PPI **+3.8%**（涨幅扩大 0.3pp）。[来源](https://www.zhonghongwang.com/show-291-472312-1.html) · [来源](https://big5.china.com.cn/zhibo/content_118694583.htm)

**2) CPI 与 PPI 双回暖，但核心 CPI 仅 1.0%**
8 月 CPI 同比 +0.8%（能源贡献 +0.28pp，占改善量约 8 成），核心 CPI 同比 +1.0%；PPI 同比 +3.8%、环比 +0.4%（石油开采 +10.4%、精炼石油 +4.1%）。"输入性"和"内生性"分野明显：能源 + 黄金饰品贡献近 80% CPI 涨幅，**食品端猪肉 -11.8%、鲜菜 -2.8%** 仍在拖累；国家统计局公开提醒"价格内生动能尚不稳固"。[来源](https://paper.people.com.cn/rmrbhwb/pc/content/202609/11/content_30180571.html)

**3) 1-8 月进出口 34.78 万亿元创纪录，机电产品出口 +21.9%**
海关总署：8 月单月进出口 **+19.86%**（出口 +18.6%、进口 +21.7%），连续 3 个月超 4.5 万亿元；**AI 相关产品**集成电路出口同比 **+130.6%**（8 月单月 407.3 亿美元），自动数据处理设备及零部件 **+77%**，合计贡献当月机电出口增量的 **55.8%**。民营企业进出口 **+17.6%**，占比 56.9%；对东盟、非洲、拉美出口分别 **+20.6%、+18.5%、+14.5%**。进口端：集成电路 **+55.1%**、铜矿砂 **+28.5%**、机电产品 **+31.6%**。[来源](http://www.cmiy.com/news/1267678) · [来源](https://silkroadonthecloud.cn/f/view-A1005005-2098337164247621632.html)

**4) 投资结构向"新向优"**
1-8 月固投 -7.2%，但高技术产业投资 **+5.2%**（连续 3 个月加快）、**互联网和相关服务业投资 +42%**（"六张网"驱动）、航空运输 **+16.7%**、电力供应 **+12.7%**。知识产权产品投资 **+9.2%**（占固投 15.2%），其中 R&D 投资 +7.8%、计算机软件和数据库 +10.9%。**设备购置投资 +9.3%**（大规模设备更新效应）。[来源](https://finance.people.com.cn/BIG5/n1/2026/0916/c1004-40799332.html)

**5) 房地产"以旧换新"放量：1-8 月二手房网签 5.5 亿平方米**
1-8 月新建商品房销售面积 -12.1%、销售额 -13.0%；**二手房交易网签面积 +10.6%**，连续多月超过新房。70 个大中城市中，48 城二手住宅价格同比降幅收窄（一线收窄 1.0pp）。新建商品房待售面积同比 -1.1%（连续 6 个月下降，3 年以下库存 -4.2%）。[来源](https://big5.china.com.cn/gate/big5/news.china.com.cn/2026-09/15/content_118696515.html)

**6) 8 月外汇储备升至 34383 亿美元**
国家外汇管理局 9.7 数据：8 月末外汇储备 **34383 亿美元**，环比 +195 亿美元（+0.57%），人民币汇率与外贸韧性共同支撑。[来源](https://www.qstheory.cn/20260913/57ae2d26a2be484dab5308a55fc4a4f2/c.html)

**Mavis 点评**：🟡 数据"三稳两快"看着漂亮，但拆开看是**外贸 + AI 出口 + 房地产以旧换新**三件外衣撑着——内部需求（CPI 内生 + 固投 -7.2%）仍弱。新动能对规上工业增长贡献已超 **60%**，但制造业 PMI 仍在 **49.8% 收缩区**，意味着扩张主要由"AI+新质生产力"少数赛道撑起。**8 月 4.65 万亿进出口**是新数据点，AI 算力出口单月同比 +130% 是真正的"超级引擎"。

### 2.3 🟣 社会面 S

**1) 失业率 5.3%，季节性上升**
8 月城镇调查失业率 5.3%（环比 +0.1pp），主要为新毕业学生集中进入劳动力市场。**30-59 岁主力人群失业率仅 3.9%**，与上月和去年同期持平。**周均工作时间 48.2 小时**（年偏高）。[来源](https://big5.china.com.cn/zhibo/content_118694583.htm)

**2) 服务消费 +4.9%，可穿戴智能设备 +25%**
1-8 月服务零售额 +4.9%（快于商品零售的 +1.0%）；通讯信息服务类、旅游咨询租赁服务类零售额增速都在 **10% 以上**；可穿戴智能设备零售额保持高速增长，**高能效家电零售额增速超 25%**；仓储会员店、无人值守商店零售额增速都在 **25% 以上**。乡村消费 +2.3%（增速比城镇高 1.3pp）。[来源](https://big5.china.com.cn/gate/big5/news.china.com.cn/2026-09/15/content_118696515.html)

**3) 农村 + 入境游双引擎**
入境免签政策显效带动入境游：1-8 月境外游客入境购物、文旅体验消费呈良好增长态势；乡村商业物流体系持续完善，乡村消费 +2.3%，超过城镇 1.3pp。

**4) 9.10 美国 CPI 3.4% 持平，市场押注 9 月 87% 加息**
8 月美国 CPI 同比 +3.4%（核心 +2.4%）；受能源驱动，CME FedWatch 显示 9.15-16 FOMC 加息 25bp 概率从一周前 60% 升至 **87.3%**。欧洲央行 9.11 已加息 25bp 至存款利率 2.50%。[来源](https://xueqiu.com/2027585663/408988985)

**5) 医药：创新药出海 + 医保双轨制 + AI 制药**

**主线一：算力网顶层设计 + AI 算力产业政策密集落地。** 国常会（9.11）将算力网列入"六张网"；工信部+发改委发布《电子信息制造业"十五五"规划》（2030 营收 **30 万亿元**）；九部门联合发布《智能网联新能源汽车"十五五"》（2030 国内新能源乘用车占比 **70%**）；央行副行长披露"金融强国十五五"框架。**这一周的政策密度是过去十年最高的**。

4. **🟢 折叠屏是手机行业的"卡位战"。** 9.7-9.10 三巨头 72 小时三连发（华为 Mate XT 2 / 小米 18 Fold / 苹果 iPhone Duo），本质是为直板机市场"找新故事"。Counterpoint 预测苹果折叠屏首年占 28% 市占，**全球折叠屏 2026 +80% 至 5000 万部**。

5. **🟡 "三叉戟"上行风险：原油 100 + 红海曼德 + 美伊。** 布伦特破 100 美元 7 周来首次；胡塞武装夺取穆哈港 + 可能控制曼德海峡丕林岛；霍尔木兹通行远低于战前。**全球船期表正在从"选哪条线更便宜"退化成"还有没有能过的口子"**。
