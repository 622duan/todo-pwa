## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

🟥 **9 月 10 日两部委联合印发《电子信息制造业"十五五"规划》**（工信部联规〔2026〕216 号），9 月 23 日密集解读全文公布：
- 目标 **2030 年规模以上企业营业收入突破 30 万亿元**（2025 年 17.4 万亿），研发投入强度 3.5%
- 17 项重点任务、"筑基、提质、育新、治理"四维框架
- 集成电路全链条攻关：高端处理器、高密度存储器、做精成熟制程、提高先进制程、补齐装备 / 材料 / EDA / IP
- 算力层面：支持数十万卡级 AI 集群、推动 CLink 统一协议、设立先进计算国家科技重大项目
- 先进计算、能源电子、人工智能硬件底座三大新赛道（含钙钛矿叠层、固态/钠电池、端侧 AI 芯片）
- AI 芯片层面：推广 GPGPU、ASIC、SoC 综合能力、布局软硬耦合推理芯片新路线

🟥 **9 月 22 日发改委发布会**（李超新闻发言人）：

- 上半年水网建设吸引民间投资 **108 亿，同比 +85.8%**
- 🟥 **北斗产业规模五年内突破 1 万亿**（2025 年 6290 亿），加快出台《卫星导航条例》
- 应对厄尔尼诺：今年秋冬季"超强厄尔尼诺"，到年底达峰值

🟥 **9 月 18 日商务部** 公布 | **前 8 月外贸 34.8 万亿，+17.6%**（出口 +14.6%、进口 +22%）；机电产品进出口 19.1 万亿、+24.9%；集成电路进出口 +68.1%；跨境电商 + AI 应用率超 60%

🟥 **9 月 23 日广西金融业"十五五"规划**：争取数字人民币试点扩至全区、跨境结算

**Mavis 点评**：本周是政策大周——"十五五"专项规划进入集中发布期，电子信息制造业 + 轻工纺织 + 非遗 + 广西金融四箭齐发。**电子信息制造业"十五五"规划是绝对头牌**，"筑基、提质、育新、治理"四维框架 + 30 万亿目标把"十四五"的"专项行动"升级为"整体规划"，这是中国半导体战略从"补短板"切换到"铸长板"的标志。**注意发改委 36 个民间项目 + 156 亿是定向发糖，但规模有限；北斗 5 年破 1 万亿目标相对激进**（2025 年 6290 亿，需年化 +9.7%）。

**Mavis 点评**：LPR 16 个月不动反映"以我为主"——海外在加息周期（美联储、欧央行、日央行），中国却按兵不动，靠结构性工具"降价、增量、扩围"。**M1 连续 5 月回升 + M2-M1 剪刀差收窄**是少有的正面信号——企业短期资金活跃、现金流改善。但 8 月社零仅 +0.4%、青年失业率 18.9%，内需端压力未减。**前三季度 5.2% 已经够到 5% 目标，Q4 政策大概率保持定力**，但 10 月可能降准 0.5pct（释放 1 万亿）+ 政策利率小幅下调 10BP。
