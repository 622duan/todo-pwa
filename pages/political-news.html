## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**🔶 国务院常务会议 2 大部署（8.31）**

- **城市地下管网建设**："十五五"期间全国将建设改造城市地下管网约 **77 万公里**，目前总长约 390 万公里（全球第一）。从"事后应急"前移到"事前风险预控 + 隐患排查"，结合城市更新、老旧小区改造、道路改造打包推进。([发改委](https://myjj.ndrc.gov.cn/hqzczd/detail.html?url=zhengce/202609/content_7079760))
- **规范招商引资**：从"拼优惠"转向"拼环境"，明确鼓励/禁止清单，遏制"内卷式"招商，2026 政府工作报告要求的"招商引资鼓励和禁止事项清单"加速出台。([中国政府网](https://www.toutiao.com/article/7680466142644994603/))
- **税收征收管理法（修订草案）**通过、**审计法实施条例（修订草案）**通过——皆提请人大常委会审议。
- **李强讲话**（9.1 人民日报）："强化正向引导和刚性约束，把招商引资工作重点更多放在优化营商环境、培育产业生态、提供高水平政务服务上来"。

**🔶 货币与财政**

- 9.9 国家统计局将公布 8 月 CPI/PPI，浙商证券预计 CPI 同比 **+0.6%**、PPI **+3.2%**。
- 8 月金融数据或同期公布，浙商证券预计新增人民币贷款 1000 亿元（同比少增 4900 亿）、M2 增速 7.5%（回落 0.2pct）。
- 财政部"财政贴息政策"8 月进一步扩围，结构性工具继续发力。

**🔶 重大会议预告**

- 9.8-11 第二十六届投洽会（厦门，芬兰/沙特双主宾国，123 国参展）
- 9.9-13 服贸会（北京首钢园）
- 9.10-12 中国国际矿业大会（天津，新增矿业权交易板块）
- 9.11-13 中国算力大会（河北廊坊，首次"算力首创首发发布会"）

**Mavis 点评**：8.31 国常会两条主线都属于"打基础、还欠账"——地下管网是物理基础设施，招商引资是制度基础设施。**Mavis 点评**：投洽会双主宾国放在芬兰+沙特，明显在抢欧洲高端制造和中东资金，2025 服贸会达成 900+ 项成果，今年规模再升级。**Mavis 点评**：8 月 CPI 关键看油价/猪价双驱动，6.0% 预测区间说明宏观物价仍偏弱，9 月 0.6%、10 月 0.8% 已经是相对乐观。

### 2.2 🟠 经济面 E

**🟥 8 月制造业 PMI 49.8%（国家统计局 8.31 公布）**

| 关键分项 | 8月值 | 环比 | 解读 |
|---------|-------|-----|------|
| 制造业 PMI | **49.8%** | **+0.6pct** | 仍在荣枯线下，但景气改善 |
| 生产指数 | 50.4% | +0.5pct | 重回扩张 |
| 新订单指数 | 50.6% | **+2.1pct** | 需求明显改善 |
| 新出口订单 | 50.1% | +0.5pct | 外需回升 |
| 主要原材料购进价 | **56.6%** | +3.4pct | 通胀压力 |
| 出厂价格 | 50.4% | +2.6pct | 重返扩张 |
| 装备制造业 PMI | 51.4% | 持平 | 新动能稳 |
| 高技术制造业 PMI | 52.9% | -0.4pct | 仍在高景气 |
| 大型企业 PMI | **50.6%** | +1.1pct | 重回扩张 |
| 小型企业 PMI | 47.9% | +0.5pct | 仍弱 |

- 在调查的 **21 个制造业行业**中有 **16 个**行业 PMI 较上月上升，行业景气面明显改善。
- 8 月综合 PMI 产出指数 49.5%（+0.2pct），非制造业商务活动 49.0%（持平）。
- 有色金属冶炼及压延加工业两个价格指数 **均升至 60% 以上**。

**Mavis 点评**：PMI 还是没站上 50，但新订单 +2.1pct 是过去 5 个月最大涨幅，说明 7.30 政治局"加大逆周期调节"开始见效；价格指数从"双双收缩"回到"双双扩张"，**Mavis 点评**：这一轮 PMI 反弹本质是"政策拉 + 价格涨"双驱动，9 月在低基数 + 政策持续加码下可能首次站上 50。

**🔶 高频数据**

- 8 月汽车销量、票房、地铁客流同比均正增长，但社零 7 月仅 +0.6%、1-7 月固投 **-6.7%**。
- 9.11 24 时成品油调价窗口：参考原油均价 90.73 美元/桶，变化率 +3.44%，**汽柴油零售价应上调 175 元/吨**。WTI 围绕 **92 美元/桶**震荡，霍尔木兹海峡是核心变量。

**Mavis 点评**：8 月数据"生产端强、需求端弱"格局没破，但边际改善中；油价的"地缘溢价"已经开始向消费端传导，9.11 这轮上调不是最后一次。

### 2.3 🟣 社会面 S

**🔶 就业**

- 7 月全国城镇调查失业率 **5.2%**（+0.2pct），**16-24 岁青年失业率 17.9%**（+3pct，11 个月新高）。
- 25-29 岁失业率 7.2%（+0.1pct），30-59 岁失业率 3.9%（-0.1pct）。
- 2026 届高校毕业生 **1270 万人**（再创新高）。
- 国务院 6 月已印发《实施就业优先战略"十五五"规划》，提出"探索人机协同新型工作形态、强化 AI 就业创造效应"。

**Mavis 点评**：青年失业率 8 月大概率冲到 **18%+**（2025 同期 18.9% 是前高），年内高点就在 8-9 月。**Mavis 点评**：16-24 岁 vs 30-59 岁的失业率剪刀差 14pct，是经济结构问题的最直白指标——内需弱、企业"降本增效"、传统就业大户（地产/互联网/教培）收缩、应届生技能错配，4 重叠加。

**🔶 消费 / 民生**

- 7 月计算机/平板/手机价格同比 **+17.4% / +17.2% / +8.5%**（国家统计局）——开学季"三件套"全面涨价，根因是 DRAM/NAND 涨价。
- 暑期消费：电影票房、四大一线城市地铁客流、国内航班执行量均环比上涨。
- 商务部"以旧换新"持续，国补对家电/新能源车支撑仍在。

**Mavis 点评**：消费端 7 月社零 +0.6% 几乎"零增长"，但手机/电脑价格 17% 涨幅说明"金额微增"很大程度是被动涨价，实际销量在跌；**Mavis 点评**：这种"涨价式增长"很难持续，Q4 终端需求弹性会测试消费真实承受力。

### 2.4 🔴 技术面 T

**🟥 存储超级周期：AI 核心驱动**

- **SK 海力士**：2026 年 DRAM/HBM/NAND 产能 **全部售罄**，客户已预订到 2027 年；CEO 郭鲁正警告"2027 年是行业史上最紧张的一年"。

- **华虹 Q2**：营收 7.175 亿美元（创历史新高），独立式 NVM 同比 +149.3%，65nm 及以下收入占比从 22.2% 升至 28.6%，**产能利用率 102.8%**。

**🔶 AI 算力**

- **2026 前 7 个月**：国内中标亿元以上数据中心/智算中心 **158 个**，合计超 **1130 亿元**，数量与金额均同比 **+18%**。
- **中国电信**：年高性能服务器集采国产化率首破 **100%**（4 万台，鲲鹏 70.7% + 海光 29.3%，总价 115 亿元）。
- **中国移动**：PC 服务器集采 6.29 万台 / 177 亿元，ARM 架构占 65.01%。
- **Token 工厂**：中国电信宁夏 174 亿元集采（11 个标包）；浙江移动"浙南 Token 工厂"揭牌；中国电信 2025 智算服务收入增速 **+279%**。

**Mavis 点评**：存储这一轮不是普通周期，是"AI 基建 + HBM 抢产 + 国产替代"三重叠加，SK 海力士 CEO 敢喊"紧张到 2030"是资本开支与产能数据算出来的；**Mavis 点评**：长鑫半年 776 亿净利已经把合肥国资 10 年的耐心回报干净，但 PB 19.6 倍意味着市场已经在为"超级周期"定价，回调风险显著。**Mavis 点评**：算力国产化率"100%"出现在中国电信集采里是个里程碑——运营商集采是国产算力最大的"信用证"，意味着后续政府/教育/医疗/金融的算力国产化路径已打通。

## 4. 🏭 三、上下游产业链

### 4.1 原材料

- **高纯氟化氢（6N 级）**：实现规模化量产，缓解 28/14nm 蚀刻材料进口依赖。
- **靶材 / 光刻胶 / 电子特气**：逐步批量导入产线。
- **有色金属**：8 月南华工业品指数 +2.7%（环比），贵金属 +8.6%，能化 +4.3%；金属指数 +0.6%。
- **原油**：WTI 92 美元/桶附近，9.11 24 时汽柴油零售价上调 175 元/吨；霍尔木兹海峡通行是关键变量。
- **稀土 / 镓 / 锗**：出口管制持续；中重稀土战略地位进一步提升。

**Mavis 点评**：6N 氟化氢量产是 28/14nm 蚀刻材料国产化的"破冰点"，但 EUV 光刻胶国产化率仍是 0——这是真正卡脖子的"最后一公里"。

### 4.2 设备 / 材料

- **中芯国际**：资本开支 Q2 18.36 亿美元，全年折旧 50 亿美元（+30% YoY），产能持续高位。
- **ASML / AMAT / Lam / TEL**：受 AI 算力需求拉动 + 出口管制，先进设备交期仍长。
- **北方华创 / 中微 / 拓荆 / 芯源微 / 盛美**：国产化率持续提升，先进封装设备订单排到 2028 年。
- **江丰电子 / 安集科技 / 雅克科技 / 沪硅产业**：靶材、CMP 抛光液、电子特气、硅片陆续规模上量。
- **包年招标**：清华高性能服务器采购 9.1 更正公告（1 张 GPU，24064 CUDA / 96G GDDR7 / 600W）。

**Mavis 点评**：上半年封测扩产投资 **接近 400 亿元**，通富微电 CoWoS/Chiplet 产线落地，先进封装正在成为"国产破局"的核心赛道——这是 2026 年最值得跟踪的产业链投资方向。

### 4.3 制造 / 封测

- **SMIC**：Q2 单季营收首破 30 亿美元，毛利率 25.3% 创近 1 年新高。
- **华虹**：Q2 营收 7.175 亿美元（创历史新高），**产能利用率 102.8%** 满产，65nm 及以下收入占比升至 28.6%，独立式 NVM 同比 **+149.3%**。
- **长江存储**：长存控股 8.21 获 IPO 受理，NAND 全球市占 13%（与美光/闪迪并列第四）。
- **长鑫科技**：7.27 科创板上市，8.29 LPDDR6 全球首发，2028 年月产能规划从 24 万片提升至 46.6 万片。
- **通富微电 / 长电科技 / 华天科技**：CoWoS/Chiplet 扩产，AI 相关应用持续加码。
- **长电科技**：H2 加快推进产品结构向 AI 相关应用优化，存储和测试业务为重心。

**Mavis 点评**：中芯+华虹 +长鑫+长存 4 家产能利用率都在 93%+，**国产制造"满产涨价"的状态 Q3 不会改变**。**Mavis 点评**：长存 IPO 受理意味着"国产存储"拼图完成最后一块——DRAM（长鑫）+ NAND（长存）+ 代工（中芯/华虹）+ 封测（长电/通富）。

### 4.4 下游应用

- **服务器 / 数据中心**：前 7 个月 158 个亿元级大单（+18% YoY），合计 1130+ 亿元。
- **Token 工厂**：杭州瀚融 7.17 亿元（神州数码中标）、中国电信宁夏 174 亿元、浙南 Token 工厂揭牌、北京壹号词元工厂一期日产能 1.4 万亿 Token。
- **PC / 平板 / 可穿戴**：7 月价格 +17.4% / +17.2% / +8.5%（国家统计局）；开学季"三件套"普遍涨价。
- **手机**：H2 同比降幅可能扩大至 -20%（IDC）。
- **新能源车 / 工业控制 / 物联网**：下半年结构性增长，AI 配套 + 车规 + 工控是亮点。
- **消费电子涨价潮传导**：存储 → CPU → PCB（铜价）→ 电池材料，整机 BOM 全面上升。

**Mavis 点评**：Token 工厂的本质是"把算力转化为可交易的标准化 AI 产能"，中国电信宁夏 174 亿元集采标志着行业从"卖服务器"转向"卖推理能力"——**这是 AI 商业化最重要的转折点**。**Mavis 点评**：消费电子涨价潮传导链已经"整条打通"，但消费者的换机延迟会反噬上游需求，Q4 必须警惕"涨价式衰退"风险。

## 6. ✏️ 五、编辑后记

**📌 今天 4 大主线**

1. **存储超级周期**进入"涨价 + 抢产 + 锁长协"失控阶段——HBM 现货 4-5 倍长协价，三星 70% 产能锁到 2031 年，9 月 DRAM/NAND 还要再涨 10-20%。
2. **手机集体涨价 + 9 月新品潮**——华为 22.6% 重回中国第一，9.1 各大品牌涨 200-1000 元，9 月华为三折叠/苹果 iPhone 18 Pro/小米荣耀新品密集发布。
3. **国产 AI 算力"集采 100% 国产化"里程碑**——中国电信 4 万台高性能服务器集采国产化率首破 100%，阿里平头哥、华为、寒武纪、海光开始瓜分英伟达 95%→8% 的腾挪空间。
4. **国务院"拼环境" + PMI 弱反弹**——国常会从"拼优惠"转向"拼环境"，8 月 PMI 49.8% 新订单 +2.1pct 是 5 个月最大涨幅，但仍在荣枯线下。

**🔶 Mavis 独立判断（5 条）**

1. **存储涨价 Q3 见顶概率 > 70%**——理由：DDR5 16Gb 现货价已较合约溢价 16%（历史经验：>20% 通常意味着顶部），Q4 移动 DRAM 涨幅 TrendForce 预测降至 0-5%，消费端弹性接近极限。但 HBM 会"涨到最后"，因为 HBM4 良率低 + LTA 锁产会延续到 2027。
2. **中芯国际 2027 年折旧高峰不是利空**——Q3-Q4 毛利率能靠"涨价红利"盖过折旧，2027 年折旧高峰时点正好对应 AI 资本开支从 8,800 亿美元向更高水平爬坡，"量价齐升"还能继续覆盖折旧压力。
3. **"开学三件套"涨价 17% 是消费电子最大风险**——8 月计算机 +17.4% / 平板 +17.2% / 手机 +8.5%，但销量同比 -8.6%（Counterpoint 前 30 周），IDC 喊 H2 出货 -20% 不是吓唬人。**Mavis 点评**：消费电子涨价式衰退可能 Q4 触发。
4. **长鑫科技 PB 19.6 倍是周期股的"教科书顶部信号"**——单季毛利率 87.6% 在 DRAM 行业历史上只出现过 2 次（2017 Q3、2021 Q2），随后都经历 50%+ 回调。**Mavis 点评**：长鑫 776 亿半年净利是真的，但"超级周期"定价也接近打满。

      document.getElementById('newsDate').textContent = `政经科技日报 · ${dateStr} · 编制 Mavis`;
    }

    function renderNews(md) {
      try {
        const html = marked.parse(md, { gfm: true, breaks: false });
        document.getElementById('newsContent').innerHTML = html;
      } catch (e) {
        document.getElementById('newsContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadNews() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-political-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
  </script>
