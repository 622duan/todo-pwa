- 🟥 **DDR4 8Gb 同比 +860%** 是 2026 最夸张的涨价幅度——但要注意：DDR4 是"老制程 EOL 挤兑"型涨价（韩厂退产 + 客户补库存），并非新需求拉动，**Q4 可能是情绪高点**。
- 🟥 **存储占手机 BOM 从 10-15% → 30%+** 是真实成本冲击——这意味着 iPhone 18、华为 Mate 80 后续机型即便定价再上调也难以完全消化，**Q4 手机厂商盈利能力将被显著侵蚀**。

- **国产替代窗口**：CXMT / YMTC 正在承接 5-10% 的国产化率提升需求，但**高端 HBM 仍被三星/SK/美光卡死**。
