## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

- **国务院常务会议（8.31）**：研究促进招商引资高质量发展，部署城市地下管网建设。"十五五"期间，全国将建设改造城市地下管网约 **77 万公里**，会议强调"从源头消除安全隐患"，将工作重心从应急抢修前移至事前风险预控。[来源](https://www.qstheory.cn/20260906/b2dc6a1763e9412992ae9cc15e96f710/c.html)
- **国务院第 844 号令**：修改《住房公积金管理条例》，9 月 20 日起施行。拓宽提取范围（新增装修、物业费）、提升管理服务效能（3 日决定、10 日贷款审批）、扩大制度覆盖面（**灵活就业人员可自愿缴存**）、强化风险防控（违法提取 3 年内禁提、违法贷款 5 年内禁贷）。罚款上限由 1-5 万元上调至 **5-30 万元**。[来源](https://www.zhangye.gov.cn/gjj/dzdt/tzgg/202609/t20260904_1582992.html)
- **七部门联合印发《促进数字化绿色化协同转型发展实施方案（2026-2030 年）》**（9.4）：到 2030 年，算力设施、5G 基站等新兴领域用能效率大幅提升，推动算力设施等重点领域可再生能源电力消费水平达到所在省份消纳责任权重水平。预测 **2023-2030 年全球将新增多达 500 万吨 AI 电子废弃物**。[来源](https://www.toutiao.com/article/7682605760332694068/)
- **十部门印发《促进中小企业发展"十五五"规划》**（9.3）：到 2030 年规模以上中小企业人均营收累计增长 **15%** 左右；规上工业中小企业研发费用内部支出年均增长 **8%** 以上；专精特新"小巨人"企业达 **2.2 万家**；数智化水平二级占比 95%、三级占比 80%。设立国家中小企业发展基金二期，**"千帆百舸"上市培育**。[来源](https://www.toutiao.com/article/7681402245027512884/)
- **发改委、交通运输部联合印发《物流网建设实施方案》**：到 2030 年社会物流总费用与 GDP 比率降至 **13.1%**（较"十四五"末降低 0.8 个百分点）。8 月物流业景气指数 **50.9%**（环比 +0.5pct），大宗商品价格指数 **132.3 点**（同比 +18.4%）。[来源](https://www.qstheory.cn/20260906/b2dc6a1763e9412992ae9cc15e96f710/c.html)
- **9 月新规密集落地**（9.1 起）：《微短剧发展管理办法》分类监管、AI 生成微短剧需标注；首个智能客服国家标准实施，企业须对智能客服回复内容负责；16 岁以下未成年人禁网络直播；2026 版基本药物目录扩至 **794 种**（化药+生物制品 476 + 中成药 318）。[来源](https://sfj.zhoukou.gov.cn/sitesources/sfj/page_pc/wzsy/flfg/article19f5da8806b64a69a33dd6358c4e0c85.html)

**Mavis 点评**：政策面进入"十五五"密集发文期，"数字化绿色化协同"方案 + 中小企业"十五五"规划 + 公积金条例修订同时落地，**不是单一刺激，而是 5 年框架的系统性铺开**；地下管网 77 万公里、6 张网投资 26.9 万亿（年均 5.4 万亿），传统基建的故事没讲完，新基建（算力/AI/机器人）也有节奏。

### 2.2 🟠 经济面 E

- **8 月 CPI 同比 +0.8%**（前值 +0.5%），**核心 CPI 同比 +1.0%**（前值 +0.8%）；环比由 -0.1% 转为 +0.4%。汽油价格 +9.3%（涨幅扩大 8.3pct）、黄金饰品 +33.6%（涨幅扩大 9.0pct）、**平板电脑 +21.5%、计算机 +19.6%、移动电话机 +11.0%**——AI 算力需求推动电子产品价格上行。猪肉 -11.8%（降幅收窄 1.5pct）。[来源](https://www.stats.gov.cn/sj/sjjd/202609/t20260909_1965261.html)
- **8 月 PPI 同比 +3.8%**（前值 +3.5%），环比由 -0.7% 转为 +0.4%。煤炭开采和洗选业 +26.6%、有色金属冶炼 +20.8%、石油天然气开采 +10.5%、电气机械 +5.9%、**计算机通信和其他电子设备 +5.3%**；汽车制造业 -2.2%（拖累最大）。[来源](https://www.stats.gov.cn/sj/zxfbhjd/202609/t20260909_1965262.html)
- **前 8 月外贸进出口 34.78 万亿元，同比 +17.6%**（较前 7 月 +0.3pct，逐月抬升）。8 月单月进出口 4.65 万亿元，**+19.8%**；出口 2.73 万亿 +18.6%，进口 1.92 万亿 **+21.7%**（连续 6 个月进口增速超出口）。机电产品出口 12.91 万亿元 +21.9%，占出口总值 **64%**，连续 18 个月增长。汽车出口 +47.1%、工业机器人 +13%、船舶 +29.8%、锂电池 +34.4%。对东盟 +20.6%、对美 +1.3%。[来源](http://www.customs.gov.cn/customs/2026-09/09/article_2026090909540679966.html)
- **央行买断式逆回购等量续做**（9.7 开展 5000 亿元 3 个月期）：本月有 5000 亿元到期，**等量续作**结束此前连续 2 个月加量续作（7、8 月各净投放 2000 亿元）。9 月 1 日 7 天逆回购 50 亿元地量操作，9 月 2-4 日 0 投放，DR001 持续运行在 1.35% 附近（低于 1.40% 政策利率）。9 月还有 5000 亿元 6 个月期买断式逆回购、1800 亿元 3 个月国库现金定存、**6000 亿元 MLF** 到期。[来源](https://www.toutiao.com/article/7681809037214532148/)
- **1 年期 LPR 3.00%、5 年期以上 LPR 3.50%**，连续 5 个月不变。MLF 利率 2.50%（8.25 操作）。10 年期国债收益率 1.678%，10 年期美债 **4.849%**（创近三年新高）。[来源](https://www.toutiao.com/article/7681809037214532148/)
- **上半年上市公司业绩**：全市场 5557 家上市公司实现营收 **37.76 万亿元（+7.6%）**，净利润 **3.58 万亿元（+19.5%）**；剔除金融实体上市公司净利润 +22%；沪深 300 成分公司净利润占全市场 78%。[来源](https://www.qstheory.cn/20260906/b2dc6a1763e9412992ae9cc15e96f710/c.html)
- **6 月全球半导体销售额 1344.5 亿美元（+123.6% YoY）**，中国 361.1 亿美元（+112.8%）。WSTS 上半年全球半导体市场规模约 **7020 亿美元（+102%）**，其中存储芯片 +30.5%、逻辑芯片 +45%。[来源](https://m.10jqka.com.cn/20260909/c679722951.shtml)

**Mavis 点评**：8 月 CPI/PPI 同步回升，但"输入性+AI 算力"是核心拉动而非内需——油价 +9.3%、金饰 +33.6%、AI 设备涨 20% 才是主角，耐用消费品（汽车、家电）反而拖累；外贸 17.6% 的高增背后是机电 +21.9%，**中国出口已经全面从"衬衫袜子"切换到"汽车+机器人+电池+AI 服务器"**；央行本月 5000 亿等量续作 + 6 千亿 MLF 到期，态度是"精准对冲"而非"总量扩张"，**降准降息窗口仍在但不是现在**。

### 2.3 🟣 社会面 S

- **暑期消费修复**：8 月社零预计同比 +0.8%（前值 +0.6%），18 城地铁客运量同比降幅由 3.0% 收窄至 1.9%，国际航班同比降幅由 7.0% 收窄至 3.1%。但乘用车销售 8 月同比降幅由 18% 走阔至 **22%**（汽车以旧换新政策效应衰减）。[来源](https://www.toutiao.com/article/7681461803414602294/)
- **就业**：上半年全市场上市公司营收 +7.6%、净利 +19.5%，但 8 月制造业 PMI 仅 49.8%（仍在荣枯线下），16 个行业较上月回升，装备制造业 51.4%、高技术制造业 52.9% 持续扩张。
- **消费电子换机周期突破 42 个月**（五年前为 24 个月）：9 月 1 日手机品牌全品类官宣涨价当日，**转转平台手机成交日同比 +11.6%，5000 元以上高端二手机 +45.28%**。70% 用户明确表示因涨价推迟或放弃换新。[来源](https://www.toutiao.com/article/7681655958849733162)
- **医疗保障**：2026 年国家基本医保药品目录谈判竞价收官，**124 个目录外药品入围**（含肿瘤、罕见病、慢性病、儿童用药），商业健康保险创新药品目录同步调整 12 个，2026 年 11 月发布、2027 年 1 月 1 日起施行。[来源](https://news.10jqka.com.cn/20260910/c679757430.shtml)
- **民生政策**：《国务院关于出境入境管理的规定》9.15 起施行（严打电诈、非法务工）；国务院台办重申"世界上只有一个中国"；人民币跨境支付系统与 11 家外资银行签约，首次覆盖卢旺达、土耳其、乌兹别克斯坦（参与者分布全球 133 国）。

**Mavis 点评**：消费修复呈现"K 型分化"——暑期出行/旅游修复+服务消费 +0.8%，但耐用消费品（汽车 -22%）和地产链持续走弱；**手机换机周期 42 个月 + 二手市场 +11.6% 是非常强烈的"用户以旧换新"信号**，意味着涨价对需求的弹性已经很小，厂商下半年还要面对 30-50% 的备货下调。

### 2.4 🔴 技术面 T

- **国产 AI 芯片出货首破四成至 165 万张**（9.6）：华为昇腾 81.2 万张（占国产近半/整体 20.3%）居首，阿里平头哥 26.5 万张、百度昆仑芯 11.6 万张、寒武纪 11.6 万张、海光 8.25 万张。供给卡点集中在晶圆/HBM/先进封装，预计 **2027 年起缓解**。[来源](https://www.xintouyan.com/archives/989)

- **9 月 1 日电池消费税新规**：财政部、海关总署、国税总局——无汞原电池、氢镍蓄电池、锂原电池、锂离子蓄电池、全钒液流电池 **9.1 起按 2% 征收消费税**，**2027.9.1 起按 4%**。[来源](https://sfj.zhoukou.gov.cn/sitesources/sfj/page_pc/wzsy/flfg/article19f5da8806b64a69a33dd6358c4e0c85.html)
- **PPI 分项**：有色金属材料及电线类 +19.8%、燃料动力类 +9.8%、化工原料类 +9.5%（1-8 月累计 +4.3%）。[来源](https://www.stats.gov.cn/sj/zxfbhjd/202609/t20260909_1965262.html)

**Mavis 点评**：稀土反制已经从"价格博弈"变成"发货许可证博弈"——美国公司等许可证超过半年，**这不是金融战，是物流战**；电池消费税 2% → 4% 的两步走（2026.9 / 2027.9）会让动力电池企业在 2026 Q4 出现一波"赶在 4% 之前清库存"的抢出货。

### 4.2 设备 / 材料

- **国内 EDA 国产化率 15-20%**，高端模拟射频 EDA 差距更大。先进封装缩小制程差距：通富微电 CoWoS、Chiplet 产线落地。
- **设备材料突破**：6N 级高纯氟化氢规模化量产（28/14nm 蚀刻材料）；靶材、光刻胶、电子特气逐步批量导入产线。
- **国家集成电路产业投资基金三期**（大基金三期）3440 亿元已成立，重点投向设备、材料、EDA。
- **PCB/HDI**：具身智能拉动 HDI + 功率板 + FPC 同步需求，机器人主控板向 HDI / 高多层 / 高密度互连迁移。**优必选 9.16 启动万台级交付** + 中标乐山 1.5 亿元商用服务项目，PCB 供应链（HDI、FPC、刚挠结合、PCB+SMT+PCBA 一体化）进入核心链。[来源](https://www.chem17.com/tech_news/detail/4581222.html)
- **深科技子公司投资 18.5 亿元扩大高端存储芯片封测产能**。[来源](https://news.10jqka.com.cn/20260910/c679757430.shtml)

**Mavis 点评**：设备/材料是"国产替代最后 20%"的攻坚战——**EUV 全靠海外、DUV 在爬坡、EDA 国产化率 15-20%** 这三件事决定了 14nm 以下制程的节奏。但先进封装（CoWoS/Chiplet）是个 1-3 年内能追上的赛道——通富微电、长电科技已经在出方案。

### 4.3 制造 / 封测

- **SMIC**：Q2 收入 30.06 亿美元（+36.1%），毛利率 25.3%，产能利用率 93.7%，月产能 109.7 万片 8 寸。AI 配套、电脑与平板、工业与汽车收入 QoQ +40%。[来源](https://m.bricksite.com/kjdata/nyhedsbrev?live-blog-21717397-2026-08-14)
- **华虹宏力**：Q2 收入 7.18 亿美元（+26.8%），毛利率 16.5%，12 寸占比 62.1%，受益功率分立 + MCU 国产替代。
- **长鑫科技**：7.27 科创板上市，8.10 纳入 MSCI；上半年营收 1503.10 亿元（+873.64%）、净利 776.05 亿元；LPDDR6 量产、LPDDR5X 10667Mbps 量产。
- **长江存储**：推进上市进程（满产月产能 30 万片），YMTC 232 层 NAND 量产。
- **封测三强**：通富微电（AMD CPU/GPU 大单 + CoWoS）、长电科技（华虹/中芯配套）、华天科技（先进封装扩产）。
- **6 大代工**：中芯国际、华虹、晶合集成跻身全球十大晶圆厂。

**Mavis 点评**：制造端"中芯/华虹/长鑫"三巨头同时"量价齐升"，是 2026 上半年最确定的盈利故事；下半年看**长江存储上市 + 长鑫 LPDDR5/6 出货扩大 + 中芯 N+1/N+2 工艺爬坡**。**封测是国产化最深的环节**（通富微电/长电科技已经是 AMD/三星/海力士的供应商），但先进封装（CoWoS 等）仍要扩产 400 亿投资。

### 4.4 下游应用

- **AI 服务器/数据中心**：上半年全球 AI 服务器支出 4000 亿美元（+50% YoY）。中金测算超节点机柜市场 2026 年 759 亿 → 2027 年 2256 亿。**国产超节点出货 4 大方向：芯片 + 整机集成 + 高速互联 + 光通信**。
- **新能源车**：7 月销量 156.10 万辆（+23.7%）、1-7 月 900.70 万辆（+9.57%），是 PCB 等电子元器件需求的重要推动力。
- **PC**：存储涨价传导"极端高位"，1 万游戏本涨到 1.5-1.6 万。
- **机器人/具身智能**：HDI、功率板、FPC 需求爆发。**优必选 13361 台订单 + 全球首款 AI 智能体机器人**。**GB/T 47245—2026** 国标实施。
- **6G/卫星互联网**：北京"十五五"高精尖产业规划——突破可重复使用火箭和大推力发动机、推进卫星星座、卫星物联网、"北斗+"应用。
- **AI/AR 眼镜**：9 月 OPPO/vivo/荣耀新机 + 豆包 AI 手机催化。
- **消费电子涨价潮**：游戏本涨 5000 元、笔记本 4600 → 6400、SSD 一日涨 40 元、内存"早上一价晚上一价"。

**Mavis 点评**：下游应用今天是"AI 算力 + 机器人"双主线——**AI 服务器支出 4000 亿美元、超节点机柜 759 → 2256 亿**，这是国产芯片最确定的需求侧；机器人则是"今年万台，明年 5 万台"的新增量。**消费电子（手机/PC/平板）的涨价是结构性伤害**——ASP +27.6% 但销量 -6%，2027 H2 NAND 供应缓解后才会真正"再平衡"。

## 6. ✏️ 五、编辑后记

**今天 4 大主线**

1. **9 月新政密集落地**——公积金条例 9.20 实施（扩覆盖+严风控）、物流网方案 / 数字化绿色化协同方案 / 中小企业"十五五"规划 / 微短剧监管 / 智能客服国标 / 9.1 起电池消费税 2%（2027.9.1 升至 4%）。**不是单一刺激，是 5 年框架的系统性铺开**。

2. **8 月经济数据"输入性+AI"双驱动**——CPI 0.8%、PPI 3.8%、外贸 17.6%（机电 +21.9%）、油价 100 美元突破带动"汽油 +9.3%"、AI 算力需求带动"平板 +21.5% / 计算机 +19.6% / 手机 +11.0%"。**耐用消费品（汽车 -22%）反而拖累，"上热下冷"格局没有改变**。

3. **存储 + AI 算力 = 今天最炸**——长鑫 LPDDR6 全球首发量产（12800Mbps）、LPDDR5X 10667Mbps 追平国际、SK 海力士利润 +5x、美光 +1398%、DDR5 16GB 单条 929-1460 元、TrendForce Q3 DRAM +13-18% / NAND +10-15%、HBM4 2027 翻倍。**DeepSeek 16 万颗昇腾 950DT（25.6 亿美元）+ 国产 AI 芯片出货首破四成 165 万张**，自主可控拼图最强实质进展。

4. **手机行业"两极分化"+ 机器人"交付冲刺"**——Q2 中国市场华为+19.4% / 苹果+24.4% / 小米-21.7% / OPPO-9.7% / vivo-11.4%，仅华为苹果正增长。ASP 创纪录 581 美元（+27.6%）。换机周期突破 42 个月。**优必选 13361 台订单 9.16 首批交付 + 中标乐山 1.5 亿元 + GB/T 47245 国标 9.1 实施**。

**Mavis 独立判断（5 条）**

1. **9.17 华为全联接 + 9.22 阿里云栖** 是 9 月最重要的两个事件。DeepSeek 16 万颗昇腾 950DT 已经为华为发布会预热，**我预期会上看到"Atlas 950 SuperPoD 商业化路线图 + 灵衢互联开源 + 950DT/950PR 量产时间表"**。阿里云栖则会是"平头哥 + 阿里云 AI 基础设施 + 26.5 万张平头哥出货"的故事。

2. **存储超级周期"还在路上但斜率在变"**。HBM4 2027 翻倍 + DRAM 紧缺到 2027 + NAND 2027 H2 缓解 = **DDR4 利基型 / SLC NAND / NOR Flash 这三个"非主流"品类是 2026 Q4 - 2027 H1 的"结构性涨价"机会**（摩根士丹利"冰火两重天"判断）。长鑫 LPDDR6 跑赢三星 / SK 海力士首发是大事，**但消费电子用户对涨价的承受能力已经在断点（换机周期 42 个月）**。

3. **中芯 vs 华虹的 Q3 指引分化是中长期信号**。中芯"AI 配套 + 大客户回流 + 28nm 成熟制程 + 量价齐升"还能继续推毛利率（26-28%）；华虹"功率分立增长慢于预期 + Q3 毛利率持平甚至收窄"。**赵海军"今年看不到价格下行"是确定信号**，但 2027 H2 行业整体进入"分化"。

4. **稀土反制从"价格博弈"变成"发货许可证博弈"**——美国公司等许可证超过半年、中国供应商几乎完全避免向日本出口原材料、印度/日本买家获证更有限。**这意味着关键矿产博弈已经从"金融战"变成"物流战"**，华盛顿酝酿的报复（实体清单、半导体设备限制、第三国转口关税、IEEPA 调查）大概率会落地但力度会打折扣（盟友配合意愿不足、国内产业界抵触）。

5. **机器人行业从"展台逻辑"进入"现场逻辑"**——9 月不是发新品的月份，是**验证交付的月份**。优必选 13361 台 + 9.16 首批 + 全年 1 万台目标，**这是行业第一次面对"万台级售后/可靠性/真实场景反馈"的大考**。小鹏 9 亿美元融资 + 天工数亿元融资 + 银河星仔 200 台预订 = **资本追着交付跑**。
