## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**核心主线：9.28 国常会"四箭齐发"+9.29 央行 PSL 利率下调 + 房贷贴息落地。** 国庆前一周政策密集出台，10 月进入"落地观察+三季报验证"窗口。

- 🟥 **9 月 28 日国务院常务会议**：研究宏观政策发力提效、促进有效投资有关工作；提出**加大逆周期调节力度**，部署"十五五"重大工程与"六张网"项目尽早开工。明确用好地方政府债务结存限额（预计 5000–6000 亿元）、综合运用并适时调整货币政策工具、增加科技创新和技术改造再贷款额度、研究出台稳定房地产与促进就业增收措施。 ([macrochina.cn](https://www.macrochina.cn/news_speed/hgjj/20260929125482.shtml))
- 🟥 **9 月 29 日央行"四箭齐发"**：
  - 下调 **PSL 利率 25bp** 至 **1.5%**，并将水网、新型电网、算力网、新一代通信网、城市地下管网、物流网**"六张网"**纳入抵押补充贷款支持范围；
  - 增加 **科技创新和技术改造再贷款额度 2000 亿元**（从 1.2 万亿→**1.4 万亿**），支持比例统一从 60%→**100%**；
  - 增加 **支农支小再贷款额度 5000 亿元**，其中**民营企业再贷款额度 +3000 亿**（从 1 万亿→**1.3 万亿**）。
- 🟥 **房贷贴息政策 10 月 1 日起实施**（财政部、央行、金融监管总局）：首套住房、面积≤120 ㎡、总价≤150 万元，可享受**年化 1 个百分点贴息、期限最长 5 年**；单笔贴息贷款最高 100 万元。
- **超长期特别国债以旧换新全年 2500 亿元资金已全部下达**，其中第四批 625 亿元赶在国庆前落地（家电、汽车、3C 等）。
- **十五五"6 张网"加速成型**：物流网（8 月已印发实施方案）、算力网、新一代通信网、新型电网、水网、城市地下管网均进入专项规划编制阶段。

**Mavis 点评**：政策端从"工具够不够"转向"落地快不快"。PSL 利率降到 1.5% 历史低位、叠加 6000 亿元专项债结存、+5.5 万亿元再贷款额度——这是 2024 年以来力度最大的一次逆周期组合拳，重点保"两重+两新+六张网"。但 Mavis 的判断是：**政策端的边际效用已经在收窄，关键看居民端的传导链条能不能打通**。59 万亿元超额存款的"闸门"能不能松开，取决于就业和收入预期。

### 2.2 🟠 经济面 E

**核心数据：9 月 CPI 同比 -0.3%，PPI 同比 -2.3% 跌幅收窄；核心 CPI 同比 +1.0% 近 19 个月新高。**

- 🟥 **9 月 CPI 同比 -0.3%**（环比 +0.1%），核心 CPI **同比 +1.0%**（环比 0.0%），核心 CPI 连续 5 个月回升、创近 19 个月新高。食品价格同比 -4.4% 是拖累项；非食品价格同比 +0.7%。([国际商报](https://epa.comnews.cn/pc/content/202510/16/content_25345.html))
- 🟥 **9 月 PPI 同比 -2.3%**（环比 0.0%），同比降幅较 8 月 **-2.9% 收窄 0.6 个百分点**，已连续 36 个月为负。"反内卷"政策推动煤炭、黑色冶炼价格回升（煤炭 +2.5% / 黑色冶炼 +0.2%），光伏设备价格由 -0.2% 转为 **+0.8%**。
- **10.4 国庆档票房**：连续 4 天单日破亿，档期总票房已超 **7 亿元**；全国电影年票房（含预售）突破 **300 亿元**。
- 🟥 **国庆 7 天跨区域人员流动 21.3 亿人次**，日均 3 亿，相当于平时的 1.7 倍；其中**新能源车流量 1780 万辆**为平时 1.8 倍；公路出行占比 90%+；10.1 铁路发送 2520.4 万人次创历史新高。
- **财联社 10 月 8 日中国央行将开展 1.2 万亿元买断式逆回购**，实现净投放 2000 亿元 —— 国庆后流动性补充。
- **LPR（10 月 20 日公布）**：1 年期 3.30%、5 年期以上 3.50% 已连续 16 个月不变；多数经济学家预期 10 月 LPR 维持不变。
- 🟥 **9 月 RatingDog 中国制造业 PMI 51.2**（连续 2 个月扩张），AI 相关芯片/电子设备出口带动；官方 PMI 49.8 仍在荣枯线下。

**Mavis 点评**：通胀正在"温和回血"，但**结构性矛盾没解决**——食品 -4.4% 拖累 CPI，但核心 CPI 1.0% 接近 19 个月高点，说明**消费需求的内生动能在修复**。PPI 跌幅连续 5 个月收窄是积极信号，但翘尾因素贡献大、政策推动的结构性涨价占主导，并非真实需求复苏。Mavis 关注的关键是：**四季度企业盈利能否从"价格修复"传导到"扩产意愿"，这是 2027 年宏观反转的关键变量**。

### 2.3 🟣 社会面 S

**核心数据：国庆消费"脉冲强、人均省"；失业率压力存在但已企稳。**

- 🟥 **国庆消费"穷游"特征明显**：2025 年国庆人均旅游花费 911 元创近三年低点；今年人均订单金额 +20.18%，平均行程 10.31 天（8 天以上占 82%）—— 出游时长增但**单日消费降**，消费从"买商品"转向"买体验"。
- **78 个步行街/商圈**：客流量 +6.4%、营业额 +5.1%。
- **县域游**：县域旅游产品预订热度 **+42%**，平均游玩天数 +3.2 天；"奔县深度游"目的地前 5：平潭、淳安、保亭、平遥、安吉。
- **入境游**：前 7 个月境外人员在华消费 **+27.8%**；国庆期间俄罗斯客源 +173% 居第一、英国/马来西亚/加拿大均超 50%。
- **新能源汽车出行占比提升**：国庆首日高速公路新能源车 1780 万辆，服务区充电设施累计 8.9 万个（1–8 月新增 1.1 万个大功率充电枪）。
- **电影**：国庆档平均票价 36.3 元（2024 年 40.4 元，同比 -10%），影院在降价揽客。
- **居民部门**：一季度居民人均可支配收入 12782 元、名义 +4.9%、实际 +4.0%（近三年低位）；25–29 岁失业率 **7.7%**（+0.8pct）；居民存款 +7.7 万亿元、定期存款占比升至 70%、消费信贷首度负增长。
- **民生政策**：7 部委开展灵活就业人员、农民工、新就业形态人员参加医保提质专项行动，超大城市取消灵活就业人员就业地/常住地参保户籍限制。

**Mavis 点评**：国庆 21.3 亿人次的流动是表象，**人均消费的下降才是真实底色**。58 万亿超额存款、32.3% 储蓄率、住房资产占比从 67% 降至 52% —— 这是**资产负债表衰退的典型信号**。Mavis 提醒：**服务消费（旅游、医美、文娱）是增量，但商品消费（家电 1–8 月 -9.7%、空调 -15.9%）仍在降级**，结构性分化会持续放大。

### 2.4 🔴 技术面 T

**核心主线：AI 软件生态脱钩、2 万亿元数据中心规划、DeepSeek-华为联盟成型。**

- 🟥 **DeepSeek-华为联合开发半导体软件**：DeepSeek 发布 **TileLang-Ascend**（华为昇腾 NPU 专用算子内核开发工具），对抗英伟达 CUDA。同日寒武纪、海光宣布自家芯片兼容方案，"CUDA 替代阵营"初步成型。华为承诺"全面支持"，DeepSeek 在内蒙古数据中心部署 **16 万张华为加速卡**（约 180 亿元）。
- 🟥 **国家发改委拟定 2 万亿元全国 AI 数据中心算力网规划**（5 年期）：中国移动、中国电信承担运营，**强制要求 80% 国产芯片采购**，华为昇腾成为事实上的默认供应商，英伟达/AMD 被排除。若加民间投资总投资规模或达 5 万亿元。
- 🟥 **DeepSeek 加速冲刺上海科创板 IPO**：选定中信证券为主承销商，预计年内递交申请，2027 Q2 挂牌；估值 **5000 亿元人民币**（约 710 亿美元）。
- 🟥 **美光 2026 财年 Q4 营收 542 亿美元**创历史新高，**HBM 单季营收 20 亿美元**（环比 +33%），年化规模逼近 80 亿美元；2027 财年 Q1 营收指引 **615 亿美元**（高于分析师预期 568 亿美元）。
- **谷歌 Gemini 4 Argon 发布**（9.30）：Google 称最强模型；输出 100 万 Token；输入 $2 / 输出 $10 / 百万 Token；事实错误率 15%（Astra 51%）；但 Bloomberg 援引内部员工称实战编程存在弱点。
- **FTC 对 OpenAI/Anthropic/METR 调查**：消费者保护法是否被违反；调查在 7 月 OpenAI 智能体入侵 Hugging Face 事件前已启动。
- **麦当劳 AI 定价争议**：利用 1.4 万家门店每日数百万笔交易差异化定价；加州两家直营店巨无霸差距 $21 1%；加盟商被强制使用工具。
- 🟥 **智元机器人（AgiBot）上半年出货 8400 台，跃居全球第一**（44% 市场份额），超过宇树（5900 台，31%）。全球人形机器人出货 1.91 万台，中国企业占 97%。智元选聘中信证券+中金+摩根士丹利为香港 IPO 主承销。
- 🟥 **中国 1–8 月集成电路出口 2567 亿美元**（同比 +104%），8 月单月 **407 亿美元**刷历史纪录 —— 出口已超进口，AI+存储+成熟制程共同贡献。
- **智谱 GLM-5.3 网络安全能力引发担忧**：CyberGym 84.5%（>Claude Mythos 83.8%），Anthropic 红队警告绕过率达 64–100%，推迟权重发布。

**Mavis 点评**：**硬件脱钩 → 软件脱钩** 的拐点出现。DeepSeek 的 TileLang 是中国 AI 软件生态自主化的标志性事件，意义不亚于华为昇腾 950DT 芯片本身。"2 万亿元数据中心+80% 国产化率"是国家层面的"反 CUDA"宣言。Mavis 提醒：**这是中国 AI 第一次拥有"定价权"——不是因为便宜，而是因为买不到替代品**。AI 应用成本短期会继续上行，长期取决于 HBM 国产化进度（长鑫 G5 量产是变量）。

## 6. ✏️ 五、编辑后记

### 总论：三条主线

今天是 2026 年 10 月 7 日，国庆假期最后一天。三条主线主导今天的视野：

**主线一：宏观政策"四箭齐发"进入落地观察期。** 9.28 国常会+9.29 央行 PSL 利率下调 25bp+房贷贴息+超长期特别国债 2500 亿以旧换新资金全部下达——这是 2024 年以来力度最大的一次逆周期组合拳。10 月的关键是看政策传导能不能从"工具够不够"转向"落地快不快"。

**主线二：存储涨价进入"超级周期"。** Q4 PC DRAM +13–18%、Server DRAM +10–15%、NAND 整体 +15–20%、Enterprise SSD +23–28%——这是 TrendForce 2026 年初以来最高涨幅预测。三巨头 70% 产能被长协锁死到 2031 年，"死亡循环"被打破的可能性增加。Mavis 提醒：**2027 H2 之前存储价格回调可能性很小，2028 H2 之后才有调整空间**。

**主线三：国产 AI 芯片定价权确立。** 华为昇腾占中国 AI 芯片市场 50–60%，昇腾 950DT 意向价 25 万元向英伟达 B200 看齐；2 万亿元数据中心规划+80% 国产化率强制条款；DeepSeek TileLang-Ascend 标志 CUDA 替代生态成型——这是中国 AI 第一次拥有"定价权"。

### Mavis 独立判断

1. 🟥 **存储涨价的终端传导不可逆**。惠普内部存储成本占比从 15–18% 飙升至 35%（一个季度），联想/戴尔已告知客户涨价 15–20%。IDC 预测 PC 出货 -10.4%、智能手机 -8.4%。Mavis 判断：**消费电子寒冬至少持续到 2027 H2，存储扩产落地前不会反转**。

2. 🟥 **国产芯片"卖方市场"窗口期 12–18 个月**。华为昇腾 950DT 25 万元、寒武纪 690 +20–30%、摩尔线程/燧原为抢份额维持激进定价——形成"龙头提价、新军冲量"的分化。Mavis 判断这个窗口期只有 12–18 个月，存储行业 40 年周期决定了涨价终将反转。

3. 🟥 **手机市场"高端吃低端"格局定型**。2026 年全球智能手机出货 -11% 至 -13.9%（13 年最陡），但华为+苹果份额扩大、小米传音承压。Omdia 总结："规模较小、LPDDR4/4X 需求高、低端机型占比大的厂商，将面临更大风险。"Mavis 提醒，传音是主要 OEM 厂商中最脆弱的一环。

4. 🟥 **A 股四季度"再平衡"行情持续**。9 月资金从高估值成长板块撤出，向低估值、高现金流资产迁移。10 月初"科技 + 有色"景气结构是市场共识。Mavis 的关键判断：**真正的反转需要"业绩 + 估值 + 流动性"三因子共振，目前缺第三个（流动性）**。

5. 🟥 **中东局势是 Q4 最大尾部风险**。布伦特 $102.31（+4.37%）、美国柴油创历史新高 $6.40/加仑。特朗普称 11 月中期选举后可能加大对伊朗打击；五角大楼增派第三艘航母、近万名士兵。Mavis 判断：**10 月底-11 月初是冲突临界窗口**，油价 +$120-150 是潜在尾部事件。

6. 🟥 **消费降级 vs 体验升级的结构性分化加剧**。国庆人均订单金额 +20.18%、平均行程 10.31 天（vs 收入增速 4.0%）；家电 1–8 月 -9.7%、空调 -15.9%。Mavis 提醒，"投资于物"正在向"投资于人"（服务消费 +4.9%）转移，这是产业结构调整的早期信号。

### 风险提示

- 📊 **数据真实性**：本日报数据来自公开信息源（TrendForce、IDC、Counterpoint、Citi、Bernstein 等），但部分数据为"知情人士"口径（如华为昇腾 950DT 25 万元、寒武纪 690 提价），**当事方未官方确认**。
- 🟥 **存储超级周期长度不确定**：如果 2027 H2 三星/SK 海力士/美光产能集中释放，存储价格可能见顶回落，芯片涨价逻辑随之弱化。
