## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

- **🟥 第八轮中美经贸磋商达成多项共识，AI 首次对话**｜9 月 24 日商务部例行新闻发布会确认，中美两国经贸团队在美举行第八轮经贸磋商，围绕对等降税安排、贸易理事会/投资理事会建立、吉隆坡联合安排延期等达成多项共识。何立峰副总理与美财长贝森特在中美经贸磋商机制下**就人工智能进行了首次对话**。[商务部 9.24](https://www.mofcom.gov.cn/xwfbzt/2026/swbzklxxwfbh2026n9y24r/index.html)
- **习近平主席对美国进行国事访问（9.23-25）**｜国家主席习近平在白宫与特朗普会谈，双方同意将贸易休战协议延长至明年 1 月 10 日，就 AI 治理达成合作共识，定调"建设性战略稳定关系新定位"。[新华社 / 华尔街见闻 9.25](https://www.sohu.com/a/1080683943_130887)
- **习近平就发展先进制造业作出重要指示**｜9.16-17 全国先进制造业大会在京召开，习近平强调"智能化、绿色化、融合化方向"，持续做大做强先进制造业。李强总理指出"以新一代智能制造为主攻方向"。[中国政府网 9.17](http://www.juancheng.gov.cn/)
- **央行 Q3 货政例会：继续实施适度宽松货币政策**｜9.19 召开，建议"发挥增量政策和存量政策集成效应，增强政策前瞻性灵活性针对性"，保持人民币汇率基本稳定。[央行 9.25](https://www.sohu.com/a/1080683943_130887)
- **北京打响现房销售"第一枪"**｜9.24 北京住建委等四部门印发实施意见，是 8.28 住建部通知后全国首个落地细则。明确"新老划断、分类过渡"——新出让土地项目主体结构封顶才可预售，土地出让款首付不低于 50%；房企可收取不超过总房价款 **1%** 的定金。[华尔街见闻 9.25](https://www.sohu.com/a/1080683943_130887)
- **国家发改委上调成品油价格**｜自 9.24 24:00 起，国内汽、柴油每吨分别上调 830 元、800 元，调控后实际上调 395 元、385 元。[金十数据 9.25](https://xnews.jin10.com/details/230886)
- **政治局委员刘国中调研湖北"三农"**｜9.21-23 出席 2026 中国农民丰收节全国主场活动，强调今年是"十五五"开局之年，夏粮再创新高、早稻稳定、秋粮丰收在望。[中国政府网 9.23](https://www.gov.cn/yaowen/liebiao/202609/content_7081893.htm)

**Mavis 点评**：本周政策面"中美 AI 首次对话 + 现房销售落地细则 + 央行继续适度宽松"三大事件共振，信号整体偏积极。北京作为一线城市率先落地现房新政，是 8.28 新政的最重要城市级响应；中美 AI 对话首次入官方磋商机制，意味着 AI 治理被提到国家战略层级。

### 2.2 🟠 经济面 E

- **🟥 1-8 月外贸进出口 34.78 万亿元，同比 +17.6%**｜海关总署数据，8 月单月进出口、出口、进口分别增长 19.8%、18.6%、21.7%；机电产品出口 12.91 万亿元、+21.9%（占出口 64%，连续 18 个月增长）。汽车 +47.1%、船舶 +29.8%、锂电池 +34.4%、工业机器人 +13%。[海关总署 / 光明日报 9.22](http://ningbo.customs.gov.cn/ningbo_customs/2026-09/22/article_2026092209472678355.html)
- **集成电路进出口 +68.1%，电脑及零部件 +60.5%**｜前 8 个月高技术产品爆发式增长，跨境电商进出口 1.45 万亿元，带动就业超 1000 万人；保税物流进出口近 6 万亿元、+42.3%。[商务部 9.18 国新办发布会](https://www.ciie.org/zbh/cn/2024/medium-item3/20260921/64115.html)
- **8 月 CPI 同比 -0.3%（降幅收窄 0.1pct）**｜核心 CPI 同比 +1.0%，连续 5 个月扩大并创近 19 个月新高。PPI 同比 -2.3%，降幅比上月收窄 0.6pct。煤炭加工 +3.8%、黑色金属冶炼 +0.2%，连续两个月上涨。[国家统计局 / 经济参考报 9.15](http://www.macrochina.com.cn/news_speed/hgjj/20251016124230.shtml)
- **8 月规上工业增加值 +5.3%（1-8 月累计）**｜8 月制造业 +6.1%，加快 0.6pct；装备制造业 +12.1%。[马建堂 9.19 经前论坛](https://www.toutiao.com/article/7687186632155513359/)
- **1-8 月财政收入：广义财政支出 -3.5%**｜支出进度 60.5%，略低于过去 5 年均值 61.5%；政府性基金支出 -17%（土地出让收入下滑拖累）。[东吴证券宏观](https://hoffman-reetz.com/?live-blog-14112344-2026-06-25)
- **前三季度 38 家公司业绩预告，约六成预增**｜AI 产业链亮眼：燧原科技 Q3 营收 23-30 亿元（同比 +325.78%~455.36%）、立讯精密前三季度净利 +15~25%、气派科技 Q3 营收 +61.26% 扭亏为盈。[中国经济网 9.22](https://www.ce.cn/macro/more/202609/t20260922_3229395.shtml)

**Mavis 点评**：外贸是当前最强支撑——机电 +21.9% 的 18 个月连续增长，是 AI 算力出口（集成电路 +68.1%）和"中国智造"双重驱动的结果。但内需依然弱：8 月 CPI 仍负、PPI 降幅靠"反内卷"和能源价格撑着。Q4 财政加码（专项债 + 政策性金融工具 8000 亿）若能落地，基建 + 制造业投资降幅有望收窄。

### 2.3 🟣 社会面 S

- **城镇调查失业率 5.3%，青年失业率 18.9%（重回高点）**｜8 月数据公布，毕业生进入劳动力市场为主要影响因素。[中央社 9.15 / 9.17](https://www.cna.com.tw/search/hysearchws.aspx?q=%E4%B8%AD%E5%9C%8B%E5%9C%8B%E5%AE%B6%E7%B5%B1%E8%A8%88%E5%B1%80)
- **灵活就业人口达 3 亿**｜人社部数据，学者认为"灵活就业统计掩盖了真实失业问题"。[中央社 9.13](https://www.cna.com.tw/search/hysearchws.aspx?q=%E4%B8%AD%E5%9C%8B%E5%9C%8B%E5%AE%B6%E7%B5%B1%E8%A8%88%E5%B1%80)
- **商务部全国农产品产销大会签约 85.2 亿元**｜9.17-20 贵阳南部片区，北部片区将于 10.22-25 在山东临沂举办。[商务部 9.24](https://www.mofcom.gov.cn/xwfbzt/2026/swbzklxxwfbh2026n9y24r/index.html)
- **居民消费意愿指数回升，就业指数持续低位**｜2026 年消费者信心指数总体回升，但就业指数持续低位，反映产业升级与旧产业调整对就业市场的双重压力。[东吴宏观 9.25](https://hoffman-reetz.com/?live-blog-14112344-2026-06-25)
- **全国累计发电装机 41.03 亿千瓦（截至 8 月底），+11.1%**｜国家能源局数据。[金十数据 9.25](https://xnews.jin10.com/details/230886)

**Mavis 点评**：就业-收入-消费的负反馈正在增强。8 月青年失业率重回 18.9%（7 月 17.9%）创 11 个月新高，而灵活就业 3 亿这个数字意味着劳动力市场结构性问题被低估。Q4 财政若能向"居民端"加力（消费补贴 / 直接转移支付），可能打破负反馈。

## 4. 🏭 三、上下游产业链

### 4.1 原材料

- **稀土、镓、锗、光刻胶出口管制**：中国继续对镓、锗、锑实施出口管制（2024.8 起生效），钨、铋等 2025.2 起管制；倒逼美国/欧盟本土冶炼产能建设。[东吴证券 6.25 报告](https://hoffman-reetz.com/?live-blog-14112344-2026-06-25)
- **硅片**：12 英寸硅片已可覆盖 14nm 以上技术节点的存储芯片制造需求，服务本土存储扩产。[百度百科 存储晶圆](https://baike.baidu.com/item/%E5%AD%98%E5%82%A8%E6%99%B6%E5%9C%86/67520075)
- **工业金属**：LME 3 个月期铜 14646 美元/吨（+0.21%）、伦锌 +1.78% 3967 美元、伦镍 +0.24%。美元走强被供给扰动部分抵消。[华尔街见闻 9.25](https://www.sohu.com/a/1080683943_130887)
- **原油**：WTI $94.61（+2.66%）、布伦特 $106.60（+3.41%）、阿联酋穆尔班 $117.10（+3.53%）。沙特向亚洲售出接近 1 亿桶原油。[华尔街见闻 9.25](https://www.sohu.com/a/1080683943_130887)
- **黄金**：COMEX 黄金 4310.1 美元/盎司（-0.19%）、现货金 4274.65 美元（-0.28%）。中国 1-8 月黄金支出 1588 亿美元（2025 全年仅 965 亿）。[华尔街见闻 9.25](https://www.sohu.com/a/1080683943_130887)

**Mavis 点评**：原材料端"地缘+避险"双线驱动。原油回到 106 美元/桶是霍尔木兹海峡风险溢价的直接定价，中国央行连续 8 个月增持黄金（7 月美国国债持仓降至 6180 亿美元，18 年最低），去美元化+避险资产配置是长周期趋势。

### 4.2 设备 / 材料

- **北方华创 + 中微公司 + 拓荆科技 + 长川科技 + 华海清科**：5 大设备龙头构成半导体设备 ETF 广发的前五大权重，合计权重 48.05%。[东吴证券 6.25 报告](https://hoffman-reetz.com/?live-blog-14112344-2026-06-25)
- **江丰电子 / 安集科技 / 雅克科技 / 沪硅产业**：4 大材料龙头进入材料 ETF 主流权重
- **光刻机国产化仍是短板**：DUV / EUV 国产化率仍低于 25%，上海微电子 28nm DUV 在客户验证阶段
- **IC 载板**：2025 年全球 1058 亿元市场（+18.21%），日台韩寡头垄断（前五 80%），深南电路、兴森科技已启动 ABF 产线建设。[东吴证券 6.25 报告](https://hoffman-reetz.com/?live-blog-14112344-2026-06-25)
- **GMC 环氧塑封**：华海诚科切入先进封装核心看点
- **国内封测四强**（长电/通富/华天/盛合晶微）2026Q1 合计营收同比 +13%。

**Mavis 点评**：设备 + 材料是国产替代"长坡厚雪"赛道。SEMI 预测 2029 年全球设备支出 1720 亿美元，中国大陆 37% 份额（约 640 亿美元），按 50% 国产化率目标，本土设备空间还有 2 倍。光刻机是最大短板，但 DUV 28nm 突破可能比预期早。

### 4.3 制造 / 封测

- **中芯国际**：2025 资本开支 81 亿美元（+11%），2026 与 2025 基本持平。产能利用率 2025Q3 95.8%、Q4 93.5%。[东吴证券 6.25 报告](https://hoffman-reetz.com/?live-blog-14112344-2026-06-25)
- **长江存储**：2025Q2 月产能 14 万片（vs 三星 41 万 / 西部数据+闪迪 40 万），2026Q1 NAND 份额 13%
- **长鑫存储**：2025Q2 月产能 26 万片（vs 三星 64.5 万 / SK 海力士 51.5 万 / 美光 33 万），2026Q1 DRAM 份额 8%。规划 2028 翻倍至 50 万片/月
- **通富微电 42.2 亿元定增（谢治宇、乔迁合计 10.81 亿参与）、长电科技 65 亿元定增、颀中苏州 24.54 亿元项目**｜封测产业链 2.5D 中介层、Fan-out、3D 集成方向投入巨大。[今日头条 / 金融界 9.20](https://www.toutiao.com/article/7687604307755057716/)
- **粤芯半导体**：第三工厂"粤芯四期"启动 4 万片/月规划，建成后总产能 12 万片/月（截至 2025 末已实现 6.33 万片/月）
- **深科技 18.5 亿元扩建存储封测**：与通富、长电、颀中同向扩张。[今日头条 / 金融界 9.20](https://www.toutiao.com/article/7687604307755057716/)

**Mavis 点评**：制造/封测产能扩张是 AI 算力链最直接的"卖铲子"机会。两存（长江存储 + 长鑫）+ SMIC + 粤芯 = 国产制造的"四大金刚"，差距主要在产能规模（约为海外 30-40%），但扩产节奏明确。

### 4.4 下游应用

- **PC**：2026 全球 PC 出货量预计同比下降 13.9%（IDC），ASP 创纪录 $550。内存 + 存储在 BOM 中占比超 60%（千元机）/ 30%（旗舰）
- **折叠屏**：Counterpoint 预测 2026 全球出货 2750 万台（+24%），三星 31% / 苹果 29% / 华为 24% 面板份额。[Counterpoint](https://www.ukrmp.org/...15383669)
- **服务器 / 数据中心**：TrendForce 预测 2027 年存储在 AI 基础设施投资中占比将达 68%（两年增 5 倍）
- **新能源车**：1-8 月汽车出口 +47.1%、锂电池 +34.4%
- **机器人**：手术机器人出口市场从 23 个增至 49 个；人形机器人出货量全球占比 97%（人民日报海外版 9.19）
- **算力集群**：阿里、腾讯、百度、字节（2000 亿元资本开支）持续扩张智算中心
- **🚀🔥 传音控股、长城汽车、长安汽车**：暂无新数据

## 6. ✏️ 五、编辑后记

**总论**

今天是 2026 年 9 月最后一个完整交易周的开始（节前最后一周）。今天 4 大主线：**① 中美 AI 首次对话入官方磋商机制** ＋ 习近平主席访美收官，达成贸易休战延长至明年 1 月、AI 治理合作共识；**② 华为昇腾 960 超节点发布 + DeepSeek ARR 破 10 亿**，标志中国 AI 算力"芯片 + 模型"双线进入兑现期；**③ 第八轮中美经贸磋商达成多项共识**，对等降税、贸易理事会/投资理事会建立、吉隆坡联合安排延期；**④ 存储 Q3 合约价 +13-18% + HBM4 价格 2027 翻倍预期**，HBM 三巨头格局松动（三星 +12pct 单季抢份额）。

**Mavis 独立判断**

1. **NPO（近封装光学）是华为真正的"硬技术护城河"**。昇腾 960 用 5500 个 Hi-ONE 替代 4.8 万颗 800G 光模块，单引擎 7.2T 容量 / 内置光源 / 功耗 -550 千瓦——这是业内首个量产 NPO，不是实验室原型。在 AI 算力从 10 万卡向 100 万卡演进的关键节点，NPO 比 NVLink 更前沿。

2. **DeepSeek 估值 3 个月从 3500 亿跳到 5000 亿，是 AI 应用层定价的转折点**。之前资本市场主要炒算力芯片（寒武纪、海光），现在发现模型层（DeepSeek）的定价能力可能更强——ARR 从 5 亿到 10 亿只用了数月，API 毛利率 82.9% 高于 Anthropic 和 OpenAI。严文韬出任 CFO 标志着 DeepSeek 进入"专业资本运作"阶段，2027 年科创板 IPO 是大概率事件。

3. **千元机时代正式结束是 BOM 成本结构的根本性重构**。存储 + 内存已占 BOM 60%（千元机）/ 30%（旗舰），手机厂商的定价权被三星/SK 海力士/美光夺走。2027 年 1500 元以内机型"绝迹"是确定性事件，对应的是华为、小米、苹果的定价分层加剧。

4. **存储 Q3 涨幅收窄到 13-18% 是"假降温"**。大客户长协价 + 头部 CSP LTA 锁定掩盖了现货市场的真实紧张。HBM 现货价是合约价的 4-5 倍（36GB HBM3E 现货 2100 美元），DDR4/SLC NAND 在中小客户渠道"有价无市"。Q4 三星再次涨价 10-15%，意味着 2027 年才是真正的供需转折点。

5. **中美 AI 对话入官方磋商机制是 2026 年最重要的地缘事件**。之前美国对华 AI 管制是"硬脱钩"叙事（实体清单、H100/H200 禁运），现在何立峰-贝森特首次 AI 对话意味着 AI 治理进入"软协调"阶段。这对国产 AI 芯片（昇腾/寒武纪/海光）和模型（DeepSeek/Kimi/Qwen）是利好——风险溢价下降，估值空间打开。

6. **半导体设备国产化率 24% → 50% 是 2026-2030 年的核心 alpha**。SEMI 预测 2029 全球设备支出 1720 亿美元，中国大陆 37% 份额约 640 亿美元，按 50% 国产化目标，本土设备空间还有 2 倍。光刻（DUV 28nm）、量检测、涂胶显影、离子注入是洼地。中微、北方华创、拓荆、长川、华海清科是 5 大龙头。

**重点关注节点（未来 1-2 周）**

- **9.30 国家统计局发布 9 月 PMI 数据**——制造业能否回到扩张区间（50+）是关键

- **10 月底前 DeepSeek-V4 系列是否再次调价**——模型定价能力验证
- **11 月中旬 TrendForce Q4 DRAM/NAND 合约价更新**——存储涨价是否见顶

**风险提示**

- **原油价格突破 $110**：若霍尔木兹海峡冲突进一步升级，布油或冲击 $120，输入性通胀压力将压垮货币政策

- **DeepSeek 涨价影响模型采用率**：API 价格上调 2.3-4.5 倍后，若客户开始流失（梁文锋称"未流失"），将冲击 5000 亿估值叙事
