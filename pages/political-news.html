## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**国务院常务会议密集部署（10.14 前后）**

- **🟥 加快场景培育和开放**：国务院常务会议部署加快场景培育和开放推动新场景大规模应用有关举措，关于加快场景培育和开放推动新场景大规模应用的实施意见将于近期出台。重点瞄准新领域新赛道，优先布局新领域新赛道场景、高价值小切口场景和跨区域跨领域综合场景。十五五规划建议明确"实施新技术新产品新场景大规模应用示范行动"。来源：[经济参考报/中宏网](http://www.macrochina.com.cn/news_speed/hgjj/20251104124282.shtml)
- **老旧水库改造提升**：国务院常务会议 9 月研究全面系统推进老旧水库改造提升有关工作，水利部 10.13 召开专项行动推进会议，国家发改委在中央预算内投资中单列科目优先保障。"力争今年年底前全面完成排查评估、明年 3 月底前完成评估成果复核"。来源：[新华每日电讯](http://mrdx.cn/content/20261014/Articel03002NR.htm)
- **关于发展新质生产力的意见**：10.9 中共中央、国务院印发，被清华大学迟永胜评价为"新质生产力概念提出以来最高层级、最为系统的纲领性文件"，围绕五大方面部署 19 项重点举措，"创新主导、改革为要、因地制宜、先立后破"四条原则。明确加快 8 大战略性新兴产业（信息技术/新能源/新材料/智能网联汽车/机器人/生物医药/高端装备/航空航天），前瞻布局 6 大未来产业（量子科技/生物制造/氢能/核聚变/脑机接口/具身智能/6G）。来源：[证券时报](https://www.toutiao.com/article/7696287650688418338)
- **十五五开局 + 新质生产力**：8.31 国常会部署"强化正向引导和刚性约束"、促进招商引资高质量发展。2025 财政部联合多部门对地方财政补贴专项整治，2026 政府工作报告明确"出台地方政府招商引资鼓励和禁止事项清单"。

**Mavis 点评**：今天的政策信号极清晰——"场景"成为继"产业"之后的第二战场。**新质生产力意见 + 场景培育实施意见**形成"科技攻关 → 产业落地 → 商业规模化"的完整闭环，且把"严禁一哄而上、搞泡沫化"写进文件——这是一次"既要又要"的精准调控。

### 2.2 🟠 经济面 E

- **🟥 9 月 LPR 维持不变**（连续 16 个月）：1Y LPR 3.0%，5Y 以上 LPR 3.5%。央行 7 天期逆回购利率 1.4% 持平。8 月新发放企业贷款加权平均利率略低于 3%，新发放个人住房贷款利率约 3.1%。8 月新房价环比连续 38 个月下跌但降幅为 8 个月最窄。10.20 待定，市场普遍预期维持。来源：[Trading Economics](https://tradingeconomics.com/china/interest-rate)、[中宏网](http://macrochina.com.cn/news_speed/hgjj/20260921125451.shtml)
- **上半年 GDP 同比 +4.7%**，达 69.57 万亿元；二季度环比 +0.9%，未失速。GDP 增量 3.6 万亿创近五年同期新高。第三产业（服务业）增加值 41.37 万亿、+5.2%，增速领跑。服务零售额 +5.3%、商品零售额 +1.1%，差值 4.2 个百分点。来源：[央广网](https://www.cnr.cn/jingji/rdzt/zgjjnb/jdt/20260731/t20260731_527739534.shtml)
- **🟥 工业结构**：上半年规模以上工业增加值 +5.4%，高技术制造业 +13.3%，航空航天/电子通信设备 +16-17%，AI 芯片/智能车载 +30%+。1-5 月集成电路产量 +25.4%，上半年总产量 2798 亿块、+23.1%，**日均芯片产出约 15 亿块**。来源：[央广网](https://www.cnr.cn/jingji/rdzt/zgjjnb/jdt/20260731/t20260731_527739534.shtml)
- **新三驾马车**：3D 打印设备 +48.5%、工业机器人 +28%、锂电池 +39.3%；新能源汽车产销 743.8 万 / 744.6 万辆，同比 +6.7% / +7.3%，纯电动占比 67%。来源：[央广网](https://www.cnr.cn/jingji/rdzt/zgjjnb/jdt/20260731/t20260731_527739534.shtml)
- **国际对比**（OECD 9 月报告）：G20 通胀 2026 预计 4.1%，中国 -0.1% 调整后 +1.4%（最低之一）。中国 2027 预测 +1.9%，美国 2026 调降至 +3.6%。来源：[Analysis Atlas](https://analysis-atlas.com/research/global-inflation-interest-rate-cycle-analysis)
- **美 10Y 破 5.29%**：9.30 创 2002 年 5 月以来新高，全球债市同步抛售。Fed 9.16 加息 25bp 至 3.75-4.00%（2023.7 来首次），5 个央行 19 天内连续加息。来源：[Analysis Atlas](https://analysis-atlas.com/research/global-inflation-interest-rate-cycle-analysis)

**Mavis 点评**：中国"以我为主"政策定力 + 美国"通胀粘性"被迫再加息，货币政策分化进入 2026 最深阶段。**LPR 16 个月按兵不动**反映银行净息差已到极限（8 月新发企业贷 <3%），后续若要降息，可能先降存款利率或降准。OECD 把中国 2026 通胀下修到 1.4%——价格端没空间，量的增长全靠产业升级。

### 2.3 🟣 社会面 S

- **消费结构升级**：服务零售 +5.3% vs 商品零售 +1.1%，差值 4.2 个百分点。文旅休闲、民生普惠（养老/家政/托育/社区食堂）、商务服务三大主线打开长期空间。来源：[央广网](https://www.cnr.cn/jingji/rdzt/zgjjnb/jdt/20260731/t20260731_527739534.shtml)
- **新能源汽车渗透率 >60%**，仍有 20-30 个百分点提升空间；行业增长重心已转向海外。国内 1-5 月集成电路 +25.4% 反映"AI 算力 + 工业升级 + 新能源车"三大需求叠加。来源：[央广网](https://www.cnr.cn/jingji/rdzt/zgjjnb/jdt/20260731/t20260731_527739534.shtml)
- **新质生产力 5 月起**资本市场映射明显：5.25 华为"韬定律"发布当日，A股芯片板块爆发，东芯股份/华虹/甬矽 20cm 涨停，中芯国际/盛美/拓荆 10 余股涨超 10%。

**Mavis 点评**：上半年社零数据最反直觉的，是**商品消费只有 1.1%**——价格战打了一整年（汽车/家电/3C 全面降价）的结果。但 1-5 月集成电路产量 +25.4% 是个被忽视的关键数据，意味着**电子产品"量增价跌"**——老百姓用便宜价格买到了更多设备，AI/智能制造相关品类是真正增量。

### 2.4 🔴 技术面 T

- **🟥 华为"韬(τ)定律"**：5.25 何庭波在 IEEE 国际电路与系统研讨会发布，**放弃"几何缩微"改走"时间缩微"**，通过逻辑折叠技术降低信号传播时延、压缩 τ。预计 2031 年基于韬定律的高端芯片晶体管密度达到 1.4nm 先进制程的同等水平。**过去 6 年已基于韬定律量产 381 款芯片**。2026 秋季新麒麟芯片将率先采用逻辑折叠技术。来源：[新华社/经济参考报](https://big5.cctv.com/gate/big5/finance.cctv.cn/2026/05/26/ARTIfLuwOhRcH69UCMx2jhC8260526.shtml)、[China Daily](https://www.chinadaily.com.cn/a/202605/25/WS6a13e601a310d6866eb4a8d6.html)

- **🟥 长江存储 232 层 3D NAND 量产验证通过**（中微刻蚀机 70% 国产化率进入长江存储批量采购清单，2026.2.24）。长存 2026 Q2 NAND 位元出货份额 14%（Counterpoint），稳定跻身全球第三；294 层等效工艺突破。来源：[泷澹电子](http://www.longdan-ei.cn/semiconductor-component-news/21.html)、[界面新闻](https://www.jiemian.com/article/14956293.html)
- **长鑫 DDR5 良率达 90%**（17nm 制程，与三星 92-93% 仅差 2-3pp），已通过苹果测试但拒绝苹果压价。Q2 营收同比 +716%，全球 DRAM 份额 7-8% 排第四。Q1 营收 508 亿元（同比 +719%）。月产能 28-30 万片，年底冲 35 万片。来源：[未来半导体](https://www.fsemi.tech/cms/xinwenkuaixun/5541.html)、[华强资讯](https://news.hqew.com/info-374342)
- **生物医药/机器人**：上半年工业机器人产量 +28%；3D 打印 +48.5%；锂电 +39.3%。

**Mavis 点评**：韬定律是过去十年中国半导体最大的"叙事转换"——从"追赶制程"转向"换维竞争"。但要注意，**逻辑折叠+灵衢总线+全栈协同**这套打法极依赖华为自身的研发体量，行业内多数企业短期难以复制。**真正落地**要看 2026 秋季新麒麟——这是韬定律的"实弹"测试。

**Mavis 点评**：消费电子"涨价潮"已传导到每一个终端——**iPhone / Xbox / 联想 / 华为 / 小米 / OPPO 同步涨价**。背后是同一条传导链：HBM 需求爆炸 → 产能虹吸 → 消费级供给紧缩 → BOM 上升 → 终端涨价。**Q4 这条链不会缓解**，因为 HBM 产能扩张需要 12-18 个月。

## 6. ✏️ 五、编辑后记

**总论（4 大主线）**

今天 4 大主线：

1. **🟥 手机 Q3 -20% + 存储 DDR5 现货 +480%**——AI 算力虹吸产能的代价在消费端集中爆发。Counterpoint 报告 10.12 落地，TrendForce 10.1 已预告 Q4 涨 10-20%——这条传导链已被市场完全定价，但终端价格涨幅（中端机型 $100-300）才刚刚开始。
2. **🟥 SMIC 单季 30 亿美元 + 国产存储 IPO 双线推进**——长鑫市值 4.13 万亿（超工行），长江存储 IPO 辅导完成（拟募 330 亿），存储"双雄"在 A 股完成会师。这是"国产替代"叙事的最高水位。
3. **🟥 锗管制 + 稀土管制 + 光刻胶 +15% + ASML 韩国涨价**——上游材料/设备"四涨齐发"，AI 算力外溢效应已传导到化工/材料全链条。11.27 镓/锗对美管制暂停到期是 Q4 最大政策窗口。
4. **🟥 韬定律发布 + DeepSeek-V4 国产芯片并列入官方文档**——AI 芯片国产化进入"算力验证"阶段，不再是 PPT。

**Mavis 独立判断（6 条）**

1. **DDR5 +480% 同比是真实的"AI 算力税"**——美光 CEO 说"即便 AI 泡沫破裂，存储价格也不会再回到从前"是真心话，因为 LTA（5 年长协 + 40% 预付）已经把涨价写进合同。**2027 Q1 前消费电子的"成本海啸"不会停**。
2. **长鑫拒绝苹果压价是质变信号**——Q2 营收 +716% + 全球 DRAM 份额 8% + 拒绝苹果，意味着国产存储从"低价替代"转"主动定价"。**LPDDR6 2026H2 量产 + 17nm DDR5 良率 90%** 是接下来两个最关键的里程碑。
3. **华为韬定律不是"营销叙事"**——6 年量产 381 款芯片是真实数据；秋季新麒麟是"实弹测试"。但要警惕**过度乐观**——逻辑折叠对 EUV 依赖度降低，但 chiplet 堆叠、先进封装（CoWoS）仍依赖台积电。
4. **SMIC Q3 毛利率 26-28% 创新高不一定是终点**——日本光刻胶 +15% + ASML 涨价 10% 将在 Q4 传导到制造端。**Q4 SMIC 毛利率能否守住 26%，取决于 ASP 转嫁能力**。
5. **手机厂商"主动 -30%"是好事**——小米/OV 减少低价机型投入、聚焦高端 + 自研芯片（XRING O3）是健康的策略调整。**消费电子的"低端机时代"可能就此结束**——这对中国手机品牌的全球定位是机会，不是危机。
6. **稀土/锗/镓管制的"期权价值"被严重低估**——Q4 氧化镝的 AI 需求可能进入"历史级别拐点"（海外转产高端 MLCC 加速存货消耗）；11.27 镓/锗暂停到期是 Q4 最大政策窗口，**持有资源的人获得稀缺溢价，持有产能的人获得排期权**。
