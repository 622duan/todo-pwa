## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

- 🟥 **9.11 国务院常务会议**：李强主持，研究加强安全生产、**算力网建设**（合理布局、多层次网络化算力体系、算电协同+算网融合、绿电直连+源网荷储）、**老旧水库改造提升**、听取教育强国汇报、审议《基金会管理条例（修订草案）》。中行未来 5 年提供 **不少于 3000 亿元** 综合金融支持算力产业链。([第一财经](https://www.yicai.com/epaper/pc/202609/14/content_54122.html)) ([财新](https://finance.caixin.com/2026-09-14/102484568.html))
- 🟥 **2026 中国算力大会（9.11-13，银川）**：中国算力平台实现全国一体化算力统筹监测，"一张网、一盘棋、一体化"格局基本形成。截至 6 月，智算规模达 **2185 EFLOPS（FP16）**，**同比 +177%**；建成 70+ 算力传输通道、17 个国家算力互联互通区域节点；算力超市上架产品 2000+ 项，沉淀监测数据数十亿条。([中国青年网](https://news.youth.cn/gn/202609/t20260914_16867499.htm))
- **太空算力加速**：上海"**明珠星座计划**"9.13 启动，目标 2030 年建成 GW 级天基计算星座；北京经开区+天津经开区+雄安+廊坊共建"**京津冀太空算力产业长廊**"；中国信通院+北京太空智算研究院成立"**太空算力关键技术与场景验证实验室**"（业界首个）。([第一财经](https://www.yicai.com/epaper/pc/202609/14/content_54122.html))
- **金融监管**：央行 9.14-17 连续 4 天隔夜逆回购（单日 ≤6000 亿）；央行副行长朱鹤新 9.9-11 接连会见新金管局、香港证监会、标普全球代表；证监会严肃查处*ST 卓然财务造假，拟罚 1250 万+3580 万。([腾讯新闻](https://news.qq.com/rain/a/20260914A034W600))
- **AI 治理**：习近平 9.12-13 金砖新德里会晤提出五项倡议，包括"率先建设**金砖国家人工智能开源专区**"；中方将构建人工智能开放生态。([华尔街见闻](https://www.toutiao.com/article/7685159437448315418/))
- **数据要素**：9.11 **国家数据产权登记服务系统**正式上线试运行，推行"三权分置"（持有权/使用权/经营权）。([华尔街见闻](https://www.toutiao.com/article/7685159437448315418/))
- **农业保险**：财政部+农业农村部+金融监管总局+国家林草局联合印发《关于加快农业保险高质量发展的实施方案》。([腾讯新闻](https://news.qq.com/rain/a/20260914A034W600))
- **数字乡村**：中央网信办+农业农村部+工信部联合印发《数字乡村高质量发展行动计划（2026-2030）》，提出 5G/千兆光网覆盖、卫星互联网补盲、无人农机、低空物流。([华尔街见闻](https://www.toutiao.com/article/7685159437448315418/))
- **智能网联新能源汽车**：《智能网联新能源汽车产业发展"十五五"规划》印发，提出 L3+ 自动驾驶规模应用；"**AI+软件专项行动**"提出重点行业打造 **100 个智能体软件标杆**。([同花顺](https://news.10jqka.com.cn/20260914/c679855294.shtml))

**Mavis 点评**：今天的政策核心是"**算力网**"——从国务院会议到算力大会到银行 3000 亿金融支持到太空算力，四件事连成一根线。国家在把算力从"项目"升级为"基础设施"，配合 6.4 万亿元"六张网"投资主线（信息通信"十五五"规划 3.8 万亿已落地）。这不是撒钱，是**国家级的算力供给侧改革**——把分散的区域算力、央企算力、互联网算力拧成一张网。中小企业回款难吹风会（9.14 下午）也是观察"反内卷"政策落地的重要窗口。

  - 电子商品类零售 **+12.2%**、家电音像 **+10.1%**、餐饮/交通服务 **+5%+**
  - 算力基础设施项目中标金额 **同比 +80%**
  - AI/人形机器人前沿领域资本投资 **同比 +101.6%**
  - 主要港口离港载重 **+16.5%**，集装箱船 **+23.4%**，滚装船 **+141.0%**（汽车出口爆发）
  - ([人民网](https://finance.people.com.cn/BIG5/n1/2026/0911/c1004-40797167.html))
- **中美贸易**：商务部 9.10 确认中美双方正在就 **300 亿美元对等降税框架** 进行磋商，争取早日落地。([新浪财经](https://finance.sina.com.cn/roll/2026-09-14/doc-inirtwik4087585.shtml))
- **市场监管**：发改委+市场监管总局发布关于重要工业品**低价无序竞争成本核算**的通知，启动反内卷式成本调查。([新浪财经](https://finance.sina.com.cn/roll/2026-09-14/doc-inirtwik4087585.shtml))

#### 国产存储突破

- 🟥 **长鑫 LPDDR6 量产**（9.7）：单颗粒 16Gb，封装 16GB，速率 12800Mbps，**vs LPDDR5X 带宽 +60%、功耗 -20%**；全球首发**小米 18 Fold**。双子通道架构、24bit 原生 I/O、双轨 DVFS、Link ECC+On Die ECC+每行激活计数防行锤。1295 Ball FBGA 封装焊球面积较 LPDDR5 的 496 Ball **大 50%**，采用高导热 High K EMC 塑封料使**颗粒热阻 -40%**。([太平洋电脑](https://g.pconline.com.cn/x/2181/21817135.html))
- **FT 独家**：长鑫 CXMT+长江存储 YMTC 已购够**未来 3 年所需 ASML DUV 光刻机**（DUV 库存填到 2028），但 EUV 仍被卡。([CoinEx](https://www.coinex.com/ar/feed/news/6a9f7cf2e0268f0d0c7da76c))
- **国产存储历史性一刻**：从 LPDDR5 到 LPDDR6 不到一年，是国产存储**从追赶到并跑**的标志。落地场景将涵盖手机、PC、汽车、边缘服务器、可穿戴、机器人。

**Mavis 点评**：本周存储现货市场出现**分裂信号**——DDR5 持平、DDR4 主流小涨、**NAND 跌 2.71%**。这是**AI 需求 + 消费电子需求 双轨分裂**的体现：AI 服务器继续拉动 HBM/DDR5（RDIMM 32GB +8.11%），但传统 PC/手机 DDR5/DDR4 需求疲软。**Sigmaintell Q3 涨幅从 Q2 的 13-18% 收窄到 8-13%**——这是**涨价周期见顶**的早期信号，但 Q4 还有 N5/N7 wafer 涨价合约兑现。**长鑫 LPDDR6 商用**是 2026 年存储行业最重磅事件——三星原本计划 2026 H2 才推 LPDDR6，被长鑫抢先半年。**CXMT/YMTC 三年 DUV 备货** 这个消息被市场低估——意味着 28nm/14nm 国产化路径不会被美方"卡设备"切断，至少能撑到 2028。

2. 🟡 **手机涨价潮已经进 CPI**。8 月**移动电话机 +2.3%、平板 +2.1%、数据存储设备 +2.1%**——这是存储+芯片涨价向下游传导的**第一次宏观数据确认**。Q3-Q4 手机 ASP 还会涨 3-5%，**iPhone Ultra 1999 美元只是开始**。受益：长江存储、长鑫、兆易；受损：传音、小米（性价比战略承压）、荣耀。

4. 🟠 **ASML 新 EUV 抢单 200 亿欧元 = 中国半导体代差"被锁定"**。SMIC/YMTC 拿不到 EUV，**国产 7nm 以下路径至少 2-3 年内无法跑通**。但 CXMT/YMTC 3 年 DUV 备货填到 2028 + 长鑫 LPDDR6 量产 + 中微 3nm 刻蚀 = **"28nm/14nm 国产化 + 28nm 内存 + 3nm 刻蚀"组合拳**。这是中国半导体的"次优解"，但 2026-2028 已经够用。

      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-political-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
