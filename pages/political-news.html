## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**国务院 9.28 国常会 + 央行 9.29 "四箭齐发"**——本周最大政策落地：

- 🟥 **国务院常务会议 9.28**：李强主持，研究宏观政策发力提效、促进有效投资有关工作。会议明确要加大宏观政策逆周期调节力度，"推出一批务实管用的增量政策"。重点方向：[来源](https://www.toutiao.com/article/7691315591587627547)
  - 存量政策加紧加力落地："十五五"规划、"六张网"（水网、新型电网、算力网、新一代通信网、城市地下管网、物流网）实施方案
  - 优化财政支出、用好地方政府债务结存限额（理论仍有 **6000+ 亿元** 空间）
  - 综合运用并适时调整货币政策工具
  - 研究出台稳定房地产市场、促进就业增收措施
  - 新污染物治理、事业单位登记管理条例草案

- 🟥 **央行 9.29 组合拳**：为贯彻政治局 + 国常会精神，央行"四箭齐发"：[来源](https://m.nbd.com.cn/articles/2026-09-29/4594945.html)
  - **PSL 利率下调 25BP**（从 1.75% → **1.5%**），纳入"六张网"领域
  - **科技创新和技术改造再贷款 +2000 亿元**
  - **支农支小再贷款 +5000 亿元**（其中 **3000 亿** 专项支持民营）
  - 配合 **10.1 起实施的居民房贷贴息政策**（首套、≤120㎡、≤150 万，年化 1% 贴息最长 5 年）

- **国常会"六张网"工程**：央企年内计划投资约 **2 万亿元**。[来源](https://english.www.gov.cn/archive/statistics/202609/30/content_WS6abcc14ac6d00ca5f9a0d8af.html)

- **促消费贴息**：10.1 起实施，扩投资、促消费贴息加力 [来源](https://news.cctv.com/2026/10/02/ARTICDlZReViJ7AJcjUiBa6R261002.shtml)

- **服务业扩能提质**：国家发改委推出一系列支持服务业举措。上半年服务业对经济增长贡献率达 **66.1%**，较上年同期提高 5.9 个百分点。到 2030 年服务业总规模迈上 **100 万亿元** 台阶。[来源](https://cpc.people.com.cn/n1/2026/1001/c64387-40808554.html)

**Mavis 点评**：9.28 国常会 + 9.29 央行，是 **2024 年 9 月以来最强的一次政策组合拳**。PSL 重启（2023 年 PSL 暂停后罕见操作）+ 房贷贴息（中央财政首次直接补贴商贷利息）+ 7000 亿再贷款额度，三个动作同时落地，**释放"四季度全力冲刺全年目标"信号**。"六张网"是核心抓手，算力网、新型电网直接利好数字基建和电力设备链。5000 亿支农支小里 3000 亿定向民营，是给民企"发糖"。⚠️ 注意：央行把"适时调整"措辞加回去，意味着 10.20 LPR 还有可能动。

|---------|------|------|------|

| 生产指数 | **51.7%** | 50.4% | +1.3 |
| 新订单 | **50.5%** | 50.6% | -0.1 |
| 主要原材料购进价格 | **60.8%** | 56.6% | **+4.2** 🟥 |

- 🟥 **9 月原材料购进价格指数飙升至 60.8%**（升 4.2pp），出厂价格指数 **54.0%**（升 3.6pp）—— 通胀压力在制造业侧明显抬头，主因国际原油 + 化工品涨价。[来源](https://news.cctv.cn/2026/09/30/ARTIcmvvaItbFulpob43TOzH260930.shtml)

- **前 8 个月外贸数据**（海关总署）：进出口总值 **34.78 万亿元**，同比 +**17.6%**；出口 20.17 万亿 +14.6%；进口 14.61 万亿 **+22.0%**（进口增速连续 6 个月超出口）。[来源](https://www.toutiao.com/article/7691126848264176170/)

- **央行货币政策**：1 年期 LPR **3.00%**（连续 16 个月持平），5 年期以上 **3.50%**。[来源](https://datatrack.trendforce.com/Chart/content/3794)

**Mavis 点评**：9 月 PMI "双喜"（制造业 + 建筑业双双重回扩张），但原材料价格飙到 **60.8%** 是 🟥 **核心警报**——这意味着 10-11 月 PPI 同比可能转正，下游利润空间被压缩。进口连续 6 个月超出口说明 **内需修复强于外需**，铜、原油、铁矿等大宗补库是关键变量。央行买断式逆回购净投放 2000 亿是节前流动性对冲，不是宽松转向。

**细分市场分化**：
- **Server DRAM**：Q4 供不应求延续；CSP、Server OEM 追加采购以满足 Agentic AI 场景下 General Server 的 RDIMM 需求
- **PC DRAM**：2027 年原厂产能将进一步转向 Server，PC OEM 维持积极采购支撑价格
- **Mobile DRAM**：前期已大涨，Q4 涨势收敛；原厂配额持续紧缩
- **GDDR7**：AI 芯片需求带动，产能受限于先进制程向 Server DRAM 倾斜
- **eMMC/UFS**：手机厂以既有库存支撑 Q4，新增采购有限
- **Wafer**：价格达历史高点，模组厂采购转趋保守

        document.getElementById('newsContent').innerHTML = html;
      } catch (e) {
        document.getElementById('newsContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function downloadNews() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-political-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
