## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**国务院常务会议三箭齐发（8.31）**——李强主持召开国务院常务会议，三件大事定调 9 月政策主线：
- **🟥 城市地下管网建设**：要求"从源头消除安全隐患"。"十五五"期间将建设改造城市地下管网约 **77 万公里**，目前全国总规模约 390 万公里（全球第一）。会议明确"注重统一规划、建管并重"，相关目标已纳入《城市更新"十五五"规划》主要指标。
- **🟥 规范招商引资**：强化正向引导和刚性约束，**把招商重点从"拼优惠、拼补贴"转向"拼营商环境、拼服务、拼生态"**，建立与企业常态化沟通机制。这是全国统一大市场战略的延续与升级。
- **税收征管法修订草案**原则通过、《审计法实施条例（修订草案）》审议通过。

**9 月起新规落地（9.1 起）**：
| 政策 | 影响 | 部门 |
|------|------|------|
| 公积金提取情形 6→9 种，租房不再设工资比例门槛，贷款审批 15→10 日 | 🟢 释放消费潜力 | 国务院 |
| 🟥 部分电池消费税 2% 开征（2027 升至 4%）；钙钛矿/固态/钠电/燃料电池**免征**至 2028 | 🟢 利好新型电池 | 财政部/海关/税总 |
| 《微短剧发展管理办法》：分三类备案，AI 生成须显著标识 | 🟡 规范内容 | 国家广电 |
| 公积金条例修订 9.20 施行 | 🟢 释放购房 | 国务院 |
| 出境入境管理新规 9.15 施行（防电诈） | 🟡 中性 | 国务院 |
| 金融产品网络营销管理办法 9.30 施行 | 🟡 规范营销 | 央行/金融监管 |

| 锂电池/钠电池/燃料电池 9.1 起**2%** 消费税，钙钛矿/固态/叠层/砷化镓**免征** | 🟢 利好新电池 | 财政部 |

**Mavis 点评**：🟢 9 月政策面"宽货币+稳财政+促消费+强科技"四线并行。城市地下管网 77 万公里改造对应 5 万亿+ 投资规模，电池免税直接利好新能源车与储能链。**公积金、电池、AI 客服三个新规都踩在 9 月这一周密集生效，预期催化窗口短而密**。

**央行跨月操作（9.1）**：开展 50 亿 7 天逆回购 + 3590 亿隔夜逆回购，**净回笼 4690 亿**。隔夜 Shibor 回落至 1.36%，DR007 报 1.38% 跌至政策利率下方 [证券日报 9.1](https://www.toutiao.com/article/7680572097768309282/)。9 月有 1.78 万亿中长期工具到期+政府债 1.81 万亿发行+季末考核三重扰动，机构普遍预期"呵护态度明确+精准滴灌为主"。

**进出口：集成电路成第一大出口商品**：
- 🟥 **前 7 月集成电路出口 2160 亿美元（+99.5%）**，**已超 2025 年全年 2019 亿美元总额**。7 月单月 387.4 亿美元、增速 **116.57%**，**正式超越汽车成第一大出口商品**（量增 7%，价涨 83%）[海关总署 8.7 / 央视 8.29](https://news.cctv.cn/2026/08/30/ARTIZBshoJbszOFb0XJjHOl5260830.shtml)。
- 存储芯片占芯片产品贸易出口 **70.1%**，同比增速 **221.7%**。深圳龙华某存储企业"几乎每周向欧洲出口 500 万美元"，半年扩产近 3 倍。封装设备订单排到 2028 年，客户"提着现金抢货"。
- PCB 上半年出口 161.2 亿美元（+34%），泰国/越南/马来西亚增 50%+。

**Mavis 点评**：🟢 8 月 PMI 是"内热外温"——新订单+2.1pct 是 6 个月最大涨幅，出厂价格指数时隔 5 月重返扩张。**集成电路出口是 2026 年中国外贸最炸数据，单一品类就贡献了 1-7 月外贸增速约 6.75 个百分点**。央行 9 月"削峰填谷"基调不变，四季度降准 0.25-0.5pct 的预期仍在。

### 2.3 🟣 社会面 S

**就业压力加大**：
- 🟥 7 月 16-24 岁青年失业率（不含在校生）**17.9%**（+3pct），是近三年同期最高。7 月城镇调查失业率 5.2%（+0.2pct，超季节性）。25-29 岁 7.2%、30-59 岁 3.9%。**2026 届高校毕业生 1270 万人，再创新高** [财经 8.28](https://www.mycaijing.com/article/detail/579677)。
- 上半年全国城镇新增就业 695 万人，全年目标 1200 万+。
- 7 月规模以上工业增加值 +4.5%，出口 +17.8%，社零 +0.6%，1-7 月固投 **-6.7%**——**生产强、内需弱的结构未改**。

**消费端最大变量：9.1 全国手机厂商统一调价**：
- 多款手机涨幅 **500-1000 元**，部分高端机型门槛大幅提升 [中国经济网 9.2](https://www.ce.cn/cysc/newmain/yc/jsxw/202609/t20260903_3189207.shtml)。
- 余承东 8.5 公开表示"内存高昂涨价，所有手机之后可能都要大规模涨价"——这是他今年第二次公开喊话。
- 小米 8 月启动第二轮涨价：小米 17 系列/REDMI K90/Turbo 5 全线涨 300-500 元。

**Mavis 点评**：🟠 **8.6% 同比降幅 + 17.9% 青年失业 + 1270 万毕业生 + 手机集体涨价 1000 元**，四组数据一起看，是"消费信心弱+刚性支出涨"的双重挤压。9 月开学季是消费力测试的第一个观察窗口。

### 2.4 🔴 技术面 T

- 🟥🟥 **长鑫存储正式启动 HBM3E 风险试产**，平头哥、寒武纪等已收到样品进行测试，若验证顺利，**2027 年量产装入国产 AI 芯片**。这意味着 HBM 出口管制（2024.12 起）**首次出现实质性裂缝**。长鑫同时**全球首家量产 LPDDR6**，首发搭载于小米 18 Fold 折叠屏。
- 长鑫 Q2 全球 DRAM 收入份额 7%（第四），仅次三星/SK/美光。Counterpoint 评为"最快扩张供应商"。

**CSEAC 2026 半导体设备展（8.31-9.2 无锡）**：

- 北方华创+芯源微联合展台；拓荆 PECVD/ALD/SACVD 全线出击；盛美上海清洗 8000 腔交付；中科飞测 X 射线纳米显微成像量测设备。
- 高盛预测：**2027 年中国晶圆制造设备市场规模将达 530 亿美元，本土企业市占率从 2024 年 26% 升至 2028 年 38%** [新浪财经 9.2](https://finance.sina.com.cn/tech/roll/2026-09-02/doc-iniqmmyu4548649.shtml)。

**AI 算力**：
- IDC+浪潮：2023-2028 年中国智能算力规模 CAGR 46.2%，2026 年达 1460.3 EFLOPS。

- 海光 2026Q1 营收 40.34 亿（+68%），CPU+DCU 双芯方案落地 10 万卡 AI 超集群。
- 国产 AI 芯片 2026 出货目标 ~300 万张（含沐曦/壁仞等 100 万+）。**英伟达在华份额从 2023 年 ~95% 跌至 2026 年 ~8%**。

**Mavis 点评**：🟢 **长鑫 HBM3E 是 9.2 美股闪迪/美光盘前跌 1.9-3% 的直接导火索**——Citi 认为"中国产能扩张是存储板块最大长期风险"。CSEAC 6 款新品意味着国产设备从"能用"进入"好用"，**2027 年是国产 28nm 全谱系/部分 14nm 量产的关键年**。

        document.getElementById('newsContent').innerHTML = html;
      } catch (e) {
        document.getElementById('newsContent').innerHTML = '<div class="p-4 text-red-500 text-[13px]">解析失败：' + e.message + '</div>';
      }
    }

    function goHome() { window.location.href = 'home.html'; }
    function goPage(p) { window.location.href = p; }

    function downloadNews() {
      try {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-political-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    init();
