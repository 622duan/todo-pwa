## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**🟥 9·28 国常会 + 央行/财政部一揽子政策集中落地**

- **9 月 28 日国常会**明确"加大宏观政策逆周期调节力度"，存量政策加紧落地、增量政策加快出台。10 月 1 日起实施居民购房贷款贴息（首套 + 建筑面积 ≤120 ㎡ + 价格 ≤150 万），政策期暂定 1 年。
- **央行 9·29 组合拳**：(1) 下调 PSL 利率 0.25 个百分点；(2) 抵押补充贷款支持领域从"两重"扩展至水网、新型电网、算力网、新一代通信网、城市地下管网、物流网"六张网"；(3) 增加科技创新和技术改造再贷款 **2000 亿元**；(4) 增加支农支小再贷款 **5000 亿元**。
- **财政部蓝佛安 10/1 在《求是》撰文**：今年一般公共预算支出超 30 万亿，新增各类政府债券 11.89 万亿；中央本级科技支出预算 +10%（基础研究 +16.3%）；下达超长期特别国债 2000 亿支持 22 个领域约 1.1 万个项目设备更新；8 月规模以上高技术制造业增加值同比 **+16.7%**。
- **国家发改委 10/2 推出服务业扩能提质**政策：研发设计、现代物流、软件信息等专业服务嵌入产业链；养老服务消费补贴全面推开；上半年服务业对经济增长贡献率达 **66.1%**，较上年同期 +5.9pct。
- **国办 9/30 印发《关于发展体育赛事激发消费活力的意见》**（5 方面 17 项任务），目标到 2030 年基本建成中国特色现代化赛事体系。
- **置换债发行**：截至 8 月末 6 万亿置换债已发 5.8 万亿，存量隐性债务规模与融资平台数量持续下降。

> 📎 [证券时报：加强逆周期调节](https://stcn.com/article/detail/4203331.html) · [财政部《求是》文章](https://m.chinanews.com/wap/detail/cht/zw/jw691097.shtml) · [央视：服务业扩能提质](https://news.cctv.com/2026/10/02/ARTICDlZReViJ7AJcjUiBa6R261002.shtml) · [人民日报：加快建设强大国内市场](https://cpc.people.com.cn/BIG5/n1/2026/1004/c64387-40809245.html)

**Mavis 点评**：9·28 国常会打的是"政策组合拳"，不是单点脉冲。PSL 利率下调 + 8000 亿结构性再贷款 + 房贷贴息 + 财政部蓝佛安《求是》定调"扩内需"——这是四季度稳增长的"基座"。尤其房贷贴息从"降利率"转向"财政直补"，意味着需求端支持从金融让利进化到政府承担，是真金白银。

### 2.2 🟠 经济面 E

**🟥 9 月制造业 PMI 重回扩张，价差信号需警惕**

- **9 月 PMI 三连扩张**：制造业 PMI **50.1%**（+0.3pct）、非制造业 **50.2%**（+1.2pct）、综合 PMI **50.7%**（+1.2pct）。生产指数 **51.7%** 为年内最高，但新订单 50.5% 仅勉强守住扩张线——**生产-新订单剪刀差扩大至 1.2pct**。
- **价格指数双升**：主要原材料购进价格指数 60.8%（+4.2pct），出厂价格 54.0%（+3.6pct），均升至年内第三高位；9 月 PPI 同比机构预测回升至 +1.0%，但购进-出厂剪刀差 **6.8pct**，中下游毛利率继续承压。
- **高频数据**：
  - 国庆假期首日高速公路充电量 **2804.69 万千瓦时**，YoY **+60.40%**，创历史节假日单日新高。
  - 国庆假期海南进出岛客流预计 **162.5 万人次**，YoY +6.9%。
  - 长三角铁路 10/2 发送 400 万人次。
- **地产分化**：9 月 300 城住宅用地成交 3750 万平（YoY **-34.6%**），土地出让金 1678 亿元（YoY -19.7%）；但深圳 8·28 新政后多个楼盘上调价格或收紧折扣。
- **机构预测**：新浪财经汇总预测 9 月工增 +5.6%、社零 +0.7%、CPI +1.0%、PPI +4.4%（注：PPI 预测口径含原油/煤炭成本推动）。

> 📎 [东方财富·财经早餐](https://caifuhao.eastmoney.com/news/20261003061904776830330) · [新浪财经·三季度数据汇总](https://finance.sina.com.cn/roll/2026-10-04/doc-initzzvc3794798.shtml) · [新华社·服务业扩能提质](https://news.cctv.com/2026/10/02/ARTICDlZReViJ7AJcjUiBa6R261002.shtml)

**Mavis 点评**：9 月 PMI 数据"形似强复苏、实则生产端独木撑天"。生产指数 +1.3pct 但新订单只 +0pct，剪刀差扩大是典型的"政策冲量"特征。新订单能否跟进，是 Q4 经济数据会不会"破 50"的关键。PPI 涨价更多由原油/煤炭成本推动，下游能否传导决定盈利是否改善。

### 2.3 🟣 社会面 S

- **就业**：1—8 月城镇调查失业率平均 **5.2%**；中央财政已下达就业补助资金 **667 亿元**；育儿补贴制度全面落实，今年下达补助资金 **999 亿元**（YoY +10.6%）；城乡居民基础养老金提标。
- **消费**：1—8 月社零总额同比 +2.5%，服务零售额 +4.9%；消费品以旧换新累计带动销售 **1.55 万亿元**，惠及 **2.08 亿人次**。上半年人均可支配收入名义 +5.2%，实际 +4.2%。
- **国庆档票房**：截至 10/3 下午破 **5 亿元**，年度总票房超 300 亿元，但首日票房 **1.76 亿元**（YoY **-45.2%**，创近五年新低）；花旗预测国庆档总票房约 **16 亿**（YoY -12%）。
- **中秋国庆出行**：9 月电影票房/出行强度修复，地铁/国内航班均符合季节性；汽车销售仍是主要拖累项（9 月前 27 日乘用车零售 125.8 万辆，YoY **-29%**）。
- **人口与社保**：城乡居民基本医疗保险人均财政补助标准提高 24 元；新就业形态人员职业伤害保障试点向全国推开；居家上门照护、老年助餐/助浴/助医、托育点加快推进。
- **突发事件**：10/2 商务部对原产于欧盟的进口对硝基甲苯发起反倾销立案调查。

**Mavis 点评**：消费端是分化升级不是全面回升——必需品（家电以旧换新、新能源车下乡）景气，可选消费（电影首日 -45.2%）持续承压。补贴政策在抑制滑坡但难以制造增量，关键看 Q4 房地产能否企稳（购房贴息 10/1 落地）。育儿补贴 +10.6% 的财政增量是少有的"投资于人"逆周期。

### 2.4 🔴 技术面 T

**🟥 DeepSeek × 华为：TileLang 开源，国产 AI 算力软件栈破壁 CUDA**

- **9/30** DeepSeek 通过官方公众号宣布，将面向华为昇腾芯片的一整套开发工具（TileLang + DeepGEMM-Ascend + DeepEP-Ascend + TileLang 高级语言编译 + 计算库 + 分布式通信库）**开源**，全部组件与英伟达 CUDA 平台版本"一一对应"。DeepSeek 称其训练大模型用到的每一段底层计算程序（算子），在昇腾芯片上都有了对应的高性能版本。
- **10/1** 华为同步宣布昇腾 950 智算集群云服务在国内正式商用；DeepSeek 与华为联合优化 128 卡超节点，跨卡发送带宽 **375 GB/s**、聚合 **347 GB/s**（8 卡规模）。
- **DeepSeek 采购规模**：彭博社报道，DeepSeek 计划部署至少 **16 万颗**昇腾 950DT，用于内蒙古乌兰察布 1GW 数据中心；梁文锋在投资者会议披露华为供给约 **1.6 万张卡**，互联网大厂"十几万张"。
- **昇腾 950 超节点参数**：单节点 1024 卡（灵衢互联），最大扩展 **8192 卡**，总算力 **1 EFLOPS@FP8 / 2 EFLOPS@FP4**，256TB 统一内存、千卡硬件 MTBF **300 小时**、万卡 30 小时；上一代昇腾 384 超节点已商用 **750 多套**。
- **CANN 开源生态**：非华为开发者数量已超过华为开发者，基于昇腾完成预训练的大模型已超 **40 个**；华为联合 23 家公司发布 FlagOS 2.0，覆盖 18 家厂商 32 款芯片。
- **中国移动 10/1 落地昌平**：华为昇腾 950DT 千卡超节点正式落地北京昌平信息港数据中心（1 EFLOPS FP8）；移动云已兼容昇腾、平头哥、昆仑芯、摩尔线程、燧原、壁仞、海光、沐曦、天数智芯 9 大国产 AI 芯片。
- **寒武纪规划**：2026 年 AI 芯片出货目标 **约 50 万颗**（含思元 590 和下一代思元 690，思元 690 单款最高 30 万颗）。

### 3.3 🔬 芯片

**🟥 国产芯片：SMIC N+3 + 麒麟 9050 Pro 双芯封装成定局**

- **麒麟 9050 Pro 拆解**（Kurnal Insights，10/2）：Logic Die 采用 SMIC **N+3** 工艺（11.13 × 10.84 mm ≈ **120.65 mm²**）+ SRAM Die 采用 **N+2** 工艺，两片通过 LogicFolding 垂直堆叠；面积小于麒麟 9030S（122 mm²），良率理论上更高。
- **N+3 工艺**：最小金属间距 **32.5 nm**，比 Intel 18A（36 nm）更紧凑，晶体管密度接近台积电 N6。
- **SMIC 现状**：2026H1 营收 **25.05 亿美元**（超指引）、毛利率 **20.1%**、产能利用率 **93.1%**；8/12 英寸平均利用率 100%+；2026Q2 营收环比 **+20%**，全球份额 **5.4%**（与三星差距 0.5pct）；8 寸等效产能 **110 万片/月**（全球第二）。

- **国产 AI 芯片客户**：

## 6. ✏️ 五、编辑后记

**📌 今天 4 大主线**

1. **政策端强信号**：9·28 国常会 + 央行/财政部一揽子增量政策集中落地（PSL -25bp + 8000 亿再贷款 + 房贷贴息 + 财政部蓝佛安《求是》定调"扩内需"），四季度逆周期加码。
2. **AI 算力国产化软件破壁**：DeepSeek × 华为 9/30 开源 TileLang 全套工具 + 昇腾 950 超节点 8192 卡商用 + 中国移动千卡落地北京，国产 AI 算力从"硬件替代"进入"软件生态共建"阶段。
3. **存储 Q4 涨价潮再升级**：常规 DRAM +10%~+15%、NAND +15%~+20%、Enterprise SSD +23%~+28%；DDR5 现货溢价 20%、DDR4 现货溢价 44%；美光 FY26Q4 营收 542 亿美元（YoY +379%）、毛利率 87%；长鑫 349 亿扩产豪赌 HBM。
4. **芯片国产化重大节点**：麒麟 9050 Pro 拆解确认 SMIC N+3+N+2 双芯 LogicFolding 工艺，120.65 mm² 面积接近 3nm 等效密度；同时 ASML DUV 出口已从 33% 降至 14%，MATCH 法案酝酿全面禁运。

**🧭 Mavis 独立判断 5 条**

1. **AI 算力"硬件脱钩 → 软件脱钩"已成定局**：DeepSeek TileLang + 华为 CANN + 摩尔线程/沐曦/算能等多厂商适配，意味着中国版 CUDA 生态开始有"种子用户"。这才是 9·30 那波消息的真正战略意义——比昇腾芯片产能扩张更关键。
2. **存储超级周期的真正信号不在 Q4 合约价，在 DDR4 现货溢价 44%**：当主流厂商不再生产 DDR4，存量买家只能去现货市场抢货，这是结构性短缺而非周期紧张。长鑫 HBM 良率 25% → 70% 的爬坡曲线，将是 2027 年存储周期反转/延续的最大变量。
3. **麒麟 9050 Pro 双芯封装是 SMIC 的"工艺胜利"**：在没有 EUV 的前提下，N+3+N+2 LogicFolding 做到了 120.65 mm² 接近 3nm 等效密度——这是对 ASML "无 EUV 即无先进制程"假设的正面挑战。但 SMIC 产能利用率 93%+ + 排期到年底，意味着所有国产 AI 芯片厂商的"卡脖子"是排队问题，不是技术问题。
4. **9 月 PMI "形似强复苏、实则生产端独木撑天"**：生产指数 +1.3pct 但新订单只 +0pct，剪刀差扩大是典型的政策冲量。新订单 10—11 月能否跟进，决定 Q4 经济数据会不会"破 50"——这是债市、A股、消费股的关键宏观变量。
5. **手机市场的故事已经从"出货量"变成"ASP"**：苹果 Q2 全球 +23% YoY、市占突破 20%，中国 iPhone 18 Pro 首周 33% 份额，背后是国产安卓品牌被存储涨价 + 自身高端化能力不足双向压制。Counterpoint 警告 Q4 中国销量低于上一代，建议关注 10/8 复市后苹果链 vs 安卓链分化。
