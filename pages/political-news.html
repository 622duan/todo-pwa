## 板块 3：📊 宏观 PEST · 政策 + 流动性 + 经济数据

### 3.1 政策面（国常会 + 央行 + 财政部三连击）

**国务院常务会议 9.28：宏观政策发力提效、促进有效投资**。李强总理主持召开会议，研究宏观政策发力提效、促进有效投资有关工作，听取新污染物治理进展情况汇报，审议通过《事业单位登记管理条例（草案）》。会议提出**加大宏观政策逆周期调节力度**，推出一批务实管用的增量政策：（1）加快各类债券发行使用进度，推动"十五五"规划、"六张网"实施方案明确的重大工程项目尽早开工，推进老旧水库、老旧粮库改造提升；（2）用好地方政府债务结存限额（10-12 月计划发行 1 万亿元、结存限额 1.76 万亿元，预计本次安排 5000-6000 亿元）；（3）综合运用并适时调整货币政策工具，增加科技创新和技术改造、支农支小再贷款额度，研究出台稳定房地产市场、促进就业增收等政策措施。

**9.29 央行"组合拳"**：（1）下调抵押补充贷款（PSL）利率 **25BP 至 1.5%**；（2）将"六张网"（水网、新型电网、**算力网**、新一代通信网、城市地下管网、物流网）纳入 PSL 支持领域；（3）增加科技创新和技术改造再贷款额度 **2000 亿元**（总额从 1.2 万亿增至 1.4 万亿、支持比例从 60% 提至 100%）；（4）增加支农支小再贷款额度 **5000 亿元**（其中民营企业再贷款增 3000 亿）；（5）10.8 开展 **1.2 万亿元 3 个月期买断式逆回购**，净投放 2000 亿元。

**居民房贷贴息 10.1 落地**：财政部、央行、金融监管总局联合发文，**自 10.1 起实施居民购房贷款贴息政策，暂定 1 年**。条件：①新发放商贷购买首套房（不含置换）；②建筑面积 ≤120 ㎡；③房价 ≤150 万元。贴息：贷款规模最高 100 万元、**年化 1 个百分点、贴息期限最长 5 年**。六大行已明确"免申即享"——每期还款自动扣除。

**9.29 国办《关于发展体育赛事激发消费活力的意见》**：到 2030 年基本形成具有中国特色的现代化赛事体系，培育具有世界影响力的体育赛事。9.29 商务部延长对美贸易壁垒调查至 2026.12.27（两起）。10.4 商务部对原产于欧盟的进口对硝基甲苯发起反倾销立案调查。

**Mavis 点评**：9.28 国常会 + 9.29 央行降 PSL + 9.29 房贷贴息 = 政策"组合拳"已经打出 3 张牌，明确指向"年底稳增长 + 十五五开局"。PSL 利率降至 1.5% 且纳入算力网，是给算力基建开闸；1 个百分点的房贷贴息覆盖中低总价首套（150 万×120 ㎡），是中央财政直接介入居民购房融资成本的标志性工具。**Mavis 判断**：四季度还会有至少 1 轮降准或降息，10.20 LPR 调整窗口最值得盯。

## 板块 7：✏️ 五、编辑后记

### 7.1 总论：4 大主线

**今天是 10 月 8 日，国庆假期后首个交易日。假期外盘的最大冲击不是 9 月非农爆冷（+2.9 万人 vs 预期 8.4 万），而是 10Y 美债 5.31% 创 2002 年以来新高 + 30Y 5.70% 同创 + WTI 站稳 90 美元**。长端利率高企的本质不是通胀，而是**财政赤字 + 期限溢价 + 能源供给**三重共振。

国内政策端"三连击"已经明确：9.28 国常会"加大逆周期调节" + 9.29 央行降 PSL 25BP + 9.29 房贷贴息政策。**Q4 主线 = 政策兑现 + 业绩兑现 + 估值修复**。

**4 大主线**：
1. **国产芯片业绩兑现期**——中芯 Q3 营收 23.82 亿美元创新高 + 寒武纪 Q3 营收 +13.3 倍 + 国产 AI GPU 六强 Q3 合计 203 亿 → 从"政策扶持期"迈入"业绩兑现期"。
2. **存储涨价进入"超长景气"**——4Q26 DRAM +10-15% / NAND +15-20% / Enterprise SSD +23-28%，**HBM 2027 混合 ASP +121%** → SK 海力士/三星/美光/A 股兆易创新/江波龙/佰维存储"双击"。
3. **AI 算力"去英伟达化"工程化**——DeepSeek 开源昇腾 6 大基础组件（TileLang/DeepGEMM 等）+ 内蒙古 16 万颗昇腾 950 DT + 华为昇腾 960 DT 提前到 2027 Q1 → 黄仁勋最怕的剧本正在落地。
4. **MATCH 法案悬而未决**——大摩指出美拟出台的 MATCH 法案是"全链条技术封锁"，短期压制产线爬坡进度，长期加速国产替代。

### 7.2 Mavis 独立判断（5 条）

1. **🔴 风险提示**：10Y 美债 5.31% 是"全球资产定价之锚"创 2002 年以来新高——30Y 5.70%、英国 30Y 6%、法国 10Y 4.96% 全部创多年新高。**期限溢价 + 财政赤字**正在重构全球长端利率定价，A 股高估值成长股短期承压，但**港股恒生科技 + 半导体 + AI 算力**的回调反而是左侧布局机会。

2. **🟢 国产存储"周期变成长"**——长鑫上半年营收 1100-1200 亿、净利 +22 倍；长江存储三期 2026 H2 投产；**两大存储厂 2026 设备采购 550-630 亿元**。这不是库存周期，是 AI 驱动的结构性增长——数据中心对存储需求占比从 2 年前的 20% 跃升至 60%+。

3. **🟢 DeepSeek 开源昇腾 6 大组件 = 中国版 CUDA 的工程化起点**——TileLang 是"Python 写高性能算子、编译到不同硬件"，加上华为 CANN、寒武纪 CNML、摩尔 MUSA 已经在 V4 / Qwen / GLM 等国产模型上 Day0 适配。**国产 AI 算力卡位战从 PPT 进入现金流阶段**。

4. **🟠 手机市场"B 故事"是涨价 + 高端化**——iPhone 18 涨 20%、ASP 创纪录 $550、折叠屏 +20%，但全球出货 -13.9%。国产手机突围只能靠折叠屏 + AI Agent + 鸿蒙生态。**存储涨价对中低端是利空，对苹果/华为/小米旗舰反而是定价权武器**。

5. **🔴 9 月 CPI -0.3% 但核心 +1.0% 创 19 月新高**——通缩阴影未消、内生动能修复。**央行 Q4 仍有降准可能（50bp）、LPR 10.20 仍可能下调 5-10BP**。财政端"用好地方政府债务结存限额 1.76 万亿"是 Q4 增量政策的最大看点。
