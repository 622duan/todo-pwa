### 2.2 🟠 经济面 E

- 🟥 **8 月经济数据（9.15 发布）**：规模以上工业增加值同比 **+5.2%**（环比 +0.54%）；服务业生产指数 +4.1%；货物进出口总额同比 **+19.8%**；装备制造业 +12.1%；**高技术制造业 +16.7%**。来源：[新华网](https://www.cinn.cn/sj/index.html)
- **前 8 月财政数据**：全国一般公共预算收入 15.66 万亿元，同比 +5.7%；税收收入 12.91 万亿元、+6.6%；其中**证券交易印花税 +82%**（股市成交活跃带动）、个税 +14.5%；出口退税 1.65 万亿元、多退 707 亿元。来源：[经济日报](https://www.toutiao.com/article/7687430268919104042/)
- **前 8 月发票数据**：工业销售收入 +7.3%、装备制造业 +10.1%、**计算机通信设备制造 +18.8%**、电气机械 +14%、仪器仪表 +14.1%；**集成电路销售收入 +67.7%**、智能车载设备 +38.8%（与 AI 相关）。来源：[人民日报海外版](https://www.toutiao.com/article/7688246633510879744/)

### 2.3 🟣 社会面 S

- 🟥 **9 月新能源汽车产销再创新高**（中汽协，9.20）：产销分别 **161.7 / 160.4 万辆**，同比 **+42.7% / +45.6%**；**渗透率 49.7%**；出口 22.2 万辆同比翻倍。1-9 月累计 ~1260 万辆，市场占有率接近一半。**乘联会口径 9 月新能源乘用车零售渗透率 57.8%**（再创历史新高）。来源：[中汽协](https://www.ccedia.com/finance_detail/1551186368859987968.html)

- **充电基础设施**：截至 8 月底，全国电动汽车充电设施（枪）总数 **2422.3 万个**，其中公共充电枪 516 万个（+19.5%）、私人充电枪 1906.3 万个（+46.3%）。
- **粮食产业**：国家粮食和物资储备局表态，"十五五"时期我国粮食产业有望实现年工业总产值 **4.5 万亿元以上**。

- **突发**：胡塞武装袭击沙特延布、利雅得沙特阿美设施，马克龙宣布法军赴延布保护能源设施（详见国际板块）。

## 6. ✏️ 五、编辑后记

### 6.1 总论

本周（2026-09-20 至 09-26）是 **"三大事件密集落地周"**：① 中美关系最高级别会晤（习特白宫会谈 + 9.21-9.25 国事访问），达成新一轮经贸联合安排 + AI 政府间对话机制 + 贸易休战延至 2027.1.10；② 国产 AI 算力 + 存储双线爆发（阿里 V900 3 倍算力、长鑫 G5 +50% 产出、寒武纪 Q2 +93% 扣非、燧原挂牌）；③ 存储超级周期进入"自我强化"阶段（苹果接受 +30-40%、云厂商主动锁价 2027 Q1）。

### 6.2 Mavis 独立判断（6 条）

1. **存储"长协锁价"是周期顶的早期信号还是中继？** 我倾向后者——美银 Memory Indicator 7 月 180（2017-18 峰值仅 120），云厂商主动锁价意味着买方承认"AI 算力是战略资源"。2028 年即使软着陆，HBM / SOCAMM / eSSD 等先进产品继续吸纳产能，2029-2030 年将由更先进 AI 应用接力，**本轮超级周期长度远超历史均值**。

2. **中芯 vs 华虹的 Q3 增长分化不是景气差异，而是"产能 vs 产品组合"差异**——中芯 Q2 已涨价到位、产能天花板临近；华虹 FAB9B 还在爬坡、ASP 弹性更大。**晶合（DDIC 涨价）、芯联（SiC + AI）Q3 弹性可能最大**。

3. **华为国内 27% 份额不可持续**——是 Pura X View 5 天 28.2 万台首销 + iPhone 18 Pro 空窗期的短期现象。但华为折叠屏 ~60% 份额是真的结构性壁垒，**iPhone Duo 起价 $1,999 是折叠屏进入主流价位段的真正起点**。

4. **国产 AI 芯片"安全可靠 I 级认证"是政企市场通行证**——9 款芯片入选（含昇腾 / 真武 / 壁砺 / DCU / KCC-V100X / MXC600 / PH100），意味着这些厂商在党政 / 金融 / 能源 / 运营商集采中已具备"标配"资格，**2026 H2-2027 H1 将看到国产芯片在政企市场份额从 ~30% 向 50%+ 突破**。

5. **中美 AI 对话机制正式建立**是本周边际变化最大的事件——商务部确认中美首次 AI 对话、双方同意"以人文本、向上向善"、防范 AI 滥用。**这意味着英伟达 H200 / H100 对华出口、AMD MI300、博通 ASIC 等 AI 芯片的"许可讨论"有了正式渠道**——但 ASML / EUV / DUV 仍是结构性卡脖子。

6. **新能源车渗透率 49.7%（产销）/ 57.8%（乘用车零售）是历史性里程碑**——从政策驱动全面切换到市场驱动；**Q4 旺季叠加年末冲量 + 智能驾驶 / 快充技术迭代，全年渗透率有望破 50%**；但价格战延续 + 欧美碳足迹合规压力是 2027 年最大风险。

### 6.4 风险提示

- 🟥 **存储"超级周期"提前见顶风险**：若 AI 资本开支在 2026 Q4 放缓，DRAM / NAND 价格调整可能早于"2028 软着陆"预期；存储板块股价（江波龙 / 兆易创新 / 佰维存储等）已较高点回撤 50%+，存在继续下探空间

- 🟥 **美债收益率突破 5.2%（10Y）/ 5.48%（30Y）的全球流动性风险**：30Y 收益率创 2004 年以来新高，若 6% 关口突破将引发全球资产重新定价
