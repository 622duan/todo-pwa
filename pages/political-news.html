### 3.2 💾 存储

**4Q26 涨价预测（TrendForce 9/24 报告）**：

| 品类 | 4Q26 涨幅 | 2026 全年涨幅 |
|------|----------|--------------|
| Conventional DRAM（综合） | +13~18% QoQ | – |
| Server DRAM | 持续上涨 | **🟥 +64% (2H25) → +270% (2026)** |
| HBM3e / HBM4 | – | **🟥 2027 合同价 +70~140%** |
| NAND Flash（综合） | +15~20% QoQ | – |
| QLC Enterprise SSD | **🟥 +23~28% QoQ**（KV cache 需求） | – |
| NAND 2H25 | – | +35% (2H25) → **🟥 +235% (2026)** |

**LPDDR / 移动端**：4Q26 LPDDR4X 涨幅预期 >10%（中低端机抢货 + 供给收缩）

**DDR4 反常紧缺**：原厂转向 DDR5/HBM，DDR4 供给收缩 → 涨幅超 DDR5（服务器、工控存量需求）

**HBM4 重大进展**：

| 厂商 | 量产时间 | 关键数据 | 来源 |
|------|---------|---------|------|
| 🟥 三星 | 2026/2 全球首发量产 | 单堆栈 **3.3TB/s**（最高 13Gbps）、12 层 36GB（16 层 48GB）、4nm 逻辑制程、2026 HBM4 占 HBM 出货 >50% | [百度百科](https://baike.baidu.com/item/HBM4%E8%8A%AF%E7%89%87/67310986)、[云擎](https://www.yunqing.net/help/878) |
| 🟥 SK 海力士 | 2026/2 | 12nm 制程 base die，良率 99.5%（MR-MUF）；与 NVIDIA 签 5000 亿美元长协（含 2GW AI 数据中心）；HBM 月产能 17→25 万片 | [虎嗅](https://www.huxiu.com/ainews/14767.html) |
| 🟥 美光 | 2026 Q1 | 12 层 36GB HBM4 单堆栈 **2.8TB/s**，已向 NVIDIA Vera Rubin 平台供货；月产能目标 1.5 万片（HBM4 占 30%） | [百度百科](https://baike.baidu.com/item/HBM4%E8%8A%AF%E7%89%87/67310986)、[虎嗅](https://www.huxiu.com/ainews/14767.html) |
| – | 2026/6 | 🟥 **三家全部通过 NVIDIA Vera Rubin 平台认证** | [CSDN](https://blog.csdn.net/duke_zhang2024/article/details/163957748) |
| – | 2027 路线 | HBM4E：三星样品已出，下一代 16 层 64GB | [云擎](https://www.yunqing.net/help/878) |

**HBM4 架构级变化**：接口位宽 HBM3E 1024bit → **2048bit（翻倍）**；独立通道 16 → **32**；引脚速率 9.6 → **11.7Gbps**；堆栈带宽 **1.2TB/s → 3.3TB/s**（**+2.7 倍**）；12 层 36GB / 16 层 48-64GB；功耗降至 **0.9V**，每 bit 传输功耗 -40%。

**全球内存市场规模**（TrendForce 上调）：2026 全球内存市场 **🟥 8893 亿美元**（前值 5516 亿），2027 进一步至 **🟥 1.28 万亿美元**（同比 +44%）；其中 DRAM 2026 **6187 亿**（+303%）/ 2027 **9033 亿**（+46%）；NAND 2026 **2706 亿**（+280.7%）/ 2027 **3794 亿**（+40.2%）。[TrendForce](https://www.trendforce.com/presscenter/news/20260529-13068.html)

**CSP CapEx**：2026 全球 9 大 CSP CapEx **+98% YoY**；2027 继续 **+50%**。DRAM + NAND 在 CSP CapEx 中占比 2026 年 47% → **2027 年 68%**。HBM + RDIMM 占 2026 DRAM 总供应 51%。[TrendForce](https://www.trendforce.com/presscenter/news/20260825-13198.html)

**国产存储**：
- 长江存储（YMTC）232 层 QLC 已量产
- 长鑫存储（CXMT）DDR5 17nm 良率持续爬升，但与海外仍有 1-2 代差
- 国内 HBM 主要由长鑫、武汉新芯、通富微电提供 HBM2 能力，HBM3 已突破但未量产 HBM4

**Mavis 点评**：本轮存储超级周期的三大特征——HBM4 性能跃迁、CSP 资本开支通胀、QLC 企业 SSD 接管 KV cache——**全部在 2026 年三季度集中兑现**。4Q26 DRAM 涨幅虽然较 2H25 的 +64% 收窄至 +13~18%，但**绝对价格仍处于历史高位**；更关键的是 NAND 4Q26 涨幅 +15-20% 远高于此前机构预估的 +0~+5%，说明**涨价周期大概率延至 2027 下半年**。🔴 偏空（对消费者、对消费电子产业链），🟢 偏多（对 SK 海力士 / 三星 / 美光 / 国产存储链）。

## 4. 🏭 三、上下游产业链

### 4.1 原材料

- **硅片**：12 寸硅片全球供应仍由信越、SUMCO、Siltronic、SK Siltron 主导；国内沪硅产业 12 寸产能持续爬坡；长鑫、长江存储验证进度加速
- **稀土**：8 月稀土出口管制（镓、锗、锑）持续；钨、铋等小金属价格高位震荡
- **电子特气**：金宏气体、华特气体、雅克科技持续突破海外封锁
- **光刻胶**：南大光电、晶瑞电材在 KrF/ArF 验证持续；国产化率仍 < 10%
- **CMP 抛光液**：安集科技国内份额持续提升

### 4.2 设备 / 材料

- **北方华创 / 中微公司**：刻蚀、薄膜沉积设备在 SMIC、华虹、长存订单持续；HBM4 时代 TSV 设备需求快速增长
- **拓荆科技 / 芯源微 / 盛美上海**：先进封装设备国产替代加速
- **华海清科**：CMP 设备在国内 fab 渗透率持续提升
- **江丰电子**：HBM 铜柱、HBM 凸块用溅射靶材供应三星、SK 海力士
- **沪硅产业 / 立昂微**：12 寸硅片国产化主线
- **HBM 设备链**：TSV 设备由应用材料、东京电子、DISCO 主导；混合键合设备由 ASMPT、Besi、DISCO 主导

### 4.3 制造 / 封测

- **SMIC**：上海、北京、天津、深圳工厂 Q3-Q4 集中爬坡；12 寸 7nm（N+2）持续验证
- **华虹无锡 Fab 9**（12 寸）：Q3 完成设备安装并进入满载
- **华虹无锡 Fab 9B**：年初启动招标，新增 5.5 万片/月产能
- **华虹收购华力微（Fab 5）**：证监会注册批复完成，再增 4 万片月产能
- **长江存储**：232 层 QLC 量产；3D NAND 全球第五
- **长鑫存储**：DDR5 17nm 持续良率爬坡；HBM 路线图 2027-2028 推出
- **通富微电 / 长电科技 / 华天科技**：HBM 封装测试能力建设；长电科技已进入 SK 海力士供应链

### 4.4 下游应用

- **AI 服务器 / 数据中心**：NVIDIA Blackwell Ultra 单 GPU 配 288GB HBM3E；Vera Rubin 配 HBM4 单 stack 3.3TB/s
- **PC / 平板**：存储涨价 + AI PC 出货推动 ASP 上行；联想、华为、苹果 AI PC 路线齐发
- **新能源车**：8 月汽车出口 +47.1%；单车 SiC、IGBT 用量持续提升；功率器件涨价
- **机器人**：8 月工业机器人 +34.6% / 机器人减速器 +11.4%；人形机器人出货全球占比 97%
- **消费电子涨价潮**：移动电话机 +11%、计算机 +19.6%、平板电脑 +21.5%；存储涨价正式传导到 C 端价格

**Mavis 点评**：上游设备 / 封测 / 材料 + 下游 AI 算力 + 消费电子涨价潮形成 2026 三季度的产业链全图——**涨价从存储晶圆沿 BOM 表向下传导至整机价格**。这是过去 30 年最罕见的一次"非地缘、非疫情、非能源"驱动的产业链通胀周期，CSP 的 AI 资本开支是核心源头。🟠 关注：消费端涨价对销量的反噬——Q4 数据是关键观察窗。

## 6. ✏️ 五、编辑后记

**今天 4 大主线**：

1. **国产 AI 算力完成"量价齐升 + 批量商用"双跨越**：华为昇腾 950 系列 + 1000 套超节点部署 + DeepSeek V4 全栈适配，国产 AI 卡市占率从 2021 年 < 5% 飙到 2025 年 41%；昇腾 950PR 单卡算力达英伟达 H20 的 2.87 倍，性能首次实现"局部超越"。
2. **存储超级周期进入"4Q26 高位震荡 + 2027 持续紧平衡"**：HBM4 三巨头全部通过 NVIDIA Vera Rubin 认证，4Q26 DRAM +13~18% / NAND +15~20%；DRAM 和 NAND 占 CSP CapEx 比例从 2026 年 47% 飙到 **2027 年 68%**；2H25 到 2026 HBM 单台均价翻倍。
3. **大陆晶圆代工从"产能市场份额"转向"利润弹性"**：SMIC Q2 毛利率 25.3%（环比 +5.2pct）/ 净利 +261.7% YoY；华虹独立式闪存 +149.3% YoY；这是 AI 需求外溢到配套成熟制程的标志性季度。
4. **8 月数据"三稳两快" + 高技术制造 +16.7%**：装备制造业 +12.1% / 高技术 +16.7% / 工业机器人 +34.6% / 锂电池 +57.2%；移动电话机价格 +11% / 计算机 +19.6% / 平板 +21.5%——AI 算力通胀正式传导到 C 端价格表。

**Mavis 独立判断（5-6 条）**：

1. 🔴 **2026 存储涨价大概率延至 2027 下半年**。HBM4 产能 2026 已被英伟达 5000 亿美元长协锁定 70%，新增产能在 2027H2 才到位；CSP 资本开支 2027 +50% YoY 仍在加速，DRAM/NAND 占 CapEx 升至 68%——供需缺口至少持续到 2027Q3-Q4。
2. 🟢 **国产 AI 芯片进入"可用 → 好用"双跨越阶段**。昇腾 960 超节点 1000 套 + DeepSeek V4 推理加速 1.5-1.73 倍 + 寒武纪 / 摩尔 / 沐曦三家集体盈亏平衡 / 国产 GPU 市占率 41%——这是过去 5 年最完整的一次"生态闭环验证"。
3. 🟠 **消费电子涨价潮的真正考验在 10-11 月**。CPI 已经把移动电话机 +11% 写进去，但 W37 周度数据华为国内份额跳到 27%（含 Pura X、Mate XT2 拉动）说明——消费者对涨价的承受力是分层的，**高端机用户比中低端用户更能扛**。Q4 双 11 / 双 12 数据是检验窗口。
4. 🟢 **晶圆代工双雄业绩验证国产 AI 算力的真实需求**。中芯 12 寸占 77.4% + 华虹独立闪存 +149.3% + 部分产品订单达产能 1.5-2 倍——这是 AI 需求**外溢到配套成熟制程**的硬证据，不是 GPU 主芯片独享的红利。
5. 🔴 **"供强需弱"是 2026 最大的宏观风险**。8 月固定资产投资 -7.2%、房地产开发投资 -19.9%、民间投资 -10.1%——内需总量仍弱；高技术制造 +16.7% 是结构性亮点，但只占总盘 < 15%。如果 Q4 不出台超预期增量政策，2026 全年 GDP 增速可能落在 4.5-4.8% 区间。
6. 🟠 **房地产困境短期难解，长护险 + 房车消费是政策托底的两个新抓手**。9/18 国常会部署康复护理扩容 + 9/18 十部门房车消费措施，指向"银发经济 + 旅游休闲"两个新消费场景；中央财政常态化帮扶资金管理办法 2026 年开始实施，乡村振兴投入预算锚定。
