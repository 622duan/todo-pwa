## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**【国务院层面】** 9 月以来政策密集落地三条主线：**教育强国**（9.23 国新办"十五五"教育发布会）、**中小企业回款**（9.10 国务院办公厅《关于加强中小企业回款难问题治理有关工作的通知》）、**高校改革**（9.20 中央办公厅、国务院办公厅《关于分类推进高校改革的意见》）。教育部副部长杜江峰披露：**"十四五"以来高校学科专业调整比例已超 20%**，已布局低空技术与工程、具身智能、脑机科学与技术等专业；"双一流"三年累计扩招本科 **6.2 万人**，**2027-2030 年还要再扩容 7.6 万人以上**。

**【货币与财政】** 9 月 20 日 LPR 维持 1 年期 **3.0%**、5 年期以上 **3.5%**，**连续 16 个月持稳**（[新华网](https://www.news.cn/fortune/20260921/b13ec3848bd14acf903ff4e58c8f4238/c.html)）。商业银行净息差 1.41%（环比 +1bp），仍处历史低位。央行《2026 二季度货政报告》定调"适度宽松"，8000 亿元新型政策性金融工具已集中投放。东方金诚王青预计"年底前有可能实施政策性降息"。

**【产业政策】** 工信部 + 市场监管总局联合出台《关于推动汽车企业规范供应商账款支付 优化账期管理的通知》，重申 60 天账期红线；央行推动账款电子凭证业务余额从高峰 3 万亿元降至 2.4 万亿（**-20%**），平均期限缩短 **92 天**。

**Mavis 点评**：政策端的最大信号不是"加码"，而是**"前期出台的政策进入效果观察期"**——LPR 16 个月不动 + 教育部 7.6 万人扩招 + 汽车 60 天账期，都是去年存量政策的落地延续。降息降准还在工具箱里，但**触发概率排在四季度经济数据之后**。

### 2.2 🟠 经济面 E

**【价格数据】** 8 月 CPI 同比 **+0.8%**（连续 5 个月回升），PPI 同比降幅收窄（[国务院](https://english.www.gov.cn/2026special/2026augdata/6a9f673cc6d00ca5f9a0d0f7)）。核心 CPI 走强折射"以旧换新"对家电、手机、汽车价格的支撑。9 月 24 日国家统计局披露 9 月中旬流通领域重要生产资料价格：**LPG +9.3%**（油气联动）、**生猪 -2.7%**、白砂糖 -0.6%。

**【消费数据】** 1-8 月社零 **+1.1%**（剔除汽车 +2.7%）；服务零售额 **+4.9%**（快于商品 3.9pct）；智能眼镜销售额 **+1.2 倍**、心电监护仪 **+75%**、运动相机 **+26.9%**（[中国经济网](https://www.ce.cn/cysc/newmain/yc/jsxw/202609/t20260921_3226284.shtml)）。乡村消费 +2.3%，增速比城镇快 1.3pct，县乡占社零比重升至 39%。

**【外贸与外资】** 前 8 个月外贸增速保持强劲，**高技术 FDI 前 8 月大幅增长**；前 8 月铁路客运量创历史新高。

**【高频信号】** 北京港口出入境 1500 万人次（较 2025 年提前 20 天破纪录）；EV 充电基础设施前 7 月快速扩张。

**Mavis 点评**：8 月数据组合显示 **"服务 + 高技术 + 乡村"是三个真实增量**——服务消费增速跑赢商品 3.9pct 不是小数字，背后是文旅、体育赛事、康养（"2115"校园体育带动的青少年体育消费外溢）的结构性力量。PPI 降幅收窄 + CPI 温和回升的组合，给后续货政留出操作窗口。

### 2.3 🟣 社会面 S

**【就业】** 前 8 月就业形势总体稳定；人社部口径失业率仍控制在 **5.1%** 左右。结构性矛盾：高校毕业生就业压力大（"双一流"扩招 7.6 万的同时也意味着 2030 年前后供给增加）。

**【消费】** 商务部商务大数据：9 月智能穿戴 + 15%+、扫地机器人 + 15%+、节能洗碗机 + 10%+。入境消费持续扩大，**扩大免签范围 + 离境退税** 协同发力，"中国游""中国购"热度攀升。

**【民生重点】**
- **教育**：教育部"十五五"规划明确 6 大重点——立德树人、基础教育扩优提质、高等教育提质扩容、职业教育"新双高"、高水平教师队伍、教育改革开放。
- **健康**：中小学"每天体育 2 小时、每天一节体育课、课间 15 分钟"（"2115"）全国推行，2024 年总体近视率连续 5 年下降。
- **人口**：高等教育毛入学率 **61.3%**，在学总规模 4873 万人。

**Mavis 点评**：社会面最大的边际变化是 **"消费下沉"**——县乡占社零比重升至 39%、乡村消费增速 +2.3%（高于城镇 1.3pct），叠加智能眼镜 +1.2 倍这种"小镇贵价新物种"的爆发，说明下沉市场的消费升级是**真实存在的**，而非平台营销话术。

**【AI 算力 — 国产芯片爆发】** 9.22 阿里云栖大会发布**真武 V900**：216GB 高带宽显存、1200GB/s 片间互联、FP8/FP4 原生支持、**单集群 50 万颗芯片规模**（[今日头条报道](https://www.toutiao.com/article/7688651722301915694/)），通义千问下一代目标 **5-10 万亿参数**，2027 Q1 全面量产上云。9.24 华为全联接大会确认：**昇腾 960DT 提前至 2027 Q1 量产、960PR 提前至 2027 Q3**，FP8 对标 H200、首次集成 4096 卡 NPO 光互联。

**【AI 算力 — 算力格局】** 华为 2026 昇腾总产量目标 **75 万颗**，字节 + DeepSeek 两家占 **51 万颗**（约 2/3），DeepSeek 内蒙古数据中心部署 **16 万颗**昇腾加速器（[ValueAdd](https://valueaddvc.com/pulse/deepseek-huawei-chips-export-controls-2026)）。高盛上调 2026-2028 中国云平台 capex 预测 **+37% / +44% / +55%**。

**【半导体设备 / 代工】** 本土晶圆制造 6 家公司 2026 H1 合计营收 **2092 亿元、同比 +221.5%**（[集微网](https://www.toutiao.com/article/7689082940207858176/)）：
- 长鑫科技 H1 营收 **1503 亿元（+873.6%）**、归母净利 **776 亿元**，全球 DRAM 份额升至 **8%（全球第四、中国第一）**；
- 中芯国际 H1 营收 386 亿元（+19.4%）、归母净利 44.67 亿元（**+94.2%**），毛利率 23.2%，Q3 指引 **26-28%**（历史新高）；
- 华虹 H1 毛利率 19.45%，40nm eFlash 完成量产前验证，FAB9B Q4 设备搬入；
- 北方华创 H1 营收 201.6 亿元（**+24.9%**），中微公司刻蚀设备净利 **+300.2%**。

**【新能源 / 生物 / 6G】** 上海合作组织峰会 + 十五五"碳达峰行动方案"接续推进；具身智能、脑机接口、低空经济首次进入教育部"超常规布局"专业清单。

## 3. 📱 二、重点行业（手机 / 存储 / 芯片）

### 3.1 📱 手机

**【全球出货】** Counterpoint：**2026 Q2 全球智能手机出货同比 -11%**，为 2013 年以来 Q2 最弱。**Apple + Samsung 合计份额 26%、同比 +2pct**，小米 / OPPO / vivo 因中低端暴露最深下滑最猛：
- **Samsung**：24% 重夺第一（Galaxy A 系列强劲）；
- **Apple**：**20%**（连续 2 季 20% 创纪录），iPhone 17 系列成全球最畅销单品，占 6% 份额；
- **小米**：12%（同比 -26%）；
- **OPPO**：11%；
- **vivo**：8%。

**【全年前瞻】** IDC 将 2026 全年全球智能手机出货下调至 **同比 -16.7%**（约 -2 亿台），2026 H2 受冲击最大。ASP 创纪录 **$550**（同比 +$100）。**百元机 Q2 出货同比 -60%**，厂商正在砍低价机型。

**【ASP 拉升】** Counterpoint 估算 **$600+ 价位段份额已从 5 年前 20% 升至 30%**。Apple Pro 系列起售价 $1099、Pro Max $1199、Samsung Galaxy S Ultra $1299。**iPhone 18 Pro Max 256GB 起 $1299、iPhone Duo 折叠屏起 $1999**。

**【国产侧冲击】** 9 月新机潮集体涨价：**华为 Mate 80 系列涨 800-1000 元**、**小米 17 系列涨 300-1000 元**、**REDMI K90 累计涨幅约 23%**（[longbridge](https://longbridge.com/en/news/299834931)）。CAICT：国产手机平均换机周期已达 **40.2 个月**（5 年前约 22 个月）。

**【IDC 数据】** IDC：iPhone 全球出货 Q2 **5580 万台（+15.3%）**，iOS 全年份额将达 **22%（史上最高）**。

**Mavis 点评**：手机行业**已经进入"少而贵"新常态**——出货量回不到 2018 年 1.5 亿台的天花板，2026 全球出货预计仅 1.09-1.2 亿台；但 **ASP 创纪录 $550** + iOS 22% 份额 + Apple/Samsung 合计 26% 份额，意味着**整个行业的利润池正在向头部 3 家集中**。千元机被存储涨价**完全吞噬利润**，1500 元以下机型可能 2027 年消失（群智咨询预判）。国产手机厂短期被**双重夹击**：上游存储涨价吃光中低端利润，下游换机周期延长 40 个月抑制需求。

### 3.2 💾 存储

**【4Q26 价格展望 — TrendForce 9.24 报告】**
- DRAM 季增 **15-20% QoQ**（CSP 追加 RDIMM 订单 + AI 推理驱动）；
- NAND Flash 季增 **15-20% QoQ**（消费端仅以最低量补涨）；
- **QLC Enterprise SSD 因 KV cache 需求暴涨 23-28% QoQ**（与消费 NAND 走势分化）；
- AI server DRAM 涨幅居前，**消费级 DRAM/NAND 涨幅收敛**；
- LTA（长协）**锁定了 AI 服务器相关价格涨幅**。

**【历史级别超级周期】** DRAM 2026 Q1 合约价 **+90-95%**、NAND **+55-60%**（15 年来最严重短缺）；H1 12 家国内存储上市公司合计归母净利 **1172 亿元（去年同期亏损 5 亿）**——**一年时间从亏损到千亿利润**（[腾讯新闻](https://news.qq.com/rain/a/20260922A05WWO00)）。

**【HBM 与下一代】** DigiTimes：HBM4 价格将从 2026 H2 约 $2/Gb 飙升至 **$4-5/Gb**，2027 年近半 DRAM 产能被大客户包揽。HBM 占 DRAM 晶圆产能 2026 年约 **22%、2027 年升至 30%**。

**【巨头扩产时间表】**
- **SK 海力士**：清州 M15X 2026 放量；龙仁集群（韩国 4800 万亿韩元投资规划）；
- **三星**：平泽 P5 计划 2028 量产；
- **美光**：爱达荷首厂 2027 年中投产、纽约厂投资上调至 **2500 亿美元**；
- **长鑫**：月产能从 26.5 万片→2028 年底 50 万片（**3 年翻倍**）；LPDDR6 已送样、车规 LPDDR5X 已量产。

**【DDR4 倒挂】** 三星/SK/美光规划淘汰 DDR4 产线，但中低端手机主芯片仍主要支持 DDR4，导致 **DDR4 现货价格倒挂 DDR5**。NOR Flash、SLC NAND 利基产品 2026 H1 累计涨幅 **100-150%**，H2 预计再涨 60-75%。

**Mavis 点评**：存储行业从"涨跌同步"裂变为"**AI 与消费两条独立曲线**"——QLC eSSD 因 KV cache 暴涨 23-28%，普通消费 NAND 仅最低量补涨；HBM 抢产能导致 DDR4 现货价格**反超** DDR5。**长期协议（LTA）已成刚需**，闪迪 SSD LTA 周期延长至 **5 年**，希捷/西部数据与云厂商签至 2028 年后。这意味着**小客户、消费电子厂的"内存断供危机"不是新闻稿，而是未来 1-2 年的现实风险**——OPPO 已经拒接三星 Q3 报价就是个早期信号。

### 3.3 🔬 芯片

**【国产代工龙头业绩 — H1 2026】**
- **中芯国际**：营收 386 亿元（+19.4%）、归母净利 44.67 亿元（**+94.2%**）、毛利率 23.2%；Q3 指引营收环比 +2-4%、毛利率 **26-28%**（历史新高）；H1 销售晶圆 537.9 万片（+14.9%）、ASP 由 6482 元升至 6667 元；**12 英寸收入占比 78.2%**、消费电子占比 45.1%（+4.3pct）、工业与汽车 15.4%（+5.3pct）。高盛维持"买入"，H 股目标价 **153 港元、A 股 257.9 元**（[网易](https://dy.163.com/article/L7JVAIHU05198UNI.html)）。
- **华虹公司**：营收 + 19% / 产能利用率 102.8%、65nm 及以下收入 **+63.4%**、占比升至 28.6%；华力微（3.8 万片/月 12 英寸）9.3 完成股权过户并表。
- **晶合集成**：Q2 扣非净利 0.92 亿元（同比转正），Q3 毛利率指引 **25-27%**（较 H1 提升 3-5pct）。
- **芯联集成**：Q2 扣非净利 0.86 亿元（上市以来首次转正）；AI 业务 +84.31%、碳化硅功率模块国内份额 **16.9%（第一）**。

**【AI 芯片国产版图】**
| 场景 | 进口卡 | 国产顶位 | 定位 |
|------|--------|----------|------|
| 大模型训练 | H200 | **昇腾 910C / 950PR / 950DT** | FP16/BF16 约 H100 的 60-80% |
| 大模型推理 | H20 | **昇腾 910B / 910C / 寒武纪 MLU590** | 显存大、集群落地最多 |
| A100 替代 | A100 | **海光 DCU Z100/Z100L** | ROCm/HIP 接近 CUDA |
| 互联网自研 | — | **百度昆仑 P800 / 平头哥真武** | 推理、推荐、训练垂直闭环 |

**【H200 进口卡脖子】** 美国 2026.1 起对 H200 改"逐案审查"。C4ADS 数据：约 **10 家中国公司有许可，但至 2026 年中**实际发货仍为零**（[Adalytica](https://adalytica.com/news/nvidia-h200-china-licenses-no-shipments-f0a76d70)）；理论上限 75 万颗/家、合计 75 万颗，但实际运抵"极少"。许可证更像"未来需求的期权"，不是近期收入。

**【国产化率】** 长鑫全球 DRAM 份额 **8%（全球第四、中国第一）**；长江存储 294 层 3D NAND 进入全球第一梯队；中国大陆存储产能占全球 **10% 出头，2030 年目标 20%**（约每 5 片 DRAM 晶圆 1 片来自中国）。

**Mavis 点评**：本周芯片行业**最炸数据**是 **A 股半导体 H1 净利 +607%**（1605 亿元），其中**长鑫一家贡献 776 亿元**（占比 48%）。这不是统计游戏，而是**"涨价 + 国产替代 + AI 需求"三重共振**的财务结果。中芯 H1 净利 +94% 看似"不及"长鑫 +8736%，但意义完全不同——**中芯的 +94% 是量价齐升 + 结构升级**，反映的是成熟制程到先进节点的爬坡，不是周期红利。这意味着即便 2027 H2 DRAM 价格回调，中芯的盈利中枢仍能守住；但长鑫的盈利弹性会随周期回吐。

## 4. 🏭 三、上下游产业链

### 4.1 原材料

- **硅片**：12 英寸国产硅片已可覆盖 14nm 以上节点，服务长鑫/长江存储扩产。沪硅产业、立昂微受益。
- **电子特气 / 靶材**：江丰电子、安集科技、雅克科技订单饱满。
- **稀土 / 镓 / 锗**：出口管制延续，价格中枢上移。
- **有色（铜/铝/锡/锂/镍）**：高盛认为美国关键矿产关税"悬而未决"反而推动金属囤积，铜尤其受 AI 资金支持，COMEX 买盘可能扩大纽约-伦敦价差。
- **黄金**：道明证券预测 2027 年突破 **$5000/盎司**；中国央行连续 22 个月增持，全球央行月购金约 70 吨。

**Mavis 点评**：原材料端**两条独立线索**——一是**半导体材料随存储/代工扩产同步景气**，二是**战略储备型金属（铜、白银、铂、钯、黄金）因关税预期向美国集中**，前者是产业逻辑，后者是宏观逻辑。

### 4.2 设备 / 材料

- **北方华创（NAURA）** H1 营收 **201.6 亿元（+24.9%）**，刻蚀 + 薄膜沉积双增；

- **薄膜、刻蚀、量测三类合计占存储设备 capex 50%+**（东吴证券测算）。

**Mavis 点评**：设备厂的订单可见度已经拉到 **2027 年中**——这背后是长鑫 + 中芯 + 华虹 + 晶合 + 芯联五家代工厂的同步扩产。新一轮的"扩产周期"不是 2017-2019 那种"先扩后压"，而是**"涨价红利 + 国产替代 + AI 需求"三轮驱动**，设备厂景气至少能看到 2027 H2。

**Mavis 点评**：制造端的"产能跃迁"不只在数字——**更核心的是结构升级**：中芯消费电子占比 +4.3pct、华虹 65nm 以下 +63.4%、晶合 28nm 导入、芯联硅光规模供货。这意味着国产代工正从"低价填产能"切换到"**先进节点+特色工艺+AI/HBM/碳化硅多元赛道**"。

**Mavis 点评**：下游应用的"分裂"是这个周期的最大特征——**AI 算力侧欣欣向荣、消费电子侧被成本压垮**。同一个存储芯片涨价，对 CSP 是利好（推动 AI 服务收入），对 OPPO/vivo/小米是利空（吃掉整机利润）。这是 2026 H2 最值得跟踪的"利润再分配"主线。

## 6. ✏️ 五、编辑后记

### 总论

今天的政经图景是**"国产 AI 芯片主场 + 存储超级周期延续 + 全球手机出货新低 + 美联储紧缩重燃"四条主线交织**。

- **主线一：国产 AI 芯片的"产能反向证明需求"**——华为徐直军承认昇腾产能连国内需求都满足不了；阿里云栖真武 V900 单集群 50 万卡规模国内第一；昇腾 960 提前到 2027 Q1 量产。DeepSeek 内蒙古 16 万卡昇腾集群是国产算力规模化的里程碑。
- **主线二：存储超级周期从"全面涨价"裂变为"AI 与消费两条曲线"**——TrendForce 4Q26 报告显示 QLC eSSD 因 KV cache 需求暴涨 23-28%，普通消费 NAND 仅最低量补涨。DDR4 现货倒挂 DDR5。
- **主线三：手机行业进入"少而贵"新常态**——Counterpoint Q2 全球 -11%（13 年新低），但 Apple/Samsung 合计份额升至 26%；IDC 将 2026 全年下调至 -16.7%，千元机被存储涨价吃光利润。
- **主线四：美联储紧缩重燃 + 国内 LPR 16 个月不动**——美 9 月 PMI 58.4（62 个月新高）+ 投入价格指数 66.4（近 4 年最高），美银预测年底或再加息两次；国内降息预期延后至四季度数据出炉后。

### Mavis 独立判断（5 条）

1. **🟥 "存储缺货"将持续至 2027 H2，但涨价斜率明显放缓**——三大原厂 Q3 涨幅已从 Q1 的 +90-95% 收敛至 13-20%；消费端客户对高价的承受力已达极限**。2026 H2 是"价格惯性 + 量缩"组合，2027 H1 才会真正看到价格见顶信号**。

2. **🟢 国产代工"涨价红利 + 结构升级"双轮驱动**——中芯 H1 净利 +94% 的关键是 ASP 升至 6667 元/片 + 12 英寸占比 78.2%，而非纯涨价。这意味着即便 DRAM 价格 2027 回调，中芯盈利中枢仍能守住**。高盛 153 港元目标价还有空间**。

3. **🟥 千元机 2027 年消失不是危言耸听**——群智咨询预测：**存储成本增量已吞噬千元机全部利润**，1500 元以下机型可能 2027 年退出市场。REDMI K90 累计涨价 23%、华为 Mate 80 系列涨 800-1000 元是最直接的证据。**Counterpoint 测算 1500 元以下市场 Q2 已 -60%**。

4. **🟢 H200 "许可证"≠ 收入**——C4ADS 数据显示 10 家中企有许可但实际发货为零。美方政策更像"对中谈判筹码"而非"商业供给"。**国产替代的实际推进速度，2026 H2 仍由 SMIC + 长鑫产能爬坡节奏决定，不是英伟达发货节奏**。

5. **🟡 LPR 16 个月不动不是"不愿降"而是"不能降"**——净息差 1.41%（历史低位）+ 8 月企业贷款利率 < 3% + 实际利率已下行。央行实际在等的是**"四季度经济数据 + 美联储路径明朗化"**双重信号，年底前政策性降息 10bp 概率 > 50%。

        const filename = `daily-political-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
