## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P — 国庆+10 月新政叠加

**10 月 1 日集中落地的新规**密度创近期新高，对居民和企业同时产生影响：

- 🟥 **房贷新政**：首套住房商贷年化 **1 个百分点**贴息，期限不超过 5 年，单户上限 100 万元，**最多可累计减少付息近 5 万元**。这是中央财政首次对商业性个人住房贷款进行贴息，由财政部、人民银行、金融监管总局联合发布（[中国证券网](https://www.cnstock.com/commonDetail/797531)）。
- 🟥 **反不正当竞争法**（10.15 起施行）：针对"内卷式"竞争，明确平台不得强制平台内经营者以低于成本价销售商品（[今日头条](https://www.toutiao.com/article/7691270105417794089)）。
- **集成电路布图设计保护条例**（10.15 起施行）：保护期 **10 年**，自创作完成之日起 15 年后不再受条例保护（[中新网](https://m.chinanews.com/wap/detail/chs/zw/jw691066.shtml)）。
- **国家国防动员法**（10.1 起施行）：明确国家实行后备兵员储备制度（[电白区政府](http://www.dianbai.gov.cn/ywdt/bmdt/content/post_1652570.html)）。
- **国内外汇贷款专用账户管理**（10.1 起）：提升服务实体经济质效（[中新网](https://m.chinanews.com/wap/detail/chs/zw/jw691066.shtml)）。
- **国办"高效办成一件事"2026 年度第二批重点事项清单**（国办函〔2026〕84 号）：扩大至建设全国统一大市场、扩大高水平对外开放等更多领域（[国务院新闻办](https://www.scio.gov.cn/zdgz/jj/202609/t20260924_1009901.html)）。
- **9 月工信部、发改委联合印发《电子信息制造业"十五五"规划》**：把集成电路列为"筑牢产业基础能力"的首位（[深水财经社](https://www.toutiao.com/article/7692792035975250482/)）。

**Mavis 点评**：10 月新规数量多到罕见，**房贷贴息+反不正当竞争+集成电路保护条例**形成"消费-平台-科技"三箭齐发。房贷贴息是真正的中央财政工具，年化 1 个百分点对一线城市影响有限但对二三线刺激明显，可以观察 11 月地产销售能否回到正区间。

### 2.2 🟠 经济面 E — 9 月数据双轨，10 月假期消费强劲

**9 月官方数据（10.1 公布）**：

- 🟥 **制造业 PMI 50.1%**，较 8 月回升 0.3 个百分点，时隔两个月重返扩张区间（[中国青年网](https://news.youth.cn/jsxw/202609/t20260930_16896721.htm)）。
- **非制造业商务活动指数 50.2%**、综合 PMI 50.7%，三项同步站上临界点。
- **9 月出口同比 +8.3%**（美元计价），高于彭博预期 7.1%；9 月对欧盟、东盟、非洲出口同比分别为 14%、15.%、59.%，**对美出口同比 -26.8%**（[华创宏观 9 月进出口数据点评](https://m.10jqka.com.cn/20251014/c671733563.shtml)）。
- **9 月进口同比 +7.4%**（超预期 1.5%）；机电进口 +10.4%（扭转连续 3 个月回落态势）。
- **贸易顺差 904.5 亿美元**（8 月为 1023 亿美元）。

**国庆假期消费（10.1-10.7）**：

- 🟥 **跨区域人员流动量预计 21.3 亿人次**，日均约 3 亿，是平时的 1.7 倍（[交通运输部](https://m.chinanews.com/wap/detail/chs/zw/10706620.shtml)）。
- **民航旅客量 3119 万人次**，单日峰值有望突破 260 万；**高速公路首日车流量 7100 万辆**，新能源车流量冲上 **1780 万辆**（平时 1.8 倍）。
- **国庆档电影票房 10.3 突破 5 亿**，年度票房超 300 亿；今年 9 部影片破 10 亿（去年全年 8 部）（[央视网](https://news.cctv.com/2026/10/03/ARTIMO5Q6s28JoNjruKbGqiU261003.shtml)）。
- **县域旅游热度同比 +42%**，游客县域平均游玩天数增加 3.2 天（[同程旅行](https://www.sohu.com/a/1083443008_123753)）；"奔县深度游"成新趋势，平潭/淳安/保亭/平遥/安吉跻身前十。
- **国际机票预订同比 +22.5%**，**境外人员 1-7 月在华消费同比 +27.8%**（"China Travel"→"China Cool"→"Chinamaxxing"→"China Haul"）。

**Mavis 点评**：9 月数据完美呼应"扩内需+反内卷"两条主线——**对美出口 -26.8% 但对非洲 +56.8%、对东盟 +15.8%**，反映"美国弱、欧东非强"的格局再确认。国庆假期 21.3 亿人次、7100 万辆高速车流、1780 万新能源车流量是结构性数据，**新能源车首次成为假期出行的核心运力**，比 2024 年的 1400 万量级翻倍。这一波假期消费能否延续到 11 月双 11，是观察四季度消费修复的关键。

- **9 月以来猪肉价格低位运行**：仔猪育肥模式每头亏损 192.70 元；9 月末能繁母猪 4035 万头，相当于正常保有量 **103.5%**（超 2.5 个百分点）（[国家发改委](https://www.huashangtop.com/topi/1/402497.html)）。
- **国庆文旅消费"打卡→深度体验"**：美团"两城以上机票预订用户 +70%"、飞猪"自然风光/村寨类预订用户 +50%"、四川 A 级景区首日接待 536.2 万人次（[今日头条](https://www.toutiao.com/article/7691674854600262198/)）。
- **国庆假期入境游从一线向特色小城下沉**：四川宜宾、安徽安庆、湖南张家界、新疆伊犁外国游客增长预计 **超 55%**；延安、娄山关景区外国游客占比最高达 **6%**。
- **就业稳岗**：4.2% 失业率（9 月美方数据），中国 8 月城镇调查失业率 5.0% 左右，9 月数据待发布。

**Mavis 点评**：国庆假期是观察"十四五→十五五"消费升级的关键窗口。**县域旅游 +42%、入境游 +27.8%、新能源车占比 25%** 三组数据指向同一趋势——消费下沉和绿色化。但 9 月能繁母猪仍超保有量 2.5%，意味着猪价低位至少持续到 Q4，**食品 CPI 短期难有大幅上行**。

### 2.4 🔴 技术面 T — AI 国产化 + 反制升级

- 🟥 **2026 年 11 月中美 AI 对话**：三大议题——AI 风险分类分级标准、模型失控通报机制、AI 治理多边框架（[央视玉渊谭天](https://www.163.com/dy/article/L8F6OPKI05198NMR.html)）。加州或率先破局推动互信与制度框架落地。
- 🟥 **特朗普成立"超级智能特别工作组"**（SIF）：由国家情报总监 Jay Clayton 任"AI 沙皇"；计划 120 天拿出 AI 监管方案（[华尔街见闻](https://www.163.com/dy/article/L8F6OPKI05198NMR.html)）。
- 🟥 **台湾出口管制升级**：将华为、中芯国际列入限制贸易清单，覆盖设备/材料/EDA/技术协助/封测服务（[UMA Technology](https://umatechnology.org/chinas-huawei-smic-now-face-taiwan-export-controls-on-ai-chips-in-latest-develops)）。
- 🟥 **曦智科技光电混合万卡集群部署**：能效比较传统 GPU+HBM 方案提升约 **15 倍**，针对 Transformer 架构（[中国家电网](https://m.cheaa.com/n_detail/w_654305.html)）。
- 🟥 **博通联手黑石筹资 600 亿美元**：其中 **420 亿美元**优先有担保债券为 Anthropic 等 AI 公司铺路算力；Anthropic 明年有望成为博通芯片设计业务最大客户（[华尔街见闻](https://www.163.com/dy/article/L8F6OPKI05198NMR.html)）。
- **新思科技+OpenAI 签 AI 芯片设计协议**：联合开发 GPT-Synopsys 专用模型（[华尔街见闻](https://www.163.com/dy/article/L8F6OPKI05198NMR.html)）。
- **谷歌 Gemini 4 Argon**：编程、网络安全代理等任务大提升，但最初仅向部分网络安全防御公司开放（[华尔街见闻](https://www.163.com/dy/article/L8F6OPKI05198NMR.html)）。
- **特朗普拒绝为 AI 监管立法，签署 AI "道德约束"协议**（10.1 白宫峰会）：明确拒绝立法监管，力推行业自我监管。

**Mavis 点评**：中美 AI 博弈从"出口管制"升级到"标准制定"。**11 月 AI 对话三大议题（风险分级/失控通报/多边框架）**几乎是 2024 年 Bletchley 宣言的 2.0 版本。中国这边"曦智万卡 15 倍能效比"+"长鑫 HBM3 量产"的组合拳是"非英伟达路径"的现实证明。**台湾管制 + 美国 BXA 出口证申请**双层收紧，意味着 AI 算力国产化是 2027 年的"必须"而非"应该"。

**中国数据**：

- 🟥 **中国 Q3 出货 9890 万部，同比 -3.6%**（跌幅较上半年收窄）（[阿斯达克财经网](https://www.aastocks.com/tc/forex/news/comment.aspx?cur=&id=NOW.976257&source=AAFN)）。
- 🟥 **华为 4150 万部 / +64.6% YoY**，份额从 24.6% 升至 **42%**（中国第一）；**苹果 810 万部 / +5.6% YoY**，份额 8.2%（中国第五）；**小米 970 万部 / -30.5% YoY**，份额从 13.6% 跌至 9.7%。
- **iPhone 17 系列中国累计销量约 4057 万台**（截至 W33）：Pro Max 1320 万、Pro 780 万、标准版 916 万（[百度百科](https://baike.baidu.com/item/iPhone%C2%A017/64930307)）；9 月 10 日起 iPhone 17 涨价 800 元（256GB 5999→6799）。

**BOM 成本传导**：

- 2026 H2 国产旗舰集体上调价格，标准版纷纷站上 5499/5999 元。
- 内存价格 Q4 涨 10-20%，直接影响 Android 中低端机型 BOM。

**Mavis 点评**：中国手机市场**"华为升、小米降、苹果涨"**三件事同时发生，背后是同一条逻辑——**存储涨价周期 + 国产高端化**。**华为份额 42%** 比去年同期 24.6% 几乎翻倍，这是中国手机市场过去 5 年最大的份额跃迁。**小米 Q3 -30.5% YoY** 是因为超过一半的出货集中在 $200 以下，对存储涨价最敏感。**iPhone 17 涨价 800 元**反映库克"先涨为敬"——把存储成本压力直接转嫁给消费者。

### 3.2 💾 存储 — Q4 合约价再涨 10-20%，AI 锁产能

**TrendForce 2026 Q4 预测（10.1 发布）**：

- 🟥 **常规 DRAM 合约价季增 10-15%**；含 HBM 整体 DRAM **季增 15-20%**。
- 🟥 **NAND 闪存合约价季增 15-20%**。
- **Enterprise SSD 涨幅最大**：预估 **23-28%**，是少数涨幅扩大的品类（[新浪财经](https://finance.sina.cn/2026-10-01/detail-initstum2137544.d.html)）。

**核心驱动**：

- AI 推理/训练基础设施持续扩张，CSP 加码采购。
- HBM3E/HBM4 量产挤压传统 DRAM 产能。
- 2027 年 PC DRAM 产能占比可能进一步下降。

**三大原厂 Q3 业绩（10 月初陆续公布）**：

- 🟥 **SK 海力士 Q3 营收 24.45 万亿韩元**，营业利润 **11.4 万亿韩元**（创历史新高），**DRAM/NAND 2026 产能已全部售罄**（[Particle News](https://particlenews.ai/story/sk-hynix-sets-records-in-q3-sells-out-2026-output-as-hbm4-shipments-begin)）。
- 🟥 **三星 Q3 营业利润 12.2 万亿韩元**，存储业务收入 **26.7 万亿韩元**（创纪录）；HBM4 样品已送关键客户。
- 🟥 **美光 FY26 Q4 营收 542 亿美元 / +379% YoY**，单季毛利率 **87%**；2027 产能已预售 **75%**，签 26 项长约锁定 **1500 亿美元**长期订单（[今日头条](https://www.toutiao.com/article/7691981617669177902)）。
- **三星 HBM4 报价 4 美元/Gb 中高区间**，是 HBM3E **1.50 美元/Gb** 的 **3 倍以上**（[华尔街见闻](https://www.163.com/dy/article/L8F6OPKI05198NMR.html)）。

**国产存储**：

- 🟥 **长鑫存储 DRAM 全球份额从 2023 < 1% 升至 2026 Q2 的 10%**，正式进入全球前四（[今日头条](https://www.toutiao.com/article/7693013397746532907/)）。
- **三星/SK/美光合计份额首次从近 100% 滑到 87%**。
- 长鑫科技上半年境外收入 **958 亿元 / +16 倍**，归母净利润 **776 亿元**（日均净赚 4 亿）。

**澜起科技 CK01P DDR5-9200 CKD 芯片量产**：数据速率从 7200 升至 **9200 MT/s**，符合 JEDEC DDR5 CKD01 规范（[今日头条](https://www.toutiao.com/article/7691981617669177902)）。

**Mavis 点评**：**"美光 2027 产能预售 75%"+"SK 海力士 2026 产能售罄"+"三星 HBM4 涨价 3 倍"**——三大原厂用订单而不是嘴炮锁死了 2027 年的供需缺口。**长鑫 10% 份额** 是过去 30 年中国半导体在主流 DRAM 市场的最大突破，但**长鑫单家公司净利润 776 亿元 ≈ 日均 4 亿**，等于把过去 5 年的资本开支一次性变现，**这是不可持续的暴利**。Q4 涨势已经在收窄（从 Q3 的 +13-18% 降到 +10-15%），下一个拐点看 2026 Q1 季报。

### 3.3 🔬 芯片 — 国产化爆发，出口单芯片均价翻倍

**国产化数据（10.4-10.5 海关总署发布）**：

- 🟥 **2026 前 8 个月集成电路出口 2567 亿美元 / +103.9%**——8 个月干完 2025 年全年（2019 亿美元）（[今日头条](https://www.toutiao.com/article/7693013397746532907/)）。
- 🟥 **出口数量 2425 亿个，仅 +4.1%**；**单颗均价从 0.54 美元升至 ~1 美元**，涨幅约 **83%**。
- 🟥 **集成电路正式超越汽车成为中国第一大出口商品**。

**结构拆解**：

- **存储器 1515.7 亿美元，占 70.1%**（同比 **+221.7%**）——长鑫 + 长江存储是核心。
- **处理器及控制器 383.8 亿美元，占 17.7%**（同比 **-0.9%**）。
- **前 7 月省份**：江苏 589.9 亿美元（**+143%**）、广东 465.5 亿美元（+64%）、陕西 355.7 亿美元（**+248%**）。

**产能与设备**：

- 🟥 **2026 中国大陆 12 英寸晶圆产能预计 1010 万片/月，占全球 1/3**；全球新增 12 英寸产能 **77% 来自中国**（[三个皮匠](https://www.sgpjbg.com/labels/jingyuanchangkuochanshebeixuqiu/1/6895367.html)）。
- 🟥 **2026 全球晶圆厂设备支出 1300 亿美元 / +18% YoY**，连续 6 年增长；2025 年 1100 亿美元。
- **中芯国际北京亦庄 6.5 万片/月（2026 扩至 8 万）**、**深圳龙华 2.8 万片（2026 扩至 3.5 万）**、**华虹无锡 5.1 万片（2027 扩至 8 万）**、**长江存储武汉 12 万片（2026 扩至 14 万）**、**长鑫合肥 11 万片（2027 扩至 16 万）**。

**反制**：

- 美国 2025 年 10 月起《芯片安全法案》、《MATCH 法案》（[中国家电网](https://m.cheaa.com/n_detail/w_654305.html)）。
- 台湾将华为、中芯列入出口管制清单（设备/材料/EDA/技术协助/封测）。

**Mavis 点评**：**2567 亿美元 / +103.9%** 是中国集成电路出口的"质变"信号——不是量的胜利（仅 +4.1%），是**单价从 0.54 美元走到 1 美元**的胜利。**70.1% 的出口是存储**，反映这一轮红利本质是 AI 需求驱动，但也是结构脆弱性的根源——一旦 Q4 涨势收窄，2027 H1 出口增速会快速回归。**处理器 -0.9% YoY** 是冷静看数据的人需要记住的另一面：**高端逻辑芯片的国产化才是真正的硬骨头**。

### 4.2 设备 / 材料 — 北方华创领涨，国产化率 ~21%

- 🟥 **北方华创 2024 半导体装备业务营收 265.78 亿元**（占总营收 **89.07%**）：刻蚀 80+ 亿、薄膜沉积 100+ 亿、热处理 20+ 亿、湿法 10+ 亿。
- 🟥 **北方华创 2025 年进入**离子注入设备市场，**持股芯源微 17.87%** 布局涂胶显影。
- 🟥 **全球半导体设备市场中国厂商份额约 6%**，**国产化率约 21%**——EDA、高端光刻机、先进材料仍"卡脖子"（[深水财经社](https://www.toutiao.com/article/7692792035975250482/)）。

**国内设备/材料头部公司海外收入（2026 H1）**：

- 🟥 **中微公司归母净利润 28.25 亿元（+300%）**。
- 🟥 **江波龙归母净利润 105.77 亿元（+超 715 倍）**。
- **长鑫科技** 归母净利润 **776 亿元 / +874% YoY**（日均净赚 4 亿）。
- **方正科技** PCB 境外收入 13.36 亿元（**+148%**）。
- **君正股份** 智能视觉 SoC 境外收入 +75%。

**Mavis 点评**：2026 H1 是国产半导体公司的"超级报表季"——**186 家 A 股半导体公司中 149 家盈利，盈利超 10 亿元公司从 6 家扩容至 19 家**。这背后是双重逻辑：AI 需求 + 国产替代。但要清醒看到：**全球设备份额 6%、国产化率 21%**——离"自主可控"还有 3-5 倍空间。**光刻机、EDA、先进材料** 是下一个 5 年的攻坚方向。

---

### 4.3 制造 / 封测 — SMIC N+2 满产，国产 AI 芯片集体爆发

- 🟥 **SMIC N+2 节点（≈7nm）利用率 >93%**——华为昇腾 910B/910C、950DT、寒武纪、壁仞、摩尔线程都在抢同一批 wafer 产能（[Tech Times](https://www.techtimes.com/articles/318868/20260622/china-ai-data-center-desktop-grid-locks-out-nvidia-295-billion-domestic-chip-mandate.htm)）。
- **华为昇腾 950DT**（SMIC N+3 5nm-class）：SMIC 制造，144GB HBM，完全境内供应链（[AI in China](https://www.ainchina.com/blog/china-ai-compute-empire-sanctions-boomerang-deepseek-huawei-2026)）。
- 🟥 **2027 财年上半年美光资本开支 250 亿美元**；**SK 海力士 M15X 清州厂加速爬坡**，2026 资本支出将上调。
- 🟥 **寒武纪** 等头部 AI 芯片公司估值因国产需求激增大幅上涨。
- **沐曦股份（Enflame）9.2 上交所 IPO**：发行价对应 10% 股权，募集 6 亿元（892M USD），**首 10 日累计涨 188%**，市值突破 25 亿美元（[AI in China](https://www.ainchina.com/blog/china-ai-compute-empire-sanctions-boomerang-deepseek-huawei-2026)）。
- **GPU 五小龙**（摩尔线程/MetaX/壁仞/沐曦/天数智芯）全部完成上市。

**Mavis 点评**：SMIC N+2 93% 利用率 = 中国 AI 芯片最大的产能瓶颈。**GPU 五小龙全部上市** 后，资本市场对"非英伟达路径"的认可度大幅提升——沐曦 188% 的首日涨幅是过去 3 年中国半导体 IPO 罕见表现。但 **SMIC 单靠 DUV 多重曝光** 难以做出 5nm 以下制程，这是华为昇腾的"天花板"，也是 2026-2028 H2 关键看点。

---

### 4.4 下游应用 — PC/服务器/汽车需求传导

- 🟥 **2027 年 PC DRAM 产能占比可能进一步下降**，笔电和台式机厂商可能通过调标配容量、吸收成本或涨价应对（[新浪财经](https://finance.sina.cn/tech/2026-10-02/detail-inittzpv1767105.d.html)）。
- 🟥 **AI Server Q4 Enterprise SSD 涨幅 23-28%**——AI 推理工作负载（Vector DB + QLC SSD + PCIe 6.0）是核心驱动。
- 🟥 **美光 CEO 称 L4+ 自动驾驶单车内存 >200GB**、存储数 TB；**人形机器人每台 200GB DRAM + 数 TB NAND**——摩根士丹利预测 2030 人形机器人出货 25-120 万台，2050 达 **9.3 亿台**（[今日头条](https://www.toutiao.com/article/7691981617669177902)）。
- **国庆假期新能源汽车销量**：小米 YU7/SU7 全系现车锁单（10.1-10.7 锁单 + 10.31 前提车），免费送车载吸尘器（369 元）+ 盖毯（129 元）。
- **长城汽车 9 月销量 114944 台 / -13.99% YoY**；海外销量 60019 台（占当月 **52%+**）；**零跑 9 月交付 105656 台**，与长城差距不到 1 万台（[今日头条](https://www.toutiao.com/article/7692458719342232099)）。

**Mavis 点评**：存储涨价已经从"AI 数据中心"传导到"AI 物理设备"——**美光 CEO 把人形机器人存储需求按逻辑比汽车高一个数量级**，这是未来 5 年最大的需求新增量。国庆假期各品牌用"现车+礼品"做促销，是 10 月车市传统的"金九银十"收官。**零跑 9 月追到长城 1 万台以内** 是国产新势力里程碑事件。

## 6. ✏️ 五、编辑后记

**总论**

今天的日报涵盖四个主线：**(1)** 10 月新政密集落地，房贷贴息+反不正当竞争法+集成电路保护条例构成消费-平台-科技三箭齐发；**(2)** 9 月官方数据双轨回升——制造业 PMI 重返扩张、出口 +8.3% 超预期，但对美出口 -26.8% 仍是结构性挑战；**(3)** 国庆假期消费 21.3 亿人次，新能源车 1780 万辆/日的渗透率历史新高；**(4)** 国产半导体"质变"——前 8 月 IC 出口 2567 亿美元（+103.9%），单价从 0.54 美元升至 1 美元，**集成电路正式超越汽车成为中国第一大出口商品**。

**Mavis 独立判断**

1. 🟥 **10 月新政密度罕见**——1 日一天落地房贷贴息+国防动员法+外汇贷款专用账户管理+反不正当竞争法（10.15）。这是 Q4 政策"前置发力"信号，11 月数据若不及预期，可能还有第二轮工具箱。
2. 🟥 **存储涨价周期至少持续到 2027 H2**——美光 2027 产能预售 75%、SK 海力士 2026 全部售罄、三星 HBM4 报价是 HBM3E 的 3 倍。三大原厂用订单锁死了 2027 年的供需缺口。但涨势已经在收窄（Q3 +13-18% → Q4 +10-15%），Q1 2027 季报是关键拐点。
4. 🟥 **中国集成电路出口"质变"而非"量变"**——数量仅 +4.1%，金额 +103.9%，单价从 0.54 美元升至 1 美元。但 70.1% 是存储器（依赖 AI 周期），处理器及控制器反而 -0.9% YoY——**这是脆弱的繁荣**。
5. 🟥 **GPU 五小龙全部 IPO 完成**——摩尔线程、MetaX、壁仞、沐曦、天数智芯。沐曦首日涨 188%、市值破 25 亿美元。资本市场对"非英伟达路径"给出了明确估值锚，但 SMIC N+2 产能 93% 利用率是制约瓶颈。
7. **华为中国份额从 24.6% 升至 42%** 是过去 5 年最大份额跃迁；同期小米 -30.5% YoY（超半数出货 $200 以下，对存储涨价最敏感）。**iPhone 17 涨价 800 元**反映苹果主动转嫁成本。
8. **国庆假期新能源车流量 1780 万辆/日（平时 1.8 倍）**——新能源车首次成为假期出行核心运力，比 2024 年 1400 万量级翻倍。**县域旅游 +42%、入境游 +27.8%** 是消费下沉和开放红利双重体现。

**重点关注节点**

- **10.15**：反不正当竞争法+集成电路布图设计保护条例同步施行。
- **10 月中下旬**：9 月经济金融数据集中发布（CPI/PPI/M2/社融），市场对 Q4 货币政策的预期会重新定价。
- **10 月底**：SMIC Q3 业绩、华虹 Q3 业绩、长鑫/HBM 进展。
- **11 月初**：美光 FY27 Q1 业绩（CEO 指引这是全年毛利率底部）。
- **11 月**：中美 AI 对话、玉渊谭天预告三大议题（AI 风险分级/失控通报/多边框架）。

**风险提示**

- 存储涨价见顶后，Q1 2027 中国出口增速可能从 +103.9% 快速回落。
- 美国《芯片安全法案》《MATCH 法案》若立法通过，对国产 14nm/7nm 设备进口有结构性影响。
- 中东战火升级（沙特/胡塞武装/伊朗）可能推升通胀预期，间接影响全球利率路径。
- 国内能繁母猪 4035 万头（103.5%）意味着猪价低位至少到 Q4，食品 CPI 难有起色。
- 美国 10Y 美债收益率 5.27%、2Y 4.82%——若非农连续疲弱（9 月仅 +2.9 万），10 月加息概率已降至 ~20%，但通胀仍是悬念。
