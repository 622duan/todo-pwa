## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**国务院常务会议 9.11 部署五大方向**

国务院总理李强 9 月 11 日主持召开国务院常务会议，五大议题一次性落地：

- **🟥 算力网建设**："算力网是人工智能发展的基础支撑"，明确算电协同、算网融合、骨干光纤网络、绿电直连、源网荷储项目路径
- 安全生产：举一反三整治"层层转包"，落实"三管三必须"
- 老旧水库改造："一库一策"，吸引社会资本参与
- 教育强国：学龄人口变化下的学位供给与师资调配
- 《基金会管理条例(修订草案)》审议通过

> 来源：[新华社](http://cpc.people.com.cn/BIG5/n1/2026/0912/c64094-40797340.html) · [人民日报](http://www.jyb.cn/rmtzgjyb/202609/t20260912_2111520403.html)

**中小企业回款新政 9.10 落地**

国办印发《关于加强中小企业回款难问题治理有关工作的通知》：央企对中小企业**全部采用现金支付**，大型企业带头 60 日内现金支付账款。9.14 国新办将召开政策例行吹风会，工信部副部长柯吉欣、央行、国资委、证监会等联合解读。

> 来源：[腾讯新闻/长安街知事](https://news.qq.com/rain/a/20260912A074WS00) · [国新办通知](https://www.gov.cn/)

**🟥 《"人工智能+软件"专项行动实施方案》印发**

工信部 9.11 印发"AI+软件"行动方案：到 2028 年覆盖 2 万家规上软件企业，组织实施 **100 项软件企业智能化技改项目**，打造 **100 个智能体软件标杆应用**，孵化 5+ 优质开源项目。

> 来源：[新华财经](https://www.toutiao.com/article/7684442658424537627)

**《数字乡村高质量发展行动计划(2026—2030年)》**

中央网信办 + 农业农村部 + 工信部三部门联合发文：探索**高通量卫星、低轨卫星互联网**为农村及偏远地区提供多样化网络接入；攻关**农业传感器与专用芯片、核心算法、机器人**；推进智能农机、无人农机。

> 来源：[新华财经](https://www.toutiao.com/article/7684442658424537627)

**🟥 《智能网联新能源汽车产业发展"十五五"规划》**

工信部等九部门联合发布：到 2030 年新能源乘用车、商用车新车销量占比分别达 **70% / 40%**；具备自动驾驶功能的汽车实现规模应用；纯电乘用车平均电耗降至 **11.5 千瓦时/百公里**。

> 来源：[新华财经](https://www.toutiao.com/article/7684442658424537627)

**国内成品油临时调控**

国家发改委 9.11 起对成品油实施临时调控：汽柴油每吨本应上调 435 元 / 420 元，**调控后实际仅上调 260 元 / 250 元**，以减缓国际油价上涨对国内的冲击。

> 来源：[国家发改委/新华社](https://www.toutiao.com/article/7684442658424537627)

**📌 Mavis 点评**：本周政策端出现了非常清晰的"算力网+中小企业+数字乡村+智能网联"四线并进格局。算力网是 AI 时代的水电煤，中小企业现金支付直击当前企业现金流痛点，AI+软件 100 个标杆应用意味着智能体商业化进入倒计时。这一套组合拳指向"十五五"开局之年的新质生产力主线。

国家统计局 9.9 公布：

| 指标 | 8 月 | 7 月 | 变化 |
|------|------|------|------|

| **PPI 同比** | **+3.8%** | +3.5% | +0.3pp |
| **PPI 环比** | **+0.4%** | -0.7% | 由降转涨 |

**关键变化**：
- 🟥 **黄金饰品 +33.6%**（涨幅扩大 9pp）
- 🟥 **平板电脑 +21.5%**、**计算机 +19.6%**、**移动电话机 +11.0%**（AI 算力需求拉动）
- 汽油价格 +9.3%，能源价格涨幅由 0.6% 扩大至 4.1%
- 煤炭开采和洗选业 PPI +26.6%、有色冶炼 +20.8%

> 来源：[国家统计局](https://www.stats.gov.cn/sj/zxfbhjd/202609/t20260909_1965261.html) · [国务院新闻办英文](https://english.scio.gov.cn/pressroom/2026-09/09/content_118687246.html)

**东方金诚冯琳测算**：8 月物价涨幅扩大由两大核心因素拉动：① 中东局势带动国际油价上涨推升国内汽油价格；② 全球 AI 投资热潮令芯片价格上冲拉抬电脑手机价格。**耐用消费品环比 +0.6% 为 2022 年 11 月以来最大涨幅**——上游成本压力正向下游渗透。预计 9 月 CPI +1.0%、PPI +4.0%。

## 6. ✏️ 五、编辑后记

**总论：今天是 4 大主线交织的一天**

今天周日，无 A 股交易，但全球宏观与产业层面暗流涌动。**主线 1：算力网成为新质生产力最确定抓手**——9.11 国常会五大议题中算力网排在核心位置，工信部 AI+软件 100 个标杆应用紧跟其后。**主线 2：存储超级周期进入"高基数+边际放缓"阶段**——Q3 涨幅收敛至 13-18%，但绝对价格仍在历史高位，2026 全年涨势确定。**主线 3：手机进入"折叠屏决胜年+千元机消亡年"**——72 小时内三场折叠屏发布会，华为苹果占据中国 41% 份额，安卓厂在涨价与守份额之间被迫二选一。**主线 4：国产 AI 芯片四小龙齐聚资本市场**——估值从"有没有"切换到"好不好用"，摩尔线程扣非净利扭亏、寒武纪加入 PyTorch 白金成员，国产软件生态战打到英伟达护城河。

**Mavis 独立判断**：

1. 🟢 **算力网国常会级别定调，是十五五开局最重要信号**。算电协同、绿电直连、源网荷储——这一套打法意味着未来 5 年中国算力中心建设将与新能源消纳深度绑定，浪潮信息 90 亿元定增、宁德时代 200-400 亿元回购都已经先于政策表态。

2. 🔴 **千元机 22%→3% 是这一轮最残酷的结构性变化**。消费电子涨价已经不再是"成本传导"，而是一场**"定价权重构"**——存储原厂、三星、苹果、华为是赢家；小米、OPPO、vivo、传音是被挤压方。100 美元以下机型 Q2 全球 -60% 是过去十年手机市场最剧烈的一次供给收缩。

3. 🟡 **DRAM 涨幅 13-18% 看似放缓但绝对值仍高**。手机 BOM 中存储占比从 10-15% 升至 30-40%，意味着即使存储涨幅收窄，手机价格中枢也要高位运行至 2027——除非出现"AI 泡沫破灭"式的极端情景。HBM 占 DRAM 供应 51% 是关键拐点，消费电子 DRAM 配额被机械挤出。

4. 🟢 **国产 AI 芯片"四小龙"齐聚资本市场，标志着 1.0 阶段融资能力比拼结束**。下一阶段比的是万卡集群交付能力（摩尔线程/华为）、软件生态（寒武纪 PyTorch 白金）、大客户绑定（燧原/腾讯）三条线。能率先把研发→产品→客户→收入串成闭环的，才是真正赢家。

5. 🟠 **长鑫 LPDDR6 首发小米 18 Fold 是国产存储标志性事件**。8.29 长鑫 LPDDR6 量产 + 9.7 首发小米 18 Fold，是国产存储第一次登上旗舰折叠屏主舞台。Semianalysis 预测长鑫 2028 年底市占 17%（vs 2025 年 11%），意味着未来 3 年国产 DRAM 还有翻倍空间。

6. 🔴 **9.15-16 FOMC 加息概率 87%，全球流动性预期重新收紧**。2 年期美债 4.62%、10 年期 4.97%、30 年期 5.36%——长端利率持续上行。如果 9.15 沃什释放"加息不止一次"信号，对 A 股估值端压力将进一步显现。9.20 LPR 是国内对冲关键窗口。

      try {

        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const filename = `daily-political-news-${dateStr}.md`;
        const blob = new Blob(['\uFEFF' + DEFAULT_NEWS], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }
