## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**本周政策密、信号暖，9 月 1 日集中落地。** 国务院总理李强 8 月 31 日主持召开国务院常务会议，听取城市地下管网建设汇报、研究促进招商引资高质量发展、原则通过《税收征管法（修订草案）》、审议《审计法实施条例（修订草案）》；西藏日喀则市吉隆县泥石流抢险救援列为近期工作重点。

**9 月 1 日生效新规 7 大类，** 涉及公积金提取拓展至 9 种情形（房租无门槛）、出境入境管理新规、微短剧分类备案、AI 生成内容显著标识、离境退税"即买即退"、禁止买卖流通中人民币、AI 客服"已读乱回"经营者担责。详见 [央视新闻](https://www.gqb.gov.cn/news/2026/0901/63078.shtml) / [中国经济时报](https://www.toutiao.com/article/7680429738020373019/)。

**【🟥 重点】2026 中国公平竞争政策宣传周 9.7-9.11 举办。** 国务院反垄断反不正当竞争委员会办公室、市场监管总局会同 95 项重点活动，主题"统一大市场 公平竞未来"，重点宣传"十五五"规划纲要与公平竞争审查制度。宣传周覆盖 25 个国家部门与 31 个省级行政区，详见 [岱岳区政府](http://www.daiyue.gov.cn/art/2026/9/3/art_329572_10391195.html)。

**工信部"AI 应用服务商培育专项行动"9 月 1 日启动。** 目标 2026 年底资源池 ≥2000 家、2027 年底 ≥3000 家，明确"用好算力券降低算力成本"。珠海启动第五批算力券申领（8/31-9/14，最高 50% 补贴）。

**财政部 9.9 续发 50 年期超长期特别国债 350 亿元，** 票面利率 2.52%，半年付息。央行 8 月公开市场国债买卖净投放 500 亿元，但 MLF 净回笼 1000 亿元、PSL 净回笼 521 亿元。

**Mavis 点评**：8 月 31 日国常会"地下管网 + 招商引资"组合是十五五开局典型的"既要稳投资、又要强制度"双线操作——前者用更新行动托底总需求，后者用统一大市场压住地方保护主义反弹。9 月 1 日新规矩阵里最有杀伤力的是公积金 9 种提取情形，意味着合理住房消费被显性背书，对 Q4 地产销售是直接催化。

### 2.2 🟠 经济面 E

**8 月制造业 PMI 49.8%，环比 +0.6pct。** 大型企业 PMI 50.6%（+1.1pct），中型 49.4%（-0.3pct），小型 47.9%（+0.5pct）。新订单指数升至 50.6%（+2.1pct，重回扩张），生产指数 50.4%、供应商配送时间 50.6%；主要原材料购进价格指数 56.6%（+3.4pct），出厂价格指数 50.4%（+2.6pct，重回扩张）。综合 PMI 49.5%（+0.2pct）。详见 [国家统计局](https://www.stats.gov.cn/english/PressRelease/202609/t20260901_1965170.html)。

**财通证券、UBS、东方金诚** 等机构前瞻：8 月 CPI 同比预计升至 0.7%-0.9%（vs 7 月 0.5%）、PPI 同比升至 3.2%-3.9%（vs 7 月 3.5%）、规上工业增加值同比 +4.5%-4.8%、社零同比 0.0%-0.5%、固投累计同比 -7%~-7.3%、出口同比 +21%~+24.5%。详见 [证券日报](http://m.ce.cn/gp/gd/202609/t20260903_3189052.shtml) / [新浪财经](https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/macro/rptid/841736655434/index.phtml)。

**8 月外贸：前 8 月进出口 29.57 万亿元 +3.5%。** 8 月当月进出口 3.87 万亿元 +3.5%，出口 2.3 万亿元 +4.8%、进口 1.57 万亿元 +1.7%，**连续 3 月双增长**。跨境电商出口海外仓 +3.3 倍成新亮点。深圳前 7 月进出口 3.42 万亿元 +32.8%，民企贡献 73.7%。详见 [腾讯新闻](https://new.qq.com/rain/a/20260905A02PFG00)。

**【🟥 重点】集成电路出口：1-7 月达 2160 亿美元 +99.5%，超 2025 全年 2019 亿美元。** 出口数量仅 +7%，出口单价 +83.3%——增长逻辑从规模驱动转向价值驱动。存储芯片 Q1 出口 459.9 亿美元 +174.2%，占集成电路出口 63.3%。详见 [科技区角](https://www.x-techcon.com/article/183447.html)。

**国家统计局 8 月 21-31 日重要生产资料价格：** 螺纹钢 3130.3 元/吨 +2.2%、电解铜 108899.3 元/吨 +0.6%、铝 23835.7 元/吨 -0.5%、锌 26090.7 元/吨 +2.2%、甲醇 +9.0%、丁二烯橡胶 +5.1%、磷酸铁锂 56905 元/吨 +1.4%。详见 [国家统计局](https://www.stats.gov.cn/english/PressRelease/202609/t20260903_1965181.html)。

**Mavis 点评**：8 月 PMI 三升两降中，**最值得圈点的是新订单指数单月跳升 2.1pct 重回扩张**——需求端改善快于库存端，新订单-产成品库存动能指标从 -0.1% 跳到 +2.2%。叠加 PPI 出厂价格指数结束 4 月连降，**"反内卷+AI 链+大基建实物量"三股力量正在同步发力**。但 8 月固投预计 -7%，固定资产投资仍然托不住总需求，意味着 Q3 末会有更明显的"季末冲量"动作，9 月 PMI 数据可能会更亮眼。

### 2.3 🟣 社会面 S

**重庆"十五五"人力社保规划公布。** 5 年累计城镇新增就业 ≥325 万人、城镇失业人员再就业 ≥75 万人、就业困难人员就业 ≥40 万人，城镇调查失业率控制在 5.5% 以内。高校毕业生留渝来渝 160 万人以上、农民工就近就业 60 万人以上。详见 [中国就业网](https://chinajob.mohrss.gov.cn/c/2026-09-03/599789.shtml)。

**湖南失业保险"稳扩提"政策包。** 大型企业返还 30%、中小微 60%；招用毕业年度内或离校 2 年内未就业高校毕业生、16-24 岁登记失业青年，按 1500 元/人发放一次性扩岗补助。技能提升补贴：初级 1000、中级 1500、高级 2000 元/年。详见 [人社部](https://www.mohrss.gov.cn/SYrlzyhshbzb/dongtaixinwen/dfdt/202609/t20260902_583218.html)。

**四川启动 2026 高校毕业生"提技能、促就业"专项行动（8-10 月）。** 首批培训班次 306 个、培训 1.2 万余人；AI 办公工具实操、新媒体短视频、无人机驾驶等新兴课程占比超 40%。广元市离校未就业毕业生联系率 100%、困难毕业生帮扶就业率 70.93%。

**【🟥 重点】上海暑运收官 62 天成绩单。** 浦东+虹桥机场起降 15.1 万架次 +3.1%，**进出港旅客 2528.1 万人次，日均 40.7 万 +4.8%**。浦东机场 1639.4 万人次、虹桥 888.7 万人次，浦东口岸出入境 670 万人次日均 11 万。铁路上海站发送旅客超 2700 万人次，单日峰值 8 月 22 日 59.7 万人次；长三角铁路 62 天发送近 1.8 亿。**外籍旅客 43.5 万人次 +24%**——入境游持续强势。详见 [上海机场](https://weibo.com/1647662054/5338385721066816) / [东方网](https://nw.eastday.com/self/citynews/20260904/68a44ebaabe44506a93bb6803bbd4d02.html)。

**国家医保局 9.2 发布按病种付费 3.0 版分组方案**，强调"病种支付标准不应与医务人员绩效工资挂钩"——避免医院转嫁压力给医生。

**Mavis 点评**：上海暑运 +4.8% 看似平淡，但**外籍旅客 +24% 是大新闻**——免签政策叠加国际航线新增（都柏林、第比利斯、克拉斯诺亚尔斯克）正在显效。Q4 入境游消费将是观察"内循环 + 外循环"双轮的重要窗口。就业侧地方政府的"重点群体+扩岗补助+技能提升"组合拳符合中央"就业优先"定调，但高校毕业生 1222 万的总量压力短期内难靠地方化解。

### 2.4 🔴 技术面 T

**DeepSeek V4 开源，9 家国产 AI 芯片 Day 0 适配。** 包括华为昇腾、寒武纪、海光、摩尔线程、昆仑芯等。**华为昇腾采购价仅英伟达对华特供版 1/4，单卡算力反而 +2.87 倍**。黄仁勋："如果 DeepSeek 率先在华为上发布并全面适配，对美国全球 AI 战略将是灾难性打击。"详见 [种斌 Marco](https://www.toutiao.com/w/1875086747248643/)。

**智谱 GLM-5.3-Flash 率先依托国产芯片集群对外提供服务**，单 token 成本与主流英伟达 GPU 相当。智谱 9.2 入驻天猫开旗舰店卖 token，个人版 Lite 月付 118 元起、Pro 538 元、Max 1078 元。

**【🟥 重点】寒武纪 H1 营收 59.96 亿元 +108.1%，归母净利润 23.11 亿元 +123%。** 同期向 944 名员工授予 400 万股限制性股票（市值约 30 亿元），覆盖 85% 员工；草案设 2026-2028 累计 1000 亿元营收目标（2026 触发值 800 亿 / 目标 135 亿，2027 累计 405 亿，2028 单年需 595 亿）。详见 [搜狐](https://m.sohu.com/a/1071115799_122637258)。

**摩尔线程 H1 营收 17.36 亿元 +147.4%**。TrendForce 数据：2026 年国产 AI 芯片需求约 400 万颗，实际交付约 300 万颗，**存在百万级产能缺口**。详见 [每经](https://www.toutiao.com/article/7680391259470430746/)。

**OpenRouter 调用数据：中国模型厂商份额 42%，** 与美国 47% 的差距持续缩小。Qwen3.8max、GLM-5.3、DeepSeek V4 Pro/Flash 持续推高性价比上限。**2026 上半年中国智能算力规模 2185 EFLOPS +177%，** 全国算力设施上架率 71.4%。详见 [新浪财经](https://finance.sina.com.cn/stock/zqgd/2026-09-01/doc-iniqhsee1577295.shtml)。

## 4. 🏭 三、上下游产业链

### 4.1 原材料

**"算力金属" 概念继续走强。** 钽从 2025 年底 2600 元/公斤飙升至 2026.6 月 6920 元/公斤，**半年 +158%**；锡 42 万元/吨 +40%；2 英寸磷化铟衬底 800→2300-2500 美元（+250%），6 英寸 1400→5000 美元（+250%）。详见 [搜狐](https://www.sohu.com/a/1070875354_250147)。

**稀土、镓、锗出口管制持续生效至 2026.11.10**（中美吉隆坡经贸磋商共识）。韩国 9.1 起将约 80 项先进 AI 半导体制造设备纳入战略物资出口管制清单。

**巴西参议院 9.2 通过关键矿产法案**，建立国家关键和战略矿产政策。

**Mavis 点评**：稀散金属"超级周期"逻辑比铜更锋利——锗、铟、镓都是伴生矿，无法独立扩产。**磷化铟供需缺口 >70%（Yole 预测 2026 全球需求 260-300 万片，有效产能 75 万片），订单排到 2028 年**。中国对镓/锗/稀土/钨/钼/铟/铋的出口管制 + 商务部举报处理规则升级（7.1 实施）= "发许可证 → 全民监督" 闭环。

### 4.2 设备 / 材料

**北方华创新一代 ICP 刻蚀设备完成客户验证进入量产导入**（H1 公告），刻蚀均匀性达埃米级、深宽比可达数百比一；DTW 混合键合设备已实现产业化；混合键合产品获批量订单。**中微 12 英寸高端刻蚀设备应用于 3nm 及以下器件若干关键步骤**（上交所说）。

**Mavis 点评**：**国产设备从"替代"叙事切换到"客户验证+量产数据"叙事**，最重要的指标已变成"累计流片量""设备稼动率""海外客户"。在 EUV 这种壁垒最高的环节国产短期还追不上，但在混合键合、面板级封装、SiC 设备这些标准形成期的环节，国产有更大的追赶窗口。

### 4.3 制造 / 封测

**SMIC 28nm 超低漏电平台已规模量产，65nm 射频 SOI 平台进入量产。** 华虹 Q2 来自中国区销售占比 78.6%，**北美销售 +77%**——海外回流+在地化制造需求加速兑现。

**精智达 9.3 签 15.76 亿元半导体测试设备订单**（详见芯片板块）。**HBM 封测产能缺口 50%-60%**，**通富微电 H1 净利预 16-18 亿元 +288.26%~+336.80%**，Q1 合同负债 +209.75%，**海太半导体 HBM 封测订单 +150%**。**华天科技 H1 净利预超 200%**。详见 [科技区角](https://www.x-techcon.com/article/183447.html)。

**长江存储 Q2 NAND 全球份额按价值计达 13%（YoY +5pct）**，232 层 3D NAND 产能占比 40%，三期工厂预计 2026 年底提前投产（全部达产月产能 50 万片）。**长江存储、中国互联网投资基金等共同成立武汉新融光技术有限公司**（注册资本 132 亿元，9.4 工商注册）。

**Mavis 点评**：通富、华天、海太 H1 净利 +200%~+337% 是 AI 算力链从芯片设计→制造→封测全链条受益的最直接证据。**HBM 封测 50%-60% 的产能缺口意味着客户愿意为产能付溢价**——这种稀缺性溢价可能比涨价更早反映到业绩里。

### 4.4 下游应用

**【🟥 重点】联通 145 万 PFLOPS（FP16）智能算力纳入全国一体化算力网统一调度**，20 余家调度主体入驻监测平台；"六张网"十五五重大工程加速，**算力网新增直接投资 4 万亿**，探索"算力银行""算力超市"。**2026H1 我国智能算力规模 2185 EFLOPS +177%**，算力设施上架率 71.4%。

**PCB H1 出口 161.2 亿美元 +34%**，泰国、越南、马来西亚增幅均超 50%。客户插单困难，机器人操作 + AI 辅助判定提效。**1.6T 光模块封装设备贴装良品率从 95-98% 提升至 99.6%**。

**腾讯 Q2 资本开支同比加速**，阿里 Q2 资本开支规模快速提升。**Q2 阿里、腾讯资本开支同步上行 + 国内大厂 75% 国产化采购 9 月细则待落地**。

**中国互联网投资基金（与长江存储等）成立武汉新融光技术**，注册资本 132 亿元，覆盖集成电路设计/制造。

**Mavis 点评**：算力从"建设"转向"调度运营"是 2026 最重要的产业链叙事变化——145 万 PFLOPS 纳入统一调度意味着算力终于开始像电力一样被"调度"了。下游需求"算力券 + 智算中心集采 + 大厂国产化采购"三股力量共振，**9 月将是大厂国产化采购细则落地的关键窗口**。

## 6. ✏️ 五、编辑后记

**总论：2026 年 9 月第 1 周，AI 算力 + 半导体国产化 + 存储超级周期三条主线正在全球同步发生共振。** 9 月 1 日政策与产业密集落地，Q2 财报披露结束，所有大厂的资本开支与产能爬坡节奏已经清晰——H1 净利同比 +94% 的中芯、+300% 的中微、+108% 的寒武纪、+873% 的长鑫、+2000% 的存储封测链共同确认了 AI 算力链的高景气度。同时国产手机厂商在 Q2 全球出货 -26%（小米）/ -18%（vivo）下被存储涨价击中利润，9.1 集体涨价宣告手机市场出清加速。

**5 条 Mavis 独立判断：**

**1. 🟥 存储"超级周期"不是周期性涨价，而是 AI 结构性需求 + 产能永久性收缩的共振。** 证据：HBM3E 现货是长协 5 倍（2100 vs 50-70 万韩元），DRAM 三大原厂 70%-80% 先进产能倾斜 HBM。**关键拐点：H4 2026 移动 DRAM 涨幅将降至 0%-5%（vs Q2 的 70%-83%），但 H1 2027 之前看不到供给追上需求**——美光判断 2028 年才出现"小幅改善"。这意味着 H2 2026 服务器 DRAM 涨幅仍将维持在 13%-18% 区间。

**2. 🟥 国产 AI 芯片进入"Day 0 适配 + 超节点突围"双轨。** 证据：DeepSeek V4 开源，9 家国产芯 Day 0 适配（华为/寒武纪/海光/摩尔/昆仑等）。**华为昇腾采购价仅英伟达对华版 1/4、单卡算力反 +2.87 倍**——性价比拐点已现。同时国产超节点（华为 Atlas 950 8192 卡、CloudMatrix 384 已部署 300+ 套、灵衢 UnifiedBus 384 卡 18Tbps/200ns/99.999%）通过系统级能力弥补单卡差距。**判断：2026 年底国产芯片在国内市场份额可能反超海外（摩根士丹利预测华为昇腾 62%、寒武纪 14%）**。

**3. 🟥 国产半导体设备从"替代"切到"客户验证+量产数据"。** 证据：北方华创在手订单 850 亿+ 排至 2028 年初；中微进入 3nm 关键步骤；拓荆累计流片 6 亿片；精智达签 15.76 亿大单（年累计 28.87 亿）。**判断：EUV 这种壁垒最高的环节国产短期追不上，但在混合键合、面板级封装、SiC 设备这些标准形成期，国产有更大的追赶窗口**——北方华创混合键合获批量订单是分水岭。

**4. 8 月 PMI 三升两降中，新订单指数 +2.1pct 重回扩张是最重要的信号。** 出厂价格指数 +2.6pct 结束 4 月连降。**判断：8 月 PPI 同比或升至 3.2-3.9%（财通/东方金诚/UBS 预测），CPI 升至 0.7-0.9%**——名义数据改善会缓解财政压力（税收+），减少 Q4 货币进一步宽松的紧迫性。但 8 月固投预计 -7% 仍拖累总需求，**9-10 月 PMI 才是验证"季末冲量"是否真实的窗口**。

**5. 上海暑运外籍旅客 +24% 是入境游强势的直接证据。** 上海机场 62 天 2528.1 万人次 +4.8%、外籍旅客 43.5 万人次 +24%。免签 + 新增 7 个国际航点（都柏林、第比利斯、克拉斯诺亚尔斯克）正在显效。**判断：Q4 入境游消费将成为观察"内循环 + 外循环"双轮启动的重要窗口**。
