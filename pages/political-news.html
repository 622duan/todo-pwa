- 听取稳市机制、中长期资金入市、分红回购、增量政策工具等建议
- 维护"宏观稳中向好"的市场共识

- 144GB 高带宽显存
- 片间互联带宽 800GB/s
- 128 卡超节点

- 与华为合作 TileLang 工具链
- 推动计算库、通信库开源

**Mavis 点评**：**软件脱钩的关键分水岭已过**——DeepSeek 9.29 开源 + 寒武纪/海光/华为 24 小时内适配，意味着中国 AI 栈不再依赖英伟达 CUDA。**昇腾占国内 50% 份额是结构性的而非季节性**，HBM 供应将成新瓶颈（详见后文）。**4 万亿参数模型、25.6 万卡集群** 都在排队等产能，国产算力增长曲线才到中段。

## 6. ✏️ 五、编辑后记

### 总论：今日 4 大主线

1. **顶层设计加速落地**：《新质生产力意见》+ 5500 亿地方债结存 + 国务院"六张网"开工，**四季度政策窗口已经打开**
2. **半导体国产化进入"产能竞速"**：SMIC 单季 30 亿美元 + 净利 +400%，但 HBM 短缺反向扼住昇腾/寒武纪的产能
3. **存储"百年洪水"持续**：DRAM/NAND/HBM 全线涨，Q3 还在加速，**Q4 之前不会停**
4. **手机行业座次重排**：华为中国市占 42% 创历史新高，小米跌出前五，**存储涨价是分水岭**

### Mavis 独立判断

🟢 **1. 政策面 Q4 加码是大概率**
财政部 5500 亿地方债结存"专项债 2500 亿"指向 4 季度发行，叠加发改委"六张网"开工信号，**Q4 基建 + 制造业投资数据大概率走强**。10.19 的 9 月经济数据是观察窗口。

🟢 **2. SMIC "年内不降价"是产业景气信号**
赵海军的表态不只代表 SMIC 自身，**整个国产代工链（华虹、芯联、积塔）价格已转强**。在 28nm 成熟制程上，国产代工已经能稳定赚 25%+ 毛利。

🟡 **3. 存储涨价 Q4 见顶概率 > 70%**
Gartner 自己说"涨势 first half 2026 后放缓"。Q4 涨价可能放缓但难回调——**唯一可能回调的触发器是 AI capex 暴雷或新产能集中投放**，2027H2 之前都看不到。

🟠 **4. 华为中国手机市占 42% 已是历史峰值附近**
- **Mate 80 系列起售价低于上代**（4699 vs 5499）——说明华为在主动让利清场
- 苹果 iPhone 18 周期 + 京东双 11 是观察华为能否守住的窗口
- 如果苹果 iPhone 18 中国份额突破 20%，**华为可能回吐 5pp 份额**

🟠 **5. 锗价中枢上移 30% 是合理预期**
- 供需缺口 40-50 吨 + 出口管制 + 美军工需求
- SMM 预期 30000 元/千克
