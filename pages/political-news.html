## 6. ✏️ 五、编辑后记

### 6.1 总论 · 今天的 4 大主线

**主线一：美联储重启加息，全球紧缩交易重启**
9.16-9.17 美联储加息 25bp 至 3.75-4%（2023.7 以来首次），点阵图年内或再加息一次。美元破 100、10 年美债 5.02%、黄金白银回调、A股 9.17 沪指跌 0.41% 至 3875 点。但中国央行「以我为主」，全年仍有结构性工具空间。

**主线二：国产 AI 算力三连击**
9.7 长鑫 LPDDR6 全球首发 → 9.9 京东 × 摩尔线程 10 万卡集群 → 9.17 华为昇腾 960 NPO 超节点（4096 卡规模）。国产 AI 栈从单芯片到集群到内存形成闭环。

**主线三：存储「AI 税」传导终端**
DRAM Q3 涨价 13-18%（成熟 DDR4 50%+），手机 BOM 存储占比从 10-15% 升至 30-40%，苹果 iPhone 18 起售涨 1000 元、华为 Mate 80/小米 17/荣耀 Magic 同步上调。**原厂库存 <10 天，2027 缺口或扩至 -13.6%**。

**主线四：长鑫登顶全球存储利润率榜首**
Q2 利润率 82%（超三星/SK海力士），上半年营收 +873.64%。但同时长鑫起诉美国国防部、起诉被列 1260H 清单，意味着国产存储正在「产能替代」基础上叠加「法律对抗」。

### 6.2 Mavis 独立判断（5 条）

1. **🟢 国产存储正在「定价权」阶段**：长鑫利润率 82% 全球第一不是偶然，是 AI 算力需求结构性短缺 + 国产 LPDDR6/DDR5 良率突破 + HBM 国产化启动的三重结果。下一步看长江 NAND 良率和 HBM 国产化节点。

2. **🟡 美联储加息对中国是「温和外溢」**：外资占 A 股流通盘仅 5%，中国央行政策独立，全年仍是「适度宽松」基调。A 股估值核心锚是国内盈利而非海外利差。

3. **🔴 碳酸锂下行 + 新能源车销量疲软**：9 月碳酸锂跌 24%、比亚迪新能源车销量同比 -5.5%（环比 +6.1%）。**真正的拐点在 10 月排产验证**——如果 Q4 旺季不及预期，电池/锂矿板块还有 20% 跌幅空间。

4. **🟠 半导体设备订单排到 2028 = 国产替代窗口期至少 2 年**：北方华创 850 亿、中微 80 周、拓荆 49 亿合同负债——但迈克尔·伯里 4740 万美元做空 SOXX 行权价 330，赌 2027.1 到期前回吐。要密切跟踪 HBM 长协松散、存储合约价连续两季度环比下跌、头部云厂商砍资本开支三个信号。

5. **🟢 AI 算力供给「中国一套、美国一套」格局成型**：H200 进口开小口子（字节/腾讯各 1 万块），但昇腾 960 + 摩尔线程 + 长鑫 LPDDR6 都在加速替代。中美 AI 算力供给正在形成「双轨制」，长期看中国 AI 应用的爆发力取决于国产算力交付节奏。

### 6.3 重点关注节点（未来 1-2 周）

- **9.22-9.24**：美联储多位官员讲话（沃什主席表态）
- **9.24**：国家统计局发布 9 月中旬流通领域重要生产资料价格

- **11.10**：稀土出口管制暂停到期日（中美博弈关键节点）

### 6.4 风险提示

- **存储价格高位回调**：苹果接受 2027 Q1 报价 +30-40% 已经透支未来，若 AI 资本开支放缓，DRAM/NAND 价格随时可能回调
- **美联储连续加息风险**：若中东局势推升油价 + 美国 CPI 再超预期，12 月可能再加息一次
- **国产替代节奏不及预期**：长鑫/长江存储扩产依赖设备交期，12-18 个月交期 + 海外零部件限制可能拖慢节奏
- **碳酸锂跌破 10 万元**：宁德排产下修 + 库存统计调整后，新能源车产业链利润压力加大
- **A 股流动性边际收紧**：美联储加息 + 北向资金外流可能压制成长板块估值
