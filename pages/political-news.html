## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**国务院常务会议（9月28日，李强主持）**：研究宏观政策发力提效、促进有效投资有关工作，听取新污染物治理进展情况汇报，审议通过《事业单位登记管理条例（草案）》。会议明确：

- 加大宏观政策逆周期调节力度，确保完成全年目标任务
- 加快各类债券发行使用进度，推动"十五五"规划、"六张网"实施方案明确的重大工程项目尽早开工
- 加力实施扩投资、促消费贴息政策
- 推出增量政策：优化财政支出、用好地方政府债务结存限额
- 综合运用并适时调整货币政策工具，**增加科技创新和技术改造、支农支小再贷款额度**
- 研究出台稳定房地产市场、促进就业增收政策措施
- 听取新污染物治理汇报，动态发布重点管控新污染物清单

[来源：人民日报 9/29](https://finance.sina.cn/2026-09-29/detail-initmuyi8006500.d.html) ｜ [来源：国家信息中心解读](http://www.macrochina.cn/news_speed/hgjj/20260929125482.shtml)

**央行"四箭齐发"（9月26日）**：调整完善若干货币政策工具
- 🟥 **PSL 利率下调 25 个基点**（首次延伸至算力网、新型电网、下一代通信网、城市地下管网、物流网、水网等"六张网"建设）
- 🟥 **科技创新和技术改造再贷款额度增加 2000 亿元**（从 1.2 万亿 → **1.4 万亿元**），支持比例从 60% 提高到 100%
- 🟥 **支农支小再贷款额度增加 5000 亿元**（其中民营企业再贷款额度增加 3000 亿元），整体额度从 4.35 万亿 → **4.85 万亿元**
- PSL 工具正式纳入"六张网"重大基建支持范围

[来源：9 月国务院重要政策汇编](https://m.voc.com.cn/xhn/news/202610/33901059.html)

**居民房贷贴息（10月1日起实施）**：财政部、人民银行、金融监管总局联合发布：
- 适用：首套房、面积 ≤120 平方米、价格 ≤150 万元的新发商业贷款
- 贴息：年化 1 个百分点，期限最长 5 年，单笔最高 100 万元贷款规模
- 国有六大行临时报名"免申即享"，每月还款时自动扣除

[来源：9 月国务院重要政策汇编](https://m.voc.com.cn/xhn/news/202610/33901059.html)

**国家发改委消费品以旧换新**：今年全年 **2500 亿元** 超长期特别国债支持资金已全部下达（第四批 625 亿元于 9 月底下达）。[来源：北京日报 9/10](https://www.toutiao.com/article/7683810004814316066/)

**Mavis 点评**：🟢 **国常会 9/28 + 央行 9/26"四箭齐发"形成年内最强政策组合**。PSL 重启指向基建、科创再贷款 1.4 万亿指向先进制造、房贷贴息指向需求侧；区别于 2024-2025 年的单一货币宽松，本轮是"财政+货币+需求"三轮同步发力。Q4 是政策落地见效的关键观察窗口，10 月 20-25 日 LPR、11 月初经济数据、12 月中央经济工作会议是三个验证点。

## 6. ✏️ 五、编辑后记

### 总论

今天日报呈现了 **"政策强发力 + 经济数据温和改善 + AI 存储芯片涨价潮 + 国产替代质变"** 的四主线格局。**9 月 28 日国常会 + 9 月 26 日央行"四箭齐发"（PSL 降 25BP + 科创再贷款扩容 2000 亿 + 支农支小扩容 5000 亿）** 是年内最强政策组合，叠加 **居民房贷贴息 10/1 落地 + 2500 亿消费品以旧换新资金全部下达**——Q4 政策窗口全面打开。经济数据方面，**8 月规模以上工业增加值 +5.2%、出口 +19.8%、PPI +3.8%、核心 CPI +1.0% 连续 5 个月扩大** 是年内最强组合，但 **9 月制造业 PMI 仅 49.8（+0.4PP）、财新 PMI 降至 49.3** 表明内生动能仍弱、政策 vs 内需分化明显。最具看点的两条主线：**(1) 存储超级周期：DDR4 现货溢价 44%、HBM4 2027 价 +121%、长鑫上半年日赚 3 亿、长江存储反向授权三星专利费**；**(2) 国产替代质变：北方华创在手订单 850 亿排到 2028、昇腾 950PR 单卡算力是 H20 的 2.87 倍、DeepSeek 全面迁移昇腾、日五大设备商对华销售 -12%、中国前道设备国产化率 5 年翻倍至 21%**。

### 独立判断

1. 🟢 **"国常会 + 央行"双重政策发力是 Q4 最重要变量**。PSL 降 25BP 指向"六张网"基建、科创再贷款 1.4 万亿指向先进制造、房贷贴息指向需求侧——区别于过去的单一货币宽松，本轮"财政+货币+需求"三轮同步。Q4 观察点：10/20-25 LPR、11 月初经济数据、12 月中央经济工作会议。

2. 🔴 **存储涨价潮的真正拐点是 2027 HBM 占晶圆产能升至 30%**——三星电子副主席金泰宇已确认。这意味着即使传统 DRAM 涨价结束，HBM 仍在挤压传统 DRAM 产能，**紧缺将持续到 2027 年部分高端品类到 2028 年**。这是 DDR4 现货溢价 44%、PC OEM 为 2027 提前备货的根本原因。

3. 🟢 **国产存储"两长一大"格局已形成产业护城河**。长鑫全球 DRAM 第四（7.7-8%）、长存 NAND 全球第三（13%）、大普微企业级 SSD 龙头——三家资本化路径（长鑫科创板 + 长存 IPO 辅导 + 大普微创业板）齐头并进。**长存反向授权三星混合键合专利费** 是中国芯片企业首次对国际巨头收专利费——这是产业地位质变信号。

4. 🟠 **国产 AI 芯片"昇腾 + DeepSeek"组合正在重构中国算力栈**。昇腾 950PR 单卡算力是 H20 的 2.87 倍、DeepSeek V4 从 CUDA 迁移到 CANN——这是中国 AI 算力栈摆脱英伟达依赖的标志性事件。但寒武纪副总裁 278 亿元股权激励诉讼、华为的供应链问题仍是风险点。

5. 🔴 **全球设备 + 零部件涨价潮是中国设备厂的"双刃剑"**。北方华创中报低于预期（零部件供应限制）、中微/拓荆合同负债创新高（订单饱满）——同时说明零部件紧缺压制短期交付，但锁定 2027-2028 业绩弹性。摩根士丹利：中国晶圆设备开支从 2026 年 456 亿 → 2028 年 686 亿（+50%）。

6. 🟡 **手机行业进入"结构性涨价 + 折叠屏三国杀 + 国产反攻"的三重叠加窗口**。9 月 1 日国内厂商统一涨价 500-1000 元是存储涨价首次大规模传导至终端——这标志着"廉价手机时代"在 Q4 终结。**9 月 7-9 日华为/小米/苹果折叠屏连发**，加上 **华为 Mate 90 10/1 罕见"发布即开售"**——Q4 高端机竞争白热化。
