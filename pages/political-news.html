## 2. 📊 一、宏观 PEST

### 2.1 🟢 政策面 P

**1. 中小企业"十五五"规划正式印发**（9.1 / 工信部联规函〔2026〕290 号）

工信部、国家发改委、科技部、财政部、人社部、商务部、央行、市场监管总局、金融监管总局、中国证监会十部门联合印发《促进中小企业发展"十五五"规划》，明确到 **2030 年专精特新"小巨人"达 2.2 万家、国家级产业集群达 600 个**，规上中小企业人均营收累计增 **15%**、研发费用年均增 **8% 以上**；数智化水平二级占比 **95%**、三级 **80%**。规划提出 **"国家中小企业发展基金二期"**，并建立优质中小企业上市培育库。
[来源：工信部](https://www.cnii.com.cn/qy/202609/t20260904_758311.html) · [来源：河北发改委](https://hbdrc.hebei.gov.cn/zxy/zxjj/zcfg/202609/t20260904_138948.html)

**2. 国务院国资委：央企带头及时支付中小企业账款**（9.14 吹风会预告）

国新办 14 日下午举行国务院政策例行吹风会，工信部副部长柯吉欣和央行、国资委、市场监管总局、证监会介绍中小企业回款难治理情况。国资委表示央企将"积极筹措资金、确保及时支付"，对中小企业现金支付作为一条"硬杠杠"坚持好。
[来源：同花顺财经](https://www.toutiao.com/article/7684909558510273087/)

**3. 商务部等 8 部门印发《促进智能家居消费行动方案》**（9.2 印发 / 9.14 公布）

文件提出 **7 条举措**：扩大优质供给、完善标准体系（制定智能家居互联互通强制性国标）、支持智能家居消费、**发展适老化**（家庭服务机器人、健康监测、智能照护）、畅通回收链条、优化社区便民、加大财政金融支持（用好消费贷财政贴息）。按 2026 年以旧换新政策部署，**支持地方自主确定智能家居补贴品类和标准**。
[来源：中国政府网](https://www.gov.cn/lianbo/202609/content_7081030.htm) · [来源：商务部](https://cif.mofcom.gov.cn/cif/html//ConsumerGoods//2026/9/1789373656265.html)

**4. 三部门印发《数字乡村高质量发展行动计划（2026—2030 年）》**

中央网信办、农业农村部、工信部联合发文，**探索高通量卫星、低轨卫星互联网**为农村/偏远地区提供多样化接入；推动 **5G / 千兆光网** 部署；拓展"低空经济+"农业应用、加快北斗系统在精准作业与灾害监测的深度应用。
[来源：腾讯新闻](https://news.qq.com/rain/a/20260912A0258600)

**5. 国务院常务会议（9.11）：推进算力网 + 老旧水库改造**

李强主持召开国常会，强调"坚持合理布局、规范有序，进一步完善算力基础设施，**构建多层次网络化算力体系**"；部署安全生产、老旧水库系统改造、教育强国推进；审议《基金会管理条例（修订草案）》。
[来源：央视新闻](https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&t=1789426474264&item_id=14900316024913496413&channelId=1119)

**6. 国家药监局批准发布第 3 个脑机接口医疗器械标准**

**全球首个采用 AI 技术处理脑电数据的脑机接口医疗器械产品标准**，将于 2027 年 9 月 1 日起实施。
[来源：央视新闻](https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&t=1789426474264&item_id=14900316024913496413&channelId=1119)

**7. 国家卫健委：今年新增 1000 家基层医疗机构提供儿科诊疗**

**年底 95% 以上乡镇卫生院、社区卫生服务中心可提供儿科诊疗服务**。
[来源：央视新闻](https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&t=1789426474264&item_id=14900316024913496413&channelId=1119)

**8. 国家发改委对成品油价格实施临时调控**（9.11）

受美伊冲突推升国际油价影响，原 9.11 汽柴油应上调 435 元/吨 / 420 元/吨，调控后实际上调 **260 元/吨 / 250 元/吨**；两轮累计涨幅（前期已各上调 375 / 360 元/吨）将向下游用户传导明显成本。
[来源：同花顺财经](https://www.toutiao.com/article/7684909558510273087/)

**Mavis 点评**：本周政策面"宽供给+反内卷+保中小企业回款"三线齐发：① 智能家居 8 部门消费方案是"以旧换新"扩品类到适老化、家装一体化的关键升级；② 中小企业"十五五"将"基金二期+上市培育库"明文化，标志耐心资本正式入场硬科技；③ 央国委"现金支付硬杠杠"是把"清理拖欠企业账款"做成可量化承诺。这三件事叠加 9.11 算力网国常会，构成 Q4 政策的稳增长地基。

### 2.2 🟠 经济面 E

**1. 🟥 8 月 CPI 同比 +0.8%、PPI 同比 +3.8%（9.9 公布）**

CPI 同比涨幅 **回升 0.3pct**，结束连续两月下行；环比由 -0.1% 转为 **+0.4%**；**核心 CPI 同比 +1.0%**。PPI 同比涨幅扩大至 **3.8%**（环比由 -0.7% 转为 +0.4%），连续 6 个月同比正增长。CPI 上行的关键支撑：① 能源价格同比涨幅由 0.6% 扩大至 **4.1%**（汽油 +9.3%）；② **算力需求**驱动移动电话机、平板、数据存储设备价格分别上涨 2.3%、2.1%、2.1%；③ 黄金饰品 +33.6%。PPI 上行来自原油/有色（石油开采 +10.4%）+ 电子电路制造 +3.5%、虚拟现实设备 +1.9%。
[来源：国家统计局](https://www.stats.gov.cn/sj/zxfbhjd/202609/t20260909_1965261.html) · [来源：统计局英文版](https://www.stats.gov.cn/english/PressRelease/202609/t20260910_1965274.html) · [来源：新华社](https://english.news.cn/20260909/896b96f603fc4b41b17e74897fd1748b/c.html)

**2. 8 月 PPI 分行业拆解**

煤炭开采和洗选业 **+26.6%**、有色金属冶炼 **+20.8%**、石油和天然气开采 **+10.5%**、计算机通信和其他电子设备制造 **+5.3%**、汽车制造 **-2.2%**、电力热力 **-3.6%**。8 大上行行业合计拉动 PPI 同比 +4.24pct。
[来源：国家统计局](https://www.stats.gov.cn/sj/zxfbhjd/202609/t20260909_1965261.html)

**3. 工业生产者购进价格 +5.8%**，有色金属材料及电线类 **+19.8%**，化工原料 **+9.5%**；近几个月购进涨幅持续高于出厂，提示上游成本对中下游的挤压。
[来源：国家统计局](https://www.stats.gov.cn/english/PressRelease/202609/t20260910_1965274.html)

**4. 7 月城镇调查失业率 5.2%（季节性上行）**

1-7 月均值 **5.2%**，与去年同期持平；7 月单月 5.2%（环比 +0.2pct），本地户籍 5.2%、外来户籍 5.2%、外来农业户籍 4.9%、31 大城市 5.2%；周均工作 48.2 小时。
[来源：华夏时报/国家统计局](https://www.toutiao.com/article/7674894246440124938)

**5. 上半年规上工业利润 +17.6%**（1-7 月累计）

**Mavis 点评**：8 月数据呈现"三涨两警示"：① CPI 同比温和回升 + 核心 CPI 守住 1% → 内需不弱；② PPI 持续 6 月正增长 + 购进涨幅高于出厂 → 上下游利润剪刀差扩大；③ **CPI 中的"算力设备"贡献首次被官方点名为涨价驱动** → 这是把 AI 需求正式纳入宏观统计的语言；④ 7 月失业率季节性 +0.2pct 到 5.2%，符合高校毕业季规律，但 16-24 岁青年段仍承压；⑤ 工业利润 1-7 月 +17.6%，电子/有色是新动能主战场。9.15 上午国家统计局将发布 8 月规上工业增加值、社零、固投、房地产开发等月度数据，是今天的"主菜"。

**5. 退役军人服务和保障"十五五"规划**：中办、国办、军办联合印发，推进高质量安置就业。

**Mavis 点评**：就业大盘稳但结构脆弱（青年失业率高、汽车等链条仍在收缩），政策从"撒钱式纾困"转向"账款清欠 + 适老化 + 退役军人安置"这类精准抓手。医保历年结余可买疫苗、把存量资金盘活，是医保局少有的"市场化"尝试。**今天统计局月度数据是检验 8 月失业率走向的关键点**。

### 2.4 🔴 技术面 T

## 6. ✏️ 五、编辑后记

### 总论

今天我们面前是 **"3 大主线 + 1 个隐藏矛盾"** 的格局：
1. **存储周期高位震荡**——2Q26 DRAM 营收 QoQ +59.5%、Q3 涨幅收敛至 13-18%，但 HBM 紧张延续到 2027；
2. **国产算力定价权跃迁**——昇腾 950DT 3 个月涨 60% 至 25 万元对标英伟达 B200，寒武纪 H1 净利翻倍 +108%；
3. **手机品牌"高端化 + 涨价潮"**——华为/苹果合计份额从 33% 升至 41%，吃掉小米/OPPO/vivo 的份额。
**隐藏矛盾**：上游涨价 + 下游需求疲软的剪刀差，能否被 AI 算力 + 新能源车的高增长对冲？9.15 上午 10:00 公布的 8 月规上工业、固投、社零、房地产开发数据将是这个矛盾的"检验窗口"。

### 5 条 Mavis 独立判断

1. **AI 芯片涨价的真瓶颈不在算力本身，而在 HBM**——华为、寒武纪、沐曦、天数都被 HBM 锁喉，国产 HBM 何时能放量（武汉新芯、长鑫等）是 Q4 算力链最大的 alpha 因子。

2. **中芯 + 华虹 Q3 指引继续创新高 = 国产代工 Q4 还有一波涨价**——8 寸成熟制程利用率 88-90% 已接近硬天花板；北方华创、中微、拓荆等设备厂的订单可见度延伸到 2027 Q1。

3. **手机品牌高端化是"涨价潮的最大受益者"**——华为 23% 份额创 2020Q4 以来新高、苹果单季 1240 万台创新高，本质是用"高 ASP + 自研芯片 + 国内供应链"对冲 BOM +70% 的成本压力；OPPO/vivo/小米如果不能完成同样转型，份额还会继续掉。

4. **中小企业"十五五"规划 + 国资委现金支付硬杠杠 = 中小企业流动性的双重改善**——既给市场（基金二期 + 上市培育库）又给回款（央企带头），是 H2 民营经济景气的政策底。

5. **特朗普政府考虑用《国防生产法》扩炼油产能 + 柴油破 6 美元 + 美联储 9 月加息概率 89%**——美国通胀结构性回归的概率上升，油价 / 利率 / 美元三重共振，对人民币资产估值构成阶段性压制；但中国 8 月 CPI/PPI 同步回升 + 核心 CPI 守住 1%，**给了国内货币政策"以我为主"的空间**。

### 重点关注节点（未来 1-2 周）

- **9.15（今日）10:00** —— 国家统计局 8 月规上工业、固投、社零、房地产开发月度数据
- **9.16** —— 东京国际焊接展 FANUC × Google AI 焊接 Agent 首秀

### 风险提示

1. **存储涨价传导失控** —— 如果 Q3 DRAM/NAND 涨幅突破 TrendForce 区间上限，PC/手机/汽车需求可能进一步收缩；
2. **H200/H100 出口许可反复** —— 美国商务部可能再次调整 NVIDIA/AMD 对华出口政策，影响国产 AI 芯片替代节奏；
3. **伊朗-沙特-胡塞武装冲突升级** —— 曼德海峡通行船只已从 30 艘/日骤降至 6 艘/日，油价 100+ 美元可能延续到 Q4；
4. **美联储 9 月加息"鹰派 surprise"** —— 16 家华尔街机构押注，但若声明偏鹰，10Y 美债收益率破 5% 可能引发新兴市场资本外流；
5. **哪吒汽车破产重整方案** —— 30 亿元入主方案需债权人会议通过，新能源车行业洗牌仍在继续。
